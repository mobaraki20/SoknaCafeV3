<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<style id="source-css"></style><style>
html,body{margin:0;background:#e7eaed;font-family:Tahoma,Arial,sans-serif}
body{padding:22px 0}
dialog{display:block;position:relative;margin:auto;padding:0;border:1px solid #c9d0d8;border-radius:16px;box-shadow:0 10px 30px #0002;background:white}
.sc-dialog-frame{display:flex;flex-direction:column;overflow:hidden}
.sc-dialog-frame__head{padding:14px;border-bottom:1px solid #ddd}
.sc-dialog-frame__body{min-height:0;flex:1;padding:12px;overflow:auto}
.sc-dialog-frame__foot{padding:12px;background:#fff;border-top:1px solid #ddd}
.sc-account-item-editor{display:grid;gap:10px}
.sc-button{padding:10px;border:1px solid #ddd;border-radius:10px}
.sc-order-stepper{display:flex;gap:2px;align-items:center}
.sc-order-stepper button{min-width:36px;min-height:38px;border:1px solid #ddd;background:#f3f4f5;border-radius:7px}
.sc-order-stepper output{min-width:32px;text-align:center}
</style></head><body><div id="root"><dialog open class="sc-account-item-edit-dialog" data-account-item-edit-dialog>
<div class="sc-dialog-frame"><header class="sc-dialog-frame__head"><h2 data-account-item-edit-title></h2></header>
<div class="sc-dialog-frame__body"><div class="sc-account-item-editor" data-account-item-edit-body></div></div>
<footer class="sc-dialog-frame__foot"><button class="sc-button">بستن</button><button class="sc-button" data-account-item-edit-save>ثبت تغییرات</button></footer></div>
</dialog></div>
<script>
const root=document.getElementById('root');
let accountEditingItemId=1,accountEditFeedback=null;
const accountAdjustmentDrafts=new Map([[1,4]]),accountServiceDistributionDrafts=new Map(),accountItemNoteDrafts=new Map(),accountAdjustmentNotes=new Map(),accountAdjustmentReasons=new Map();
const adjustmentReasons=[['customer','درخواست مشتری'],['mistake','اشتباه ثبت'],['other','سایر']];
const adjustmentReason=id=>accountAdjustmentReasons.get(id)||'customer';
const L={integer:n=>Number(n).toLocaleString('fa-IR')};
const human=x=>String(x||''),esc=x=>String(x).replace(/[&<>"']/g,'');
const money=x=>Number(x).toLocaleString('fa-IR')+' تومان';
const account={lines:[{order_item_id:1,order_id:23,item_id:222,name:'چای ساده - دو نفره',note:'کم‌رنگ و بدون نبات',unit_price:240000,quantity:4,fulfillment_mode:'dine_in',preparation_station:'hot_bar'}]};
const accountEditorGroup=id=>({anchor:account.lines[0],total:4,distribution:{dine_in:3,takeaway:1},note:account.lines[0].note});
const serviceDistributionEqual=(a,b)=>Number(a?.dine_in||0)===Number(b?.dine_in||0)&&Number(a?.takeaway||0)===Number(b?.takeaway||0);
function reconcileServiceDistribution(dist,total,preferred='dine_in'){
 const out={dine_in:Math.max(0,Number(dist?.dine_in||0)),takeaway:Math.max(0,Number(dist?.takeaway||0))},target=Math.max(0,Math.min(99,Number(total||0))),other=preferred==='takeaway'?'dine_in':'takeaway';let sum=out.dine_in+out.takeaway;
 if(sum<target)out[preferred]+=target-sum;else if(sum>target){let remove=sum-target,cut=Math.min(out[preferred],remove);out[preferred]-=cut;remove-=cut;if(remove>0)out[other]=Math.max(0,out[other]-remove)}return out;
}
function transferServiceDistribution(dist,total,mode,delta){const target=Math.max(0,Math.min(99,Number(total||0))),other=mode==='takeaway'?'dine_in':'takeaway',out=reconcileServiceDistribution(dist,target,mode);if(delta>0&&out[other]>0){out[mode]++;out[other]--}else if(delta<0&&out[mode]>0){out[mode]--;out[other]++}return out}
const LineUI={stepper:({value,min,max,label,minus,plus})=>`<div class="sc-order-stepper"><button type="button" data-modal-item-delta="-1">−</button><output>${Number(value).toLocaleString('fa-IR')}</output><button type="button" data-modal-item-delta="1">+</button></div>`};
function closeAccountItemEditor(){}
function renderAccountItemEditor(){
 const d=root.querySelector('[data-account-item-edit-dialog]'),body=d?.querySelector('[data-account-item-edit-body]'),title=d?.querySelector('[data-account-item-edit-title]'),save=d?.querySelector('[data-account-item-edit-save]');if(!d||!body)return;
 const id=Number(accountEditingItemId||0),group=accountEditorGroup(id);if(!group){closeAccountItemEditor();return}const line=group.anchor,actual=Number(group.total||0),draft=accountAdjustmentDrafts.has(id)?Number(accountAdjustmentDrafts.get(id)):actual,currentDist=group.distribution,preferredMode=String(line.fulfillment_mode||'dine_in')==='takeaway'?'takeaway':'dine_in',targetDist=accountServiceDistributionDrafts.has(id)?reconcileServiceDistribution(accountServiceDistributionDrafts.get(id),draft,preferredMode):reconcileServiceDistribution(currentDist,draft,preferredMode),currentNote=human(group.note),targetNote=accountItemNoteDrafts.has(id)?String(accountItemNoteDrafts.get(id)):currentNote,qtyChanged=draft!==actual,serviceChanged=!serviceDistributionEqual(targetDist,currentDist),noteChanged=targetNote.trim()!==currentNote.trim(),changed=qtyChanged||serviceChanged||noteChanged,reasonKey=adjustmentReason(id),reasonButtons=adjustmentReasons.map(([key,label])=>`<button type="button" class="sc-order-adjust-reason ${reasonKey===key?'is-selected':''}" data-modal-adjust-reason="${key}" aria-pressed="${reasonKey===key?'true':'false'}">${label}</button>`).join(''),reasonNote=human(accountAdjustmentNotes.get(id)||''),unitPrice=Number(line.unit_price||0),currentPrice=Number(line.current_price||0),priceChanged=Boolean(line.price_changed)&&Number.isFinite(currentPrice)&&currentPrice!==unitPrice,maxQuantity=priceChanged?actual:99,currentTotal=Math.max(0,unitPrice*actual),nextTotal=Math.max(0,unitPrice*draft),delta=nextTotal-currentTotal,impactTone=delta<0?'is-decrease':delta>0?'is-increase':'is-neutral',impactLabel=delta<0?`− ${money(Math.abs(delta))}`:delta>0?`+ ${money(delta)}`:'بدون تغییر مبلغ';
 if(title)title.textContent='ویرایش آیتم حساب';
 const serviceRow=(mode,label)=>`<div class="sc-account-service-split__row"><div><strong>${label}</strong><small>${mode==='dine_in'?'سرو داخل کافه':'بسته‌بندی بیرون‌بر'}</small></div>${LineUI.stepper({value:targetDist[mode],min:0,max:draft,label:`تعداد ${label}`,minus:{'data-modal-service-mode':mode,'data-modal-service-delta':'-1'},plus:{'data-modal-service-mode':mode,'data-modal-service-delta':'1'}})}</div>`;
 const priceLock=priceChanged?`<div class="sc-account-price-snapshot-lock" role="note"><div><strong>قیمت این آیتم تغییر کرده است.</strong><span><b>قیمت زمان ثبت</b> ${money(unitPrice)} · <b>قیمت فعلی</b> ${money(currentPrice)}</span><p>تعداد ثبت‌شده با قیمت زمان ثبت حفظ می‌شود. برای افزایش، مقدار تازه باید با قیمت فعلی به‌عنوان سفارش جدید اضافه شود.</p></div><button class="sc-button sc-button--secondary" type="button" data-price-add-order>افزودن سفارش با قیمت فعلی</button></div>`:'';
 const priorScrollTop=body.scrollTop;
 body.innerHTML=`<div class="sc-account-item-editor__summary"><div><strong>${esc(line.name)}</strong><small>${priceChanged?`قیمت زمان ثبت ${money(unitPrice)}`:`قیمت واحد ${money(unitPrice)}`}</small></div><span>${L.integer(actual)} عدد ثبت‌شده</span></div>${priceLock}<section class="sc-account-item-editor__section is-quick"><div class="sc-account-item-editor__section-head"><strong>تعداد</strong><small>${priceChanged?'افزایش این ردیف مجاز نیست':`${L.integer(actual)} ثبت‌شده`}</small></div>${LineUI.stepper({value:draft,min:0,max:maxQuantity,label:`تعداد ${line.name}`,minus:{'data-modal-item-delta':'-1'},plus:{'data-modal-item-delta':'1'}})}</section><div class="sc-account-item-impact ${impactTone}" aria-live="polite"><div><span>مبلغ فعلی این آیتم</span><strong>${money(currentTotal)}</strong></div><div><span>مبلغ پس از تغییر</span><strong>${money(nextTotal)}</strong></div><div class="is-delta"><span>اثر روی حساب</span><strong>${impactLabel}</strong></div></div>${draft===0?'<div class="sc-account-item-remove-warning" role="status"><strong>این آیتم از حساب حذف می‌شود.</strong><span>پس از ثبت، تعداد این آیتم صفر خواهد شد.</span></div>':''}${qtyChanged?`<section class="sc-account-item-editor__section is-reason"><div class="sc-account-item-editor__section-head"><strong>دلیل اصلاح تعداد</strong><small>${L.integer(actual)} ← ${L.integer(draft)}</small></div><div class="sc-order-adjust-reasons" role="group" aria-label="دلیل اصلاح">${reasonButtons}</div>${reasonKey==='other'?`<input class="sc-control sc-order-adjust-note" type="text" maxlength="160" value="${esc(reasonNote)}" data-modal-adjust-note placeholder="توضیح کوتاه دلیل (اختیاری)">`:''}</section>`:''}<section class="sc-account-item-editor__section is-service"><div class="sc-account-item-editor__section-head"><strong>نحوه سرو</strong><small>جمع: ${L.integer(draft)}</small></div><div class="sc-account-service-split" role="group" aria-label="تفکیک تعداد داخل کافه و بیرون‌بر">${serviceRow('dine_in','داخل کافه')}${serviceRow('takeaway','بیرون‌بر')}</div><p class="sc-account-service-split__hint">تعداد هر دو ردیف با هم برابر تعداد کل آیتم است.</p></section><details class="sc-account-item-editor__section sc-disclosure is-note" ${currentNote?'open':''}><summary>یادداشت آماده‌سازی${currentNote?' · دارد':''}</summary><div class="sc-account-item-editor__note"><input class="sc-control" type="text" maxlength="500" value="${esc(targetNote)}" data-modal-item-note placeholder="مثلاً بدون شکر"></div></details>`;
 body.scrollTop=priorScrollTop;
 if(save){save.disabled=!changed;save.textContent=draft===0?'حذف آیتم از حساب':'ثبت تغییرات';save.classList.toggle('sc-button--danger',draft===0)};
 body.querySelector('[data-price-add-order]')?.addEventListener('click',()=>{closeAccountItemEditor();openOrder(Number(selectedTableId||account?.table?.id||0),'account')});
 body.querySelectorAll('[data-modal-item-delta]').forEach(b=>b.addEventListener('click',()=>{const step=Number(b.dataset.modalItemDelta||0),current=accountAdjustmentDrafts.has(id)?Number(accountAdjustmentDrafts.get(id)):actual,next=Math.max(0,Math.min(maxQuantity,current+step)),dist=accountServiceDistributionDrafts.has(id)?accountServiceDistributionDrafts.get(id):currentDist;accountAdjustmentDrafts.set(id,next);accountServiceDistributionDrafts.set(id,reconcileServiceDistribution(dist,next,preferredMode));accountEditFeedback=null;renderAccountItemEditor()}));
 body.querySelectorAll('[data-modal-service-mode]').forEach(b=>b.addEventListener('click',()=>{const mode=String(b.dataset.modalServiceMode||'dine_in'),step=Number(b.dataset.modalServiceDelta||0),dist=accountServiceDistributionDrafts.has(id)?accountServiceDistributionDrafts.get(id):currentDist;accountServiceDistributionDrafts.set(id,transferServiceDistribution(dist,draft,mode,step));accountEditFeedback=null;renderAccountItemEditor()}));
 body.querySelector('[data-modal-item-note]')?.addEventListener('input',e=>{e.target.value=human(e.target.value);accountItemNoteDrafts.set(id,e.target.value);const latestDist=accountServiceDistributionDrafts.has(id)?reconcileServiceDistribution(accountServiceDistributionDrafts.get(id),Number(accountAdjustmentDrafts.get(id)??actual),preferredMode):currentDist;if(save)save.disabled=(Number(accountAdjustmentDrafts.get(id)??actual)===actual)&&serviceDistributionEqual(latestDist,currentDist)&&e.target.value.trim()===currentNote.trim()});
 body.querySelectorAll('[data-modal-adjust-reason]').forEach(b=>b.addEventListener('click',()=>{accountAdjustmentReasons.set(id,String(b.dataset.modalAdjustReason||'customer'));if(String(b.dataset.modalAdjustReason||'')!=='other')accountAdjustmentNotes.delete(id);renderAccountItemEditor()}));body.querySelector('[data-modal-adjust-note]')?.addEventListener('input',e=>{e.target.value=human(e.target.value);accountAdjustmentNotes.set(id,e.target.value)});
}

renderAccountItemEditor();
</script></body></html>
