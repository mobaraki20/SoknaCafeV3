name: SOKNA A21 actual process interruption media verification
on:
  push:
    branches: [qa/post-release-a10-20261128]
    paths: [.github/workflows/sokna-a21-last-gaps.yml]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
      SOKNA_QA_DISPOSABLE: YES
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact released A21 package candidates
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46122453416
          name: SOKNA-A21-EXACT-CANDIDATES-QA-NOT-INSTALL
          path: ${{ runner.temp }}/candidate
      - name: Verify four exact hashes and unpack accepted web archives
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cp148-qa/receipts"
          python3 - <<'PY'
          import os,pathlib,zipfile,hashlib
          t=pathlib.Path(os.environ['RUNNER_TEMP']);d=t/'candidate';w=t/'cp148-qa'
          files={'LOCAL-A21-UPDATE-CANDIDATE-QA-ONLY.zip':'a0763360131c6e948bd3bff2acdac41afa657a8a1eef336b3ed9de9537092202','LOCAL-A21-CLEAN-WEB-CANDIDATE-QA-ONLY.zip':'707e64815c039224af1a8be6a55f89932e482f004c15a6a46913b41bfad1fa10','PUBLIC-A21-UPDATE-CANDIDATE-QA-ONLY.zip':'7d7bd5b6943a5c860ca7fb7b750d1268540630f9fce27ccf5a559359674b61a2','PUBLIC-A21-CLEAN-CANDIDATE-QA-ONLY.zip':'641e70ebc45da13eaf538f93cdd7a50567b75109135b24b8fc7573b0349e5402'}
          for name,h in files.items():
              p=d/name;assert hashlib.sha256(p.read_bytes()).hexdigest()==h
              print('PASS exact accepted archive',name,h)
          for host,name in [('local','LOCAL-A21-CLEAN-WEB-CANDIDATE-QA-ONLY.zip'),('public','PUBLIC-A21-CLEAN-CANDIDATE-QA-ONLY.zip')]:
              with zipfile.ZipFile(d/name) as z:
                  assert z.testzip() is None and all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist());z.extractall(w/host)
          PY
      - name: Run real Local clean install and A10 grouped critical DB acceptance
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cp148-qa"
          export TMPDIR="$W"
          php qa/cp148/preflight.php
          php qa/cp160/fixture.php "$W/local" | tee "$W/fixture-results.txt"
          php qa/post-release-a10/essential-ui-seed.php "$W"
      - name: Actual interrupted media cleanup and focused modal layout
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cp148-qa"
          export TMPDIR="$W" QA_WORK="$W"
          php qa/post-release-a10/media-crash.php "$W" | tee "$W/media-results.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-A21-MEDIA-INTERRUPTION-EVIDENCE
          path: |
            ${{ runner.temp }}/cp148-qa/*-results.txt
            ${{ runner.temp }}/cp148-qa/*-http.log
            ${{ runner.temp }}/cp148-qa/screenshots/*.png
            ${{ runner.temp }}/cp148-qa/receipts/*
          retention-days: 7
          if-no-files-found: warn
