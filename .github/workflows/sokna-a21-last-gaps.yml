name: SOKNA A21 Windows CLI business recovery independent root
on:
  push:
    branches: [qa/post-release-a10-20261128]
    paths: [.github/workflows/sokna-a21-last-gaps.yml]
permissions:
  contents: read
  actions: read
jobs:
  native-recovery:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOKNA_R186_CI_ONLY: 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-A21-EXACT-CANDIDATES-QA-NOT-INSTALL
          run-id: 46122453416
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cp76/out
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-PREREQUISITES-105-QA-CANDIDATE-NOT-INSTALL
          run-id: 45707538026
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/helper
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-APACHE-2471-CANDIDATE-QA-ONLY
          run-id: 45707401488
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apache
      - name: Actual Windows CLI reconciliation with all application writers stopped
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $receipt=Get-Content "$env:RUNNER_TEMP/cp76/out/factory-build-receipt.json" -Raw|ConvertFrom-Json
          $pkg='LOCAL-A21-CLEAN-WEB-CANDIDATE-QA-ONLY.zip'
          $sha='707e64815c039224af1a8be6a55f89932e482f004c15a6a46913b41bfad1fa10'
          $version='3.0.0-g6.2-workspace.231gl-a21-postrelease-20261128'
          if($receipt.local.web_sha256 -cne $sha -or $receipt.production_authorized -ne $false -or $receipt.delivery_authorized -ne $false){throw 'INVALID_CANDIDATE_RECEIPT'}
          if((Get-FileHash "$env:RUNNER_TEMP/cp76/out/$pkg" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sha){throw 'CANDIDATE_ARCHIVE_DRIFT'}
          $s=Get-Content 'qa/factory/checkpoint78-standard-clean-web.ps1' -Raw
          $s=$s.Replace('LOCAL-231GG-CLEAN-WEB-QA-DO-NOT-INSTALL.zip',$pkg).Replace('2c14b241a3cddf5f1d436144691555b11a97ccc31b4d08b2ea8f8d92f04e3aa6',$sha).Replace('3.0.0-g6.2-workspace.231gg-checkpoint76-qa',$version)
          $inject=@'
          Stop-Service SoknaApache -ErrorAction Stop
          Need ((Get-Service SoknaApache).Status -eq 'Stopped') 'APPLICATION_WRITER_NOT_STOPPED'
          foreach($n in @('SoknaRuntime','SoknaPrintAgent')){ $svc=Get-Service $n -ErrorAction SilentlyContinue; Need ($null -eq $svc -or $svc.Status -eq 'Stopped') 'OTHER_WRITER_ACTIVE' }
          New-Item -ItemType Directory -Path (Join-Path $lab "isolated-targets") | Out-Null
          foreach($mode in @('rolledback','committed')){ $target=Join-Path $lab "isolated-targets/target-$mode";New-Item -ItemType Directory -Path $target | Out-Null;Expand-Archive $pack (Join-Path $target 'Web') }
          Run (Join-Path $phpRoot 'php.exe') @((Join-Path $env:GITHUB_WORKSPACE 'qa/post-release-a10/windows-recovery.php'),$lab)
          '@
          $marker=' $receipt=@{status='
          if(!$s.Contains($marker)){throw 'NATIVE_SCRIPT_MARKER'}
          $s=$s.Replace($marker,($inject + [Environment]::NewLine + $marker))
          $p=Join-Path $env:RUNNER_TEMP 'native-recovery-a21.ps1'
          Set-Content $p $s -Encoding utf8NoBOM
          & $p
          if($LASTEXITCODE -ne 0){throw 'NATIVE_RECOVERY_FAILED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-A21-WINDOWS-CLI-RECOVERY-EVIDENCE
          path: ${{ runner.temp }}/a21-windows-recovery-receipt.json
          if-no-files-found: warn
          retention-days: 30
