name: SOKNA A21 final essential offline recovery media and modal
on:
  push:
    branches: [qa/post-release-a10-20261128]
    paths: [.github/workflows/sokna-a21-last-gaps.yml]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
      SOKNA_QA_DISPOSABLE: YES
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact released A21 package candidates
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46122453416
          name: SOKNA-A21-EXACT-CANDIDATES-QA-NOT-INSTALL
          path: ${{ runner.temp }}/candidate
      - name: Verify four exact hashes and unpack accepted web archives
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cp148-qa/receipts"
          python3 - <<'PY'
          import os,pathlib,zipfile,hashlib
          t=pathlib.Path(os.environ['RUNNER_TEMP']);d=t/'candidate';w=t/'cp148-qa'
          files={'LOCAL-A21-UPDATE-CANDIDATE-QA-ONLY.zip':'a0763360131c6e948bd3bff2acdac41afa657a8a1eef336b3ed9de9537092202','LOCAL-A21-CLEAN-WEB-CANDIDATE-QA-ONLY.zip':'707e64815c039224af1a8be6a55f89932e482f004c15a6a46913b41bfad1fa10','PUBLIC-A21-UPDATE-CANDIDATE-QA-ONLY.zip':'7d7bd5b6943a5c860ca7fb7b750d1268540630f9fce27ccf5a559359674b61a2','PUBLIC-A21-CLEAN-CANDIDATE-QA-ONLY.zip':'641e70ebc45da13eaf538f93cdd7a50567b75109135b24b8fc7573b0349e5402'}
          for name,h in files.items():
              p=d/name;assert hashlib.sha256(p.read_bytes()).hexdigest()==h
              print('PASS exact accepted archive',name,h)
          for host,name in [('local','LOCAL-A21-CLEAN-WEB-CANDIDATE-QA-ONLY.zip'),('public','PUBLIC-A21-CLEAN-CANDIDATE-QA-ONLY.zip')]:
              with zipfile.ZipFile(d/name) as z:
                  assert z.testzip() is None and all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist());z.extractall(w/host)
          PY
      - name: Run real Local clean install and A10 grouped critical DB acceptance
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cp148-qa"
          export TMPDIR="$W"
          php qa/cp148/preflight.php
          php qa/cp160/fixture.php "$W/local" | tee "$W/fixture-results.txt"
          php qa/post-release-a10/essential-ui-seed.php "$W"
      - name: Actual interrupted media cleanup and focused modal layout
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cp148-qa"
          export TMPDIR="$W" QA_WORK="$W"
          set +e
          php qa/post-release-a10/media-crash.php "$W" | tee "$W/media-results.txt"
          mstatus=${PIPESTATUS[0]}
          set -e
          PHP_CLI_SERVER_WORKERS=6 php -S 127.0.0.1:18765 -t "$W/local/public" >"$W/local-http.log" 2>&1 & lp=$!
          trap 'kill "$lp" 2>/dev/null || true' EXIT
          sleep 2
          npm install --prefix "$W/pw" playwright@1.56.1 --ignore-scripts --no-audit --no-fund
          set +e
          node qa/post-release-a10/modal-geometry.cjs | tee "$W/ui-results.txt"
          ustatus=${PIPESTATUS[0]}
          echo "MEDIA=$mstatus UI=$ustatus"
          test "$mstatus" = 0 && test "$ustatus" = 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-A21-LAST-GAPS-LINUX-EVIDENCE
          path: |
            ${{ runner.temp }}/cp148-qa/*-results.txt
            ${{ runner.temp }}/cp148-qa/*-http.log
            ${{ runner.temp }}/cp148-qa/screenshots/*.png
            ${{ runner.temp }}/cp148-qa/receipts/*
          retention-days: 7
          if-no-files-found: warn
  native-recovery:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOKNA_R186_CI_ONLY: 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-A21-EXACT-CANDIDATES-QA-NOT-INSTALL
          run-id: 46122453416
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cp76/out
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-PREREQUISITES-105-QA-CANDIDATE-NOT-INSTALL
          run-id: 45707538026
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/helper
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-APACHE-2471-CANDIDATE-QA-ONLY
          run-id: 45707401488
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apache
      - name: Actual Windows CLI reconciliation with all application writers stopped
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $receipt=Get-Content "$env:RUNNER_TEMP/cp76/out/factory-build-receipt.json" -Raw|ConvertFrom-Json
          $pkg='LOCAL-A21-CLEAN-WEB-CANDIDATE-QA-ONLY.zip'
          $sha='707e64815c039224af1a8be6a55f89932e482f004c15a6a46913b41bfad1fa10'
          $version='3.0.0-g6.2-workspace.231gl-a21-postrelease-20261128'
          if($receipt.local.web_sha256 -cne $sha -or $receipt.production_authorized -ne $false -or $receipt.delivery_authorized -ne $false){throw 'INVALID_CANDIDATE_RECEIPT'}
          if((Get-FileHash "$env:RUNNER_TEMP/cp76/out/$pkg" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sha){throw 'CANDIDATE_ARCHIVE_DRIFT'}
          $s=Get-Content 'qa/factory/checkpoint78-standard-clean-web.ps1' -Raw
          $s=$s.Replace('LOCAL-231GG-CLEAN-WEB-QA-DO-NOT-INSTALL.zip',$pkg).Replace('2c14b241a3cddf5f1d436144691555b11a97ccc31b4d08b2ea8f8d92f04e3aa6',$sha).Replace('3.0.0-g6.2-workspace.231gg-checkpoint76-qa',$version)
          $inject=@'
          Stop-Service SoknaApache -ErrorAction Stop
          Need ((Get-Service SoknaApache).Status -eq 'Stopped') 'APPLICATION_WRITER_NOT_STOPPED'
          foreach($n in @('SoknaRuntime','SoknaPrintAgent')){ $svc=Get-Service $n -ErrorAction SilentlyContinue; Need ($null -eq $svc -or $svc.Status -eq 'Stopped') 'OTHER_WRITER_ACTIVE' }
          foreach($mode in @('rolledback','committed')){ $target=Join-Path $lab "target-$mode";New-Item -ItemType Directory -Path $target | Out-Null;Expand-Archive $pack (Join-Path $target 'Web') }
          Run (Join-Path $phpRoot 'php.exe') @((Join-Path $env:GITHUB_WORKSPACE 'qa/post-release-a10/windows-recovery.php'),$lab)
          '@
          $marker=' $receipt=@{status='
          if(!$s.Contains($marker)){throw 'NATIVE_SCRIPT_MARKER'}
          $s=$s.Replace($marker,($inject + [Environment]::NewLine + $marker))
          $p=Join-Path $env:RUNNER_TEMP 'native-recovery-a21.ps1'
          Set-Content $p $s -Encoding utf8NoBOM
          & $p
          if($LASTEXITCODE -ne 0){throw 'NATIVE_RECOVERY_FAILED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-A21-WINDOWS-CLI-RECOVERY-EVIDENCE
          path: ${{ runner.temp }}/a21-windows-recovery-receipt.json
          if-no-files-found: warn
          retention-days: 30
