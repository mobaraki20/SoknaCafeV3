          const {chromium}=require(process.env.RUNNER_TEMP+'/pw/node_modules/playwright');const fs=require('fs'),path=require('path'),assert=require('assert/strict');const base='http://127.0.0.1:18765';const shots=path.join(process.env.RUNNER_TEMP,'cp124-screenshots');fs.mkdirSync(shots,{recursive:true});const failures=[];
          function ck(v,k){assert.ok(v,k);console.log('PASS '+k)}
          async function group(name,fn){try{await fn();console.log('GROUP PASS '+name)}catch(e){failures.push(name);console.log('GROUP FAIL '+name+' '+e.message)}}
          (async()=>{const browser=await chromium.launch({channel:'chrome',headless:true});try{const ctx=await browser.newContext({viewport:{width:1440,height:900},locale:'fa-IR'});const page=await ctx.newPage();page.setDefaultTimeout(10000);page.on('pageerror',e=>console.log('PAGE_ERROR '+e.message));const shot=async n=>{await page.screenshot({path:path.join(shots,n+'.png'),fullPage:true})};const get=async (url,root)=>{await page.goto(base+url);await page.locator(root).waitFor({state:'visible'});await page.waitForFunction(s=>document.querySelector(s)?.getAttribute('aria-busy')!=='true',root)};
          await page.goto(base+'/login.php');const account=page.locator('[data-login-account][data-username="qa-target"]');if(await account.isVisible())await account.click();else ck(await account.evaluate(e=>e.classList.contains('is-selected')),'selected_qa_account');await page.locator('input[name=password]').fill('synthetic-qa-admin-not-real');await Promise.all([page.waitForNavigation(),page.locator('form[data-login-form] button[type=submit]').click()]);
          await group('reports-ui',async()=>{await get('/reports/','[data-reports]');const exp=page.locator('[data-export-current]');await page.waitForFunction(()=>document.querySelector('[data-export-current]')?.getAttribute('aria-disabled')==='false');await shot('07-reports-loaded');const from=page.locator('[data-report-form] [name=from]');const old=await from.inputValue();const changed=new Date(old+'T12:00:00Z');changed.setUTCDate(changed.getUTCDate()-1);await page.locator('[data-report-form] [name=from] + .sc-jalali-control .sc-jalali-trigger').click();const dlg=page.locator('dialog.sc-jalali-picker[open]');const day=Number(await dlg.locator('[data-jalali-day][aria-selected=true]').getAttribute('data-jalali-day'));if(day>1)await dlg.locator('[data-jalali-day="'+(day-1)+'"]').click();else{await dlg.locator('[data-jalali-prev]').click();await dlg.locator('[data-jalali-day]').last().click();}ck(await from.inputValue()===changed.toISOString().slice(0,10),'REP_L273_real_calendar_changed');ck(await exp.getAttribute('aria-disabled')==='true','REP_L273_export_disabled_on_edit');ck(await page.locator('[data-report-section]:visible').count()===0,'REP_L273_old_report_hidden');await shot('08-reports-pending');await page.locator('[data-report-form] button[type=submit]').click();await page.waitForFunction(()=>document.querySelector('[data-export-current]')?.getAttribute('aria-disabled')==='false');ck(await exp.getAttribute('href').then(s=>s.includes('from='+changed.toISOString().slice(0,10))),'REP_L273_export_new_range');});
          if(failures.length)throw new Error('Failed browser groups: '+failures.join(','));console.log('CP124 REPORTS RECHECK PASS');}finally{await browser.close()}})().catch(e=>{console.error(e);process.exitCode=1});
