name: CP118 targeted real MariaDB gate (QA only)
on:
  push:
    branches: [qa/cp118-phase01-db-20261126]
    paths: ['.github/workflows/cp118-phase01-db.yml']
permissions:
  contents: read
  actions: read
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
    steps:
      - name: Reconstruct pinned Local source and test fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" 'https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15091670781/zip' -o cp98.zip
          echo '52de21900dedc43f9de7a4f68f2270fc6956a2ef3b0d337474442a3221d96d2c  cp98.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,hashlib,io,pathlib,zlib,base64
          H=lambda b:hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile('cp98.zip') as z:
              hits=[n for n in z.namelist() if not n.endswith('/') and H(z.read(n))=='a179c2b339ba07eaecc847f5821c8af2441c972de5e1fd3aa2af1e07f02adb5f']
              assert len(hits)==1, 'pinned local package not found'
              package=z.read(hits[0])
          with zipfile.ZipFile(io.BytesIO(package)) as z: raw=z.read('artifacts/local/web.zip')
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              assert z.testzip() is None and len(z.namelist())==624
              assert all(not n.startswith('/') and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
