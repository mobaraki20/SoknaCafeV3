      - name: Run real database component cases (synthetic schemas only)
        run: |
          set -euo pipefail
          php -v
          php -r 'if(!in_array("mysql",PDO::getAvailableDrivers(),true)||!extension_loaded("sodium"))exit(1);'
          cd "$RUNNER_TEMP"
          php test-db.php "$RUNNER_TEMP/local"
