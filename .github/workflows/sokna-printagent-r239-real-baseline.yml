name: SOKNA R239 acquire exact historical 6.2.11 print baseline
on:
  push:
    branches: [qa/sokna-printagent-universal-installer-20261115]
    paths: [.github/workflows/sokna-printagent-r239-real-baseline.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download original official Windows Services 1.1.27 for extraction only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'sokna-r239-baseline'
          New-Item -ItemType Directory -Path $dir -Force|Out-Null
          gh release download 'windows-services-v1.1.27-print-stop-rc.1' --repo 'mobaraki20/SoknaCafeV3' -p 'SOKNA-Windows-Services-Setup-1.1.27.exe' -p 'artifact-index.json' -p 'SHA256SUMS.txt' --dir $dir
          if($LASTEXITCODE -ne 0){throw 'REFERENCE_1127_DOWNLOAD_FAILED'}
          Get-Content (Join-Path $dir 'artifact-index.json') | Write-Host
          $sha=Get-Content (Join-Path $dir 'SHA256SUMS.txt') -Raw
          $exe=Join-Path $dir 'SOKNA-Windows-Services-Setup-1.1.27.exe'
          $actual=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if(!$sha.Contains($actual)){throw 'REFERENCE_1127_SHA_MISMATCH'}
          "R239_REF_DIR=$dir" | Out-File $env:GITHUB_ENV -Append
      - name: Obtain pinned updated Inno unpacker
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:R239_REF_DIR 'innounp'
          New-Item -ItemType Directory -Path $dir -Force|Out-Null
          gh release download ui_2_2_13 --repo jrathlev/InnoUnpacker-Windows-GUI -p innounp-2.zip --dir $dir
          if($LASTEXITCODE -ne 0){throw 'PINNED_INNO_UNPACKER_DOWNLOAD_FAILED'}
          $z=Join-Path $dir 'innounp-2.zip'
          if((Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'f8e45c9676bebc7d7570108ab572673b541fcf7a7d3d24a04319ac6b5315b4e8'){throw 'PINNED_INNOUNP_ZIP_SHA_MISMATCH'}
          Expand-Archive $z -DestinationPath (Join-Path $dir 'bin')
          $binary=@(Get-ChildItem -LiteralPath (Join-Path $dir 'bin') -Recurse -Filter '*innounp*.exe' -File | Select-Object -First 1)
          if($binary.Count -ne 1){throw 'PINNED_INNOUNP_EXE_MISSING'}
          "R239_INNOUNP=$($binary[0].FullName)" | Out-File $env:GITHUB_ENV -Append
          Write-Host ('UNPACKER_FILE='+$binary[0].Name)
      - name: Extract exact 6.2.11 from official signed installer without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $env:R239_REF_DIR 'extracted-install-1127'
          New-Item -ItemType Directory -Path $output -Force|Out-Null
          $exe=Join-Path $env:R239_REF_DIR 'SOKNA-Windows-Services-Setup-1.1.27.exe'
          # .NET single-file bootstrap embeds the real Inno core as a raw managed resource.
          # Scan only valid PE headers, never run the bootstrap. innounp validates setup data.
          $script=Join-Path $env:R239_REF_DIR 'carve-inner-setup.py'
          @'
import sys,struct,mmap,os
outer, dest = sys.argv[1:]
with open(outer,'rb') as f:
    mm=mmap.mmap(f.fileno(),0,access=mmap.ACCESS_READ)
    valid=[]; i=512*1024
    while True:
        i=mm.find(b'MZ',i)
        if i<0: break
        if i+0x40<len(mm):
            off=struct.unpack_from('<I',mm,i+0x3c)[0]
            if off<0x2000 and i+off+0x80<len(mm) and mm[i+off:i+off+4]==b'PE\x00\x00':
                valid.append(i)
        i+=2
    print('R239_VALID_EMBEDDED_PE_OFFSETS',valid[-50:], 'outer_size',len(mm))
    if len(valid)<2:sys.exit(5)
    # The assembly resource is very large; nearest PE to the end is likely Inno core.
    start=valid[-1]
    if len(mm)-start<60*1024*1024:sys.exit(6)
    with open(dest,'wb') as out:out.write(mm[start:])
    print('R239_CARVED_CORE',start,len(mm)-start)
'@ | Set-Content -LiteralPath $script -Encoding UTF8
          $core=Join-Path $env:R239_REF_DIR 'carved-core-inno.exe'
          python $script $exe $core
          if($LASTEXITCODE -ne 0){throw 'R239_NO_VALID_EMBEDDED_INNO_CORE'}
          & $env:R239_INNOUNP '-x' ('-d'+$output) $core
          if($LASTEXITCODE -ne 0){throw ('REFERENCE_INNO_UNPACK_FAILED_'+$LASTEXITCODE)}
          $files=@(Get-ChildItem $output -Recurse -File)
          Write-Host ('EXTRACTED_FILE_COUNT='+$files.Count)
          foreach($v in ($files|Where-Object{$_.Name -match 'print|agent|bundle|shell|\.zip$'}|Select-Object -First 80)){Write-Host ('FOUND '+$v.FullName+' BYTES='+$v.Length)}
          $inner=@($files|Where-Object{$_.Name -eq 'SoknaPrintAgent-6.2.11-win-x64.zip'})
          if($inner.Count -eq 1){
            $raw=Join-Path $env:R239_REF_DIR 'old-component-exact'
            Expand-Archive $inner[0].FullName -DestinationPath $raw
            $output=$raw
            $files=@(Get-ChildItem $output -Recurse -File)
          }
          $service=@($files|Where-Object Name -eq 'Sokna.PrintAgent.Service.exe'|Where-Object{(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -eq '9f4559d2d15188863212c1cf1c8ea786ed8aa0e2cf5bcee08f40738344dd29b5'})
          $worker=@($files|Where-Object Name -eq 'Sokna.PrintAgent.Worker.exe'|Where-Object{(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -eq '6538ce93eec690e21f0901e08c3031d14059781493306870f13b952406249284'})
          if($service.Count -ne 1 -or $worker.Count -ne 1){throw ('R239_CAFE_REAL_BINARY_NOT_PROVEN_SERVICE='+$service.Count+'_WORKER='+$worker.Count)}
          $root=Join-Path $env:R239_REF_DIR 'cafe-exact'
          New-Item -ItemType Directory -Path (Join-Path $root 'Service'),(Join-Path $root 'Worker') -Force|Out-Null
          Copy-Item -Path (Join-Path (Split-Path $service[0].FullName -Parent) '*') -Destination (Join-Path $root 'Service') -Recurse -Force
          Copy-Item -Path (Join-Path (Split-Path $worker[0].FullName -Parent) '*') -Destination (Join-Path $root 'Worker') -Recurse -Force
          $man=@($files|Where-Object Name -eq 'component-manifest.json'|Where-Object{(Get-Content $_.FullName -Raw) -match '"version"\s*:\s*"6\.2\.11"'})
          if($man.Count -lt 1){throw 'CAFE_REAL_MANIFEST_MISSING'}
          Copy-Item $man[0].FullName (Join-Path $root 'component-manifest.json')
          $zip=Join-Path $env:R239_REF_DIR 'SoknaPrintAgent-6.2.11-CAFE-MATCHED-REFERENCE.zip'
          Compress-Archive -Path (Join-Path $root '*') -DestinationPath $zip -Force
          "R239_REF_ZIP=$zip" | Out-File $env:GITHUB_ENV -Append
          Write-Host 'PASS_R239_REAL_CAFE_6211_ACTUAL_BYTES_EXTRACTED_FROM_RELEASE'
      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-R239-PRINTAGENT-6211-CAFE-SHA-VERIFIED-REFERENCE
          path: ${{ env.R239_REF_ZIP }}
          if-no-files-found: error
          retention-days: 30
