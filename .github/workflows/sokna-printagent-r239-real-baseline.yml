name: SOKNA R239 acquire exact historical 6.2.11 print baseline
on:
  push:
    branches: [qa/sokna-printagent-universal-installer-20261115]
    paths: [.github/workflows/sokna-printagent-r239-real-baseline.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download original official Windows Services 1.1.27 for extraction only
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'sokna-r239-baseline'
          New-Item -ItemType Directory -Path $dir -Force|Out-Null
          gh release download 'windows-services-v1.1.27-print-stop-rc.1' --repo 'mobaraki20/SoknaCafeV3' -p 'SOKNA-Windows-Services-Setup-1.1.27.exe' -p 'artifact-index.json' -p 'SHA256SUMS.txt' --dir $dir
          if($LASTEXITCODE -ne 0){throw 'REFERENCE_1127_DOWNLOAD_FAILED'}
          Get-Content (Join-Path $dir 'artifact-index.json') | Write-Host
          $sha=Get-Content (Join-Path $dir 'SHA256SUMS.txt') -Raw
          $exe=Join-Path $dir 'SOKNA-Windows-Services-Setup-1.1.27.exe'
          $actual=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if(!$sha.Contains($actual)){throw 'REFERENCE_1127_SHA_MISMATCH'}
          "R239_REF_DIR=$dir" | Out-File $env:GITHUB_ENV -Append
      - name: Checkout exact public 6.2.11 source commit for reference build
        uses: actions/checkout@v4
        with:
          ref: c5c8076cd7eebd95297787d1c9945d95a780556f
          path: reference-source
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build archived 6.2.11 source and require cafe-identical historical binaries
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'reference-source'
          $output=Join-Path $env:R239_REF_DIR 'reference-output'
          & (Join-Path $source 'windows/print-agent/build-component-package.ps1') -RepoRoot $source -OutputDir $output
          if(!$? -or $LASTEXITCODE -ne 0){throw 'REFERENCE_6211_BUILD_FAILED'}
          $zip=Join-Path $output 'SoknaPrintAgent-6.2.11-win-x64.zip'
          if(!(Test-Path $zip)){throw 'REFERENCE_6211_BUNDLE_MISSING'}
          $info=Get-Content (Join-Path $env:R239_REF_DIR 'artifact-index.json') -Raw | ConvertFrom-Json
          $expected=[string]$info.print_agent.sha256
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ('R239_REFERENCE_BUNDLE_SHA='+$actual+' PUBLISHED_SHA='+$expected)
          if($actual -ne $expected){Write-Warning 'Historical ZIP byte reproducibility differs (Zip metadata or dotnet SDK may differ). Checking PE bytes.'}
          $extract=Join-Path $env:R239_REF_DIR 'reference-extract'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract
          $svc=(Get-FileHash (Join-Path $extract 'Service/Sokna.PrintAgent.Service.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $wrk=(Get-FileHash (Join-Path $extract 'Worker/Sokna.PrintAgent.Worker.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ('REFERENCE_SERVICE='+$svc)
          Write-Host ('REFERENCE_WORKER='+$wrk)
          $cafeSvc='9f4559d2d15188863212c1cf1c8ea786ed8aa0e2cf5bcee08f40738344dd29b5'
          $cafeWrk='6538ce93eec690e21f0901e08c3031d14059781493306870f13b952406249284'
          if($svc -ne $cafeSvc -or $wrk -ne $cafeWrk){throw 'HISTORICAL_6211_CAFE_REAL_PE_BYTES_DIFFER_BUILD_NOT_ACCEPTED'}
          $refFile=Join-Path $env:R239_REF_DIR 'SoknaPrintAgent-6.2.11-CAFE-MATCHED-REFERENCE.zip'
          Copy-Item $zip $refFile
          "R239_REF_ZIP=$refFile" | Out-File $env:GITHUB_ENV -Append
          Write-Host 'PASS_R239_CAFE_6211_REAL_SERVICE_WORKER_FROM_HISTORICAL_SOURCE'
      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-R239-PRINTAGENT-6211-CAFE-SHA-VERIFIED-REFERENCE
          path: ${{ env.R239_REF_ZIP }}
          if-no-files-found: error
          retention-days: 30
