name: SOKNA A21 actual print preferences after exact native update
on:
  push:
    branches: [qa/post-release-a10-20261128]
    paths: [.github/workflows/sokna-a21-print-preference.yml]
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {origin: GK, fault: none, ledger: '93', run: '46067310389', artifact: SOKNA-LOCAL-231GK-CAFE-CONTROLLED-OPERATOR-DELIVERY, file: SOKNA-LOCAL-231GK-CAFE-CONTROLLED-UPDATE.zip}
    env:
      SOKNA_R186_CI_ONLY: 'YES'
      SOKNA_BASE_LEDGER: ${{ matrix.ledger }}
      SOKNA_ORIGIN: ${{ matrix.origin }}
      SOKNA_FAULT: ${{ matrix.fault }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0316cf3485467241315c2638dcff47fec3f129d
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f38c20083068e540d593876a2c527c51e0157f92
          path: native-src
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.5'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-PREREQUISITES-105-QA-CANDIDATE-NOT-INSTALL
          run-id: 45707538026
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/helper
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-APACHE-2471-CANDIDATE-QA-ONLY
          run-id: 45707401488
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apache
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-A21-EXACT-CANDIDATES-QA-NOT-INSTALL
          run-id: 46122453416
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/delivery
      - name: Exact final controlled archive via standard native panel on actual 231fw synthetic origin
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=Get-ChildItem "$env:RUNNER_TEMP/baseline" -Recurse -File -Filter '${{ matrix.file }}'|Select-Object -First 1
          if(!$base){throw 'BASELINE_MISSING'}
          $env:SOKNA_BASELINE_ZIP=$base.FullName
          $target=Join-Path $env:RUNNER_TEMP 'delivery/LOCAL-A21-UPDATE-CANDIDATE-QA-ONLY.zip'
          $r=Get-Content "$env:RUNNER_TEMP/delivery/factory-build-receipt.json" -Raw|ConvertFrom-Json
          if($r.status -ne 'PENDING_EXACT_FINAL_GATE' -or $r.delivery_authorized -ne $false -or (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() -cne $r.local.sha256){throw 'CANDIDATE_DRIFT'}
          $env:SOKNA_CURRENT_QA_ZIP=$target
          $env:SOKNA_MATRIX_TARGET_ZIP=$target
          $env:SOKNA_A21_WEB_SHA=[string]$r.local.web_sha256
          @'
          from pathlib import Path
          import os
          p=Path('qa/factory/prepare_checkpoint84_native.py')
          s=p.read_text(encoding='utf-8')
          s=s.replace('LOCAL-231GG-CONTROLLED-HOME-CANARY.zip','LOCAL-A21-UPDATE-CANDIDATE-QA-ONLY.zip').replace('CONTROLLED_HOME_CANARY_FIELD_ACCEPTANCE_PENDING','CONTROLLED_CAFE_OPERATOR_FIELD_ACCEPTANCE_PENDING').replace('CONTROLLED_HOME_CANARY_ONLY_NOT_CAFE_PRODUCTION_APPROVAL','CONTROLLED_CAFE_OPERATOR_ONLY_FIELD_ACCEPTANCE_PENDING').replace('CONTROLLED_HOME_EXACT_OUTER_QA_ONLY','A21_EXACT_OUTER_QA_ONLY')
          s=s.replace('origin=os.environ["SOKNA_ORIGIN"]',"origins['GK']=('79ea97f6be0577c9c724865f0fe271cff8dbb3bf078f12825fa91c6b091a5b45','b8019526c9fcbbe65bc5cf564769e62ca9175b956dfaee8cade6097f60309b52')\norigin=os.environ[\"SOKNA_ORIGIN\"]")
          s=s.replace("{t for _,t in origins.values()}","{origins[k][1] for k in ('R307','GK')}").replace('2c14b241a3cddf5f1d436144691555b11a97ccc31b4d08b2ea8f8d92f04e3aa6',os.environ['SOKNA_A21_WEB_SHA']).replace("assert fault=='none'","assert fault in ('none','APACHE_STOPPED','POINTER_SWITCHED')").replace("@('GE','GF')","@('GE','GF','GK')")
          p.with_name('prepare_a21_native.py').write_text(s,encoding='utf-8')
          '@ | Set-Content "$env:RUNNER_TEMP/prepare-a21.py" -Encoding utf8NoBOM
          python "$env:RUNNER_TEMP/prepare-a21.py"
          python qa/factory/prepare_a21_native.py
          if($LASTEXITCODE -ne 0){throw 'BRIDGE_PREPARATION_FAILED'}
          # Add only QA observations to the historically passed native runner.
          @'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'native-matrix.ps1'
          s=p.read_text(encoding='utf-8')
          before=r""" $q="INSERT INTO sokna_r186_exact.settings(setting_key,setting_value) VALUES ('printing.quick.auto_preparation','0'),('printing.quick.auto_direct','1') ON DUPLICATE KEY UPDATE setting_value=VALUES(setting_value);"
           & $mysql --no-defaults --protocol=tcp --host=127.0.0.1 "--port=$dbPort" --user=root "--execute=$q"
           Need ($LASTEXITCODE-eq0) 'PRINT_PREFERENCE_SEED_FAILED'
           $q="SELECT CONCAT(setting_key,'=',setting_value) FROM sokna_r186_exact.settings WHERE setting_key IN ('printing.quick.auto_preparation','printing.quick.auto_direct') ORDER BY setting_key"
           $prefsBefore=@(& $mysql --no-defaults --protocol=tcp --host=127.0.0.1 "--port=$dbPort" --user=root --skip-column-names "--execute=$q")
           Need ($LASTEXITCODE-eq0 -and ($prefsBefore -join '|')-ceq'printing.quick.auto_direct=1|printing.quick.auto_preparation=0') 'PRINT_PREFERENCE_BASELINE_WRONG'
           """
          after=r""" $q="SELECT CONCAT(setting_key,'=',setting_value) FROM sokna_r186_exact.settings WHERE setting_key IN ('printing.quick.auto_preparation','printing.quick.auto_direct') ORDER BY setting_key"
           $prefsAfter=@(& $mysql --no-defaults --protocol=tcp --host=127.0.0.1 "--port=$dbPort" --user=root --skip-column-names "--execute=$q")
           Need ($LASTEXITCODE-eq0 -and ($prefsAfter -join '|')-ceq($prefsBefore -join '|')) 'PRINT_PREFERENCE_CHANGED'
           @{status='PASS';candidate_sha256=(Get-FileHash $pack -Algorithm SHA256).Hash.ToLowerInvariant();origin='GK';before=$prefsBefore;after=$prefsAfter;actual_windows=$true;actual_mariadb=$true;actual_field_host=$false;physical_print_tested=$false}|ConvertTo-Json -Depth 4|Set-Content (Join-Path $env:RUNNER_TEMP 'print-preference-receipt.json') -Encoding utf8NoBOM
           Write-Output 'PASS A21 manual/automatic print preferences preserved across exact native update'
           """
          marker=' $dump=Join-Path'
          marker2=" @{status='PASS';origin="
          assert s.count(marker)==1 and s.count(marker2)==1
          s=s.replace(marker,before+'\n'+marker,1).replace(marker2,after+'\n'+marker2,1)
          p.write_text(s,encoding='utf-8')
          '@ | Set-Content "$env:RUNNER_TEMP/observe-print-preference.py" -Encoding utf8NoBOM
          python "$env:RUNNER_TEMP/observe-print-preference.py"
          if($LASTEXITCODE -ne 0){throw 'QA_OBSERVER_FAILED'}
          Copy-Item qa/checkpoint61/BridgeHarness.cs native-src/qa/sokna-r186/R186Harness.cs -Force
          Push-Location native-src
          try {
            & (Join-Path $env:RUNNER_TEMP 'native-matrix.ps1')
            if($LASTEXITCODE -ne 0){throw 'BRIDGE_TEST_FAILED'}
          }finally{Pop-Location}
      - name: Verify exact native receipt, including interrupted recovery
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r=Get-Content "$env:RUNNER_TEMP/delivery/factory-build-receipt.json" -Raw|ConvertFrom-Json
          $x=Get-Content "$env:RUNNER_TEMP/matrix-receipt.json" -Raw|ConvertFrom-Json
          $actual=(Get-FileHash "$env:RUNNER_TEMP/delivery/LOCAL-A21-UPDATE-CANDIDATE-QA-ONLY.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $baseline=if($env:SOKNA_ORIGIN -eq 'GK'){$r.local.baselines[1].local}else{$r.local.baselines[0].local}
          $forward=$env:SOKNA_FAULT -ne 'APACHE_STOPPED'
          $phase=if($forward){'COMMITTED'}else{'RECOVERED_TO_PREVIOUS_SLOT'}
          if($x.status -ne 'PASS' -or $x.candidate_sha256 -cne $actual -or $actual -cne $r.local.sha256 -or $x.phase -ne $phase -or $x.origin -ne $env:SOKNA_ORIGIN -or $x.origin_tree_sha256 -cne $baseline.managed_tree_sha256 -or $x.target_tree_sha256 -cne $r.local.target.managed_tree_sha256 -or $x.migrations -ne 93 -or !$x.independent_restore -or !$x.panel_activation_tested -or $x.actual_field_host){throw 'DELIVERY_GATE'}
          Write-Output "PASS EXACT NATIVE A21 $env:SOKNA_ORIGIN $env:SOKNA_FAULT $actual"
      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-A21-PRINT-PREFERENCE-AFTER-UPDATE-RECEIPT
          path: |
            ${{ runner.temp }}/matrix-receipt.json
            ${{ runner.temp }}/print-preference-receipt.json
          retention-days: 7
          if-no-files-found: error
