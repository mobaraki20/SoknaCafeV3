name: SOKNA R239 exact 231fa native Windows + payload replay QA - NO DEPLOY
on:
  push:
    branches: [qa/sokna-r239-authority-recovery-mariadb-20261115]
    paths:
      - 'r239/replay/**'
      - '.github/workflows/sokna-r239-native-windows-qualification.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-byte-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: R201-EXACT-WINDOWS-QUALIFIED-NO-CAFE-AUTO-DEPLOY
          run-id: 43491934082
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r201
      - name: Replay exact 593-file source from pinned 231fa parent
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(find '${{ runner.temp }}/r201' -type f -name 'SOKNA-R201-LOCAL-231FA-60BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip' -print -quit)
          test -f "$BASE"
          python3 r239/replay/build_ci_candidate.py --base "$BASE" --parts r239/replay/patch-*.txt --out '${{ runner.temp }}/r239'
          echo '1dab7e39905a48179eeb19f9dbd88bc51a02af098eaf780a93168e3a4d34b2e1  '${{ runner.temp }}'/r239/R239-QA-BYTE-IDENTICAL.zip' | sha256sum -c -
          python3 packaging/windows/release-gates/check_local_release_set.py '${{ runner.temp }}/r239/R239-QA-BYTE-IDENTICAL.zip'
          echo 'PASS_R239_EXACT_R201_593_FILES_NO_INSTALL'
      - uses: actions/upload-artifact@v4
        with:
          name: R239-EXACT-BYTE-IDENTITY-PROOF-ONLY
          path: ${{ runner.temp }}/r239/R239-PROOF.json
          if-no-files-found: error
          retention-days: 14

  native-windows-from-231fa:
    needs: exact-byte-replay
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      SOKNA_R186_CI_ONLY: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-LOCAL-UNIVERSAL-44BASE-FINAL-ZIP-CONTRACT-QA-NOT-INSTALL
          run-id: 42896959119
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r153-parent
      - uses: actions/download-artifact@v4
        with:
          name: r177-real-windows-candidate-and-stage-passed
          run-id: 43266950479
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r177-parent
      - uses: actions/download-artifact@v4
        with:
          name: R201-EXACT-WINDOWS-QUALIFIED-NO-CAFE-AUTO-DEPLOY
          run-id: 43491934082
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r201-parent
      - name: Replay exact source and construct disposable runner-only stage candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base = (Get-ChildItem '${{ runner.temp }}/r201-parent' -Recurse -Filter 'SOKNA-R201-LOCAL-231FA-60BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip' | Select-Object -First 1).FullName
          if(-not $base){throw 'PINNED_R201_MISSING'}
          python r239/replay/build_ci_candidate.py --base "$base" --parts r239/replay/patch-*.txt --out '${{ runner.temp }}/r239-stage'
          if($LASTEXITCODE -ne 0){throw 'SOURCE_REPLAY_FAILED'}
          $qa='${{ runner.temp }}/r239-stage/R239-QA-BYTE-IDENTICAL.zip'
          if((Get-FileHash $qa -Algorithm SHA256).Hash.ToLowerInvariant() -ne '1dab7e39905a48179eeb19f9dbd88bc51a02af098eaf780a93168e3a4d34b2e1'){throw 'SOURCE_REPLAY_SHA_FAILED'}
          python packaging/windows/release-gates/check_local_release_set.py "$qa"
          if($LASTEXITCODE -ne 0){throw 'QA_RELEASE_SET_CHECK_FAILED'}
          # Only this disposable CI machine sees the ephemeral stage contract.
          # It is never uploaded or delivered as a release.
          python packaging/windows/release-gates/check_local_release_set.py --require-installable '${{ runner.temp }}/r239-stage/EPHEMERAL-WINDOWS-R239-STAGE.zip'
          if($LASTEXITCODE -ne 0){throw 'CI_STAGE_CONTRACT_REJECTED'}
      - name: Windows native Maintenance preflight-stage-activate-HTTP-readback from exact 231fa
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:R186_R153_DIR='${{ runner.temp }}/r153-parent'
          $env:R201_R177_DIR='${{ runner.temp }}/r177-parent'
          $env:R201_TARGET_DIR='${{ runner.temp }}/r201-parent'
          $env:R204_TARGET_DIR='${{ runner.temp }}/r239-stage'
          $src=Get-Content 'qa/sokna-r204/windows_r204_from_actual_231fa.ps1' -Raw
          $from='SOKNA-R204-LOCAL-231FB-61BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip'
          $to='EPHEMERAL-WINDOWS-R239-STAGE.zip'
          if(-not $src.Contains($from)){throw 'ORIGINAL_R204_HARNESS_UNAVAILABLE'}
          $src=$src.Replace($from,$to)
          $src=$src.Replace('279d64dcf3800a764c3fcf751a0fc800857de501943af32428c87cc8db2539a3',(Get-Content '${{ runner.temp }}/r239-stage/CI-SHA256.txt' -Raw).Trim())
          $src=$src.Replace('3.0.0-g6.2-workspace.231fb-r204-ux-zero-empty-canary','3.0.0-g6.2-workspace.231fd-r239-authority-recovery-qa')
          $runnerScript='${{ runner.temp }}/r239-internal-native-test.ps1'
          Set-Content $runnerScript $src -Encoding utf8NoBOM
          & $runnerScript
          if($LASTEXITCODE -ne 0){throw 'R239_NATIVE_WINDOWS_HARNESS_REJECTED'}
          Write-Host 'PASS_R239_NATIVE_WINDOWS_EXACT_CAFE_231FA_STAGE_ACTIVATE_READBACK'
      - name: Scope assertion (no export of stage package)
        shell: pwsh
        run: |
          Write-Host 'No Windows package, credentials, DB snapshots, signing keys or ephemeral candidate are uploaded.'
          Write-Host 'This is disposable CI qualification, NOT publication or acceptance on the installed cafe.'