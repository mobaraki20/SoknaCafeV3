name: SOKNA factory checkpoint76 exact rebuilt clean and database QA
on:
  push:
    branches: [qa/checkpoint55-exact-windows-20261126]
    paths: ['.github/workflows/sokna-factory-checkpoint76.yml']
permissions:
  contents: read
  actions: read
jobs:
  clean:
    strategy:
      fail-fast: false
      matrix:
        mariadb: ['10.6','11.4']
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: sokna-disposable-public-clean-ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Reconstruct exact four new factory outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15069153300/zip" -o "$RUNNER_TEMP/base.zip"
          echo '57589151165e5d73c0b0339623e3ee3b2db9ea7c54ffbac69246c9ff3532da2f  '"$RUNNER_TEMP/base.zip" | sha256sum -c -
          python qa/checkpoint76/reconstruct.py "$RUNNER_TEMP/cp76" "$RUNNER_TEMP/base.zip" qa/checkpoint76/transfer.b64
          mkdir -p "$RUNNER_TEMP/delivery"
          cp "$RUNNER_TEMP/cp76/out/factory-evidence-decision.json" "$RUNNER_TEMP/delivery/"
      - name: Exact factory bytes and isolated Apache PHP
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -un)" -g "$(id -gn)" -m 0755 /var/www/sokna-public-clean-canary
          python3 - <<'PY'
          import pathlib,os,zipfile,json,hashlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])/'cp76/out'
          work=pathlib.Path('/var/www/sokna-public-clean-canary')
          f=r/'PUBLIC-35IU-CLEAN-WEB-QA-DO-NOT-INSTALL.zip'
          rec=json.loads((r/'factory-evidence-decision.json').read_text())
          H=lambda b:hashlib.sha256(b).hexdigest()
          assert H(f.read_bytes())==rec['files'][f.name]['sha256']
          with zipfile.ZipFile(f) as z:
              assert z.testzip() is None
              for role,sub in [('root',''),('sub','public/menu')]:
                  dest=work/role/'webroot'/sub
                  dest.mkdir(parents=True)
                  z.extractall(dest)
          (work/'contract.json').write_text(json.dumps({'clean_sha256':H(f.read_bytes()),'target':rec['public']['version'],'protected':rec['public']['protected_pins']}))
          lf=r/'LOCAL-231GG-CLEAN-WEB-QA-DO-NOT-INSTALL.zip'
          assert H(lf.read_bytes())==rec['files'][lf.name]['sha256']
          with zipfile.ZipFile(lf) as z:
              assert z.testzip() is None
              z.extractall(pathlib.Path(os.environ['RUNNER_TEMP'])/'local-fixture/web')
          PY
          sudo apt-get update -qq
          sudo apt-get install -y apache2 libapache2-mod-php8.3 php8.3-cli php8.3-mysql php8.3-zip php8.3-mbstring php8.3-curl
          sudo a2enmod rewrite headers php8.3
          sudo chown -R www-data:www-data /var/www/sokna-public-clean-canary
          for row in '18080 root' '18081 sub'; do
            read -r port name <<< "$row"
            doc="/var/www/sokna-public-clean-canary/$name/webroot"
            printf 'Listen 127.0.0.1:%s\n<VirtualHost 127.0.0.1:%s>\nDocumentRoot %s\n<Directory %s>\nOptions FollowSymLinks\nAllowOverride All\nRequire local\n</Directory>\n</VirtualHost>\n' "$port" "$port" "$doc" "$doc" | sudo tee "/etc/apache2/conf-enabled/sokna-ci-$name.conf" >/dev/null
          done
          sudo apache2ctl configtest
          sudo service apache2 restart
      - name: Local exact clean database and migration idempotency
        env:
          SOKNA_CI_DB_PASS: sokna-disposable-public-clean-ci
        run: |
          set -euo pipefail
          mysql --protocol=TCP -h127.0.0.1 -uroot -p"$SOKNA_CI_DB_PASS" -e 'CREATE DATABASE sokna_ci_local76 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          php8.3 qa/sokna-final-20261124/test_mariadb_exact_setup.php "$RUNNER_TEMP/local-fixture/web" sokna_ci_local76 setup 0093_bundle_distribution_provenance | tee "$RUNNER_TEMP/delivery/local-db.json"
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1]));assert x["migration_count"]==93 and x["result"]=="PASS" and "231gg" in x["source_version"]' "$RUNNER_TEMP/delivery/local-db.json"
      - name: Real HTTP fresh setup and pairing on exact 35iu root and nested host
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/delivery"
          python3 - <<'PY'
          import urllib.request,urllib.error,http.cookiejar,json,pathlib,hashlib,os
          work=pathlib.Path('/var/www/sokna-public-clean-canary');c=json.loads((work/'contract.json').read_text());rows=[]
          for port,name,base in [(18080,'root',''),(18081,'sub','/public/menu')]:
              origin=f'http://127.0.0.1:{port}{base}'
              web=work/name/'webroot'/base.lstrip('/')
              op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
              def get(path):
                  with op.open(origin+path,timeout=20) as r:return r.status,r.read(),r.headers
              def post(action,body,want=200):
                  req=urllib.request.Request(origin+'/setup/api.php?action='+action,json.dumps(body).encode(),{'Content-Type':'application/json'})
                  try:
                      with op.open(req,timeout=45) as r:code=r.status; data=json.load(r)
                  except urllib.error.HTTPError as e:code=e.code;data=json.load(e)
                  assert code==want,(name,action,code,data.get('code'))
                  return data
              code,_,hdr=get('/__sokna_route_probe__');assert code==204 and hdr.get('X-Sokna-Route-Probe')=='ok'
              code,html,_=get('/setup/index.php');assert code==200 and b'<!doctype html>' in html.lower()
              _,raw,_=get('/setup/api.php?action=status');j=json.loads(raw);assert j['success'] and not j['setup']['installed'] and j['setup']['base_path']==base and j['preflight']['ok']
              body={'csrf':j['csrf'],'db':{'host':'127.0.0.1','port':'3306','name':'sokna_ci_'+name,'user':'root','pass':'sokna-disposable-public-clean-ci'},'create_database':True,'routing_probe_ok':True,'owner_password':'disposable-owner-CI-only-20261126','emergency_password':'disposable-emergency-CI-only-20261126','storage_dir':'storage'}
              installed=post('install',body);assert installed['success'] and installed['installed'] and installed['owner_initialized'] and not installed['paired']
              _,raw,_=get('/setup/api.php?action=status');s=json.loads(raw);assert s['setup']['installed'] and s['setup']['state']=='ready_to_pair'
              assert post('install',body,409)['code']=='already_installed'
              pair=post('pair',{'pairing_code':installed['pairing_code'],'installation_id':'sokna-ci-'+name,'shared_secret':'disposable-CI-pair-secret-only-0123456789','display_name':'QA only'})
              assert pair['success'] and pair['paired']
              _,raw,_=get('/health');h=json.loads(raw)
              assert h['ok'] and h['database']=='ready' and h['applied_migrations']==h['catalog_migrations']==12 and h['pending_migrations']==0 and h['emergency_ready'] and h['version']==c['target'],(name,h)
              assert all(hashlib.sha256((web/n).read_bytes()).hexdigest()==sha for n,sha in c['protected'].items())
              # Pairing alone deliberately does not publish a guest menu.
              try:
                  get('/menu')
                  raise AssertionError('Unpublished menu unexpectedly available')
              except urllib.error.HTTPError as e:
                  assert e.code==503 and 'منوی عمومی هنوز منتشر نشده' in e.read().decode('utf-8'),(name,e.code)
              # Exercise the real signed Local publish API with synthetic data only.
              import time,hmac,secrets
              snapshot={'format':'sokna-guest-snapshot-v1','cafe_name':'SOKNA-QA-CANARY','categories':[{'id':1,'name':'QA Category'}],'items':[{'id':1,'category_id':1,'name':'SOKNA-QA-ITEM','price':1000,'available':True}]}
              envelope={'format':'sokna-guest-snapshot-v1','snapshot':snapshot,'media_manifest':[]}
              digest=hashlib.sha256(json.dumps(envelope,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
              payload={'snapshot':snapshot,'media_manifest':[],'content_hash':digest,'revision_id':'guest-'+digest[:32],'generated_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'authority_epoch':1}
              raw=json.dumps(payload,separators=(',',':'),ensure_ascii=False).encode()
              route='/api/v1/local/guest/publish';ts=str(int(time.time()));nonce=secrets.token_hex(16)
              signing='\n'.join(['sokna-relay-v1','POST',route,ts,nonce,hashlib.sha256(raw).hexdigest()])
              sig=hmac.new(b'disposable-CI-pair-secret-only-0123456789',signing.encode(),hashlib.sha256).hexdigest()
              req=urllib.request.Request(origin+route,raw,{'Content-Type':'application/json','X-Sokna-Installation':'sokna-ci-'+name,'X-Sokna-Timestamp':ts,'X-Sokna-Nonce':nonce,'X-Sokna-Signature':sig})
              try:
                  with op.open(req,timeout=30) as response:
                      p=json.load(response);assert response.status==200 and p['ok'] is True,(name,p)
              except urllib.error.HTTPError as e:
                  raise AssertionError((name,'signed publish',e.code,e.read().decode('utf-8')[:500]))
              code,html,_=get('/menu');assert code==200 and b'SOKNA-QA-ITEM' in html,(name,code)
              rows.append({'layout':base or '/','setup':True,'pairing':True,'duplicate_install_rejected':True,'db_migrations':12,'unpublished_menu_http_503':True,'signed_publish':True,'menu_http_200':True,'emergency_ready':True,'protected_files_unchanged':6})
              print('PASS actual Apache setup pairing and menu',name,base or '/')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          src=p/'cp76/out/PUBLIC-35IU-CLEAN-WEB-QA-DO-NOT-INSTALL.zip'
          b=src.read_bytes();assert hashlib.sha256(b).hexdigest()==c['clean_sha256']
          (p/'delivery/public-clean-receipt.json').write_text(json.dumps({'status':'PASS_HTTP_QA_ONLY_NOT_INSTALL','sha256':c['clean_sha256'],'version':c['target'],'layouts':rows,'old_host_update_authorized':False,'production_cafe_authorized':False,'actual_home_install_verified':False,'requires_empty_separate_path_and_db':True},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-CHECKPOINT76-EXACT-MARIADB-${{ matrix.mariadb }}-RECEIPT-QA-ONLY
          path: ${{ runner.temp }}/delivery/*
          if-no-files-found: error
          retention-days: 30
