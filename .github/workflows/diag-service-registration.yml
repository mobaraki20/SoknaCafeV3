name: Diagnose Windows Service Registration
on:
  push:
    branches:
      - diag/service-registration-1.0.4

jobs:
  reproduce-and-fix:
    runs-on: windows-latest
    steps:
      - name: Validate New-Service registration with SOKNA path shape
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $InstallRoot='C:\Program Files\SOKNA Windows Services'
          $DataRoot='D:\SOKNA\Data'
          $runtimeExe=Join-Path $InstallRoot 'Runtime\SoknaRuntimeService.exe'
          $runtimeConfig=Join-Path $DataRoot 'runtime\runtime-config.json'
          function Quote([string]$v){if($v -notmatch '[\s"]'){return $v};return '"'+($v -replace '(\\*)"','$1$1\\"' -replace '(\\+)$','$1$1')+'"'}
          function Runtime-Command([string]$exe,[string]$config){return ((@($exe,'--config',$config)|ForEach-Object{Quote $_}) -join ' ')}
          $runtimeCmd=Runtime-Command $runtimeExe $runtimeConfig
          Write-Host "runtimeCmd=[$runtimeCmd]"
          $name='SoknaDiag'
          $old=Get-Service -Name $name -ErrorAction SilentlyContinue
          if($old){ & "$env:SystemRoot\System32\sc.exe" delete $name | Out-Null; $old.Dispose(); Start-Sleep -Seconds 1 }
          New-Service -Name $name -BinaryPathName $runtimeCmd -DisplayName 'SOKNA Diagnostic Runtime' -StartupType Manual | Out-Null
          $svc=Get-Service -Name $name -ErrorAction Stop
          $img=[string](Get-ItemProperty -LiteralPath "HKLM:\SYSTEM\CurrentControlSet\Services\$name").ImagePath
          Write-Host "IMAGE_PATH=[$img]"
          if($img -cne $runtimeCmd){ throw "ImagePath mismatch. expected=[$runtimeCmd] actual=[$img]" }
          $out=& "$env:SystemRoot\System32\sc.exe" config $name start= delayed-auto 2>&1
          $code=$LASTEXITCODE
          $out | ForEach-Object { Write-Host "SC_CONFIG_OUTPUT=$_" }
          if($code -ne 0){ throw "delayed-auto config failed: $code" }
          & "$env:SystemRoot\System32\sc.exe" qc $name
          $svc.Dispose()
          & "$env:SystemRoot\System32\sc.exe" delete $name | Out-Null
