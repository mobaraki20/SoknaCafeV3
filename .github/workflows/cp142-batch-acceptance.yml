        QAEOF
    - name: Build shared disposable MariaDB fixture
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        php local-db.php "$RUNNER_TEMP/local"
        php public-db.php "$RUNNER_TEMP/public"
    - name: Install browser driver
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/pw"
        npm install --prefix "$RUNNER_TEMP/pw" playwright@1.58.2 --no-audit --no-fund
    - name: Grouped independent real HTTP acceptance
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        PHP_CLI_SERVER_WORKERS=6 php -S 127.0.0.1:18765 -t "$RUNNER_TEMP/local/public" > cp142-local.log 2>&1 &
        local_pid=$!
        PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:18766 -t "$RUNNER_TEMP/public" "$RUNNER_TEMP/public/index.php" > cp142-public.log 2>&1 &
        public_pid=$!
        worker_pid=''
        trap 'kill "$local_pid" "$public_pid" ${worker_pid:-} 2>/dev/null || true; tail -30 cp142-local.log; tail -30 cp142-public.log; tail -40 cp142-worker.log 2>/dev/null || true' EXIT
        sleep 2
        set +e
        php worker.php "$RUNNER_TEMP/local" init
        init_rc=$?
        set -e
        if [ "$init_rc" -eq 0 ]; then php worker.php "$RUNNER_TEMP/local" > cp142-worker.log 2>&1 & worker_pid=$!; else echo 'SIGNED INIT FAILED; independent Local tests will still run'; fi
        sleep 2
        node browser.cjs | tee cp142-browser-results.txt
    - name: Capture synthetic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: SOKNA-CP142-GROUPED-QA
        path: |-
          ${{ runner.temp }}/cp142-screenshots/
          ${{ runner.temp }}/cp142-browser-results.txt
        retention-days: 1
        if-no-files-found: warn
