         if($kind==='partial'){$a=$settle->account($sid);$args=['session_id'=>$sid,'expected_session_id'=>$sid,'expected_remaining_total'=>$a['remaining_total'],'expected_signature'=>$a['signature'],'mode'=>'itemized','destination'=>'direct','selection'=>[['order_item_id'=>$lid,'quantity'=>1]],'request_id'=>'qa139-itemized-payment','print_receipt'=>false];$review=$settle->review($args,$actor);$args['tenders']=[['type'=>'cash','amount'=>$review['total']]];$settle->settle($args,$actor);$a=$settle->account($sid);$before=$a['paid_total'];$p=$settle->previewDiscount($sid,'percent',10,$actor);$settle->setDiscount($sid,'percent',10,$actor,$p['expected_signature']);$a=$settle->account($sid);check(!empty($a['session']['remaining_discount_grant'])&&$a['paid_total']===$before&&$a['remaining_discount']===10000,'actual_remaining_grant_preserves_paid');}
         $a=$settle->account($sid);$expected=$kind==='none'?0:($kind==='partial'?10000:20000);check($a['remaining_discount']===$expected,'actual_discount_'.$kind);}
        file_put_contents(dirname($root).'/cp139-fixture.json',json_encode($fixtures));echo "LOCAL FIXTURE PASS\n";

        $pdo->exec("INSERT INTO categories(category_key,name) VALUES('qa142-cat','QA142 category')");$cat=(int)$pdo->lastInsertId();
        $insert=$pdo->prepare("INSERT INTO items(item_code,category_id,name,price) VALUES(?,?,?,500)");for($i=1;$i<=330;$i++)$insert->execute(['QA142-'.sprintf('%03d',$i),$cat,'QA142 item '.sprintf('%03d',$i)]);$item=(int)$pdo->lastInsertId();
        $ins=$pdo->prepare('INSERT INTO tax_item_policy_versions(item_id,policy,custom_rate_bps,effective_from,created_by_user_id) VALUES(?,?,?,?,?)');for($i=1;$i<=22;$i++)$ins->execute([$item,'exempt',null,'2020-01-'.sprintf('%02d',$i).' 12:00:00',$actor['id']]);$ins->execute([$item,'custom_rate',0,'2021-01-01 00:00:00',$actor['id']]);$ins->execute([$item,'custom_rate',1500,'2099-01-01 00:00:00',$actor['id']]);
        $pdo->exec("INSERT INTO settings(setting_key,setting_value) VALUES('module.tax.enabled','1') ON DUPLICATE KEY UPDATE setting_value='1'");
        $yesterday=(new DateTimeImmutable($today))->modify('-1 day')->format('Y-m-d');$table=$fixtures['none']['table'];$session=$fixtures['none']['session'];
        $makeUser=function($name,$area)use($pdo){$pdo->prepare("INSERT INTO users(username,password_hash,display_name,role,active) VALUES(?,?,?,'operator',1)")->execute([$name,password_hash('qa142-prep-only',PASSWORD_DEFAULT),$name]);$id=(int)$pdo->lastInsertId();foreach(['preparation','remote_access'] as $cap)$pdo->prepare("INSERT INTO user_capabilities(user_id,capability,enabled) VALUES(?,?,1)")->execute([$id,$cap]);$pdo->prepare('INSERT INTO user_preparation_areas(user_id,area_key) VALUES(?,?)')->execute([$id,$area]);return ['id'=>$id];};
        $bar=$makeUser('qa142-bar','bar');$kitchen=$makeUser('qa142-kitchen','kitchen');
        $makeOrder=function($num,$date,$status='accounted',$station='hot_bar',$qty=1,$ordered=1)use($pdo,$table,$session,$clock){$pdo->prepare("INSERT INTO orders(public_code,client_token,table_id,session_id,order_source,status,total_amount,business_order_number,business_date,business_shift_key,business_shift_label,business_cutoff_snapshot) VALUES(?,?,?,?,'staff',?,?,?,?,?,?,?)")->execute(['qa142-'.$num,'qa142-token-'.$num,$table,$session,$status,500*$qty,$num,$date,$clock['shift_key'],$clock['shift_label'],$clock['cutoff']]);$id=(int)$pdo->lastInsertId();$pdo->prepare('INSERT INTO order_items(order_id,item_name,unit_price,quantity,ordered_quantity,preparation_station,line_total) VALUES(?,?,?,?,?,?,?)')->execute([$id,'QA142 prep '.$num,500,$qty,$ordered,$station,500*$qty]);return [$id,(int)$pdo->lastInsertId()];};
        $adj=function($order,$line,$area,$key)use($pdo,$actor){$pdo->prepare("INSERT INTO order_item_adjustments(request_id,order_id,order_item_id,area_key,from_quantity,to_quantity,delta_quantity,preparation_claimed_before,preparation_ack_status,inventory_quantity_delta,inventory_effect,actor_user_id) VALUES(?,?,?,?,1,2,1,1,'pending',0,'none',?)")->execute([$key,$order,$line,$area,$actor['id']]);return (int)$pdo->lastInsertId();};
        [$oldLocal,$oldLocalLine]=$makeOrder(14201,$yesterday,'accounted','hot_bar',2,1);$localAck=$adj($oldLocal,$oldLocalLine,'bar','qa142-local-ack');
        [$oldPublic,$oldPublicLine]=$makeOrder(14202,$yesterday,'accounted','hot_bar',2,1);$publicAck=$adj($oldPublic,$oldPublicLine,'bar','qa142-public-ack');
        [$normal,$normalLine]=$makeOrder(14203,$today,'accounted','kitchen');[$before,$beforeLine]=$makeOrder(14204,$today);[$after,$afterLine]=$makeOrder(14205,$today);[$failed,$failedLine]=$makeOrder(14206,$yesterday,'cancelled','kitchen',0,1);
        $pdo->prepare("INSERT INTO whole_order_cancellations(order_id,request_id,reason,actor_user_id,original_total,preparation_dispatched,inventory_reversal_requested,preparation_notice_status) VALUES(?,?,?,?,500,1,1,'failed')")->execute([$failed,'qa142-failed','QA only',$actor['id']]);
        $prep=$core->preparation();$prep->claim(['order_id'=>$after,'area'=>'bar'],$bar);$cancel=$core->orderStaffActions();$cancel->cancelWholeOrder(['order_id'=>$before,'request_id'=>'qa142-cancel-before','reason'=>'QA only'],$actor);$cancel->cancelWholeOrder(['order_id'=>$after,'request_id'=>'qa142-cancel-after','reason'=>'QA only'],$actor);
        $iid=(string)($cfg['installation']['id']??'');if($iid==='')throw new RuntimeException('fixture installation id missing');
        $secret=bin2hex(random_bytes(32));$cfg['public']['base_url']='http://127.0.0.1:18766/public';$cfg['public']['shared_secret']=$secret;
        file_put_contents(dirname($root).'/config.php','<?php return '.var_export($cfg,true).';');
        $remote=$pdo->prepare("INSERT INTO remote_user_credentials(user_id,password_hash,credential_version,source_mode) VALUES(?,?,1,'local_password') ON DUPLICATE KEY UPDATE password_hash=VALUES(password_hash),source_mode='local_password'");
        $users=[['id'=>(int)$actor['id'],'name'=>'qa-target','password'=>'synthetic-qa-admin-not-real','role'=>'admin','caps'=>['*'],'areas'=>[]],['id'=>$bar['id'],'name'=>'qa142-bar','password'=>'qa142-prep-only','role'=>'operator','caps'=>['preparation.read','preparation.mutate'],'areas'=>['bar']],['id'=>$kitchen['id'],'name'=>'qa142-kitchen','password'=>'qa142-prep-only','role'=>'operator','caps'=>['preparation.read','preparation.mutate'],'areas'=>['kitchen']]];
        foreach($users as $u)$remote->execute([$u['id'],password_hash($u['password'],PASSWORD_DEFAULT)]);
        $models=$core->publicProjectionBuilder()->remoteModelsFor(['operations','preparation']);check(count($models)===2,'fixture_two_models');
        file_put_contents(dirname($root).'/cp142-models.json',json_encode($models,JSON_THROW_ON_ERROR));
        file_put_contents(dirname($root).'/cp142-fixture.json',json_encode(['installation'=>$iid,'users'=>$users,'tax_item'=>$item,'hall'=>$fixtures,'prep'=>['old_local'=>$oldLocal,'old_public'=>$oldPublic,'local_ack'=>$localAck,'public_ack'=>$publicAck,'before'=>$before,'after'=>$after,'failed'=>$failed,'normal'=>$normal]],JSON_THROW_ON_ERROR));
        echo 'GROUP FIXTURE LOCAL READY'.PHP_EOL;
        QAEOF
    - name: Prepare public-db.php
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/public-db.php" <<'QAEOF'
        <?php
        if(PHP_SAPI!=='cli'||getenv('QA_DB_PASSWORD')!=='synthetic-cp116-ci-only')exit(2);
        $root=realpath($argv[1]);if(!$root||basename($root)!=='public')exit(2);require $root.'/bootstrap.php';$base=dirname($root);$f=json_decode(file_get_contents($base.'/cp142-fixture.json'),true,64,JSON_THROW_ON_ERROR);$localCfg=require $base.'/config.php';$iid=$f['installation'];$secret=$localCfg['public']['shared_secret'];
        $p=new PDO('mysql:host=127.0.0.1;port=3306;charset=utf8mb4','root',getenv('QA_DB_PASSWORD'),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$p->exec('CREATE DATABASE sokna_cp142_public CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci');$storage=$base.'/qa142-public-private';mkdir($storage,0700,true);
        $cfg=['db'=>['host'=>'127.0.0.1','port'=>'3306','name'=>'sokna_cp142_public','user'=>'root','pass'=>getenv('QA_DB_PASSWORD')],'app'=>['base_path'=>'/public','base_url'=>'http://127.0.0.1:18766/public','default_installation_id'=>$iid,'cookie_secure'=>false,'storage_dir'=>$storage],'relay'=>['secret_encryption_key_base64'=>base64_encode(random_bytes(32)),'installation_secrets'=>[$iid=>$secret],'clock_skew_seconds'=>300],'auth'=>['session_ttl_seconds'=>28800]];
        file_put_contents($root.'/config.php','<?php return '.var_export($cfg,true).';');touch($root.'/install.lock');$core=sokna_public_bootstrap($cfg);$core->migrations()->migrate();$db=$core->database();$db->prepare("INSERT INTO installations(installation_id,display_name,active,remote_enabled,authority_state) VALUES(?,?,1,1,'active')")->execute([$iid,'QA grouped']);
        $q=$db->prepare('INSERT INTO auth_projections(installation_id,projection_id,username,display_name,role,password_hash,capabilities_json,preparation_areas_json,active) VALUES(?,?,?,?,?,?,?,?,1)');foreach($f['users'] as $u)$q->execute([$iid,'user:'.$u['id'],$u['name'],$u['name'],$u['role'],password_hash($u['password'],PASSWORD_DEFAULT),json_encode($u['caps']),json_encode($u['areas'])]);
        // Initial projection will be delivered through the normal signed Local HTTP client, not direct fixture import.
        echo 'GROUP FIXTURE PUBLIC READY'.PHP_EOL;
        QAEOF
    - name: Prepare worker.php
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/worker.php" <<'QAEOF'
        <?php
        if(PHP_SAPI!=='cli'||getenv('QA_DB_PASSWORD')!=='synthetic-cp116-ci-only')exit(2);
        $root=realpath($argv[1]);if(!$root||basename($root)!=='local')exit(2);require $root.'/bootstrap.php';$base=dirname($root);$core=sokna_local_bootstrap(require $base.'/config.php');$client=$core->publicEdgeSyncClient();$publisher=$core->publicEdgePublisher();
        if(!$client->configured())throw new RuntimeException('fixture connection unavailable');
        if(($argv[2]??'')==='init'){
         $models=$core->publicProjectionBuilder()->remoteModelsFor(['operations','preparation']);$r=$client->postRaw('/api/v1/local/read-models',['models'=>$models],5);if(($r['status']??0)!==200||((int)($r['body']['synced']??0)+(int)($r['body']['unchanged']??0))!==2)throw new RuntimeException('signed sync '.json_encode(['status'=>$r['status']??0,'error'=>$r['body']['error']??'','synced'=>$r['body']['synced']??null]));echo 'PASS signed_projection_initial'.PHP_EOL;
         $h=$publisher->syncHeartbeat(5);echo 'SIGNED HEARTBEAT '.json_encode(['success'=>$h['success']??null,'status'=>$h['status']??null]).PHP_EOL;exit;
        }
        $end=microtime(true)+210;$last=0;while(microtime(true)<$end){try{$r=$core->publicEdgeRelay()->syncRealtimeExchange(8,4,(int)(microtime(true)*1000)+5500);if(($r['processed']??0)>0||($r['acked']??0)>0)echo 'WORKER '.json_encode(['processed'=>$r['processed']??0,'acked'=>$r['acked']??0]).PHP_EOL;if(microtime(true)-$last>2){$publisher->syncProjectionModelsV2(250,4,4,(int)(microtime(true)*1000)+5000,['operations','preparation','guest_operational']);$last=microtime(true);}}catch(Throwable $e){echo 'WORKER ERROR '.get_class($e).' '.($e->errorCode??'').PHP_EOL;}usleep(350000);}
        QAEOF
    - name: Prepare browser.cjs
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/browser.cjs" <<'QAEOF'
        const {chromium}=require(process.env.RUNNER_TEMP+'/pw/node_modules/playwright');
        const fs=require('fs'),path=require('path'),assert=require('assert/strict');
        const f=JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP,'cp142-fixture.json'))),local='http://127.0.0.1:18765',pub='http://127.0.0.1:18766/public';
        const shots=path.join(process.env.RUNNER_TEMP,'cp142-screenshots');fs.mkdirSync(shots,{recursive:true});
        function ck(v,k){assert.ok(v,k);console.log('PASS '+k)}
        const shot=(p,n)=>p.screenshot({path:path.join(shots,n+'.png'),animations:'disabled'});
        async function ready(l){await l.waitFor({state:'visible'});await l.page().waitForFunction(e=>!e.disabled,await l.elementHandle(),{timeout:25000});}
        async function auth(p,url,user,pw){const r=await p.goto(url);ck(r.ok(),'login_http_'+user);const h=p.locator('[data-login-selection]');await h.waitFor({state:'attached'});if(await h.inputValue()!==user){await p.locator('.sc-login-flow-change').click();await p.locator(`[data-login-account][data-account-key="${user}"]`).click();await p.locator('.sc-login-stable-picker').waitFor({state:'hidden'});}await p.locator('input[name=password]').fill(pw);await Promise.all([p.waitForNavigation(),p.locator('form[data-login-form] button[type=submit]').click()]);ck(!p.url().includes('/login'),'login_success_'+user)}
        async function get(p,url){const r=await p.request.get(url);return {r,j:await r.json()}}
        async function waitJson(p,url,fn,tag,ms=20000){const end=Date.now()+ms;while(Date.now()<end){const {r,j}=await get(p,url);if(r.ok()&&fn(j)){ck(true,tag);return j}await p.waitForTimeout(300)}throw Error(tag)}
        async function tax(p){await auth(p,local+'/login.php','qa-target','synthetic-qa-admin-not-real');await p.goto(local+'/finance/?tab=settings');const search=p.locator('[data-tax-search]');await search.waitFor();await p.locator('[data-tax-state]').filter({hasText:'تعریف نشده'}).waitFor();ck(true,'tax_default_undefined');await search.fill('QA142');await p.locator('[data-tax-count]').filter({hasText:'۳۳۰ کالا'}).waitFor();ck(true,'tax_search_full_330');await search.fill('QA142-۳۳۰');const opt=p.locator('[data-tax-item] option').filter({hasText:'QA142 item 330'});await opt.waitFor({state:'attached'});await p.locator('[data-tax-item]').selectOption(String(f.tax_item));await p.locator('[data-tax-item-current]').filter({hasText:'نرخ اختصاصی'}).waitFor();ck((await p.locator('[data-tax-item-current]').textContent()).includes('۰'),'tax_zero_current');
        const hist=p.locator('details').filter({has:p.locator('[data-tax-item-history]')});await hist.locator('summary').click();await p.locator('[data-tax-item-history]').filter({hasText:'آینده'}).waitFor();await shot(p,'tax-desktop-history');await p.locator('[data-tax-history-next]').click();await p.locator('[data-tax-history-count]').filter({hasText:'صفحه ۲'}).waitFor();ck(await p.locator('[data-tax-item-history] .sc-list-item').count()===4,'tax_history_second_page');await hist.locator('summary').click();
