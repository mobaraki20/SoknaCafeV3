        $server=new PDO('mysql:host=127.0.0.1;port=3306;charset=utf8mb4','root',getenv('QA_DB_PASSWORD'),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$server->exec('CREATE DATABASE sokna_cp139 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci');
        $dir=sys_get_temp_dir().'/sokna-cp139-'.bin2hex(random_bytes(6));mkdir($dir,0700,true);$setup=new BrowserSetupService(dirname($root),$root);
        $status=$setup->installNew(['data_dir'=>$dir.'/data','db'=>['host'=>'127.0.0.1','port'=>'3306','name'=>'sokna_cp139','user'=>'root','pass'=>getenv('QA_DB_PASSWORD')],'admin_user'=>'qa-target','admin_password'=>'synthetic-qa-admin-not-real','cafe_name'=>'QA CP139','table_count'=>5]);
        check(($status['success']??false)&&($status['health']['migrations_applied']??0)===93,'setup');$cfg=require dirname($root).'/config.php';$core=sokna_local_bootstrap($cfg);$pdo=$core->database();$actor=$pdo->query("SELECT id,role FROM users WHERE username='qa-target'")->fetch(PDO::FETCH_ASSOC);
        $pdo->exec("UPDATE users SET active=0 WHERE username<>'qa-target'");
        for($i=1;$i<=8;$i++){$u='qa-member-'.$i;$pdo->prepare("INSERT INTO users(username,password_hash,display_name,role,active) VALUES(?,?,?,'operator',1)")->execute([$u,password_hash('synthetic-member-only',PASSWORD_DEFAULT),sprintf('همکار آزمون %02d',$i)]);if($i===8){$cashier=(int)$pdo->lastInsertId();foreach(['orders_floor','cashier_accounts'] as $cap)$pdo->prepare('INSERT INTO user_capabilities(user_id,capability,enabled) VALUES(?,?,1)')->execute([$cashier,$cap]);}}
        $pdo->prepare("INSERT INTO users(username,password_hash,display_name,role,active) VALUES(?,?,?,'operator',0)")->execute(['qa-disabled',password_hash('synthetic-disabled-only',PASSWORD_DEFAULT),'غیرفعال']);
        echo 'ACTIVE_QA_COUNT '.count($core->auth()->activeLoginUsers()).PHP_EOL;check(count($core->auth()->activeLoginUsers())===9,'nine_active_login_users');
        $clock=$core->businessClock()->assignment();$today=$clock['business_date'];$tables=$pdo->query('SELECT id FROM cafe_tables ORDER BY id LIMIT 5')->fetchAll(PDO::FETCH_COLUMN);check(count($tables)===5,'five_tables');$settle=$core->settlements();$fixtures=[];
        foreach(['none','percent','fixed','partial','empty'] as $i=>$kind){$table=(int)$tables[$i];$pdo->prepare("INSERT INTO table_sessions(public_token,table_id,status,live_table_guard,business_date,business_shift_key,business_shift_label,business_cutoff_snapshot) VALUES(?,?,'active',?,?,?,?,?)")->execute(['qa139-session-'.$i,$table,$table,$today,$clock['shift_key'],$clock['shift_label'],$clock['cutoff']]);$sid=(int)$pdo->lastInsertId();$fixtures[$kind]=['table'=>$table,'session'=>$sid];if($kind==='empty')continue;
         $pdo->prepare("INSERT INTO orders(public_code,client_token,table_id,session_id,order_source,status,total_amount,business_order_number,business_date,business_shift_key,business_shift_label,business_cutoff_snapshot) VALUES(?,?,?,?,'staff','accounted',200000,?,?,?,?,?)")->execute(['qa139-order-'.$i,'qa139-token-'.$i,$table,$sid,13900+$i,$today,$clock['shift_key'],$clock['shift_label'],$clock['cutoff']]);$oid=(int)$pdo->lastInsertId();$pdo->prepare('INSERT INTO order_items(order_id,item_name,unit_price,quantity,ordered_quantity,preparation_station,line_total) VALUES(?,?,?,?,?,?,?)')->execute([$oid,'آیتم آزمون',100000,2,2,'hot_bar',200000]);$lid=(int)$pdo->lastInsertId();
