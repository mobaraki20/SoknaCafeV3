name: U01 Windows updater and integrated M06 Local release
on:
  push:
    branches: ['release/u01-updater-20261023']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-services-123-u01
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact versions including T01 presentation dependencies and M10
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tests/g6-component-release-contract.py
          if ($LASTEXITCODE -ne 0) { throw 'G6 component source contract failed' }
          python tests/m10-release-qualification.py
          if ($LASTEXITCODE -ne 0) { throw 'M10 qualification failed' }
          $m=Get-Content packaging/windows/windows-services-component-manifest-v2.json -Raw|ConvertFrom-Json
          $v=@{};foreach($c in $m.components){$v[[string]$c.component_id]=[string]$c.version}
          if($m.package_version-ne'1.1.23' -or @($m.components).Count-ne5 -or $v.runtime-ne'1.0.7' -or $v.'print-agent'-ne'6.2.10' -or $v.maintenance-ne'0.3.12' -or $v.'maintenance-update-engine'-ne'0.3.12' -or $v.'maintenance-recovery-console'-ne'0.1.3'){
            throw 'U01 component versions do not match updated source dependencies'
          }
          if(@($m.components|Where-Object{$_.version-eq'0.3.10'}).Count -gt 0){
            throw 'New Windows installer still contains stale Maintenance'
          }
      - name: Test actual keyless Local ZIP Preflight/Stage on Windows
        shell: pwsh
        run: |
          dotnet run --project windows/maintenance/tests/Sokna.Maintenance.OperatorUploadHarness/Sokna.Maintenance.OperatorUploadHarness.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0){throw 'Keyless upload/preflight/stage regression failed'}
      - name: Test existing Maintenance activation-worker regression
        shell: pwsh
        run: |
          dotnet run --project windows/maintenance/tests/Sokna.Maintenance.ActivationWorkerHarness/Sokna.Maintenance.ActivationWorkerHarness.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0){throw 'Activation worker regression failed'}
      - name: Install existing Inno Setup toolchain
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0){throw 'Inno Setup unavailable'}
      - name: Build normal five-component one-click Windows Services package
        shell: pwsh
        timeout-minutes: 55
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'sokna-windows-123-u01'
          $iscc=@("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","$env:ProgramFiles\Inno Setup 6\ISCC.exe")|Where-Object{$_ -and(Test-Path -LiteralPath $_ -PathType Leaf)}|Select-Object -First 1
          if(-not $iscc){throw 'Inno Setup ISCC missing'}
          & ./release/build-windows-release.ps1 -RepoRoot $PWD.Path -OutputRoot $out -IsccExe $iscc
          if($LASTEXITCODE -ne 0){throw 'Windows Services V4 builder failed'}
      - name: Verify emitted installer metadata and previous installed receipt policy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'sokna-windows-123-u01'
          $idx=Get-Content (Join-Path $out 'artifact-index.json') -Raw|ConvertFrom-Json
          if($idx.package_version-ne'1.1.23' -or $idx.component_count-ne5 -or $idx.installer_kind-ne'unified-v4-bootstrap'){
            throw 'Invalid unified Windows installer artifact index'
          }
          $exe=Join-Path $out ([string]$idx.windows_services.file)
          if([IO.Path]::GetFileName($exe)-ne'SOKNA-Windows-Services-Setup-1.1.23.exe' -or -not(Test-Path -LiteralPath $exe)){throw 'Expected one-click setup absent'}
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if($hash-ne$idx.windows_services.sha256){throw 'Setup digest mismatch'}
          $version=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe).FileVersion
          if($version-ne'1.1.23.0'){throw "Wrong installer FileVersion: $version"}
          $shell=Get-Content (Join-Path $out 'unified-shell-v4/windows-services-component-manifest-v2.json') -Raw|ConvertFrom-Json
          $components=@{};foreach($c in $shell.components){$components[[string]$c.component_id]=[string]$c.version}
          if($components.maintenance-ne'0.3.12' -or $components.'maintenance-update-engine'-ne'0.3.12' -or $components.runtime-ne'1.0.7' -or $components.'print-agent'-ne'6.2.10' -or $components.'maintenance-recovery-console'-ne'0.1.3'){
            throw 'Compiled component version drift'
          }
          $ui=Join-Path $out 'SoknaSetupUi.exe'
          if(-not(Test-Path -LiteralPath $ui)){throw 'Setup UI missing'}
          if([Diagnostics.FileVersionInfo]::GetVersionInfo($ui).FileVersion-ne'1.1.23.0'){throw 'Setup UI version drift'}
          $plan=Start-Process -FilePath $ui -ArgumentList '--planner-self-test' -Wait -PassThru
          if($plan.ExitCode-ne0){throw "Planner self-test failed: $($plan.ExitCode)"}
          "$hash  $([IO.Path]::GetFileName($exe))" | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ASCII
          Write-Host 'WINDOWS_1123_KEYLESS_INSTALLER_SOURCE_AND_PACKAGE_GATES_PASS'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-services-1123-u01
          path: |
            ${{ runner.temp }}/sokna-windows-123-u01/SOKNA-Windows-Services-Setup-1.1.23.exe
            ${{ runner.temp }}/sokna-windows-123-u01/SHA256SUMS.txt
            ${{ runner.temp }}/sokna-windows-123-u01/artifact-index.json
          if-no-files-found: error
  windows-qualification:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, intl, sodium, zip, gd
          coverage: none
          tools: none
        env:
          phpts: ts
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Iran presentation regression
        shell: pwsh
        run: |
          dotnet run --project windows/shared/tests/IranPresentationTests.csproj
          if($LASTEXITCODE-ne0){throw 'Iran presentation regression'}
      - name: Build reproducible real Local panel ZIP
        shell: pwsh
        run: |
          python release/build-local-u01.py --output "$env:RUNNER_TEMP/u01-local"
          if($LASTEXITCODE-ne0){throw 'Local package builder failed'}
      - name: Real Windows SCM, Apache, PHP, MariaDB - 24 completed cycles
        shell: pwsh
        run: ./windows/maintenance/tests/u01-windows-full-cycle.ps1
      - name: Freeze completed recovery evidence with the Local package
        shell: pwsh
        run: Copy-Item "$env:RUNNER_TEMP/U01-WINDOWS-CYCLES.json" "$env:RUNNER_TEMP/u01-local/U01-WINDOWS-CYCLES.json"
      - uses: actions/upload-artifact@v4
        with:
          name: u01-local-and-evidence
          path: |
            ${{ runner.temp }}/u01-local/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: u01-home-qualified
          path: ${{ runner.temp }}/u01-home/*
          if-no-files-found: error
  publish:
    needs: [build-installer, windows-qualification]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-services-1123-u01
          path: publish
      - uses: actions/download-artifact@v4
        with:
          name: u01-local-and-evidence
          path: publish/local
      - uses: actions/download-artifact@v4
        with:
          name: u01-home-qualified
          path: publish/home
      - name: Publish immutable U01 candidate after successful qualification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=windows-services-v1.1.23-u01-rc.1
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Immutable release already exists; refusing overwrite'; exit 1
          fi
          gh release create "$tag" publish/SOKNA-Windows-Services-Setup-1.1.23.exe publish/SHA256SUMS.txt publish/artifact-index.json publish/local/SOKNA-Local-231bf-U01-Panel-Update.zip publish/local/SHA256SUMS-LOCAL.txt publish/local/target.json publish/local/U01-WINDOWS-CYCLES.json publish/home/SOKNA-Home-231au-to-231bf-PREFLIGHT.exe publish/home/SOKNA-Home-231au-to-231bf-UPDATE-UAT.exe publish/home/SHA256SUMS-HOME.txt publish/home/HOME-WINDOWS-TESTS.jsonl --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'SOKNA U01 — Windows Services 1.1.23 / Local 231bf / Home bootstrap' --notes-file docs/releases/u01/RELEASE-NOTES.md --prerelease
