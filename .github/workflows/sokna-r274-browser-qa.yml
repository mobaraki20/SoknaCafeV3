name: SOKNA R274 Chromium Popup Resume UI Acceptance
on:
  push:
    branches: [qa/sokna-r274-cafe-cutover-resume-20261117]
    paths:
      - 'r273/tests/r274_browser_flow.py'
      - '.github/workflows/sokna-r274-browser-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  chromium-paired-public:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: R274-TWO-CUMULATIVE-SOURCE-QA-NOT-OPERATOR-INSTALL
          run-id: 44087345193
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r274-packages
      - name: Assert exact R274 package bytes, not mocks of frontend source
        env:
          R274_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/r274-packages
        run: |
          python3 - <<'PY'
          import os,hashlib,pathlib
          p=pathlib.Path(os.environ['R274_BROWSER_ARTIFACT_DIR'])
          exp={
           'SOKNA-R274-LOCAL-231FK-CAFE-CUTOVER-RESUME-QA-DO-NOT-INSTALL.zip':'9038abd4757ed1ed3dc3ab92e54f9266096fe73d5919d7667a1f195540991ec4',
           'SOKNA-R274-PUBLIC-35II-OWNER-RESUME-CODE-ONLY-QA-DO-NOT-INSTALL.zip':'68725567e7336e0b43691ff4adae8b494b4a9c793a50a30d4564a2dab11daa92'
          }
          for name,sha in exp.items():
           files=list(p.rglob(name))
           assert len(files)==1,(name,len(files))
           assert hashlib.sha256(files[0].read_bytes()).hexdigest()==sha,name
          print('R274_BROWSER_PINNED_PAYLOAD_SHA_PASS')
          PY
      - name: Install isolated Chromium smoke dependency
        run: |
          python3 -m pip install --user playwright==1.58.0
          python3 -m playwright install --with-deps chromium
      - name: Two real Chromium origins, popup initial and resumed owner grants
        env:
          R274_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/r274-packages
        run: |
          python3 r273/tests/r274_browser_flow.py | tee "$RUNNER_TEMP/r274-browser.log"
          grep -q 'R274_BROWSER_POPUP_NORMAL_PASS' "$RUNNER_TEMP/r274-browser.log"
          grep -q 'R274_BROWSER_POPUP_RESUME_PASS' "$RUNNER_TEMP/r274-browser.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R274-CHROMIUM-BROWSER-POPUP-EVIDENCE-CI-ONLY
          path: ${{ runner.temp }}/r274-browser.log
          retention-days: 7
          if-no-files-found: warn
