name: V3 Component Gates

on:
  pull_request:
  push:
    branches:
      - main
      - 'architecture/**'
      - 'migration/**'

permissions:
  contents: read

jobs:
  changes:
    name: Classify component impact
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.impact.outputs.any }}
      global: ${{ steps.impact.outputs.global }}
      local: ${{ steps.impact.outputs.local }}
      public: ${{ steps.impact.outputs.public }}
      runtime: ${{ steps.impact.outputs.runtime }}
      print: ${{ steps.impact.outputs.print }}
      platform: ${{ steps.impact.outputs.platform }}
      contracts: ${{ steps.impact.outputs.contracts }}
      packaging: ${{ steps.impact.outputs.packaging }}
      migration: ${{ steps.impact.outputs.migration }}
      ui: ${{ steps.impact.outputs.ui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine changed paths
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BEFORE_SHA"
            HEAD_SHA="$CURRENT_SHA"
            if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="$(git rev-list --max-parents=0 "$HEAD_SHA" | tail -n 1)"
            fi
          fi
          echo "base=$BASE_SHA"
          echo "head=$HEAD_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
          cat changed-files.txt

      - name: Map paths to V3 owners
        id: impact
        run: python3 tests/component-impact.py --files changed-files.txt --github-output "$GITHUB_OUTPUT"

  foundation:
    name: Foundation contract
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate V3 ownership, lineage, SCDS and migration matrix
        run: python3 tests/validate-v3-foundation.py

  local:
    name: Local Web gate (foundation stage)
    needs: [changes, foundation]
    if: needs.changes.outputs.local == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/validate-v3-foundation.py --component local
      - run: echo 'Local implementation/build suite will be registered when the first audited Local slice is migrated; no product-test claim is made by this foundation gate.'

  public:
    name: Public gate (foundation stage)
    needs: [changes, foundation]
    if: needs.changes.outputs.public == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/validate-v3-foundation.py --component public
      - run: echo 'Public implementation/build suite is not yet registered; this gate currently validates ownership metadata only.'

  runtime:
    name: Windows Runtime gate (foundation stage)
    needs: [changes, foundation]
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/validate-v3-foundation.py --component runtime
      - run: echo 'Windows runtime integration tests will be added with the first audited runtime migration slice.'

  print:
    name: Print Agent gate (foundation stage)
    needs: [changes, foundation]
    if: needs.changes.outputs.print == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/validate-v3-foundation.py --component print
      - run: echo 'Print Agent build/spooler tests and physical-printer UAT remain future migration gates, not implied PASS here.'

  platform:
    name: Platform gate (foundation stage)
    needs: [changes, foundation]
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/validate-v3-foundation.py --component platform
      - run: echo 'Clean-machine platform acceptance is intentionally not claimed until platform implementation is migrated.'

  contracts:
    name: Contracts gate (foundation stage)
    needs: [changes, foundation]
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/validate-v3-foundation.py --component contracts

  packaging:
    name: Packaging gate (foundation stage)
    needs: [changes, foundation]
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/validate-v3-foundation.py --component packaging
      - run: echo 'Installer/update/repair acceptance is not claimed before packaging code exists in V3.'

  migration:
    name: Migration inventory gate
    needs: [changes, foundation]
    if: needs.changes.outputs.migration == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/validate-v3-foundation.py --component migration

  ui:
    name: SCDS authority gate
    needs: [changes, foundation]
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/validate-v3-foundation.py --component ui
