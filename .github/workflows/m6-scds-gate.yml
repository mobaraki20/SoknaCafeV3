name: M6 SCDS Gate
on:
  pull_request:
    paths: ['apps/local-web/assets/scds/**','apps/local-web/src/UI/**','docs/ui-design-system/**','tests/scds-m6-gate.py','.github/workflows/m6-scds-gate.yml']
  push:
    branches: [main,'architecture/**','migration/**']
    paths: ['apps/local-web/assets/scds/**','apps/local-web/src/UI/**','docs/ui-design-system/**','tests/scds-m6-gate.py','.github/workflows/m6-scds-gate.yml']
permissions: {contents: read}
jobs:
  scds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/scds-m6-gate.py
      - run: php -l apps/local-web/src/UI/SCDS.php
