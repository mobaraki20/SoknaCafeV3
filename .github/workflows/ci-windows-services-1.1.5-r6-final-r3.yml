name: CI Windows Services 1.1.5 R6 Final R3

on:
  push:
    branches:
      - work/maintenance-v4-production-local-migration-bridge-r6
    paths:
      - .github/workflows/ci-windows-services-1.1.5-r6-final-r3.yml

permissions:
  actions: read
  contents: write

jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze R6 lineage and PS5.1 source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git merge-base --is-ancestor 65330eebdb179075228f4f96422ceb8abdee1e4a HEAD
          if($LASTEXITCODE-ne0){throw 'R6 product lineage mismatch'}
          $changed=@(git diff --name-only '65330eebdb179075228f4f96422ceb8abdee1e4a..HEAD' -- windows/maintenance/src windows/maintenance/tests)
          if($changed.Count-ne0){throw "R6 product source changed after failure-matrix PASS: $($changed -join ', ')"}
          foreach($p in @('packaging/windows/scripts/bootstrap-local-slot-r6.ps1','packaging/windows/scripts/setup-windows-components-v6.ps1','packaging/windows/scripts/prepare-shell-payload-v5.ps1')){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if($errors.Count){throw "PS5.1 parse failed: $p :: $($errors[0].Message)"}
          }
          Write-Host 'Lineage + PS5.1: PASS'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download canonical KEEP payloads
        uses: actions/download-artifact@v4
        with:
          name: windows-services-1.1.0-canonical-components-r3-baseline
          path: recovered
          github-token: ${{ github.token }}
          repository: mobaraki20/SoknaCafeV3
          run-id: 38982932863

      - name: Lock component identities
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Sha($p){(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()}
          $m=Get-Content packaging/windows/windows-services-component-manifest-v2.json -Raw|ConvertFrom-Json
          $b=@{};foreach($c in $m.components){$b[$c.component_id]=$c.version}
          if($m.package_version-ne'1.1.5'-or$b.runtime-ne'1.0.5'-or$b.'print-agent'-ne'6.2.9'-or$b.maintenance-ne'0.3.3'-or$b.'maintenance-update-engine'-ne'0.3.3'-or$b.'maintenance-recovery-console'-ne'0.1.1'){throw 'Component identity mismatch'}
          $checks=@{'recovered/runtime/SoknaRuntimeService.exe'='26deed62524278fa93a9a576d958f9177fe97c878b75829a8dc93a1440955afd';'recovered/print-worker/Service/Sokna.PrintAgent.Service.exe'='99565602163463e9bce0ca6b33933411635db87a03acaf03340d2a56d9c85ff4';'recovered/baseline-maintenance/recovery/SoknaMaintenanceRecoveryConsole.exe'='85989bc8d1096575b0fcfc7d7d55aa999674c20ac8092fd3ea16d90e574c17e9'}
          foreach($p in $checks.Keys){if((Sha $p)-ne$checks[$p]){throw "Canonical KEEP drift: $p"}}
          Write-Host 'Component identity + KEEP lock: PASS'

      - name: Build exact R6 shell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $PWD 'out-r6-final-r3';New-Item -ItemType Directory -Path "$out/maintenance/app","$out/setup-ui","$out/setup-host" -Force|Out-Null
          dotnet publish windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/maintenance/app";if($LASTEXITCODE){throw 'Supervisor publish failed'}
          dotnet publish windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/maintenance/app";if($LASTEXITCODE){throw 'Engine publish failed'}
          dotnet publish packaging/windows/setup-ui/Sokna.SetupUi.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$out/setup-ui";if($LASTEXITCODE){throw 'Setup UI publish failed'}
          dotnet publish packaging/windows/setup-host-v3/Sokna.SetupHostV3.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/setup-host";if($LASTEXITCODE){throw 'Setup Host publish failed'}
          ./packaging/windows/scripts/prepare-shell-payload-v5.ps1 -RepoRoot $PWD.Path -OutputRoot "$out/shell" -RuntimeServiceExe (Resolve-Path recovered/runtime/SoknaRuntimeService.exe).Path -SetupHostExe "$out/setup-host/SoknaSetupHost.exe" -SetupUiExe "$out/setup-ui/SoknaSetupUi.exe" -PrintWorkerBundle (Resolve-Path recovered/print-worker).Path -MaintenanceAppBundle "$out/maintenance/app" -MaintenanceRecoveryBundle (Resolve-Path recovered/baseline-maintenance/recovery).Path -GitSha '65330eebdb179075228f4f96422ceb8abdee1e4a';if($LASTEXITCODE){throw 'Shell composition failed'}

      - name: Verify shell normalization and ownership boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$shell='out-r6-final-r3/shell'
          foreach($n in @('setup-windows-components-v4.ps1','setup-windows-components-core-v5.ps1','bootstrap-local-slot-r6.ps1','local-slot-bootstrap-contract-v1.json')){if(-not(Test-Path "$shell/$n")){throw "Missing shell file: $n"}}
          $core=(Get-Content "$shell/setup-windows-components-core-v5.ps1" -Raw).Replace("`r`n","`n")
          $source=(Get-Content packaging/windows/scripts/setup-windows-components-v5.ps1 -Raw).Replace([char]0x2014,'-').Replace("`r`n","`n")
          if($core-ne$source){throw 'Qualified lifecycle core differs beyond approved PS5.1 normalization'}
          $wrapper=Get-Content "$shell/setup-windows-components-v4.ps1" -Raw
          if(-not$wrapper.Contains('Post-commit migration bootstrap')-or-not$wrapper.Contains('windows_components_committed=$true')){throw 'Post-commit wrapper boundary missing'}
          $boot=Get-Content "$shell/bootstrap-local-slot-r6.ps1" -Raw
          if($boot.Contains('SoknaMaintenanceUpdateEngine.exe')){throw 'Bootstrap bypasses Supervisor'}
          foreach($x in @('/v1/local-slots/migrate','X-Sokna-Signature','web-adapter')){if(-not$boot.Contains($x)){throw "Missing bootstrap contract: $x"}}
          $c=Get-Content "$shell/local-slot-bootstrap-contract-v1.json" -Raw|ConvertFrom-Json
          if($c.entries.Count-ne1-or$c.entries[0].build-ne'3.0.0-g6.2-workspace.231ai-browser-recovery-managed-inventory'-or[int]$c.entries[0].managed_files-ne497-or$c.entries[0].managed_tree_sha256-ne'b0e252b62b804c00e25c925d31ded8986fa23c3ab0d58b668eb79a79b961f56a'){throw '231ai bootstrap allowlist mismatch'}
          $sv=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$shell/_payload/maintenance/app/SoknaMaintenanceSupervisor.exe")).FileVersion;$ev=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$shell/_payload/maintenance/app/SoknaMaintenanceUpdateEngine.exe")).FileVersion
          if(-not$sv.StartsWith('0.3.3')-or-not$ev.StartsWith('0.3.3')){throw "Maintenance version mismatch: $sv / $ev"}
          Write-Host 'Shell normalization/ownership: PASS'

      - name: Safe skip bootstrap gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop';& "$env:SystemRoot\System32\sc.exe" delete SoknaApache *> $null;$global:LASTEXITCODE=0
          $out=(Resolve-Path out-r6-final-r3).Path;$shell=Join-Path $out 'shell';$tx='skip-'+[guid]::NewGuid().ToString('N');$dir=Join-Path $out $tx;New-Item -ItemType Directory $dir -Force|Out-Null
          @{format='sokna-windows-install-plan-v3';schema_version=3;transaction_id=$tx;correlation_id='c';setup_session_id='s';shell_root=$shell}|ConvertTo-Json|Set-Content "$dir/plan.json" -Encoding UTF8
          & "$shell/bootstrap-local-slot-r6.ps1" -PlanFile "$dir/plan.json";if($LASTEXITCODE-ne0){throw "Safe skip failed: $LASTEXITCODE"}
          $e=Get-Content "$dir/local-slot-bootstrap.json" -Raw|ConvertFrom-Json
          if($e.status-ne'skipped'-or$e.code-ne'LOCAL_APACHE_NOT_INSTALLED'-or[bool]$e.activation_performed){throw 'Safe skip contract failed'}
          Write-Host 'Bootstrap safe skip: PASS'

      - name: Signed Supervisor bootstrap gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Cleanup(){try{Stop-Service SoknaApache -Force -ErrorAction SilentlyContinue}catch{};& "$env:SystemRoot/System32/sc.exe" delete SoknaApache *> $null;$global:LASTEXITCODE=0;Start-Sleep -Milliseconds 250}
          $out=(Resolve-Path out-r6-final-r3).Path;$shell=Join-Path $out 'shell';$root=Join-Path $out 'fake-local';New-Item -ItemType Directory -Path "$root/Infrastructure/Apache24/bin","$root/Web" -Force|Out-Null
          Copy-Item "$env:SystemRoot/System32/cmd.exe" "$root/Infrastructure/Apache24/bin/httpd.exe" -Force;'3.0.0-g6.2-workspace.231ai-browser-recovery-managed-inventory'|Set-Content "$root/Web/VERSION.txt" -Encoding ascii
          Cleanup;$exe=(Resolve-Path "$root/Infrastructure/Apache24/bin/httpd.exe").Path;& "$env:SystemRoot/System32/sc.exe" create SoknaApache binPath= ('"'+$exe+'"') start= demand|Out-Null;if($LASTEXITCODE){throw 'Fake Apache service failed'}
          $maint=Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::CommonApplicationData)) 'SOKNA/Maintenance';New-Item -ItemType Directory -Path "$maint/secrets" -Force|Out-Null;$key=[byte[]](0..31);$b64=[Convert]::ToBase64String($key);Set-Content "$maint/secrets/web-adapter.key" $b64 -Encoding ascii;@{base_url='http://127.0.0.1:17639/'}|ConvertTo-Json|Set-Content "$maint/control-plane.json" -Encoding utf8
          $py=Join-Path $out 'fake.py';$cap=Join-Path $out 'capture.json'
          @'
          import base64,hashlib,hmac,http.server,json,sys
          key=base64.b64decode(sys.argv[1]); cap=sys.argv[2]
          class H(http.server.BaseHTTPRequestHandler):
            def log_message(self,*a): pass
            def do_POST(self):
              n=int(self.headers.get('Content-Length','0')); b=self.rfile.read(n); bh=hashlib.sha256(b).hexdigest(); p=self.headers.get('X-Sokna-Maintenance-Protocol',''); t=self.headers.get('X-Sokna-Timestamp',''); no=self.headers.get('X-Sokna-Nonce',''); s=self.headers.get('X-Sokna-Signature',''); can='\n'.join(['POST',self.path,p,t,no,bh]).encode(); exp=hmac.new(key,can,hashlib.sha256).hexdigest(); ok=self.path=='/v1/local-slots/migrate' and p=='1.0' and self.headers.get('X-Sokna-Key-Id')=='web-adapter' and hmac.compare_digest(s,exp); json.dump({'ok':ok,'body':json.loads(b.decode()),'path':self.path,'key':self.headers.get('X-Sokna-Key-Id')},open(cap,'w')); x={'ok':ok,'operation_id':'fake-r6','state':'committed' if ok else 'unauthorized','code':'LOCAL_SLOT_MIGRATION_COMMITTED' if ok else 'AUTH_SIGNATURE_INVALID','requires_recovery_console':False,'data':{'operation':{'activation_performed':True}}}; raw=json.dumps(x).encode(); self.send_response(200 if ok else 401);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(raw)));self.end_headers();self.wfile.write(raw)
          http.server.HTTPServer(('127.0.0.1',17639),H).handle_request()
          '@|Set-Content $py -Encoding utf8
          $sp=Start-Process python -ArgumentList @(('"'+$py+'"'),$b64,('"'+$cap+'"')) -PassThru -WindowStyle Hidden;Start-Sleep -Seconds 1
          $tx='signed-'+[guid]::NewGuid().ToString('N');$dir=Join-Path $out $tx;New-Item -ItemType Directory $dir -Force|Out-Null;@{format='sokna-windows-install-plan-v3';schema_version=3;transaction_id=$tx;correlation_id='c';setup_session_id='s';shell_root=$shell}|ConvertTo-Json|Set-Content "$dir/plan.json" -Encoding utf8
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$shell/bootstrap-local-slot-r6.ps1" -PlanFile "$dir/plan.json";if($LASTEXITCODE){throw "Signed bootstrap failed: $LASTEXITCODE"}
          $e=Get-Content "$dir/local-slot-bootstrap.json" -Raw|ConvertFrom-Json;$q=Get-Content $cap -Raw|ConvertFrom-Json
          if($e.status-ne'committed'-or$e.operation_id-ne'fake-r6'-or-not[bool]$e.activation_performed-or-not[bool]$q.ok-or$q.path-ne'/v1/local-slots/migrate'-or$q.key-ne'web-adapter'-or$q.body.expected_build-ne'3.0.0-g6.2-workspace.231ai-browser-recovery-managed-inventory'-or[int]$q.body.expected_managed_files-ne497-or$q.body.expected_managed_tree_sha256-ne'b0e252b62b804c00e25c925d31ded8986fa23c3ab0d58b668eb79a79b961f56a'){throw 'Signed Supervisor bootstrap contract failed'}
          if((Get-Content "$dir/local-slot-bootstrap.json" -Raw).Contains($b64)){throw 'Secret leaked into evidence'}
          Copy-Item "$dir/local-slot-bootstrap.json" "$out/local-slot-bootstrap-positive.json";try{$sp.WaitForExit(5000)|Out-Null}catch{};Cleanup
          Write-Host 'Signed Supervisor bootstrap: PASS'

      - name: Build final installer and evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$iscc=@("${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe","$env:ProgramFiles/Inno Setup 6/ISCC.exe")|Where-Object{$_ -and(Test-Path $_)}|Select-Object -First 1;if(-not$iscc){throw 'Inno Setup missing'}
          ./packaging/windows/scripts/build-installer-v4.ps1 -ShellPayloadRoot (Resolve-Path out-r6-final-r3/shell).Path -RepoRoot $PWD.Path -IsccExe $iscc;if($LASTEXITCODE){throw 'Installer build failed'}
          $exe='packaging/windows/installer/out-v4/SOKNA-Windows-Services-Setup-1.1.5.exe';$sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant();$d='out-r6-final-r3/delivery';New-Item -ItemType Directory $d -Force|Out-Null;Copy-Item $exe $d
          [ordered]@{format='sokna-windows-services-r6-final-qualification-v3';product_source_commit='65330eebdb179075228f4f96422ceb8abdee1e4a';failure_matrix_run=38995204758;core_lifecycle_run=38995697490;package_version='1.1.5';runtime='1.0.5';print_agent='6.2.9';maintenance='0.3.3';update_engine='0.3.3';recovery_console='0.1.1';keep_proof='no_stop_no_copy_no_registration_no_restart';production_local_migration_bridge=$true;bootstrap_via_signed_supervisor=$true;bootstrap_exact_231ai_allowlist=$true;bootstrap_non_target_safe_skip=$true;bootstrap_post_windows_commit_no_rollback=$true;database_mutation=$false;public_mutation=$false;windows_reboot=$false;installer_sha256=$sha}|ConvertTo-Json -Depth 7|Set-Content "$d/R6_FINAL_QUALIFICATION.json" -Encoding utf8
          Copy-Item out-r6-final-r3/local-slot-bootstrap-positive.json $d;Get-ChildItem $d -File|ForEach-Object{"$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"}|Set-Content "$d/SHA256SUMS.txt" -Encoding ascii;Write-Host "R6_FINAL_INSTALLER_SHA256=$sha"

      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-Windows-Services-1.1.5-R6-Final-Qualified-R3
          path: out-r6-final-r3/delivery
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          try{Stop-Service SoknaApache -Force -ErrorAction SilentlyContinue}catch{};& "$env:SystemRoot/System32/sc.exe" delete SoknaApache *> $null;$global:LASTEXITCODE=0

  promote:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-Windows-Services-1.1.5-R6-Final-Qualified-R3
          path: qualified
      - name: Publish exact qualified release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find qualified -name 'SOKNA-Windows-Services-Setup-1.1.5.exe' -type f -print -quit)"; ev="$(find qualified -name 'R6_FINAL_QUALIFICATION.json' -type f -print -quit)"; sums="$(find qualified -name 'SHA256SUMS.txt' -type f -print -quit)"; test -f "$exe" && test -f "$ev" && test -f "$sums"
          sha="$(sha256sum "$exe"|awk '{print $1}')"; recorded="$(python -c 'import json,sys;print(json.load(open(sys.argv[1],encoding="utf-8-sig"))["installer_sha256"])' "$ev")"; test "$sha" = "$recorded"
          python - "$ev" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf-8-sig')); assert j['package_version']=='1.1.5'; assert j['maintenance']=='0.3.3' and j['update_engine']=='0.3.3'; assert j['runtime']=='1.0.5' and j['print_agent']=='6.2.9' and j['recovery_console']=='0.1.1'; assert j['failure_matrix_run']==38995204758 and j['core_lifecycle_run']==38995697490; assert j['production_local_migration_bridge'] and j['bootstrap_via_signed_supervisor'] and j['bootstrap_post_windows_commit_no_rollback']; assert not j['database_mutation'] and not j['public_mutation'] and not j['windows_reboot']
          PY
          tag='windows-services-1.1.5-r6'; cat > notes.md <<EOF
          Production-qualified Maintenance V4 R6.

          - Runtime 1.0.5: KEEP, canonical byte-exact
          - Print Agent 6.2.9: KEEP, canonical byte-exact
          - Maintenance Supervisor / Update Engine 0.3.3: UPDATE
          - Recovery Console 0.1.1: KEEP, canonical byte-exact
          - Production Local slot migration bridge included
          - Exact 231ai one-time bootstrap uses signed loopback Supervisor HMAC; no direct Update Engine launch
          - Bootstrap runs only after Windows component commit; migration failure cannot roll back the new Maintenance needed for recovery
          - Unsupported/non-target Local baselines safely skip
          - No Local/Public DB mutation and no Windows reboot

          Installer SHA-256: $sha
          EOF
          gh release create "$tag" "$exe" "$ev" "$sums" --repo mobaraki20/SoknaCafeV3 --target '${{ github.sha }}' --title 'SOKNA Windows Services 1.1.5 — Maintenance V4 R6' --notes-file notes.md --prerelease
          digest="$(gh api repos/mobaraki20/SoknaCafeV3/releases/tags/$tag --jq '.assets[]|select(.name=="SOKNA-Windows-Services-Setup-1.1.5.exe")|.digest')"; test "$digest" = "sha256:$sha"; test "$(gh api repos/mobaraki20/SoknaCafeV3/releases/tags/$tag --jq .prerelease)" = true; test "$(gh api repos/mobaraki20/SoknaCafeV3/releases/tags/$tag --jq .draft)" = false; echo "FINAL_RELEASE_SHA256=$sha"
