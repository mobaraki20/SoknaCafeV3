name: Publish Windows Services 1.1.2 P3 R2 Pre-release

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-windows-services-1.1.2-p3-r2-prerelease.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish-prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: windows-services-1.1.2-p3-r2
      TARGET_SHA: e5e4c93b8b8506358b5e019762aca0c2b031a18b
      QUALIFIED_INSTALLER_SHA256: 8b0100dea27a569c2beb0c0d11db47fa5d3195f99cf38768722636d1ecb12a0d
    steps:
      - name: Download exact qualified compact artifact
        uses: actions/download-artifact@v4
        with:
          name: SOKNA-Phase3-Qualification-Bundle-R2-Compact
          path: qualified
          github-token: ${{ github.token }}
          repository: mobaraki20/SoknaCafeV3
          run-id: 38979979225

      - name: Verify and unpack exact qualified bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle='qualified/SOKNA-Phase3-Qualification-Bundle-R2.zip'
          test -s "$bundle"
          expected_bundle="$(awk 'NF{print $1; exit}' qualified/SHA256SUMS.txt)"
          actual_bundle="$(sha256sum "$bundle" | awk '{print $1}')"
          test "$actual_bundle" = "$expected_bundle"
          mkdir -p release-assets/unpacked
          unzip -q "$bundle" -d release-assets/unpacked
          test -s release-assets/unpacked/SOKNA-Windows-Services-Setup-1.1.2.exe
          test -s release-assets/unpacked/SOKNA-Phase3-Qualification.exe
          test -s release-assets/unpacked/P3_QUALIFICATION_R2.json
          test -s release-assets/unpacked/SHA256SUMS.txt
          actual="$(sha256sum release-assets/unpacked/SOKNA-Windows-Services-Setup-1.1.2.exe | awk '{print $1}')"
          test "$actual" = "$QUALIFIED_INSTALLER_SHA256"
          cp "$bundle" release-assets/SOKNA-Phase3-Qualification-Bundle-R2.zip
          cp qualified/SHA256SUMS.txt release-assets/BUNDLE_SHA256.txt
          cp release-assets/unpacked/SOKNA-Windows-Services-Setup-1.1.2.exe release-assets/
          cp release-assets/unpacked/SOKNA-Phase3-Qualification.exe release-assets/
          cp release-assets/unpacked/P3_QUALIFICATION_R2.json release-assets/
          cp release-assets/unpacked/SHA256SUMS.txt release-assets/ASSET_SHA256SUMS.txt

      - name: Create GitHub pre-release and upload qualified assets
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.md <<'EOF'
          ## SOKNA Windows Services 1.1.2 — Phase 3 Qualification R2

          **PRE-RELEASE / REAL TEST-HOST QUALIFICATION — NOT CAFE PRODUCTION YET**

          Exact already-qualified artifacts are promoted here; this is not a rebuild.

          Qualified source commit: `e5e4c93b8b8506358b5e019762aca0c2b031a18b`
          Phase 3 source baseline: `1a58608f30c5496ff53fd382a7e81070adb6ebaf`
          Qualification CI run: `38979405854` — PASS
          Compact delivery run: `38979979225` — PASS

          Components: Windows Services `1.1.2`, Runtime `1.0.5`, Print Agent `6.2.9`, Maintenance Supervisor `0.3.0`, Update Engine `0.3.0`, Recovery Console `0.1.1`, SetupHost plan-v3 `3.0.0`.

          Qualification evidence: Runtime/Print KEEP with `no_stop_no_copy_no_registration_no_restart`; DB mutation=false; Public mutation=false; Windows reboot=false.

          Installer SHA256: `8b0100dea27a569c2beb0c0d11db47fa5d3195f99cf38768722636d1ecb12a0d`

          Test host: run the installer first. Runtime and Print must remain KEEP/up-to-date; Maintenance moves to 0.3.0. Then run `SOKNA-Phase3-Qualification.exe` as Administrator. The qualification launcher is locked to exact Local 231ai / 497 managed files / canonical managed-tree digest.

          The installer mechanism is shared by test and Cafe; Cafe will only receive a one-time baseline-specific Legacy-to-Slots migration bridge after this qualification passes.
          EOF

          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET_SHA" --title 'SOKNA Windows Services 1.1.2 — Phase 3 Qualification R2' --notes-file release-notes.md --prerelease
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" \
            release-assets/SOKNA-Windows-Services-Setup-1.1.2.exe \
            release-assets/SOKNA-Phase3-Qualification.exe \
            release-assets/SOKNA-Phase3-Qualification-Bundle-R2.zip \
            release-assets/P3_QUALIFICATION_R2.json \
            release-assets/ASSET_SHA256SUMS.txt \
            release-assets/BUNDLE_SHA256.txt

      - name: Verify published pre-release
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url,isPrerelease,tagName,targetCommitish,assets > release.json
          jq -e '.isPrerelease == true' release.json >/dev/null
          jq -e '.tagName == "windows-services-1.1.2-p3-r2"' release.json >/dev/null
          jq -e '[.assets[].name] | index("SOKNA-Windows-Services-Setup-1.1.2.exe") != null' release.json >/dev/null
          jq -e '[.assets[].name] | index("SOKNA-Phase3-Qualification.exe") != null' release.json >/dev/null
          jq -e '[.assets[].name] | index("SOKNA-Phase3-Qualification-Bundle-R2.zip") != null' release.json >/dev/null
          cat release.json
