name: CI Windows Services 1.0.14 Version Visibility

on:
  workflow_dispatch:
  push:
    branches:
      - work/windows-services-1.0.14-component-version-visibility

permissions:
  contents: write

concurrency:
  group: ci-windows-services-1.0.14-version-visibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qualify:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Apply 1.0.14 component-version visibility source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $utf8=New-Object System.Text.UTF8Encoding($false)
          $dashboard='packaging/windows/setup-ui/PersianDashboardV2.cs'
          $text=[IO.File]::ReadAllText((Resolve-Path $dashboard))

          function Replace-Once([string]$old,[string]$new,[string]$label){
            $count=([regex]::Matches($script:text,[regex]::Escape($old))).Count
            if($count-ne1){throw "$label patch point count=$count"}
            $script:text=$script:text.Replace($old,$new)
          }

          Replace-Once @'
internal sealed record WindowsDashboardState(
    WindowsInstallState InstallState,
    string InstalledVersion,
    bool RuntimeInstalled,
    bool RuntimeRunning,
    bool PrintInstalled,
    bool PrintRunning,
    bool Paired,
    string LocalBaseUrl,
    bool PrerequisiteReady,
    string PrerequisiteVersion);
'@ @'
internal sealed record WindowsDashboardState(
    WindowsInstallState InstallState,
    string InstalledVersion,
    bool RuntimeInstalled,
    bool RuntimeRunning,
    string RuntimeVersion,
    bool PrintInstalled,
    bool PrintRunning,
    string PrintAgentVersion,
    bool Paired,
    string LocalBaseUrl,
    bool PrerequisiteReady,
    string PrerequisiteVersion);
'@ 'state-record'

          Replace-Once '        AddDetail(details, 2, "نسخه نصب‌شده", _versionDetail);' '        AddDetail(details, 2, "Windows Services", _versionDetail);' 'windows-services-label'

          Replace-Once @'
        var anyInstalled = runtime.Installed || print.Installed;
        var installedVersion = ReadInstalledVersion(anyInstalled);
'@ @'
        var anyInstalled = runtime.Installed || print.Installed;
        var installedVersion = ReadInstalledVersion(anyInstalled);
        var runtimeVersion = ReadServiceBinaryVersion(RuntimeService);
        var printAgentVersion = ReadServiceBinaryVersion(PrintService);
'@ 'read-component-versions'

          Replace-Once @'
            runtime.Installed,
            runtime.Running,
            print.Installed,
            print.Running,
            paired,
'@ @'
            runtime.Installed,
            runtime.Running,
            runtimeVersion,
            print.Installed,
            print.Running,
            printAgentVersion,
            paired,
'@ 'state-constructor'

          Replace-Once @'
        _runtimeDetail.Text = state.RuntimeInstalled
            ? state.RuntimeRunning ? "نصب شده • در حال اجرا" : "نصب شده • متوقف"
            : "نصب نشده";
        _printDetail.Text = state.PrintInstalled
            ? state.PrintRunning ? "نصب شده • در حال اجرا" : "نصب شده • متوقف"
            : "نصب نشده";
        _versionDetail.Text = string.IsNullOrWhiteSpace(state.InstalledVersion) ? "قابل تشخیص نیست" : state.InstalledVersion;
'@ @'
        _runtimeDetail.Text = ComponentStatus(state.RuntimeInstalled, state.RuntimeRunning, state.RuntimeVersion);
        _printDetail.Text = ComponentStatus(state.PrintInstalled, state.PrintRunning, state.PrintAgentVersion);
        _versionDetail.Text = string.IsNullOrWhiteSpace(state.InstalledVersion) ? "قابل تشخیص نیست" : state.InstalledVersion;
'@ 'render-component-versions'

          Replace-Once @'
            true,
            true,
            true,
            true,
            true,
            "http://127.0.0.1:18080/",
'@ @'
            true,
            true,
            "1.0.2",
            true,
            true,
            "6.2.9",
            true,
            "http://127.0.0.1:18080/",
'@ 'layout-test-state'

          $marker='    private string ReadInstalledVersion(bool anyInstalled)'
          if(([regex]::Matches($text,[regex]::Escape($marker))).Count-ne1){throw 'version-helper insertion point missing'}
          $helpers=@'
    private static string ReadServiceBinaryVersion(string serviceName)
    {
        try
        {
            var image = ReadServiceImage(serviceName);
            var executable = Environment.ExpandEnvironmentVariables(ExtractExecutablePath(image));
            if (string.IsNullOrWhiteSpace(executable) || !File.Exists(executable)) return "";
            var info = FileVersionInfo.GetVersionInfo(executable);
            var raw = !string.IsNullOrWhiteSpace(info.ProductVersion) ? info.ProductVersion : info.FileVersion;
            return string.IsNullOrWhiteSpace(raw) ? "" : NormalizeVersion(raw);
        }
        catch { return ""; }
    }

    private static string ComponentStatus(bool installed, bool running, string version)
    {
        if (!installed) return "نصب نشده";
        var versionText = string.IsNullOrWhiteSpace(version) ? "نسخه نامشخص" : $"نسخه {version}";
        return $"نصب شده • {versionText} • {(running ? "در حال اجرا" : "متوقف")}";
    }

'@
          $text=$text.Replace($marker,$helpers+$marker)
          [IO.File]::WriteAllText((Resolve-Path $dashboard),$text,$utf8)

          $versionPath='packaging/windows/WINDOWS_SERVICES_VERSION.txt'
          $current=([IO.File]::ReadAllText((Resolve-Path $versionPath))).Trim()
          if($current-ne'1.0.13'){throw "Expected 1.0.13 base, got $current"}
          [IO.File]::WriteAllText((Resolve-Path $versionPath),"1.0.14`n",$utf8)

          $compat='packaging/windows/windows-services-compatibility-v1.json'
          $compatText=[IO.File]::ReadAllText((Resolve-Path $compat))
          if(-not$compatText.Contains('"package_version": "1.0.13"')){throw 'compatibility base package version missing'}
          $compatText=$compatText.Replace('"package_version": "1.0.13"','"package_version": "1.0.14"')
          [IO.File]::WriteAllText((Resolve-Path $compat),$compatText,$utf8)

          $notes='packaging/windows/WINDOWS_SERVICES_1.0.14_NOTES_FA.md'
          $noteText=@'
# SOKNA Windows Services 1.0.14 — Component Version Visibility

- Windows Services: 1.0.14
- Windows Runtime: 1.0.2 (unchanged)
- Print Agent: 6.2.9 (unchanged)
- The active Persian dashboard now shows the independently installed Runtime and Print Agent executable versions next to each service status.
- Windows Services package version remains independently visible.
- Installed component versions are read from the actual Windows Service ImagePath executable metadata; protocol/contract numbers are not presented as software versions.
- Local/Public are outside this release scope.
'@
          [IO.File]::WriteAllText((Join-Path (Resolve-Path .) $notes),$noteText.TrimStart()+"`n",$utf8)

          git config user.name 'SOKNA Windows Qualification'
          git config user.email 'windows-qualification@local.invalid'
          git add -- $dashboard $versionPath $compat $notes
          $changed=@(git diff --cached --name-only)
          $expected=@($dashboard,$versionPath,$compat,$notes)|Sort-Object
          $actual=@($changed)|Sort-Object
          if(($actual -join "`n")-ne($expected -join "`n")){Write-Host ($actual -join "`n");throw 'Unexpected 1.0.14 source delta'}
          git commit -m 'feat(windows): show installed component versions in 1.0.14 [skip ci]'
          git push origin HEAD:${{ github.ref_name }}
          $head=(git rev-parse HEAD).Trim()
          "SOURCE_COMMIT=$head" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify release identity and version contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $pkg=(Get-Content packaging/windows/WINDOWS_SERVICES_VERSION.txt -Raw).Trim()
          if($pkg-ne'1.0.14'){throw "Unexpected Windows Services version: $pkg"}
          [xml]$runtime=Get-Content windows/runtime/source/Sokna.Runtime.Service.csproj -Raw
          if([string]$runtime.Project.PropertyGroup.Version-ne'1.0.2'){throw 'Runtime version changed unexpectedly'}
          [xml]$agent=Get-Content windows/print-agent/source/Directory.Build.props -Raw
          if([string]$agent.Project.PropertyGroup.SoknaAgentVersion-ne'6.2.9'){throw 'Print Agent version changed unexpectedly'}
          $d=Get-Content packaging/windows/setup-ui/PersianDashboardV2.cs -Raw
          foreach($needle in @('string RuntimeVersion','string PrintAgentVersion','ReadServiceBinaryVersion(RuntimeService)','ReadServiceBinaryVersion(PrintService)','Environment.ExpandEnvironmentVariables(ExtractExecutablePath(image))','FileVersionInfo.GetVersionInfo(executable)','ComponentStatus(state.RuntimeInstalled, state.RuntimeRunning, state.RuntimeVersion)','ComponentStatus(state.PrintInstalled, state.PrintRunning, state.PrintAgentVersion)','AddDetail(details, 2, "Windows Services", _versionDetail)')){if(-not$d.Contains($needle)){throw "Version visibility contract missing: $needle"}}
          Write-Host 'Windows Services 1.0.14 component version contract: PASS'

      - name: Build Runtime 1.0.2
        shell: powershell
        run: dotnet build windows/runtime/source/Sokna.Runtime.Service.csproj -c Release

      - name: Build and test Print Agent 6.2.9
        working-directory: windows/print-agent/source
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          dotnet build Sokna.PrintWorker.slnx -c Release
          dotnet run --project tests/Sokna.PrintAgent.Tests/Sokna.PrintAgent.Tests.csproj -c Release

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Windows Services 1.0.14
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path .).Path
          $out=Join-Path $root 'release\out-windows-1.0.14'
          $iscc=@("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if(-not$iscc){throw 'ISCC missing'}
          & release/build-windows-release.ps1 -RepoRoot $root -OutputRoot $out -IsccExe $iscc
          $setup=Join-Path $out 'SOKNA-Windows-Services-Setup-1.0.14.exe'
          if(-not(Test-Path $setup)){throw 'Windows Services 1.0.14 installer missing'}
          $ui=Join-Path $out 'SoknaSetupUi.exe'
          $uiInfo=[Diagnostics.FileVersionInfo]::GetVersionInfo($ui)
          if([string]$uiInfo.ProductVersion-ne'1.0.14'){throw "Setup UI version mismatch: $($uiInfo.ProductVersion)"}
          $index=Get-Content (Join-Path $out 'artifact-index.json') -Raw|ConvertFrom-Json
          if([string]$index.source_commit-ne$env:SOURCE_COMMIT){throw 'artifact source commit mismatch'}
          if([string]$index.runtime.version-ne'1.0.2'){throw 'runtime artifact version mismatch'}
          if([string]$index.print_agent.version-ne'6.2.9'){throw 'print agent artifact version mismatch'}
          Write-Host 'Windows Services 1.0.14 build: PASS'

      - name: Run Setup UI layout self-test
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $ui=(Resolve-Path 'release\out-windows-1.0.14\SoknaSetupUi.exe').Path
          $diag=Join-Path $env:RUNNER_TEMP 'sokna-1.0.14-layout'
          & $ui --layout-self-test $diag
          if($LASTEXITCODE-ne0){throw 'Setup UI layout self-test failed'}
          Get-ChildItem $diag -Filter 'layout-*.txt' | ForEach-Object { if((Get-Content $_.FullName -Raw).Trim()-ne'PASS'){throw "Layout failed: $($_.Name)"} }

      - name: Qualify installer awareness
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $installer=(Resolve-Path 'release\out-windows-1.0.14\SOKNA-Windows-Services-Setup-1.0.14.exe').Path
          $diag=Join-Path (Resolve-Path .) 'release\installer-awareness-1.0.14'
          & packaging/windows/tests/qualify-installer-awareness.ps1 -InstallerPath $installer -DiagnosticsRoot $diag

      - name: Freeze final release kit
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $out=(Resolve-Path 'release\out-windows-1.0.14').Path
          $installer=Join-Path $out 'SOKNA-Windows-Services-Setup-1.0.14.exe'
          $runtimeZip=Get-ChildItem (Join-Path $out 'runtime') -Filter 'SoknaRuntime-1.0.2-win-x64.zip' | Select-Object -First 1
          $printZip=Get-ChildItem (Join-Path $out 'print') -Filter 'SoknaPrintAgent-6.2.9-win-x64.zip' | Select-Object -First 1
          if(-not$runtimeZip-or-not$printZip){throw 'component artifacts missing'}
          $qualification=Join-Path $out 'WINDOWS_SERVICES_1.0.14_QUALIFICATION.txt'
          @(
            'SOKNA Windows Services 1.0.14 — FINAL BUILD QUALIFICATION',
            "source_commit=$env:SOURCE_COMMIT",
            'windows_services_version=1.0.14',
            'runtime_version=1.0.2 unchanged',
            'print_agent_version=6.2.9 unchanged',
            'component_version_visibility=PASS',
            'version_source=installed_service_executable_metadata',
            'protocol_contract_not_used_as_software_version=PASS',
            'runtime_build=PASS',
            'print_agent_build_regression=PASS',
            'setup_ui_layout=PASS',
            'installer_build=PASS',
            'installer_awareness=PASS',
            ('installer_sha256='+(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()),
            ('runtime_zip_sha256='+(Get-FileHash $runtimeZip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()),
            ('print_agent_zip_sha256='+(Get-FileHash $printZip.FullName -Algorithm SHA256).Hash.ToLowerInvariant())
          ) | Set-Content $qualification -Encoding utf8
          Copy-Item 'packaging\windows\WINDOWS_SERVICES_1.0.14_NOTES_FA.md' (Join-Path $out 'WINDOWS_SERVICES_1.0.14_NOTES_FA.md') -Force
          $hashes=Join-Path $out 'SHA256SUMS-FINAL.txt'
          @($installer,$runtimeZip.FullName,$printZip.FullName,(Join-Path $out 'artifact-index.json'),$qualification,(Join-Path $out 'WINDOWS_SERVICES_1.0.14_NOTES_FA.md')) | ForEach-Object { "$( (Get-FileHash $_ -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_))" } | Set-Content $hashes -Encoding utf8
          $kit=Join-Path $out 'SOKNA-Windows-Services-1.0.14-FINAL-Release-Kit.zip'
          if(Test-Path $kit){Remove-Item $kit -Force}
          Compress-Archive -Path $installer,$runtimeZip.FullName,$printZip.FullName,(Join-Path $out 'artifact-index.json'),$qualification,(Join-Path $out 'WINDOWS_SERVICES_1.0.14_NOTES_FA.md'),$hashes -DestinationPath $kit -CompressionLevel Optimal

      - name: Upload final Windows Services 1.0.14
        uses: actions/upload-artifact@v4
        with:
          name: SOKNA-Windows-Services-1.0.14-FINAL
          if-no-files-found: error
          retention-days: 90
          path: |
            release/out-windows-1.0.14/SOKNA-Windows-Services-Setup-1.0.14.exe
            release/out-windows-1.0.14/SOKNA-Windows-Services-1.0.14-FINAL-Release-Kit.zip
            release/out-windows-1.0.14/runtime/SoknaRuntime-1.0.2-win-x64.zip
            release/out-windows-1.0.14/print/SoknaPrintAgent-6.2.9-win-x64.zip
            release/out-windows-1.0.14/artifact-index.json
            release/out-windows-1.0.14/WINDOWS_SERVICES_1.0.14_QUALIFICATION.txt
            release/out-windows-1.0.14/WINDOWS_SERVICES_1.0.14_NOTES_FA.md
            release/out-windows-1.0.14/SHA256SUMS-FINAL.txt
