name: SOKNA R199 settled-order cancellation finance proof on exact R197 - QA only
on:
  push:
    branches: [qa/sokna-r199-postsettlement-finance-proof-20261113]
    paths:
      - 'qa/sokna-r199/**'
      - '.github/workflows/sokna-r199-finance-mariadb.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  finance-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: r199-disposable-only
        ports:
          - 3306:3306
    env:
      SOKNA_R199_DISPOSABLE_ONLY: 'YES'
      SOKNA_R199_DB_PASSWORD: r199-disposable-only
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql,mbstring,curl,gd,zip
          coverage: none
      - name: Wait for temporary MariaDB (non-production)
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if php -r 'try{new PDO("mysql:host=127.0.0.1;port=3306","root",getenv("SOKNA_R199_DB_PASSWORD"));exit(0);}catch(Throwable $e){exit(1);}' ; then
              echo PASS_R199_DISPOSABLE_MARIADB_READY; exit 0
            fi
            sleep 2
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: R197-EXACT-WINDOWS-QUALIFIED-NO-CAFE-AUTO-DEPLOY
          run-id: 43473665017
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r197-artifact
      - name: Verify exact Windows-qualified R197 source parent
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE=$(find "$RUNNER_TEMP/r197-artifact" -type f -name 'SOKNA-R197-LOCAL-231EZ-59BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip' -print -quit)
          test -n "$ARCHIVE"
          echo "282a7cee20f7fa5e0ba99cf9383a5f019e6e2b7f18a54712cdaeb87749af860f  $ARCHIVE" | sha256sum -c -
          ROOT="$RUNNER_TEMP/r199"
          mkdir -p "$ROOT/outer" "$ROOT/web"
          unzip -q "$ARCHIVE" -d "$ROOT/outer"
          unzip -q "$ROOT/outer/artifacts/local/web.zip" -d "$ROOT/web"
          echo "SOKNA_R199_WEB=$ROOT/web" >> "$GITHUB_ENV"
          php -l qa/sokna-r199/test_financial_cancel_mariadb.php
      - name: Execute five real financial-reversal safety scenarios without altering source
        shell: bash
        run: |
          set -euo pipefail
          php qa/sokna-r199/test_financial_cancel_mariadb.php
          echo PASS_R199_POST_SETTLEMENT_FINANCE_PROOF_COMPLETED
