name: SOKNA A11 full authenticated pages and real DB grouped QA
on:
  push:
    branches: [qa/post-release-a10-20261128]
    paths: [.github/workflows/sokna-post-release-a10-db.yml]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
      SOKNA_QA_DISPOSABLE: YES
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download last controlled Local delivery
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46067310389
          name: SOKNA-LOCAL-231GK-CAFE-CONTROLLED-OPERATOR-DELIVERY
          path: ${{ runner.temp }}/a11-input/local
      - name: Download last controlled Public delivery
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46063873053
          name: SOKNA-PUBLIC-35JB-CONTROLLED-OPERATOR-DELIVERY
          path: ${{ runner.temp }}/a11-input/public
      - name: Exact last delivery plus cumulative fixes
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cp148-qa"
          mkdir -p "$W"
          python3 - "$W" "$RUNNER_TEMP/a11-input" <<'PY' | tee "$W/source-results.txt"
          import pathlib,hashlib,sys,zipfile,io
          W,I=map(pathlib.Path,sys.argv[1:]); H=lambda b:hashlib.sha256(b).hexdigest()
          def exact(p,h):
              b=p.read_bytes();assert H(b)==h,(p,H(b));return b
          local=exact(I/'local/SOKNA-LOCAL-231GK-CAFE-CONTROLLED-UPDATE.zip','79ea97f6be0577c9c724865f0fe271cff8dbb3bf078f12825fa91c6b091a5b45')
          local=zipfile.ZipFile(io.BytesIO(local)).read('artifacts/local/web.zip')
          assert H(local)=='fafcb63d1c9f7fd1a014836bf2e7f33bf09a1cc30137fa01ab6f056e779d01e8'
          public=exact(I/'public/SOKNA-PUBLIC-35JB-CONTROLLED-CLEAN.zip','09fd9b7f7b968fa8721a5944c82970f702180c82b77e2b66c37104c87d1b725f')
          expected={'local':(626,'b8019526c9fcbbe65bc5cf564769e62ca9175b956dfaee8cade6097f60309b52'),'public':(258,'239d2cbb5651463ab24bb5bb867b6dc727318e930ecf13f3b6c9956897faa77c')}
          for host,b in [('local',local),('public',public)]:
              z=zipfile.ZipFile(io.BytesIO(b));assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
              r=W/host;z.extractall(r)
              paths=sorted(p.relative_to(r).as_posix() for p in r.rglob('*') if p.is_file())
              actual=H(''.join(p+'\0'+H((r/p).read_bytes())+'\n' for p in paths).encode())
              assert (len(paths),actual)==expected[host],(host,len(paths),actual)
              print('PASS EXACT DELIVERY',host,len(paths),actual)
          PY
          base64 -d qa/post-release-a10/rebase.b64 > "$W/rebase.patch.gz"
          echo '061db84e5b3175fcb59023ea50815a6a434b59c2b91720ab9f30f12fa42047b0  '"$W/rebase.patch.gz" | sha256sum -c -
          gzip -dc "$W/rebase.patch.gz" > "$W/rebase.patch"
          (cd "$W"; git apply --check rebase.patch; git apply rebase.patch)
          python3 - "$W" <<'PY' | tee -a "$W/source-results.txt"
          import pathlib,hashlib,sys
          root=pathlib.Path(sys.argv[1]);H=lambda b:hashlib.sha256(b).hexdigest()
          expected={'local':(626,'f7687a2d4c6af1fbc749fe94c36c3111888a3853c75a277a507c49d5b35cf907'),'public':(258,'07715d03571d542cc1f6c862ec1fb266e6cc2b3995f2c6e291c11cc1ba11c2c2')}
          for host,(n,sha) in expected.items():
              r=root/host; paths=sorted(p.relative_to(r).as_posix() for p in r.rglob('*') if p.is_file()); actual=H(''.join(p+'\0'+H((r/p).read_bytes())+'\n' for p in paths).encode())
              assert len(paths)==n and actual==sha,(host,len(paths),actual)
              print('PASS EXACT A11',host,n,actual)
          PY
      - name: Run real Local clean install and A10 grouped critical DB acceptance
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cp148-qa"
          export TMPDIR="$W"
          php qa/cp148/preflight.php
          php qa/cp160/fixture.php "$W/local" | tee "$W/fixture-results.txt"
          php -l qa/post-release-a10/critical.php
          php qa/post-release-a10/critical.php "$W/local" | tee "$W/critical-results.txt"
      - name: Run real Public clean schema and reapply
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cp148-qa"
          test -f "$W/cp144-fixture.json"
          export TMPDIR="$W"
          php qa/cp160/public-fixture.php "$W/public" | tee "$W/public-results.txt"
          php -r 'require $argv[1]."/bootstrap.php";$cfg=require $argv[1]."/config.php";if(($cfg["db"]["host"]??"")!=="127.0.0.1"||($cfg["db"]["name"]??"")!=="sokna_cp150_public")exit(2);$core=sokna_public_bootstrap($cfg);$m=$core->migrations();if($m->pendingVersions()!==[]||$m->migrate()!==[]||$m->migrate()!==[])exit(3);echo "PASS Public clean schema and twice reapply no-op\n";' "$W/public" | tee -a "$W/public-results.txt"
      - name: Real authenticated Local and Public full pages, grouped Chromium
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cp148-qa"
          test -f "$W/cp144-fixture.json"
          npm install --prefix "$W/pw" playwright
          export TMPDIR="$W" RUNNER_TEMP="$W"
          PHP_CLI_SERVER_WORKERS=6 php -S 127.0.0.1:18765 -t "$W/local/public" >"$W/local-http.log" 2>&1 & lp=$!
          PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:18766 -t "$W/public" "$W/public/index.php" >"$W/public-http.log" 2>&1 & pp=$!
          trap 'kill "$lp" "$pp" 2>/dev/null || true' EXIT
          sleep 2
          php qa/cp160/worker.php "$W/local" init | tee "$W/sync-results.txt"
          node qa/post-release-a10/browser.cjs 2>&1 | tee "$W/browser-results.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-A11-FULL-PAGE-GATE-EVIDENCE-NO-INSTALL
          path: |
            ${{ runner.temp }}/cp148-qa/*-results.txt
            ${{ runner.temp }}/cp148-qa/*-http.log
            ${{ runner.temp }}/cp148-qa/screenshots/*.png
          retention-days: 7
          if-no-files-found: warn
