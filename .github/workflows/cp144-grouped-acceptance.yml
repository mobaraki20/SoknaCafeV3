h['status']??null]).PHP_EOL;exit;\n}\nQAEOF\ncat > \"$RUNNER_TEMP/cp144-browser.cjs\" <<'QAEOF'\nconst {chromium}=require(process.env.RUNNER_TEMP+'/pw/node_modules/playwright'),fs=require('fs');const f=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/cp144-fixture.json')),local='http://127.0.0.1:18765',pub='http://127.0.0.1:18766/public',shots=process.env.RUNNER_TEMP+'/cp144-screenshots';fs.mkdirSync(shots,{recursive:true});let fail=0;\nfunction ck(x,n){if(!x)throw Error(n);console.log('PASS '+n)}async function group(n,fn){try{await fn();console.log('GROUP PASS '+n)}catch(e){fail++;console.log('GROUP FAIL '+n+' '+e.stack)}}\nasync function auth(p,base,user){await p.goto(base+(base===local?'/login.php':'/staff/login'));const h=p.locator('[data-login-selection]');await h.waitFor({state:'attached'});const key=base===local?user:'user:'+f.users.find(u=>u.name===user).id;if(await h.inputValue()!==key){await p.locator('.sc-login-flow-change').click();await p.locator(`[data-login-account][data-account-key=\"${key}\"]`).click();await p.locator('.sc-login-stable-picker').waitFor({state:'hidden'});}await p.locator('input[name=password]').fill(user==='qa-target'?'synthetic-qa-admin-not-real':'synthetic-member-only');await Promise.all([p.waitForNavigation(),p.locator('form[data-login-form] button[type=submit]').click()]);ck(!p.url().includes('/login'),'login '+user+' '+base);}\nasync function snapshot(p){const r=await p.request.get(local+'/admin/api.php?action=snapshot');ck(r.ok(),'admin snapshot');return (await r.json()).snapshot}\nasync function post(p,path,data){const csrf=await p.locator('[data-admin-workspace]').getAttribute('data-csrf');const r=await p.request.post(local+path,{data:{...data,csrf_token:csrf}});return {status:r.status(),body:await r.json()}}\nasync function shot(p,n){await p.screenshot({path:shots+'/'+n+'.png',animations:'disabled'})}\n(async()=>{const b=await chromium.launch({channel:'chrome',headless:true});async function withPage(base,user,fn){const p=await b.newPage({viewport:{width:1280,height:900}});try{await auth(p,base,user);await fn(p)}finally{await p.close()}}\nawait group('ADM-L451 concurrent personnel HTTP',async()=>withPage(local,'qa-target',async a=>withPage(local,'qa-admin2',async d=>{await Promise.all([a.goto(local+'/admin/'),d.goto(local+'/admin/')]);const x=(await snapshot(a)).personnel.find(x=>+x.id===+f.personnel),y=(await snapshot(d)).personnel.find(x=>+x.id===+f.personnel);ck(x.edit_revision===y.edit_revision&&x.edit_revision.length===64,'shared stale revision');const body={action:'team_member_save',personnel_id:x.id,user_id:0,active:true,system_access:false,expected_personnel_revision:x.edit_revision};const rr=await Promise.all([post(a,'/admin/api.php',{...body,display_name:'QA144 edit A'}),post(d,'/admin/api.php',{...body,display_name:'QA144 edit B'})]);console.log('personnel status '+rr.map(r=>r.status+':'+(r.body.code||'ok')).join(' '));ck(rr.filter(r=>r.status===200).length===1&&rr.filter(r=>r.status===409&&r.body.code==='personnel_edit_conflict').length===1,'one commit one conflict');const z=(await snapshot(a)).personnel.find(z=>+z.id===+x.id);ck(z.display_name===(rr[0].status===200?'QA144 edit A':'QA144 edit B'),'winner preserved');const stale=await post(a,'/admin/api.php',{action:'personnel_save',id:x.id,display_name:'QA144 stale',expected_personnel_revision:x.edit_revision});ck(stale.status===409&&stale.body.code==='personnel_edit_conflict','direct endpoint also rejects stale');const fresh=await post(a,'/admin/api.php',{action:'personnel_save',id:x.id,display_name:'QA144 fresh',expected_personnel_revision:z.edit_revision});ck(fresh.status===200,'fresh update allowed');})));\nawait group('ADM-L454 concurrent draft and deactivate HTTP',async()=>withPage(local,'qa-target',async a=>withPage(local,'qa-admin2',async d=>{await Promise.all([a.goto(local+'/admin/'),d.goto(local+'/admin/')]);for(const t of f.tables.slice(1,5)){const rr=await Promise.all([post(a,'/staff/api.php',{action:'draft_save',table_id:+t.id,expected_version:0,expected_session_id:0,items:[],note:'QA144 draft'}),post(d,'/admin/api.php',{action:'table_save',id:+t.id,name:t.name,table_number:+t.table_number,active:false})]);console.log('table status '+rr.map(r=>r.status+':'+(r.body.code||'ok')).join(' '));ck((rr[0].status===200&&rr[1].status===409&&rr[1].body.code==='table_live')||(rr[1].status===200&&rr[0].status===404&&rr[0].body.code==='invalid_table'),'one table winner '+t.id);const s=(await snapshot(a)).tables.find(x=>+x.id===+t.id);ck(!!+s.active===(rr[0].status===200),'table final state '+t.id)}})));\nawait group('STAFF-L096 browser date basis',async()=>withPage(local,'qa-staffreport',async p=>{await p.goto(local+'/staff-consumption/?tab=reports');const el=p.locator('[data-report-date-basis]');await el.waitFor({state:'visible'});ck((await el.textContent()).includes('\u062A\u0627\u0631\u06CC\u062E \u0645\u062F\u0646\u06CC'),'two date axes visible');await shot(p,'staff-date-desktop');await p.setViewportSize({width:390,height:844});await shot(p,'staff-date-mobile')}));\nfor(const base of [local,pub]){const n=base===local?'Local':'Public',page=base+(base===local?'/operations/':'/staff/operations/');await group('OPS-L163 '+n+' browser history',async()=>withPage(base,'qa-target',async p=>{await p.goto(page+'?tab=expenses&workflow=stock');const tab=(k)=>p.locator('[data-tab=\"'+k+'\"]'),view=k=>p.locator('[data-ops-workflow-view=\"'+k+'\"]');await p.locator('[data-expense-list]').getByText('QA144 expense marker',{exact:false}).waitFor({timeout:20000});ck(await tab('expenses').getAttribute('aria-selected')==='true','expense deep link rendered actual data');ck(!new URL(p.url()).searchParams.has('workflow'),'irrelevant workflow removed');await shot(p,n+'-expenses-desktop');await tab('inventory').click();await view('attention').waitFor({state:'visible'});await p.locator('[data-ops-workflow=\"purchase\"]').click();await view('purchase').waitFor({state:'visible'});await p.goBack();await view('attention').waitFor({state:'visible'});await p.goBack();await p.locator('[data-expense-list]').getByText('QA144 expense marker',{exact:false}).waitFor();await p.goForward();await view('attention').waitFor({state:'visible'});await p.setViewportSize({width:390,height:844});await shot(p,n+'-history-mobile');ck(true,'back forward exact content');}));await group('OPS-L163 '+n+' restricted route',async()=>withPage(base,'qa-stock',async p=>{await p.goto(page+'?tab=expenses');await p.locator('[data-panel=\"inventory\"]').waitFor({state:'visible'});ck(await p.locator('[data-tab=\"expenses\"]').count()===0,'restricted tab absent');ck(new URL(p.url()).searchParams.get('tab')!=='expenses','restricted route canonicalized')}))}\nawait group('REP-L281 Public stale capability HTTP',async()=>withPage(pub,'qa-staffreport',async p=>{for(const path of ['/api/staff/read?model=reports','/api/staff/read/watch?models=reports&wait_ms=0','/staff/reports-adapter?action=report','/staff/reports-adapter?action=item_groups','/staff/reports/']){const r=await p.request.get(pub+path);ck(r.status()===403,'blocked stale capability '+path)}}));\nfor(const u of ['qa-cashier','qa-supervisor','qa-target'])await group('REP-L281 Public allowed '+u,async()=>withPage(pub,u,async p=>{const r=await p.request.get(pub+'/api/staff/read?model=reports');ck(r.status()===200,'permitted read');const a=(await r.json()).payload;ck(!!a,'report payload');ck(Object.hasOwn(a,'invoice_history_archive')===(u!=='qa-supervisor'),'invoice history boundary');if(u==='qa-cashier'){ck(!Object.hasOwn(a,'activity'),'activity not leaked');ck((await p.request.get(pub+'/staff/reports-adapter?action=activity')).status()===403,'cashier cannot query audit');}ck((await p.request.get(pub+'/api/staff/read/watch?models=reports&wait_ms=0')).status()===200,'watch allowed');ck((await p.request.get(pub+'/staff/reports/')).status()===200,'page allowed')}));await b.close();process.exitCode=fail?1:0})().catch(e=>{console.error(e);process.exitCode=1});\nQAEOF\nnpm install --prefix \"$RUNNER_TEMP/pw\" playwright --no-audit --no-fund\n"
    - name: Independent real MariaDB HTTP and browser groups
      run: 'set -uo pipefail

        cd "$RUNNER_TEMP"

        php cp144-test.php "$RUNNER_TEMP/local" 2>&1 | tee cp144-db-results.txt

        rc1=${PIPESTATUS[0]}

        if [ ! -f cp144-fixture.json ]; then echo ''Fixture failed before browser groups''; exit 1; fi

        php cp144-public.php "$RUNNER_TEMP/public" 2>&1 | tee cp144-public-results.txt

        rcp=${PIPESTATUS[0]}

        PHP_CLI_SERVER_WORKERS=6 php -S 127.0.0.1:18765 -t "$RUNNER_TEMP/local/public" > cp144-local.log 2>&1 &

        local_pid=$!

        PHP_CLI_SERVER_WORKERS=8 php -S 127.0.0.1:18766 -t "$RUNNER_TEMP/public" "$RUNNER_TEMP/public/index.php" > cp144-public.log 2>&1 &

        public_pid=$!

        trap ''kill "$local_pid" "$public_pid" 2>/dev/null || true'' EXIT

        sleep 2

        php cp144-sync.php "$RUNNER_TEMP/local" init 2>&1 | tee cp144-sync-results.txt

        rcs=${PIPESTATUS[0]}

        node cp144-browser.cjs 2>&1 | tee cp144-browser-results.txt

        rcb=${PIPESTATUS[0]}

        echo "Database=$rc1 PublicFixture=$rcp Sync=$rcs Browser=$rcb"

        [ "$rc1" = 0 ] && [ "$rcp" = 0 ] && [ "$rcs" = 0 ] && [ "$rcb" = 0 ]

        '
    - name: Capture synthetic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: SOKNA-CP144-GROUPED-QA
        path: '${{ runner.temp }}/cp144-*-results.txt

          ${{ runner.temp }}/cp144-screenshots/*.png

          ${{ runner.temp }}/cp144-local.log

          ${{ runner.temp }}/cp144-public.log'
        retention-days: 1
        if-no-files-found: ignore
