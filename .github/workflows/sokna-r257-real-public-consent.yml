name: SOKNA R257 Public Upgrade & Signed Receipt on Real R249 (QA ONLY)
on:
  push:
    branches: [qa/sokna-r257-existing-public-consent-receipt-20261116]
    paths:
      - r257/**
      - apps/public/src/Security/PublicMoveExistingOwnerActivation.php
      - apps/public/src/Security/PublicMoveConsentReceiptStore.php
      - apps/public/src/Setup/PublicMoveOwnerPrivatePath.php
      - .github/workflows/sokna-r257-real-public-consent.yml
  workflow_dispatch:
jobs:
  actual-public-setup:
    name: Exact R249 payload + 9 migrations + owner setup/consent E2E
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: qa-r256-only
          MARIADB_DATABASE: sokna_r256_qa
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable PHP dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql php-zip
          php -r 'foreach (["pdo_mysql","sodium","zip"] as $x) if (!extension_loaded($x)) exit(1);'
          php -l apps/public/src/Setup/PublicMoveOwnerPrivatePath.php
          php -l r257/test_integrated_setup.php
          python3 -m py_compile r257/integrate_real_public.py
      - name: Retrieve exact R249 CI artifact (never from a mutable release link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r249"
          gh run download 43749990301 -R "$GITHUB_REPOSITORY" -n sokna-r249-dual-baseline-gated-public-candidate -D "$RUNNER_TEMP/r249"
          find "$RUNNER_TEMP/r249" -maxdepth 4 -type f -printf '%P %s bytes\n'
          python3 - <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'r249'
          pin='5c887968b6fcec1126e2b1b3123552a9ba0ba2c7672d29774c05ec58fa5cd0e4'
          # Pin below is additionally checked by the integration script against R249 manifest/tree.
          matches=[]
          for p in root.rglob('*'):
           if p.is_file() and p.suffix.lower()=='.zip':
            d=hashlib.sha256(p.read_bytes()).hexdigest()
            print('found',p.name,d)
            if d==pin:matches.append(p)
          if len(matches)!=1:raise SystemExit('R256_R249_EXACT_ARTIFACT_NOT_FOUND')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'r249_path.txt'
          out.write_text(str(matches[0]))
          PY
      - name: Integrate only into pinned 228-file R249 source; never deploy
        run: |
          set -euo pipefail
          BASE="$(cat "$RUNNER_TEMP/r249_path.txt")"
          python3 r257/integrate_real_public.py --r249 "$BASE" --repo . --out "$RUNNER_TEMP/r256"
          python3 -m json.tool "$RUNNER_TEMP/r256/R257-SOURCE-OVERLAY-QA-PROOF.json" >/dev/null
          root="$RUNNER_TEMP/r256/qa-public-payload"
          for f in "$root"/bootstrap.php "$root"/src/Setup/PublicSetupService.php "$root"/src/Http/PublicHttpKernel.php "$root"/src/Setup/PublicMoveOwnerPrivatePath.php "$root"/src/Http/PublicMoveOwnerHttpAdapter.php; do php -l "$f"; done
          test "$(find "$root/database/migrations" -name '*.sql' | wc -l)" -eq 10
          echo PASS_R257_ACTUAL_35IC_SOURCE_OVERLAY_NO_INSTALLER_ZIP
      - name: Live MariaDB setup and consent from actual R249 source
        env:
          GITHUB_ACTIONS: 'true'
          R256_QA_DB_PASSWORD: qa-r256-only
        run: |
          set -euo pipefail
          export R256_QA_PUBLIC_ROOT="$RUNNER_TEMP/r256/qa-public-payload"
          cp -a "$R256_QA_PUBLIC_ROOT" "$RUNNER_TEMP/r256/qa-public-payload-root"
          # R249 operator ZIP intentionally excludes protected Emergency owner files.
          # Supply preexisting compatible fixtures ONLY in disposable QA runtime,
          # never merge them into the managed payload or distribution proof.
          mkdir -p "$R256_QA_PUBLIC_ROOT/src/Emergency"
          cp apps/public/src/Emergency/*.php "$R256_QA_PUBLIC_ROOT/src/Emergency/"
          php r257/test_integrated_setup.php | tee /tmp/r256-setup.txt
          grep -q 'R257_REAL_R249_INTEGRATED_OWNER_SETUP_PASS count=25' /tmp/r256-setup.txt
          # A second independent cafe/host installed at domain root, not /public.
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4","root",getenv("R256_QA_DB_PASSWORD"),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$p->exec("CREATE DATABASE sokna_r256_root_qa CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          export R256_QA_PUBLIC_ROOT="$RUNNER_TEMP/r256/qa-public-payload-root"
          mkdir -p "$R256_QA_PUBLIC_ROOT/src/Emergency"
          cp apps/public/src/Emergency/*.php "$R256_QA_PUBLIC_ROOT/src/Emergency/"
          R256_QA_HOST=public-cafe-green.example R256_QA_SUBDIR='' R256_QA_DB_NAME=sokna_r256_root_qa php r257/test_integrated_setup.php | tee /tmp/r256-root.txt
          grep -q 'R257_REAL_R249_INTEGRATED_OWNER_SETUP_PASS count=25' /tmp/r256-root.txt
          echo PASS_R257_TWO_INDEPENDENT_PUBLIC_INSTANCES_REAL_MARIADB_NO_HOST_DEPLOY
      - name: Upgrade an ALREADY installed R249 Public without reinstall or data reset
        env:
          GITHUB_ACTIONS: 'true'
          R257_QA_DB_PASSWORD: qa-r256-only
        run: |
          set -euo pipefail
          R249="$(cat "$RUNNER_TEMP/r249_path.txt")"
          OLD_ROOT="$RUNNER_TEMP/r257-old-public"
          UPGRADE_ROOT="$RUNNER_TEMP/r257-upgrade-public"
          mkdir -p "$OLD_ROOT"
          python3 - "$R249" "$OLD_ROOT" <<'PY'
          import pathlib,sys,zipfile
          archive,target=pathlib.Path(sys.argv[1]),pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive) as z:
           for member in z.namelist():
            if not member.startswith('payload/') or member.endswith('/'):continue
            relative=pathlib.PurePosixPath(member[8:])
            if not relative.parts or '..' in relative.parts or relative.is_absolute():raise SystemExit('INVALID_R249_FILE_PATH')
            output=target.joinpath(*relative.parts)
            output.parent.mkdir(parents=True,exist_ok=True)
            output.write_bytes(z.read(member))
          PY
          mkdir -p "$OLD_ROOT/src/Emergency"
          cp apps/public/src/Emergency/*.php "$OLD_ROOT/src/Emergency/"
          cp -a "$RUNNER_TEMP/r256/qa-public-payload" "$UPGRADE_ROOT"
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4","root",getenv("R257_QA_DB_PASSWORD"),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$p->exec("CREATE DATABASE sokna_r257_upgrade_qa CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          R257_QA_OLD_ROOT="$OLD_ROOT" php r257/prepare_existing_install.php | tee /tmp/r257-old-setup.txt
          grep -q 'R257_OLD_R249_EIGHT_MIGRATION_PAIRED_PUBLIC_CREATED' /tmp/r257-old-setup.txt
          cp "$OLD_ROOT/config.php" "$UPGRADE_ROOT/config.php"
          cp "$OLD_ROOT/install.lock" "$UPGRADE_ROOT/install.lock"
          R256_QA_PUBLIC_ROOT="$UPGRADE_ROOT" php r257/test_integrated_upgrade.php | tee /tmp/r257-upgrade.txt
          grep -q 'R257_EXISTING_R249_PUBLIC_REAL_UPGRADE_PASS count=' /tmp/r257-upgrade.txt
          echo PASS_R257_REAL_EXISTING_PUBLIC_UPGRADE_NO_REINSTALL_NO_DB_RESET
      - name: Verify universal decision register and established security primitives
        run: |
          set -euo pipefail
          python3 r251/check_decisions.py
          php r252/test-public-move-attestation.php | tail -1
          php r251/test-public-move-decision.php | tail -1
          ! grep -Eiq 'soknaspace|soknagroup|231ff|35ic' apps/public/src/Setup/PublicMoveOwnerPrivatePath.php
          echo PASS_R257_NO_CUSTOMER_RUNTIME_HARDCODE
      - uses: actions/upload-artifact@v4
        with:
          name: sokna-r257-real-public-source-audit-only
          path: ${{ runner.temp }}/r256/R257-SOURCE-OVERLAY-QA-PROOF.json
          retention-days: 30
