name: CI Windows Services 1.1.5 R6 Final Bootstrap

on:
  push:
    branches:
      - work/maintenance-v4-production-local-migration-bridge-r6
    paths:
      - .github/workflows/ci-windows-services-1.1.5-r6-final-bootstrap.yml

permissions:
  actions: read
  contents: write

jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze R6 product source and package identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $product='65330eebdb179075228f4f96422ceb8abdee1e4a'
          git merge-base --is-ancestor $product HEAD
          if($LASTEXITCODE-ne0){throw 'R6 product source is not an ancestor.'}
          $changed=@(git diff --name-only "$product..HEAD" -- windows/maintenance/src windows/maintenance/tests)
          if($changed.Count-ne0){throw "Maintenance product source changed after R6 failure-matrix qualification: $($changed -join ', ')"}
          if((Get-Content packaging/windows/WINDOWS_SERVICES_VERSION.txt -Raw).Trim()-ne'1.1.5'){throw 'Package version must be 1.1.5'}
          $m=Get-Content packaging/windows/windows-services-component-manifest-v2.json -Raw|ConvertFrom-Json
          $by=@{};foreach($c in $m.components){$by[$c.component_id]=$c}
          if($m.package_version-ne'1.1.5'-or$by.runtime.version-ne'1.0.5'-or$by.'print-agent'.version-ne'6.2.9'-or$by.maintenance.version-ne'0.3.3'-or$by.'maintenance-update-engine'.version-ne'0.3.3'-or$by.'maintenance-recovery-console'.version-ne'0.1.1'){throw 'Package/component identity mismatch'}
          Write-Host "R6_PRODUCT_SOURCE=$product"

      - name: PS5.1 parse bootstrap and wrapper
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('packaging/windows/scripts/bootstrap-local-slot-r6.ps1','packaging/windows/scripts/setup-windows-components-v6.ps1','packaging/windows/scripts/prepare-shell-payload-v5.ps1')){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|ForEach-Object{Write-Host $_.Message};throw "PS5.1 parse failed: $p"}
          }
          Write-Host 'PS5.1 bootstrap/wrapper parse: PASS'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download canonical unchanged components
        uses: actions/download-artifact@v4
        with:
          name: windows-services-1.1.0-canonical-components-r3-baseline
          path: recovered
          github-token: ${{ github.token }}
          repository: mobaraki20/SoknaCafeV3
          run-id: 38982932863

      - name: Lock canonical KEEP bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Sha($p){(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()}
          $checks=@{
            'recovered/runtime/SoknaRuntimeService.exe'='26deed62524278fa93a9a576d958f9177fe97c878b75829a8dc93a1440955afd';
            'recovered/print-worker/Service/Sokna.PrintAgent.Service.exe'='99565602163463e9bce0ca6b33933411635db87a03acaf03340d2a56d9c85ff4';
            'recovered/baseline-maintenance/recovery/SoknaMaintenanceRecoveryConsole.exe'='85989bc8d1096575b0fcfc7d7d55aa999674c20ac8092fd3ea16d90e574c17e9'
          }
          foreach($p in $checks.Keys){if((Sha $p)-ne$checks[$p]){throw "Canonical KEEP drift: $p"}}
          Write-Host 'Canonical Runtime/Print/Recovery bytes: PASS'

      - name: Publish R6 components and compose final shell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $PWD 'out-r6-final';New-Item -ItemType Directory -Path "$out/maintenance/app","$out/setup-ui","$out/setup-host" -Force|Out-Null
          dotnet publish windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/maintenance/app"
          if($LASTEXITCODE-ne0){throw 'Supervisor publish failed'}
          dotnet publish windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/maintenance/app"
          if($LASTEXITCODE-ne0){throw 'Engine publish failed'}
          dotnet publish packaging/windows/setup-ui/Sokna.SetupUi.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$out/setup-ui"
          if($LASTEXITCODE-ne0){throw 'Setup UI publish failed'}
          dotnet publish packaging/windows/setup-host-v3/Sokna.SetupHostV3.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/setup-host"
          if($LASTEXITCODE-ne0){throw 'Setup Host publish failed'}
          ./packaging/windows/scripts/prepare-shell-payload-v5.ps1 -RepoRoot $PWD.Path -OutputRoot "$out/shell" -RuntimeServiceExe (Resolve-Path recovered/runtime/SoknaRuntimeService.exe).Path -SetupHostExe "$out/setup-host/SoknaSetupHost.exe" -SetupUiExe "$out/setup-ui/SoknaSetupUi.exe" -PrintWorkerBundle (Resolve-Path recovered/print-worker).Path -MaintenanceAppBundle "$out/maintenance/app" -MaintenanceRecoveryBundle (Resolve-Path recovered/baseline-maintenance/recovery).Path -GitSha '65330eebdb179075228f4f96422ceb8abdee1e4a'
          if($LASTEXITCODE-ne0){throw 'R6 final shell composition failed'}

      - name: Verify final shell ownership and exact bridge glue
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Sha($p){(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()}
          $shell='out-r6-final/shell'
          foreach($name in @('setup-windows-components-v4.ps1','setup-windows-components-core-v5.ps1','bootstrap-local-slot-r6.ps1','local-slot-bootstrap-contract-v1.json')){if(-not(Test-Path "$shell/$name")){throw "Final shell missing $name"}}
          $wrapper=Get-Content "$shell/setup-windows-components-v4.ps1" -Raw
          $core=Get-Content "$shell/setup-windows-components-core-v5.ps1" -Raw
          $repoCore=Get-Content packaging/windows/scripts/setup-windows-components-v5.ps1 -Raw
          if($core-ne$repoCore){throw 'Qualified lifecycle core bytes/content changed while composing wrapper shell'}
          if(-not$wrapper.Contains('Post-commit migration bootstrap')-or-not$wrapper.Contains('windows_components_committed=$true')){throw 'R6 post-commit wrapper contract missing'}
          $boot=Get-Content "$shell/bootstrap-local-slot-r6.ps1" -Raw
          if($boot.Contains('SoknaMaintenanceUpdateEngine.exe')){throw 'Bootstrap bypasses Supervisor'}
          foreach($token in @('/v1/local-slots/migrate','X-Sokna-Signature','web-adapter')){if(-not$boot.Contains($token)){throw "Bootstrap HMAC contract token missing: $token"}}
          $contract=Get-Content "$shell/local-slot-bootstrap-contract-v1.json" -Raw|ConvertFrom-Json
          if($contract.entries[0].build-ne'3.0.0-g6.2-workspace.231ai-browser-recovery-managed-inventory'-or[int]$contract.entries[0].managed_files-ne497-or$contract.entries[0].managed_tree_sha256-ne'b0e252b62b804c00e25c925d31ded8986fa23c3ab0d58b668eb79a79b961f56a'){throw 'Bootstrap identity mismatch'}
          $pm=Get-Content "$shell/payload-manifest.json" -Raw|ConvertFrom-Json
          foreach($name in @('setup-windows-components-v4.ps1','setup-windows-components-core-v5.ps1','bootstrap-local-slot-r6.ps1','local-slot-bootstrap-contract-v1.json')){if(-not@($pm.files|Where-Object{$_.path-eq$name})){throw "Payload manifest omitted $name"}}
          $sv=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$shell/_payload/maintenance/app/SoknaMaintenanceSupervisor.exe")).FileVersion
          $ev=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$shell/_payload/maintenance/app/SoknaMaintenanceUpdateEngine.exe")).FileVersion
          if(-not$sv.StartsWith('0.3.3')-or-not$ev.StartsWith('0.3.3')){throw "Maintenance version mismatch: $sv / $ev"}
          Write-Host 'R6 final shell ownership/bootstrap contract: PASS'

      - name: Build actual installed R5 0.3.2 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git worktree add --detach out-r6-final/r5-src ba5ec72e4c57bbc65259a903656756b23d6e784a
          dotnet publish out-r6-final/r5-src/windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o out-r6-final/r5-maintenance/app
          dotnet publish out-r6-final/r5-src/windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o out-r6-final/r5-maintenance/app
          $sv=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path out-r6-final/r5-maintenance/app/SoknaMaintenanceSupervisor.exe)).FileVersion
          $ev=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path out-r6-final/r5-maintenance/app/SoknaMaintenanceUpdateEngine.exe)).FileVersion
          if(-not$sv.StartsWith('0.3.2')-or-not$ev.StartsWith('0.3.2')){throw "R5 baseline mismatch: $sv / $ev"}

      - name: Planner and wrapper lifecycle gate 0.3.2 to 0.3.3 with safe bootstrap skip
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Sha($p){(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()}
          function CleanupSvc($n){try{Stop-Service $n -Force -ErrorAction SilentlyContinue}catch{};& "$env:SystemRoot/System32/sc.exe" delete $n *> $null;$global:LASTEXITCODE=0;Start-Sleep -Milliseconds 300}
          foreach($n in @('SoknaApache','SoknaMaintenanceSupervisor','SoknaPrintWorker','SoknaRuntime')){CleanupSvc $n}
          $out=(Resolve-Path out-r6-final).Path;$shell=Join-Path $out 'shell';$install=Join-Path $out 'fixture-install';$data=Join-Path $out 'fixture-data'
          New-Item -ItemType Directory -Path $install,$data,"$data/runtime","$data/setup","$install/Maintenance/App","$install/Maintenance/Recovery" -Force|Out-Null
          Copy-Item recovered/runtime "$install/Runtime" -Recurse -Force;Copy-Item recovered/print-worker "$install/PrintAgent" -Recurse -Force;Copy-Item out-r6-final/r5-maintenance/app/* "$install/Maintenance/App" -Force;Copy-Item recovered/baseline-maintenance/recovery/* "$install/Maintenance/Recovery" -Force;Copy-Item windows/runtime/runtime-config.example.json "$data/runtime/runtime-config.json" -Force
          @{format='sokna-windows-services-install-state-v2';paired=$false;local_base_url=''}|ConvertTo-Json|Set-Content "$data/setup/windows-services-state.json" -Encoding utf8
          $rt=(Resolve-Path "$install/Runtime/SoknaRuntimeService.exe").Path;$pr=(Resolve-Path "$install/PrintAgent/Service/Sokna.PrintAgent.Service.exe").Path;$ms=(Resolve-Path "$install/Maintenance/App/SoknaMaintenanceSupervisor.exe").Path;$rc=(Resolve-Path "$install/Maintenance/Recovery/SoknaMaintenanceRecoveryConsole.exe").Path;$cfg=(Resolve-Path "$data/runtime/runtime-config.json").Path
          & "$env:SystemRoot/System32/sc.exe" create SoknaRuntime binPath= ('"'+$rt+'" --config "'+$cfg+'"') start= demand|Out-Null;if($LASTEXITCODE-ne0){throw 'runtime registration failed'}
          & "$env:SystemRoot/System32/sc.exe" create SoknaPrintWorker binPath= ('"'+$pr+'"') start= auto|Out-Null;if($LASTEXITCODE-ne0){throw 'print registration failed'}
          & "$env:SystemRoot/System32/sc.exe" create SoknaMaintenanceSupervisor binPath= ('"'+$ms+'"') start= auto|Out-Null;if($LASTEXITCODE-ne0){throw 'maintenance registration failed'}
          $h=Join-Path $out 'planner';New-Item -ItemType Directory $h -Force|Out-Null
          @'
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><Compile Include="..\..\packaging\windows\setup-ui\ComponentUpdatePlanner.cs" Link="ComponentUpdatePlanner.cs" /></ItemGroup></Project>
          '@|Set-Content "$h/Planner.csproj" -Encoding utf8
          @'
          using System.Text.Json; namespace Sokna.SetupUi; internal static class X { static int Main(string[] a){var p=ComponentUpdatePlanner.Build(a[0],a[1],a[2]);File.WriteAllText(a[3],JsonSerializer.Serialize(p.Rows.Select(r=>new{component_id=r.ComponentId,primary=r.Primary,current_version=r.CurrentVersion,target_version=r.TargetVersion,health=r.Health.ToString(),update_state=r.UpdateState,action=r.Action.ToString().ToUpperInvariant(),reason=r.Reason,installed_sha256=r.InstalledSha256,target_sha256=r.TargetSha256,service_name=r.ServiceName,transaction_group=r.TransactionGroup}),new JsonSerializerOptions{WriteIndented=true}));return 0;}}
          '@|Set-Content "$h/Program.cs" -Encoding utf8
          $rows=Join-Path $out 'plan-rows.json';dotnet run --project "$h/Planner.csproj" -c Release -- $shell $install $data $rows;if($LASTEXITCODE-ne0){throw 'planner failed'}
          $r=@(Get-Content $rows -Raw|ConvertFrom-Json);$map=@{};foreach($x in $r){$map[$x.component_id]=$x.action}
          if($map.runtime-ne'KEEP'-or$map.'print-agent'-ne'KEEP'-or$map.maintenance-ne'UPDATE'-or$map.'maintenance-update-engine'-ne'UPDATE'-or$map.'maintenance-recovery-console'-ne'KEEP'){throw "Unexpected R5->R6 plan: $($map|ConvertTo-Json -Compress)"}
          $before=@{runtime_hash=Sha $rt;runtime_time=(Get-Item $rt).LastWriteTimeUtc.ToString('o');print_hash=Sha $pr;print_time=(Get-Item $pr).LastWriteTimeUtc.ToString('o');recovery_hash=Sha $rc;recovery_time=(Get-Item $rc).LastWriteTimeUtc.ToString('o')}
          $tx='r6final-'+[guid]::NewGuid().ToString('N');$txdir=Join-Path $env:LOCALAPPDATA "SOKNA/Installer/logs/$tx";New-Item -ItemType Directory $txdir -Force|Out-Null
          $plan=@{format='sokna-windows-install-plan-v3';schema_version=3;transaction_id=$tx;correlation_id='corr-'+[guid]::NewGuid().ToString('N');setup_session_id='ui-'+[guid]::NewGuid().ToString('N');created_at_utc=[DateTime]::UtcNow.ToString('o');mode='install';shell_root=$shell;install_root=$install;data_root=$data;package_version='1.1.5';components=$r}
          $planPath=Join-Path $txdir 'update-plan.json';$plan|ConvertTo-Json -Depth 12|Set-Content $planPath -Encoding utf8
          $proc=Start-Process "$shell/SoknaSetupHost.exe" -ArgumentList @('--plan-file',('"'+$planPath+'"')) -Wait -PassThru -NoNewWindow
          if($proc.ExitCode-ne0){Get-ChildItem $txdir -File|%{Write-Host "---$($_.Name)";Get-Content $_ -Raw|Write-Host};throw "wrapper lifecycle failed: $($proc.ExitCode)"}
          $be=Get-Content "$txdir/local-slot-bootstrap.json" -Raw|ConvertFrom-Json
          if($be.status-ne'skipped'-or$be.code-ne'LOCAL_APACHE_NOT_INSTALLED'){throw "Expected safe bootstrap skip, got $($be|ConvertTo-Json -Compress)"}
          $after=@{runtime_hash=Sha $rt;runtime_time=(Get-Item $rt).LastWriteTimeUtc.ToString('o');print_hash=Sha $pr;print_time=(Get-Item $pr).LastWriteTimeUtc.ToString('o');recovery_hash=Sha $rc;recovery_time=(Get-Item $rc).LastWriteTimeUtc.ToString('o')}
          foreach($k in $before.Keys){if($before[$k]-ne$after[$k]){throw "KEEP mutation: $k"}}
          $sv=[Diagnostics.FileVersionInfo]::GetVersionInfo($ms).FileVersion;$ev=[Diagnostics.FileVersionInfo]::GetVersionInfo("$install/Maintenance/App/SoknaMaintenanceUpdateEngine.exe").FileVersion
          if(-not$sv.StartsWith('0.3.3')-or-not$ev.StartsWith('0.3.3')){throw "R6 Maintenance target not applied: $sv / $ev"}
          $events=@(Get-Content "$txdir/system-events.jsonl"|?{$_}|%{$_|ConvertFrom-Json})
          foreach($id in @('runtime','print-agent')){$row=@($events|?{$_.event_name-eq'component_action_completed'-and$_.component-eq$id-and$_.result-eq'kept'})|Select -First 1;if(-not$row-or$row.data.proof-ne'no_stop_no_copy_no_registration_no_restart'){throw "KEEP proof invalid: $id"}}
          if(-not@($events|?{$_.event_name-eq'local_slot_bootstrap_completed'})){throw 'Wrapper bootstrap completion event missing'}
          Copy-Item $rows "$out/plan-rows-first.json";Copy-Item "$txdir/install-result.json" "$out/install-result-first.json";Copy-Item "$txdir/system-events.jsonl" "$out/system-events-first.jsonl"
          Write-Host 'R6 wrapper lifecycle R5 0.3.2 -> R6 0.3.3 + safe non-Local skip: PASS'

      - name: Full wrapper positive bootstrap HMAC gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function CleanupSvc($n){try{Stop-Service $n -Force -ErrorAction SilentlyContinue}catch{};& "$env:SystemRoot/System32/sc.exe" delete $n *> $null;$global:LASTEXITCODE=0;Start-Sleep -Milliseconds 300}
          $out=(Resolve-Path out-r6-final).Path;$shell=Join-Path $out 'shell';$install=Join-Path $out 'fixture-install';$data=Join-Path $out 'fixture-data'
          $fakeRoot=Join-Path $out 'fake-local';New-Item -ItemType Directory -Path "$fakeRoot/Infrastructure/Apache24/bin","$fakeRoot/Web" -Force|Out-Null
          Copy-Item "$env:SystemRoot/System32/cmd.exe" "$fakeRoot/Infrastructure/Apache24/bin/httpd.exe" -Force
          '3.0.0-g6.2-workspace.231ai-browser-recovery-managed-inventory'|Set-Content "$fakeRoot/Web/VERSION.txt" -Encoding ascii
          CleanupSvc 'SoknaApache';$fakeExe=(Resolve-Path "$fakeRoot/Infrastructure/Apache24/bin/httpd.exe").Path;& "$env:SystemRoot/System32/sc.exe" create SoknaApache binPath= ('"'+$fakeExe+'"') start= demand|Out-Null;if($LASTEXITCODE-ne0){throw 'fake SoknaApache registration failed'}

          $maintRoot=Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::CommonApplicationData)) 'SOKNA/Maintenance';New-Item -ItemType Directory -Path "$maintRoot/secrets" -Force|Out-Null
          $key=[byte[]](0..31);$keyB64=[Convert]::ToBase64String($key);Set-Content "$maintRoot/secrets/web-adapter.key" $keyB64 -Encoding ascii
          @{format='sokna-maintenance-control-plane-v1';schema_version=1;protocol='1.0';base_url='http://127.0.0.1:17639/'}|ConvertTo-Json|Set-Content "$maintRoot/control-plane.json" -Encoding utf8
          $server=Join-Path $out 'fake-supervisor.py';$capture=Join-Path $out 'fake-supervisor-capture.json'
          @'
          import base64,hashlib,hmac,http.server,json,sys
          key=base64.b64decode(sys.argv[1]); capture=sys.argv[2]
          class H(http.server.BaseHTTPRequestHandler):
            def log_message(self,*a): pass
            def do_POST(self):
              n=int(self.headers.get('Content-Length','0')); body=self.rfile.read(n)
              bh=hashlib.sha256(body).hexdigest(); proto=self.headers.get('X-Sokna-Maintenance-Protocol',''); ts=self.headers.get('X-Sokna-Timestamp',''); nonce=self.headers.get('X-Sokna-Nonce',''); sig=self.headers.get('X-Sokna-Signature','')
              canonical='\n'.join(['POST',self.path,proto,ts,nonce,bh]).encode(); expected=hmac.new(key,canonical,hashlib.sha256).hexdigest()
              valid=(self.path=='/v1/local-slots/migrate' and proto=='1.0' and self.headers.get('X-Sokna-Key-Id')=='web-adapter' and hmac.compare_digest(sig,expected))
              json.dump({'valid_signature':valid,'path':self.path,'key_id':self.headers.get('X-Sokna-Key-Id'),'idempotency':self.headers.get('X-Sokna-Idempotency-Key'),'body':json.loads(body.decode())},open(capture,'w'))
              payload={'ok':valid,'operation_id':'fake-r6-bootstrap','state':'committed' if valid else 'unauthorized','code':'LOCAL_SLOT_MIGRATION_COMMITTED' if valid else 'AUTH_SIGNATURE_INVALID','requires_recovery_console':False,'data':{'operation':{'activation_performed':True}}}
              raw=json.dumps(payload).encode();self.send_response(200 if valid else 401);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(raw)));self.end_headers();self.wfile.write(raw)
              self.server._BaseServer__shutdown_request=True
          s=http.server.HTTPServer(('127.0.0.1',17639),H);s.handle_request()
          '@|Set-Content $server -Encoding utf8
          $sp=Start-Process python -ArgumentList @(('"'+$server+'"'),$keyB64,('"'+$capture+'"')) -PassThru -WindowStyle Hidden;Start-Sleep -Seconds 1

          $rows=@(Get-Content "$out/plan-rows-first.json" -Raw|ConvertFrom-Json)
          foreach($x in $rows){if($x.component_id-in@('maintenance','maintenance-update-engine')){$x.action='KEEP';$x.current_version='0.3.3';$x.installed_sha256=$x.target_sha256;$x.reason='verified'}}
          $tx='r6positive-'+[guid]::NewGuid().ToString('N');$txdir=Join-Path $env:LOCALAPPDATA "SOKNA/Installer/logs/$tx";New-Item -ItemType Directory $txdir -Force|Out-Null
          $plan=@{format='sokna-windows-install-plan-v3';schema_version=3;transaction_id=$tx;correlation_id='corr-'+[guid]::NewGuid().ToString('N');setup_session_id='ui-'+[guid]::NewGuid().ToString('N');created_at_utc=[DateTime]::UtcNow.ToString('o');mode='install';shell_root=$shell;install_root=$install;data_root=$data;package_version='1.1.5';components=$rows}
          $planPath=Join-Path $txdir 'update-plan.json';$plan|ConvertTo-Json -Depth 12|Set-Content $planPath -Encoding utf8
          $proc=Start-Process "$shell/SoknaSetupHost.exe" -ArgumentList @('--plan-file',('"'+$planPath+'"')) -Wait -PassThru -NoNewWindow
          if($proc.ExitCode-ne0){Get-ChildItem $txdir -File|%{Write-Host "---$($_.Name)";Get-Content $_ -Raw|Write-Host};throw "positive wrapper run failed: $($proc.ExitCode)"}
          $be=Get-Content "$txdir/local-slot-bootstrap.json" -Raw|ConvertFrom-Json;if($be.status-ne'committed'-or$be.operation_id-ne'fake-r6-bootstrap'-or-not[bool]$be.activation_performed){throw "Bootstrap evidence invalid: $($be|ConvertTo-Json -Compress)"}
          $cap=Get-Content $capture -Raw|ConvertFrom-Json;if(-not[bool]$cap.valid_signature-or$cap.path-ne'/v1/local-slots/migrate'-or$cap.key_id-ne'web-adapter'-or$cap.body.expected_build-ne'3.0.0-g6.2-workspace.231ai-browser-recovery-managed-inventory'-or[int]$cap.body.expected_managed_files-ne497-or$cap.body.expected_managed_tree_sha256-ne'b0e252b62b804c00e25c925d31ded8986fa23c3ab0d58b668eb79a79b961f56a'){throw "Signed Supervisor request invalid: $($cap|ConvertTo-Json -Compress)"}
          $evidenceText=Get-Content "$txdir/local-slot-bootstrap.json" -Raw;if($evidenceText.Contains($keyB64)){throw 'Secret leaked into bootstrap evidence'}
          $events=@(Get-Content "$txdir/system-events.jsonl"|?{$_}|%{$_|ConvertFrom-Json});if(-not@($events|?{$_.event_name-eq'local_slot_bootstrap_completed'})){throw 'Positive wrapper bootstrap event missing'}
          Copy-Item "$txdir/install-result.json" "$out/install-result-positive.json";Copy-Item "$txdir/system-events.jsonl" "$out/system-events-positive.jsonl";Copy-Item "$txdir/local-slot-bootstrap.json" "$out/local-slot-bootstrap-positive.json"
          try{$sp.WaitForExit(5000)|Out-Null}catch{};CleanupSvc 'SoknaApache'
          Write-Host 'R6 full wrapper signed Supervisor bootstrap: PASS'

      - name: Build final production installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $iscc=@("${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe","$env:ProgramFiles/Inno Setup 6/ISCC.exe")|?{$_ -and(Test-Path $_)}|Select -First 1;if(-not$iscc){throw 'Inno Setup 6 missing'}
          ./packaging/windows/scripts/build-installer-v4.ps1 -ShellPayloadRoot (Resolve-Path out-r6-final/shell).Path -RepoRoot $PWD.Path -IsccExe $iscc
          if($LASTEXITCODE-ne0){throw 'Installer build failed'}
