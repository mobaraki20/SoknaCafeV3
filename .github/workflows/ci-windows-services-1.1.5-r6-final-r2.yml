name: CI Windows Services 1.1.5 R6 Final R2

on:
  push:
    branches:
      - work/maintenance-v4-production-local-migration-bridge-r6
    paths:
      - .github/workflows/ci-windows-services-1.1.5-r6-final-r2.yml

permissions:
  actions: read
  contents: write

jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Freeze qualified evidence lineage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $product='65330eebdb179075228f4f96422ceb8abdee1e4a'
          git merge-base --is-ancestor $product HEAD
          if($LASTEXITCODE-ne0){throw 'R6 product source lineage mismatch'}
          $changed=@(git diff --name-only "$product..HEAD" -- windows/maintenance/src windows/maintenance/tests)
          if($changed.Count-ne0){throw "Maintenance product source changed after R6 failure-matrix PASS: $($changed -join ', ')"}
          if((Get-Content packaging/windows/WINDOWS_SERVICES_VERSION.txt -Raw).Trim()-ne'1.1.5'){throw 'Package version must be 1.1.5'}
          Write-Host 'R6_FAILURE_MATRIX_RUN=38995204758'
          Write-Host 'R6_CORE_LIFECYCLE_RUN=38995697490'

      - name: PS5.1 parse wrapper and bootstrap
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('packaging/windows/scripts/bootstrap-local-slot-r6.ps1','packaging/windows/scripts/setup-windows-components-v6.ps1','packaging/windows/scripts/prepare-shell-payload-v5.ps1')){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|ForEach-Object{Write-Host $_.Message};throw "PS5.1 parse failed: $p"}
          }
          Write-Host 'PS5.1 parser gate: PASS'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download canonical KEEP payloads
        uses: actions/download-artifact@v4
        with:
          name: windows-services-1.1.0-canonical-components-r3-baseline
          path: recovered
          github-token: ${{ github.token }}
          repository: mobaraki20/SoknaCafeV3
          run-id: 38982932863

      - name: Lock package/component and KEEP identities
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Sha($p){(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()}
          $m=Get-Content packaging/windows/windows-services-component-manifest-v2.json -Raw|ConvertFrom-Json
          $by=@{};foreach($c in $m.components){$by[$c.component_id]=$c}
          if($m.package_version-ne'1.1.5'-or$by.runtime.version-ne'1.0.5'-or$by.'print-agent'.version-ne'6.2.9'-or$by.maintenance.version-ne'0.3.3'-or$by.'maintenance-update-engine'.version-ne'0.3.3'-or$by.'maintenance-recovery-console'.version-ne'0.1.1'){throw 'Component identity mismatch'}
          $checks=@{
            'recovered/runtime/SoknaRuntimeService.exe'='26deed62524278fa93a9a576d958f9177fe97c878b75829a8dc93a1440955afd';
            'recovered/print-worker/Service/Sokna.PrintAgent.Service.exe'='99565602163463e9bce0ca6b33933411635db87a03acaf03340d2a56d9c85ff4';
            'recovered/baseline-maintenance/recovery/SoknaMaintenanceRecoveryConsole.exe'='85989bc8d1096575b0fcfc7d7d55aa999674c20ac8092fd3ea16d90e574c17e9'
          }
          foreach($p in $checks.Keys){if((Sha $p)-ne$checks[$p]){throw "Canonical KEEP drift: $p"}}
          Write-Host 'Package identity + canonical KEEP bytes: PASS'

      - name: Publish R6 Maintenance and compose exact final shell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $PWD 'out-r6-final-r2'
          New-Item -ItemType Directory -Path "$out/maintenance/app","$out/setup-ui","$out/setup-host" -Force|Out-Null
          dotnet publish windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/maintenance/app"
          if($LASTEXITCODE-ne0){throw 'Supervisor publish failed'}
          dotnet publish windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/maintenance/app"
          if($LASTEXITCODE-ne0){throw 'Update Engine publish failed'}
          dotnet publish packaging/windows/setup-ui/Sokna.SetupUi.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$out/setup-ui"
          if($LASTEXITCODE-ne0){throw 'Setup UI publish failed'}
          dotnet publish packaging/windows/setup-host-v3/Sokna.SetupHostV3.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/setup-host"
          if($LASTEXITCODE-ne0){throw 'Setup Host publish failed'}
          ./packaging/windows/scripts/prepare-shell-payload-v5.ps1 -RepoRoot $PWD.Path -OutputRoot "$out/shell" -RuntimeServiceExe (Resolve-Path recovered/runtime/SoknaRuntimeService.exe).Path -SetupHostExe "$out/setup-host/SoknaSetupHost.exe" -SetupUiExe "$out/setup-ui/SoknaSetupUi.exe" -PrintWorkerBundle (Resolve-Path recovered/print-worker).Path -MaintenanceAppBundle "$out/maintenance/app" -MaintenanceRecoveryBundle (Resolve-Path recovered/baseline-maintenance/recovery).Path -GitSha '65330eebdb179075228f4f96422ceb8abdee1e4a'
          if($LASTEXITCODE-ne0){throw 'Final shell composition failed'}

      - name: Verify final shell preserves qualified lifecycle core
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $shell='out-r6-final-r2/shell'
          foreach($n in @('setup-windows-components-v4.ps1','setup-windows-components-core-v5.ps1','bootstrap-local-slot-r6.ps1','local-slot-bootstrap-contract-v1.json')){if(-not(Test-Path "$shell/$n")){throw "Missing final shell file: $n"}}
          $core=(Get-Content "$shell/setup-windows-components-core-v5.ps1" -Raw).Replace("`r`n","`n")
          $source=(Get-Content packaging/windows/scripts/setup-windows-components-v5.ps1 -Raw).Replace("`r`n","`n")
          if($core-ne$source){throw 'Qualified Windows lifecycle core changed in wrapper composition'}
          $wrapper=Get-Content "$shell/setup-windows-components-v4.ps1" -Raw
          if(-not$wrapper.Contains('Post-commit migration bootstrap')-or-not$wrapper.Contains('windows_components_committed=$true')){throw 'Post-commit no-Windows-rollback boundary missing'}
          $boot=Get-Content "$shell/bootstrap-local-slot-r6.ps1" -Raw
          if($boot.Contains('SoknaMaintenanceUpdateEngine.exe')){throw 'Bootstrap bypasses Supervisor'}
          foreach($token in @('/v1/local-slots/migrate','X-Sokna-Maintenance-Protocol','X-Sokna-Signature','web-adapter')){if(-not$boot.Contains($token)){throw "Bootstrap contract missing: $token"}}
          $contract=Get-Content "$shell/local-slot-bootstrap-contract-v1.json" -Raw|ConvertFrom-Json
          if($contract.entries.Count-ne1-or$contract.entries[0].build-ne'3.0.0-g6.2-workspace.231ai-browser-recovery-managed-inventory'-or[int]$contract.entries[0].managed_files-ne497-or$contract.entries[0].managed_tree_sha256-ne'b0e252b62b804c00e25c925d31ded8986fa23c3ab0d58b668eb79a79b961f56a'){throw 'Exact Home bootstrap allowlist mismatch'}
          $sv=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$shell/_payload/maintenance/app/SoknaMaintenanceSupervisor.exe")).FileVersion
          $ev=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$shell/_payload/maintenance/app/SoknaMaintenanceUpdateEngine.exe")).FileVersion
          if(-not$sv.StartsWith('0.3.3')-or-not$ev.StartsWith('0.3.3')){throw "Maintenance target mismatch: $sv / $ev"}
          Write-Host 'Final shell lifecycle/ownership boundary: PASS'

      - name: Bootstrap safe-skip gate
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & "$env:SystemRoot\System32\sc.exe" delete SoknaApache *> $null
          $global:LASTEXITCODE=0
          $out=(Resolve-Path 'out-r6-final-r2').Path;$shell=Join-Path $out 'shell';$tx='skip-'+[guid]::NewGuid().ToString('N');$txdir=Join-Path $out $tx;New-Item -ItemType Directory $txdir -Force|Out-Null
          $plan=@{format='sokna-windows-install-plan-v3';schema_version=3;transaction_id=$tx;correlation_id='c';setup_session_id='s';shell_root=$shell}|ConvertTo-Json
          $planPath=Join-Path $txdir 'plan.json';Set-Content $planPath $plan -Encoding UTF8
          & "$shell/bootstrap-local-slot-r6.ps1" -PlanFile $planPath
          if($LASTEXITCODE-ne0){throw "Safe skip bootstrap failed: $LASTEXITCODE"}
          $e=Get-Content "$txdir/local-slot-bootstrap.json" -Raw|ConvertFrom-Json
          if($e.status-ne'skipped'-or$e.code-ne'LOCAL_APACHE_NOT_INSTALLED'-or[bool]$e.activation_performed){throw "Unsafe skip result: $($e|ConvertTo-Json -Compress)"}
          Write-Host 'Bootstrap non-target safe skip: PASS'

      - name: Bootstrap signed Supervisor HMAC gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function CleanupSvc($n){try{Stop-Service $n -Force -ErrorAction SilentlyContinue}catch{};& "$env:SystemRoot/System32/sc.exe" delete $n *> $null;$global:LASTEXITCODE=0;Start-Sleep -Milliseconds 250}
          $out=(Resolve-Path 'out-r6-final-r2').Path;$shell=Join-Path $out 'shell'
          $fakeRoot=Join-Path $out 'fake-local';New-Item -ItemType Directory -Path "$fakeRoot/Infrastructure/Apache24/bin","$fakeRoot/Web" -Force|Out-Null
          Copy-Item "$env:SystemRoot/System32/cmd.exe" "$fakeRoot/Infrastructure/Apache24/bin/httpd.exe" -Force
          '3.0.0-g6.2-workspace.231ai-browser-recovery-managed-inventory'|Set-Content "$fakeRoot/Web/VERSION.txt" -Encoding ascii
          CleanupSvc 'SoknaApache';$fakeExe=(Resolve-Path "$fakeRoot/Infrastructure/Apache24/bin/httpd.exe").Path
          & "$env:SystemRoot/System32/sc.exe" create SoknaApache binPath= ('"'+$fakeExe+'"') start= demand|Out-Null;if($LASTEXITCODE-ne0){throw 'Fake SoknaApache registration failed'}
          $maint=Join-Path ([Environment]::GetFolderPath([Environment+SpecialFolder]::CommonApplicationData)) 'SOKNA/Maintenance';New-Item -ItemType Directory -Path "$maint/secrets" -Force|Out-Null
          $key=[byte[]](0..31);$keyB64=[Convert]::ToBase64String($key);Set-Content "$maint/secrets/web-adapter.key" $keyB64 -Encoding ascii
          @{format='sokna-maintenance-control-plane-v1';schema_version=1;protocol='1.0';base_url='http://127.0.0.1:17639/'}|ConvertTo-Json|Set-Content "$maint/control-plane.json" -Encoding utf8
          $server=Join-Path $out 'fake-supervisor.py';$capture=Join-Path $out 'fake-supervisor-capture.json'
          @'
          import base64,hashlib,hmac,http.server,json,sys
          key=base64.b64decode(sys.argv[1]); capture=sys.argv[2]
          class H(http.server.BaseHTTPRequestHandler):
            def log_message(self,*a): pass
            def do_POST(self):
              n=int(self.headers.get('Content-Length','0')); body=self.rfile.read(n)
              bh=hashlib.sha256(body).hexdigest(); proto=self.headers.get('X-Sokna-Maintenance-Protocol',''); ts=self.headers.get('X-Sokna-Timestamp',''); nonce=self.headers.get('X-Sokna-Nonce',''); sig=self.headers.get('X-Sokna-Signature','')
              canonical='\n'.join(['POST',self.path,proto,ts,nonce,bh]).encode(); expected=hmac.new(key,canonical,hashlib.sha256).hexdigest()
              valid=self.path=='/v1/local-slots/migrate' and proto=='1.0' and self.headers.get('X-Sokna-Key-Id')=='web-adapter' and hmac.compare_digest(sig,expected)
              json.dump({'valid_signature':valid,'path':self.path,'key_id':self.headers.get('X-Sokna-Key-Id'),'idempotency':self.headers.get('X-Sokna-Idempotency-Key'),'body':json.loads(body.decode())},open(capture,'w'))
              payload={'ok':valid,'operation_id':'fake-r6-bootstrap','state':'committed' if valid else 'unauthorized','code':'LOCAL_SLOT_MIGRATION_COMMITTED' if valid else 'AUTH_SIGNATURE_INVALID','requires_recovery_console':False,'data':{'operation':{'activation_performed':True}}}
              raw=json.dumps(payload).encode();self.send_response(200 if valid else 401);self.send_header('Content-Type','application/json');self.send_header('Content-Length',str(len(raw)));self.end_headers();self.wfile.write(raw)
          http.server.HTTPServer(('127.0.0.1',17639),H).handle_request()
          '@|Set-Content $server -Encoding utf8
          $sp=Start-Process python -ArgumentList @(('"'+$server+'"'),$keyB64,('"'+$capture+'"')) -PassThru -WindowStyle Hidden;Start-Sleep -Seconds 1
          $tx='positive-'+[guid]::NewGuid().ToString('N');$txdir=Join-Path $out $tx;New-Item -ItemType Directory $txdir -Force|Out-Null
          $plan=@{format='sokna-windows-install-plan-v3';schema_version=3;transaction_id=$tx;correlation_id='c';setup_session_id='s';shell_root=$shell}|ConvertTo-Json
          $planPath=Join-Path $txdir 'plan.json';Set-Content $planPath $plan -Encoding UTF8
          & "$env:SystemRoot/System32/WindowsPowerShell/v1.0/powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$shell/bootstrap-local-slot-r6.ps1" -PlanFile $planPath
          if($LASTEXITCODE-ne0){throw "Positive bootstrap failed: $LASTEXITCODE"}
          $e=Get-Content "$txdir/local-slot-bootstrap.json" -Raw|ConvertFrom-Json;$cap=Get-Content $capture -Raw|ConvertFrom-Json
          if($e.status-ne'committed'-or$e.operation_id-ne'fake-r6-bootstrap'-or-not[bool]$e.activation_performed){throw "Bootstrap evidence invalid: $($e|ConvertTo-Json -Compress)"}
          if(-not[bool]$cap.valid_signature-or$cap.path-ne'/v1/local-slots/migrate'-or$cap.key_id-ne'web-adapter'-or$cap.body.expected_build-ne'3.0.0-g6.2-workspace.231ai-browser-recovery-managed-inventory'-or[int]$cap.body.expected_managed_files-ne497-or$cap.body.expected_managed_tree_sha256-ne'b0e252b62b804c00e25c925d31ded8986fa23c3ab0d58b668eb79a79b961f56a'){throw "Signed request invalid: $($cap|ConvertTo-Json -Compress)"}
          if((Get-Content "$txdir/local-slot-bootstrap.json" -Raw).Contains($keyB64)){throw 'Secret leaked into evidence'}
          Copy-Item "$txdir/local-slot-bootstrap.json" "$out/local-slot-bootstrap-positive.json"
          try{$sp.WaitForExit(5000)|Out-Null}catch{};CleanupSvc 'SoknaApache'
          Write-Host 'Bootstrap signed Supervisor HMAC gate: PASS'

      - name: Build exact final installer and qualification evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $iscc=@("${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe","$env:ProgramFiles/Inno Setup 6/ISCC.exe")|Where-Object{$_ -and(Test-Path $_)}|Select-Object -First 1
          if(-not$iscc){throw 'Inno Setup 6 missing'}
          ./packaging/windows/scripts/build-installer-v4.ps1 -ShellPayloadRoot (Resolve-Path out-r6-final-r2/shell).Path -RepoRoot $PWD.Path -IsccExe $iscc
          if($LASTEXITCODE-ne0){throw 'Installer build failed'}
          $exe='packaging/windows/installer/out-v4/SOKNA-Windows-Services-Setup-1.1.5.exe';if(-not(Test-Path $exe)){throw 'Final installer missing'}
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant();$d='out-r6-final-r2/delivery';New-Item -ItemType Directory $d -Force|Out-Null;Copy-Item $exe $d
          [ordered]@{format='sokna-windows-services-r6-final-qualification-v2';product_source_commit='65330eebdb179075228f4f96422ceb8abdee1e4a';failure_matrix_run=38995204758;core_lifecycle_run=38995697490;package_version='1.1.5';runtime='1.0.5';print_agent='6.2.9';maintenance='0.3.3';update_engine='0.3.3';recovery_console='0.1.1';core_lifecycle_plan='Runtime KEEP / Print KEEP / Maintenance UPDATE / Engine UPDATE / Recovery KEEP';keep_proof='no_stop_no_copy_no_registration_no_restart';production_local_migration_bridge=$true;bootstrap_via_signed_supervisor=$true;bootstrap_exact_231ai_allowlist=$true;bootstrap_non_target_safe_skip=$true;bootstrap_secret_redaction=$true;bootstrap_post_windows_commit_no_rollback=$true;database_mutation=$false;public_mutation=$false;windows_reboot=$false;installer_sha256=$sha}|ConvertTo-Json -Depth 8|Set-Content "$d/R6_FINAL_QUALIFICATION.json" -Encoding utf8
          Copy-Item out-r6-final-r2/local-slot-bootstrap-positive.json $d
          Get-ChildItem $d -File|ForEach-Object{"$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"}|Set-Content "$d/SHA256SUMS.txt" -Encoding ascii
          Write-Host "R6_FINAL_INSTALLER_SHA256=$sha"

      - name: Upload exact final artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOKNA-Windows-Services-1.1.5-R6-Final-Qualified-R2
          path: out-r6-final-r2/delivery
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Cleanup fixture
        if: always()
        shell: pwsh
        run: |
          try{Stop-Service SoknaApache -Force -ErrorAction SilentlyContinue}catch{}
          & "$env:SystemRoot/System32/sc.exe" delete SoknaApache *> $null
          $global:LASTEXITCODE=0

  promote:
    needs: qualify
    runs-on: ubuntu-latest
    steps:
      - name: Download exact qualified artifact
        uses: actions/download-artifact@v4
        with:
          name: SOKNA-Windows-Services-1.1.5-R6-Final-Qualified-R2
          path: qualified
      - name: Publish exact qualified pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find qualified -type f -name 'SOKNA-Windows-Services-Setup-1.1.5.exe' -print -quit)"
          evidence="$(find qualified -type f -name 'R6_FINAL_QUALIFICATION.json' -print -quit)"
          sums="$(find qualified -type f -name 'SHA256SUMS.txt' -print -quit)"
          test -f "$exe" && test -f "$evidence" && test -f "$sums"
          actual="$(sha256sum "$exe"|awk '{print $1}')"
          recorded="$(python -c 'import json,sys;print(json.load(open(sys.argv[1],encoding="utf-8-sig"))["installer_sha256"])' "$evidence")"
          test "$actual" = "$recorded"
          python - "$evidence" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf-8-sig'))
          assert j['package_version']=='1.1.5'
          assert j['maintenance']=='0.3.3' and j['update_engine']=='0.3.3'
          assert j['runtime']=='1.0.5' and j['print_agent']=='6.2.9' and j['recovery_console']=='0.1.1'
          assert j['failure_matrix_run']==38995204758 and j['core_lifecycle_run']==38995697490
          assert j['production_local_migration_bridge'] is True
          assert j['bootstrap_via_signed_supervisor'] is True
          assert j['bootstrap_exact_231ai_allowlist'] is True
          assert j['bootstrap_post_windows_commit_no_rollback'] is True
          assert j['database_mutation'] is False and j['public_mutation'] is False and j['windows_reboot'] is False
          PY
          tag='windows-services-1.1.5-r6'
          cat > notes.md <<EOF
          Production-qualified Maintenance V4 R6.

          - Runtime 1.0.5: KEEP, canonical byte-exact
          - Print Agent 6.2.9: KEEP, canonical byte-exact
          - Maintenance Supervisor 0.3.3: UPDATE
          - Update Engine 0.3.3: UPDATE
          - Recovery Console 0.1.1: KEEP, canonical byte-exact
          - Production Local slot migration bridge included
          - One-time 231ai bootstrap calls the signed loopback Supervisor contract; it never launches Update Engine directly
          - Bootstrap runs after Windows component commit; migration failure does not roll back the new Maintenance needed for recovery
          - Unsupported/non-target Local baselines safely skip migration
          - No Local/Public DB mutation and no Windows reboot

          Installer SHA-256: $actual
          EOF
          if gh release view "$tag" --repo mobaraki20/SoknaCafeV3 >/dev/null 2>&1; then
            gh release upload "$tag" "$exe" "$evidence" "$sums" --repo mobaraki20/SoknaCafeV3 --clobber
            gh release edit "$tag" --repo mobaraki20/SoknaCafeV3 --prerelease --title 'SOKNA Windows Services 1.1.5 — Maintenance V4 R6' --notes-file notes.md
          else
            gh release create "$tag" "$exe" "$evidence" "$sums" --repo mobaraki20/SoknaCafeV3 --target '${{ github.sha }}' --title 'SOKNA Windows Services 1.1.5 — Maintenance V4 R6' --notes-file notes.md --prerelease
          fi
          digest="$(gh api repos/mobaraki20/SoknaCafeV3/releases/tags/$tag --jq '.assets[]|select(.name=="SOKNA-Windows-Services-Setup-1.1.5.exe")|.digest')"
          test "$digest" = "sha256:$actual"
          test "$(gh api repos/mobaraki20/SoknaCafeV3/releases/tags/$tag --jq .prerelease)" = true
          test "$(gh api repos/mobaraki20/SoknaCafeV3/releases/tags/$tag --jq .draft)" = false
          echo "FINAL_RELEASE_SHA256=$actual"
