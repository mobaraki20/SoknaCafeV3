name: SOKNA R165 cumulative guest submit ownership real MariaDB isolated QA
on:
  push:
    branches: [qa/sokna-r165-post-golive-idempotency-20261112]
    paths:
      - 'qa/sokna-r165/**'
      - '.github/workflows/sokna-r165-source-mariadb.yml'
permissions:
  contents: read
jobs:
  source-and-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_ACTIONS: 'true'
      SOKNA_R165_DISPOSABLE: 'YES'
      SOKNA_R165_DB_PASS: 'r165-ci-only'
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: r165-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping --protocol=tcp --host=127.0.0.1 --user=root --password=r165-ci-only"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring,pdo_mysql,zip
      - name: Download immutable R162 published source parents, not old main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r165-parents" "$RUNNER_TEMP/r163-local" "$RUNNER_TEMP/r164-public" "$RUNNER_TEMP/r165"
          gh release download sokna-r162-golive-oneclick-uat-20261111 --repo mobaraki20/SoknaCafeV3 --pattern SOKNA-R162-LOCAL-231EM-49BASE-PANEL-UPDATE.zip --dir "$RUNNER_TEMP/r165-parents"
          gh release download sokna-r162-golive-oneclick-uat-20261111 --repo mobaraki20/SoknaCafeV3 --pattern SOKNA-R160-PUBLIC-35HR-FROM-35HP-PANEL-UPDATE.zip --dir "$RUNNER_TEMP/r165-parents"
          echo "16adab9910c017d97ebc256e721bfbc22e26103979adc59763c6bf978b6f5471  $RUNNER_TEMP/r165-parents/SOKNA-R162-LOCAL-231EM-49BASE-PANEL-UPDATE.zip" | sha256sum -c -
          echo "96e976c43644f62e1246a29752af3fab5fff62978421f93db8065d8460a67503  $RUNNER_TEMP/r165-parents/SOKNA-R160-PUBLIC-35HR-FROM-35HP-PANEL-UPDATE.zip" | sha256sum -c -
      - name: Reconstruct unchanged R163 Local and R164 Public cumulative sources
        shell: bash
        run: |
          set -euo pipefail
          python qa/sokna-r163-post-golive/verify_r163.py --release "$RUNNER_TEMP/r165-parents/SOKNA-R162-LOCAL-231EM-49BASE-PANEL-UPDATE.zip" --patch qa/sokna-r163-post-golive/R162-TO-R163-LOCAL-guest-renderer.patch --output "$RUNNER_TEMP/r163-local"
          test -f "$RUNNER_TEMP/r163-local/SOKNA-R163-LOCAL-FULL-SOURCE-QA-NOT-INSTALL.zip"
          grep -q c4046e01490f61adeeec679478290175cc2dfd2febe9af458f3246b0610ca036 "$RUNNER_TEMP/r163-local/SOKNA-R163-SOURCE-QA-REPORT.json"
          python qa/sokna-r164/verify_r164_public.py --release "$RUNNER_TEMP/r165-parents/SOKNA-R160-PUBLIC-35HR-FROM-35HP-PANEL-UPDATE.zip" --patch qa/sokna-r164/R162-TO-R164-PUBLIC-guest-status-freshness.patch --outdir "$RUNNER_TEMP/r164-public"
          test -f "$RUNNER_TEMP/r164-public/SOKNA-R164-PUBLIC-FULL-SOURCE-QA-NOT-INSTALL.zip"
      - name: Apply one exact R165 Local patch; preserve all other cumulative files
        shell: bash
        run: |
          set -euo pipefail
          python qa/sokna-r165/verify_r165.py --parent "$RUNNER_TEMP/r163-local/SOKNA-R163-LOCAL-FULL-SOURCE-QA-NOT-INSTALL.zip" --patch qa/sokna-r165/R164-TO-R165-LOCAL-guest-idempotency-ownership.patch --outdir "$RUNNER_TEMP/r165"
          find "$RUNNER_TEMP/r165/r165-local-candidate" -name '*.php' -print0 | xargs -0 -n1 -P 8 php -l >/dev/null
          find "$RUNNER_TEMP/r165/r165-local-candidate" -name '*.js' -print0 | xargs -0 -n1 -P 8 node --check >/dev/null
          find "$RUNNER_TEMP/r164-public/public-candidate" -name '*.php' -print0 | xargs -0 -n1 -P 8 php -l >/dev/null
          find "$RUNNER_TEMP/r164-public/public-candidate" -name '*.js' -print0 | xargs -0 -n1 -P 8 node --check >/dev/null
          php -l qa/sokna-r165/test_guest_idempotency_ownership.php
      - name: Real MariaDB guest token retry regression before/after (no live data)
        shell: bash
        run: |
          set -euo pipefail
          php qa/sokna-r165/test_guest_idempotency_ownership.php baseline "$RUNNER_TEMP/r165/r164-local-parent"
          php qa/sokna-r165/test_guest_idempotency_ownership.php candidate "$RUNNER_TEMP/r165/r165-local-candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: r165-cumulative-local-and-public-SOURCE-QA-NOT-INSTALLABLE
          path: |
            ${{ runner.temp }}/r165/SOKNA-R165-LOCAL-FULL-SOURCE-QA-NOT-INSTALL.zip
            ${{ runner.temp }}/r165/R165-SOURCE-QA.json
            ${{ runner.temp }}/r164-public/SOKNA-R164-PUBLIC-FULL-SOURCE-QA-NOT-INSTALL.zip
            ${{ runner.temp }}/r164-public/SOKNA-R164-PUBLIC-SOURCE-QA.json
          if-no-files-found: error
          retention-days: 14
