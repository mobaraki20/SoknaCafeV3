name: SOKNA three-component coordinated transaction model Windows QA only
on:
  push:
    branches: [qa/sokna-r125-ledger-compat-20261110]
    paths:
      - qa/sokna-universal/coordinated-upgrade-qa.py
      - qa/sokna-universal/test-coordinated-upgrade-qa.py
      - .github/workflows/sokna-universal-three-component-coordination-qa.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  coordinated-crash-recovery-contract:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      SOKNA_DISPOSABLE_UNIVERSAL_QA: 'YES'
    steps:
      - uses: actions/checkout@v4
      - name: Validate compile and non-production gates
        shell: pwsh
        run: |
          python -m py_compile qa/sokna-universal/coordinated-upgrade-qa.py qa/sokna-universal/test-coordinated-upgrade-qa.py
          if($LASTEXITCODE-ne0){throw 'QA_COORDINATOR_PYTHON_PARSE_FAILED'}
          $s=Get-Content qa/sokna-universal/coordinated-upgrade-qa.py -Raw
          foreach($part in @('DISPOSABLE_WINDOWS_GITHUB_ACTIONS_ONLY','BACKUP_MISSING_OR_TAMPERED',
            'GLOBAL_SHARED_LEASE_BUSY','RECOVERY_REQUIRED','production_approved')){
            if(-not$s.Contains($part)){throw ('MISSING_FAIL_CLOSED_INVARIANT_'+$part)}
          }
      - name: Two real Windows host profiles, 3 components, fault and crash matrix
        shell: pwsh
        run: |
          python qa/sokna-universal/test-coordinated-upgrade-qa.py
          if($LASTEXITCODE-ne0){throw 'THREE_COMPONENT_TRANSACTION_QA_FAILED'}
      - name: Explicit release remains blocked
        shell: pwsh
        run: |
          Write-Host 'QA ONLY — model does not invoke live MariaDB/Apache/Public HTTP or Maintenance EXE'
          Write-Host 'No production approval, no universal deployment artifact, no field install'
