name: Publish SOKNA Prerequisites 1.0.5
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-prerequisites-1.0.5.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: prerequisites-v1.0.5
      TARGET_SHA: da5b1c7563ad55e7f9c6d75f4d277b44e3e8ae22
      RUN_ID: "36488598934"
    steps:
      - name: Download qualified artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/prereq dist/offline dist/release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sokna-prerequisites-setup-1.0.5" --dir dist/prereq
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sokna-offline-kit-template-1.0.5" --dir dist/offline
          cp dist/prereq/SOKNA-Prerequisites-Setup-1.0.5.exe dist/release/
          cp dist/prereq/artifact-index.json dist/release/SOKNA-Prerequisites-1.0.5-artifact-index.json
          (cd dist/offline && zip -r ../release/SOKNA-Offline-Kit-Template-1.0.5.zip .)
          (cd dist/release && sha256sum SOKNA-Prerequisites-Setup-1.0.5.exe SOKNA-Offline-Kit-Template-1.0.5.zip > SHA256SUMS.txt)
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/release/*               --repo "$GITHUB_REPOSITORY"               --target "$TARGET_SHA"               --title "SOKNA Prerequisites 1.0.5"               --notes "Adds pre-mutation cross-root ownership protection for existing SOKNA Apache/MariaDB and registered MariaDB MSI products. Qualified with the real locked MariaDB 11.4.12 MSI across different roots, service-present and MSI-registration-only scenarios, same-root repair-safe probes, Apache cross-root ownership, Local Web Browser Setup + real MariaDB pairing handoff, V3 component gates, and M10 Windows lifecycle qualification."
          fi
