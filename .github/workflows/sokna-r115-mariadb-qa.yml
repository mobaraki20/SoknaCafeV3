name: Sokna R115 isolated MariaDB migration qualification

on:
  push:
    branches:
      - qa/sokna-r115-mariadb-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-0077:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: "%"
          MARIADB_DATABASE: sokna_migration_qa
          MARIADB_USER: sokna
          MARIADB_PASSWORD: sokna
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: sokna
      MYSQL_PASSWORD: sokna
      MYSQL_DATABASE: sokna_migration_qa
    steps:
      - uses: actions/checkout@v4
      - name: Install MariaDB client and PHP MySQL driver
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mariadb-client php-cli php-mysql
          php -r 'if (!in_array("mysql",PDO::getAvailableDrivers(),true)) {fwrite(STDERR,"pdo_mysql unavailable\n");exit(1);}'
      - name: Verify exact R115 migration and exercise MariaDB 11.4 behavior
        shell: bash
        run: |
          set -o pipefail
          bash qa/sokna-r115/test-mariadb-migration.sh 2>&1 | tee sokna-r115-mariadb.log
      - name: Reconstruct exact R115 Local backend snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat qa/sokna-r115/source-b64/part-*.txt > /tmp/sokna-r115-backend.b64
          base64 -d /tmp/sokna-r115-backend.b64 > /tmp/sokna-r115-backend.tar.gz
          echo '6baa0f3e22aad24fa172fadca2ac583a45864f1cf0df073754a482a8d90e96fa  /tmp/sokna-r115-backend.tar.gz' | sha256sum -c -
          mkdir -p /tmp/sokna-r115-exact
          tar -xzf /tmp/sokna-r115-backend.tar.gz -C /tmp/sokna-r115-exact
          test -f /tmp/sokna-r115-exact/local/src/Core/Migrations.php
          echo 'Reconstructing exact R115 default-content assets'
          cat qa/sokna-r115/seed-b64/part-*.txt > /tmp/sokna-r115-seed.b64
          base64 -d /tmp/sokna-r115-seed.b64 > /tmp/sokna-r115-seed.tar.gz
          echo '0f5731408c6da4d6c88e6a4791c4b26ba585c87d6a8fdb23924db9a7b4a020bf  /tmp/sokna-r115-seed.tar.gz' | sha256sum -c -
          tar -xzf /tmp/sokna-r115-seed.tar.gz -C /tmp/sokna-r115-exact
          test -f /tmp/sokna-r115-exact/local/resources/default-content/v1/catalog.json
          echo "Verified original R115 backend and default content"
      - name: Apply candidate no-backfill fix to exact R115 backend in isolated workspace
        shell: bash
        run: |
          set -euo pipefail
          patch --batch --forward -d /tmp/sokna-r115-exact/local -p1 < qa/sokna-r115/fix-order-accounting-no-backfill.patch
          php -l /tmp/sokna-r115-exact/local/src/Domain/Inventory/InventoryOrderService.php
          echo '7d06e4f6781d54d983340b7c1219bb5470ba02e61d5bbe8d760cd5b317c3bcf3  /tmp/sokna-r115-exact/local/src/Domain/Inventory/InventoryOrderService.php' | sha256sum -c -
      - name: PHP syntax for exact R115 backend
        shell: bash
        run: |
          set -euo pipefail
          find /tmp/sokna-r115-exact/local/src -type f -name '*.php' -print0 |
            xargs -0 -n1 php -l > /tmp/sokna-r115-backend-lint.log
          echo "Verified $(wc -l < /tmp/sokna-r115-backend-lint.log) PHP source files"
      - name: Run complete Local R115 migration chain on clean MariaDB
        shell: bash
        run: |
          set -euo pipefail
          export MYSQL_PWD=root
          mariadb --protocol=tcp -h127.0.0.1 -P3306 -uroot -e "CREATE DATABASE sokna_r115_full CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; GRANT ALL PRIVILEGES ON sokna_r115_full.* TO 'sokna'@'%'; FLUSH PRIVILEGES;"
          unset MYSQL_PWD
          cat > /tmp/sokna-r115-full-migrate.php <<'PHP'
          <?php
          declare(strict_types=1);
          require '/tmp/sokna-r115-exact/local/src/Core/MigrationExecutionException.php';
          require '/tmp/sokna-r115-exact/local/src/Core/Migrations.php';
          require '/tmp/sokna-r115-exact/local/src/Domain/Sellables/CategoryIconLibrary.php';
          require '/tmp/sokna-r115-exact/local/src/Domain/Sellables/DefaultContentSeeder.php';
          $pdo=new PDO('mysql:host=127.0.0.1;port=3306;dbname=sokna_r115_full;charset=utf8mb4','sokna','sokna',[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION, PDO::ATTR_EMULATE_PREPARES=>false]);
          $runner=new Sokna\Local\Core\Migrations($pdo,'/tmp/sokna-r115-exact/local/database/migrations');
          $base=$runner->migrate('0059_menu_business_reconciliation_v4');
          $pdo->prepare("INSERT INTO users(username,password_hash,display_name,role,active) VALUES('qa',?,'QA','admin',1)")
              ->execute([password_hash('test-only',PASSWORD_DEFAULT)]);
          $actor=(int)$pdo->lastInsertId();
          $root='/tmp/sokna-r115-exact/local/resources/default-content/v1';
          $seeder=new Sokna\Local\Domain\Sellables\DefaultContentSeeder(
              $pdo,new Sokna\Local\Domain\Sellables\CategoryIconLibrary($root.'/category-icons.json'),
              $root,'/tmp/sokna-r115-seeded-media'
          );
          $seeder->seed($actor);
          $applied=$runner->migrate();
          if(!in_array('0077_incremental_opening_inventory',$applied,true))throw new RuntimeException('R115 final migration missing');
          if($runner->migrate()!==[])throw new RuntimeException('Second migration pass is not idempotent');
          echo 'PASS R115 staged migrations: '.count($base).' pre-seed + '.count($applied)." post-seed, idempotent rerun\n";
          PHP
          php /tmp/sokna-r115-full-migrate.php 2>&1 | tee sokna-r115-full-migration.log
      - name: Test actual R115 inventory services and two-day count on MariaDB
        shell: bash
        run: |
          set -o pipefail
          php qa/sokna-r115/real-db-inventory.php 2>&1 | tee sokna-r115-inventory-integration.log
      - name: Audit finance conflict reason safely on MariaDB
        shell: bash
        run: |
          set -o pipefail
          php qa/sokna-r115/real-db-finance-audit.php 2>&1 | tee sokna-r117-finance-audit.log
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sokna-r115-migration-0077-mariadb-11-4
          path: |
            sokna-r115-mariadb.log
            sokna-r115-full-migration.log
            sokna-r115-inventory-integration.log
            sokna-r117-finance-audit.log
          if-no-files-found: warn
          retention-days: 14
