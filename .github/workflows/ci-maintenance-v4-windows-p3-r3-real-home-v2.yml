name: CI Maintenance V4 Windows P3 R3 Real Home V2

on:
  workflow_dispatch:
  push:
    branches:
      - work/maintenance-v4-windows-p3-home-package-r3
    paths:
      - packaging/windows/qualification/qualify-p3-r3-real-home.ps1
      - packaging/windows/component-artifact-lock-v1.json
      - packaging/windows/WINDOWS_SERVICES_VERSION.txt
      - packaging/windows/windows-services-component-manifest-v2.json
      - packaging/windows/setup-ui/**
      - packaging/windows/setup-host-v3/**
      - packaging/windows/scripts/**
      - packaging/windows/installer/**
      - packaging/windows/installer-bootstrap/**
      - windows/maintenance/**
      - .github/workflows/ci-maintenance-v4-windows-p3-r3-real-home-v2.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: p3-r3-real-home-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download exact recovered 1.1.0 Home baseline components
        uses: actions/download-artifact@v4
        with:
          name: windows-services-1.1.0-canonical-components-r3-baseline
          path: recovered
          github-token: ${{ github.token }}
          repository: mobaraki20/SoknaCafeV3
          run-id: 38982932863

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Qualify R3 against exact recovered Home baseline
        shell: pwsh
        run: |
          ./packaging/windows/qualification/qualify-p3-r3-real-home.ps1 -RecoveredRoot (Resolve-Path recovered).Path -RepoRoot $PWD.Path

      - name: Upload exact R3 qualified delivery
        uses: actions/upload-artifact@v4
        with:
          name: SOKNA-Phase3-Qualification-Bundle-R3
          path: |
            out/delivery
            out/SOKNA-Phase3-Qualification-Bundle-R3.zip
            out/P3_R3_QUALIFICATION.json
            out/real-home-plan-rows.json
            out/r3-before.json
            out/r3-after.json
            out/r3-install-result.json
            out/r3-system-events.jsonl
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
