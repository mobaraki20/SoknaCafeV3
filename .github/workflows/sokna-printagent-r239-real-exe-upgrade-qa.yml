name: SOKNA R239 Print Agent EXE real 6.2.11 upgrade under Runtime QA
on:
  push:
    branches: [qa/sokna-printagent-universal-installer-20261115]
    paths:
      - .github/workflows/sokna-printagent-r239-real-exe-upgrade-qa.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-real-exe:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-R239-PRINTAGENT-6211-CAFE-SHA-VERIFIED-REFERENCE
          run-id: 43705494921
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/actual-6211
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-R239-PrintAgent-6.2.12-WIN64-UNIVERSAL-INSTALLER-RC-QA
          run-id: 43709130216
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate-6212
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate actual reference, candidate identities and build real Runtime fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $zip=Join-Path $env:RUNNER_TEMP 'actual-6211/SoknaPrintAgent-6.2.11-CAFE-MATCHED-REFERENCE.zip'
          $exe=Join-Path $env:RUNNER_TEMP 'candidate-6212/SOKNA-PrintAgent-6.2.12-Independent-Universal-RC.exe'
          if(!(Test-Path $zip) -or !(Test-Path $exe)){throw 'R239_REFERENCE_OR_CANDIDATE_MISSING'}
          $sum=Get-Content (Join-Path $env:RUNNER_TEMP 'candidate-6212/SHA256SUMS.txt') -Raw
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if(!$sum.Contains($sha)){throw 'R239_CANDIDATE_CHECKSUM_MISMATCH'}
          $root=Join-Path $env:RUNNER_TEMP 'SoknaR239ExeActualLab'
          New-Item $root -ItemType Directory -Force|Out-Null
          $installed=Join-Path $root 'SOKNA Windows Services/PrintAgent'
          Expand-Archive $zip -DestinationPath $installed
          $oldSvc=(Get-FileHash (Join-Path $installed 'Service/Sokna.PrintAgent.Service.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          $oldWrk=(Get-FileHash (Join-Path $installed 'Worker/Sokna.PrintAgent.Worker.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
          if($oldSvc -ne '9f4559d2d15188863212c1cf1c8ea786ed8aa0e2cf5bcee08f40738344dd29b5' -or
             $oldWrk -ne '6538ce93eec690e21f0901e08c3031d14059781493306870f13b952406249284'){throw 'R239_CAFE_6211_NOT_BYTE_MATCHED'}
          $runtimeFolder=Join-Path $root 'SOKNA Windows Services/Runtime'
          dotnet publish 'windows/runtime/source/Sokna.Runtime.Service.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o $runtimeFolder
          if($LASTEXITCODE -ne 0){throw 'R239_RUNTIME_BUILD_FAILED'}
          $durableOut=Join-Path $root 'durable-qa'
          dotnet publish 'qa/sokna-printagent-universal/Sokna.PrintAgent.DurableStateQa.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o $durableOut
          if($LASTEXITCODE -ne 0){throw 'R239_DURABLE_CHECK_BUILD_FAILED'}
          $guardFolder=Join-Path $root 'queue-guard-qa'
          dotnet publish 'qa/sokna-printagent-universal/Sokna.PrintAgent.UpgradeGuard.csproj' -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o $guardFolder
          if($LASTEXITCODE -ne 0){throw 'R239_QUEUE_GUARD_BUILD_FAILED'}
          'R239_GUARD_EXE='+(Join-Path $guardFolder 'Sokna.PrintAgent.UpgradeGuard.exe')|Out-File $env:GITHUB_ENV -Append
          'R239_TEST_ROOT='+$root|Out-File $env:GITHUB_ENV -Append
          'R239_TEST_EXE='+$exe|Out-File $env:GITHUB_ENV -Append
          'R239_OLD_SERVICE_SHA='+$oldSvc|Out-File $env:GITHUB_ENV -Append
          Write-Host 'PASS_R239_REAL_CAFE_REFERENCE_AND_EXE_VERIFIED'
      - name: Execute exactly the delivered EXE on real 6.2.11 while Runtime is supervising
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:R239_TEST_ROOT
          $svcRoot=Join-Path $root 'SOKNA Windows Services/PrintAgent'
          $svcExe=Join-Path $svcRoot 'Service/Sokna.PrintAgent.Service.exe'
          $data=Join-Path $root 'ProgramData/SOKNA/print-worker'
          $runtimeExe=Join-Path $root 'SOKNA Windows Services/Runtime/SoknaRuntimeService.exe'
          $runtimeCfg=Join-Path $root 'runtime-test-config.json'
          $runtimeData=Join-Path $root 'ProgramData/SOKNA/runtime/state'
          New-Item $data,$runtimeData -ItemType Directory -Force|Out-Null
          $registry='HKLM:\SYSTEM\CurrentControlSet\Services\SoknaPrintWorker'
          try{
            if(Get-Service SoknaPrintWorker -ErrorAction SilentlyContinue){throw 'R239_RUNNER_PRINT_SERVICE_ALREADY_EXISTS'}
            if(Get-Service SoknaRuntime -ErrorAction SilentlyContinue){throw 'R239_RUNNER_RUNTIME_ALREADY_EXISTS'}
            New-Service -Name SoknaPrintWorker -BinaryPathName ('"'+$svcExe+'"') -DisplayName 'SOKNA Print Worker QA' -StartupType Manual | Out-Null
            New-ItemProperty -LiteralPath $registry -Name Environment -PropertyType MultiString -Value @('SOKNA_PRINT_WORKER_DATA_ROOT='+$data) -Force|Out-Null
            Start-Service SoknaPrintWorker
            (Get-Service SoknaPrintWorker).WaitForStatus('Running',[TimeSpan]::FromSeconds(35))
            $database=Join-Path $data 'queue.db'
            if(!(Test-Path $database)){throw 'R239_REAL_6211_QUEUE_NOT_INITIALIZED'}
            $durable=Join-Path $root 'durable-qa/Sokna.PrintAgent.DurableStateQa.exe'
            & $durable seed $database
            if($LASTEXITCODE -ne 0){throw 'R239_REAL_6211_DURABLE_SEED_FAILED'}
            $guardOutput=(& $env:R239_GUARD_EXE --data-root $data|Out-String).Trim()
            $guardExit=$LASTEXITCODE
            Write-Host ('R239_REAL_6211_PREUPGRADE_QUEUE_GUARD_EXIT='+$guardExit+' JSON='+$guardOutput)
            if($guardExit -ne 0){throw 'R239_REAL_6211_PREUPGRADE_QUEUE_UNSAFE_OR_SCHEMA_MISMATCH'}

            ('R'*48)|Set-Content (Join-Path $root 'runtime-token.private') -Encoding Ascii
            ('L'*48)|Set-Content (Join-Path $root 'local-token.private') -Encoding Ascii
            @{
              ContractVersion=1;InstanceId='r239-exe-fixture-runtime-20261115';DataRoot=$runtimeData;
              HealthPort=17629;RuntimeTokenFile=(Join-Path $root 'runtime-token.private');
              LocalTokenFile=(Join-Path $root 'local-token.private');LocalBaseUrl='http://127.0.0.1:17779/';
              PrintAgentServiceName='SoknaPrintWorker';SupervisePrintAgent=$true;Triggers=@()
            }|ConvertTo-Json -Depth 6|Set-Content $runtimeCfg -Encoding UTF8
            $command='"'+$runtimeExe+'" --config "'+$runtimeCfg+'"'
            New-Service -Name SoknaRuntime -BinaryPathName $command -DisplayName 'SOKNA Runtime QA' -StartupType Manual|Out-Null
            Start-Service SoknaRuntime
            (Get-Service SoknaRuntime).WaitForStatus('Running',[TimeSpan]::FromSeconds(35))
            $runtimeHash=(Get-FileHash $runtimeExe -Algorithm SHA256).Hash
            $spoolAtStart=@(Get-CimInstance Win32_PrintJob -ErrorAction Stop)
            if($spoolAtStart.Count -gt 0){throw 'R239_RUNNER_SPOOLER_NOT_EMPTY'}
            $log=Join-Path $env:RUNNER_TEMP 'R239-REAL-6211-INNO-EXE.log'
            $proc=Start-Process -FilePath $env:R239_TEST_EXE -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/LABROOT='+$root),('/LOG='+$log)) -PassThru -Wait
            if(Test-Path $log){Get-Content $log | Select-Object -Last 12 | ForEach-Object {Write-Host "INNO_REAL_EXE $_"}}
            if($proc.ExitCode -ne 0){
              $reports=@(Get-ChildItem (Join-Path $root 'reports') -Filter 'SOKNA-PRINT-TRANSACTION-*.json' -ErrorAction SilentlyContinue|Sort-Object LastWriteTime -Descending)
              if($reports.Count){Write-Host ("R239_EXE_FAILURE_REPORT="+(Get-Content $reports[0].FullName -Raw))}
              throw ('R239_REAL_EXE_UPGRADE_FAILED_'+$proc.ExitCode)
            }
            $receipt=Join-Path $root 'ProgramData/SOKNA/setup/print-agent-independent-v1/active.json'
            $r=Get-Content $receipt -Raw|ConvertFrom-Json
            if($r.status -ne 'COMMITTED' -or $r.target_version -ne '6.2.12' -or $r.source_version -ne '6.2.11'){throw 'R239_REAL_EXE_RECEIPT_VERSION_INVALID'}
            if((Get-Service SoknaPrintWorker).Status -ne 'Running' -or (Get-Service SoknaRuntime).Status -ne 'Running'){throw 'R239_REAL_EXE_SERVICES_NOT_RESTORED'}
            if((Get-FileHash $runtimeExe -Algorithm SHA256).Hash -ne $runtimeHash){throw 'R239_REAL_EXE_RUNTIME_CHANGED'}
            if((Get-FileHash (Join-Path $svcRoot 'Service/Sokna.PrintAgent.Service.exe') -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b28f0028f3be5f0bf4a1ee49d5ddce06e60b95a56f28300d4ac17b05f9f6051b'){throw 'R239_REAL_EXE_TARGET_IDENTITY_BAD'}
            & $durable verify $database
            if($LASTEXITCODE -ne 0){throw 'R239_REAL_EXE_DURABLE_STATE_LOST'}
            $global:LASTEXITCODE=0
            Write-Host 'PASS_R239_SINGLE_EXE_CAFE_EXACT_6211_TO_6212_WITH_LIVE_RUNTIME_AND_SQLITE_PRESERVATION'
            $qaDir=Join-Path $env:RUNNER_TEMP 'R239-EXE-REAL-RESULT'
            New-Item $qaDir -ItemType Directory -Force | Out-Null
            @{
              format='sokna-r239-real-exe-acceptance-v1';
              package_sha256=(Get-FileHash $env:R239_TEST_EXE -Algorithm SHA256).Hash.ToLowerInvariant();
              cafe_real_6211_binaries='SHA256_MATCHED';
              actual_exe_6211_to_6212='PASS';
              runtime_supervisor_quiesced_and_restored='PASS';
              durable_sqlite_unknown_attempt_preserved='PASS';
              physical_printer_test='NOT_TESTED';
              deployment_auto_authorized=$false
            }|ConvertTo-Json -Depth 6|Set-Content (Join-Path $qaDir 'QA-RESULT.json') -Encoding UTF8
          }finally{
            $rt=Get-Service SoknaRuntime -ErrorAction SilentlyContinue
            if($rt){if($rt.Status -ne 'Stopped'){Stop-Service SoknaRuntime -ErrorAction SilentlyContinue};& "$env:SystemRoot/System32/sc.exe" delete SoknaRuntime|Out-Host}
            $print=Get-Service SoknaPrintWorker -ErrorAction SilentlyContinue
            if($print){if($print.Status -ne 'Stopped'){Stop-Service SoknaPrintWorker -ErrorAction SilentlyContinue};& "$env:SystemRoot/System32/sc.exe" delete SoknaPrintWorker|Out-Host}
          }
          $global:LASTEXITCODE=0
      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-R239-REAL-EXE-6211-UPGRADE-ACCEPTANCE-QA
          path: ${{ runner.temp }}/R239-EXE-REAL-RESULT/QA-RESULT.json
          if-no-files-found: error
          retention-days: 30
