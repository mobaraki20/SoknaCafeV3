name: SOKNA factory checkpoint76 native exact admission QA
on:
  push:
    branches: [qa/checkpoint55-exact-windows-20261126]
    paths: ['.github/workflows/sokna-factory-checkpoint76-native.yml']
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f38c20083068e540d593876a2c527c51e0157f92
          path: native-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Reconstruct exact factory bytes privately on runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:RUNNER_TEMP base.zip
          curl.exe --fail --location --silent --show-error -H "Authorization: Bearer $env:GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15069153300/zip" -o $base
          if($LASTEXITCODE -ne 0){throw 'BASE_DOWNLOAD_FAILED'}
          if((Get-FileHash $base -Algorithm SHA256).Hash.ToLowerInvariant() -ne '57589151165e5d73c0b0339623e3ee3b2db9ea7c54ffbac69246c9ff3532da2f'){throw 'BASE_HASH_DRIFT'}
          python qa/checkpoint76/reconstruct.py "$env:RUNNER_TEMP/cp76" $base qa/checkpoint76/transfer.b64
          if($LASTEXITCODE -ne 0){throw 'EXACT_REBUILD_FAILED'}
          python qa/checkpoint76/sequence4.py "$env:RUNNER_TEMP/cp76/out"
          if($LASTEXITCODE -ne 0){throw 'SEQUENCE_CORRECTION_FAILED'}
      - name: Actual native verifier on all eight declared archive baselines
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Copy-Item qa/checkpoint76/AdmissionGateQA.cs native-src/qa/sokna-r186/R186Harness.cs -Force
          dotnet run --project native-src/qa/sokna-r186/R186Harness.csproj --configuration Release -- "$env:RUNNER_TEMP/cp76/out/LOCAL-231GG-UPDATE-QA-DO-NOT-INSTALL.zip" "$env:RUNNER_TEMP/exact-admission-qa" "$env:RUNNER_TEMP/admission-proof.json"
          if($LASTEXITCODE -ne 0){throw 'ACTUAL_PACKAGE_GATE_QA_FAILED'}
      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-CHECKPOINT76-NATIVE-SEQ4-ADMISSION-RECEIPT-QA-ONLY
          path: ${{ runner.temp }}/admission-proof.json
          if-no-files-found: error
          retention-days: 30
