name: QA Late Served R4 MariaDB (isolated)
on:
  push:
    branches:
      - qa/late-served-r4-mariadb-20261025
    paths:
      - '.github/workflows/qa-late-served-r4-mariadb.yml'
      - 'qa/late-served-r4/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: qa_root_local_only
        ports:
          - 3306:3306
    steps:
      - uses: actions/checkout@v4
      - name: Install Python driver
        run: python3 -m pip install --break-system-packages --user PyMySQL==1.1.1
      - name: Verify real MariaDB migration and transaction primitives
        env:
          MARIADB_HOST: 127.0.0.1
          MARIADB_PASSWORD: qa_root_local_only
        run: python3 qa/late-served-r4/test_db.py
      - name: Scope notice
        if: always()
        run: |
          echo 'SQL/MariaDB primitives only: does not exercise actual PHP application service, inventory, printing, relay, or Windows updater.'

  debian-db-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtain Debian 13 runtime-only packages
        run: |
          mkdir -p "$RUNNER_TEMP/db-debs"
          docker run --rm -v "$RUNNER_TEMP/db-debs:/out" debian:trixie bash -euc '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install --download-only -y --no-install-recommends mariadb-server php8.4-mysql
            cp /var/cache/apt/archives/*.deb /out/
            ls -lh /out | tail -8
          '
      - uses: actions/upload-artifact@v4
        with:
          name: r4-debian13-mariadb-php84-offline-debs
          path: ${{ runner.temp }}/db-debs/*.deb
          retention-days: 1
          if-no-files-found: error
