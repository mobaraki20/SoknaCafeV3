name: qualify final menu audited bundle

on:
  push:
    branches:
      - transfer/v3-final-menu-041db67-helper
    paths:
      - .github/workflows/qualify-final-menu-bundle.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  audited_head: 041db67ba5fad1f7492f9b25f3cb74d072fcca5e
  bundle_name: soknacafev3-git-041db67ba5fa.bundle
  bundle_ref: refs/heads/transfer-final-menu-041db67

jobs:
  linux-real-env:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: sokna_m2
          MARIADB_USER: sokna
          MARIADB_PASSWORD: sokna
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SOKNA_TEST_DB_HOST: 127.0.0.1
      SOKNA_TEST_DB_PORT: 3306
      SOKNA_TEST_DB_NAME: sokna_m2
      SOKNA_TEST_DB_USER: sokna
      SOKNA_TEST_DB_PASS: sokna
      SOKNA_TEST_DB_ROOT_USER: root
      SOKNA_TEST_DB_ROOT_PASS: root
    steps:
      - name: checkout helper branch
        uses: actions/checkout@v4

      - name: reconstruct audited source from bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="${GITHUB_WORKSPACE}/.transfer/${bundle_name}"
          source_dir="${RUNNER_TEMP}/sokna-source"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          cd "$source_dir"
          git init
          git fetch "$bundle" "${bundle_ref}:refs/heads/audited"
          git checkout audited
          test "$(git rev-parse HEAD)" = "${audited_head}"

      - name: apply candidate migration qualification fix
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/sokna-source"
          cd "$source_dir"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/local-mysql-migration-selftest.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'0022_g3_public_edge_sync', '0023_g4_guest_content_platform'];","'0022_g3_public_edge_sync', '0023_g4_guest_content_platform', '0024_g4_business_extensions', '0025_g4_print_template_packages'];")
          s=s.replace("'guest_content_config', 'guest_media_assets', 'guest_media_derivatives', 'guest_media_references'] as $table)","'guest_content_config', 'guest_media_assets', 'guest_media_derivatives', 'guest_media_references', 'marketing_campaigns', 'marketing_events', 'notification_preferences', 'notification_push_subscriptions', 'notification_outbox', 'notification_inbox', 'print_template_packages', 'print_template_activations'] as $table)")
          p.write_text(s,encoding='utf-8',newline='\n')
          PY

      - name: install php db and zip extensions
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y php-mysql php-zip
          php -r 'var_export(PDO::getAvailableDrivers()); echo PHP_EOL;'
          php -r 'exit(class_exists("ZipArchive") && extension_loaded("sodium") ? 0 : 1);'

      - name: run g4 consolidated real environment chain
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/sokna-source"
          cd "$source_dir"
          mkdir -p qualification-evidence
          set -o pipefail
          ./tests/run-g4-4-product-qualification.sh 2>&1 | tee qualification-evidence/g4-real-env.log
          python3 tests/capture-qualification-evidence.py --id DQ-G4.1 --terminal 'G4.1 Product Qualification: PASS' --log qualification-evidence/g4-real-env.log --out qualification-evidence/DQ-G4.1.json --capability A05 --capability A06 --capability A13 --capability A15 --capability A16 --source-head "${audited_head}"
          python3 tests/capture-qualification-evidence.py --id DQ-G4.2 --terminal 'G4.2 Product Qualification: PASS' --log qualification-evidence/g4-real-env.log --out qualification-evidence/DQ-G4.2.json --capability A21 --capability A22 --capability A23 --source-head "${audited_head}"
          python3 tests/capture-qualification-evidence.py --id DQ-G4.3 --terminal 'G4.3 Product Qualification: PASS' --log qualification-evidence/g4-real-env.log --out qualification-evidence/DQ-G4.3.json --capability A24 --capability A25 --capability A26 --source-head "${audited_head}"
          python3 tests/capture-qualification-evidence.py --id DQ-G4.4 --terminal 'G4.4 Product Qualification: PASS' --log qualification-evidence/g4-real-env.log --out qualification-evidence/DQ-G4.4.json --capability A28 --capability A46 --source-head "${audited_head}"

      - name: upload linux evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-menu-linux-evidence
          path: ${{ runner.temp }}/sokna-source/qualification-evidence/
          if-no-files-found: error

  windows-real-env:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - name: checkout helper branch
        uses: actions/checkout@v4

      - name: reconstruct audited source from bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="$(cygpath -u "$GITHUB_WORKSPACE")/.transfer/${bundle_name}"
          source_dir="$(cygpath -u "$RUNNER_TEMP")/sokna-source"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          cd "$source_dir"
          git init
          git fetch "$bundle" "${bundle_ref}:refs/heads/audited"
          git checkout audited
          test "$(git rev-parse HEAD)" = "${audited_head}"

      - name: ensure inno setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: run g5 windows qualification
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$(cygpath -u "$RUNNER_TEMP")/sokna-source"
          cd "$source_dir"
          mkdir -p qualification-evidence
          set -o pipefail
          ./tests/run-g5-windows-packaging-qualification.sh 2>&1 | tee qualification-evidence/g5-windows.log
          python3 tests/capture-qualification-evidence.py --id DQ-G5 --terminal 'G5 Windows Packaging Qualification: PASS' --log qualification-evidence/g5-windows.log --out qualification-evidence/DQ-G5.json --capability A40 --capability A41 --capability A42 --source-head "${audited_head}"

      - name: run g6 independent component artifact qualification
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$(cygpath -u "$RUNNER_TEMP")/sokna-source"
          artifact_dir="$(cygpath -u "$RUNNER_TEMP")/g6-artifacts"
          cd "$source_dir"
          set -o pipefail
          SOKNA_G6_ARTIFACT_DIR="$artifact_dir" ./tests/run-g6-component-artifact-qualification.sh 2>&1 | tee qualification-evidence/g6-components.log
          python3 tests/capture-qualification-evidence.py --id DQ-G6 --terminal 'G6 Component Release Qualification: PASS' --log qualification-evidence/g6-components.log --out qualification-evidence/DQ-G6.json --capability A44 --capability A50 --source-head "${audited_head}"

      - name: upload windows evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-menu-windows-evidence
          path: ${{ runner.temp }}/sokna-source/qualification-evidence/
          if-no-files-found: error

  final-evidence-gate:
    needs: [linux-real-env, windows-real-env]
    runs-on: ubuntu-latest
    steps:
      - name: checkout helper branch
        uses: actions/checkout@v4

      - name: reconstruct audited source from bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle="${GITHUB_WORKSPACE}/.transfer/${bundle_name}"
          source_dir="${RUNNER_TEMP}/sokna-source"
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          cd "$source_dir"
          git init
          git fetch "$bundle" "${bundle_ref}:refs/heads/audited"
          git checkout audited
          test "$(git rev-parse HEAD)" = "${audited_head}"

      - name: download qualification evidence
        uses: actions/download-artifact@v4
        with:
          pattern: final-menu-*-evidence
          path: qualification-evidence
          merge-multiple: true

      - name: final same-commit product parity evidence gate
        shell: bash
        run: |
          set -euo pipefail
          source_dir="${RUNNER_TEMP}/sokna-source"
          evidence_dir="${GITHUB_WORKSPACE}/qualification-evidence"
          cd "$source_dir"
          ./tests/run-g6-final-qualification.sh "$evidence_dir" "${audited_head}" | tee "$evidence_dir/final.log"

      - name: upload final evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-menu-g6-final-evidence
          path: qualification-evidence/
          if-no-files-found: error
