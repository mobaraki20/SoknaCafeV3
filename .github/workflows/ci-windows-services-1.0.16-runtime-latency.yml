name: CI Windows Services 1.0.16 Runtime Latency

on:
  workflow_dispatch:
  push:
    branches:
      - work/windows-services-1.0.16-runtime-latency

permissions:
  contents: write

concurrency:
  group: ci-windows-services-1.0.16-runtime-latency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-qualify-publish:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify frozen Windows scope and versions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $pkg=(Get-Content packaging/windows/WINDOWS_SERVICES_VERSION.txt -Raw).Trim()
          if($pkg-ne'1.0.16'){throw "Unexpected Windows Services version: $pkg"}
          [xml]$runtime=Get-Content windows/runtime/source/Sokna.Runtime.Service.csproj -Raw
          if([string]$runtime.Project.PropertyGroup.Version-ne'1.0.3'){throw 'Runtime version must be 1.0.3'}
          [xml]$agent=Get-Content windows/print-agent/source/Directory.Build.props -Raw
          if([string]$agent.Project.PropertyGroup.SoknaAgentVersion-ne'6.2.9'){throw 'Print Agent changed outside scope'}
          $compat=Get-Content packaging/windows/windows-services-compatibility-v1.json -Raw|ConvertFrom-Json
          if([string]$compat.package_version-ne'1.0.16'){throw 'Compatibility package version mismatch'}
          if([string]$compat.components.runtime.version-ne'1.0.3'){throw 'Compatibility runtime version mismatch'}
          if([string]$compat.components.'print-agent'.version-ne'6.2.9'){throw 'Compatibility Print Agent drift'}
          if(-not(Test-Path packaging/windows/WINDOWS_SERVICES_1.0.16_NOTES_FA.md)){throw 'Release notes missing'}
          Write-Host 'Windows Services 1.0.16 version/scope contract: PASS'

      - name: Run Runtime contract gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tests/runtime-print-v1-contract.py
          python tests/m7-runtime-gate.py

      - name: Build Runtime 1.0.3 and run scheduler self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build windows/runtime/source/Sokna.Runtime.Service.csproj -c Release
          dotnet run --project windows/runtime/source/Sokna.Runtime.Service.csproj -c Release --no-build -- --health-self-test
          dotnet run --project windows/runtime/source/Sokna.Runtime.Service.csproj -c Release --no-build -- --scheduler-self-test

      - name: Build and regression-test unchanged Print Agent 6.2.9
        working-directory: windows/print-agent/source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build Sokna.PrintWorker.slnx -c Release
          dotnet run --project tests/Sokna.PrintAgent.Tests/Sokna.PrintAgent.Tests.csproj -c Release

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Windows Services 1.0.16 release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path .).Path
          $out=Join-Path $root 'release\out-windows-1.0.16'
          $candidates=@("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          $iscc=$candidates|Where-Object{$_-and(Test-Path -LiteralPath $_ -PathType Leaf)}|Select-Object -First 1
          if(-not$iscc){throw 'ISCC missing'}
          & release/build-windows-release.ps1 -RepoRoot $root -OutputRoot $out -IsccExe $iscc
          $setup=Join-Path $out 'SOKNA-Windows-Services-Setup-1.0.16.exe'
          if(-not(Test-Path -LiteralPath $setup -PathType Leaf)){throw 'Windows Services 1.0.16 installer missing'}
          $index=Get-Content (Join-Path $out 'artifact-index.json') -Raw|ConvertFrom-Json
          if([string]$index.source_commit-ne$env:GITHUB_SHA){throw "artifact source commit mismatch: $($index.source_commit) != $env:GITHUB_SHA"}
          if([string]$index.runtime.version-ne'1.0.3'){throw 'runtime artifact version mismatch'}
          if([string]$index.print_agent.version-ne'6.2.9'){throw 'print agent artifact version mismatch'}
          if([string]$index.windows_services.file-ne'SOKNA-Windows-Services-Setup-1.0.16.exe'){throw 'Windows Services artifact index mismatch'}
          Write-Host 'Windows Services 1.0.16 build: PASS'

      - name: Qualify real Runtime relay cadence, isolation, restart and retry semantics
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=(Resolve-Path 'release\out-windows-1.0.16').Path
          $runtime=(Resolve-Path (Join-Path $out 'shell\SoknaRuntimeService.exe')).Path
          $result=& tests/windows-runtime-relay-latency.ps1 -RuntimeExe $runtime
          $result|Tee-Object -FilePath (Join-Path $out 'RUNTIME_RELAY_LATENCY_QUALIFICATION.json')
          $parsed=$result|ConvertFrom-Json
          if([string]$parsed.result-ne'PASS'){throw 'Runtime relay latency qualification failed'}

      - name: Qualify installer awareness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installer=(Resolve-Path 'release\out-windows-1.0.16\SOKNA-Windows-Services-Setup-1.0.16.exe').Path
          $diag=Join-Path (Resolve-Path .) 'release\installer-awareness-1.0.16'
          & packaging/windows/tests/qualify-installer-awareness.ps1 -InstallerPath $installer -DiagnosticsRoot $diag

      - name: Freeze final qualification and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=(Resolve-Path 'release\out-windows-1.0.16').Path
          $installer=Join-Path $out 'SOKNA-Windows-Services-Setup-1.0.16.exe'
          $runtimeZip=Get-ChildItem (Join-Path $out 'runtime') -Filter 'SoknaRuntime-1.0.3-win-x64.zip'|Select-Object -First 1
          $printZip=Get-ChildItem (Join-Path $out 'print') -Filter 'SoknaPrintAgent-6.2.9-win-x64.zip'|Select-Object -First 1
          if(-not$runtimeZip-or-not$printZip){throw 'component artifacts missing'}
          $latency=Join-Path $out 'RUNTIME_RELAY_LATENCY_QUALIFICATION.json'
          $notes=Join-Path $out 'WINDOWS_SERVICES_1.0.16_NOTES_FA.md'
          Copy-Item 'packaging\windows\WINDOWS_SERVICES_1.0.16_NOTES_FA.md' $notes -Force
          $qualification=Join-Path $out 'WINDOWS_SERVICES_1.0.16_QUALIFICATION.txt'
          @(
            'SOKNA Windows Services 1.0.16 — FINAL QUALIFICATION',
            "source_commit=$env:GITHUB_SHA",
            'windows_services_version=1.0.16',
            'runtime_version=1.0.3',
            'print_agent_version=6.2.9 unchanged',
            'runtime_contract_gates=PASS',
            'runtime_health_self_test=PASS',
            'runtime_scheduler_self_test=PASS',
            'relay_effective_cadence_legacy_5_to_1=PASS',
            'relay_real_timing=PASS',
            'slow_trigger_failure_isolation=PASS',
            'per_trigger_no_overlap=PASS',
            'restart_recovery=PASS',
            'failure_backoff=PASS',
            'ambiguous_retry_identity=PASS',
            'definitive_failure_identity_rotation=PASS',
            'runaway_guard=PASS',
            'print_agent_regression=PASS',
            'installer_build=PASS',
            'installer_awareness=PASS',
            ('installer_sha256='+(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()),
            ('runtime_zip_sha256='+(Get-FileHash $runtimeZip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()),
            ('print_agent_zip_sha256='+(Get-FileHash $printZip.FullName -Algorithm SHA256).Hash.ToLowerInvariant())
          )|Set-Content $qualification -Encoding utf8
          $hashes=Join-Path $out 'SHA256SUMS-FINAL.txt'
          $files=@($installer,$runtimeZip.FullName,$printZip.FullName,(Join-Path $out 'artifact-index.json'),$qualification,$notes,$latency)
          $hashLines=@();foreach($file in $files){$hashLines+="$( (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($file))"};$hashLines|Set-Content $hashes -Encoding utf8
          $kit=Join-Path $out 'SOKNA-Windows-Services-1.0.16-FINAL-Release-Kit.zip'
          if(Test-Path $kit){Remove-Item $kit -Force}
          Compress-Archive -Path $installer,$runtimeZip.FullName,$printZip.FullName,(Join-Path $out 'artifact-index.json'),$qualification,$notes,$latency,$hashes -DestinationPath $kit -CompressionLevel Optimal

      - name: Publish GitHub Release windows-services-v1.0.16
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $out=(Resolve-Path 'release\out-windows-1.0.16').Path
          $tag='windows-services-v1.0.16'
          $assets=@(
            (Join-Path $out 'SOKNA-Windows-Services-Setup-1.0.16.exe'),
            (Join-Path $out 'SOKNA-Windows-Services-1.0.16-FINAL-Release-Kit.zip'),
            (Join-Path $out 'WINDOWS_SERVICES_1.0.16_QUALIFICATION.txt'),
            (Join-Path $out 'RUNTIME_RELAY_LATENCY_QUALIFICATION.json'),
            (Join-Path $out 'WINDOWS_SERVICES_1.0.16_NOTES_FA.md'),
            (Join-Path $out 'SHA256SUMS-FINAL.txt')
          )
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE-eq0){gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber}
          else{gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'SOKNA Windows Services 1.0.16' --notes-file (Join-Path $out 'WINDOWS_SERVICES_1.0.16_NOTES_FA.md')}
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,name,isDraft,isPrerelease,targetCommitish,url

      - name: Upload Windows Services 1.0.16 release kit
        uses: actions/upload-artifact@v4
        with:
          name: SOKNA-Windows-Services-1.0.16-Release-Kit
          if-no-files-found: error
          retention-days: 90
          path: |
            release/out-windows-1.0.16/SOKNA-Windows-Services-Setup-1.0.16.exe
            release/out-windows-1.0.16/SOKNA-Windows-Services-1.0.16-FINAL-Release-Kit.zip
            release/out-windows-1.0.16/WINDOWS_SERVICES_1.0.16_QUALIFICATION.txt
            release/out-windows-1.0.16/RUNTIME_RELAY_LATENCY_QUALIFICATION.json
            release/out-windows-1.0.16/SHA256SUMS-FINAL.txt
