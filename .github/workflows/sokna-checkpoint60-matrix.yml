name: SOKNA checkpoint60 remaining native bridge matrix QA
on:
  push:
    branches: [qa/checkpoint55-exact-windows-20261126]
    paths: ['.github/workflows/sokna-checkpoint60-matrix.yml']
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {origin: R301, fault: none, ledger: '83', run: '44561325048', artifact: SOKNA-R301-LOCAL-CONTROLLED-INSTALL-EXACT-ARTIFACT, file: SOKNA-R301-LOCAL-231FS-PUBLIC-MOVE-CONTROLLED-INSTALL.zip}
          - {origin: R304, fault: none, ledger: '83', run: '44639218881', artifact: SOKNA-R304-EXACT-CANDIDATES-REQUIRE-ONSITE-PREFLIGHT, file: SOKNA-R304-LOCAL-231FU-NATIVE-CANDIDATE-NOT-FIELD.zip}
          - {origin: R306, fault: none, ledger: '83', run: '44723958829', artifact: SOKNA-R306-EXACT-LOCAL-PUBLIC-CANDIDATES-PREFLIGHT, file: SOKNA-R306-LOCAL-231FV-CONTROLLED-PREFLIGHT.zip}
          - {origin: R307, fault: none, ledger: '83', run: '44730988488', artifact: SOKNA-R307-LOCAL-231FW-EXACT-CANDIDATE, file: SOKNA-R307-LOCAL-231FW-FROM-231FV-CONTROLLED-PREFLIGHT.zip}
          - {origin: R3, fault: none, ledger: '90', run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: APACHE_STOPPED, ledger: '90', run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: DATABASE_BACKUP_VERIFIED, ledger: '90', run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: DATABASE_FORWARD_INTENT, ledger: '90', run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: POINTER_SWITCHED, ledger: '90', run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: COMMITTED, ledger: '90', run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: C2, fault: DATABASE_BACKUP_VERIFIED, ledger: '91', run: '45389831526', artifact: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE, file: SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip}
          - {origin: C2, fault: POINTER_SWITCHED, ledger: '91', run: '45389831526', artifact: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE, file: SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip}
          - {origin: C2, fault: COMMITTED, ledger: '91', run: '45389831526', artifact: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE, file: SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip}
    env:
      SOKNA_R186_CI_ONLY: 'YES'
      SOKNA_BASE_LEDGER: ${{ matrix.ledger }}
      SOKNA_ORIGIN: ${{ matrix.origin }}
      SOKNA_FAULT: ${{ matrix.fault }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f38c20083068e540d593876a2c527c51e0157f92
          path: native-src
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-CHECKPOINT51-EXACT-RECONSTRUCTED-QA-ONLY
          run-id: 45706374139
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/current
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-PREREQUISITES-105-QA-CANDIDATE-NOT-INSTALL
          run-id: 45707538026
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/helper
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-APACHE-2471-CANDIDATE-QA-ONLY
          run-id: 45707401488
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apache
      - name: Exercise actual Windows bridge without granting package admission
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=Get-ChildItem "$env:RUNNER_TEMP/baseline" -Recurse -File -Filter '${{ matrix.file }}'|Select-Object -First 1
          $target=Get-ChildItem "$env:RUNNER_TEMP/current" -Recurse -File -Filter 'LOCAL-FINAL-FROZEN-QA-DO-NOT-INSTALL.zip'|Select-Object -First 1
          if(!$base -or !$target){throw 'PINNED_ARCHIVES_MISSING'}
          $env:SOKNA_BASELINE_ZIP=$base.FullName
          $env:SOKNA_CURRENT_QA_ZIP=$target.FullName
          $env:SOKNA_MATRIX_TARGET_ZIP=$target.FullName
          python qa/checkpoint59/prepare_bridge.py
          if($LASTEXITCODE -ne 0){throw 'BRIDGE_PREPARATION_FAILED'}
          Copy-Item qa/checkpoint59/BridgeHarness.cs native-src/qa/sokna-r186/R186Harness.cs -Force
          Push-Location native-src
          try {
            & (Join-Path $env:RUNNER_TEMP 'native-matrix.ps1')
            if($LASTEXITCODE -ne 0){throw 'BRIDGE_TEST_FAILED'}
          }finally{Pop-Location}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SOKNA-CHECKPOINT60-${{ matrix.origin }}-BRIDGE-${{ matrix.fault }}-QA
          path: ${{ runner.temp }}/matrix-receipt.json
          if-no-files-found: error
          retention-days: 7
