name: SOKNA R175 one-time go-live resumable cleanup regression QA
on:
  push:
    branches: [qa/sokna-r175-golive-resume-20261112]
    paths:
      - 'qa/sokna-r175/**'
      - '.github/workflows/sokna-r175-golive-resume-mariadb.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-r174-source-and-disposable-mariadb:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOKNA_R175_DISPOSABLE: YES
      GITHUB_ACTIONS: 'true'
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --protocol=tcp --host=127.0.0.1 --user=root --password=ci-root-only"
          --health-interval=10s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r174-native-windows-candidate-inventory-repair-passed
          run-id: 43233127876
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r174
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql,mbstring,zip
      - name: Reconstruct exact qualified R174 web tree and apply only R175 scoped patch
        run: |
          set -euo pipefail
          PACKAGE="$(find "$RUNNER_TEMP/r174" -type f -name 'SOKNA-R174-CANARY-LOCAL-231EP-52BASE-PANEL-UPDATE.zip' -print -quit)"
          test -n "$PACKAGE"
          echo "b8e15174670240c082a78bf7c87b43d6d72ba33590d1e645f601e7bc45336088  $PACKAGE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/r175-source"
          unzip -p "$PACKAGE" artifacts/local/web.zip > "$RUNNER_TEMP/r174-web.zip"
          unzip -q "$RUNNER_TEMP/r174-web.zip" -d "$RUNNER_TEMP/r175-source"
          (cd "$RUNNER_TEMP/r175-source" && patch -p1 --fuzz=0 --batch < "$GITHUB_WORKSPACE/qa/sokna-r175/R174-TO-R175-LOCAL-GOLIVE-RECOVERY.patch")
          python3 - "$RUNNER_TEMP/r175-source" <<'PY'
          import json,hashlib,sys,pathlib
          src=pathlib.Path(sys.argv[1]); m=json.loads(pathlib.Path('qa/sokna-r175/R175-SOURCE-IDENTITY.json').read_text())
          for item in m['changed']:
            got=hashlib.sha256((src/item['path']).read_bytes()).hexdigest()
            assert got==item['target_sha256'],(item['path'],got)
          assert len(m['changed'])==3
          print('PASS THREE_SCOPED_FILES_BYTE_IDENTICAL')
          PY
          echo "R175_SOURCE=$RUNNER_TEMP/r175-source" >> "$GITHUB_ENV"
      - name: PHP, inline JavaScript, and read-only pending status safety gates
        run: |
          set -euo pipefail
          php -l "$R175_SOURCE/src/Domain/System/GoLiveResetEngine.php"
          php -l "$R175_SOURCE/src/Domain/System/GoLiveResetCoordinator.php"
          php -l "$R175_SOURCE/public/system/go-live.php"
          python3 - "$R175_SOURCE" <<'PY'
          import pathlib,re,sys
          root=pathlib.Path(sys.argv[1]); coordinator=(root/'src/Domain/System/GoLiveResetCoordinator.php').read_text()
          page=(root/'public/system/go-live.php').read_text()
          assert "'table_count'=>21,'counts'=>[]" not in coordinator
          assert 'counts_verified' in coordinator and 'local_batching' in coordinator
          assert 'GOLIVE_NON_JSON_HTTP_' in page
          scripts=re.findall(r'<script>(.*?)</script>',page,re.S)
          assert len(scripts)==1
          pathlib.Path('/tmp/sokna-r175-golive.js').write_text(scripts[0])
          print('PASS READ_ONLY_PENDING_DISPLAYS_UNKNOWN_PUBLIC_COUNTS')
          PY
          node --check /tmp/sokna-r175-golive.js
      - name: Real MariaDB 11.4 interrupted and resumed cleanup, preserved data, epochs
        run: |
          set -euo pipefail
          php qa/sokna-r175/test_r175_disposable_mariadb.php "$R175_SOURCE"
