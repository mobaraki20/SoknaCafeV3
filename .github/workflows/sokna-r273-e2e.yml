name: SOKNA R274 Cutover Resume Exact Public/Local HTTPS MariaDB QA
on:
  push:
    branches: [qa/sokna-r274-cafe-cutover-resume-20261117]
    paths:
      - 'r273/patches/**'
      - 'r273/ci_prepare.py'
      - 'r273/build_packages.py'
      - 'r273/checksums.json'
      - 'r273/tests/**'
      - '.github/workflows/sokna-r273-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-public-owner-cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        public_base_path: ['/new-public', '']
    env:
      R273_PUBLIC_BASE_PATH: ${{ matrix.public_base_path }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: qa-only
          MARIADB_DATABASE: sokna_r273_public
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: R262-EXACT-NATIVE-WINDOWS-UAT-CANDIDATE-DO-NOT-INSTALL
          run-id: 43834210936
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r273/originals/local
      - uses: actions/download-artifact@v4
        with:
          name: R267-EMERGENCY-SCHEMA-QA-NO-HOST-DEPLOY
          run-id: 44025587468
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r273/originals/public
      - name: Verify and reconstitute byte-pinned actual installed source
        shell: bash
        run: |
          set -euo pipefail
          export R273_SOURCE_ROOT="$GITHUB_WORKSPACE/r273"
          export R273_ARCHIVE_ROOT="$RUNNER_TEMP/r273/originals"
          export R273_EXTRACT_ROOT="$RUNNER_TEMP/r273/extracted"
          python3 r273/ci_prepare.py
          find "$RUNNER_TEMP/r273/originals" -name '*.zip' -type f -maxdepth 9 -print
          python3 - <<'PY'
          import json,pathlib,os,zipfile,hashlib
          paths=json.load(open(pathlib.Path(os.environ['R273_EXTRACT_ROOT'])/'baselines.json'))
          for name,path in paths.items():
           with zipfile.ZipFile(path) as f: assert f.testzip() is None,name
           print('PINNED_ARCHIVE',name,path)
          PY
      - name: Build exact two cumulative packages, assert SHA and syntax
        shell: bash
        run: |
          set -euo pipefail
          export R273_EXTRACT_ROOT="$RUNNER_TEMP/r273/extracted"
          export R273_SOURCE_ROOT="$GITHUB_WORKSPACE/r273"
          export R273_LOCAL_BASE="$(python3 -c 'import json,os;print(json.load(open(os.environ["R273_EXTRACT_ROOT"]+"/baselines.json"))["local"])')"
          export R273_PUBLIC_BASE="$(python3 -c 'import json,os;print(json.load(open(os.environ["R273_EXTRACT_ROOT"]+"/baselines.json"))["public"])')"
          python3 r273/build_packages.py > "$RUNNER_TEMP/r273-build-proof.txt"
          cat "$RUNNER_TEMP/r273-build-proof.txt"
          python3 - <<'PY'
          import json,pathlib,os
          p=json.load(open(os.environ['R273_EXTRACT_ROOT']+'/output/R274-SOURCE-BUILD-PROOF.json'))
          assert p['local']['sha256']=='9038abd4757ed1ed3dc3ab92e54f9266096fe73d5919d7667a1f195540991ec4'
          assert p['public']['sha256']=='68725567e7336e0b43691ff4adae8b494b4a9c793a50a30d4564a2dab11daa92'
          assert p['operator_install_allowed'] is False
          print('R274_CANDIDATE_SHA_LOCAL',p['local']['sha256']);print('R274_CANDIDATE_SHA_PUBLIC',p['public']['sha256'])
          PY
          for php in \
           "$R273_EXTRACT_ROOT/local/src/Domain/PublicEdge/PublicMoveSimpleReplacement.php" \
           "$R273_EXTRACT_ROOT/local/src/Domain/PublicEdge/PublicEdgeSyncClient.php" \
           "$R273_EXTRACT_ROOT/local/src/Domain/PublicEdge/PublicEdgePublisherService.php" \
           "$R273_EXTRACT_ROOT/local/public/integrations/api.php" \
           "$R273_EXTRACT_ROOT/public/src/Http/PublicHttpKernel.php" \
           "$R273_EXTRACT_ROOT/public/src/Realtime/RealtimeService.php" \
           "$R273_EXTRACT_ROOT/public/src/Authority/AuthorityEpochService.php" \
           "$R273_EXTRACT_ROOT/public/src/Security/PublicMoveReplacementGate.php"; do php -l "$php"; done
          node --check "$R273_EXTRACT_ROOT/local/public/assets/connections-workspace.js"
          node --check "$R273_EXTRACT_ROOT/public/assets/sokna-public-move.js"
          python3 packaging/windows/release-gates/check_local_release_set.py \
            "$R273_EXTRACT_ROOT/output/SOKNA-R274-LOCAL-231FK-CAFE-CUTOVER-RESUME-QA-DO-NOT-INSTALL.zip"
          python3 r273/tests/check_delivery_eligibility.py \
            "$R273_EXTRACT_ROOT/output/SOKNA-R274-LOCAL-231FK-CAFE-CUTOVER-RESUME-QA-DO-NOT-INSTALL.zip" \
            "$R273_EXTRACT_ROOT/output/SOKNA-R274-PUBLIC-35II-OWNER-RESUME-CODE-ONLY-QA-DO-NOT-INSTALL.zip"
      - name: Actual MariaDB + Public owner HTTP + Local end-to-end move and full publication
        shell: bash
        env:
          GITHUB_ACTIONS: 'true'
          R273_DB_PASSWORD: qa-only
          R273_PUBLIC_DB: sokna_r273_public
          R273_INSTALLATION_ID: local-cafe-e2e-001
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-mysql php-zip stunnel4 ca-certificates
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4","root","qa-only",[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$p->exec("CREATE DATABASE sokna_r273_local CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          export R273_PUBLIC_ROOT="$RUNNER_TEMP/r273/extracted/public"
          export R273_LOCAL_ROOT="$RUNNER_TEMP/r273/extracted/local"
          export R273_LOCAL_DATA="$RUNNER_TEMP/r273/local-private"
          mkdir -p "$R273_LOCAL_DATA/guest-media" "$R273_PUBLIC_ROOT/src/Emergency"
          cp -a apps/public/src/Emergency/. "$R273_PUBLIC_ROOT/src/Emergency/"
          php r273/tests/prepare_public.php
          sudo sh -c 'echo "127.0.0.1 r273-public.test" >> /etc/hosts'
          openssl req -new -newkey rsa:2048 -nodes -x509 -days 1 \
            -keyout "$RUNNER_TEMP/r273/key.pem" -out "$RUNNER_TEMP/r273/cert.pem" \
            -subj "/CN=r273-public.test" -addext "subjectAltName=DNS:r273-public.test" >/dev/null 2>&1
          sudo cp "$RUNNER_TEMP/r273/cert.pem" /usr/local/share/ca-certificates/r273-local-public.crt
          sudo update-ca-certificates >/dev/null
          cat > "$RUNNER_TEMP/r273/stunnel.conf" <<EOF
          foreground = yes
          [web]
          client = no
          accept = 127.0.0.1:18443
          connect = 127.0.0.1:18882
          cert = $RUNNER_TEMP/r273/cert.pem
          key = $RUNNER_TEMP/r273/key.pem
          EOF
          php -S 127.0.0.1:18882 r273/tests/public_router.php > "$RUNNER_TEMP/r273/public-http.log" 2>&1 &
          public_pid=$!
          stunnel4 "$RUNNER_TEMP/r273/stunnel.conf" > "$RUNNER_TEMP/r273/stunnel.log" 2>&1 &
          tls_pid=$!
          trap 'kill $public_pid $tls_pid 2>/dev/null || true' EXIT
          export NO_PROXY="127.0.0.1,localhost,r273-public.test" no_proxy="127.0.0.1,localhost,r273-public.test"
          for i in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 2 "https://r273-public.test:18443${R273_PUBLIC_BASE_PATH}/health" > "$RUNNER_TEMP/r273/health.txt" 2>/dev/null; then break; fi
            sleep 0.25
          done
          grep -q '"ok":true' "$RUNNER_TEMP/r273/health.txt"
          php r273/tests/real_existing_move.php | tee "$RUNNER_TEMP/r273/real-e2e.log" || {
            tail -n 120 "$RUNNER_TEMP/r273/public-http.log"
            tail -n 30 "$RUNNER_TEMP/r273/stunnel.log"
            exit 1
          }
          grep -q 'R273_REAL_EXISTING_PAIRED_MOVE_HTTP_OWNERS_DB' "$RUNNER_TEMP/r273/real-e2e.log"
          php -l r273/tests/r274_lost_reply_resume.php
          php r273/tests/r274_lost_reply_resume.php | tee "$RUNNER_TEMP/r273/lost-reply-resume.log"
          grep -q 'R274_LOST_REPLY_RESUME_STATUS_SAFE_PASS' "$RUNNER_TEMP/r273/lost-reply-resume.log"
          echo R274_HTTPS_OWNER_LOCAL_TWO_PHASE_FULL_SYNC_AND_SAFE_RESUME_PASS
      - uses: actions/upload-artifact@v4
        if: success() && matrix.public_base_path == '/new-public'
        with:
          name: R274-TWO-CUMULATIVE-SOURCE-QA-NOT-OPERATOR-INSTALL
          path: |
            ${{ runner.temp }}/r273/extracted/output/*.zip
            ${{ runner.temp }}/r273/extracted/output/*.json
          if-no-files-found: error
          retention-days: 7
