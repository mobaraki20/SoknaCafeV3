name: SOKNA finance regression on discount reversal candidate
on:
  push:
    branches: [qa/sokna-consolidated-release-factory-20261124]
    paths: ['.github/workflows/sokna-discount-regression.yml','qa/sokna-discount-regression/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  migration:
    strategy:
      fail-fast: false
      matrix:
        mode: [reversal, tax, revised-grant]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable-batch-f-ci
          MARIADB_DATABASE: sokna_ci_batch_f2
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, zip, curl, gd
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-FINAL-FROZEN-DO-NOT-INSTALL
          run-id: 45510489108
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Exact bundle lifecycle
        env:
          SOKNA_CI_DB_PASS: disposable-batch-f-ci
          SOKNA_MIGRATION_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local" "$RUNNER_TEMP/public"
          unzip -q "$RUNNER_TEMP/frozen/LOCAL-FINAL-WEB.zip" -d "$RUNNER_TEMP/local"
          unzip -q "$RUNNER_TEMP/frozen/PUBLIC-FINAL-WEB.zip" -d "$RUNNER_TEMP/public"
          python3 - <<'PY'
          import pathlib,os,json,hashlib,base64,zlib
          r=pathlib.Path(os.environ['RUNNER_TEMP']); h=lambda b:hashlib.sha256(b).hexdigest()
          raw=zlib.decompress(base64.b64decode(pathlib.Path('qa/sokna-discount-reversal/delta.b64').read_bytes(),validate=True))
          assert h(raw)=='18e647fb51f933dcd5c5e28731ebc935e938321a1b5496f2813a679a166110ba'
          for name,v in json.loads(raw).items():
              f=r/name;b=f.read_bytes();assert h(b)==v['before'],name
              lines=b.decode().splitlines(keepends=True)
              for a,c,s in reversed(v['edits']):lines[a:c]=[s]
              b=''.join(lines).encode();assert h(b)==v['after'],name;f.write_bytes(b)
          raw=zlib.decompress(base64.b64decode(pathlib.Path('qa/sokna-discount-reversal/delta-v2.b64').read_bytes(),validate=True))
          assert h(raw)=='1c241e8c041eda5f23371cdc082e369018c542b60625d1e6d2de48d87149dd21'
          for name,v in json.loads(raw).items():
              f=r/name;b=f.read_bytes();assert h(b)==v['before'],name
              lines=b.decode().splitlines(keepends=True)
              for a,c,s in reversed(v['edits']):lines[a:c]=[s]
              b=''.join(lines).encode();assert h(b)==v['after'],name;f.write_bytes(b)
          PY
          php -l "$RUNNER_TEMP/local/src/Domain/Finance/SettlementService.php"
          php -l "$RUNNER_TEMP/local/src/Domain/Orders/OrderStaffActionService.php"
          php qa/sokna-final-20261124/test_mariadb_exact_setup.php "$RUNNER_TEMP/local" sokna_ci_batch_f2 setup 0093_bundle_distribution_provenance
          case "$SOKNA_MIGRATION_MODE" in
            tax) php qa/sokna-request-m/test_tax_post_grant.php ;;
            reversal|revised-grant)
              awk '/^\$tax=/{exit}{print}' qa/sokna-request-m/test_tax_post_grant.php > "$RUNNER_TEMP/bundle.php"
              if [ "$SOKNA_MIGRATION_MODE" = reversal ]; then
                cat qa/sokna-fin-reversal/scenario.php >> "$RUNNER_TEMP/bundle.php"
              else
                cat qa/sokna-discount-regression/scenario.php >> "$RUNNER_TEMP/bundle.php"
              fi
              php "$RUNNER_TEMP/bundle.php" ;;
          esac
