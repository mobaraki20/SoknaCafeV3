name: Apply P3 R3 Version Compare Contract Fix

on:
  push:
    branches:
      - work/maintenance-v4-windows-p3-home-package-r3
    paths:
      - .github/workflows/apply-p3-r3-version-compare-contract-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: work/maintenance-v4-windows-p3-home-package-r3
      - name: Reconcile privileged semantic version comparison
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('packaging/windows/scripts/setup-windows-components-v5.ps1')
          s=p.read_text(encoding='utf-8')
          old="function Compare-Version([string]$a,[string]$b){$va=$null;$vb=$null;if(-not[Version]::TryParse(([string]$a).Split('-')[0],[ref]$va)){return -1};if(-not[Version]::TryParse(([string]$b).Split('-')[0],[ref]$vb)){return -1};$va.CompareTo($vb)}"
          new="""function Compare-Version([string]$a,[string]$b){
            function Parts([string]$v){
              $base=([string]$v).Split('+')[0].Split('-')[0].Trim()
              $tokens=@($base.Split('.')|Where-Object{$_-ne''})
              if($tokens.Count-lt1-or$tokens.Count-gt4){return $null}
              $parts=@(0,0,0,0)
              for($i=0;$i-lt$tokens.Count;$i++){$n=0;if(-not[int]::TryParse($tokens[$i],[ref]$n)-or$n-lt0){return $null};$parts[$i]=$n}
              return ,$parts
            }
            $pa=Parts $a;$pb=Parts $b
            if($null-eq$pa-or$null-eq$pb){return -1}
            for($i=0;$i-lt4;$i++){if($pa[$i]-gt$pb[$i]){return 1};if($pa[$i]-lt$pb[$i]){return -1}}
            return 0
          }"""
          if old in s:
              s=s.replace(old,new,1)
          elif 'function Parts([string]$v)' not in s:
              raise SystemExit('Compare-Version marker missing')
          p.write_text(s,encoding='utf-8',newline='\n')
          PY
      - name: Verify semantic comparison contract in Windows PowerShell-compatible source
        shell: pwsh
        run: |
          $src=Get-Content packaging/windows/scripts/setup-windows-components-v5.ps1 -Raw
          if($src-notmatch [regex]::Escape('function Parts([string]$v)')){throw 'normalized comparison helper missing'}
          if($src-match '\[Version\]::TryParse'){throw 'legacy System.Version comparison remains'}
          Write-Host 'Privileged version comparison now zero-pads to four numeric components.'
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/windows/scripts/setup-windows-components-v5.ps1
          git commit -m 'fix(maintenance): align privileged semantic version comparison'
          git push origin HEAD:work/maintenance-v4-windows-p3-home-package-r3
