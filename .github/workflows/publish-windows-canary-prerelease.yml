name: Publish SOKNA Windows Services Canary Pre-release

# Distribution workflow only. Does not update Local/Public or any installed host.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact tested 40-character source commit SHA
        type: string
        required: true
      release_tag:
        description: Unique tag windows-services-vX.Y.Z-rc.N
        type: string
        required: true
      confirmation:
        description: Type PUBLISH_CANARY_PRERELEASE to approve distribution
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: sokna-canary-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build exact tested source and publish prerelease
    runs-on: windows-latest
    timeout-minutes: 65
    steps:
      - name: Validate operator input, version tag and default branch
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APPROVAL: ${{ inputs.confirmation }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REF -cne 'refs/heads/main'){throw 'Run publication only from main workflow.'}
          if($env:APPROVAL -cne 'PUBLISH_CANARY_PRERELEASE'){throw 'Explicit approval missing.'}
          if($env:SOURCE_SHA -cnotmatch '^[a-f0-9]{40}$'){throw 'Exact lowercase commit SHA required.'}
          if($env:RELEASE_TAG -cnotmatch '^windows-services-v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'){
            throw 'Release tag must be windows-services-vX.Y.Z-rc.N.'
          }

      - name: Enforce six passing PR CI workflows on exact source SHA
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $required=@('V3 Component Gates','M10 Release Qualification',
            'G8 Local Endpoint Installation','Working cross-version Local slot contract',
            'M9 Packaging Gate','P6 Integrated Regression')
          $all=@()
          foreach($page in 1,2,3){
            $uri="repos/$env:GITHUB_REPOSITORY/actions/runs?head_sha=$env:SOURCE_SHA&per_page=100&page=$page"
            $response=(& gh api $uri | ConvertFrom-Json)
            if($LASTEXITCODE -ne 0){throw 'Could not retrieve exact source CI evidence.'}
            $all+=@($response.workflow_runs)
            if(@($response.workflow_runs).Count -lt 100){break}
          }
          foreach($check in $required){
            $passed=@($all | Where-Object { $_.name -ceq $check -and
              $_.head_sha -ceq $env:SOURCE_SHA -and $_.conclusion -ceq 'success' })
            if($passed.Count -eq 0){throw "Missing passing CI for exact SHA: $check"}
          }
          Write-Host 'PASS: six CI workflows for exact source SHA.'

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind source SHA and tag to version
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference='Stop'
          $actual=(& git rev-parse HEAD).Trim().ToLowerInvariant()
          if($actual -cne $env:SOURCE_SHA){throw 'Checkout source SHA mismatch.'}
          $version=(Get-Content packaging/windows/WINDOWS_SERVICES_VERSION.txt -Raw).Trim()
          if($env:RELEASE_TAG -cnotmatch "^windows-services-v$([regex]::Escape($version))-rc\.[0-9]+$"){
            throw 'Release tag does not match version of source.'
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build from canonical Windows Services release pipeline
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $PSNativeCommandUseErrorActionPreference=$true
          choco install innosetup --no-progress -y
          if($LASTEXITCODE -ne 0){throw 'Inno Setup installation failed.'}
          $iscc=@("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe") |
            Where-Object {$_ -and (Test-Path -LiteralPath $_ -PathType Leaf)} |
            Select-Object -First 1
          if(-not $iscc){throw 'Inno Setup compiler missing.'}
          $root=(Resolve-Path .).Path
          & release/build-windows-release.ps1 -RepoRoot $root -OutputRoot (Join-Path $root 'release\out-windows') -IsccExe $iscc
          if($LASTEXITCODE -ne 0){throw 'Canonical Windows release build failed.'}

      - name: Verify distributable hash, source identity and build notes
        shell: pwsh
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $ErrorActionPreference='Stop'
          $out=(Resolve-Path 'release/out-windows').Path
          $index=Get-Content (Join-Path $out 'artifact-index.json') -Raw | ConvertFrom-Json
          $version=(Get-Content packaging/windows/WINDOWS_SERVICES_VERSION.txt -Raw).Trim()
          if([string]$index.source_commit -cne $env:SOURCE_SHA){throw 'Built source commit drift.'}
          $name=[string]$index.windows_services.file
          if($name -cne "SOKNA-Windows-Services-Setup-$version.exe"){throw 'Unexpected installer name.'}
          $exe=Join-Path $out $name
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf) -or (Get-Item $exe).Length -lt 1000000){
            throw 'Installer missing or truncated.'
          }
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha -cne [string]$index.windows_services.sha256){throw 'Installer SHA-256 mismatch.'}
          "$sha  $name" | Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          @(
            "# SOKNA Windows Services $version - Canary prerelease"
            ''
            "Source commit: $env:SOURCE_SHA"
            "Installer SHA-256: $sha"
            ''
            'Universal installer for independent SOKNA installations.'
            'PRE-RELEASE: Downloadability and passing CI do NOT authorize installation.'
            'Run only after the installed baseline, backups, rollback and real-host'
            'Canary upgrade path have been explicitly qualified.'
            'Do not deploy to the live cafe before successful Home UAT.'
            'Local/Public are separately updated; this release updates Windows Services only.'
          ) | Set-Content (Join-Path $out 'PRERELEASE_NOTES.md') -Encoding utf8

      - name: Publish GitHub release assets with a new RC tag
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference='Stop'
          $uri="repos/$env:GITHUB_REPOSITORY/git/ref/tags/$env:RELEASE_TAG"
          $old=$ErrorActionPreference
          $ErrorActionPreference='Continue'
          $existing=& gh api $uri --silent 2>$null
          $existingCode=$LASTEXITCODE
          $ErrorActionPreference=$old
          if($existingCode -eq 0){throw 'Tag exists; choose a new RC number.'}
          $out=(Resolve-Path 'release/out-windows').Path
          $index=Get-Content (Join-Path $out 'artifact-index.json') -Raw | ConvertFrom-Json
          $exe=Join-Path $out ([string]$index.windows_services.file)
          & gh release create $env:RELEASE_TAG $exe (Join-Path $out 'artifact-index.json') `
            (Join-Path $out 'SHA256SUMS.txt') `
            --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_SHA `
            --prerelease --latest=false `
            --title "SOKNA Windows Services $env:RELEASE_TAG (Canary)" `
            --notes-file (Join-Path $out 'PRERELEASE_NOTES.md')
          if($LASTEXITCODE -ne 0){throw 'GitHub release creation failed.'}
          Write-Host "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG"
