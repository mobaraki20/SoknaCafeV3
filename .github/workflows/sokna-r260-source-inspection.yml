name: SOKNA R260 Inspect Existing Public Pair/Sync Contracts
on:
  push:
    branches: [qa/sokna-r260-simple-public-replacement-20261116]
    paths:
      - .github/workflows/sokna-r260-source-inspection.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover pinned QA source without installing anything
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/r249"
          gh run download 43749990301 -R "$GITHUB_REPOSITORY" -n sokna-r249-dual-baseline-gated-public-candidate -D "$RUNNER_TEMP/r249"
          python3 - <<'PY'
          import pathlib,hashlib,os
          d=pathlib.Path(os.environ['RUNNER_TEMP'])/'r249'
          a=[p for p in d.rglob('*.zip') if hashlib.sha256(p.read_bytes()).hexdigest()=='5c887968b6fcec1126e2b1b3123552a9ba0ba2c7672d29774c05ec58fa5cd0e4']
          if len(a)!=1:raise SystemExit('BASE_NOT_PINNED')
          (d/'pin.txt').write_text(str(a[0]))
          PY
          python3 r259/integrate_real_public.py --r249 "$(cat "$RUNNER_TEMP/r249/pin.txt")" --repo . --out "$RUNNER_TEMP/r260"
      - name: Print only non-secret pairing and guest table source snippets
        run: |
          python3 - <<'PY'
          import pathlib,os,re
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'r260/qa-public-payload'
          paths=['setup/api.php','src/Setup/PublicSetupService.php','src/Http/PublicHttpKernel.php','src/Http/InstallationProjectionHttpAdapter.php','src/Http/GuestSyncHttpAdapter.php']
          paths+=sorted(str(p.relative_to(root)) for p in (root/'database/migrations').glob('*.sql'))[-3:]
          for name in paths:
            p=root/name
            if not p.is_file():continue
            lines=p.read_text().splitlines()
            print('\nSOURCE',name,'LINES',len(lines))
            regex=r'pair|code|guest_order|orders|pending|intake|installation|source_base|secret|setup|authority|empty'
            indexes=[i for i,line in enumerate(lines) if re.search(regex,line,re.I)]
            focus=set()
            for i in indexes[:45]:
              for j in range(max(0,i-2),min(len(lines),i+3)):focus.add(j)
            for i in sorted(focus):
              line=lines[i]
              if len(line)>520:line=line[:520]+' [TRUNCATED]'
              print(f'{i+1}: {line}')
          PY
