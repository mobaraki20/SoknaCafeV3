name: Sokna CP133B targeted report API and mobile visual follow-up
permissions:
  contents: read
  actions: read
'on':
  push:
    branches:
    - qa/cp133-marketing-20261126
    paths:
    - .github/workflows/cp133b-candidate.yml
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports:
        - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
    steps:
    - name: Reconstruct exact CP132 from pinned successful workflow
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\n/usr/bin/python3 - <<'PYCODE'\nimport os,pathlib,hashlib,urllib.request,subprocess,yaml\n\
        url='https://raw.githubusercontent.com/mobaraki20/SoknaCafeV3/739906e98dceecb8cc3c4a351a0108f774d55c55/.github/workflows/cp118-phase01-db.yml'\n\
        raw=urllib.request.urlopen(url,timeout=30).read(600000)\nassert hashlib.sha256(raw).hexdigest()=='bfa3af14d81c1726c172ba10cb2b0f1599d0aa80fd2debdd5361c0a949a3b9bf'\n\
        steps=yaml.safe_load(raw)['jobs']['database']['steps']\nend=next(i for i,s in enumerate(steps) if s['name']=='Apply\
        \ CP132 exact cumulative source')\nassert end==64, end\nfor step in steps[:end+1]:\n    assert 'run' in step and set(step)<=\
        \ {'name','run','env'}, step['name']\n    env=dict(os.environ)\n    marker=chr(36)+'{{'\n    cmd=step['run'].replace(marker+'\
        \ github.repository }}','mobaraki20/SoknaCafeV3')\n    assert marker not in cmd\n    print('Pinned source: '+step['name'],flush=True)\n\
        \    subprocess.run(['bash','-e','-o','pipefail','-c',cmd],env=env,check=True)\nPYCODE\n"
    - name: Apply exact candidate delta and verify both canonical sources
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\npython3 - <<'PYCODE'\nimport base64,zlib,json,pathlib,hashlib\nH=lambda\
        \ b:hashlib.sha256(b).hexdigest()\nraw=zlib.decompress(base64.b64decode(''))\n\
        assert H(raw)=='af19a7287dbd88d2f847bb72424e994b314b6bb0caa91bd4f7ef2e465d7f959a'\nfor n,(before,after,edits) in json.loads(raw).items():\n\
        \ p=pathlib.Path(n);a=p.read_bytes();assert H(a)==before,n\n s=a.decode('utf-8')\n for i,j,t in reversed(edits):s=s[:i]+t+s[j:]\n\
        \ out=s.encode();assert H(out)==after,n;p.write_bytes(out)\n print('PASS exact delta',n)\nfor d,n,expected in [('local',625,'cffec10da2a07bd4124ec197881fe4ad553e5c16f182a8563c8c412ca08527ec'),('public',258,'a831b8475bcfe673faec1df023abafe647cb9339ac8627470a734bb53f169859')]:\n\
        \ p=pathlib.Path(d);names=sorted(x.relative_to(p).as_posix() for x in p.rglob('*') if x.is_file());actual=H(''.join(n+'\\\
        0'+H((p/n).read_bytes())+'\\n' for n in names).encode());assert len(names)==n and actual==expected,(d,actual);print('PASS\
        \ canonical',d,actual)\nPYCODE\n"
    - name: Prepare cp133b-local-db.php
      run: 'set -euo pipefail

        cat > "$RUNNER_TEMP/cp133b-local-db.php" <<''QAEOF''

        <?php

        declare(strict_types=1);

        if(PHP_SAPI!==''cli''||getenv(''QA_DB_PASSWORD'')!==''synthetic-cp116-ci-only'')exit(2);

        $root=realpath($argv[1]);if($root===false||basename($root)!==''local'')exit(2);

        require $root.''/bootstrap.php'';

        require_once $root.''/src/Setup/BrowserSetupService.php'';

        use Sokna\Local\Core\{Migrations,Observability};

        use Sokna\Local\Domain\Recovery\{BusinessBackupService,RecoveryException,MediaSnapshotCodec};

        use Sokna\Local\Setup\BrowserSetupService;

        function connectQa(string $db=''''):PDO {if($db!==''''&&!in_array($db,[''sokna_cp119_a'',''sokna_cp119_b''],true))throw
        new RuntimeException(''not QA schema'');$p=new PDO(''mysql:host=127.0.0.1;port=3306;dbname=''.$db.'';charset=utf8mb4'',''root'',getenv(''QA_DB_PASSWORD''),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_EMULATE_PREPARES=>false]);$p->exec("SET
        time_zone = ''+03:30''");return $p;}

        function snapshotQa(PDO $p):array{$digests=[];foreach($p->query("SELECT TABLE_NAME FROM information_schema.TABLES
        WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE=''BASE TABLE'' ORDER BY TABLE_NAME")->fetchAll(PDO::FETCH_COLUMN) as
        $t){$rows=$p->query(''SELECT * FROM `''.str_replace(''`'',''``'',$t).''`'')->fetchAll(PDO::FETCH_ASSOC);$encoded=array_map(fn($r)=>json_encode($r,JSON_THROW_ON_ERROR|JSON_INVALID_UTF8_SUBSTITUTE),$rows);sort($encoded,SORT_STRING);$digests[$t]=hash(''sha256'',implode("\n",$encoded));}return
        $digests;}

        function check($ok,string $name):void {if(!$ok)throw new RuntimeException(''FAIL ''.$name);echo ''PASS ''.$name."\n";}

        function reject(BusinessBackupService $b,string $f,string $pass,string $code):void {try{$b->restoreEncryptedToEmptyTarget($f,$pass);throw
        new RuntimeException(''unexpected restore'');}catch(RecoveryException $e){if($e->errorCode!==$code)throw new RuntimeException(''expected
        ''.$code.'' got ''.$e->errorCode);}}

        $server=connectQa();$dir=sys_get_temp_dir().''/sokna-cp119-''.bin2hex(random_bytes(6));mkdir($dir,0700,true);

        $server->exec(''CREATE DATABASE sokna_cp119_b CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'');

        $setup=new BrowserSetupService(dirname($root),$root);$dataB=$dir.''/b'';

        try{$status=$setup->installNew([''data_dir''=>$dataB,''db''=>[''host''=>''127.0.0.1'',''port''=>''3306'',''name''=>''sokna_cp119_b'',''user''=>''root'',''pass''=>getenv(''QA_DB_PASSWORD'')],''admin_user''=>''qa-target'',''admin_password''=>''synthetic-qa-admin-not-real'',''cafe_name''=>''QA
        TARGET'',''table_count''=>2]);}catch(Throwable $e){echo ''setup failure ''.get_class($e).'' ''.$e->getMessage().''
        ''.json_encode($e->details??[])."\n";throw $e;}

        check(($status[''success'']??false)&&($status[''health''][''migrations_applied'']??0)===93,''actual_browser_setup_service_93_migrations'');

        $cfg=require dirname($root).''/config.php'';$core=sokna_local_bootstrap($cfg);$pdo=$core->database();$actor=$pdo->query("SELECT
        id,role FROM users WHERE username=''qa-target''")->fetch(PDO::FETCH_ASSOC);

        function deny(callable $f,string $code,string $name):void{try{$f();throw new RuntimeException(''unexpected success'');}catch(Throwable
        $e){check(($e->errorCode??'''')===$code,$name);}}

        $m=$core->marketing();

        $m->saveCampaign([''name''=>''QA133B campaign'',''headline''=>''QA campaign'',''status''=>''draft'',''public_visible''=>false],$actor);

        $m->saveEvent([''title''=>''QA133B event'',''starts_at''=>''2030-04-01T10:00'',''status''=>''scheduled'',''public_visible''=>true],$actor);

        $pdo->exec("INSERT INTO categories(category_key,name) VALUES(''qa133b-cat'',''QA133B category'')");$cat=(int)$pdo->lastInsertId();

        $pdo->prepare("INSERT INTO items(item_code,category_id,name,price) VALUES(''QA133B-123'',?,''QA133B item 123'',500)")->execute([$cat]);$item=(int)$pdo->lastInsertId();

        $pdo->prepare("INSERT INTO item_variant_families(family_key,category_id,name) VALUES(''qa133b-fam'',?,''QA133B family'')")->execute([$cat]);$fam=(int)$pdo->lastInsertId();

        $pdo->prepare("INSERT INTO item_variant_members(family_id,item_id,label) VALUES(?,?,''QA size'')")->execute([$fam,$item]);

        $g=$core->reporting()->itemSalesGroups();check(count(array_filter($g[''categories''],fn($x)=>(int)$x[''id'']===$cat&&(int)$x[''item_count'']===1))===1,''report_groups_category'');check(count(array_filter($g[''families''],fn($x)=>(int)$x[''id'']===$fam&&(int)$x[''item_count'']===1))===1,''report_groups_family'');

        $p=$core->reporting()->catalogPricingReport();$rows=array_values(array_filter($p[''items''],fn($x)=>(int)$x[''item_id'']===$item));check(count($rows)===1&&$rows[0][''price'']===500&&$rows[0][''ingredient_cost'']===null,''pricing_real_missing_cost_not_zero'');

        echo "CP133B DB PASS\n";


        QAEOF

        '
    - name: Prepare cp133b-browser.cjs
      run: 'set -euo pipefail

        cat > "$RUNNER_TEMP/cp133b-browser.cjs" <<''QAEOF''

        const {chromium}=require(process.env.RUNNER_TEMP+''/pw/node_modules/playwright'');const fs=require(''fs''),path=require(''path''),assert=require(''assert/strict'');const
        shots=path.join(process.env.RUNNER_TEMP,''cp133b-screenshots'');fs.mkdirSync(shots,{recursive:true});const failures=[];function
        ck(v,k){assert.ok(v,k);console.log(''PASS ''+k)}async function group(n,fn){try{await fn();console.log(''GROUP PASS
        ''+n)}catch(e){failures.push(n);console.log(''GROUP FAIL ''+n+'' ''+e.stack)}}

        (async()=>{const b=await chromium.launch({channel:''chrome'',headless:true});try{const local=''http://127.0.0.1:18765'',pub=''http://127.0.0.1:18766'';const
        shot=async(p,n)=>p.screenshot({path:path.join(shots,n+''.png''),animations:''disabled'',fullPage:false});const open=async(p,url)=>{p.setDefaultTimeout(12000);const
        r=await p.goto(url,{waitUntil:''domcontentloaded''});console.log(''HTTP ''+r.status()+'' ''+p.url());};const lc=await
        b.newContext({viewport:{width:390,height:844},locale:''fa-IR''});const l=await lc.newPage();l.on(''pageerror'',e=>console.log(''LOCAL_ERROR
        ''+e.message));await open(l,local+''/login.php'');const a=l.locator(''[data-login-account][data-username="qa-target"]'');if(await
        a.isVisible())await a.click();else ck(await a.evaluate(e=>e.classList.contains(''is-selected'')),''qa_account_selected'');await
        l.locator(''input[name=password]'').fill(''synthetic-qa-admin-not-real'');await Promise.all([l.waitForNavigation(),l.locator(''form[data-login-form]
        button[type=submit]'').click()]);

        await group(''mobile-pager'',async()=>{await open(l,local+''/marketing/'');await l.locator(''[data-campaign-list]
        tr'').filter({hasText:''QA133B campaign''}).waitFor();for(const kind of [''campaign'',''event'']){if(kind===''event''){await
        l.locator(''[data-tab=events]'').click();await l.locator(''[data-event-list] tr'').filter({hasText:''QA133B event''}).waitFor();}const
        a=await l.locator(''[data-list-prev=''+kind+'']'').boundingBox(),c=await l.locator(''[data-list-next=''+kind+'']'').boundingBox();ck(Math.abs(a.y-c.y)<2&&Math.abs(a.x-c.x)>10,''mobile_same_row_''+kind);await
        shot(l,''mobile-pager-''+kind);}});

        await group(''actual-report-api'',async()=>{await open(l,local+''/reports/?focus=pricing'');const g=await l.request.get(local+''/reports/api.php?action=item_groups'');ck(g.ok()&&(await
        g.json()).groups.families.some(x=>x.name===''QA133B family''),''actual_http_group_picker'');const p=await l.request.get(local+''/reports/api.php?action=pricing'');ck(p.ok()&&(await
        p.json()).pricing.items.some(x=>x.name===''QA133B item 123''),''actual_http_pricing'');const tab=l.locator(''#report-tab-pricing'');if(await
        tab.isVisible())await tab.click();await l.locator(''[data-pricing-rows] tr'').filter({hasText:''QA133B item 123''}).waitFor();await
        l.locator(''[data-pricing-search]'').fill(''۱۲۳'');ck((await l.locator(''[data-pricing-rows] tr'').first().textContent()).includes(''QA133B
        item 123''),''actual_ui_farsi_search'');await l.locator(''[data-pricing-rows] tr'').first().scrollIntoViewIfNeeded();await
        shot(l,''actual-pricing-row'');});

        if(failures.length)throw Error(''Failed groups: ''+failures.join('',''));console.log(''CP133B BROWSER GROUPS PASS'');}finally{await
        b.close()}})().catch(e=>{console.error(e);process.exitCode=1});


        QAEOF

        '
    - name: MariaDB report groups and real pricing
      run: 'set -euo pipefail

        cd "$RUNNER_TEMP"

        php cp133b-local-db.php "$RUNNER_TEMP/local"

        '
    - name: Install browser driver
      run: 'set -euo pipefail

        npm install --prefix "$RUNNER_TEMP/pw" playwright@1.51.1 --no-audit --no-fund

        '
    - name: Chrome actual reports and compact mobile pager
      run: 'set -euo pipefail

        cd "$RUNNER_TEMP"

        PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:18765 -t "$RUNNER_TEMP/local/public" > cp133b-local-http.log 2>&1 &

        local_pid=$!

        trap ''kill "$local_pid" 2>/dev/null || true; tail -35 cp133b-local-http.log'' EXIT

        sleep 2

        node cp133b-browser.cjs

        '
    - name: Capture synthetic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: SOKNA-CP133B-UI-QA
        path: ${{ runner.temp }}/cp133b-screenshots/*.png
        retention-days: 1
        if-no-files-found: warn
