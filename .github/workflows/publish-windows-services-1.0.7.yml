name: Publish SOKNA Windows Services 1.0.7
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-windows-services-1.0.7.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: windows-services-v1.0.7
      TARGET_SHA: ab23dbe4b41296b0b42f3c10373a651d7f7a7081
      RUN_ID: "36476799803"
      ARTIFACT_NAME: sokna-windows-services-1.0.7-tested-ab23dbe4b41296b0b42f3c10373a651d7f7a7081
    steps:
      - name: Download tested artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/artifact dist/release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist/artifact
          cp dist/artifact/SOKNA-Windows-Services-Setup-1.0.7.exe dist/release/
          cp dist/artifact/artifact-index.json dist/release/SOKNA-Windows-Services-1.0.7-artifact-index.json
          (cd dist/release && sha256sum SOKNA-Windows-Services-Setup-1.0.7.exe > SHA256SUMS.txt)
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/release/*               --repo "$GITHUB_REPOSITORY"               --target "$TARGET_SHA"               --title "SOKNA Windows Services 1.0.7"               --notes "Fixes Print Agent startup failure after a prior crashed/terminated instance left the global singleton mutex abandoned. Qualified by deliberately seeding an abandoned Global\SoknaPrintAgentV6Service mutex, then installing under Program Files with DataRoot on D:, verifying Print Worker stays Running, DataRoot remains on D:, executable versions are 1.0.7, and uninstall succeeds."
          fi
