name: Apply P3 R4 Real Host Fixes

on:
  push:
    branches:
      - work/maintenance-v4-windows-p3-home-package-r4
    paths:
      - .github/workflows/apply-p3-r4-real-host-fixes.yml
      - packaging/windows/qualification/apply-p3-r4-source-fix.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/maintenance-v4-windows-p3-home-package-r4
          fetch-depth: 0

      - name: Apply exact R4 source fixes
        shell: pwsh
        run: python packaging/windows/qualification/apply-p3-r4-source-fix.py

      - name: Static R4 assertions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manager=Get-Content windows/maintenance/src/Sokna.Maintenance.Core/LocalSlotManager.cs -Raw
          $engine=Get-Content windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Program.cs -Raw
          $launcher=Get-Content windows/maintenance/tests/Sokna.Maintenance.P3HomeUat/Program.cs -Raw
          foreach($needle in @('executable-adjacent','configuration ownership is ambiguous','SOKNA-MANAGED-APACHE-VHOST v1','BEGIN SOKNA LOCAL MANAGED INCLUDE v1')) {
            if(-not $manager.Contains($needle)){throw "Missing R4 manager closure: $needle"}
          }
          if(-not $engine.Contains('ActivationPerformedInAttempt')){throw 'Activation bookkeeping fix missing.'}
          if($engine.Contains('activation_performed = command is')){throw 'Legacy command-name activation bookkeeping remains.'}
          if(-not $launcher.Contains('home-p3-231ai-r2')){throw 'R4 idempotency key missing.'}

      - name: Commit R4 source fixes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/maintenance/src/Sokna.Maintenance.Core/LocalSlotManager.cs windows/maintenance/src/Sokna.Maintenance.Core/Sokna.Maintenance.Core.csproj windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Program.cs windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj windows/maintenance/tests/Sokna.Maintenance.P3HomeUat/Program.cs
          git diff --cached --check
          git commit -m 'fix(maintenance): close Phase 3 real-host Apache discovery'
          git push origin HEAD:work/maintenance-v4-windows-p3-home-package-r4
