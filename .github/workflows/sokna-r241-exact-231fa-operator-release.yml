name: SOKNA R241 exact 231fa operator release native Windows qualification - NO DEPLOY
on:
  push:
    branches: [qa/sokna-r241-release-final-20261115]
    paths:
      - 'r240/**'
      - 'r241/**'
      - '.github/workflows/sokna-r241-exact-231fa-operator-release.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  r241-release-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: R201-EXACT-WINDOWS-QUALIFIED-NO-CAFE-AUTO-DEPLOY
          run-id: 43491934082
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r201
      - name: Pinned R201 -> R239 -> corrected 593-inventory R240
        shell: bash
        run: |
          set -euo pipefail
          BASE=$(find '${{ runner.temp }}/r201' -type f -name 'SOKNA-R201-LOCAL-231FA-60BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip' -print -quit)
          test -f "$BASE"
          python3 r239/replay/build_ci_candidate.py --base "$BASE" --parts r239/replay/patch-*.txt --out '${{ runner.temp }}/r239'
          python3 r240/upgrade_inventory.py --parent '${{ runner.temp }}/r239/R239-QA-BYTE-IDENTICAL.zip' --out '${{ runner.temp }}/r240'
          python3 r240/upgrade_identity.py --parent '${{ runner.temp }}/r240/SOKNA-R240-LOCAL-231FA-EXACT-QA-DO-NOT-INSTALL.zip' --out '${{ runner.temp }}/r240-final'
          python3 r241/build_release_r241.py --parent '${{ runner.temp }}/r240-final/SOKNA-R240-LOCAL-R201-231FA-CUMULATIVE-REV3-QA-DO-NOT-INSTALL.zip' --out '${{ runner.temp }}/r241-final'
          echo '2ec84cff9481ca0350dea9401c5b1bb1437f29e7e96f1d1c80f0739f8c7c992b  '${{ runner.temp }}'/r241-final/SOKNA-R241-LOCAL-231FA-CUMULATIVE-CONNECTION-RECOVERY.zip' | sha256sum -c -
          python3 packaging/windows/release-gates/check_local_release_set.py --require-installable '${{ runner.temp }}/r241-final/SOKNA-R241-LOCAL-231FA-CUMULATIVE-CONNECTION-RECOVERY.zip'
          echo PASS_R241_PINNED_COMPLETE_FINAL_ZIP_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: R241-FINAL-EXACT-INSTALLABLE-REPLAY-ONLY
          path: |
            ${{ runner.temp }}/r241-final/SOKNA-R241-LOCAL-231FA-CUMULATIVE-CONNECTION-RECOVERY.zip
            ${{ runner.temp }}/r241-final/R241-RELEASE-BUILD-PROOF.json
          if-no-files-found: error
          retention-days: 14
  windows-r201-to-r241:
    needs: r241-release-replay
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      SOKNA_R186_CI_ONLY: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-LOCAL-UNIVERSAL-44BASE-FINAL-ZIP-CONTRACT-QA-NOT-INSTALL
          run-id: 42896959119
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r153-parent
      - uses: actions/download-artifact@v4
        with:
          name: r177-real-windows-candidate-and-stage-passed
          run-id: 43266950479
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r177-parent
      - uses: actions/download-artifact@v4
        with:
          name: R201-EXACT-WINDOWS-QUALIFIED-NO-CAFE-AUTO-DEPLOY
          run-id: 43491934082
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r201-parent
      - uses: actions/download-artifact@v4
        with:
          name: R241-FINAL-EXACT-INSTALLABLE-REPLAY-ONLY
          path: ${{ runner.temp }}/r241-final-zip
      - name: Check EXACT OPERATOR RELEASE ZIP as-is, with no CI manifest rewriting
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $final='${{ runner.temp }}/r241-final-zip/SOKNA-R241-LOCAL-231FA-CUMULATIVE-CONNECTION-RECOVERY.zip'
          if(-not(Test-Path $final)){throw 'R241_FINAL_MISSING'}
          if((Get-FileHash $final -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2ec84cff9481ca0350dea9401c5b1bb1437f29e7e96f1d1c80f0739f8c7c992b'){throw 'R241_FINAL_SHA_MISMATCH'}
          python packaging/windows/release-gates/check_local_release_set.py --require-installable "$final"
          if($LASTEXITCODE -ne 0){throw 'R241_OPERATOR_RELEASE_CONTRACT_REJECTED'}
      - name: Real Maintenance preflight, stage, activation, HTTP and 81-migration readback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:R186_R153_DIR='${{ runner.temp }}/r153-parent'
          $env:R201_R177_DIR='${{ runner.temp }}/r177-parent'
          $env:R201_TARGET_DIR='${{ runner.temp }}/r201-parent'
          $env:R204_TARGET_DIR='${{ runner.temp }}/r241-final-zip'
          $src=Get-Content 'qa/sokna-r204/windows_r204_from_actual_231fa.ps1' -Raw
          $from='SOKNA-R204-LOCAL-231FB-61BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip'
          $to='SOKNA-R241-LOCAL-231FA-CUMULATIVE-CONNECTION-RECOVERY.zip'
          if(-not $src.Contains($from)){throw 'REFERENCE_HARNESS_MISSING'}
          $src=$src.Replace($from,$to)
          $src=$src.Replace('279d64dcf3800a764c3fcf751a0fc800857de501943af32428c87cc8db2539a3','2ec84cff9481ca0350dea9401c5b1bb1437f29e7e96f1d1c80f0739f8c7c992b')
          $src=$src.Replace('3.0.0-g6.2-workspace.231fb-r204-ux-zero-empty-canary','3.0.0-g6.2-workspace.231ff-r241-connection-recovery')
          $runnerScript='${{ runner.temp }}/r241-exact-final-native-test.ps1'
          Set-Content $runnerScript $src -Encoding utf8NoBOM
          & $runnerScript
          if($LASTEXITCODE -ne 0){throw 'R241_NATIVE_MAINTENANCE_FAILURE'}
          Write-Host 'PASS_R241_EXACT_FINAL_WINDOWS_R201_231FA_TO_R241_HTTP_AND_MARIADB_81'
      - name: Qualified exact release ZIP by SHA; no host deploy
        shell: pwsh
        run: |
          Write-Host 'No host installation or private credentials used; final artifact was tested byte-for-byte.'