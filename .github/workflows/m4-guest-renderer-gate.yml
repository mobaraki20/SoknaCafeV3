name: M4 Guest Renderer Gate

on:
  pull_request:
    paths:
      - 'apps/public/**'
      - 'docs/ui-design-system/**'
      - 'tests/public-m4-guest-renderer-selftest.php'
      - '.github/workflows/m4-guest-renderer-gate.yml'
  push:
    branches:
      - main
      - 'architecture/**'
      - 'migration/**'
    paths:
      - 'apps/public/**'
      - 'docs/ui-design-system/**'
      - 'tests/public-m4-guest-renderer-selftest.php'
      - '.github/workflows/m4-guest-renderer-gate.yml'

permissions:
  contents: read

jobs:
  guest-renderer:
    name: SCDS Guest renderer
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: sokna_m3
          MARIADB_USER: sokna
          MARIADB_PASSWORD: sokna
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Validate V3 SCDS ownership contract
        run: python3 tests/validate-v3-foundation.py --component ui
      - name: Ensure PDO MySQL is available
        shell: bash
        run: |
          set -euo pipefail
          if ! php -m | grep -qi '^pdo_mysql$'; then
            sudo apt-get update
            sudo apt-get install -y php-mysql
          fi
      - name: Validate M4 SCDS Guest renderer and degraded interaction state
        env:
          SOKNA_TEST_DB_HOST: 127.0.0.1
          SOKNA_TEST_DB_PORT: '3306'
          SOKNA_TEST_DB_NAME: sokna_m3
          SOKNA_TEST_DB_USER: sokna
          SOKNA_TEST_DB_PASS: sokna
        run: php tests/public-m4-guest-renderer-selftest.php
