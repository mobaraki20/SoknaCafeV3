name: SOKNA factory controlled Home canary actual panel qualification
on:
  push:
    branches: [qa/checkpoint55-exact-windows-20261126]
    paths: ['.github/workflows/sokna-factory-home-canary.yml']
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {origin: R204, fault: none, ledger: '81', run: '43513196061', artifact: R204-EXACT-WINDOWS-CANDIDATE-NO-CAFE-AUTO-DEPLOY, file: SOKNA-R204-LOCAL-231FB-61BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip}
          - {origin: R301, fault: none, ledger: '83', run: '44561325048', artifact: SOKNA-R301-LOCAL-CONTROLLED-INSTALL-EXACT-ARTIFACT, file: SOKNA-R301-LOCAL-231FS-PUBLIC-MOVE-CONTROLLED-INSTALL.zip}
          - {origin: R304, fault: none, ledger: '83', run: '44639218881', artifact: SOKNA-R304-EXACT-CANDIDATES-REQUIRE-ONSITE-PREFLIGHT, file: SOKNA-R304-LOCAL-231FU-NATIVE-CANDIDATE-NOT-FIELD.zip}
          - {origin: R306, fault: none, ledger: '83', run: '44723958829', artifact: SOKNA-R306-EXACT-LOCAL-PUBLIC-CANDIDATES-PREFLIGHT, file: SOKNA-R306-LOCAL-231FV-CONTROLLED-PREFLIGHT.zip}
          - {origin: R307, fault: none, ledger: '83', run: '44730988488', artifact: SOKNA-R307-LOCAL-231FW-EXACT-CANDIDATE, file: SOKNA-R307-LOCAL-231FW-FROM-231FV-CONTROLLED-PREFLIGHT.zip}
          - {origin: R3, fault: none, ledger: '90', run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: C2, fault: none, ledger: '91', run: '45389831526', artifact: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE, file: SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip}
          - {origin: GE, fault: none, ledger: '93', run: '45565963138', artifact: SOKNA-FINAL-FROZEN-DO-NOT-INSTALL, file: LOCAL-FINAL-FROZEN.zip}
    env:
      SOKNA_R186_CI_ONLY: 'YES'
      SOKNA_BASE_LEDGER: ${{ matrix.ledger }}
      SOKNA_ORIGIN: ${{ matrix.origin }}
      SOKNA_FAULT: ${{ matrix.fault }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f38c20083068e540d593876a2c527c51e0157f92
          path: native-src
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-CHECKPOINT51-EXACT-RECONSTRUCTED-QA-ONLY
          run-id: 45706374139
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/current
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-PREREQUISITES-105-QA-CANDIDATE-NOT-INSTALL
          run-id: 45707538026
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/helper
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-APACHE-2471-CANDIDATE-QA-ONLY
          run-id: 45707401488
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apache
      - uses: actions/download-artifact@v4
        with:
          name: R204-EXACT-WINDOWS-CANDIDATE-NO-CAFE-AUTO-DEPLOY
          run-id: 43513196061
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/home
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-REUSABLE-FACTORY-QA-RECEIPT
          run-id: 45716869600
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/evidence
      - name: Qualify exact controlled Home candidate via real native panel
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=Get-ChildItem "$env:RUNNER_TEMP/baseline" -Recurse -File -Filter '${{ matrix.file }}'|Select-Object -First 1
          $target=Get-ChildItem "$env:RUNNER_TEMP/current" -Recurse -File -Filter 'LOCAL-FINAL-FROZEN-QA-DO-NOT-INSTALL.zip'|Select-Object -First 1
          if(!$base -or !$target){throw 'PINNED_ARCHIVES_MISSING'}
          $env:SOKNA_BASELINE_ZIP=$base.FullName
          $home=Get-ChildItem "$env:RUNNER_TEMP/home" -Recurse -File -Filter 'SOKNA-R204-LOCAL-231FB-61BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip'|Select-Object -First 1
          if(!$home){throw 'PINNED_HOME_ARCHIVE_MISSING'}
          $receipt=Join-Path $env:RUNNER_TEMP 'evidence/reusable-factory-receipt.json'
          $controlled=Join-Path $env:RUNNER_TEMP 'SOKNA-LOCAL-231GF-CONTROLLED-HOME-CANARY.zip'
          python qa/factory/build_home_canary.py $target.FullName $home.FullName $receipt $controlled
          if($LASTEXITCODE -ne 0){throw 'CONTROLLED_BUILD_FAILED'}
          $env:SOKNA_CURRENT_QA_ZIP=$controlled
          $env:SOKNA_MATRIX_TARGET_ZIP=$controlled
          python qa/factory/prepare_home_canary_native.py
          if($LASTEXITCODE -ne 0){throw 'BRIDGE_PREPARATION_FAILED'}
          Copy-Item qa/checkpoint61/BridgeHarness.cs native-src/qa/sokna-r186/R186Harness.cs -Force
          Push-Location native-src
          try {
            & (Join-Path $env:RUNNER_TEMP 'native-matrix.ps1')
            if($LASTEXITCODE -ne 0){throw 'BRIDGE_TEST_FAILED'}
          }finally{Pop-Location}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SOKNA-HOME-CANARY-PANEL-${{ matrix.origin }}-QA
          path: ${{ runner.temp }}/matrix-receipt.json
          if-no-files-found: error
          retention-days: 30
  controlled-delivery:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-CHECKPOINT51-EXACT-RECONSTRUCTED-QA-ONLY
          run-id: 45706374139
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/current
      - uses: actions/download-artifact@v4
        with:
          name: R204-EXACT-WINDOWS-CANDIDATE-NO-CAFE-AUTO-DEPLOY
          run-id: 43513196061
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/home
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-REUSABLE-FACTORY-QA-RECEIPT
          run-id: 45716869600
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/evidence
      - uses: actions/download-artifact@v4
        with:
          pattern: SOKNA-HOME-CANARY-PANEL-*-QA
          path: ${{ runner.temp }}/matrix
      - name: Verify all eight actual positive panel receipts before Home delivery
        shell: bash
        run: |
          set -euo pipefail
          HOMEZIP=$(find "$RUNNER_TEMP/home" -name 'SOKNA-R204-LOCAL-231FB-61BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip' -type f -print -quit)
          test -f "$HOMEZIP"
          mkdir -p "$RUNNER_TEMP/delivery"
          python3 qa/factory/build_home_canary.py "$RUNNER_TEMP/current/LOCAL-FINAL-FROZEN-QA-DO-NOT-INSTALL.zip" "$HOMEZIP" "$RUNNER_TEMP/evidence/reusable-factory-receipt.json" "$RUNNER_TEMP/delivery/SOKNA-LOCAL-231GF-CONTROLLED-HOME-CANARY.zip"
          python3 - <<'PY'
          import os,json,hashlib,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          z=p/'delivery/SOKNA-LOCAL-231GF-CONTROLLED-HOME-CANARY.zip'
          h=hashlib.sha256(z.read_bytes()).hexdigest()
          rows=[json.loads(f.read_text(encoding='utf-8-sig')) for f in (p/'matrix').rglob('matrix-receipt.json')]
          assert len(rows)==8 and {r['origin'] for r in rows}=={'R204','R301','R304','R306','R307','R3','C2','GE'}
          assert all(r['status']=='PASS' and r['fault']=='none' and r['candidate_sha256']==h and r['phase']=='COMMITTED' and r['migrations']==93 and r['independent_restore'] is True and r['package_admission_tested'] is True and r['panel_activation_tested'] is True and r['actual_field_host'] is False and r['distribution_authorized'] is False for r in rows)
          receipt={'status':'CONTROLLED_HOME_CANARY_READY','package_sha256':h,'scope':'HOME_ONLY','cafe_production_approved':False,'actual_home_install_verified':False,'public_fence_resolved':False,'native_panel_cases':rows,'requires_on_host_preflight_and_backup':True}
          (p/'delivery/home-canary-receipt.json').write_text(json.dumps(receipt,indent=2))
          print('PASS ALL EIGHT POSITIVE PANEL CASES; HOME CONTROLLED DELIVERY ONLY',h)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-LOCAL-231GF-CONTROLLED-HOME-CANARY
          path: ${{ runner.temp }}/delivery/*
          if-no-files-found: error
          retention-days: 30
