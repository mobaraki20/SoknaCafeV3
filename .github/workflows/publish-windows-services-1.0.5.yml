name: Publish SOKNA Windows Services 1.0.5

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-windows-services-1.0.5.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: windows-services-v1.0.5
      TARGET_SHA: 51dd413ef2a77c222ab27b4f5267bf0250e703a8
      RUN_ID: "36467857804"
      ARTIFACT_NAME: sokna-windows-services-1.0.5-d66f3653cffe7e5ad39f03d22448771c86e62363
    steps:
      - name: Download qualified artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/artifact dist/release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist/artifact
          cp dist/artifact/SOKNA-Windows-Services-Setup-1.0.5.exe dist/release/
          cp dist/artifact/artifact-index.json dist/release/SOKNA-Windows-Services-1.0.5-artifact-index.json
          (cd dist/release && sha256sum SOKNA-Windows-Services-Setup-1.0.5.exe > SHA256SUMS.txt)

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "SOKNA Windows Services 1.0.5" \
              --notes "Fixes Windows service registration failure in 1.0.4. Qualified on Windows Server 2025 with real SCM install/query/uninstall smoke. M10 run 36467857804 passed."
          fi
