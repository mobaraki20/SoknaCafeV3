name: Q4 Push Real DB Qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/public/src/Realtime/RealtimeService.php'
      - 'apps/local-web/src/Domain/Notifications/NotificationService.php'
      - 'apps/local-web/src/Relay/NotificationPushRealtimeAdapter.php'
      - 'qualification/q4/**'
      - '.github/workflows/q4-push-realdb.yml'

permissions: {contents: read}

jobs:
  q4-push-realdb:
    name: Q4 Public to Local Push / MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      SOKNA_TEST_DB_HOST: 127.0.0.1
      SOKNA_TEST_DB_PORT: '3306'
      SOKNA_TEST_DB_ROOT_USER: root
      SOKNA_TEST_DB_ROOT_PASS: root
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP MySQL extension
        run: |
          sudo apt-get update
          sudo apt-get install -y php-mysql
          php -r 'exit(extension_loaded("pdo_mysql") ? 0 : 1);'
      - name: Syntax gate
        run: |
          php -l apps/public/src/Realtime/RealtimeService.php
          php -l apps/local-web/src/Domain/Notifications/NotificationService.php
          php -l apps/local-web/src/Relay/NotificationPushRealtimeAdapter.php
          php -l qualification/q4/q4-push-realdb-selftest.php
      - name: Q4 push real DB E2E
        run: php qualification/q4/q4-push-realdb-selftest.php
