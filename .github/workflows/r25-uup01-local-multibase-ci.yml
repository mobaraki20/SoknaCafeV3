name: R25 UUP-01 one ZIP / multi-baseline Local Maintenance regression (CI-only)
on:
  push:
    branches: [work/r25-uup01-universal-local-20261030]
    paths:
      - '.github/workflows/r25-uup01-local-multibase-ci.yml'
      - 'windows/maintenance/src/Sokna.Maintenance.Core/ReleaseSetVerifierStager.cs'
      - 'windows/maintenance/tests/Sokna.Maintenance.OperatorUploadHarness/Program.cs'
      - 'packaging/windows/qualification/verify-local-release-contract-v21.py'
      - 'release/build-local-u01.py'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  same-package-windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: UUP-01 structural source-release gate tests
        shell: pwsh
        run: |
          python -m unittest discover -s packaging/windows/qualification -p test_verify_local_release_contract_v21.py -v
          if($LASTEXITCODE-ne0){throw 'UUP01 source release gate unit tests failed'}
      - name: Build one deterministic ZIP from two independent source declarations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:RUNNER_TEMP 'r25-publisher'
          New-Item -ItemType Directory -Force $root|Out-Null
          @'
          import json,sys
          from pathlib import Path
          base=json.loads(Path('release/local-u01/m06-baseline.json').read_text())
          other=dict(base)
          other['release_id']='qa-different-source-identity'
          other['version']='3.0.0-g6.2-workspace.231bd-qa'
          other['managed_tree_sha256']='f'*64
          root=Path(sys.argv[1])
          (root/'sources-a.json').write_text(json.dumps([base,other]))
          (root/'sources-b.json').write_text(json.dumps([other,base]))
          '@ | Set-Content (Join-Path $root 'make-inputs.py') -Encoding utf8
          python (Join-Path $root 'make-inputs.py') $root
          if($LASTEXITCODE-ne0){throw 'UUP01 test source declarations failed'}
          foreach($case in @('a','b')){
            python release/build-local-u01.py --output (Join-Path $root $case) --supported-baselines-json (Join-Path $root "sources-$case.json") --universal
            if($LASTEXITCODE-ne0){throw 'UUP01 publisher refused two-source candidate'}
            $zip=Join-Path $root "$case/SOKNA-Local-231bf-U01-Panel-Update.zip"
            python packaging/windows/qualification/verify-local-release-contract-v21.py $zip --universal
            if($LASTEXITCODE-ne0){throw 'UUP01 publisher output did not pass structural universal validator'}
          }
          $a=(Get-FileHash (Join-Path $root 'a/SOKNA-Local-231bf-U01-Panel-Update.zip')).Hash
          $b=(Get-FileHash (Join-Path $root 'b/SOKNA-Local-231bf-U01-Panel-Update.zip')).Hash
          if($a-ne$b){throw 'Source declaration ordering changed immutable destination ZIP bytes'}
          Write-Host "UUP01_ONE_ZIP_TWO_SOURCES_REPRODUCIBLE_SHA_PASS=$a"
          New-Item -ItemType Directory out-r25 -Force|Out-Null
          @{qa_only=$true;sha256=$a;source_count=2;source_identities='synthetic_for_ci';installable=$false}|ConvertTo-Json|Set-Content out-r25/publisher-proof.json -Encoding utf8
      - name: Execute existing panel ZIP preflight and stage with two independently simulated sources
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet run --project windows/maintenance/tests/Sokna.Maintenance.OperatorUploadHarness/Sokna.Maintenance.OperatorUploadHarness.csproj -c Release --nologo
          if($LASTEXITCODE-ne0){throw 'UUP01 multi-baseline same immutable ZIP failed'}
      - name: Preserve existing durable activation worker regression
        shell: pwsh
        run: |
          dotnet run --project windows/maintenance/tests/Sokna.Maintenance.ActivationWorkerHarness/Sokna.Maintenance.ActivationWorkerHarness.csproj -c Release --nologo
          if($LASTEXITCODE-ne0){throw 'Existing Maintenance activation worker regression failed'}
      - name: Compile Update Engine and Supervisor with unchanged execution boundaries
        shell: pwsh
        run: |
          dotnet build windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj -c Release --nologo
          if($LASTEXITCODE-ne0){throw 'Update Engine build failure'}
          dotnet build windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj -c Release --nologo
          if($LASTEXITCODE-ne0){throw 'Supervisor build failure'}
      - name: 'Evidence: no production install qualification claimed'
        shell: pwsh
        run: |
          New-Item -ItemType Directory out-r25 -Force|Out-Null
          @'
          {
            "format": "sokna-r25-uup01-qualification-v1",
            "scope": "two synthetic but distinct installed exact identities, same ZIP bytes",
            "same_zip_two_sources": true,
            "negative_mismatch_downgrade_duplicate": true,
            "activation_on_real_host": false,
            "real_two_baselines_mariadb_qualified": false,
            "public_emergency_qualified": false,
            "universal_installable": false,
            "no_main_or_production_changes": true
          }
          '@ | Set-Content out-r25/ci-scope.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r25-uup01-multi-baseline-ci-only
          path: out-r25
          retention-days: 14
