name: Publish SOKNA Prerequisites 1.0.8
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-prerequisites-1.0.8.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: prerequisites-v1.0.8
      TARGET_SHA: cca0a9ae9dca56bd83d45ae7a3642179b60e35d8
      RUN_ID: "36494363484"
      ARTIFACT_NAME: sokna-prerequisites-1.0.8-qualified-c69d397e4fe85c4d5522011192c01acd9ac8a6b7
    steps:
      - name: Download qualified artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/artifact dist/release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist/artifact
          cp dist/artifact/SOKNA-Prerequisites-Setup-1.0.8.exe dist/release/
          cp dist/artifact/artifact-index.json dist/release/SOKNA-Prerequisites-1.0.8-artifact-index.json
          (cd dist/release && sha256sum SOKNA-Prerequisites-Setup-1.0.8.exe > SHA256SUMS.txt)
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "SOKNA Prerequisites 1.0.8" \
              --notes "Fixes Repair incorrectly treating a running Apache service as fully ready while Local Web-required configuration was still stale. Repair now validates mod_rewrite, PHP module binding, Local Web DocumentRoot and AllowOverride All before skipping Apache. Support bundles now include Apache error.log, httpd.conf and an ApacheLocalWebConfigReady diagnostic. Qualified with real locked Apache/PHP and current Local Web: / returned 302 to setup, /setup/ returned 200, rewritten endpoint did not return 500, UI compiled with ProductVersion 1.0.8, and final installer was built from the qualified artifact."
          fi
