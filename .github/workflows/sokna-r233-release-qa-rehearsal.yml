name: SOKNA R233 Packaging QA - Real Formats, No Install

on:
  pull_request:
    paths:
      - 'release-ops/**'
      - '.github/workflows/sokna-r233-release-qa-rehearsal.yml'
      - '.github/workflows/sokna-source-evidence-vault-r233.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  database-mariadb:
    name: Exact Local/Public MariaDB migration lineage and scratch backup restore
    uses: ./.github/workflows/sokna-release-db-gate.yml
    permissions:
      contents: read
      actions: read
  local-maintenance-package:
    name: Exact R233 Local -> Maintenance v2.1 static QA (noninstallable)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 120d1fb5107699d6b62eaba74f04fd962338f6a3
          path: frozen-fixtures
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-R233-FROZEN-SOURCE-ONLY-NOT-INSTALLABLE
          run-id: 43830191738
          github-token: ${{ github.token }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: R201-EXACT-WINDOWS-QUALIFIED-NO-CAFE-AUTO-DEPLOY
          run-id: 43491934082
          github-token: ${{ github.token }}
          path: r201
      - name: Build a disposable QA-only Maintenance ZIP from pinned R233 and R201 exact source
        shell: bash
        run: |
          set -euo pipefail
          SRC="source/SOKNA-R233-LOCAL-FULL-CUMULATIVE-WORKING-SOURCE-NOT-INSTALLABLE.zip"
          BASE="$(find r201 -type f -name 'SOKNA-R201-LOCAL-231FA-60BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip' -print -quit)"
          test -f "$SRC" && test -f "$BASE"
          mkdir -p "$RUNNER_TEMP/local-qa" qa-reports
          python3 release-ops/qa_local_maintenance_rehearsal.py \
            --source "$SRC" --parent-r201 "$BASE" \
            --out "$RUNNER_TEMP/local-qa/SOKNA-R233-LOCAL-MAINTENANCE-QA-NOT-INSTALLABLE.zip" \
            --report qa-reports/local-static.json
          python3 frozen-fixtures/packaging/windows/release-gates/check_local_release_set.py \
            "$RUNNER_TEMP/local-qa/SOKNA-R233-LOCAL-MAINTENANCE-QA-NOT-INSTALLABLE.zip"
          if python3 frozen-fixtures/packaging/windows/release-gates/check_local_release_set.py \
            --require-installable "$RUNNER_TEMP/local-qa/SOKNA-R233-LOCAL-MAINTENANCE-QA-NOT-INSTALLABLE.zip"; then
              echo 'BLOCKER: QA-only Local package was accepted as installable'; exit 3
          fi
          echo 'LOCAL_MAINTENANCE_FORMAT_QA_ONLY_PASS_NOT_INSTALLABLE'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-R233-LOCAL-MAINTENANCE-QA-REPORT-ONLY
          path: qa-reports/local-static.json
          if-no-files-found: ignore
          retention-days: 90

  windows-local-preflight:
    name: Windows PowerShell 5.1 SHA + Local ReleaseSet inspector; NO Windows service mutation
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 120d1fb5107699d6b62eaba74f04fd962338f6a3
          path: frozen-fixtures
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-R233-FROZEN-SOURCE-ONLY-NOT-INSTALLABLE
          run-id: 43830191738
          github-token: ${{ github.token }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: R201-EXACT-WINDOWS-QUALIFIED-NO-CAFE-AUTO-DEPLOY
          run-id: 43491934082
          github-token: ${{ github.token }}
          path: r201
      - name: Build exact same QA format using Python on Windows, never touch SCM or Maintenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parent = Get-ChildItem -Path 'r201' -Recurse -Filter 'SOKNA-R201-LOCAL-231FA-60BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip' -File | Select-Object -First 1
          if (-not $parent) { throw 'R201_PINNED_TEMPLATE_MISSING' }
          $source = 'source/SOKNA-R233-LOCAL-FULL-CUMULATIVE-WORKING-SOURCE-NOT-INSTALLABLE.zip'
          $out = Join-Path $env:RUNNER_TEMP 'R233-LOCAL-QA-ONLY-DO-NOT-INSTALL.zip'
          $report = Join-Path $env:RUNNER_TEMP 'R233-LOCAL-READONLY-REPORT.json'
          python release-ops/qa_local_maintenance_rehearsal.py --source "$source" --parent-r201 "$($parent.FullName)" --out "$out" --report "$report"
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_QA_PACKAGE_REHEARSAL_FAILED' }
          python frozen-fixtures/packaging/windows/release-gates/check_local_release_set.py "$out"
          if ($LASTEXITCODE -ne 0) { throw 'WINDOWS_NATIVE_LOCAL_RELEASESET_CHECK_FAILED' }
          $proof = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
          if ($proof.production_installable -ne $false -or $proof.functional_byte_changes -ne 0) { throw 'QA_ONLY_OR_BYTE_PRESERVATION_VIOLATION' }
          $script = @'
          param([string]$Target, [string]$Expected)
          $fs = [System.IO.File]::OpenRead($Target)
          try {
            $hash = [System.Security.Cryptography.SHA256]::Create()
            try { $observed = [System.BitConverter]::ToString($hash.ComputeHash($fs)).Replace('-', '').ToLowerInvariant() }
            finally { $hash.Dispose() }
          } finally { $fs.Dispose() }
          if ($observed -ne $Expected) { throw 'PS51_NATIVE_SHA_DRIFT' }
          Write-Output 'PASS_PS51_NATIVE_SHA_OF_FINAL_QA_RELEASESET'
          '@
          $scriptPath = Join-Path $env:RUNNER_TEMP 'ps51-sha-only.ps1'
          Set-Content -LiteralPath $scriptPath -Value $script -Encoding utf8BOM
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "$scriptPath" "$out" "$($proof.candidate_zip_sha256)"
          if ($LASTEXITCODE -ne 0) { throw 'PS51_SHA_CHECK_FAILED' }
          Write-Host 'PASS_WINDOWS_LOCAL_FORMAT_AND_PS51_SHA_NONMUTATING_QA_ONLY'

  public-same-zip:
    name: Same Public SHA via native PHP Routine and independent Emergency (no host)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip,mbstring,curl,pdo_mysql,sodium,fileinfo
          coverage: none
      - uses: actions/checkout@v4
        with:
          ref: 120d1fb5107699d6b62eaba74f04fd962338f6a3
          path: frozen-fixtures
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 8f31405bd9e6d9f03f8faa522a7d37d7c81d8448
          path: frozen-public-qualification
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fe8bfe0ff6490b41898427ac7fe60d8f90c4486b
          path: frozen-public-r249
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-R233-FROZEN-SOURCE-ONLY-NOT-INSTALLABLE
          run-id: 43830191738
          github-token: ${{ github.token }}
          path: source
      - uses: actions/download-artifact@v4
        with:
          name: r171-exact-cumulative-windows-cafe-uat-candidates
          run-id: 43205002445
          github-token: ${{ github.token }}
          path: r171-artifact
      - name: Build ONE ephemeral Public update and exact same-version root clean from immutable source
        shell: bash
        run: |
          set -euo pipefail
          SRC="source/SOKNA-R233-PUBLIC-FULL-CUMULATIVE-WORKING-SOURCE-NOT-INSTALLABLE.zip"
          test -f "$SRC"
          mkdir -p "$RUNNER_TEMP/qa-public" qa-reports
          python3 release-ops/qa_public_update_rehearsal.py \
            --source "$SRC" \
            --update "$RUNNER_TEMP/qa-public/R233-ONE-PUBLIC-ZIP-DO-NOT-INSTALL.zip" \
            --clean "$RUNNER_TEMP/qa-public/R233-CLEAN-QA-DO-NOT-INSTALL.zip" \
            --report qa-reports/public-static.json
          python3 - <<'PY'
          import json
          r=json.load(open('qa-reports/public-static.json'))
          assert r['update_static'] == 'PASS' and r['clean_static'] == 'PASS'
          assert r['functional_byte_drift'] == 0 and r['release_authorized'] is False
          print('PASS_ONE_EXACT_ZIP_STATIC_AND_UPDATE_CLEAN_SHARED_BYTES')
          PY
      - name: Prepare unchanged R171 real PHP Routine and Emergency classes
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/qa-public"
          R171="$(find r171-artifact -type f -name 'SOKNA-R171-PUBLIC-35HT-FROM-35HK-PANEL-UPDATE.zip' -print -quit)"
          test -f "$R171"
          echo "ea1d2f7d90242d5b45fe232da7ff5510f03ee55c835e2dabe5f61980430be157  $R171" | sha256sum -c -
          mkdir -p "$D/r171-outer" "$D/r171"
          unzip -q "$R171" -d "$D/r171-outer"
          cp -a "$D/r171-outer/payload/." "$D/r171/"
          cp frozen-public-qualification/r239/public/PublicUpdateException.php "$D/public-update-exception.php"
          python3 release-ops/qa_reconstruct_public_r153.py --r171 "$D/r171" --fixtures frozen-public-r249 --out "$D/r153"
          php -l release-ops/qa_public_two_route.php
      - name: Genuine R171 Routine stage activate commit with exact SAME Public ZIP
        shell: bash
        env:
          SOKNA_QA_PUBLIC_ROUTE: routine
        run: |
          set -euo pipefail
          export SOKNA_QA_PUBLIC_FIXTURE="$RUNNER_TEMP/qa-public"
          export SOKNA_QA_PUBLIC_ZIP="$RUNNER_TEMP/qa-public/R233-ONE-PUBLIC-ZIP-DO-NOT-INSTALL.zip"
          export SOKNA_QA_PUBLIC_SHA="$(python3 -c 'import json;print(json.load(open("qa-reports/public-static.json"))["public_update_sha256"])')"
          for base in 35ht 35hk; do
            SOKNA_QA_PUBLIC_BASE="$base" php -d display_errors=1 release-ops/qa_public_two_route.php
          done
          echo 'QA_ROUTINE_BOTH_BASELINES_SAME_SHA_PASS'
      - name: Genuine independent Emergency stage activate commit using SAME ZIP and SHA
        shell: bash
        env:
          SOKNA_QA_PUBLIC_ROUTE: emergency
        run: |
          set -euo pipefail
          export SOKNA_QA_PUBLIC_FIXTURE="$RUNNER_TEMP/qa-public"
          export SOKNA_QA_PUBLIC_ZIP="$RUNNER_TEMP/qa-public/R233-ONE-PUBLIC-ZIP-DO-NOT-INSTALL.zip"
          export SOKNA_QA_PUBLIC_SHA="$(python3 -c 'import json;print(json.load(open("qa-reports/public-static.json"))["public_update_sha256"])')"
          for base in 35ht 35hk; do
            SOKNA_QA_PUBLIC_BASE="$base" php -d display_errors=1 release-ops/qa_public_two_route.php
          done
          echo 'QA_EMERGENCY_BOTH_BASELINES_SAME_SHA_PASS'
      - name: Record both native PHP paths, same exact SHA — never claim host qualification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("qa-reports/public-static.json")
          d=json.loads(p.read_text())
          d["both_routes_native_php"]="PASS_DISPOSABLE_R153_35HK_AND_R171_35HT"
          d["same_zip_native_php_route_baseline_combinations"]=4
          d["native_php_disposable_baselines_proven"]=2
          d["installed_cafe_host"]="NOT_RUN"
          d["actual_http_https_host"]="NOT_RUN"
          d["production_installable"]=False
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2,sort_keys=True)+"\n")
          PY
          echo 'R233_PUBLIC_NATIVE_DUAL_ROUTE_SAME_SHA_ONLY_QA_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-R233-PUBLIC-TWO-ROUTE-QA-REPORT-ONLY
          path: qa-reports/public-static.json
          if-no-files-found: ignore
          retention-days: 90
