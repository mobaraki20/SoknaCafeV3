name: A22 focused reporting acceptance
on:
  push:
    branches: [qa/a22-pre-field-20261128]
    paths: ['.github/workflows/sokna-a22-pre-field.yml']
permissions:
  contents: read
  actions: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
      SOKNA_QA_DISPOSABLE: YES
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 46122453416
          name: SOKNA-A21-EXACT-CANDIDATES-QA-NOT-INSTALL
          path: ${{ runner.temp }}/candidate
      - name: Verify exact accepted Local clean web and prepare isolated database
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/a22"
          mkdir -p "$W"
          P="$RUNNER_TEMP/candidate/LOCAL-A21-CLEAN-WEB-CANDIDATE-QA-ONLY.zip"
          echo "707e64815c039224af1a8be6a55f89932e482f004c15a6a46913b41bfad1fa10  $P" | sha256sum -c
          python3 - "$P" "$W/local" <<'PY'
          import pathlib,sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              assert z.testzip() is None
              assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
              z.extractall(sys.argv[2])
          PY
          php qa/cp148/preflight.php
          php qa/cp160/fixture.php "$W/local" > "$W/fixture-log.txt"
      - name: Focused remaining reporting criteria using synthetic records
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/a22"
          cat > "$W/focus.php" <<'PHP'
          <?php
          declare(strict_types=1);
          if(PHP_SAPI!=='cli'||getenv('SOKNA_QA_DISPOSABLE')!=='YES'||getenv('QA_DB_PASSWORD')!=='synthetic-cp116-ci-only')exit(2);
          $w=realpath($argv[1]);require $w.'/local/bootstrap.php';$cfg=require $w.'/config.php';
          if(($cfg['db']['host']??'')!=='127.0.0.1'||($cfg['db']['name']??'')!=='sokna_cp150')exit(2);
          $c=sokna_local_bootstrap($cfg);$p=$c->database();
          $out=[];$failed=0;
          function ck($ok,$msg){if(!$ok)throw new RuntimeException($msg);echo "PASS $msg\n";}
          function group($id,$fn){global $out,$failed;try{$out[$id]=['status'=>'PASS','detail'=>$fn()];}catch(Throwable $e){$out[$id]=['status'=>'FAIL','detail'=>$e->getMessage()];$failed++;echo "FAIL $id ".$e->getMessage()."\n";}}
          group('REP-L268-positive-cost',function()use($p,$c){
            $line=$p->query("SELECT oi.id,COALESCE(ts.business_date,o.business_date) day FROM orders o JOIN order_items oi ON oi.order_id=o.id JOIN table_sessions ts ON ts.id=o.session_id WHERE o.public_code='qa160-sub-order'")->fetch(PDO::FETCH_ASSOC);
            $id=(int)$line['id'];$day=$line['day'];$inv=(int)$p->query("SELECT id FROM inventory_items WHERE item_code='qa160-unknown'")->fetchColumn();
            $meta=['order_item_id'=>$id,'recipe_review_status'=>'ready','recipe_completeness_status'=>'complete','recipe_quantity_status'=>'known'];
            $q=$p->prepare("INSERT INTO inventory_movements(inventory_item_id,movement_type,quantity_base,base_unit,total_cost_delta,cost_status,source_type,source_id,metadata_json,occurred_at) VALUES(?,'recipe_consumption',-1,'count',? ,?,'order_item',?,?,?)");
            $q->execute([$inv,-30000,'known',(string)$id,json_encode($meta,JSON_THROW_ON_ERROR),$day.' 12:00:00']);$mid=(int)$p->lastInsertId();
            $read=function()use($c,$day,$id){$r=$c->reporting()->report($day,$day)['margin'];$row=array_values(array_filter($r['rows'],fn($x)=>$x['order_item_id']===$id))[0];return [$row,$r['summary']];};
            [$row,$s]=$read();ck($row['financially_complete']&&$row['cost_quality']==='known'&&$row['net_revenue']===100000&&$row['covered_cost']===30000&&$row['gross_margin']===70000,'exact positive margin');
            ck($s['exact_margin_rows']===1&&$s['exact_revenue']===100000&&$s['exact_cost']===30000&&$s['exact_gross_margin']===70000,'exact aggregate');
            $p->prepare("UPDATE inventory_movements SET cost_status='estimated',total_cost_delta=-40000 WHERE id=?")->execute([$mid]);
            [$row,$s]=$read();ck($row['cost_quality']==='estimated'&&$row['gross_margin']===60000&&$s['estimated_margin_rows']===1&&$s['exact_margin_rows']===0&&$s['estimated_basis_cost']===40000,'estimated aggregate distinct from exact');
            $p->prepare("UPDATE inventory_movements SET cost_status='unknown',total_cost_delta=NULL WHERE id=?")->execute([$mid]);
            [$row,$s]=$read();ck($row['gross_margin']===null&&$row['cost_quality']==='incomplete'&&$s['margin_available']===0,'unknown never presented as zero cost');
            $p->prepare("UPDATE inventory_movements SET cost_status='known',total_cost_delta=-30000 WHERE id=?")->execute([$mid]);
            $partial=(int)$p->query("SELECT oi.id FROM orders o JOIN order_items oi ON oi.order_id=o.id WHERE o.public_code='qa150-order-0'")->fetchColumn();
            $meta['order_item_id']=$partial;$q->execute([$inv,-20000,'known',(string)$partial,json_encode($meta,JSON_THROW_ON_ERROR),$day.' 12:00:00']);
            $r=$c->reporting()->report($day,$day)['margin'];$pr=array_values(array_filter($r['rows'],fn($x)=>$x['order_item_id']===$partial))[0];ck(!$pr['financially_complete']&&$pr['gross_margin']===null,'incomplete settlement excluded');
            return ['exact_margin'=>70000,'estimated_margin'=>60000,'unknown_excluded'=>true,'partial_payment_excluded'=>true];
          });
          group('REP-L269-document',function()use($p,$c,$w){
            $r=$p->query("SELECT session_id,financial_period_id FROM settlement_records WHERE destination='subscriber' LIMIT 1")->fetch(PDO::FETCH_ASSOC);
            $q=$p->prepare("INSERT INTO accommodation_transfers(session_id,financial_period_id,external_order_id,reservation_code,guest_name_snapshot,room_name_snapshot,phone_hint_snapshot,amount,invoice_number,invoice_snapshot_json,account_signature,payload_hash,status,attempt_count,suspicious_response,last_error,remote_transaction_id) VALUES(?,?,?,?,?,?,?,?,?,?,?,?, 'failed',2,1,?,?)");
            $q->execute([(int)$r['session_id'],(int)$r['financial_period_id'],'qa-external-transfer','qa-reservation-private','qa-guest-private','qa-room-private','qa-phone-private',120000,'qa-invoice','{}',str_repeat('a',64),str_repeat('b',64),'qa-error-private','qa-remote-private']);$id=(int)$p->lastInsertId();
            $doc=$c->reporting()->historicalAccommodationTransfer($id);
            ck($doc['document']['id']===$id&&$doc['document']['amount']===120000&&$doc['document']['current_status']==='failed'&&$doc['document']['attention_required']&&$doc['read_only'],'historical transfer exact fields');
            $encoded=json_encode($doc,JSON_THROW_ON_ERROR);ck(!str_contains($encoded,'-private'),'private metadata omitted');
            file_put_contents($w.'/transfer-id.txt',(string)$id);return ['transfer_id'=>$id,'amount'=>120000,'private_metadata_omitted'=>true,'external_connection_tested'=>false];
          });
          $out['errors']=$failed;file_put_contents($w.'/focus-results.json',json_encode($out,JSON_PRETTY_PRINT|JSON_THROW_ON_ERROR));exit($failed?1:0);
          PHP
          php "$W/focus.php" "$W" | tee "$W/focus-log.txt"
      - name: Actual HTTP authorization on transfer history
        if: always()
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/a22"
          test -s "$W/transfer-id.txt"
          php -S 127.0.0.1:18765 -t "$W/local/public" >"$W/http.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in {1..20}; do if curl -fsS http://127.0.0.1:18765/login.php >/dev/null; then break; fi; sleep 1; done
          for spec in qa-target:synthetic-qa-admin-not-real qa-cashier:synthetic-member-only qa-bar-a:synthetic-member-only; do
            user="${spec%%:*}";pass="${spec#*:}"
            code=$(curl -sS -o /dev/null -w '%{http_code}' -c "$W/$user.cookie" --data-urlencode "username=$user" --data-urlencode "password=$pass" http://127.0.0.1:18765/login.php)
            test "$code" = 302
            code=$(curl -sS -o "$W/$user-transfer.json" -w '%{http_code}' -b "$W/$user.cookie" "http://127.0.0.1:18765/reports/api.php?action=accommodation_transfer_history&transfer_id=$(cat "$W/transfer-id.txt")")
            echo "$user $code" | tee -a "$W/auth-results.txt"
            if [ "$user" = qa-target ]; then test "$code" = 200; python3 -c 'import json,sys; j=json.load(open(sys.argv[1])); assert j["success"] and j["historical_accommodation_transfer"]["document"]["amount"]==120000 and "-private" not in str(j)' "$W/$user-transfer.json"; else test "$code" = 403; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-A22-FOCUSED-REPORTS-EVIDENCE
          path: |
            ${{ runner.temp }}/a22/focus-results.json
            ${{ runner.temp }}/a22/focus-log.txt
            ${{ runner.temp }}/a22/auth-results.txt
            ${{ runner.temp }}/a22/*-transfer.json
            ${{ runner.temp }}/a22/http.log
          retention-days: 30
