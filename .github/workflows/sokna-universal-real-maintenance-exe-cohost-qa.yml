      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Build PINNED real Supervisor and Engine; no Recovery in release payload
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'maintenance-only-0326'
          $pairs=@(
            @('Sokna.Maintenance.Supervisor','SoknaMaintenanceSupervisor.exe','88ba73a97e273a4f818f0200bcc32f7b8cc9df4522b554cca6b88e32e0832aae'),
            @('Sokna.Maintenance.UpdateEngine','SoknaMaintenanceUpdateEngine.exe','d9f8295976a1a549191797303f6a6046877a96d3f1e23fe022bf3ebcfce61199')
          )
          foreach($tuple in $pairs){
            $project=[string]$tuple[0];$exe=[string]$tuple[1];$expected=[string]$tuple[2]
            dotnet publish "windows/maintenance/src/$project/$project.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o (Join-Path $root $project)
            if($LASTEXITCODE-ne0){throw 'PINNED_MAINTENANCE_PAIR_BUILD_FAILED'}
            $file=Join-Path (Join-Path $root $project) $exe
            if((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()-ne$expected){throw 'MAINTENANCE_PAIR_SOURCE_SHA_DRIFT'}
          }
          & ./wrapper-fix/packaging/windows/scripts/prepare-maintenance-independent-v1.ps1 -RepoRoot (Join-Path $PWD.Path 'wrapper-fix') -Supervisor (Join-Path $root 'Sokna.Maintenance.Supervisor/SoknaMaintenanceSupervisor.exe') -Engine (Join-Path $root 'Sokna.Maintenance.UpdateEngine/SoknaMaintenanceUpdateEngine.exe') -OutputRoot (Join-Path $root 'payload')
          if($LASTEXITCODE-ne0){throw 'MAINTENANCE_PAIR_PREP_FAILED'}
          $payload=Join-Path $root 'payload'
          $m=Get-Content (Join-Path $payload 'maintenance-independent-manifest-v1.json') -Raw|ConvertFrom-Json
          if(@($m.files).Count-ne2 -or $m.recovery_console_action-ne'KEEP_UNCHANGED' -or
              (Test-Path (Join-Path $payload 'Maintenance/Recovery'))){throw 'MAINTENANCE_PAIR_SCOPE_WRONG'}
          New-Item -ItemType Directory -Path (Join-Path $root 'dist') -Force|Out-Null
          Copy-Item (Join-Path $payload 'maintenance-independent-manifest-v1.json') (Join-Path $root 'dist/COMPONENT-MANIFEST.json')
          Write-Host 'PASS REAL PINNED MAINTENANCE PAIR ONLY, RECOVERY PRESERVED'
      - name: Compile exact Inno, check version and compact payload
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'maintenance-only-0326'
          $iscc=@("${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe","$env:ProgramFiles/Inno Setup 6/ISCC.exe")|Where-Object{Test-Path $_}|Select-Object -First 1
          if(-not$iscc){choco install innosetup -y --no-progress;if($LASTEXITCODE-ne0){throw 'INNO_INSTALL_FAILED'};$iscc="${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"}
          & $iscc "/DPayloadRoot=$root/payload" "/DOutputDir=$root/dist" wrapper-fix/packaging/windows/installer/SOKNA-Maintenance-Only-0326-Independent-R1-QA.iss
          if($LASTEXITCODE-ne0){throw 'INDEPENDENT_INNO_BUILD_FAILED'}
          $exe=Join-Path $root 'dist/SOKNA-Maintenance-Only-0326-Independent-R1-QA-NOT-PRODUCTION.exe'
          if(-not(Test-Path $exe)){throw 'INDEPENDENT_INNO_MISSING'}
          $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if("$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)"-ne'0.3.26.5'){throw 'INDEPENDENT_INNO_VERSION_WRONG'}
          $size=(Get-Item $exe).Length
          if($size-ge 65MB){throw ('INDEPENDENT_INNO_NOT_COMPACT_'+$size)}
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $([IO.Path]::GetFileName($exe))"|Set-Content (Join-Path $root 'dist/SHA256SUMS.txt')
          @{sha256=$sha;size_bytes=$size;source_commit=$env:GITHUB_SHA;target_version='0.3.26.5';scope='MAINTENANCE_ONLY_SUPERVISOR_AND_ENGINE';recovery_preserved=$true;local_public_unchanged=$true;real_field_tested=$false;production_authorized=$false}|ConvertTo-Json|Set-Content (Join-Path $root 'dist/BUILD-QA.json')
          Write-Host ('PASS REAL COMPACT INNO BUILT bytes='+$size+' sha256='+$sha)
