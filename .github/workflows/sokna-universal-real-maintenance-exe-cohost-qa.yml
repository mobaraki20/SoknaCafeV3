name: SOKNA exact Maintenance EXE with real Local and Public on one Windows QA host
on:
  push:
    branches: [qa/sokna-r125-ledger-compat-20261110]
    paths:
      - qa/sokna-universal/real-maintenance-exe-cohost.ps1
      - qa/sokna-preserved-recovery/test-real-installer-rev4.ps1
      - qa/sokna-preserved-recovery/test-policy-rev4.ps1
      - packaging/windows/scripts/invoke-maintenance-components-v4.ps1
      - packaging/windows/scripts/invoke-maintenance-install-logged-v1.ps1
      - packaging/windows/installer/SOKNA-Maintenance-0326-Integrated-Rev4-QA.iss
      - qa/sokna-preserved-recovery/test-real-installer-rev3.ps1
      - windows/maintenance/src/Sokna.Maintenance.Core/SupervisorUniversalUpgradeFence.cs
      - qa/sokna-universal/UniversalOwnerCoreProbe.cs
      - qa/sokna-universal/UniversalOwnerCoreProbe.csproj
      - qa/sokna-r149b/windows-r149b-activation.ps1
      - qa/sokna-universal/native-forward-fence-qa.py
      - .github/workflows/sokna-universal-real-maintenance-exe-cohost-qa.yml
  pull_request:
    branches: [qa/sokna-update-safety-20261109]
    paths:
      - qa/sokna-universal/real-maintenance-exe-cohost.ps1
      - qa/sokna-preserved-recovery/test-real-installer-rev4.ps1
      - qa/sokna-preserved-recovery/test-policy-rev4.ps1
      - packaging/windows/scripts/invoke-maintenance-components-v4.ps1
      - packaging/windows/scripts/invoke-maintenance-install-logged-v1.ps1
      - packaging/windows/installer/SOKNA-Maintenance-0326-Integrated-Rev4-QA.iss
      - qa/sokna-preserved-recovery/test-real-installer-rev3.ps1
      - windows/maintenance/src/Sokna.Maintenance.Core/SupervisorUniversalUpgradeFence.cs
      - qa/sokna-universal/UniversalOwnerCoreProbe.cs
      - qa/sokna-universal/UniversalOwnerCoreProbe.csproj
      - qa/sokna-r149b/windows-r149b-activation.ps1
      - qa/sokna-universal/native-forward-fence-qa.py
      - .github/workflows/sokna-universal-real-maintenance-exe-cohost-qa.yml
  workflow_dispatch:
permissions: {contents: read, actions: read}
jobs:
  exact-maintenance-inno-local-public:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOKNA_R149B_DISPOSABLE: 'YES'
      SOKNA_NATIVE_COLOCATED_PUBLIC_QA: 'YES'
      SOKNA_REAL_MAINTENANCE_COHOST_QA: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: b8b1cc4e91772692d92d6f7aa10b0657d2aa5427
          path: legacy-maint-0322
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-0326-ledger-compat-built-qa-not-for-install
          run-id: 42706765928
          github-token: ${{ github.token }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: exact-recovery-011-643841631
          run-id: 42688606509
          github-token: ${{ github.token }}
          path: legacy-recovery-011
      - name: Verify exact immutable QA EXE and original 0322/011 service binaries
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $PWD.Path 'dist/SOKNA-Maintenance-0326-INTEGRATED-QA-REV3-NOT-PRODUCTION.exe'
          if(-not(Test-Path -LiteralPath $exe -PathType Leaf)){throw 'EXACT_PREVIOUSLY_TESTED_MAINTENANCE_EXE_NOT_FOUND'}
          $line=Get-Content dist/SHA256SUMS.txt|Select-Object -First 1
          $expected=($line -split '\s+')[0].ToLowerInvariant()
          if($expected-notmatch '^[a-f0-9]{64}$' -or (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant() -cne $expected){throw 'EXACT_MAINTENANCE_EXE_HASH_MISMATCH'}
          $m=Get-Content dist/COMPONENT-MANIFEST.json -Raw|ConvertFrom-Json
          if(@($m.files).Count-ne3){throw 'EXACT_THREE_COMPONENT_EXE_PAYLOAD_MANIFEST_MISSING'}
          $old=Join-Path $env:RUNNER_TEMP 'original-0322-binaries'
          foreach($n in @('Sokna.Maintenance.Supervisor','Sokna.Maintenance.UpdateEngine')){
            dotnet publish "legacy-maint-0322/windows/maintenance/src/$n/$n.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o (Join-Path $old $n)
            if($LASTEXITCODE-ne0){throw 'EXACT_0322_BASELINE_BUILD_FAILED'}
          }
          Write-Host ('PASS PINNED REAL MAINTENANCE INSTALLER SHA256='+$expected)
      - name: Install actual Inno Maintenance EXE onto clean 0322/011 Windows services
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $installParams=@{
            Mode='install'
            Installer=(Join-Path $PWD.Path 'dist/SOKNA-Maintenance-0326-INTEGRATED-QA-REV3-NOT-PRODUCTION.exe')
            ComponentManifest=(Join-Path $PWD.Path 'dist/COMPONENT-MANIFEST.json')
            BaselineRoot=(Join-Path $env:RUNNER_TEMP 'original-0322-binaries')
            LegacyRecovery011=(Join-Path $PWD.Path 'legacy-recovery-011/SoknaMaintenanceRecoveryConsole.exe')
          }
          & ./qa/sokna-universal/real-maintenance-exe-cohost.ps1 @installParams
          if($LASTEXITCODE -and $LASTEXITCODE-ne0){throw 'REAL_INNO_COHOST_INSTALL_FAILED'}
          $engine=Join-Path $env:RUNNER_TEMP 'sokna-native-maintenance-cohost/SOKNA Windows Services/Maintenance/App/SoknaMaintenanceUpdateEngine.exe'
          if(-not(Test-Path -LiteralPath $engine -PathType Leaf)){throw 'INSTALLED_REAL_ENGINE_MISSING'}
          "SOKNA_TEST_INSTALLED_ENGINE_EXE=$engine"|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SOKNA_TEST_COMPONENT_MANIFEST=$((Resolve-Path dist/COMPONENT-MANIFEST.json).Path)"|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Exact native Public owner candidate hash
        shell: pwsh
        run: |
          python qa/sokna-public-two-route/build-candidate.py qa/sokna-public-two-route/r149.zip qa/sokna-public-two-route/candidate.zip
          if($LASTEXITCODE-ne0){throw 'PUBLIC_CANDIDATE_BUILD_FAILED'}
          $h=(Get-FileHash qa/sokna-public-two-route/candidate.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-cne'1131d89c98e05c9597f372ed1d480e5637c3ad1969bc8733d2a837b644e57584'){throw 'PUBLIC_CANDIDATE_HASH_DRIFT'}
      - name: Run installed Maintenance Engine and real Local Apache MariaDB plus Public Routine Emergency
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./qa/sokna-r149b/windows-r149b-activation.ps1
          if($LASTEXITCODE -and $LASTEXITCODE-ne0){throw 'REAL_INSTALLED_MAINTENANCE_ENGINE_LOCAL_PUBLIC_RUN_FAILED'}
      - name: Signed Supervisor and exact installed Maintenance binaries unchanged after native Local Public
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./qa/sokna-universal/real-maintenance-exe-cohost.ps1 -Mode verify -ComponentManifest (Join-Path $PWD.Path 'dist/COMPONENT-MANIFEST.json')
          if($LASTEXITCODE -and $LASTEXITCODE-ne0){throw 'REAL_MAINTENANCE_COHOST_POST_VERIFICATION_FAILED'}
          dotnet run --project qa/sokna-universal/NativeGateProbe.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'THREE_COMPONENT_RELEASE_GATE_INCORRECTLY_OPENED'}
          Write-Host 'EXACT MAINTENANCE EXE AND INSTALLED ENGINE COHOST PASS. SHARED ATOMIC COMMIT/ROLLBACK NOT IMPLEMENTED.'
      - name: Bind physically installed Maintenance operation store to native Local Public receipts and prove no global commit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $native=Join-Path $env:RUNNER_TEMP 'sokna-r149b-windows-exact-e2e/artifacts'
          $maint=Join-Path $env:RUNNER_TEMP 'sokna-native-maintenance-cohost/real-maintenance-cohost.json'
          dotnet run --project qa/sokna-universal/UniversalOwnerCoreProbe.csproj -c Release -- --real-native-evidence $native $maint
          if($LASTEXITCODE-ne0){throw 'ACTUAL_SUPERVISOR_OPERATION_LEDGER_UNIVERSAL_OWNER_BINDING_FAILED'}
          # Guard only; this signed probe does NOT remove the persisted recovery-required blocker.
          . ./packaging/windows/scripts/maintenance-signed-health-v1.ps1
          Assert-MaintenanceSignedHealth -ExpectedVersion '0.3.26' -Attempts 10
          Write-Host 'PASS REAL SUPERVISOR STORE CROSS-PROCESS DB FORWARD FENCE; GLOBAL COMMIT STILL BLOCKED'
      - name: Upload verified QA-only evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sokna-real-maintenance-inno-exe-native-local-public-cohost-not-production
          path: |
            ${{ runner.temp }}/sokna-native-maintenance-cohost/real-maintenance-cohost.json
            ${{ runner.temp }}/sokna-native-maintenance-cohost/universal-owner-core-qa.json
            ${{ runner.temp }}/sokna-r149b-windows-exact-e2e/artifacts/native-colocated-*.json
            ${{ runner.temp }}/sokna-r149b-windows-exact-e2e/artifacts/native-forward-*/forward-fence.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove only owned temporary Windows QA Maintenance service
        if: always()
        shell: pwsh
        run: |
          & ./qa/sokna-universal/real-maintenance-exe-cohost.ps1 -Mode cleanup
  exact-historical-0326-five-baselines:
    runs-on: windows-latest
    timeout-minutes: 35
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: aba774d67e9d3890aa0f69d00f214ae82b395927}
      - uses: actions/checkout@v4
        with: {ref: b8b1cc4e91772692d92d6f7aa10b0657d2aa5427, path: old-0322-source}
      - uses: actions/checkout@v4
        with: {path: wrapper-fix}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-0326-ledger-compat-built-qa-not-for-install
          path: dist
          run-id: 42706765928
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-0324-built-qa-not-production
          run-id: 42576660029
          github-token: ${{ github.token }}
          path: old-0324-artifact
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-0325-built-qa-not-production
          run-id: 42631664373
          github-token: ${{ github.token }}
          path: old-0325-artifact
      - uses: actions/download-artifact@v4
        with:
          name: exact-recovery-011-643841631
          run-id: 42688606509
          github-token: ${{ github.token }}
          path: exact-011
      - name: Exact prior baseline binaries
        shell: pwsh
        run: |
          $old=Join-Path $env:RUNNER_TEMP 'old-0322'
          foreach($n in @('Sokna.Maintenance.Supervisor','Sokna.Maintenance.UpdateEngine','Sokna.Maintenance.RecoveryConsole')){
            dotnet publish "old-0322-source/windows/maintenance/src/$n/$n.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o (Join-Path $old $n)
            if($LASTEXITCODE-ne0){throw 'OLD_BASELINE_BUILD_FAILED'}
          }
          Invoke-WebRequest 'https://github.com/mobaraki20/SoknaCafeV3/releases/download/sokna-maintenance-r125-0323-qa-02dd6431a3fe/SOKNA-R125-Maintenance-0323-Three-Component-QA-NOT-PRODUCTION.exe' -OutFile "$env:RUNNER_TEMP/old-0323.exe" -TimeoutSec 180
          if((Get-FileHash "$env:RUNNER_TEMP/old-0323.exe" -Algorithm SHA256).Hash.ToLowerInvariant()-ne'3a4c6e1c09174bf79aa29115588a2f6ba8eddfa58929d54a61a528cbd4feca2a'){throw 'OLD_0323_HASH_MISMATCH'}
          if((Get-FileHash 'old-0324-artifact/SOKNA-Maintenance-0324-MultiBaseline-QA-NOT-PRODUCTION.exe' -Algorithm SHA256).Hash.ToLowerInvariant()-ne'7712cccc855dd55bd5956224db778cba67b825269e440642733097368a62db12'){throw 'OLD_0324_HASH_MISMATCH'}
          if((Get-FileHash 'old-0325-artifact/SOKNA-Maintenance-0325-MultiBaseline-QA-NOT-PRODUCTION.exe' -Algorithm SHA256).Hash.ToLowerInvariant()-ne'fa196597150dff0045c7e42ab6a59a335438b48ab491651947c44e873f5bbac7'){throw 'OLD_0325_HASH_MISMATCH'}
      - name: Same exact integrated EXE on five real service baselines including original 011
        shell: pwsh
        run: |
          & ./wrapper-fix/qa/sokna-preserved-recovery/test-real-installer-rev3.ps1 -Installer (Join-Path $PWD.Path 'dist/SOKNA-Maintenance-0326-INTEGRATED-QA-REV3-NOT-PRODUCTION.exe') -ComponentManifest (Join-Path $PWD.Path 'dist/COMPONENT-MANIFEST.json') -BaselineRoot "$env:RUNNER_TEMP/old-0322" -Old0323Installer "$env:RUNNER_TEMP/old-0323.exe" -Old0324Installer (Join-Path $PWD.Path 'old-0324-artifact/SOKNA-Maintenance-0324-MultiBaseline-QA-NOT-PRODUCTION.exe') -Old0325Installer (Join-Path $PWD.Path 'old-0325-artifact/SOKNA-Maintenance-0325-MultiBaseline-QA-NOT-PRODUCTION.exe') -LegacyRecovery011 (Join-Path $PWD.Path 'exact-011/SoknaMaintenanceRecoveryConsole.exe') -Output (Join-Path $PWD.Path 'dist/REAL-SERVICE-QA.json')
          if($LASTEXITCODE -and $LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: maintenance-0326-five-real-baselines-verified-qa-only
          path: dist/REAL-SERVICE-QA.json
          if-no-files-found: error
      - name: Archive safe error receipts even on a qualified failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-0326-five-baselines-safe-rejection-reports-qa
          # Keep Desktop receipts in one filesystem root. The verified JSON
          # result is already uploaded by the preceding successful step.
          path: C:/Users/runneradmin/Desktop/SOKNA-MAINTENANCE-INSTALL-FAILED-*.json
          if-no-files-found: warn
          retention-days: 14
  build-rev4:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: aba774d67e9d3890aa0f69d00f214ae82b395927}
      - uses: actions/checkout@v4
        with: {path: wrapper-fix}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Bind tested wrapper to pinned disposable component worktree
        shell: pwsh
        run: |
          Copy-Item ./wrapper-fix/packaging/windows/scripts/invoke-maintenance-components-v4.ps1 ./packaging/windows/scripts/invoke-maintenance-components-v4.ps1 -Force
          $a=(Get-FileHash ./wrapper-fix/packaging/windows/scripts/invoke-maintenance-components-v4.ps1 -Algorithm SHA256).Hash
          $b=(Get-FileHash ./packaging/windows/scripts/invoke-maintenance-components-v4.ps1 -Algorithm SHA256).Hash
          if($a-ne$b){throw 'TESTED_WRAPPER_NOT_IDENTICAL_TO_EMBEDDED'}
      - name: Windows PowerShell 5.1 failure report boundaries
        shell: powershell
        run: |
          & ./wrapper-fix/qa/sokna-wrapper-rev2/test-logged-wrapper.ps1
          if($LASTEXITCODE -and $LASTEXITCODE-ne0){exit $LASTEXITCODE}
          & ./wrapper-fix/qa/sokna-preserved-recovery/test-policy-rev4.ps1
          if($LASTEXITCODE -and $LASTEXITCODE-ne0){exit $LASTEXITCODE}
          & ./wrapper-fix/qa/sokna-identity-workflow/test-maintenance-components-v4.ps1
          if($LASTEXITCODE -and $LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Reproduce exact original components and add reporting wrapper
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'maintenance-rev4'
          $expected=@('88ba73a97e273a4f818f0200bcc32f7b8cc9df4522b554cca6b88e32e0832aae','d9f8295976a1a549191797303f6a6046877a96d3f1e23fe022bf3ebcfce61199','2a788e33838b9159b720362baa8a09f81cacdbfd67e2863e7213cce19a7659bd')
          $names=@('Sokna.Maintenance.Supervisor','Sokna.Maintenance.UpdateEngine','Sokna.Maintenance.RecoveryConsole')
          $exes=@('SoknaMaintenanceSupervisor.exe','SoknaMaintenanceUpdateEngine.exe','SoknaMaintenanceRecoveryConsole.exe')
          for($i=0;$i-lt3;$i++){
            dotnet publish "windows/maintenance/src/$($names[$i])/$($names[$i]).csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o (Join-Path $root $names[$i])
            if($LASTEXITCODE-ne0){throw 'PINNED_COMPONENT_BUILD_FAILED'}
            $p=Join-Path $root ($names[$i]+'/'+$exes[$i])
            if((Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()-ne$expected[$i]){throw ('PINNED_COMPONENT_NOT_BYTE_EXACT_'+$names[$i])}
          }
          $payload=Join-Path $root 'payload'
          & ./packaging/windows/scripts/prepare-maintenance-components-v4.ps1 -RepoRoot $PWD.Path -Supervisor (Join-Path $root 'Sokna.Maintenance.Supervisor/SoknaMaintenanceSupervisor.exe') -Engine (Join-Path $root 'Sokna.Maintenance.UpdateEngine/SoknaMaintenanceUpdateEngine.exe') -RecoveryConsole (Join-Path $root 'Sokna.Maintenance.RecoveryConsole/SoknaMaintenanceRecoveryConsole.exe') -OutputRoot $payload
          $manifest=Join-Path $payload 'maintenance-component-manifest-v2.json'
          $m=Get-Content $manifest -Raw|ConvertFrom-Json
          $m.supported_baselines=@(Get-Content wrapper-fix/packaging/windows/maintenance-supported-baselines-v4.json -Raw|ConvertFrom-Json)
          $m.source_commit='aba774d67e9d3890aa0f69d00f214ae82b395927'
          $m|Add-Member wrapper_source_commit $env:GITHUB_SHA
          $m|ConvertTo-Json -Depth 12|Set-Content $manifest -Encoding utf8
          foreach($file in @('invoke-maintenance-components-v4.ps1','invoke-maintenance-install-logged-v1.ps1')){
            Copy-Item (Join-Path $PWD.Path ('wrapper-fix/packaging/windows/scripts/'+$file)) $payload -Force
          }
      - name: Compile exact REV3 and verify unknown-host safe report
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'maintenance-rev4'
          $iscc=@("${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe","$env:ProgramFiles/Inno Setup 6/ISCC.exe")|Where-Object{Test-Path $_}|Select-Object -First 1
          if(-not$iscc){choco install innosetup -y --no-progress;if($LASTEXITCODE-ne0){throw 'INNO_INSTALL_FAILED'};$iscc="${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"}
          & $iscc "/DPayloadRoot=$root/payload" "/DOutputDir=$root/dist" wrapper-fix/packaging/windows/installer/SOKNA-Maintenance-0326-Integrated-Rev4-QA.iss
          if($LASTEXITCODE-ne0){throw 'REV4_COMPILE_FAILED'}
          $exe=Join-Path $root 'dist/SOKNA-Maintenance-0326-INTEGRATED-QA-REV4-NOT-PRODUCTION.exe'
          $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if("$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)"-ne'0.3.26.4'){throw 'REV4_VERSION_WRONG'}
          $p=Start-Process $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-eq0){throw 'UNKNOWN_HOST_ACCEPTED'}
          $desktop=[Environment]::GetFolderPath('DesktopDirectory')
          $reports=@(Get-ChildItem $desktop -Filter 'SOKNA-MAINTENANCE-INSTALL-FAILED-*.json')
          if($reports.Count-ne1){throw 'UNKNOWN_HOST_REPORT_MISSING'}
          $failure=Get-Content $reports[0].FullName -Raw|ConvertFrom-Json
          if($failure.safe_code-ne'R125_BASELINE_SERVICE_MISSING' -or $failure.failed_stage-ne'SERVICE_LAYOUT' -or $failure.recovery_requested -or $null-ne$failure.rollback_verified){throw 'UNKNOWN_HOST_REPORT_UNTRUE'}
          Copy-Item $reports[0].FullName (Join-Path $root 'dist/UNKNOWN-HOST-REPORT.json')
          Copy-Item (Join-Path $root 'payload/maintenance-component-manifest-v2.json') (Join-Path $root 'dist/COMPONENT-MANIFEST.json')
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $([IO.Path]::GetFileName($exe))"|Set-Content (Join-Path $root 'dist/SHA256SUMS.txt')
          @{wrapper_source_commit=$env:GITHUB_SHA;payload_source_commit='aba774d67e9d3890aa0f69d00f214ae82b395927';sha256=$sha;payload_byte_exact=$true;component_upgrade_cases=60;physical_cafe_verified=$false;production_approved=$false}|ConvertTo-Json|Set-Content (Join-Path $root 'dist/BUILD-QA.json')
          Copy-Item (Join-Path $root 'Sokna.Maintenance.UpdateEngine/SoknaMaintenanceUpdateEngine.exe') (Join-Path $root 'dist/SoknaMaintenanceUpdateEngine.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-0326-rev4-built-qa-not-for-install
          path: ${{ runner.temp }}/maintenance-rev4/dist/*
          if-no-files-found: error
  real-services-rev4:
    needs: build-rev4
    runs-on: windows-latest
    timeout-minutes: 35
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
        with: {ref: aba774d67e9d3890aa0f69d00f214ae82b395927}
      - uses: actions/checkout@v4
        with: {ref: b8b1cc4e91772692d92d6f7aa10b0657d2aa5427, path: old-0322-source}
      - uses: actions/checkout@v4
        with: {path: wrapper-fix}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with: {name: maintenance-0326-rev4-built-qa-not-for-install, path: dist}
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-0324-built-qa-not-production
          run-id: 42576660029
          github-token: ${{ github.token }}
          path: old-0324-artifact
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-0325-built-qa-not-production
          run-id: 42631664373
          github-token: ${{ github.token }}
          path: old-0325-artifact
      - uses: actions/download-artifact@v4
        with:
          name: exact-recovery-011-643841631
          run-id: 42688606509
          github-token: ${{ github.token }}
          path: exact-011
      - name: Exact prior baseline binaries
        shell: pwsh
        run: |
          $old=Join-Path $env:RUNNER_TEMP 'old-0322'
          foreach($n in @('Sokna.Maintenance.Supervisor','Sokna.Maintenance.UpdateEngine','Sokna.Maintenance.RecoveryConsole')){
            dotnet publish "old-0322-source/windows/maintenance/src/$n/$n.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o (Join-Path $old $n)
            if($LASTEXITCODE-ne0){throw 'OLD_BASELINE_BUILD_FAILED'}
