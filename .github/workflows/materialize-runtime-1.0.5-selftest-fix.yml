name: Materialize Runtime 1.0.5 Scheduler Self-Test Fix

on:
  push:
    branches:
      - work/windows-services-1.0.17-runtime-resilience
    paths:
      - windows/runtime/patches/1.0.5/fix_scheduler_selftest_jitter.py
      - .github/workflows/materialize-runtime-1.0.5-selftest-fix.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize jitter-aware scheduler self-test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python windows/runtime/patches/1.0.5/fix_scheduler_selftest_jitter.py --source windows/runtime/source/Program.cs
          if($LASTEXITCODE-ne0){throw 'Self-test correction materialization failed'}
          git diff --check
          if($LASTEXITCODE-ne0){throw 'Corrected Runtime source failed git diff --check'}
          if(git status --porcelain -- windows/runtime/source/Program.cs){
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add windows/runtime/source/Program.cs
            git commit -m 'fix(runtime): make Runtime 1.0.5 scheduler self-test jitter-aware [skip ci]'
            if($LASTEXITCODE-ne0){throw 'Unable to commit self-test correction'}
            git push origin HEAD:work/windows-services-1.0.17-runtime-resilience
            if($LASTEXITCODE-ne0){throw 'Unable to push self-test correction'}
          }
