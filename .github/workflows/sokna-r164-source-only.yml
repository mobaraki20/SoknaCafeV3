name: SOKNA R164 post-golive cumulative Guest order status source-only QA
on:
  push:
    branches: [qa/sokna-r164-post-golive-guest-projection-20261112]
    paths:
      - 'qa/sokna-r164/**'
      - '.github/workflows/sokna-r164-source-only.yml'
permissions:
  contents: read
jobs:
  exact-source-and-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring
      - name: Download genuine R162 install payloads only (no outdated main)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parents" "$RUNNER_TEMP/r163-local" "$RUNNER_TEMP/r164-public"
          gh release download sokna-r162-golive-oneclick-uat-20261111 --repo mobaraki20/SoknaCafeV3 \
            --pattern SOKNA-R162-LOCAL-231EM-49BASE-PANEL-UPDATE.zip --dir "$RUNNER_TEMP/parents"
          gh release download sokna-r162-golive-oneclick-uat-20261111 --repo mobaraki20/SoknaCafeV3 \
            --pattern SOKNA-R160-PUBLIC-35HR-FROM-35HP-PANEL-UPDATE.zip --dir "$RUNNER_TEMP/parents"
          echo "16adab9910c017d97ebc256e721bfbc22e26103979adc59763c6bf978b6f5471  $RUNNER_TEMP/parents/SOKNA-R162-LOCAL-231EM-49BASE-PANEL-UPDATE.zip" | sha256sum -c -
          echo "96e976c43644f62e1246a29752af3fab5fff62978421f93db8065d8460a67503  $RUNNER_TEMP/parents/SOKNA-R160-PUBLIC-35HR-FROM-35HP-PANEL-UPDATE.zip" | sha256sum -c -
      - name: Rebuild the exact prior Local R163 patch without altering go-live reset
        shell: bash
        run: |
          set -euo pipefail
          python qa/sokna-r163-post-golive/verify_r163.py \
            --release "$RUNNER_TEMP/parents/SOKNA-R162-LOCAL-231EM-49BASE-PANEL-UPDATE.zip" \
            --patch qa/sokna-r163-post-golive/R162-TO-R163-LOCAL-guest-renderer.patch \
            --output "$RUNNER_TEMP/r163-local"
          mkdir -p "$RUNNER_TEMP/r163-unpacked"
          unzip -q "$RUNNER_TEMP/r163-local/SOKNA-R163-LOCAL-FULL-SOURCE-QA-NOT-INSTALL.zip" -d "$RUNNER_TEMP/r163-unpacked"
          test -f "$RUNNER_TEMP/r163-unpacked/src/Domain/System/GoLiveResetEngine.php"
          test -f "$RUNNER_TEMP/r163-unpacked/public/assets/catalog-workspace.js"
          test -f "$RUNNER_TEMP/r163-unpacked/src/Domain/GuestLan/GuestLanPageRenderer.php"
      - name: Reconstruct exact Public 35HR and one-file R164 patch
        shell: bash
        run: |
          set -euo pipefail
          python qa/sokna-r164/verify_r164_public.py \
            --release "$RUNNER_TEMP/parents/SOKNA-R160-PUBLIC-35HR-FROM-35HP-PANEL-UPDATE.zip" \
            --patch qa/sokna-r164/R162-TO-R164-PUBLIC-guest-status-freshness.patch \
            --outdir "$RUNNER_TEMP/r164-public"
          test -f "$RUNNER_TEMP/r164-public/public-candidate/src/Maintenance/GoLiveResetEngine.php"
      - name: Source PHP and JavaScript syntax and real compatibility test before and after fix
        shell: bash
        run: |
          set -euo pipefail
          find "$RUNNER_TEMP/r163-unpacked" -name '*.php' -print0 | xargs -0 -n1 -P 8 php -l >/dev/null
          find "$RUNNER_TEMP/r163-unpacked" -name '*.js' -print0 | xargs -0 -n1 -P 8 node --check >/dev/null
          find "$RUNNER_TEMP/r164-public/public-candidate" -name '*.php' -print0 | xargs -0 -n1 -P 8 php -l >/dev/null
          find "$RUNNER_TEMP/r164-public/public-candidate" -name '*.js' -print0 | xargs -0 -n1 -P 8 node --check >/dev/null
          php -l qa/sokna-r164/test_public_guest_projection.php
          if php qa/sokna-r164/test_public_guest_projection.php \
            "$RUNNER_TEMP/r164-public/public-parent/src/Guest/GuestCompatibilityService.php" \
            "$RUNNER_TEMP/r164-public/public-parent/src/Core/CanonicalJson.php" > "$RUNNER_TEMP/r164-baseline.log"; then
              echo 'Unexpected R162 baseline PASS; regression must be reproduced before accepting patch'; exit 61
          fi
          grep -q 'RESULT 28 checks, 6 failures' "$RUNNER_TEMP/r164-baseline.log"
          cat "$RUNNER_TEMP/r164-baseline.log"
          php qa/sokna-r164/test_public_guest_projection.php \
            "$RUNNER_TEMP/r164-public/public-candidate/src/Guest/GuestCompatibilityService.php" \
            "$RUNNER_TEMP/r164-public/public-candidate/src/Core/CanonicalJson.php"
      - uses: actions/upload-artifact@v4
        with:
          name: r164-post-golive-local-r163-public-r164-sources-NOT-INSTALLABLE
          path: |
            ${{ runner.temp }}/r163-local/*-NOT-INSTALL.zip
            ${{ runner.temp }}/r163-local/*.json
            ${{ runner.temp }}/r164-public/*-NOT-INSTALL.zip
            ${{ runner.temp }}/r164-public/*.json
          if-no-files-found: error
          retention-days: 14
