name: R132 Maintenance preflight and release safety QA
on:
  push:
    branches:
      - qa/sokna-r132-maintenance-preflight-recovery-20261107
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-and-php-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Source invariants and redaction contracts
        run: python3 qa/sokna-r132/test-source-contract.py
      - name: Offline final ZIP inventory and production rejection
        run: python3 qa/sokna-r132/test-release-gate.py
      - name: Embedded migration helper syntax
        run: php -l windows/maintenance/src/Sokna.Maintenance.Core/RoutineLocalDatabase.php
  mariadb-readonly-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-only
          MARIADB_DATABASE: sokna_r132_test
          MARIADB_USER: sokna_r132
          MARIADB_PASSWORD: ci-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated PHP MariaDB test clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-mysql mariadb-client
      - name: Fail before mutation and succeed without applying DML
        run: bash qa/sokna-r132/test-preflight-mariadb.sh
      - name: Real logical backup, SHA-256 and independent restore in disposable MariaDB
        env: &r133_mariadb
          SOKNA_TEST_DB_HOST: 127.0.0.1
          SOKNA_TEST_DB_PORT: '3306'
          SOKNA_TEST_DB_ROOT_USER: root
          SOKNA_TEST_DB_ROOT_PASS: ci-root-only
          SOKNA_MARIADB_CI_ONLY: '1'
        run: bash windows/maintenance/tests/s7e1-disposable-mariadb-restore-drill.sh
      - name: Crash after actual DDL and verify forward-only recovery and intact encrypted backup
        env: *r133_mariadb
        run: python3 windows/maintenance/tests/s7e2b-mariadb-forward-crash-ci.py
  windows-maintenance-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build real UpdateEngine with embedded PHP preflight
        shell: pwsh
        run: |
          dotnet build windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  windows-operator-stage-negative:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Real Maintenance verifier denies UAT Stage and stale candidate bypass
        shell: pwsh
        run: |
          dotnet run --project windows/maintenance/tests/Sokna.Maintenance.OperatorUploadHarness/Sokna.Maintenance.OperatorUploadHarness.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  windows-apache-mariadb-recovery-lab:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build an original U01 UAT artifact only inside RUNNER_TEMP
        shell: pwsh
        run: |
          python release/build-local-u01.py --output "$env:RUNNER_TEMP/u01-local"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Requalify ONLY isolated synthetic fixture (no signing, no export)
        shell: pwsh
        env:
          SOKNA_R133_LAB_ONLY: '1'
        run: |
          python qa/sokna-r133/qualify-disposable-u01-fixture.py "$env:RUNNER_TEMP/u01-local/SOKNA-Local-231bf-U01-Panel-Update.zip"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Actual Windows SCM Apache/PHP, MariaDB and Maintenance forward recovery faults
        shell: pwsh
        env:
          SOKNA_R133_LAB_ONLY: '1'
        run: |
          & ./windows/maintenance/tests/u01-windows-full-cycle.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve only non-sensitive CI state summaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r133-disposable-only-windows-recovery-summary
          path: ${{ runner.temp }}/U01-WINDOWS-CYCLES.json
          if-no-files-found: ignore
          retention-days: 7
