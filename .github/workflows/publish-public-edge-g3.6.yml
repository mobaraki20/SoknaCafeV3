name: Publish SOKNA Public Edge g3.6
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-public-edge-g3.6.yml'
permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: "36504458515"
      ARTIFACT: sokna-public-edge-3.0.0-g3.6-dev-qualified-0f145ebe3b156e59a541d8889c6247a423d89ad7
      TAG: public-edge-v3.0.0-g3.6-dev
      TARGET_SHA: 0f145ebe3b156e59a541d8889c6247a423d89ad7
    steps:
      - name: Download exact qualified deploy package
        run: |
          set -euo pipefail
          mkdir -p dist/artifact dist/release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir dist/artifact
          cp dist/artifact/SoknaCafeV3-public-edge-deploy-3.0.0-g3.6-dev.zip dist/release/
          (cd dist/release && sha256sum SoknaCafeV3-public-edge-deploy-3.0.0-g3.6-dev.zip > SHA256SUMS.txt)

      - name: Publish release
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/release/*               --repo "$GITHUB_REPOSITORY"               --target "$TARGET_SHA"               --title "SOKNA Public Edge 3.0.0-g3.6-dev"               --notes "First qualified deploy release for the independently deployable Public Edge. Adds tools/deploy-bootstrap.php for deterministic host installation: config validation, storage preparation, MariaDB connectivity, Public-owned migrations and health verification. The exact released ZIP passed Public M3/M4/G3 contract and MariaDB selftests, was extracted into a clean deployment directory, applied all three migrations to a fresh MariaDB database, passed a second idempotent bootstrap, and returned healthy real HTTP /health with the expected version."
          fi
