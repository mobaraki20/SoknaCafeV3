name: Sokna R251 read-only Public move discovery QA (NO DEPLOY)
on:
  push:
    branches:
      - qa/sokna-r251-migration-start-20261116
    paths:
      - apps/local-web/src/Domain/PublicEdge/PublicMoveDecisionEngine.php
      - r251/**
      - .github/workflows/sokna-r251-migration-discovery.yml
  workflow_dispatch:
jobs:
  read-only-discovery:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax, safe target selection, distinct-instance classification
        shell: bash
        run: |
          set -euo pipefail
          php -v
          php -l apps/local-web/src/Domain/PublicEdge/PublicMoveDecisionEngine.php
          php -l r251/test-public-move-decision.php
          php r251/test-public-move-decision.php | tee /tmp/sokna-r251-discovery.txt
          grep -q 'R251_DISCOVERY_READONLY_TESTS_PASS count=55' /tmp/sokna-r251-discovery.txt
          # The production decision engine must never refer to one customer, URL or version.
          ! grep -Eiq 'soknaspace|soknagroup|35ic|231ff|cafe-alpha|bistro-beta|coffee-gamma' apps/local-web/src/Domain/PublicEdge/PublicMoveDecisionEngine.php
          python3 r251/check_decisions.py
          echo PASS_R251_UNIVERSAL_MULTI_CUSTOMER_DISCOVERY_NO_HOST_MUTATION
