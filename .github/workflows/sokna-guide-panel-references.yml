name: SOKNA documentation public panel references
on:
  push:
    branches: [docs/guide-native-capture-20261128]
    paths: ['.github/workflows/sokna-guide-panel-references.yml']
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Retrieve public documentation reference images
        shell: bash
        run: |
          mkdir -p references
          python3 - <<'PY'
          import urllib.request, hashlib, json
          from pathlib import Path
          urls = {
              'da-file-manager': 'https://wiki.crowncloud.net/images/How_to_Install_WordPress_Under_Directadmin/5.png',
              'da-database': 'https://www.evolvewebhosting.com/help/directadmin/user/account-manager/mysql-management/create_database.png',
              'da-ssl': 'https://evo.site-helper.com/assets/img/ssl_lets_encrypt3.4ed8918e.png',
              'cpanel-file-manager': 'https://hackernoon.imgix.net/images/MvPCd5XmiCWdqTISnZLTpruRflk2-hs93hw3.png',
              'cpanel-database': 'https://cdn.hackernoon.com/images/MvPCd5XmiCWdqTISnZLTpruRflk2-0kc3hul.png'
          }
          results=[]
          for name,url in urls.items():
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'SOKNA documentation reference collection'}),timeout=12) as r:
                      data=r.read(5000001)
                      if len(data)>5000000 or not data.startswith(b'\x89PNG\r\n\x1a\n'):
                          raise ValueError('Not a bounded PNG')
                      Path('references',name+'.png').write_bytes(data)
                      results.append({'name':name,'url':url,'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'status':'retrieved'})
              except Exception as e:
                  results.append({'name':name,'url':url,'status':'unavailable','detail':str(e)})
          Path('references/receipt.json').write_text(json.dumps(results,indent=2))
          print(json.dumps(results,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sokna-public-panel-reference-images
          path: references/
          retention-days: 7
