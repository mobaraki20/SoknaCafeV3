name: SOKNA R278 Native Windows Maintenance R277 to R278
on:
  push:
    branches: [qa/sokna-r278-rial-persistent-settings-20261118]
    paths:
      - '.github/workflows/sokna-r278-native-from-r277.yml'
      - 'r278/tests/windows_native_r278_from_r277.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-windows-r277-direct:
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      SOKNA_R186_CI_ONLY: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Real Windows PHP Apache MariaDB Maintenance from installed R277 to R278
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & ./r278/tests/windows_native_r278_from_r277.ps1
          if($LASTEXITCODE -ne 0){throw 'R278_FROM_R277_NATIVE_WINDOWS_NONZERO'}
          Write-Host 'R278_NATIVE_WINDOWS_R277_TO_R278_REAL_INSTALL_PASS'
