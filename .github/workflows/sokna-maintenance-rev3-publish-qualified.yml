name: SOKNA publish byte-pinned fully qualified Maintenance REV3
on:
  push:
    branches: [qa/sokna-update-safety-20261109]
    paths: ['.github/workflows/sokna-maintenance-rev3-publish-qualified.yml']
permissions: {contents: read, actions: read}
jobs:
  publish-qa-prerelease:
    runs-on: ubuntu-latest
    permissions: {contents: write, actions: read}
    steps:
      - name: Require completed exact independent QA jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'VERIFY'
          import subprocess,json
          for run,expected in [(42688967400,{'build-rev3','exact-installer-engine-live-stack'}),(42690483173,{'real-services-rev3','verify-native-evidence'})]:
              data=json.loads(subprocess.check_output(['gh','api',f'repos/mobaraki20/SoknaCafeV3/actions/runs/{run}/jobs']))
              checked={j['name'] for j in data['jobs'] if j['name'] in expected and j['status']=='completed' and j['conclusion']=='success'}
              assert checked==expected
          VERIFY
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-0326-rev3-built-qa-not-production
          run-id: 42688967400
          github-token: ${{ github.token }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-0326-rev3-five-real-baselines-no-field-approval
          run-id: 42690483173
          github-token: ${{ github.token }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-0326-rev3-exact011-native-12cycles-three-restores
          run-id: 42688967400
          github-token: ${{ github.token }}
          path: native-evidence
      - name: Validate exact built and tested bytes
        run: |
          python3 - <<'PY'
          import json,hashlib,pathlib,os
          d=pathlib.Path('dist')
          native=json.loads(next(pathlib.Path('native-evidence').rglob('integrated-r125-native.json')).read_text(encoding='utf-8-sig'))
          assert native['status']=='PASS' and native['exact_installer_sha256']=='4d6294d6a76128e9982d5ffd42b692e2fbf72b41718c4b66eec3f9d9885483f8' and native['next_core_preflight']
          assert list(pathlib.Path('native-evidence').rglob('r149b-windows-cycles.json'))
          build=json.loads((d/'BUILD-QA.json').read_text(encoding='utf-8-sig'))
          checks=json.loads((d/'REAL-SERVICE-QA.json').read_text(encoding='utf-8-sig'))
          exe=d/'SOKNA-Maintenance-0326-INTEGRATED-QA-REV3-NOT-PRODUCTION.exe'
          sha=hashlib.sha256(exe.read_bytes()).hexdigest()
          assert sha==build['sha256'] and build['payload_byte_exact']
          assert build['wrapper_source_commit']=='ac863401ac88210811db57287153c305c8f7f9d5' and sha=='4d6294d6a76128e9982d5ffd42b692e2fbf72b41718c4b66eec3f9d9885483f8'
          assert len(checks)==5 and all(x['installer_sha256']==sha and x['precise_pretransaction_rejection_report']=='PASS' and x['real_service_upgrade']=='PASS' and x['real_file_lock_rollback']=='PASS' and not x['production_approved'] for x in checks)
          assert sum(x['preserved_original_011'] and x['baseline_recovery_sha256']=='368ea590a52b895d409d0bbc23926eebd58f512ac73a75dffac8163e5dc682dd' for x in checks)==1
          assert {x['component_layout'] for x in checks}=={'separate_registered_paths','siblings_absent','legacy_sibling_files'}
          PY
      - name: Assemble exact native evidence
        run: zip -jr dist/NATIVE-EVIDENCE.zip native-evidence
      - name: Publish immutable QA prerelease in GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: mobaraki20/SoknaCafeV3
        run: |
          release_tag="maintenance-0326-integrated-rev3-qa-ac863401ac88"
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo 'Refusing to overwrite an existing release.'
            exit 1
          fi
          gh release create "$release_tag" --target "$GITHUB_SHA" --prerelease --latest=false --title 'SOKNA Maintenance 0.3.26 Installer REV3 - QA NOT PRODUCTION' --notes-file qa/sokna-preserved-recovery/RELEASE-NOTES-REV3-FA.md dist/SOKNA-Maintenance-0326-INTEGRATED-QA-REV3-NOT-PRODUCTION.exe dist/SHA256SUMS.txt dist/BUILD-QA.json dist/REAL-SERVICE-QA.json dist/COMPONENT-MANIFEST.json dist/UNKNOWN-HOST-REPORT.json dist/NATIVE-EVIDENCE.zip
