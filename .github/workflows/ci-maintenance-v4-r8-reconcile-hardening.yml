name: Apply Maintenance V4 R8 Reconcile Hardening

on:
  push:
    branches: [work/maintenance-v4-r8-php-slot-root]
    paths:
      - '.github/workflows/ci-maintenance-v4-r8-reconcile-hardening.yml'
      - 'windows/maintenance/qualification/apply-r8-reconcile-hardening.py'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Apply deterministic source patch
        id: patch
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $log='r8-patch-diagnostic.txt'
          "repo=$PWD" | Set-Content -LiteralPath $log -Encoding utf8
          "python=$((Get-Command python -ErrorAction SilentlyContinue).Source)" | Add-Content -LiteralPath $log -Encoding utf8
          python windows/maintenance/qualification/apply-r8-reconcile-hardening.py *>> $log
          $code=$LASTEXITCODE
          "exit_code=$code" | Add-Content -LiteralPath $log -Encoding utf8
          "coord_exists=$(Test-Path windows/maintenance/src/Sokna.Maintenance.Core/SupervisorProductionMigrationCoordinator.cs)" | Add-Content -LiteralPath $log -Encoding utf8
          "queue_exists=$(Test-Path windows/maintenance/src/Sokna.Maintenance.Core/LocalSlotAdoptionQueue.cs)" | Add-Content -LiteralPath $log -Encoding utf8
          git diff -- windows/maintenance/src/Sokna.Maintenance.Core/SupervisorProductionMigrationCoordinator.cs windows/maintenance/src/Sokna.Maintenance.Core/LocalSlotAdoptionQueue.cs *>> $log
          if($code-ne0){exit $code}
      - name: Upload patch diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-reconcile-patch-diagnostic
          path: r8-patch-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
      - name: Verify patch diff
        if: steps.patch.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git diff --check
          $diff=git diff -- windows/maintenance/src/Sokna.Maintenance.Core/SupervisorProductionMigrationCoordinator.cs windows/maintenance/src/Sokna.Maintenance.Core/LocalSlotAdoptionQueue.cs
          $diff | Write-Host
          if($diff -notmatch 'RequireProductionSlotPath'){throw 'Sibling-slot reconcile guard missing'}
          if($diff -notmatch 'active-slot state does not match'){throw 'Active-slot identity guard missing'}
      - name: Build and regression test
        if: steps.patch.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Supervisor build failed'}
          dotnet build windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Update Engine build failed'}
          dotnet build windows/maintenance/tests/Sokna.Maintenance.R7ReliabilityHarness/Sokna.Maintenance.R7ReliabilityHarness.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Reliability harness build failed'}
          dotnet run --project windows/maintenance/tests/Sokna.Maintenance.R7ReliabilityHarness/Sokna.Maintenance.R7ReliabilityHarness.csproj -c Release --no-build
          if($LASTEXITCODE-ne0){throw 'Reliability harness failed'}
      - name: Commit hardened reconcile guards
        if: steps.patch.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          git config user.name 'sokna-maintenance-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add windows/maintenance/src/Sokna.Maintenance.Core/SupervisorProductionMigrationCoordinator.cs windows/maintenance/src/Sokna.Maintenance.Core/LocalSlotAdoptionQueue.cs
          git commit -m 'fix(maintenance): reject legacy nested slots during reconcile'
          git push origin HEAD:work/maintenance-v4-r8-php-slot-root
      - name: Fail if patch failed
        if: steps.patch.outcome != 'success'
        shell: pwsh
        run: throw 'R8 reconcile source patch did not apply; see diagnostic artifact.'
