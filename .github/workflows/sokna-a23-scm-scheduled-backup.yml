          $env:PHPRC=$phpRoot
          $cert=Join-Path $lab 'qa-ca.pem'
          $key=Join-Path $lab 'qa-key.pem'
          $openssl=Join-Path $env:ProgramFiles 'Git/usr/bin/openssl.exe'
          if(!(Test-Path $openssl)){$openssl=(Get-Command openssl -ErrorAction Stop).Source}
          & $openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj '/CN=127.0.0.1' -addext 'subjectAltName=IP:127.0.0.1' -keyout $key -out $cert
          Need ($LASTEXITCODE -eq 0) 'TEST_CA_GENERATION_FAILED'
          Add-Content (Join-Path $phpRoot 'php.ini') ('openssl.cafile="'+(P $cert)+'"')
          Run $phpExe @('-l',$fixturePath)
          Run $phpExe @($fixturePath,$lab,'prepare')
          $pubServer=$null;$proxyServer=$null
          try{
            $pubServer=Start-Process -FilePath $phpExe -ArgumentList @('-S','127.0.0.1:18793','-t',('"'+$pub+'"')) -WorkingDirectory $phpRoot -PassThru -RedirectStandardOutput (Join-Path $lab 'pub-out.txt') -RedirectStandardError (Join-Path $lab 'pub-err.txt')
            $proxyServer=Start-Process -FilePath (Get-Command python).Source -ArgumentList @(('"'+$proxyPath+'"'),('"'+$cert+'"'),('"'+$key+'"')) -PassThru -RedirectStandardOutput (Join-Path $lab 'proxy-out.txt') -RedirectStandardError (Join-Path $lab 'proxy-err.txt')
            Start-Sleep -Seconds 2
            Need (!$pubServer.HasExited -and !$proxyServer.HasExited) 'TLS_FIXTURE_UNAVAILABLE'
            $scheduleReceipt=Join-Path $env:RUNNER_TEMP 'a23-scm-scheduler-receipt.json'
            $restoreReceipt=Join-Path $env:RUNNER_TEMP 'a23-scm-scheduler-restore-receipt.json'
            & $scmPath
            Need (Test-Path $scheduleReceipt) 'ACTUAL_SCM_RECEIPT_MISSING'
            Stop-Service SoknaApache -ErrorAction Stop
            Run $phpExe @($fixturePath,$lab,'verify',$scheduleReceipt,$restoreReceipt)
            Need (Test-Path $restoreReceipt) 'RESTORE_RECEIPT_MISSING'
          } finally {
            foreach($p in @($proxyServer,$pubServer)){if($null -ne $p -and !$p.HasExited){$p.Kill();$p.WaitForExit()}}
            Remove-Item (Join-Path $lab 'scheduler-secret.json'),$key -ErrorAction SilentlyContinue
          }
          '@
          $marker=' $receipt=@{status='
          Need ($s.Contains($marker)) 'NATIVE_SCRIPT_MARKER'
          $s=$s.Replace($marker,($inject+[Environment]::NewLine+$marker))
          $p=Join-Path $env:RUNNER_TEMP 'a23-native-scheduler.ps1'
          Set-Content $p $s -Encoding utf8NoBOM
          & $p
          Need ($LASTEXITCODE -eq 0) 'NATIVE_SCHEDULER_GATE_FAILED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-A23-SCM-SCHEDULER-EVIDENCE
          path: |
            ${{ runner.temp }}/a23-scm-scheduler-receipt.json
            ${{ runner.temp }}/a23-scm-scheduler-restore-receipt.json
          retention-days: 30
