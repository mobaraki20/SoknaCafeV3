name: SOKNA R300 Exact Transfer Hardening Native Windows QA - NO FIELD INSTALL
on:
  push:
    branches: [qa/sokna-r300-public-move-hardening-20261119]
    paths: ['r300/**', '.github/workflows/sokna-r300-native-qualification.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOKNA_R300_WORKDIR: ${{ github.workspace }}/r300-work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-R299-EXACT-NATIVE-QUALIFICATION-CANDIDATE
          run-id: 44541550259
          github-token: ${{ github.token }}
          path: ${{ github.workspace }}/r300-work/source
      - name: Build exact R300 candidate from R298 and verify SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 r300/build_r300.py
          export R300_QA_SOURCE_ROOT="$SOKNA_R300_WORKDIR/source-tree"
          php r300/tests/qa_local_move_failure.php
          find "$R300_QA_SOURCE_ROOT" -name '*.php' -print0 | xargs -0 -n1 php -l > "$SOKNA_R300_WORKDIR/php-lint.log"
          find "$R300_QA_SOURCE_ROOT" -name '*.js' -print0 | xargs -0 -n1 node --check > "$SOKNA_R300_WORKDIR/js-lint.log"
          echo 'PASS_R300_608_FILE_SOURCE_PHP_JS_AND_13_SAFETY_TESTS'
          echo 'f69fb483f977ffc8dd65452375de6e18aa3e755899d9ae16d2dd97e69c7bb59c  '"$SOKNA_R300_WORKDIR/r300-out/SOKNA-R300-LOCAL-231FR-PUBLIC-MOVE-QA-NOT-FIELD-INSTALL.zip" | sha256sum -c -
          python3 packaging/windows/release-gates/check_local_release_set.py "$SOKNA_R300_WORKDIR/r300-out/SOKNA-R300-LOCAL-231FR-PUBLIC-MOVE-QA-NOT-FIELD-INSTALL.zip" --require-installable
      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-R300-QUALIFICATION-CANDIDATE-NO-FIELD
          path: |
            ${{ github.workspace }}/r300-work/r300-out/SOKNA-R300-LOCAL-231FR-PUBLIC-MOVE-QA-NOT-FIELD-INSTALL.zip
            ${{ github.workspace }}/r300-work/r300-out/R300-CANDIDATE-PROOF.json
          if-no-files-found: error
          retention-days: 30
  actual-windows-maintenance:
    needs: build-candidate
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      SOKNA_R186_CI_ONLY: 'YES'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: qa/sokna-r278-rial-persistent-settings-20261118
          path: native-src
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-R278-231FN-ORIGINAL-ZIP-FACTORY-QA-ONLY
          run-id: 44305226007
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r278-parent
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-R300-EXACT-NATIVE-QUALIFICATION-CANDIDATE
          path: ${{ runner.temp }}/r300-target
      - name: Real Windows R278-to-R300 Maintenance prepare, activate, HTTP, DB83
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $orig=Get-ChildItem '${{ runner.temp }}/r278-parent' -Recurse -Filter 'SOKNA-R278-LOCAL-231FN-CUMULATIVE-RIAL-PERSISTENCE-INSTALL-READY.zip' | Select-Object -First 1
          $target=Get-ChildItem '${{ runner.temp }}/r300-target' -Recurse -Filter 'SOKNA-R300-LOCAL-231FR-PUBLIC-MOVE-QA-NOT-FIELD-INSTALL.zip' | Select-Object -First 1
          if(!$orig -or !$target){throw 'R300_REQUIRED_EXACT_ARCHIVE_NOT_FOUND'}
          $env:SOKNA_R278_ORIGINAL_ZIP=$orig.FullName
          $env:SOKNA_R300_CANDIDATE_ZIP=$target.FullName
          if((Get-FileHash $target.FullName -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'f69fb483f977ffc8dd65452375de6e18aa3e755899d9ae16d2dd97e69c7bb59c'){throw 'R300_TARGET_SHA_NOT_EXACT'}
          Push-Location 'native-src'
          try {
            & (Join-Path $env:GITHUB_WORKSPACE 'r300/tests/native_r278_to_r300.ps1')
            if($LASTEXITCODE -ne 0){throw 'R300_NATIVE_MAINTENANCE_FAILED'}
            Write-Host 'PASS_R300_EXACT_NATIVE_STAGE_ACTIVATE_HTTP_DB83_DISPOSABLE_WINDOWS_ONLY'
          } finally {Pop-Location}
      - name: Write Windows-only acceptance receipt
        shell: pwsh
        run: |
          @{schema='sokna-r300-windows-native-receipt-v1';status='PASS';package_sha256='f69fb483f977ffc8dd65452375de6e18aa3e755899d9ae16d2dd97e69c7bb59c';baseline='R278_231FN';target='R300_231FR';db_migrations=83;host_deployed=$false;field_install_authorized=$false} |
            ConvertTo-Json -Depth 5 | Set-Content 'r300-native-receipt.json' -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-R300-NATIVE-WINDOWS-REPORT-ONLY
          path: r300-native-receipt.json
          if-no-files-found: ignore
          retention-days: 30
