name: CI Windows Services 1.1.7 R8 Package

on:
  push:
    branches:
      - work/maintenance-v4-r8-php-slot-root
    paths:
      - 'windows/maintenance/**'
      - 'packaging/windows/WINDOWS_SERVICES_VERSION.txt'
      - 'packaging/windows/windows-services-component-manifest-v2.json'
      - 'packaging/windows/local-slot-bootstrap-contract-v1.json'
      - 'packaging/windows/installer/SOKNA-v4.iss'
      - 'packaging/windows/installer-bootstrap/**'
      - 'packaging/windows/setup-ui/**'
      - 'packaging/windows/setup-host-v3/**'
      - 'packaging/windows/scripts/build-installer-v4.ps1'
      - 'packaging/windows/scripts/prepare-shell-payload-v4.ps1'
      - 'packaging/windows/scripts/prepare-shell-payload-v8.ps1'
      - 'packaging/windows/scripts/setup-windows-components-v5.ps1'
      - 'packaging/windows/scripts/setup-windows-components-v8.ps1'
      - 'packaging/windows/scripts/queue-local-slot-adoption-r8.ps1'
      - 'packaging/windows/scripts/verify-r8-compiled-core.ps1'
      - '.github/workflows/ci-windows-services-1.1.7-r8-package.yml'

permissions:
  actions: read
  contents: read

jobs:
  qualify-package:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Lock R8 package and component identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $package=(Get-Content packaging/windows/WINDOWS_SERVICES_VERSION.txt -Raw).Trim()
          if($package-ne'1.1.7'){throw "R8 package version must be 1.1.7, got $package"}
          $m=Get-Content packaging/windows/windows-services-component-manifest-v2.json -Raw|ConvertFrom-Json
          $by=@{};foreach($c in $m.components){$by[[string]$c.component_id]=$c}
          if($m.package_version-ne'1.1.7'-or$by.runtime.version-ne'1.0.5'-or$by.'print-agent'.version-ne'6.2.9'-or$by.maintenance.version-ne'0.3.5'-or$by.'maintenance-update-engine'.version-ne'0.3.5'-or$by.'maintenance-recovery-console'.version-ne'0.1.1'){throw 'R8 package/component identity mismatch'}
          $sup=[xml](Get-Content windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj -Raw)
          $eng=[xml](Get-Content windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj -Raw)
          if([string]$sup.Project.PropertyGroup.Version-ne'0.3.5'-or[string]$eng.Project.PropertyGroup.Version-ne'0.3.5'){throw 'R8 Maintenance source version mismatch'}
          if([string]$sup.Project.PropertyGroup.InformationalVersion-ne'0.3.5'-or[string]$eng.Project.PropertyGroup.InformationalVersion-ne'0.3.5'){throw 'R8 informational version mismatch'}
          Write-Host 'R8 package/component identity: PASS'

      - name: Build and execute R8 source reliability gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build windows/maintenance/src/Sokna.Maintenance.Core/Sokna.Maintenance.Core.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Core build failed'}
          dotnet build windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Supervisor build failed'}
          dotnet build windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Update Engine build failed'}
          dotnet build windows/maintenance/tests/Sokna.Maintenance.R7ReliabilityHarness/Sokna.Maintenance.R7ReliabilityHarness.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Durable adoption reliability harness build failed'}
          dotnet run --project windows/maintenance/tests/Sokna.Maintenance.R7ReliabilityHarness/Sokna.Maintenance.R7ReliabilityHarness.csproj -c Release --no-build
          if($LASTEXITCODE-ne0){throw 'Durable adoption reliability harness failed'}
          dotnet build windows/maintenance/tests/Sokna.Maintenance.R8SlotPathHarness/Sokna.Maintenance.R8SlotPathHarness.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'R8 PHP/sibling-slot harness build failed'}
          dotnet run --project windows/maintenance/tests/Sokna.Maintenance.R8SlotPathHarness/Sokna.Maintenance.R8SlotPathHarness.csproj -c Release --no-build
          if($LASTEXITCODE-ne0){throw 'R8 PHP/sibling-slot harness failed'}
          Write-Host 'R8 source reliability gates: PASS'

      - name: Enforce R8 sibling-slot and safe-retry contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $core=Get-Content windows/maintenance/src/Sokna.Maintenance.Core/ProductionLocalSlotMigrationR8.Core.cs -Raw
          $migrate=Get-Content windows/maintenance/src/Sokna.Maintenance.Core/ProductionLocalSlotMigrationR8.Migrate.cs -Raw
          $staging=Get-Content windows/maintenance/src/Sokna.Maintenance.Core/ProductionLocalSlotMigrationR8.Staging.cs -Raw
          $coord=Get-Content windows/maintenance/src/Sokna.Maintenance.Core/SupervisorProductionMigrationCoordinator.cs -Raw
          $adoption=Get-Content windows/maintenance/src/Sokna.Maintenance.Core/LocalSlotAdoptionQueue.cs -Raw
          $queue=Get-Content packaging/windows/scripts/queue-local-slot-adoption-r8.ps1 -Raw
          if($core-notmatch'ReleaseSlotPrefix\s*=\s*"Web\.release\."'){throw 'R8 Web.release sibling namespace missing'}
          if($migrate-match'Path\.Combine\([^\r\n]*"LocalWeb"[^\r\n]*"releases"'){throw 'Nested LocalWeb/releases activation leaked into R8 migration'}
          foreach($text in @($migrate,$coord,$adoption)){if($text-notmatch'RequireProductionSlotPath'){throw 'R8 production slot path gate missing'}}
          if($staging-notmatch'VerifyMachineLocalOverlay'){throw 'R8 machine-local overlay equality gate missing'}
          if($staging-match'if\s*\(Directory\.Exists\(targetSlot\)\)\s*return'){throw 'R8 stale target-slot reuse remains'}
          foreach($required in @("'ROLLED_BACK'",'LEGACY_MIGRATION_STATE_UNSAFE','expected_managed_tree_sha256')){if(-not$queue.Contains($required)){throw "R8 Home safe-retry proof missing from queue: $required"}}
          Write-Host 'R8 sibling-slot / safe-retry contract: PASS'

      - name: Guard user wording and safe size strategy
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $iss=Get-Content packaging/windows/installer/SOKNA-v4.iss -Raw
          foreach($bad in @('به‌روزرسانی پوسته','بازاعمال پوسته','نسخه پوسته','فایل‌های پوسته','Maintenance Shell Update')){if($iss.Contains($bad)){throw "Obsolete user-facing shell wording remains: $bad"}}
          foreach($required in @('به‌روزرسانی سرویس‌های ویندوزی','بازاعمال سرویس‌های ویندوزی','Compression=lzma2/ultra64','SolidCompression=yes')){if(-not$iss.Contains($required)){throw "Required installer wording/compression contract missing: $required"}}
          $active=@('packaging/windows/scripts/build-installer-v4.ps1','windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj','windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj','packaging/windows/setup-ui/Sokna.SetupUi.csproj','packaging/windows/setup-host-v3/Sokna.SetupHostV3.csproj')
          foreach($p in $active){$raw=Get-Content $p -Raw;if($raw-match'PublishTrimmed\s*=\s*true|<PublishTrimmed>true</PublishTrimmed>'){throw "Unsafe trimming is forbidden in R8 package path: $p"}}
          $builder=Get-Content packaging/windows/scripts/build-installer-v4.ps1 -Raw
          if(-not$builder.Contains('-p:EnableCompressionInSingleFile=true')){throw 'Bootstrap single-file compression is not enabled'}
          Write-Host 'R8 wording and safe compression strategy: PASS'

      - name: PS5.1 parser gate for exact packaged lifecycle scripts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @('packaging/windows/scripts/setup-windows-components-v5.ps1','packaging/windows/scripts/setup-windows-components-v8.ps1','packaging/windows/scripts/queue-local-slot-adoption-r8.ps1','packaging/windows/scripts/prepare-shell-payload-v4.ps1','packaging/windows/scripts/prepare-shell-payload-v8.ps1','packaging/windows/scripts/build-installer-v4.ps1','packaging/windows/scripts/verify-r8-compiled-core.ps1')){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Resolve-Path $p),[ref]$tokens,[ref]$errors)
            if($errors.Count){$errors|ForEach-Object{Write-Host $_.Message};throw "Windows PowerShell 5.1 parse failed: $p"}
          }
          Write-Host 'PS5.1 R8 package/parser gate: PASS'

      - name: Download exact canonical KEEP component payloads
        uses: actions/download-artifact@v4
        with:
          name: windows-services-1.1.0-canonical-components-r3-baseline
          path: recovered
          github-token: ${{ github.token }}
          repository: mobaraki20/SoknaCafeV3
          run-id: 38982932863

      - name: Prove canonical KEEP bytes before composition
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Sha([string]$p){(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()}
          $checks=@{
            'recovered/runtime/SoknaRuntimeService.exe'='26deed62524278fa93a9a576d958f9177fe97c878b75829a8dc93a1440955afd';
            'recovered/print-worker/Service/Sokna.PrintAgent.Service.exe'='99565602163463e9bce0ca6b33933411635db87a03acaf03340d2a56d9c85ff4';
            'recovered/baseline-maintenance/recovery/SoknaMaintenanceRecoveryConsole.exe'='85989bc8d1096575b0fcfc7d7d55aa999674c20ac8092fd3ea16d90e574c17e9'
          }
          foreach($p in $checks.Keys){if((Sha $p)-ne$checks[$p]){throw "Canonical KEEP drift: $p"}}
          Write-Host 'Runtime 1.0.5 / Print 6.2.9 / Recovery 0.1.1 KEEP bytes: PASS'

      - name: Publish changed R8 and package-owned executables
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $PWD 'out-r8-package'
          New-Item -ItemType Directory -Path "$out/maintenance/app","$out/setup-ui","$out/setup-host" -Force|Out-Null
          dotnet publish windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/maintenance/app"
          if($LASTEXITCODE-ne0){throw 'R8 Supervisor publish failed'}
          dotnet publish windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/maintenance/app"
          if($LASTEXITCODE-ne0){throw 'R8 Update Engine publish failed'}
          dotnet publish packaging/windows/setup-ui/Sokna.SetupUi.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/setup-ui"
          if($LASTEXITCODE-ne0){throw 'Setup UI publish failed'}
          dotnet publish packaging/windows/setup-host-v3/Sokna.SetupHostV3.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$out/setup-host"

      - name: Compose exact R8 durable-adoption shell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $PWD 'out-r8-package'
          ./packaging/windows/scripts/prepare-shell-payload-v8.ps1 `
            -RepoRoot $PWD.Path -OutputRoot "$out/shell" `
            -RuntimeServiceExe (Resolve-Path recovered/runtime/SoknaRuntimeService.exe).Path `
            -SetupHostExe "$out/setup-host/SoknaSetupHost.exe" `
            -SetupUiExe "$out/setup-ui/SoknaSetupUi.exe" `
            -PrintWorkerBundle (Resolve-Path recovered/print-worker).Path `
            -MaintenanceAppBundle "$out/maintenance/app" `
            -MaintenanceRecoveryBundle (Resolve-Path recovered/baseline-maintenance/recovery).Path `
            -GitSha $env:GITHUB_SHA

      - name: Verify R8 shell identity KEEP bytes and transaction boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Sha([string]$p){(Get-FileHash $p -Algorithm SHA256).Hash.ToLowerInvariant()}
          $shell='out-r8-package/shell'
          $checks=@{
            "$shell/_payload/runtime/SoknaRuntimeService.exe"='26deed62524278fa93a9a576d958f9177fe97c878b75829a8dc93a1440955afd';
            "$shell/_payload/print-worker/Service/Sokna.PrintAgent.Service.exe"='99565602163463e9bce0ca6b33933411635db87a03acaf03340d2a56d9c85ff4';
            "$shell/_payload/maintenance/recovery/SoknaMaintenanceRecoveryConsole.exe"='85989bc8d1096575b0fcfc7d7d55aa999674c20ac8092fd3ea16d90e574c17e9'
          }
          foreach($p in $checks.Keys){if((Sha $p)-ne$checks[$p]){throw "Composed KEEP payload drift: $p"}}
          $sv=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$shell/_payload/maintenance/app/SoknaMaintenanceSupervisor.exe")).FileVersion
          $ev=[Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$shell/_payload/maintenance/app/SoknaMaintenanceUpdateEngine.exe")).FileVersion
          if(-not$sv.StartsWith('0.3.5')-or-not$ev.StartsWith('0.3.5')){throw "R8 Maintenance binary version mismatch: $sv / $ev"}
          $wrapper=Get-Content "$shell/setup-windows-components-v4.ps1" -Raw
          $queue=Get-Content "$shell/queue-local-slot-adoption-r8.ps1" -Raw
          if(-not$wrapper.Contains('queue-local-slot-adoption-r8.ps1')){throw 'Packaged wrapper does not target R8 adoption queue'}
          if(Test-Path "$shell/queue-local-slot-adoption-r7.ps1"){throw 'R7 adoption queue leaked into R8 shell'}
          foreach($forbidden in @('control-plane.json','web-adapter.key','X-Sokna-Signature','/v1/local-slots/migrate')){if($queue.Contains($forbidden)){throw "R8 queue regressed to synchronous bootstrap transport: $forbidden"}}
          $pm=Get-Content "$shell/payload-manifest.json" -Raw|ConvertFrom-Json
          if($pm.package_version-ne'1.1.7'){throw 'R8 shell manifest package version mismatch'}
          Write-Host 'R8 shell identity / KEEP / transaction boundary: PASS'

      - name: Smoke-start compressed Supervisor executable
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $PWD 'out-r8-package/supervisor-smoke-data'
          $exe=(Resolve-Path 'out-r8-package/shell/_payload/maintenance/app/SoknaMaintenanceSupervisor.exe').Path
          $p=Start-Process $exe -ArgumentList @('--data-root',$root,'--port','18731') -PassThru -WindowStyle Hidden
          try{
            $deadline=[DateTime]::UtcNow.AddSeconds(20);$ready=$false
            while([DateTime]::UtcNow-lt$deadline){
              if($p.HasExited){throw "Compressed Supervisor exited early: $($p.ExitCode)"}
              if(Test-Path (Join-Path $root 'control-plane.json') -PathType Leaf){$ready=$true;break}
              Start-Sleep -Milliseconds 250
            }
            if(-not$ready){throw 'Compressed Supervisor did not reach descriptor startup smoke gate'}
          } finally { try{Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue}catch{} }
          Write-Host 'Compressed Supervisor startup smoke: PASS'

      - name: Build compressed Windows Services 1.1.7 installer
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./packaging/windows/scripts/build-installer-v4.ps1 -ShellPayloadRoot (Resolve-Path 'out-r8-package/shell').Path -RepoRoot $PWD.Path

      - name: Size gate and package qualification evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $r6=[long]337893632
          $r7=[long]243323059
          $installer=Get-Item 'packaging/windows/installer/out-v4/SOKNA-Windows-Services-Setup-1.1.7.exe'
          $build=Get-Content 'packaging/windows/installer/out-v4/INSTALLER_BUILD.json' -Raw|ConvertFrom-Json
          $current=[long]$installer.Length
          if($current-ge$r6){throw "R8 package lost the safe size reduction. R6=$r6 R8=$current"}
          $saved=$r6-$current
          $pct=[Math]::Round(($saved*100.0)/$r6,2)
          $deltaR7=$current-$r7
          $shell='out-r8-package/shell'
          $rows=@()
          foreach($item in @(
            @{name='runtime';path="$shell/_payload/runtime/SoknaRuntimeService.exe"},
            @{name='print-service';path="$shell/_payload/print-worker/Service/Sokna.PrintAgent.Service.exe"},
            @{name='maintenance-supervisor';path="$shell/_payload/maintenance/app/SoknaMaintenanceSupervisor.exe"},
            @{name='maintenance-engine';path="$shell/_payload/maintenance/app/SoknaMaintenanceUpdateEngine.exe"},
            @{name='recovery-console';path="$shell/_payload/maintenance/recovery/SoknaMaintenanceRecoveryConsole.exe"},
            @{name='setup-ui';path="$shell/SoknaSetupUi.exe"},
            @{name='setup-host';path="$shell/SoknaSetupHost.exe"})){
            $f=Get-Item $item.path
            $rows += [ordered]@{name=$item.name;size_bytes=[long]$f.Length;sha256=(Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()}
          }
          [ordered]@{
            format='sokna-windows-services-r8-package-qualification-v1';
            package_version='1.1.7';source_git_sha=$env:GITHUB_SHA;
            prior_r6_size_bytes=$r6;prior_r7_size_bytes=$r7;r8_size_bytes=$current;r8_minus_r7_bytes=$deltaR7;saved_vs_r6_bytes=$saved;reduction_vs_r6_percent=$pct;
            installer_sha256=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant();
            core_size_bytes=[long]$build.embedded_core_size_bytes;shell_payload_size_bytes=[long]$build.shell_payload_size_bytes;
            runtime_print_recovery_carried_forward_exact=$true;publish_trimmed=$false;single_file_compression=$true;inno_compression='lzma2/ultra64+solid';
            php_junction_root_regression_gated=$true;sibling_release_namespace='Web.release.*';
            components=$rows;generated_at_utc=[DateTime]::UtcNow.ToString('o')
          }|ConvertTo-Json -Depth 8|Set-Content 'out-r8-package/R8_PACKAGE_QUALIFICATION.json' -Encoding utf8
          Write-Host "R6_BYTES=$r6"
          Write-Host "R7_BYTES=$r7"
          Write-Host "R8_BYTES=$current"
          Write-Host "R8_MINUS_R7_BYTES=$deltaR7"
          Write-Host "REDUCTION_VS_R6_PERCENT=$pct"

      - name: Install built Core into isolated root and verify every packaged byte
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          ./packaging/windows/scripts/verify-r8-compiled-core.ps1 `
            -CorePath 'packaging/windows/installer/out-v4/core/SOKNA-Windows-Services-Core-1.1.7.exe' `
            -SourceManifest 'out-r8-package/shell/payload-manifest.json' `
            -EvidencePath 'out-r8-package/R8_COMPILED_CORE_VERIFICATION.json'

      - name: Upload R8 qualified package candidate and evidence
        uses: actions/upload-artifact@v4
        with:
          name: windows-services-1.1.7-r8-qualified-candidate
          path: |
            packaging/windows/installer/out-v4/SOKNA-Windows-Services-Setup-1.1.7.exe
            packaging/windows/installer/out-v4/INSTALLER_BUILD.json
            out-r8-package/R8_PACKAGE_QUALIFICATION.json
            out-r8-package/R8_COMPILED_CORE_VERIFICATION.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
