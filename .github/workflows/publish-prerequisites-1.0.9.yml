name: Publish SOKNA Prerequisites 1.0.9
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-prerequisites-1.0.9.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: prerequisites-v1.0.9
      TARGET_SHA: 95ddea7b3421bf7f5f97170c0f79e8889194c8ba
      RUN_ID: "36496678914"
      ARTIFACT_NAME: sokna-prerequisites-1.0.9-qualified-95ddea7b3421bf7f5f97170c0f79e8889194c8ba
    steps:
      - name: Download exact qualified artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/artifact dist/release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist/artifact
          cp dist/artifact/SOKNA-Prerequisites-Setup-1.0.9.exe dist/release/
          cp dist/artifact/artifact-index.json dist/release/SOKNA-Prerequisites-1.0.9-artifact-index.json
          (cd dist/release && sha256sum SOKNA-Prerequisites-Setup-1.0.9.exe > SHA256SUMS.txt)

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/release/*               --repo "$GITHUB_REPOSITORY"               --target "$TARGET_SHA"               --title "SOKNA Prerequisites 1.0.9"               --notes "Fixes the Apache-vs-CLI PHP extension mismatch seen in Local Web Browser Setup. php.ini now uses an absolute extension_dir, php_zip.dll is enabled, and the final health gate probes the PHP runtime through real Apache HTTP and requires pdo, pdo_mysql, json, mbstring, sodium, zlib, zip and session. Existing SOKNA infrastructure is detected and Repair is selected automatically. The outer installer now detects an installed Prerequisites version, presents an explicit upgrade flow, and safely closes the running old UI before replacement. Qualified with locked PHP 8.2.34 + Apache 2.4.68 and current Local Web: Browser Setup preflight reported every required extension available. Also qualified by installing 1.0.8, leaving its UI open, then upgrading to 1.0.9 without the previous code-5 file-lock failure. These regressions are now permanent G7 gates."
          fi
