name: A23 Public full host recovery
on:
  push:
    branches: [qa/a23-recovery-lifecycle-20261128]
    paths: ['.github/workflows/sokna-a23-public-host-recovery.yml']
permissions:
  contents: read
  actions: read
jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        mariadb: ['11.4']
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: sokna-disposable-public-clean-ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-A21-EXACT-CANDIDATES-QA-NOT-INSTALL
          run-id: 46122453416
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/delivery
      - name: Exact factory bytes and isolated Apache PHP
        run: |
          set -euo pipefail
          sudo install -d -o "$(id -un)" -g "$(id -gn)" -m 0755 /var/www/sokna-public-clean-canary
          python3 - <<'PY'
          import zipfile,pathlib,os,hashlib,shutil,json
          t=pathlib.Path(os.environ['RUNNER_TEMP'])/'delivery'
          p=t/'PUBLIC-A21-CLEAN-CANDIDATE-QA-ONLY.zip'
          c=json.loads((t/'factory-build-receipt.json').read_text())['public'];assert hashlib.sha256(p.read_bytes()).hexdigest()==c['clean_sha256']
          root=pathlib.Path('/var/www/sokna-public-clean-canary')
          for sub in ['root/webroot']:
              dest=root/sub;dest.mkdir(parents=True,exist_ok=False)
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None;z.extractall(dest)
          shutil.copyfile(t/'factory-build-receipt.json',root/'contract.json')
          PY
          sudo apt-get update -qq
          sudo apt-get install -y apache2 libapache2-mod-php8.3 php8.3-cli php8.3-mysql php8.3-zip php8.3-mbstring php8.3-curl mariadb-client
          sudo a2enmod rewrite headers php8.3
          sudo chown -R www-data:www-data /var/www/sokna-public-clean-canary
          for row in '18080 root'; do
            read -r port name <<< "$row"
            doc="/var/www/sokna-public-clean-canary/$name/webroot"
            printf 'Listen 127.0.0.1:%s\n<VirtualHost 127.0.0.1:%s>\nDocumentRoot %s\n<Directory %s>\nOptions FollowSymLinks\nAllowOverride All\nRequire local\n</Directory>\n</VirtualHost>\n' "$port" "$port" "$doc" "$doc" | sudo tee "/etc/apache2/conf-enabled/sokna-ci-$name.conf" >/dev/null
          done
          sudo apache2ctl configtest
          sudo service apache2 restart
      - name: Seed exact 35jc Public before full host recovery
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/delivery"
          python3 - <<'PY'
          import urllib.request,urllib.error,http.cookiejar,json,pathlib,hashlib,os,subprocess
          work=pathlib.Path('/var/www/sokna-public-clean-canary');c=json.loads((work/'contract.json').read_text())['public'];rows=[]
          for port,name,base in [(18080,'root','')]:
              origin=f'http://127.0.0.1:{port}{base}'
              web=work/name/'webroot'/base.lstrip('/')
              op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
              def get(path):
                  with op.open(origin+path,timeout=20) as r:return r.status,r.read(),r.headers
              def post(action,body,want=200):
                  req=urllib.request.Request(origin+'/setup/api.php?action='+action,json.dumps(body).encode(),{'Content-Type':'application/json'})
                  try:
                      with op.open(req,timeout=45) as r:code=r.status; data=json.load(r)
                  except urllib.error.HTTPError as e:code=e.code;data=json.load(e)
                  assert code==want,(name,action,code,data.get('code'))
                  return data
              code,_,hdr=get('/__sokna_route_probe__');assert code==204 and hdr.get('X-Sokna-Route-Probe')=='ok'
              code,html,_=get('/setup/index.php');assert code==200 and b'<!doctype html>' in html.lower()
              _,raw,_=get('/setup/api.php?action=status');j=json.loads(raw);assert j['success'] and not j['setup']['installed'] and j['setup']['base_path']==base and j['preflight']['ok']
              body={'csrf':j['csrf'],'db':{'host':'127.0.0.1','port':'3306','name':'sokna_ci_'+name,'user':'root','pass':'sokna-disposable-public-clean-ci'},'create_database':True,'routing_probe_ok':True,'owner_password':'disposable-owner-CI-only-20261126','emergency_password':'disposable-emergency-CI-only-20261126','storage_dir':'storage'}
              installed=post('install',body);assert installed['success'] and installed['installed'] and installed['owner_initialized'] and not installed['paired']
              _,raw,_=get('/setup/api.php?action=status');s=json.loads(raw);assert s['setup']['installed'] and s['setup']['state']=='ready_to_pair'
              assert post('install',body,409)['code']=='already_installed'
              pair=post('pair',{'pairing_code':installed['pairing_code'],'installation_id':'sokna-ci-'+name,'shared_secret':'disposable-CI-pair-secret-only-0123456789','display_name':'QA only'})
              assert pair['success'] and pair['paired']
              _,raw,_=get('/health');h=json.loads(raw)
              assert h['ok'] and h['database']=='ready' and h['applied_migrations']==h['catalog_migrations']==12 and h['pending_migrations']==0 and h['emergency_ready'] and h['version']==c['target'],(name,h)
              assert all(hashlib.sha256((web/n).read_bytes()).hexdigest()==sha for n,sha in c['protected'].items())
              # Fresh install must contain no historical update transaction or fence.
              state=web/'storage/routine-update-v2/state.json'
              if subprocess.run(['sudo','-u','www-data','test','-f',str(state)]).returncode==0:
                  st=json.loads(subprocess.check_output(['sudo','-u','www-data','cat',str(state)]));assert st.get('db_forward_fence') is None and st.get('pending_verification') is None and st.get('activation_journal') is None
              assert subprocess.run(['sudo','-u','www-data','test','-f',str(web/'storage/maintenance.lock')]).returncode==1
              assert h['routine_update']['active_version']==c['target'] and not h['routine_update']['pending_verification']
              # Pairing alone deliberately does not publish a guest menu.
              try:
                  get('/menu')
                  raise AssertionError('Unpublished menu unexpectedly available')
              except urllib.error.HTTPError as e:
                  assert e.code==503 and 'منوی عمومی هنوز منتشر نشده' in e.read().decode('utf-8'),(name,e.code)
              # Exercise the real signed Local publish API with synthetic data only.
              import time,hmac,secrets
              snapshot={'format':'sokna-guest-snapshot-v1','cafe_name':'SOKNA-QA-CANARY','categories':[{'id':1,'name':'QA Category'}],'items':[{'id':1,'category_id':1,'name':'SOKNA-QA-ITEM','price':1000,'available':True}]}
              envelope={'format':'sokna-guest-snapshot-v1','snapshot':snapshot,'media_manifest':[]}
              digest=hashlib.sha256(json.dumps(envelope,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
              payload={'snapshot':snapshot,'media_manifest':[],'content_hash':digest,'revision_id':'guest-'+digest[:32],'generated_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'authority_epoch':1}
              raw=json.dumps(payload,separators=(',',':'),ensure_ascii=False).encode()
              route='/api/v1/local/guest/publish';ts=str(int(time.time()));nonce=secrets.token_hex(16)
              signing='\n'.join(['sokna-relay-v1','POST',route,ts,nonce,hashlib.sha256(raw).hexdigest()])
              sig=hmac.new(b'disposable-CI-pair-secret-only-0123456789',signing.encode(),hashlib.sha256).hexdigest()
              req=urllib.request.Request(origin+route,raw,{'Content-Type':'application/json','X-Sokna-Installation':'sokna-ci-'+name,'X-Sokna-Timestamp':ts,'X-Sokna-Nonce':nonce,'X-Sokna-Signature':sig})
              try:
                  with op.open(req,timeout=30) as response:
                      p=json.load(response);assert response.status==200 and p['ok'] is True,(name,p)
              except urllib.error.HTTPError as e:
                  raise AssertionError((name,'signed publish',e.code,e.read().decode('utf-8')[:500]))
              code,html,_=get('/menu');assert code==200 and b'SOKNA-QA-ITEM' in html,(name,code)
              rows.append({'layout':base or '/','setup':True,'pairing':True,'duplicate_install_rejected':True,'db_migrations':12,'unpublished_menu_http_503':True,'signed_publish':True,'menu_http_200':True,'emergency_ready':True,'protected_files_unchanged':6})
              print('PASS actual Apache setup pairing and menu',name,base or '/')
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          src=p/'delivery/PUBLIC-A21-CLEAN-CANDIDATE-QA-ONLY.zip'
          b=src.read_bytes();assert hashlib.sha256(b).hexdigest()==c['clean_sha256']
          (p/'delivery/public-clean-receipt.json').write_text(json.dumps({'status':'PASS_EXACT_CONTROLLED_CLEAN_HTTP','sha256':c['clean_sha256'],'version':c['target'],'layouts':rows,'old_host_update_authorized':False,'production_cafe_authorized':False,'actual_home_install_verified':False,'requires_empty_separate_path_and_db':True},indent=2))
          PY
      - name: Quiesced full snapshot and restore into distinct host paths and database
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/a23-public-host"
          mkdir -m 700 "$W"
          export W
          python3 - <<'PY'
          import os,pathlib,subprocess,json,hashlib,shutil,urllib.request,urllib.error,time,hmac,secrets
          assert os.environ['GITHUB_ACTIONS']=='true' and os.environ['RUNNER_OS']=='Linux'
          W=pathlib.Path(os.environ['W']);home=pathlib.Path('/var/www/sokna-public-clean-canary');old=home/'root/webroot';new=home/'restored-host/webroot';priv=home/'restored-host/private-owner'
          assert old.is_dir() and not new.exists()
          def run(*cmd,**kw):return subprocess.check_output(cmd,**kw)
          def sql(q,db=None,user='root',password='sokna-disposable-public-clean-ci'):
              args=['mariadb','--protocol=tcp','-h','127.0.0.1','-P','3306','-u',user,'--batch','--skip-column-names']
              if db:args.append(db)
              return run(*args,'-e',q,env=os.environ|{'MYSQL_PWD':password})
          def cfg(path):
              return json.loads(run('sudo','-u','www-data','php','-r','echo json_encode(require $argv[1], JSON_THROW_ON_ERROR);',str(path/'config.php')))
          c=cfg(old);assert c['db']['name']=='sokna_ci_root' and c['app']['default_installation_id']=='sokna-ci-root'
          oldpriv=pathlib.Path(c['security']['move_owner_private_dir']).resolve();oldstorage=pathlib.Path(c['app']['storage_dir']).resolve()
          assert not oldpriv.is_relative_to(old) and oldpriv.is_dir() and oldstorage.is_relative_to(old)
          # A real queued Public-only order relay row, deliberately not processed. No claim of Local delivery.
          sql("""INSERT INTO realtime_requests(installation_id,request_id,request_hash,kind,actor_projection_id,envelope_json,state,expires_at) VALUES('sokna-ci-root','qa-a23-pending-001',REPEAT('a',64),'guest.order','guest','{}','queued',UTC_TIMESTAMP()+INTERVAL 1 DAY)""",'sokna_ci_root')
          subprocess.run(['sudo','service','apache2','stop'],check=True)
          # Only the isolated CI application was a writer. Snapshot full schema, records and web/private files.
          dump=W/'public.sql';args=['mariadb-dump','--protocol=tcp','-h','127.0.0.1','-P','3306','-u','root','--single-transaction','--quick','--hex-blob','--skip-comments','sokna_ci_root']
          with dump.open('wb') as f:subprocess.run(args,env=os.environ|{'MYSQL_PWD':'sokna-disposable-public-clean-ci'},stdout=f,check=True)
          assert dump.stat().st_size>0
          archive=W/'full-files.tar';subprocess.run(['sudo','tar','-cf',str(archive),'-C',str(old),' .'.strip()],check=True)
          ownerarchive=W/'private-owner.tar';subprocess.run(['sudo','tar','-cf',str(ownerarchive),'-C',str(oldpriv),'.'],check=True)
          def digest(path):return run('sudo','sha256sum',str(path)).decode().split()[0]
          snapshots={'db_dump_sha256':digest(dump),'files_sha256':digest(archive),'private_owner_sha256':digest(ownerarchive)}
          subprocess.run(['sudo','mkdir','-p',str(new),str(priv)],check=True)
          subprocess.run(['sudo','tar','-xf',str(archive),'-C',str(new)],check=True)
          subprocess.run(['sudo','tar','-xf',str(ownerarchive),'-C',str(priv)],check=True)
          # Hash every original and recovered byte before adjusting environment-specific configuration.
          def tree(path):
              return run('sudo','python3','-c','import pathlib,sys,hashlib,json; p=pathlib.Path(sys.argv[1]); print(json.dumps({f.relative_to(p).as_posix():hashlib.sha256(f.read_bytes()).hexdigest() for f in sorted(p.rglob("*")) if f.is_file() and not f.is_symlink()},sort_keys=True))',str(path))
          assert tree(old)==tree(new) and tree(oldpriv)==tree(priv)
          sql("CREATE DATABASE sokna_ci_a23_recovered CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER 'a23_recovered'@'%' IDENTIFIED BY 'disposable-a23-recovery-db-only'; GRANT ALL PRIVILEGES ON sokna_ci_a23_recovered.* TO 'a23_recovered'@'%';")
          with dump.open('rb') as f:subprocess.run(['mariadb','--protocol=tcp','-h','127.0.0.1','-P','3306','-u','a23_recovered','sokna_ci_a23_recovered'],env=os.environ|{'MYSQL_PWD':'disposable-a23-recovery-db-only'},stdin=f,check=True)
          # Confirm rows and schema exact before starting any writer.
          checks=['SELECT COUNT(*) FROM schema_migrations','SELECT installation_id,authority_epoch,authority_state FROM installations','SELECT request_id,request_hash,state FROM realtime_requests ORDER BY id','SELECT COUNT(*) FROM guest_publish_revisions','SELECT COUNT(*) FROM public_move_owner_accounts','SELECT COUNT(*) FROM installation_pairing_secrets']
          for q in checks:assert sql(q,'sokna_ci_root')==sql(q,'sokna_ci_a23_recovered'),q
          assert b'qa-a23-pending-001' in sql(checks[2],'sokna_ci_a23_recovered')
          denied=subprocess.run(['mariadb','--protocol=tcp','-h','127.0.0.1','-P','3306','-u','a23_recovered','sokna_ci_root','-e','SELECT COUNT(*) FROM installations'],env=os.environ|{'MYSQL_PWD':'disposable-a23-recovery-db-only'},capture_output=True)
          assert denied.returncode!=0
          c['db'].update(name='sokna_ci_a23_recovered',user='a23_recovered',**{'pass':'disposable-a23-recovery-db-only'})
          c['app']['storage_dir']=str(new/oldstorage.relative_to(old));c['security']['move_owner_private_dir']=str(priv)
          # Keep the same external origin and identity; only environment-specific paths and DB credential change.
          p=subprocess.run(['sudo','-u','www-data','php','-r','file_put_contents($argv[1],"<?php return ".var_export(json_decode(stream_get_contents(STDIN),true,512,JSON_THROW_ON_ERROR),true).";\\n", LOCK_EX);',str(new/'config.php')],input=json.dumps(c).encode(),check=True)
          assert cfg(new)==c
          conf=pathlib.Path('/etc/apache2/conf-enabled/sokna-ci-root.conf')
          v=run('sudo','cat',str(conf)).decode();assert str(old) in v
          subprocess.run(['sudo','tee',str(conf)],input=v.replace(str(old),str(new)).encode(),stdout=subprocess.DEVNULL,check=True)
          subprocess.run(['sudo','apache2ctl','configtest'],check=True)
          subprocess.run(['sudo','service','apache2','start'],check=True)
          origin='http://127.0.0.1:18080'
          def get(path):
              with urllib.request.urlopen(origin+path,timeout=30) as r:return r.read()
          h=json.loads(get('/health'));assert h['ok'] and h['database']=='ready' and h['applied_migrations']==12 and h['pending_migrations']==0 and h['emergency_ready']
          assert b'SOKNA-QA-ITEM' in get('/menu')
          state=json.loads(get('/setup/api.php?action=status'));assert state['setup']['paired'] and state['setup']['installation_id']=='sokna-ci-root'
          # Prove unchanged pairing secret remains functional through signed API on restored host.
          snapshot={'format':'sokna-guest-snapshot-v1','cafe_name':'A23-RECOVERY','categories':[{'id':1,'name':'QA Category'}],'items':[{'id':1,'category_id':1,'name':'SOKNA-A23-RESTORED-ITEM','price':1000,'available':True}]}
          envelope={'format':'sokna-guest-snapshot-v1','snapshot':snapshot,'media_manifest':[]}
          digest2=hashlib.sha256(json.dumps(envelope,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          data={'snapshot':snapshot,'media_manifest':[],'content_hash':digest2,'revision_id':'guest-'+digest2[:32],'generated_at':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'authority_epoch':1}
          raw=json.dumps(data,separators=(',',':'),ensure_ascii=False).encode();route='/api/v1/local/guest/publish';ts=str(int(time.time()));nonce=secrets.token_hex(16)
          sign='\n'.join(['sokna-relay-v1','POST',route,ts,nonce,hashlib.sha256(raw).hexdigest()]);sig=hmac.new(b'disposable-CI-pair-secret-only-0123456789',sign.encode(),hashlib.sha256).hexdigest()
          req=urllib.request.Request(origin+route,raw,{'Content-Type':'application/json','X-Sokna-Installation':'sokna-ci-root','X-Sokna-Timestamp':ts,'X-Sokna-Nonce':nonce,'X-Sokna-Signature':sig})
          with urllib.request.urlopen(req,timeout=30) as response:assert response.status==200 and json.load(response)['ok']
          assert b'SOKNA-A23-RESTORED-ITEM' in get('/menu')
          assert b'SOKNA-QA-ITEM' not in get('/menu')
          assert sql(checks[2],'sokna_ci_root')==sql(checks[2],'sokna_ci_a23_recovered')
          assert sql(checks[3],'sokna_ci_root')!=sql(checks[3],'sokna_ci_a23_recovered')
          out={'status':'PASS','source_sha256':'641e70ebc45da13eaf538f93cdd7a50567b75109135b24b8fc7573b0349e5402','synthetic_only':True,'actual_apache':True,'actual_mariadb':True,'source_writers_stopped':True,'new_paths_and_db':True,'same_origin_identity':True,'web_and_private_tree_exact':True,'pending_public_only_retained':True,'signed_publish_after_restore':True,'old_database_not_written':True,'actual_host_control_panel':False,'external_dns_tls':False,**snapshots}
          (W/'public-host-restore-receipt.json').write_text(json.dumps(out,indent=2));print('PASS full Public synthetic host recovery on new paths and DB')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-A23-PUBLIC-HOST-RECOVERY-EVIDENCE
          path: ${{ runner.temp }}/a23-public-host/public-host-restore-receipt.json
          if-no-files-found: warn
          retention-days: 30
