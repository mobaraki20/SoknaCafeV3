name: Final UAT Package Freeze

on:
  pull_request:
    branches:
      - work/q3-final-uat-public-pairing-fix-20261002
    paths:
      - '.github/workflows/final-uat-package-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11565d8e527b4928498ef0b77a4744c065a36545
          fetch-depth: 1
      - name: Verify source and release contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "11565d8e527b4928498ef0b77a4744c065a36545"
          python3 tests/g6-component-release-contract.py
          python3 tests/g6-release-preflight.py
          python3 tests/component-registry-gate.py
          php tests/local-g3-public-reenroll-pure-selftest.php
      - name: Build and verify web packages
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/sokna-final-uat-web"
          mkdir -p "$OUT"
          LOCAL_VERSION="$(tr -d '\r\n' < apps/local-web/VERSION.txt)"
          PUBLIC_VERSION="$(tr -d '\r\n' < apps/public/VERSION.txt)"
          python3 apps/local-web/tools/build-clean-install-package.py --out "$OUT/SoknaCafeV3-local-web-$LOCAL_VERSION-clean-install.zip" --source-commit "11565d8e527b4928498ef0b77a4744c065a36545"
          python3 apps/local-web/tools/build-update-package.py --out "$OUT/SoknaCafeV3-local-web-$LOCAL_VERSION-update.zip" --source-commit "11565d8e527b4928498ef0b77a4744c065a36545"
          python3 apps/public/tools/build-deploy-package.py --out "$OUT/SoknaCafeV3-public-edge-$PUBLIC_VERSION-deploy.zip" --source-commit "11565d8e527b4928498ef0b77a4744c065a36545"
          python3 apps/public/tools/build-update-package.py --out "$OUT/SoknaCafeV3-public-edge-$PUBLIC_VERSION-update.zip" --source-commit "11565d8e527b4928498ef0b77a4744c065a36545"
          cp release/compatibility-v2.json "$OUT/compatibility-v2.json"
          cp release/manual-uat-status.json "$OUT/manual-uat-status.json"
          OUT="$OUT" SOURCE_COMMIT="11565d8e527b4928498ef0b77a4744c065a36545" python3 - <<'PY'
          import hashlib,json,os,zipfile
          from pathlib import Path
          out=Path(os.environ["OUT"]); source=os.environ["SOURCE_COMMIT"]; rows=[]
          for p in sorted(out.glob("*.zip")):
              sha=hashlib.sha256(p.read_bytes()).hexdigest()
              with zipfile.ZipFile(p) as z:
                  names=set(z.namelist())
                  mname="sokna-install-manifest.json" if "sokna-install-manifest.json" in names else "manifest.json"
                  m=json.loads(z.read(mname))
              if m.get("source_commit")!=source: raise SystemExit(f"{p.name}: source_commit mismatch")
              rows.append({"file":p.name,"size_bytes":p.stat().st_size,"sha256":sha,"component":m.get("component"),"version":m.get("version"),"format":m.get("format"),"source_commit":m.get("source_commit")})
          if len(rows)!=4: raise SystemExit(f"expected 4 web packages, got {len(rows)}")
          idx={"format":"sokna-final-uat-web-freeze-v1","schema_version":1,"source_commit":source,"artifacts":rows}
          (out/"artifact-index.json").write_text(json.dumps(idx,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          (out/"SHA256SUMS.txt").write_text("".join(f"{x['sha256']}  {x['file']}\n" for x in rows),encoding="utf-8")
          print(json.dumps(idx,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sokna-final-uat-web-11565d8e527b4928498ef0b77a4744c065a36545
          path: ${{ runner.temp }}/sokna-final-uat-web/
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11565d8e527b4928498ef0b77a4744c065a36545
          fetch-depth: 1
      - name: Verify source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head-ne'11565d8e527b4928498ef0b77a4744c065a36545'){throw "Unexpected source HEAD: $head"}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build exact-source Windows Services
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path .).Path
          $out=Join-Path $env:RUNNER_TEMP 'sokna-final-uat-windows'
          $iscc=@("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","$env:ProgramFiles\Inno Setup 6\ISCC.exe")|Where-Object{$_ -and (Test-Path -LiteralPath $_ -PathType Leaf)}|Select-Object -First 1
          if(-not $iscc){throw 'Inno Setup 6 ISCC.exe was not found.'}
          & release/build-windows-release.ps1 -RepoRoot $root -OutputRoot $out -IsccExe $iscc
          $index=Get-Content (Join-Path $out 'artifact-index.json') -Raw|ConvertFrom-Json
          if([string]$index.source_commit-ne'11565d8e527b4928498ef0b77a4744c065a36545'){throw "source_commit mismatch: $($index.source_commit)"}
          $exe=Join-Path $out ([string]$index.windows_services.file)
          $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha-ne[string]$index.windows_services.sha256){throw 'Windows installer SHA256 mismatch.'}
          [ordered]@{format='sokna-final-uat-windows-freeze-v1';schema_version=1;source_commit='11565d8e527b4928498ef0b77a4744c065a36545';file=[IO.Path]::GetFileName($exe);sha256=$sha;size_bytes=(Get-Item $exe).Length}|ConvertTo-Json|Set-Content (Join-Path $out 'uat-windows-index.json') -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: sokna-final-uat-windows-11565d8e527b4928498ef0b77a4744c065a36545
          path: |
            ${{ runner.temp }}/sokna-final-uat-windows/SOKNA-Windows-Services-Setup-*.exe
            ${{ runner.temp }}/sokna-final-uat-windows/artifact-index.json
            ${{ runner.temp }}/sokna-final-uat-windows/uat-windows-index.json
          if-no-files-found: error
          retention-days: 30

  prerequisites:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 11565d8e527b4928498ef0b77a4744c065a36545
          fetch-depth: 1
      - name: Verify source and prerequisites contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          if($head-ne'11565d8e527b4928498ef0b77a4744c065a36545'){throw "Unexpected source HEAD: $head"}
          python tests/g7-infrastructure-prerequisites-gate.py
          if($LASTEXITCODE-ne0){throw 'G7 prerequisites gate failed.'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build exact-source Prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path .).Path
          $out=Join-Path $env:RUNNER_TEMP 'sokna-final-uat-prerequisites'
          & packaging/prerequisites/scripts/build-installer.ps1 -RepoRoot $root -OutputRoot $out
          $idx=Get-Content (Join-Path $out 'installer\artifact-index.json') -Raw|ConvertFrom-Json
          $exe=Join-Path $out ('installer\'+[string]$idx.file)
          $sha=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if($sha-ne[string]$idx.sha256){throw 'Prerequisites SHA256 mismatch.'}
          [ordered]@{format='sokna-final-uat-prerequisites-freeze-v1';schema_version=1;source_commit='11565d8e527b4928498ef0b77a4744c065a36545';version=[string]$idx.version;file=[string]$idx.file;sha256=$sha;size_bytes=(Get-Item $exe).Length}|ConvertTo-Json|Set-Content (Join-Path $out 'installer\uat-prerequisites-index.json') -Encoding UTF8
      - uses: actions/upload-artifact@v4
        with:
          name: sokna-final-uat-prerequisites-11565d8e527b4928498ef0b77a4744c065a36545
          path: |
            ${{ runner.temp }}/sokna-final-uat-prerequisites/installer/SOKNA-Prerequisites-Setup-*.exe
            ${{ runner.temp }}/sokna-final-uat-prerequisites/installer/artifact-index.json
            ${{ runner.temp }}/sokna-final-uat-prerequisites/installer/uat-prerequisites-index.json
          if-no-files-found: error
          retention-days: 30
