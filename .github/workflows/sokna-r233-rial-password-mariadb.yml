name: SOKNA R233 opt-in rial and encrypted Public account Local password MariaDB QA
on:
  push:
    branches: [qa/sokna-r233-rial-public-account-20261115]
    paths:
      - 'qa/sokna-r233/**'
      - '.github/workflows/sokna-r233-rial-password-mariadb.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  r225-exact-source-real-http:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: r225-disposable-only
        ports:
          - 3306:3306
    env:
      SOKNA_R225_DISPOSABLE_ONLY: 'YES'
      SOKNA_R231_DISPOSABLE_ONLY: 'YES'
      SOKNA_R232_DISPOSABLE_ONLY: 'YES'
      SOKNA_R233_DISPOSABLE_ONLY: 'YES'
      SOKNA_R213_DISPOSABLE_ONLY: 'YES'
      SOKNA_R213_DB_PASSWORD: r225-disposable-only
      SOKNA_R213_ADMIN_PASSWORD: only-in-r225-disposable-ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql,mbstring,curl,gd,zip,fileinfo,sodium
          coverage: none
      - name: Wait for disposable MariaDB
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if php -r 'try{new PDO("mysql:host=127.0.0.1;port=3306","root",getenv("SOKNA_R213_DB_PASSWORD"));exit(0);}catch(Throwable $e){exit(1);}' ; then exit 0;fi
            sleep 2
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: R204-EXACT-SOURCE-AND-MANIFEST-READY-FOR-WINDOWS
          run-id: 43513196061
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r204-parent
      - name: Reconstruct and prove EXACT 591-file R225 Local source from pinned R204 artifact
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/r225";mkdir -p "$R/outer" "$R/web"
          ARCHIVE=$(find "$RUNNER_TEMP/r204-parent" -type f -name 'SOKNA-R204-LOCAL-231FB-61BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip' -print -quit)
          test -n "$ARCHIVE"
          echo "279d64dcf3800a764c3fcf751a0fc800857de501943af32428c87cc8db2539a3  $ARCHIVE" | sha256sum -c -
          unzip -q "$ARCHIVE" -d "$R/outer"
          unzip -q "$R/outer/artifacts/local/web.zip" -d "$R/web"
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r222/R204-to-R222-exact-cumulative.patch.gz.b64" | gzip -d > "$R/r222.patch"
          echo "56ab7c800a3b0a14c869374095806e4bac821c92647a26d78309b125edb083c5  $R/r222.patch" | sha256sum -c -
          (cd "$R/web" && git init -q && git config core.autocrlf false && git apply --check "$R/r222.patch" && git apply "$R/r222.patch")
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r225/R222-to-R224-exact.patch.gz.b64" | gzip -d > "$R/r224.patch"
          echo "1ee11d6fb244a59dc9fecc3685317c6c0688ea8623d6560fd2bf6db0bd32d38e  $R/r224.patch" | sha256sum -c -
          (cd "$R/web" && git apply --check "$R/r224.patch" && git apply "$R/r224.patch")
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r225/R224-to-R225-clean-setup.patch.gz.b64" | gzip -d > "$R/r225.patch"
          echo "4d05e072c1a06c1319c6e20e4f583ac654b1138ec51c2522b033e8bf95b46985  $R/r225.patch" | sha256sum -c -
          (cd "$R/web" && git apply --check "$R/r225.patch" && git apply "$R/r225.patch")
          python3 - "$R/web" <<'PY'
          import pathlib,hashlib,sys
          p=pathlib.Path(sys.argv[1]);files={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and '.git' not in f.parts}
          digest=hashlib.sha256(''.join(x+':'+files[x]+'\n' for x in sorted(files)).encode()).hexdigest()
          assert len(files)==591,(len(files),digest)
          assert digest=='e0217a5d0004b13301ae058b2a17c79402ae1b0c3dcc424cab804bd3abc4d721',digest
          print('PASS_R225_EXACT_591_FILE_R225_SOURCE_TREE')
          PY
          echo "SOKNA_R213_WEB=$R/web" >> "$GITHUB_ENV"
      - name: EXACT R230 cumulative Local from immutable R225 and baseline photographed cancel failure
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/r225"
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r231/R225-to-R230.patch.gz.b64" | gzip -d > "$R/r230.patch"
          echo "49dc365bf643bec64c5257a010f76a4edd2967cefff8702bc5984b1fe53ec708  $R/r230.patch" | sha256sum -c -
          (cd "$R/web" && git apply --check "$R/r230.patch" && git apply "$R/r230.patch")
          python3 - "$R/web" <<'PY'
          import pathlib,hashlib,sys
          p=pathlib.Path(sys.argv[1]);files={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and '.git' not in f.parts}
          digest=hashlib.sha256(''.join(x+':'+files[x]+'\n' for x in sorted(files)).encode()).hexdigest()
          assert len(files)==591 and digest=='4a64105f2122e79730fb7b1bf9e82ce868a5b4d98a7ae06f3355304e77ff8bca',(len(files),digest)
          pathlib.Path(__import__('os').environ['RUNNER_TEMP'],'r231-expected-source-files.json').write_text(__import__('json').dumps(sorted(files)))
          print('PASS_R231_EXACT_R230_BASELINE_591_FILES')
          PY
      - name: Real MariaDB BrowserSetup and reproduce original R230 inventory_pending cancellation
        shell: bash
        run: |
          set -euo pipefail
          php qa/sokna-r225/setup_r213_disposable.php
          php qa/sokna-r231/test_r231_cancel_mariadb.php baseline
      - name: Apply ONLY safe R231 inventory cancellation patch and exact source proof
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/r225"
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r231/R230-to-R231.patch.gz.b64" | gzip -d > "$R/r231.patch"
          echo "346adb091e0dc7994db81dfd7a88066a902ba48119485116b5e6a38ad761edec  $R/r231.patch" | sha256sum -c -
          (cd "$R/web" && git apply --check "$R/r231.patch" && git apply "$R/r231.patch")
          python3 - "$R/web" "$GITHUB_WORKSPACE/qa/sokna-r231/R231-SOURCE-HASHES.json" <<'PY'
          import pathlib,hashlib,sys,json
          p=pathlib.Path(sys.argv[1]);target=json.loads(pathlib.Path(sys.argv[2]).read_text())
          all_files={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and '.git' not in f.parts}
          expected=set(json.loads(pathlib.Path(__import__('os').environ['RUNNER_TEMP'],'r231-expected-source-files.json').read_text()))
          assert expected<=set(all_files),(sorted(expected-set(all_files)))
          files={x:all_files[x] for x in expected}
          extra=sorted(set(all_files)-expected)
          print('R231_INSTALLATION_CREATED_AUXILIARY_FILES',extra)
          digest=hashlib.sha256(''.join(x+':'+files[x]+'\n' for x in sorted(files)).encode()).hexdigest()
          assert len(files)==target['file_count'] and digest==target['tree_sha256'],(len(files),digest)
          print('PASS_R231_EXACT_591_FILE_SOURCE_BOTH_ORDER_AND_INVENTORY_FIXES')
          PY
          php -l "$R/web/src/Domain/Inventory/InventoryOrderService.php"
          php -l "$R/web/src/Domain/Orders/OrderStaffActionService.php"
      - name: Cancel previously blocked real R230 order after R231 upgrade; test fail-closed tracked/failed/legacy and exact stock reversal
        shell: bash
        run: |
          set -euo pipefail
          php qa/sokna-r231/test_r231_cancel_mariadb.php full
          echo PASS_R231_ALL_REAL_MARIADB_CANCELLATION_REGRESSION_CHECKS
      - name: Apply byte-verifiable R231-to-R232 Local source patch (no change to main or live data)
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/r225"
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r232/R231-or-R230-to-R232-local.patch.gz.b64" | gzip -d > "$R/r232.patch"
          echo "5971d5570d7259f0e38a6453875e9a87581d083c1a83ed83ccc9db49c2f1f3eb  $R/r232.patch" | sha256sum -c -
          (cd "$R/web" && git apply --check "$R/r232.patch" && git apply "$R/r232.patch")
          python3 - "$R/web" <<'PY'
          import pathlib,hashlib,sys,json,os
          p=pathlib.Path(sys.argv[1])
          expected=set(json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'r231-expected-source-files.json').read_text()))
          files={x:hashlib.sha256((p/x).read_bytes()).hexdigest() for x in expected}
          digest=hashlib.sha256(''.join(x+':'+files[x]+'\n' for x in sorted(files)).encode()).hexdigest()
          assert len(files)==591 and digest=='7da46924681b40500e3f63e0f1ce6593d925426ff3d3126c0916415221c3fdca',(len(files),digest)
          print('PASS_R232_EXACT_CUMULATIVE_591_FILE_LOCAL_SOURCE')
          PY
      - name: Real MariaDB tests 56 archived items, permanent category deletion safety, five featured rank Public publication
        shell: bash
        run: |
          set -euo pipefail
          php -l qa/sokna-r232/test_r232_catalog_mariadb.php
          php qa/sokna-r232/test_r232_catalog_mariadb.php
          echo PASS_R232_REAL_MARIADB_FEATURED_AND_ARCHIVE_DONE
      - name: Apply exact R232-to-R233 cumulative Local patch and real MySQL password/settings QA
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/r225"
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r233/R232-to-R233-local.patch.gz.b64" | gzip -d > "$R/r233.patch"
          echo "f36d4fae3ec4925b76f3b9248fa7f5d027115239519e5c32b8a4ee55784e1f7a  $R/r233.patch" | sha256sum -c -
          (cd "$R/web" && git apply --check "$R/r233.patch" && git apply "$R/r233.patch")
          python3 - "$R/web" "$GITHUB_WORKSPACE/qa/sokna-r233/R233-SOURCE-INTEGRITY.json" <<'PY'
          import pathlib,hashlib,sys,json,os
          p=pathlib.Path(sys.argv[1]);j=json.loads(pathlib.Path(sys.argv[2]).read_text())['local']
          files={str(x.relative_to(p)):hashlib.sha256(x.read_bytes()).hexdigest() for x in p.rglob('*') if x.is_file() and '.git' not in x.parts and x.name!='.sokna-installation.json'}
          digest=hashlib.sha256(''.join(n+':'+files[n]+'\n' for n in sorted(files)).encode()).hexdigest()
          assert len(files)==j['after_files'] and digest==j['source_tree_sha256'],(len(files),digest)
          print('PASS_R233_EXACT_'+str(len(files))+'_LOCAL_SOURCE_FILES')
          PY
          php -l "$R/web/src/Relay/AccountPasswordRealtimeAdapter.php"
          php -l "$R/web/src/Domain/Admin/AdminControlService.php"
          php qa/sokna-r233/test_r233_real_mariadb.php
          echo PASS_R233_DISPOSABLE_MARIADB_ACCOUNT_AND_CURRENCY

      - name: Reconstruct full 233-file Public R233 from pinned R220 exact subset and hash all bytes
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/r233-public"
          mkdir -p "$P"
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r228/R220-PUBLIC-EXACT-HTTP-SERVER-SOURCES.zip.b64" > "$RUNNER_TEMP/r220-165-sources.zip"
          echo "f9392dcfbcbba521bf6f372552080005ba7ff0a94f3369c291090fe8294024a0  $RUNNER_TEMP/r220-165-sources.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/r220-165-sources.zip" -d "$P"
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r233/R220-TO-R233-PUBLIC-EXACT-OVERLAY.zip.b64" > "$RUNNER_TEMP/r233-overlay.zip"
          echo "0acc5a47811b9a9cc65e1484a1dc47eda8a7bcd305964131b3fe6df6d832a6ab  $RUNNER_TEMP/r233-overlay.zip" | sha256sum -c -
          unzip -o -q "$RUNNER_TEMP/r233-overlay.zip" -d "$P"
          python3 - "$P" "$GITHUB_WORKSPACE/qa/sokna-r233/R233-PUBLIC-FULL-SOURCE-HASHES.json" <<'PY'
          import pathlib,json,hashlib,sys
          p=pathlib.Path(sys.argv[1]);m=json.loads(pathlib.Path(sys.argv[2]).read_text())
          paths={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file()}
          assert paths==m,(len(paths),len(m),sorted(set(paths)^set(m)))
          digest=hashlib.sha256(''.join(k+':'+paths[k]+'\n' for k in sorted(paths)).encode()).hexdigest()
          assert len(paths)==233 and digest=='ecb2915c599ba57ed2695fb89b8907046294f797c303f3bb19d6b27b5c84f7d0',digest
          print('PASS_R233_EXACT_FULL_233_FILE_PUBLIC_SOURCE')
          PY
          echo "SOKNA_R228_PUBLIC=$P" >> "$GITHUB_ENV"
          echo "SOKNA_R228_DISPOSABLE_ONLY=YES" >> "$GITHUB_ENV"
      - name: Install full Public R233 with 8 genuine MariaDB migrations and pair to Local
        shell: bash
        run: |
          set -euo pipefail
          php qa/sokna-r228/setup_r228_public.php
          php qa/sokna-r233/seed_r233_public_account.php local-seed
          php qa/sokna-r233/seed_r233_public_account.php public-seed
      - name: Real Public account mobile HTTP, CSRF, encrypted queue, real signed Local relay, Public credential reprojection
        shell: bash
        run: |
          set -euo pipefail
          php -d display_errors=0 -S 127.0.0.1:18082 -t "$SOKNA_R228_PUBLIC" qa/sokna-r228/router_r228_public.php > "$RUNNER_TEMP/r233-http-server.log" 2>&1 &
          P=$!
          trap 'kill $P >/dev/null 2>&1 || true; tail -n 22 "$RUNNER_TEMP/r233-http-server.log" | sed -E "s/(password|token|secret)=[^& ]+/\1=REDACTED/g"' EXIT
          python3 qa/sokna-r233/test_r233_public_account_http.py
          php qa/sokna-r233/seed_r233_public_account.php local-relay
          php qa/sokna-r233/seed_r233_public_account.php public-check
          php qa/sokna-r233/seed_r233_public_account.php local-reproject
          php qa/sokna-r233/seed_r233_public_account.php public-reproject
          echo PASS_R233_FULL_PUBLIC_233_LOCAL_593_SIGNED_HTTP_MOBILE_PASSWORD_MARIADB