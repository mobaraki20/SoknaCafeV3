name: SOKNA Batch N real quantity refund reconciliation
on:
  push:
    branches: [qa/sokna-consolidated-release-factory-20261124]
    paths: ['.github/workflows/sokna-request-n-refund.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        test: [rounding, tax, report, cancel]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable-batch-f-ci
          MARIADB_DATABASE: sokna_ci_batch_f2
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, zip, curl, gd
      - uses: actions/download-artifact@v4
        with:
          name: C2-FROZEN-DO-NOT-INSTALL
          run-id: 45388554736
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Apply exact source correction on immutable C2 payload (QA only)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          echo '3f5860ffbc30fa718b68709d89780ae56d3898fb9cc100157580d98d9ca2b2f9  frozen/LOCAL-C2-WEB.zip' | sha256sum -c
          echo '8afa590187f37f8d1ebad66c4764731e5e169f2e47e4c9a3e31f62caaa652aa4  frozen/PUBLIC-C2-WEB.zip' | sha256sum -c
          mkdir local public
          unzip -q frozen/LOCAL-C2-WEB.zip -d local
          unzip -q frozen/PUBLIC-C2-WEB.zip -d public
          python3 - <<'PY'
          import base64,zlib,hashlib,os,pathlib
          b=zlib.decompress(base64.b64decode((pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'qa/sokna-request-d/partial-adjustment.b64').read_bytes()))
          assert hashlib.sha256(b).hexdigest()=='747b837517fd17666d84de76f0fcff354b68f4321d26fa4c82dbcd040237cba5'
          pathlib.Path('d.patch').write_bytes(b)
          PY
          patch -p1 --fuzz=0 < d.patch
          python3 - <<'PY'
          import base64,zlib,hashlib,os,pathlib
          b=zlib.decompress(base64.b64decode((pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'qa/sokna-request-e/closure.b64').read_bytes()))
          assert hashlib.sha256(b).hexdigest()=='cfdce68e2b482b34bb87210d928a0f21d81a60ebd35b2c96654f1251ab63c148'
          pathlib.Path('e.patch').write_bytes(b)
          PY
          patch -p1 --fuzz=0 < e.patch
          python3 - <<'PY'
          import base64,zlib,hashlib,os,pathlib
          b=zlib.decompress(base64.b64decode((pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'qa/sokna-request-f/refund.b64').read_bytes()))
          assert hashlib.sha256(b).hexdigest()=='9146c7ec6229e7e99cbceb5507714a102d789b0d77ee5afd45b6b71eb8fc9d8a'
          pathlib.Path('f.patch').write_bytes(b)
          PY
          patch -p1 --fuzz=0 < f.patch
          python3 - <<'PY'
          import base64,zlib,hashlib,os,pathlib
          b=zlib.decompress(base64.b64decode((pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'qa/sokna-request-f2/closure.b64').read_bytes()))
          assert hashlib.sha256(b).hexdigest()=='5e8764089a9e9a162f341ebc45922c73e6fd8a1139a1b9f24736d5dd10927fcf'
          pathlib.Path('f2.patch').write_bytes(b)
          PY
          patch -p1 --fuzz=0 < f2.patch
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('local/bootstrap.php')
          s=p.read_text()
          a="require_once __DIR__ . '/src/Domain/Reporting/ReportingService.php';"
          assert s.count(a)==1
          for n in ['Reporting/ActivityFilterInput','Reporting/PublicItemSalesSnapshot','Reporting/PublicInvoiceHistorySnapshot','PublicEdge/PublicOperationalActivityProjector']:
              assert n+'.php' not in s
              s=s.replace(a,"require_once __DIR__ . '/src/Domain/"+n+".php';\n"+a)
          p.write_text(s)
          PY
          php -l local/bootstrap.php
          python3 - <<'PY'
          import base64,zlib,hashlib,os,pathlib
          b=zlib.decompress(base64.b64decode((pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'qa/sokna-request-g/discount-credit.b64').read_bytes()))
          assert hashlib.sha256(b).hexdigest()=='fff57d644744cd32b22920840729fc9e9f947ba36b6e85c0bdbf5f8a9a3bbe76'
          pathlib.Path('g.patch').write_bytes(b)
          PY
          patch -p1 --fuzz=0 < g.patch
          python3 - <<'PY'
          import base64,zlib,hashlib,os,pathlib
          b=zlib.decompress(base64.b64decode((pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'qa/sokna-request-i/auth.b64').read_bytes()))
          assert hashlib.sha256(b).hexdigest()=='daa053da2168536aeb2359a7980e48643c78865904a54d187a7bf39d5cf7ea30'
          pathlib.Path('i.patch').write_bytes(b)
          PY
          patch -p1 --fuzz=0 < i.patch
          python3 - <<'PY'
          import pathlib,os,base64,zlib,hashlib
          for name,sha,output in [('qa/sokna-request-l/identity.b64','59352394535b6ae0177cf2ea061973ace62a4fd803108d37add2bab84cd4f659','l.patch'),('qa/sokna-request-m2/effective-grant.b64','03958f52b046f8777bd66b46b372cd4c567812d09b3feeb8018b8d3c8586586b','m.patch')]:
              b=zlib.decompress(base64.b64decode((pathlib.Path(os.environ['GITHUB_WORKSPACE'])/name).read_bytes()))
              assert hashlib.sha256(b).hexdigest()==sha
              pathlib.Path(output).write_bytes(b)
          PY
          patch -p1 --fuzz=0 < l.patch
          patch -p1 --fuzz=0 < m.patch
          python3 - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path('local/src/Domain/Finance/SettlementService.php')
          s=p.read_text()
          old="""                foreach(['gross_amount','discount_amount','taxable_amount','tax_amount'] as $key){$capacity=(int)$line[$key]-$u[$key];$part[$key]=TaxService::proportionalTarget($capacity,$available,$take);}
                          $part['net_amount']=$part['gross_amount']-$part['discount_amount'];$part['final_amount']=$part['net_amount']+$part['tax_amount'];"""
          old=old.replace("\n                          ","\n                ")
          new="""                foreach(['gross_amount','discount_amount','tax_amount'] as $key){$capacity=(int)$line[$key]-$u[$key];$part[$key]=TaxService::proportionalTarget($capacity,$available,$take);}
                          $part['net_amount']=$part['gross_amount']-$part['discount_amount'];
                          // Taxable value is a subset of net, not an independent quantity.
                          // Keep both the credited and remaining taxable portions within their
                          // respective net amounts when discount rounding differs by one unit.
                          $netCapacity=(int)$line['net_amount']-$u['net_amount'];
                          $taxableCapacity=(int)$line['taxable_amount']-$u['taxable_amount'];
                          $taxableMin=max(0,$taxableCapacity-($netCapacity-$part['net_amount']));
                          $taxableMax=min($taxableCapacity,$part['net_amount']);
                          if($taxableMin>$taxableMax)throw new SettlementStateConflict('refund_line_allocation_invalid','سهم مالی برگشت با خط اصلی سازگار نیست.',409);
                          $part['taxable_amount']=max($taxableMin,min($taxableMax,TaxService::proportionalTarget($taxableCapacity,$available,$take)));
                          $part['final_amount']=$part['net_amount']+$part['tax_amount'];"""
          new=new.replace("\n                          ","\n                ")
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='983cbbaaf034c311327db7b5bda0edf388745d1a0f616aebe92ea91558dd79f8'
          PY
          php -l local/src/Domain/Finance/SettlementService.php
          php -l public/src/Auth/AuthProjectionService.php
          php -l public/src/Http/AuthHttpAdapter.php
          php -l local/src/Domain/Admin/AdminControlService.php
          node --check local/public/assets/admin-workspace.js
          php -l local/src/Domain/Finance/FinanceWorkspaceService.php
          node --check public/assets/staff-app/public-invoice-history.js
          node --check local/public/assets/finance-workspace.js
          node --check public/assets/hall-settlement-v32.js
          node --check local/public/assets/hall-settlement-v32.js
          php -l local/src/Domain/Orders/OrderStaffActionService.php
          php -l local/src/Domain/Finance/SettlementService.php
          php -l local/src/Core/Bootstrap.php
          node --check local/public/assets/staff-app/hall-workspace.js
          node --check public/assets/staff-app/hall-workspace.js
      - name: Taxed account, remaining grant and two successive payment stages
        env:
          SOKNA_CI_DB_PASS: disposable-batch-f-ci
        run: |
          set -euo pipefail
          php qa/sokna-final-20261124/test_mariadb_exact_setup.php "$RUNNER_TEMP/local" sokna_ci_batch_f2 setup 0091_verified_purchase_unit_reconciliation
          awk '/^\$tax=/{exit}{print}' qa/sokna-request-m/test_tax_post_grant.php > "$RUNNER_TEMP/test-n.php"
          cat >> "$RUNNER_TEMP/test-n.php" <<'PHP'
          $tax=$core->tax();$tax->createRateVersion(['rate_bps'=>1000,'effective_from'=>''],$user);
          $tax->createItemPolicyVersion(['item_id'=>$item['id'],'policy'=>'inherit_default'],$user);$tax->setEnabled(true,$user);
          $o=$order('ci-n-rounding-order-0001',4);$core->inventoryOrders()->processPending();
          $svc=$core->settlements();$line=$o['lines'][0]['order_item_id'];
          $orderId=(int)$one('SELECT order_id FROM order_items WHERE id=?',[$line]);
          $acc=$svc->account($session);$svc->setDiscount($session,'fixed',40001,$user,$acc['signature']);
          $acc=$svc->account($session);
          $req=['session_id'=>$session,'expected_session_id'=>$session,'expected_remaining_total'=>$acc['remaining_total'],'expected_signature'=>$acc['signature'],'mode'=>'itemized','destination'=>'direct','request_id'=>'ci-n-pay-001','selection'=>[['order_item_id'=>$line,'quantity'=>3]],'print_receipt'=>false];
          $v=$svc->review($req,$user);$amount=(int)$v['total'];$cash=intdiv($amount,3);$req['tenders']=['cash'=>$cash,'pos'=>$amount-$cash];
          $paid=$svc->settle($req,$user);$id=(int)$paid['settlement_id'];
          $original=$rows('SELECT * FROM settlement_records WHERE id=?',[$id]);$lines=$rows('SELECT * FROM settlement_record_lines WHERE settlement_id=?',[$id]);
          $a(count($lines)===1&&(int)$lines[0]['quantity']===3,'three paid units');
          $a((int)$lines[0]['discount_amount']===30001,'uneven discount required '.json_encode($lines));
          $a((int)$lines[0]['taxable_amount']===(int)$lines[0]['net_amount']&&(int)$lines[0]['tax_amount']>0,'taxable net');
          $refund=function($n,$quantities,$preview=false)use($p,$svc,$orderId,$session,$user){$p->beginTransaction();try{$r=$svc->refundOrderPaymentsTx($orderId,$session,'ci-n-refund-00'.$n,'QA quantity credit',$user,$quantities,$preview);$p->commit();return $r;}catch(Throwable $e){$p->rollBack();throw $e;}};
          $quote=$refund(1,[$line=>1],true);$a((int)$one("SELECT COUNT(*) FROM settlement_records WHERE partial_reversal_source_id=?",[$id])===0,'preview no document');
          $first=$refund(1,[$line=>1]);$a($first['quote']===$quote['quote'],'preview quote equals commit');
          $second=$refund(2,[$line=>1]);$third=$refund(3,null);
          $a($first['refunded_total']+$second['refunded_total']+$third['refunded_total']===$amount,'all original payment reconciled');
          $credits=$rows("SELECT l.* FROM settlement_record_lines l JOIN settlement_records r ON r.id=l.settlement_id WHERE r.partial_reversal_source_id=? AND r.status='reversal' ORDER BY r.id",[$id]);
          $a(count($credits)===3,'three reversal lines');
          foreach(['quantity','gross_amount','discount_amount','net_amount','taxable_amount','tax_amount','final_amount'] as $f)$a(array_sum(array_map('intval',array_column($credits,$f)))===(int)$lines[0][$f],'exact aggregate '.$f);
          foreach($credits as $l)$a((int)$l['taxable_amount']<=(int)$l['net_amount']&&(int)$l['net_amount']===(int)$l['gross_amount']-(int)$l['discount_amount'],'line arithmetic');
          foreach(['cash'=>$cash,'pos'=>$amount-$cash] as $t=>$expected)$a((int)$one("SELECT SUM(t.amount) FROM settlement_tender_allocations t JOIN settlement_records r ON r.id=t.settlement_id WHERE r.partial_reversal_source_id=? AND r.status='reversal' AND t.tender_type=?",[$id,$t])===$expected,'exact tender '.$t);
          $a($rows('SELECT * FROM settlement_records WHERE id=?',[$id])===$original&&$rows('SELECT * FROM settlement_record_lines WHERE settlement_id=?',[$id])===$lines,'immutable original');
          $again=$refund(4,null);$a($again['refunded_total']===0&&(int)$one("SELECT COUNT(*) FROM settlement_records WHERE partial_reversal_source_id=?",[$id])===3,'no duplicate credit');
          echo json_encode(['status'=>'PASS','real_database'=>true,'three_reversals'=>true,'uneven_discount'=>true,'taxable_reconciled'=>true,'tenders_reconciled'=>true,'immutable_original'=>true,'no_duplicate'=>true],JSON_THROW_ON_ERROR)."\n";
          
          PHP
          case '${{ matrix.test }}' in
            rounding) php "$RUNNER_TEMP/test-n.php" ;;
            tax) php qa/sokna-request-m/test_tax_post_grant.php ;;
            report) php qa/sokna-request-h/test_report_ledger.php ;;
            cancel) php qa/sokna-request-k/test_cancel_credit.php ;;
            *) exit 1 ;;
          esac
