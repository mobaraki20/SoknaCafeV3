name: continue linux real env audit

on:
  push:
    branches:
      - transfer/v3-final-menu-041db67-helper
    paths:
      - .github/workflows/continue-linux-real-env-audit.yml

permissions:
  contents: read

jobs:
  linux-audit:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: sokna_m2
          MARIADB_USER: sokna
          MARIADB_PASSWORD: sokna
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SOKNA_TEST_DB_HOST: 127.0.0.1
      SOKNA_TEST_DB_PORT: 3306
      SOKNA_TEST_DB_NAME: sokna_m2
      SOKNA_TEST_DB_USER: sokna
      SOKNA_TEST_DB_PASS: sokna
      SOKNA_TEST_DB_ROOT_USER: root
      SOKNA_TEST_DB_ROOT_PASS: root
    steps:
      - uses: actions/checkout@v4

      - name: reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          bundle="${GITHUB_WORKSPACE}/.transfer/soknacafev3-git-041db67ba5fa.bundle"
          dst="${RUNNER_TEMP}/sokna-source"
          rm -rf "$dst"
          mkdir -p "$dst"
          cd "$dst"
          git init
          git config core.autocrlf false
          git fetch "$bundle" refs/heads/transfer-final-menu-041db67:refs/heads/audited
          git checkout audited
          test "$(git rev-parse HEAD)" = "041db67ba5fad1f7492f9b25f3cb74d072fcca5e"

      - name: apply known candidate fixes
        shell: bash
        run: |
          cd "${RUNNER_TEMP}/sokna-source"
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tests/local-mysql-migration-selftest.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace("'0022_g3_public_edge_sync', '0023_g4_guest_content_platform'];","'0022_g3_public_edge_sync', '0023_g4_guest_content_platform', '0024_g4_business_extensions', '0025_g4_print_template_packages'];")
          s=s.replace("'guest_content_config', 'guest_media_assets', 'guest_media_derivatives', 'guest_media_references'] as $table)","'guest_content_config', 'guest_media_assets', 'guest_media_derivatives', 'guest_media_references', 'marketing_campaigns', 'marketing_events', 'notification_preferences', 'notification_push_subscriptions', 'notification_outbox', 'notification_inbox', 'print_template_packages', 'print_template_activations'] as $table)")
          p.write_text(s,encoding='utf-8',newline='\n')

          p=Path('tests/local-f1-staff-operational-integration-selftest.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace("$core->migrations()->migrate();$pdo=$core->database();","$core->migrations()->migrate();$pdo=$core->database();$businessDate=(string)$core->businessClock()->assignment()['business_date'];",1)
          s=s.replace("'occurred_at'=>'2026-09-27 12:00:00'","'occurred_at'=>$businessDate.' 12:00:00'",1)
          p.write_text(s,encoding='utf-8',newline='\n')

          p=Path('apps/local-web/src/Domain/Printing/PrintTemplatePackageService.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace('u.name created_by_name','u.display_name created_by_name',1)
          p.write_text(s,encoding='utf-8',newline='\n')

          p=Path('tests/g3-remote-staff-publisher-selftest.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace("===6,'remote models missing');","===7,'remote models missing');$modelKeys=$pp->query(\"SELECT model_key FROM remote_read_models WHERE installation_id='{$installation}' ORDER BY model_key\")->fetchAll(PDO::FETCH_COLUMN);g32db($modelKeys===['deferred_context','inventory','inventory_cost','notifications','operations','preparation','reports'],'remote model set drifted');",1)
          p.write_text(s,encoding='utf-8',newline='\n')

          p=Path('apps/public/bootstrap.php')
          s=p.read_text(encoding='utf-8')
          anchor="require_once __DIR__ . '/src/Http/ConnectivityHttpAdapter.php';\n"
          if "RealtimeHttpAdapter.php" not in s:
              s=s.replace(anchor,anchor+"require_once __DIR__ . '/src/Http/RealtimeHttpAdapter.php';\nrequire_once __DIR__ . '/src/Http/DeferredHttpAdapter.php';\n",1)
          p.write_text(s,encoding='utf-8',newline='\n')
          PY

      - name: install php extensions
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y php-mysql php-zip

      - name: run consolidated g4 chain
        shell: bash
        run: |
          cd "${RUNNER_TEMP}/sokna-source"
          ./tests/run-g4-4-product-qualification.sh
