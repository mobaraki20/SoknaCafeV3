name: SOKNA CP150B historical tax and print failure
on:
  push:
    branches: [qa/cp133-marketing-20261126]
    paths: [.github/workflows/sokna-cp150b-history-fault.yml]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout reviewable QA source data
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download pinned Local baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45764512635
          name: SOKNA-CP98-LOCAL-231GG-CONTROLLED-CAFE-OPERATOR
          path: ${{ runner.temp }}/cp148-input/local
      - name: Download pinned Public baseline
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45774034628
          name: SOKNA-CP110-EXACT-35IP-COMPONENT-UPDATE-QA
          path: ${{ runner.temp }}/cp148-input/public
      - name: Verify and apply direct source delta
        run: |
          mkdir -p "$RUNNER_TEMP/cp148-qa"
          python3 qa/cp148/prepare-source.py "$RUNNER_TEMP/cp148-qa" "$RUNNER_TEMP/cp148-input" | tee "$RUNNER_TEMP/cp148-qa/source-results.txt"
      - name: Apply exact CP150 candidate delta
        run: python3 qa/cp150/apply-cp150.py "$RUNNER_TEMP/cp148-qa" | tee -a "$RUNNER_TEMP/cp148-qa/source-results.txt"
      - name: Execute two independent DB groups
        run: |
          set -euo pipefail
          export SOKNA_QA_DISPOSABLE=YES QA_DB_PASSWORD=synthetic-cp116-ci-only
          php qa/cp148/preflight.php
          php qa/cp150b/fixture.php "$RUNNER_TEMP/cp148-qa/local" 2>&1 | tee "$RUNNER_TEMP/cp148-qa/cp150b-results.txt"
      - name: Preserve synthetic QA evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOKNA-CP150B-HISTORY-FAULT-QA
          path: |
            ${{ runner.temp }}/cp148-qa/source-results.txt
            ${{ runner.temp }}/cp148-qa/cp150b-results.txt
            ${{ runner.temp }}/cp148-qa/cp150b-summary.json
          retention-days: 7
          if-no-files-found: warn
