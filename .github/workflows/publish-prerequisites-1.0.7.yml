name: Publish SOKNA Prerequisites 1.0.7
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-prerequisites-1.0.7.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: prerequisites-v1.0.7
      TARGET_SHA: 92beeb7fdc653705cd022cdfcd49d2ed4a63f0fb
      RUN_ID: "36492099257"
    steps:
      - name: Download qualified artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/prereq dist/offline dist/release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sokna-prerequisites-setup-1.0.7" --dir dist/prereq
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sokna-offline-kit-template-1.0.7" --dir dist/offline
          cp dist/prereq/SOKNA-Prerequisites-Setup-1.0.7.exe dist/release/
          cp dist/prereq/artifact-index.json dist/release/SOKNA-Prerequisites-1.0.7-artifact-index.json
          (cd dist/offline && zip -r ../release/SOKNA-Offline-Kit-Template-1.0.7.zip .)
          (cd dist/release && sha256sum SOKNA-Prerequisites-Setup-1.0.7.exe SOKNA-Offline-Kit-Template-1.0.7.zip > SHA256SUMS.txt)
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "SOKNA Prerequisites 1.0.7" \
              --notes "Enables Apache mod_rewrite required by Local Web .htaccess. Qualified with real locked Apache 2.4.68 + PHP 8.2.34 + the current Local Web payload: root returned HTTP 302 to /setup/, /setup/ returned HTTP 200, and the rewritten runtime endpoint did not return HTTP 500. Cross-root and orphaned-service safeguards remain in place. G7, G8, V3 Component Gates and M10 all passed."
          fi
