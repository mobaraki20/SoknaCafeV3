name: Maintenance V4 Protected Publisher Source Tests
on:
  push:
    branches:
      - work/v4-local-publisher-secure-automation-20261021
  pull_request:
    paths:
      - windows/maintenance/tools/Sokna.Maintenance.ReleasePublisher/**
      - .github/workflows/ci-v4-local-publisher-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publisher-synthetic:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build issuer against existing Maintenance Core
        run: dotnet build windows/maintenance/tools/Sokna.Maintenance.ReleasePublisher/Sokna.Maintenance.ReleasePublisher.csproj --configuration Debug
      - name: Ephemeral CI-only P256 verification / negative gates
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check cryptography==46.0.4
          python windows/maintenance/tools/Sokna.Maintenance.ReleasePublisher/test_ephemeral_publisher.py
      - name: Source-only gate; publishing remains disabled
        run: echo "NO PUBLISH; NO TRUST ENROLLMENT; REAL WINDOWS CAFE UAT NOT PERFORMED"
