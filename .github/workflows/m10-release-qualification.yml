name: M10 Release Qualification

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'windows/**'
      - 'platform/**'
      - 'packaging/**'
      - 'contracts/**'
      - 'release/**'
      - 'VERSION.txt'
      - 'tests/m10-release-qualification.py'
      - 'tests/local-m10-release-selftest.php'
      - '.github/workflows/m10-release-qualification.yml'
  push:
    branches: [main, 'architecture/**', 'migration/**']
    paths:
      - 'apps/**'
      - 'windows/**'
      - 'platform/**'
      - 'packaging/**'
      - 'contracts/**'
      - 'release/**'
      - 'VERSION.txt'
      - 'tests/m10-release-qualification.py'
      - 'tests/local-m10-release-selftest.php'
      - '.github/workflows/m10-release-qualification.yml'

permissions: {contents: read}

jobs:
  automated-qualification:
    name: Automated lifecycle + recovery / MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: sokna_m2
          MARIADB_USER: sokna
          MARIADB_PASSWORD: sokna
          MARIADB_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install PDO MySQL when needed
        run: if ! php -m | grep -qi '^pdo_mysql$'; then sudo apt-get update && sudo apt-get install -y php-mysql; fi
      - name: Validate migration stack
        env: &db
          SOKNA_TEST_DB_HOST: 127.0.0.1
          SOKNA_TEST_DB_PORT: '3306'
          SOKNA_TEST_DB_NAME: sokna_m2
          SOKNA_TEST_DB_USER: sokna
          SOKNA_TEST_DB_PASS: sokna
          SOKNA_TEST_DB_ROOT_USER: root
          SOKNA_TEST_DB_ROOT_PASS: root
        run: php tests/local-mysql-migration-selftest.php
      - name: M10 component lifecycle qualification
        run: python3 tests/m10-release-qualification.py
      - name: M10 secure backup, takeover and crash-safe migration qualification
        env: *db
        run: php tests/local-m10-release-selftest.php
      - name: Re-run mature component contracts
        run: |
          python3 tests/scds-m6-gate.py
          python3 tests/m7-runtime-gate.py
          python3 tests/m8-print-agent-gate.py
          python3 tests/m9-packaging-gate.py
          python3 tests/runtime-print-v1-contract.py
          python3 tests/runtime-print-contract-audit.py

  windows-build-and-installer-source:
    name: Windows owners + installer source
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: Build Runtime
        run: dotnet build windows/runtime/source/Sokna.Runtime.Service.csproj -c Release
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Build Print Agent and Setup owners
        run: |
          dotnet build windows/print-agent/source/Sokna.PrintWorker.slnx -c Release
          dotnet publish packaging/windows/setup-host/Sokna.SetupHost.csproj -c Release -o packaging/windows/setup-host/publish
          dotnet publish packaging/windows/setup-ui/Sokna.SetupUi.csproj -c Release -o packaging/windows/setup-ui/publish
      - name: Parse all Windows PowerShell owners
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Get-ChildItem platform/windows,packaging/windows -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){ $errors | ForEach-Object { Write-Error ("$($_.Extent.File): $($_.Message)") }; throw "PowerShell parse failure" }
          }
      - name: Windows PowerShell 5.1 compatibility smoke
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $bad=Get-ChildItem packaging/windows/scripts -Filter *.ps1 | Select-String -SimpleMatch 'IsPathFullyQualified'
          if($bad){ $bad | ForEach-Object { Write-Error $_ }; throw 'Windows PowerShell 5.1-incompatible Path.IsPathFullyQualified usage found.' }
          $data=Join-Path $env:RUNNER_TEMP 'sokna-support-data'
          $out=Join-Path $env:RUNNER_TEMP 'sokna-support-out'
          New-Item -ItemType Directory -Path $data,$out -Force | Out-Null
          & packaging/windows/scripts/collect-support.ps1 -DataRoot $data -OutputRoot $out
          $zip=Get-ChildItem -LiteralPath $out -Filter 'SOKNA-Support-*.zip' -File | Select-Object -First 1
          if(-not $zip){ throw 'Support bundle smoke did not create a ZIP under Windows PowerShell 5.1.' }

      - name: Compile Inno installer source with an isolated fixture payload
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $root=(Resolve-Path .).Path
          $shell=Join-Path $env:RUNNER_TEMP 'sokna-shell-fixture'
          New-Item -ItemType Directory -Path $shell -Force | Out-Null
          Copy-Item packaging/windows/Sokna.ico (Join-Path $shell 'Sokna.ico')
          Set-Content (Join-Path $shell 'SoknaSetupUi.exe') 'fixture'
          Set-Content (Join-Path $shell 'remove-windows-services.ps1') '$true'
          $version=(Get-Content packaging/windows/WINDOWS_SERVICES_VERSION.txt -Raw).Trim()
          [ordered]@{format='sokna-windows-services-shell-v2';schema_version=2;package_version=$version} |
            ConvertTo-Json | Set-Content (Join-Path $shell 'payload-manifest.json') -Encoding UTF8
          & packaging/windows/scripts/build-installer.ps1 -ShellPayloadRoot $shell -RepoRoot $root

      - name: Build qualified Windows Services release artifact
        shell: pwsh
        run: |
          $root=(Resolve-Path .).Path
          $out=Join-Path $root 'release\out-windows'
          $iscc=@(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if(-not $iscc){ throw 'Inno Setup 6 ISCC.exe was not found after qualification setup.' }
          & release/build-windows-release.ps1 -RepoRoot $root -OutputRoot $out -IsccExe $iscc
          Get-ChildItem $out | Format-Table Name,Length,LastWriteTime

      - name: Real Windows SCM lifecycle smoke
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path .).Path
          $shell=Join-Path $root 'release\out-windows\shell'
          $install='C:\Program Files\SOKNA Windows Services CI'
          $data='D:\SOKNA-CI\Data'
          $legacyDefault=Join-Path $env:ProgramData 'SOKNA\print-worker'
          New-Item -ItemType Directory -Path $legacyDefault -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $legacyDefault 'queue.db') -Value 'intentionally-invalid-stale-default'

          # Keep a handle open while another process acquires the named mutex and exits without releasing it.
          # This reproduces the real upgrade/recovery state observed on Windows 10 LTSC.
          $mutexName='Global\SoknaPrintAgentV6Service'
          $keeper=New-Object System.Threading.Mutex($false,$mutexName)
          $childScript='$m=[Threading.Mutex]::OpenExisting("Global\SoknaPrintAgentV6Service");$null=$m.WaitOne();[Environment]::Exit(0)'
          $encoded=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($childScript))
          $child=Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList '-NoProfile','-NonInteractive','-EncodedCommand',$encoded -Wait -PassThru
          if($child.ExitCode-ne0){throw "Failed to seed abandoned Print Agent mutex: $($child.ExitCode)"}

          try {
            & packaging/windows/scripts/setup-windows-services.ps1 -Mode Install -ShellRoot $shell -InstallRoot $install -DataRoot $data -PairingFile '' -StartWhenPaired 0
            $runtime=Get-Service -Name SoknaRuntime -ErrorAction Stop
            $print=Get-Service -Name SoknaPrintWorker -ErrorAction Stop
            $runtime.Dispose();$print.Dispose()
            $expectedExe=Join-Path $install 'Runtime\SoknaRuntimeService.exe'
            $expectedCfg=Join-Path $data 'runtime\runtime-config.json'
            $actualRuntime=[string](Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Services\SoknaRuntime').ImagePath
            if(-not $actualRuntime.StartsWith('"')){throw "Runtime ImagePath executable is not quoted: [$actualRuntime]"}
            if(-not $actualRuntime.Contains($expectedExe)){throw "Runtime ImagePath missing executable: [$actualRuntime]"}
            if(-not $actualRuntime.Contains($expectedCfg)){throw "Runtime ImagePath missing config path: [$actualRuntime]"}
            $expectedPrintRoot=Join-Path $data 'print-worker'
            $actualPrintRoot=[string](Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Sokna\Local\PrintWorker' -Name DataRoot).DataRoot
            if([IO.Path]::GetFullPath($actualPrintRoot)-cne[IO.Path]::GetFullPath($expectedPrintRoot)){throw "Print Agent DataRoot mismatch: [$actualPrintRoot]"}
            $version=(Get-Content packaging/windows/WINDOWS_SERVICES_VERSION.txt -Raw).Trim()
            foreach($exe in @((Join-Path $root 'release\out-windows\SoknaSetupUi.exe'),(Join-Path $root 'release\out-windows\SoknaSetupHost.exe'))){
              $pv=([Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion).Split('+')[0]
              if($pv-ne$version){throw "Setup executable ProductVersion mismatch: $exe => $pv expected $version"}
            }
          } finally {
            try { & packaging/windows/scripts/setup-windows-services.ps1 -Mode Uninstall -ShellRoot $shell -InstallRoot $install -DataRoot $data -PairingFile '' -StartWhenPaired 0 } catch { Write-Warning $_ }
            Remove-Item -LiteralPath $install -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath 'D:\SOKNA-CI' -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $legacyDefault -Recurse -Force -ErrorAction SilentlyContinue
            if($keeper){$keeper.Dispose()}
          }

      - name: Upload qualified Windows Services installer
        uses: actions/upload-artifact@v4
        with:
          name: sokna-windows-services-1.0.7-${{ github.sha }}
          path: |
            release/out-windows/SOKNA-Windows-Services-Setup-1.0.7.exe
            release/out-windows/artifact-index.json
          if-no-files-found: error
          retention-days: 30

  manual-uat-contract:
    name: Manual UAT remains explicit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate explicit manual-UAT blockers
        run: |
          python3 - <<'PY'
          import json
          x=json.load(open('release/manual-uat-status.json',encoding='utf-8'))
          req={'windows_clean_install','physical_thermal_printer','responsive_touch_persian_ime'}
          assert req <= {c['id'] for c in x['checks']}
          assert all(c['status'] in {'pending','passed','failed'} for c in x['checks'])
          print('Manual UAT contract recorded; CI does not fabricate physical-device PASS evidence.')
          PY
