               private function tempPath(string $prefix,string $suffix): string
               {
                   $dir=$this->observability->dataRoot().DIRECTORY_SEPARATOR.'recovery-tmp';if(!is_dir($dir)&&!@mkdir($dir,0700,true)&&!is_dir($dir))throw new RecoveryException('temp_unavailable','فضای موقت بازیابی آماده نیست.',500);
          '@
          $patchPath=Join-Path $lab 'scratch.patch'
          Write-LF $patchPath $patch
          Check-Hash $patchPath 'f7008cbe42c3c3e1c9b4d105d16898aca6541bf15ddf8ab7abb62db417971214'
          & git -C $web apply -p2 --whitespace=nowarn --check $patchPath
          Need ($LASTEXITCODE -eq 0) 'PATCH_CHECK_FAILED'
          & git -C $web apply -p2 --whitespace=nowarn $patchPath
          Need ($LASTEXITCODE -eq 0) 'PATCH_FAILED'
          Check-Hash $class '3a7209987a35ee88734fec66de94e5dd9004762e175ef610348d3c3c77c9b4d3'
          $lock=Get-Content "$env:RUNNER_TEMP/helper/QA-release-lock.json" -Raw|ConvertFrom-Json
          $dep=$lock.artifacts|Where-Object dependency -eq php
          Need ($dep.sha256 -ceq '6df2a5f59f10f08022bede47a26d61c3c16756c54d86aad58503dc8a9d3c25ad') 'PHP_LOCK_DRIFT'
          $zip=Join-Path $lab $dep.filename
          $verified=$false
          foreach($url in @(('https://downloads.php.net/~windows/releases/archives/'+$dep.filename),$dep.source_url)+@($dep.fallback_urls)){
            Remove-Item $zip -ErrorAction SilentlyContinue
            & curl.exe --location --fail --silent --show-error --max-time 90 --output $zip $url
            if($LASTEXITCODE -eq 0 -and (Test-Path $zip) -and (Get-Item $zip).Length -eq $dep.size -and (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ceq $dep.sha256){$verified=$true;break}
          }
          Need $verified 'PINNED_PHP_UNAVAILABLE'
          $pr=Join-Path $lab 'php'
          Expand-Archive $zip $pr
          $ini=Join-Path $pr 'php.ini'
          Copy-Item (Join-Path $pr 'php.ini-production') $ini
          Add-Content $ini ('extension_dir="'+(Join-Path $pr 'ext').Replace('\','/')+'"')
          Add-Content $ini 'extension=sodium'
          $php=Join-Path $pr 'php.exe'
          & $php -c $ini -l $class
          Need ($LASTEXITCODE -eq 0) 'PHP_LINT'
          $test=@'
          <?php
          declare(strict_types=1);
          if(PHP_SAPI!=='cli'||PHP_OS_FAMILY!=='Windows'||getenv('GITHUB_ACTIONS')!=='true'||getenv('SOKNA_R186_CI_ONLY')!=='YES'||count($argv)!==4)exit(2);
          $root=realpath($argv[1]);$src=realpath($argv[3]);if(!$root||!$src||!is_file($root.'/synthetic-only'))exit(2);
          require $src.'/Core/Observability.php';require $src.'/Domain/Recovery/RecoveryException.php';require $src.'/Domain/Recovery/BusinessBackupService.php';
          class NoDB extends PDO{public function __construct(){}}
          $b=new \Sokna\Local\Domain\Recovery\BusinessBackupService(new NoDB(),new \Sokna\Local\Core\Observability($root),'a23-synthetic-only');$pass='synthetic-a23-crash-only';$enc=new ReflectionMethod($b,'encryptFile');$mode=$argv[2];
          if($mode==='prepare'){$gz=gzopen($root.'/plain.gz','wb1');gzwrite($gz,"SYNTHETIC-MARKER\n");for($i=0;$i<256;$i++)gzwrite($gz,random_bytes(1048576));gzclose($gz);$enc->invoke($b,$root.'/plain.gz',$root.'/synthetic.skbf',$pass);unlink($root.'/plain.gz');exit(0);}
          try{
           if($mode==='inspect')$b->inspectEncrypted($root.'/synthetic.skbf',$pass);
           elseif(in_array($mode,['cleanup','hold','reserved'],true)){$m=new ReflectionMethod($b,'acquireReadScratch');$r=$m->invoke($b,$mode==='reserved'?$root.'/recovery-read-scratch-v1/business-inspect-'.str_repeat('f',32).'.ndjson.gz':$root.'/synthetic.skbf');if($mode==='hold'){file_put_contents($r['dir'].'/business-inspect-'.str_repeat('c',32).'.ndjson.gz','synthetic owned scratch');file_put_contents($root.'/hold-ready','ready');sleep(60);}fclose($r['lock']);}
           else exit(2);
           echo "OK\n";
          }catch(\Sokna\Local\Domain\Recovery\RecoveryException $e){echo $e->errorCode.PHP_EOL;exit(3);}catch(Throwable $e){echo get_class($e).': '.$e->getMessage().PHP_EOL;exit(4);}
          '@
          $runner=@'
          import pathlib,subprocess,tempfile,time,json,hashlib,sys,shutil,os
          php,ini,script,src,out=sys.argv[1:]
          root=pathlib.Path(tempfile.mkdtemp(prefix='a23-synthetic-'));(root/'synthetic-only').touch(); rows=[]
          def ck(x,n):
           assert x,n;rows.append(n);print('PASS',n,flush=True)
          def args(mode):return [php,'-c',ini,script,str(root),mode,src]
          def run(mode):return subprocess.run(args(mode),capture_output=True,text=True,timeout=90,cwd=str(pathlib.Path(php).parent))
          def spawn(mode):return subprocess.Popen(args(mode),stdout=subprocess.PIPE,stderr=subprocess.PIPE,cwd=str(pathlib.Path(php).parent))
          def wait_for(fn,proc,seconds):
           end=time.monotonic()+seconds
           while time.monotonic()<end and proc.poll() is None:
            result=fn()
            if result:return result
            time.sleep(.002)
           return None
          try:
           r=run('prepare');ck(r.returncode==0,'encrypted synthetic fixture '+str(r.stdout))
           cipher=root/'synthetic.skbf';digest=hashlib.sha256(cipher.read_bytes()).hexdigest();scratch=root/'recovery-read-scratch-v1';legacy=root/'recovery-tmp';legacy.mkdir();sentinel=legacy/'business-restore-1234567890abcdef.ndjson.gz';sentinel.write_text('preserve')
           hold=spawn('hold')
           try:
            ck(wait_for(lambda:(root/'hold-ready').exists(),hold,20),'real Windows process holds actual scratch lock')
            orphan=scratch/('business-inspect-'+'c'*32+'.ndjson.gz');r=run('cleanup');ck(r.returncode==3 and 'backup_scratch_busy' in r.stdout and orphan.exists(),'active lock refuses concurrent cleanup')
            hold.kill();hold.wait(10);ck(orphan.exists(),'terminated process leaves scratch for next holder')
           finally:
            if hold.poll() is None:hold.kill();hold.wait(10)
           r=run('cleanup');ck(r.returncode==0 and not orphan.exists(),'next exclusive lock cleans abandoned scratch '+r.stdout)
           inspect=spawn('inspect')
           def observed():
            for f in scratch.glob('business-inspect-*.ndjson.gz'):
             try:
              if f.stat().st_size>=1048576:return f
             except FileNotFoundError:pass
            return None
           try:
            f=wait_for(observed,inspect,30);ck(f is not None,'observed actual decrypted scratch in Windows')
            inspect.kill();inspect.wait(10);ck(f.exists(),'real inspect process terminated during plaintext write')
           finally:
            if inspect.poll() is None:inspect.kill();inspect.wait(10)
           other=scratch/'keep.txt';other.write_text('preserve');r=run('reserved');ck(r.returncode==3 and 'invalid_path' in r.stdout and f.exists(),'reserved internal destination rejected')
           r=run('cleanup');ck(r.returncode==0 and not f.exists() and other.read_text()=='preserve' and sentinel.read_text()=='preserve','abandoned decrypted file reclaimed, restore evidence retained')
           ck(hashlib.sha256(cipher.read_bytes()).hexdigest()==digest,'encrypted source unchanged')
           pathlib.Path(out).write_text(json.dumps({'status':'PASS','checks':rows,'actual_windows_process_termination':True,'actual_decryption_interrupted':True,'next_lock_cleanup':True,'real_database_tested':False,'windows_acl_tested':False,'synthetic_only':True},indent=2))
          finally:shutil.rmtree(root,ignore_errors=True)
