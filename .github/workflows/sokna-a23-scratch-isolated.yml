          Expand-Archive $pack $web
          $class=Join-Path $web 'src/Domain/Recovery/BusinessBackupService.php'
          Check-Hash $class 'c2029d1fe5bb8ef11fd3becb3e08537e5c43b25e38d741d11e8f00b6a01e7420'
          $patch=@'
          --- a/local/src/Domain/Recovery/BusinessBackupService.php
          +++ b/local/src/Domain/Recovery/BusinessBackupService.php
          @@ -44,8 +44,9 @@
                   self::requireSodium();
                   self::validatePassphrase($passphrase);
                   $destination=$this->safeDestination($destination);
          -        $tmp=$this->tempPath('business-backup','.ndjson.gz');
