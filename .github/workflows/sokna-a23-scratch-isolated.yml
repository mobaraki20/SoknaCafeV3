          Check-Hash $runnerPath '609777f287a0e0d0a4af0c1a7e8ce5a5058d15f26352c1da6be6b023fa563e8b'
          python $runnerPath $php $ini $testPath (Join-Path $web 'src') (Join-Path $env:RUNNER_TEMP 'a23-windows-scratch-receipt.json') | Tee-Object (Join-Path $env:RUNNER_TEMP 'a23-windows-scratch-log.txt')
