name: CP116 targeted real MariaDB gate (QA only)
on:
  push:
    branches: [qa/cp116-phase01-db-20261126]
    paths: ['.github/workflows/cp116-phase01-db.yml']
permissions:
  contents: read
  actions: read
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
    steps:
      - name: Reconstruct pinned Local source and test fixture
        env:
          GH_TOKEN: ${{ github.token }}
