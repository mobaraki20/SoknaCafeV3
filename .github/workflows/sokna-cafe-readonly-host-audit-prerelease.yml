name: SOKNA Cafe readonly host audit - small prerelease
on:
  push:
    branches:
      - fix/cafe-local-update-readiness-r95-20261103
    paths:
      - packaging/windows/scripts/diagnose-cafe-host-readonly-v1.ps1
      - packaging/windows/scripts/Run-SOKNA-Cafe-Host-Audit.cmd
      - .github/workflows/sokna-cafe-readonly-host-audit-prerelease.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-readonly-qa:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Parse actual release script in Windows PowerShell 5.1
        shell: powershell
        run: |
          $p=(Resolve-Path 'packaging/windows/scripts/diagnose-cafe-host-readonly-v1.ps1').Path
          $t=$null
          $err=$null
          [System.Management.Automation.Language.Parser]::ParseFile($p,[ref]$t,[ref]$err)|Out-Null
          if($err.Count -gt 0){$err|ForEach-Object{Write-Error $_.Message};throw 'PowerShell 5.1 parse failed'}
      - name: Run against exact synthetic drift and verify single ZIP; never modify fixture
        shell: powershell
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'SoknaCafeAuditFixture'
          $web=Join-Path $root 'Web'
          $persistent=Join-Path $root 'LocalWeb/persistent'
          $data=Join-Path $root 'Maintenance'
          $out=Join-Path $root 'output'
          foreach($d in @($web,$persistent,$data,$out,
                (Join-Path $web 'public'),(Join-Path $persistent 'public'),
                (Join-Path $web 'resources'),(Join-Path $data 'operations'))){
            New-Item -ItemType Directory -Path $d -Force|Out-Null
          }
          [IO.File]::WriteAllText((Join-Path $web 'VERSION.txt'),'3.0.0-g6.2-workspace.231bz-test')
          [IO.File]::WriteAllText((Join-Path $web 'public/local-recovery.php'),'verified recovery bytes')
          [IO.File]::WriteAllText((Join-Path $persistent 'public/local-recovery.php'),'verified recovery bytes')
          [IO.File]::WriteAllText((Join-Path $web 'public/local-update-runner.php'),'active local runner')
          [IO.File]::WriteAllText((Join-Path $persistent 'public/local-update-runner.php'),'stale local runner')
          [IO.File]::WriteAllText((Join-Path $web 'resources/local-managed-files-v1.json'), '{"format":"sokna-local-managed-files-v1","files":["VERSION.txt"]}')
          [IO.File]::WriteAllText((Join-Path $data 'installed-release-identity.json'), '{"local":{"version":"3.0.0-g6.2-workspace.231bz-test","managed_tree_sha256":"'+('0'*64)+'"}}')
          [IO.File]::WriteAllText((Join-Path $data 'operations/op-123.json'), '{"operation_type":"update.local-stage","state":"staged","result_code":"STAGED"}')
          $before=@(Get-ChildItem -LiteralPath $web,$persistent,$data -Recurse -File | ForEach-Object{$_.FullName+':'+(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash}) -join '|'
          & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File packaging/windows/scripts/diagnose-cafe-host-readonly-v1.ps1 -InstallRoot $root -DataRoot $data -OutputRoot $out
          if($LASTEXITCODE -ne 0){throw 'Read-only audit failed to execute'}
          $zip=@(Get-ChildItem -LiteralPath $out -Filter 'SOKNA-Host-Audit-*.zip' -File)
          if($zip.Count -ne 1){throw 'Expected one and only one ZIP'}
          $unzipped=Join-Path $env:RUNNER_TEMP 'SoknaAuditExpanded'
          Expand-Archive -LiteralPath $zip[0].FullName -DestinationPath $unzipped -Force
          $r=Get-Content (Join-Path $unzipped 'readiness.json') -Raw|ConvertFrom-Json
          if($r.machine_mutation_performed -ne $false -or
             $r.database_inspected_or_changed -ne $false -or
             $r.identity_version_matches -ne $true -or
             $r.managed_tree_state -ne 'CALCULATED' -or
             $r.overlays[0].state -ne 'MATCH' -or
             $r.overlays[1].state -ne 'DRIFT' -or
             $r.suspected_blockers -notcontains 'PERSISTENT_MACHINE_LOCAL_OVERLAY_DRIFT'){
            throw 'The audit failed to identify the synthetic local-update-runner drift'
          }
          $after=@(Get-ChildItem -LiteralPath $web,$persistent,$data -Recurse -File | ForEach-Object{$_.FullName+':'+(Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash}) -join '|'
          if($before -ne $after){throw 'A supposedly read-only diagnostic changed the fixture!'}
      - name: Pack only verified script and launcher
        shell: powershell
        run: |
          $output=Join-Path $env:RUNNER_TEMP 'sokna-cafe-host-audit-release'
          New-Item -ItemType Directory -Path $output -Force|Out-Null
          Copy-Item packaging/windows/scripts/diagnose-cafe-host-readonly-v1.ps1 $output
          Copy-Item packaging/windows/scripts/Run-SOKNA-Cafe-Host-Audit.cmd $output
          [IO.File]::WriteAllText((Join-Path $output 'README.txt'),
           'Extract ZIP to a folder. Double click Run-SOKNA-Cafe-Host-Audit.cmd. Accept one UAC prompt. Upload ONLY the small SOKNA-Host-Audit ZIP from Desktop. Nothing is installed, backed up, edited or activated. The audit is read-only and partial: suspected blockers are not installation authorization.')
          Compress-Archive -Path (Join-Path $output '*') -DestinationPath (Join-Path $env:RUNNER_TEMP 'SOKNA-Cafe-Host-Audit-ReadOnly-v1.zip') -Force
          Get-FileHash (Join-Path $env:RUNNER_TEMP 'SOKNA-Cafe-Host-Audit-ReadOnly-v1.zip') -Algorithm SHA256|Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: sokna-cafe-host-audit-readonly-v1
          path: ${{ runner.temp }}/SOKNA-Cafe-Host-Audit-ReadOnly-v1.zip
          if-no-files-found: error
  prerelease:
    needs: windows-readonly-qa
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sokna-cafe-host-audit-readonly-v1
          path: dist
      - name: Publish audited small prerelease with a browser-download link
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="sokna-cafe-host-audit-readonly-v1-20261103"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          cat >notes.md <<'NOTES'
          ## SOKNA Cafe — Small read-only host diagnostic (NO Maintenance install)

          For the stalled 231bz -> R94 install where signed Preflight and Stage have already passed but `LOCAL_HOST_PRECONDITIONS_UNPROVEN` still prevents activation.

          Extract ZIP and double-click **Run-SOKNA-Cafe-Host-Audit.cmd**. Accept UAC if asked. It writes ONE small `SOKNA-Host-Audit-...zip` file to Desktop. It does not install components, connect to MariaDB, run Activate, repair files or modify service state.

          This **partial audit** distinguishes the otherwise missing Local overlay/runner, managed tree, identity and junction evidence. It is a diagnostic, NOT an activation permit. Keep existing R94 Stage and do not repeat upload or activation until the exact cause is qualified.

          All Windows QA must pass before the release becomes visible.
          NOTES
          gh release create "$tag" dist/SOKNA-Cafe-Host-Audit-ReadOnly-v1.zip \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "SOKNA Cafe read-only host audit — one small ZIP, no install" \
            --notes-file notes.md --prerelease
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,assets
