          set -euo pipefail
          W="$RUNNER_TEMP/a23-status"
          mkdir -p "$W/public"
          P="$RUNNER_TEMP/candidate/PUBLIC-A21-CLEAN-CANDIDATE-QA-ONLY.zip"
          echo "641e70ebc45da13eaf538f93cdd7a50567b75109135b24b8fc7573b0349e5402  $P" | sha256sum -c
