          github-token: ${{ github.token }}
          run-id: 46122453416
          name: SOKNA-A21-EXACT-CANDIDATES-QA-NOT-INSTALL
          path: ${{ runner.temp }}/candidate
      - name: Verify exact Public archive and prior accepted candidate
