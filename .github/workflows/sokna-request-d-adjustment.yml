name: SOKNA Batch D partial payment order correction MariaDB QA
on:
  push:
    branches: [qa/sokna-consolidated-release-factory-20261124]
    paths: ['.github/workflows/sokna-request-d-adjustment.yml','qa/sokna-request-d/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  actual-db:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable-batch-d-ci
          MARIADB_DATABASE: sokna_ci_batch_d
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, zip, curl, gd
      - uses: actions/download-artifact@v4
        with:
          name: C2-FROZEN-DO-NOT-INSTALL
          run-id: 45388554736
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/frozen
      - name: Apply exact source correction on immutable C2 payload (QA only)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          echo '3f5860ffbc30fa718b68709d89780ae56d3898fb9cc100157580d98d9ca2b2f9  frozen/LOCAL-C2-WEB.zip' | sha256sum -c
          echo '8afa590187f37f8d1ebad66c4764731e5e169f2e47e4c9a3e31f62caaa652aa4  frozen/PUBLIC-C2-WEB.zip' | sha256sum -c
          mkdir local public
          unzip -q frozen/LOCAL-C2-WEB.zip -d local
          unzip -q frozen/PUBLIC-C2-WEB.zip -d public
          python3 - <<'PY'
          import base64,zlib,hashlib,os,pathlib
          b=zlib.decompress(base64.b64decode((pathlib.Path(os.environ['GITHUB_WORKSPACE'])/'qa/sokna-request-d/partial-adjustment.b64').read_bytes()))
          assert hashlib.sha256(b).hexdigest()=='747b837517fd17666d84de76f0fcff354b68f4321d26fa4c82dbcd040237cba5'
          pathlib.Path('d.patch').write_bytes(b)
          PY
          patch -p1 --fuzz=0 < d.patch
          php -l local/src/Domain/Orders/OrderStaffActionService.php
          php -l local/src/Domain/Finance/SettlementService.php
          php -l local/src/Core/Bootstrap.php
          node --check local/public/assets/staff-app/hall-workspace.js
          node --check public/assets/staff-app/hall-workspace.js
      - name: Real ten items, two paid, repeated corrections, stock and final settlement
        env:
          SOKNA_CI_DB_PASS: disposable-batch-d-ci
        run: |
          set -euo pipefail
          php qa/sokna-final-20261124/test_mariadb_exact_setup.php "$RUNNER_TEMP/local" sokna_ci_batch_d setup 0091_verified_purchase_unit_reconciliation
          php qa/sokna-request-d/test_partial_adjustment.php
