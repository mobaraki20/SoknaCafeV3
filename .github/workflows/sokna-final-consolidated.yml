              assert all(state.get(k) is None for k in ('staged','pending_verification','db_forward_fence','activation_journal'))
              for n,d in c['protected'].items():assert hashlib.sha256((root/n).read_bytes()).hexdigest()==d
              health=json.loads(get('/health'));assert health['ok'] and health['applied_migrations']==12 and health['pending_migrations']==0
              print(json.dumps({'status':'PASS','scope':'exact_zip','sha256':sha,'origin':origin,'origin_tree_sha256':c['c2_tree'] if name=='upgrade' else c['older_tree'] if name=='older' else c['current_tree'] if name=='current' else c['latest_tree'] if name=='latest' else '7ed171a36324f41ef51130749b021eaeb40b9f5b43955e1c309a4d155cba41ce','authenticated_emergency_http':True,'layout':sub or '/','protected_files':6,'db_migrations':12}))
          PY
