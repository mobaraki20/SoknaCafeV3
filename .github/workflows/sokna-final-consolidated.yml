              assert pair['success'] and pair['paired']
              _,raw,_=get('/health');health=json.loads(raw);want=c['c2'] if name=='upgrade' else c['baseline'] if name=='browser306' else c['older'] if name=='older' else c['current'] if name=='current' else c['latest'] if name=='latest' else c['target']
              assert health['ok'] and health['database']=='ready' and health['applied_migrations']==health['catalog_migrations']==(12 if name in ('root','sub') else 11) and health['pending_migrations']==0 and health['emergency_ready'] and health['version']==want,(name,health)
              print('PASS actual Apache Setup, pairing and health',name,base or '/')
          PY
      - name: Real Staff account projection and regression fixture using installed databases
        shell: bash
