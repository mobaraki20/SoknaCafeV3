          r=json.loads(os.environ['RESULTS']); result={k:v['result'] for k,v in r.items()}
          pathlib.Path('consolidated-gate.json').write_text(json.dumps({'results':result,'all_technical_gates_pass':all(v=='success' for v in result.values()),'distribution_authorized':False,'deployment_authorized':False,'manual_checks_remaining':['review browser screenshots and content','full Windows clean installer packaging','verify exact admission receipts']},indent=2))
          print(result)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-FINAL-TECHNICAL-DECISION
          path: consolidated-gate.json
