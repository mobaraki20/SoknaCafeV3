name: SOKNA consolidated 231ge 35is exact acceptance
on:
  push:
    branches: [qa/sokna-consolidated-release-factory-20261124]
    paths: ['.github/workflows/sokna-final-consolidated.yml','qa/sokna-final-consolidated/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE
          run-id: 45389831526
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published
      - uses: actions/download-artifact@v4
        with:
          name: C2-FROZEN-DO-NOT-INSTALL
          run-id: 45388554736
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/c2
      - run: python3 qa/sokna-final-consolidated/freeze.py
      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-FINAL-FROZEN-DO-NOT-INSTALL
          path: frozen/*
          if-no-files-found: error
          retention-days: 90
  integration:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        test: [root, subfolder, fixed-initial, fixed-percent, percent-fixed, percent-percent, legacy, mixed, tax, report, subscriber, accommodation, cancel]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable-batch-f-ci
          MARIADB_DATABASE: sokna_ci_batch_f2
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, zip, curl, gd
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-FINAL-FROZEN-DO-NOT-INSTALL
          path: ${{ runner.temp }}/frozen
      - name: Extract exact candidate and validate migration
        env:
          SOKNA_CI_DB_PASS: disposable-batch-f-ci
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local" "$RUNNER_TEMP/public"
          unzip -q "$RUNNER_TEMP/frozen/LOCAL-FINAL-WEB.zip" -d "$RUNNER_TEMP/local"
          unzip -q "$RUNNER_TEMP/frozen/PUBLIC-FINAL-WEB.zip" -d "$RUNNER_TEMP/public"
          php qa/sokna-final-20261124/test_mariadb_exact_setup.php "$RUNNER_TEMP/local" sokna_ci_batch_f2 setup 0093_bundle_distribution_provenance
          python3 - <<'PY'
          import os,pathlib,base64,zlib,hashlib
          t=pathlib.Path(os.environ['RUNNER_TEMP'])
          for k,h in [('q','2e9a964ef24f861101409e8cc5558e9b3c95d03ea26cc78a929d7b198dd00421'),('r','459314b2a25a9cba4a63f9cdcb9d37a0c1748dd83d8a97bdd4359aac2ed0a248'),('y','1037eb87de539186ed44cba1adc2f311b5950075c888f462481af3787d5e61ca')]:
              b=zlib.decompress(base64.b64decode(pathlib.Path('qa/sokna-request-'+k+'/scenario.b64').read_bytes()))
              assert hashlib.sha256(b).hexdigest()==h
              (t/('scenario-'+k+'.php')).write_bytes(b)
          PY
      - name: Business and auth acceptance on same frozen bytes
        env:
          SOKNA_CI_DB_PASS: disposable-batch-f-ci
          SOKNA_Z_MODE: ${{ matrix.test }}
          SOKNA_Z_ROUTER: ${{ github.workspace }}/qa/sokna-request-z/router.php
        run: |
          set -euo pipefail
          awk '/^\$tax=/{exit}{print}' qa/sokna-request-m/test_tax_post_grant.php > "$RUNNER_TEMP/test-o.php"
          case '${{ matrix.test }}' in
            root|subfolder) php qa/sokna-final-consolidated/auth-setup.php; cat qa/sokna-final-consolidated/auth-scenario.php >> "$RUNNER_TEMP/test-o.php"; php "$RUNNER_TEMP/test-o.php" ;;
            cancel) php qa/sokna-request-k/test_cancel_credit.php ;;
            mixed) tail -n +2 "$RUNNER_TEMP/scenario-q.php" >> "$RUNNER_TEMP/test-o.php"; SOKNA_Q_MODE=mixed SOKNA_P_SCOPE=all SOKNA_O_GRANT_TYPE=fixed php "$RUNNER_TEMP/test-o.php" ;;
            tax) php qa/sokna-request-m/test_tax_post_grant.php ;;
            report) php qa/sokna-request-h/test_report_ledger.php ;;
            subscriber|accommodation) tail -n +2 "$RUNNER_TEMP/scenario-r.php" >> "$RUNNER_TEMP/test-o.php"; SOKNA_R_MODE='${{ matrix.test }}' php "$RUNNER_TEMP/test-o.php" ;;
            *) tail -n +2 "$RUNNER_TEMP/scenario-y.php" >> "$RUNNER_TEMP/test-o.php"; SOKNA_X_MODE='${{ matrix.test }}' php "$RUNNER_TEMP/test-o.php" ;;
          esac
  native:
    needs: freeze
    name: native-${{ matrix.origin }}-${{ matrix.fault }}
    runs-on: windows-2022
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {origin: R301, fault: none, run: '44561325048', artifact: SOKNA-R301-LOCAL-CONTROLLED-INSTALL-EXACT-ARTIFACT, file: SOKNA-R301-LOCAL-231FS-PUBLIC-MOVE-CONTROLLED-INSTALL.zip}
          - {origin: R304, fault: none, run: '44639218881', artifact: SOKNA-R304-EXACT-CANDIDATES-REQUIRE-ONSITE-PREFLIGHT, file: SOKNA-R304-LOCAL-231FU-NATIVE-CANDIDATE-NOT-FIELD.zip}
          - {origin: R306, fault: none, run: '44723958829', artifact: SOKNA-R306-EXACT-LOCAL-PUBLIC-CANDIDATES-PREFLIGHT, file: SOKNA-R306-LOCAL-231FV-CONTROLLED-PREFLIGHT.zip}
          - {origin: R307, fault: none, run: '44730988488', artifact: SOKNA-R307-LOCAL-231FW-EXACT-CANDIDATE, file: SOKNA-R307-LOCAL-231FW-FROM-231FV-CONTROLLED-PREFLIGHT.zip}
          - {origin: R3, fault: none, run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: APACHE_STOPPED, run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: DATABASE_BACKUP_VERIFIED, run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: DATABASE_FORWARD_INTENT, run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: POINTER_SWITCHED, run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: COMMITTED, run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: C2, fault: none, run: '45389831526', artifact: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE, file: SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip}
          - {origin: C2, fault: APACHE_STOPPED, run: '45389831526', artifact: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE, file: SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip}
          - {origin: C2, fault: DATABASE_BACKUP_VERIFIED, run: '45389831526', artifact: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE, file: SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip}
          - {origin: C2, fault: DATABASE_FORWARD_INTENT, run: '45389831526', artifact: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE, file: SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip}
          - {origin: C2, fault: POINTER_SWITCHED, run: '45389831526', artifact: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE, file: SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip}
          - {origin: C2, fault: COMMITTED, run: '45389831526', artifact: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE, file: SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip}
    env:
      SOKNA_R186_CI_ONLY: 'YES'
      SOKNA_BASE_LEDGER: ${{ matrix.origin == 'C2' && '91' || matrix.origin == 'R3' && '90' || '83' }}
      SOKNA_ORIGIN: ${{ matrix.origin }}
      SOKNA_FAULT: ${{ matrix.fault }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: qa/sokna-r278-rial-persistent-settings-20261118
          path: native-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-FINAL-FROZEN-DO-NOT-INSTALL
          path: ${{ runner.temp }}/current
      - name: Build byte-identical quarantined candidate and test real native engine
        shell: pwsh
        env:
          BASE_NAME: ${{ matrix.file }}
        run: |
          $ErrorActionPreference='Stop'
          $base=Get-ChildItem "$env:RUNNER_TEMP/baseline" -Recurse -Filter $env:BASE_NAME | Select-Object -First 1
          $target=Get-ChildItem "$env:RUNNER_TEMP/current" -Recurse -Filter 'LOCAL-FINAL-FROZEN.zip' | Select-Object -First 1
          if(!$base -or !$target){throw 'PINNED_ARCHIVE_NOT_PRESENT'}
          $env:SOKNA_BASELINE_ZIP=$base.FullName
          $env:SOKNA_CURRENT_QA_ZIP=$target.FullName
          python qa/sokna-final-consolidated/prepare_native.py
          if($LASTEXITCODE-ne0){throw 'NATIVE_MATRIX_PREPARATION_FAILED'}
          $env:SOKNA_MATRIX_TARGET_ZIP=$target.FullName
          python packaging/windows/release-gates/check_local_release_set.py $env:SOKNA_MATRIX_TARGET_ZIP --require-installable
          if($LASTEXITCODE-ne0){throw 'NATIVE_MATRIX_FORMAT_FAILED'}
          Push-Location native-src
          try {
            & (Join-Path $env:RUNNER_TEMP 'native-matrix.ps1')
            if($LASTEXITCODE-ne0){throw 'NATIVE_MATRIX_EXECUTION_FAILED'}
          } finally {Pop-Location}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SOKNA-FINAL-NATIVE-${{ matrix.origin }}-${{ matrix.fault }}-RECEIPT
          path: ${{ runner.temp }}/matrix-receipt.json
          if-no-files-found: error
          retention-days: 90
  local-clean:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable-local-clean-ci
          MARIADB_DATABASE: sokna_ci_clean_browser
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=25
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-FINAL-FROZEN-DO-NOT-INSTALL
