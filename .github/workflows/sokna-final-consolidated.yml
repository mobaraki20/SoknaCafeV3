  decision:
    if: always()
    needs: [freeze, integration, native, local-clean, public-host-gate]
    runs-on: ubuntu-24.04
    steps:
      - name: Admission evidence only; no automatic production deployment
        env:
          RESULTS: ${{ toJSON(needs) }}
