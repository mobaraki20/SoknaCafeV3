name: M5 Inventory Gate

on:
  pull_request:
    paths:
      - 'apps/local-web/**'
      - 'apps/public/src/Deferred/**'
      - 'tests/local-m5-inventory-selftest.php'
      - 'tests/local-mysql-migration-selftest.php'
      - 'docs/migration/M5_INVENTORY_AUDIT_FA.md'
      - '.github/workflows/m5-inventory-gate.yml'
  push:
    branches:
      - main
      - 'architecture/**'
      - 'migration/**'
    paths:
      - 'apps/local-web/**'
      - 'apps/public/src/Deferred/**'
      - 'tests/local-m5-inventory-selftest.php'
      - 'tests/local-mysql-migration-selftest.php'
      - 'docs/migration/M5_INVENTORY_AUDIT_FA.md'
      - '.github/workflows/m5-inventory-gate.yml'

permissions:
  contents: read

jobs:
  inventory:
    name: Inventory Ledger + Count + Deferred / MariaDB
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: sokna_m2
          MARIADB_USER: sokna
          MARIADB_PASSWORD: sokna
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - name: Ensure PDO MySQL is available
        run: |
          if ! php -m | grep -qi '^pdo_mysql$'; then
            sudo apt-get update
            sudo apt-get install -y php-mysql
          fi
      - name: Syntax-check M5.5 owners
        run: |
          php -l apps/local-web/src/Domain/Inventory/InventoryException.php
          php -l apps/local-web/src/Domain/Inventory/InventoryService.php
          php -l apps/local-web/src/Domain/Inventory/InventoryCountService.php
          php -l apps/local-web/src/Domain/Inventory/InventoryOrderService.php
          php -l apps/local-web/src/Relay/InventoryDeferredAdapter.php
      - name: Validate ordered Local migration stack
        env: &db
          SOKNA_TEST_DB_HOST: 127.0.0.1
          SOKNA_TEST_DB_PORT: '3306'
          SOKNA_TEST_DB_NAME: sokna_m2
          SOKNA_TEST_DB_USER: sokna
          SOKNA_TEST_DB_PASS: sokna
        run: php tests/local-mysql-migration-selftest.php
      - name: Validate Inventory ledger/count/deferred semantics
        env: *db
        run: php tests/local-m5-inventory-selftest.php
