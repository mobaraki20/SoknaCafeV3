name: Publish SOKNA Prerequisites 1.0.10
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/publish-prerequisites-1.0.10.yml'
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: prerequisites-v1.0.10
      TARGET_SHA: 02789f13abcd60a591ae5ff0ca005344f6b71a9a
      RUN_ID: "36498914835"
      ARTIFACT_NAME: sokna-prerequisites-1.0.10-qualified-02789f13abcd60a591ae5ff0ca005344f6b71a9a
    steps:
      - name: Download exact qualified artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/artifact dist/release
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT_NAME" --dir dist/artifact
          cp dist/artifact/SOKNA-Prerequisites-Setup-1.0.10.exe dist/release/
          cp dist/artifact/artifact-index.json dist/release/SOKNA-Prerequisites-1.0.10-artifact-index.json
          (cd dist/release && sha256sum SOKNA-Prerequisites-Setup-1.0.10.exe > SHA256SUMS.txt)
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title "SOKNA Prerequisites 1.0.10" \
              --notes "Fixes legacy php.ini upgrades where multiple extension_dir directives could leave Apache PHP using a trailing relative ext value even after Repair. Repair now canonicalizes extension_dir to exactly one absolute path, verifies the effective PHP value, and preserves all required Local Web extensions. Qualified against a deliberately dirty legacy php.ini with multiple extension_dir entries: real Apache + current Browser Setup preflight passed with pdo_mysql, mbstring, sodium and zip available. Also qualified by upgrading from 1.0.9 while the old UI was open."
          fi
