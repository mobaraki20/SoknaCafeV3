name: Publish Windows Services 1.1.4 R5 Pre-release
# Promotion trigger for exact qualified R5 artifact; no rebuild.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-windows-services-1.1.4-r5-prerelease.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact qualified artifact
        uses: actions/download-artifact@v4
        with:
          name: SOKNA-Windows-Services-1.1.4-R5-Qualified
          path: qualified
          github-token: ${{ github.token }}
          repository: mobaraki20/SoknaCafeV3
          run-id: 38993058522

      - name: Verify exact qualified installer and evidence
        shell: bash
        run: |
          set -euo pipefail
          exe="$(find qualified -type f -name 'SOKNA-Windows-Services-Setup-1.1.4.exe' -print -quit)"
          evidence="$(find qualified -type f -name 'R5_QUALIFICATION.json' -print -quit)"
          sums="$(find qualified -type f -name 'SHA256SUMS.txt' -print -quit)"
          test -n "$exe" && test -f "$exe"
          test -n "$evidence" && test -f "$evidence"
          test -n "$sums" && test -f "$sums"
          actual="$(sha256sum "$exe" | awk '{print $1}')"
          expected='f3cfe6eb105888534dee7b6ea18dac3b95a9d0f4fec7688a93c088c01b1998cf'
          test "$actual" = "$expected"
          python - "$evidence" <<'PY'
          import json,sys
          j=json.load(open(sys.argv[1],encoding='utf-8-sig'))
          assert j['package_version']=='1.1.4'
          assert j['maintenance']=='0.3.2'
          assert j['update_engine']=='0.3.2'
          assert j['runtime']=='1.0.5'
          assert j['print_agent']=='6.2.9'
          assert j['recovery_console']=='0.1.1'
          assert j['installer_sha256']=='f3cfe6eb105888534dee7b6ea18dac3b95a9d0f4fec7688a93c088c01b1998cf'
          assert j['database_mutation'] is False and j['public_mutation'] is False and j['windows_reboot'] is False
          assert j['dynamic_apache_health'] is True and j['baseline_http_before_mutation'] is True
          PY
          cp "$exe" ./SOKNA-Windows-Services-Setup-1.1.4.exe
          cp "$evidence" ./R5_QUALIFICATION.json
          cp "$sums" ./SHA256SUMS.txt

      - name: Create and verify pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='windows-services-1.1.4-r5'
          target='ba5ec72e4c57bbc65259a903656756b23d6e784a'
          cat > release-notes.md <<'EOF'
          Production-qualified Maintenance V4 R5 package.

          Components:
          - Runtime 1.0.5 — KEEP, canonical byte-exact payload
          - Print Agent 6.2.9 — KEEP, canonical byte-exact payload
          - Maintenance Supervisor 0.3.2 — UPDATE
          - Update Engine 0.3.2 — UPDATE
          - Recovery Console 0.1.1 — KEEP

          R5 hardening:
          - Apache health port discovered from the real SOKNA managed configuration; no fixed 18080 assumption.
          - Baseline Local HTTP health is proven before the first slot mutation.
          - Machine-local recovery/update runner overlays are preserved in release slots.
          - Runtime/Print KEEP means no stop/copy/re-registration/restart.
          - No DB mutation, Public mutation, or Windows reboot.

          Installer SHA-256:
          f3cfe6eb105888534dee7b6ea18dac3b95a9d0f4fec7688a93c088c01b1998cf
          EOF
          gh release create "$tag" \
            SOKNA-Windows-Services-Setup-1.1.4.exe \
            R5_QUALIFICATION.json \
            SHA256SUMS.txt \
            --repo mobaraki20/SoknaCafeV3 \
            --target "$target" \
            --title 'SOKNA Windows Services 1.1.4 — Maintenance V4 R5' \
            --notes-file release-notes.md \
            --prerelease
          test "$(gh api repos/mobaraki20/SoknaCafeV3/releases/tags/$tag --jq .prerelease)" = 'true'
          test "$(gh api repos/mobaraki20/SoknaCafeV3/releases/tags/$tag --jq .draft)" = 'false'
          digest="$(gh api repos/mobaraki20/SoknaCafeV3/releases/tags/$tag --jq '.assets[] | select(.name=="SOKNA-Windows-Services-Setup-1.1.4.exe") | .digest')"
          test "$digest" = 'sha256:f3cfe6eb105888534dee7b6ea18dac3b95a9d0f4fec7688a93c088c01b1998cf'
