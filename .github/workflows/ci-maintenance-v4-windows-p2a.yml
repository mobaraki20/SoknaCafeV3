name: CI Maintenance V4 Windows P2A

on:
  workflow_dispatch:
  push:
    branches:
      - work/maintenance-v4-windows-p2a-release-set

permissions:
  contents: read

concurrency:
  group: ci-maintenance-v4-windows-p2a-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualify-p2a:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify frozen P1 parent and source scope
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base='01558cc3220092dd857e5d196c2157c00c5de390'
          git merge-base --is-ancestor $base HEAD
          if($LASTEXITCODE-ne0){throw 'Qualified Windows P1 commit is not an ancestor.'}
          $changed=@(git diff --name-only "$base..HEAD")
          foreach($path in $changed){
            if($path -eq '.github/workflows/ci-maintenance-v4-windows-p2a.yml'){continue}
            if($path.StartsWith('windows/maintenance/')){continue}
            throw "P2A changed a path outside Windows Maintenance scope: $path"
          }
          Write-Host 'P2A parent/scope: PASS'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build P2A and inherited P1 executables
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Update Engine build failed.'}
          dotnet build windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Inherited Supervisor build failed.'}
          dotnet build windows/maintenance/src/Sokna.Maintenance.RecoveryConsole/Sokna.Maintenance.RecoveryConsole.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Inherited Recovery Console build failed.'}
          dotnet build windows/maintenance/tests/Sokna.Maintenance.P2Fixture/Sokna.Maintenance.P2Fixture.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'P2 fixture build failed.'}

      - name: Publish P2A Update Engine and fixture
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path out/p2a/engine,out/p2a/fixture -Force|Out-Null
          dotnet publish windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o out/p2a/engine
          if($LASTEXITCODE-ne0){throw 'Update Engine publish failed.'}
          dotnet publish windows/maintenance/tests/Sokna.Maintenance.P2Fixture/Sokna.Maintenance.P2Fixture.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o out/p2a/fixture
          if($LASTEXITCODE-ne0){throw 'P2 fixture publish failed.'}

      - name: Run signed Release Set P2A qualification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $engine=(Resolve-Path 'out/p2a/engine/SoknaMaintenanceUpdateEngine.exe').Path
          $fixture=(Resolve-Path 'out/p2a/fixture/Sokna.Maintenance.P2Fixture.exe').Path
          $result=& windows/maintenance/tests/p2a-qualification.ps1 -EngineExe $engine -FixtureExe $fixture
          $result|Tee-Object -FilePath out/p2a/P2A_QUALIFICATION.json
          $parsed=$result|ConvertFrom-Json
          if([string]$parsed.result-ne'PASS'){throw "P2A qualification result is not PASS. LastNativeExit=$LASTEXITCODE"}
          $global:LASTEXITCODE=0

      - name: Freeze P2A provenance and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $head=(git rev-parse HEAD).Trim()
          [ordered]@{
            format='sokna-maintenance-v4-windows-p2a-provenance-v1'
            source_commit=$head
            qualified_p1_parent='01558cc3220092dd857e5d196c2157c00c5de390'
            update_engine_version='0.2.0'
            release_set_schema='2.1'
            signature_algorithm='ecdsa-p256-sha256'
            private_signing_key_in_payload=$false
            stage_only=$true
            activation=$false
            database_mutation=$false
            apache_restart=$false
            evidence_tier='windows-2022-ci-runtime-not-real-cafe-host'
          }|ConvertTo-Json -Depth 6|Set-Content out/p2a/P2A_PROVENANCE.json -Encoding utf8
          $files=@(
            'out/p2a/P2A_QUALIFICATION.json',
            'out/p2a/P2A_PROVENANCE.json',
            'out/p2a/engine/SoknaMaintenanceUpdateEngine.exe'
          )
          $lines=foreach($file in $files){"$((Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant())  $file"}
          $lines|Set-Content out/p2a/SHA256SUMS.txt -Encoding utf8

      - name: Upload P2A qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-v4-windows-p2a-evidence
          path: |
            out/p2a/P2A_QUALIFICATION.json
            out/p2a/P2A_PROVENANCE.json
            out/p2a/SHA256SUMS.txt
          if-no-files-found: error
