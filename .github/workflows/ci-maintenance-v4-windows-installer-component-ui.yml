name: CI Maintenance V4 Windows Installer Component UI

on:
  workflow_dispatch:
  push:
    branches:
      - work/maintenance-v4-windows-installer-component-ui

permissions:
  contents: read

concurrency:
  group: ci-maintenance-v4-windows-installer-component-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-and-host:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Setup UI and Host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet build packaging/windows/setup-ui/Sokna.SetupUi.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Setup UI build failed.'}
          dotnet build packaging/windows/setup-host/Sokna.SetupHost.csproj -c Release
          if($LASTEXITCODE-ne0){throw 'Setup Host build failed.'}
          dotnet publish packaging/windows/setup-ui/Sokna.SetupUi.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/setup-ui
          if($LASTEXITCODE-ne0){throw 'Setup UI publish failed.'}
          dotnet publish packaging/windows/setup-host/Sokna.SetupHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out/setup-host
          if($LASTEXITCODE-ne0){throw 'Setup Host publish failed.'}
      - name: Planner and Host self-tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ui=(Resolve-Path out/setup-ui/SoknaSetupUi.exe).Path
          $hostExe=(Resolve-Path out/setup-host/SoknaSetupHost.exe).Path
          $p=Start-Process -FilePath $ui -ArgumentList '--planner-self-test' -Wait -PassThru
          if($p.ExitCode-ne0){throw "Planner self-test failed: $($p.ExitCode)"}
          $p=Start-Process -FilePath $hostExe -ArgumentList '--host-self-test' -Wait -PassThru -NoNewWindow
          if($p.ExitCode-ne0){throw "Host self-test failed: $($p.ExitCode)"}
      - name: Render WinForms screenshot qualification set
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Path out/ui-screenshots -Force|Out-Null
          $ui=(Resolve-Path out/setup-ui/SoknaSetupUi.exe).Path
          $screenRoot=(Resolve-Path out/ui-screenshots).Path
          $p=Start-Process -FilePath $ui -ArgumentList @('--layout-self-test',('"'+$screenRoot+'"')) -Wait -PassThru
          if($p.ExitCode-ne0){throw "Layout self-test failed: $($p.ExitCode)"}
          $reports=Get-ChildItem out/ui-screenshots -Filter '*.txt'
          foreach($report in $reports){$raw=Get-Content $report.FullName -Raw;if($raw.Trim()-ne'PASS'){throw "Layout report failed: $($report.Name) / $raw"}}
          if(@(Get-ChildItem out/ui-screenshots -Filter '*.png').Count-lt5){throw 'Expected screenshot evidence missing.'}
      - name: Static lifecycle policy gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=Get-Content packaging/windows/scripts/setup-windows-components-v5.ps1 -Raw
          foreach($needle in @("Action-eq'KEEP'","no_stop_no_copy_no_registration_no_restart","SoknaMaintenanceSupervisor","rollback_started","install-result.json","service_image_outside_owned_root")){if(-not$script.Contains($needle)){throw "Lifecycle policy marker missing: $needle"}}
          $support=Get-Content packaging/windows/scripts/collect-support-v2.ps1 -Raw
          foreach($needle in @('Installer\logs','SoknaMaintenanceSupervisor','PAIRING_CODE_REDACTED')){if(-not$support.Contains($needle)){throw "Support policy marker missing: $needle"}}
      - name: Freeze first-pass UI evidence
        shell: pwsh
        run: |
          $head=(git rev-parse HEAD).Trim();$tree=(git rev-parse 'HEAD^{tree}').Trim()
          [ordered]@{format='sokna-installer-ui-qualification-v1';source_commit=$head;source_tree=$tree;package_version=(Get-Content packaging/windows/WINDOWS_SERVICES_VERSION.txt -Raw).Trim();screenshots=@(Get-ChildItem out/ui-screenshots -Filter '*.png'|Select-Object -ExpandProperty Name);evidence_tier='windows-2022-ci-not-real-cafe-host';real_host_uat=$false}|ConvertTo-Json -Depth 6|Set-Content out/ui-screenshots/QUALIFICATION.json -Encoding utf8
      - name: Upload UI screenshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-v4-installer-ui-screenshots
          path: out/ui-screenshots
          if-no-files-found: error
