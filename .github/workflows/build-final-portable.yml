name: build final portable deliverables
on:
  push:
    branches: [transfer/v3-final-qualified-0fa99f8-helper]
    paths: [.github/workflows/build-final-portable.yml]
permissions:
  contents: read
env:
  source_sha: 0fa99f837f502fc84e24c8ef7e4d449eeeff3dcd
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0fa99f837f502fc84e24c8ef7e4d449eeeff3dcd
      - name: verify exact source
        run: test "$(git rev-parse HEAD)" = "$source_sha"
      - name: build portable release
        run: python3 release/build-portable-release.py --out "$RUNNER_TEMP/final" --source-commit "$source_sha"
      - uses: actions/upload-artifact@v4
        with:
          name: final-portable-deliverables
          path: |
            ${{ runner.temp }}/final/SoknaCafeV3-local-web-3.0.0-g6.2-dev.zip
            ${{ runner.temp }}/final/SoknaCafeV3-public-edge-3.0.0-g3.5-dev-deploy.zip
          if-no-files-found: error
