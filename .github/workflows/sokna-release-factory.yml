name: SOKNA Unified Release Factory - Universal Distribution / QA / NO DEPLOY

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'historical-r233 or registered-candidate or legacy-public-35ic'
        type: choice
        options: [historical-r233, legacy-public-35ic, registered-candidate, universal-release]
        default: historical-r233
        required: true
      checkpoint:
        description: 'Exact R233 checkpoint for historical QA track only'
        type: string
        required: false
        default: R233-20261115
      candidate_contract_path:
        description: 'Registered version-controlled candidate manifest path for the new candidate track'
        type: string
        required: false
        default: ''
      candidate_run_id:
        description: 'Producer Actions run containing original ZIPs'
        type: string
        required: false
        default: ''
      candidate_artifact:
        description: 'Exact producer artifact; no rebuild permitted'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      track:
        type: string
        required: false
        default: registered-candidate
      checkpoint:
        type: string
        required: false
        default: R233-20261115
      candidate_contract_path:
        type: string
        required: false
        default: ''
      candidate_run_id:
        type: string
        required: false
        default: ''
      candidate_artifact:
        type: string
        required: false
        default: ''
  pull_request:
    paths:
      - '.github/workflows/sokna-release-factory.yml'
      - '.github/workflows/sokna-r233-release-qa-rehearsal.yml'
      - '.github/workflows/sokna-release-source-intake.yml'
      - 'release-ops/**'

permissions:
  contents: read
  actions: read

# This factory is READ-ONLY. Do not lock by branch: a producer can call it
# as a nested workflow in the SAME run while ordinary PR historical QA runs.
# A ref-wide lock would create avoidable blockage/cancellation between them.

jobs:
  source-local:
    if: ${{ inputs.track == '' || inputs.track == null || inputs.track == 'historical-r233' }}
    name: Immutable Local source + MariaDB source lineage + module coverage
    uses: ./.github/workflows/sokna-release-source-intake.yml
    with:
      component: local
      package_kind: local-update
      source_checkpoint: ${{ inputs.checkpoint || 'R233-20261115' }}
    permissions:
      contents: read
      actions: read

  source-public:
    if: ${{ inputs.track == '' || inputs.track == null || inputs.track == 'historical-r233' }}
    name: Immutable Public source + MariaDB source lineage + module coverage
    uses: ./.github/workflows/sokna-release-source-intake.yml
    with:
      component: public
      package_kind: public-update
      source_checkpoint: ${{ inputs.checkpoint || 'R233-20261115' }}
    permissions:
      contents: read
      actions: read

  local-public-native-qa:
    if: ${{ inputs.track == '' || inputs.track == null || inputs.track == 'historical-r233' }}
    name: Temporary actual-format Local/Public builders + Windows + MariaDB + dual Public routes
    uses: ./.github/workflows/sokna-r233-release-qa-rehearsal.yml
    permissions:
      contents: read
      actions: read

  final-decision:
    if: ${{ always() && (inputs.track == '' || inputs.track == null || inputs.track == 'historical-r233') }}
    needs: [source-local, source-public, local-public-native-qa]
    name: ONE release-readiness decision and exact QA checksums; operational install stays blocked
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download read-only evidence reports from THIS EXACT factory run
        uses: actions/download-artifact@v4
        with:
          pattern: SOKNA-*QA-REPORT-ONLY*
          path: evidence
          merge-multiple: false
      - name: Reject missing/mismatched upstream workflow conclusions
        shell: bash
        env:
          LOCAL_RESULT: ${{ needs.source-local.result }}
          PUBLIC_RESULT: ${{ needs.source-public.result }}
          NATIVE_RESULT: ${{ needs.local-public-native-qa.result }}
        run: |
          set -euo pipefail
          printf 'Local source: %s\nPublic source: %s\nNative bundle: %s\n' \
            "$LOCAL_RESULT" "$PUBLIC_RESULT" "$NATIVE_RESULT"
          test "$LOCAL_RESULT" = success && test "$PUBLIC_RESULT" = success && test "$NATIVE_RESULT" = success
      - name: Independently read all five exact QA reports, check source and package SHA, and BLOCK production
        shell: bash
        env:
          CHECKPOINT: ${{ inputs.checkpoint || 'R233-20261115' }}
        run: |
          set -euo pipefail
          mkdir -p final-proof
          python3 release-ops/factory_decision.py --reports evidence --checkpoint "$CHECKPOINT" \
            --factory-run-id "$GITHUB_RUN_ID" --out final-proof/release-readiness.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('final-proof/release-readiness.json'))
          assert d['classification']=='QA_PASS_EXTERNAL_HOST_ACCEPTANCE_BLOCKED'
          assert d['production_authorized'] is False and d['operator_package_created'] is False
          assert d['factory_workflow_executed'] is True
          assert str(d['factory_workflow_run_id']) == str(__import__('os').environ['GITHUB_RUN_ID'])
          print('### SOKNA Unified Release Factory - historical checkpoint')
          print('**FACTORY USED: YES — only for this historical R233 QA run**')
          print('**R265/R266 external Public ZIPs: NOT evaluated by this run**')
          print('**Source:',d['checkpoint'],'**')
          print('**QA: PASS for the listed source/package/Windows/MariaDB fixtures only**')
          print('**OPERATOR RELEASE: BLOCKED - not an installable publication**')
          for name,digest in sorted(d['package_sha256'].items()):
              print('- QA-only '+name+': '+digest)
          print('In-scope P0 issues with no field signoff in historic board:',len(d['applicable_p0_unapproved']))
          print('Missing signed real-host evidence:')
          for k in sorted(d['host_evidence']): print('- '+k)
          PY
          echo "PASS_UNIFIED_QA_PROOFS__FIELD_INSTALL_AND_PUBLICATION_BLOCKED"
      - name: Upload decision report ONLY; no QA ZIP, no credentials, no executable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOKNA-UNIFIED-RELEASE-READINESS-REPORT-ONLY
          path: final-proof/release-readiness.json
          if-no-files-found: ignore
          retention-days: 90

  registered-candidate-gate:
    if: ${{ inputs.track == 'legacy-public-35ic' || inputs.track == 'registered-candidate' }}
    name: ONE shared gate for new Public/Local candidate ZIPs and the R265/R266 old Emergency exception
    uses: ./.github/workflows/sokna-release-candidate-gate.yml
    permissions:
      contents: read
      actions: read
    with:
      contract_path: ${{ inputs.track == 'legacy-public-35ic' && 'release-ops/external-public-r268-provenance.json' || inputs.candidate_contract_path }}
      producer_run_id: ${{ inputs.track == 'legacy-public-35ic' && '44025587468' || inputs.candidate_run_id }}
      producer_artifact: ${{ inputs.track == 'legacy-public-35ic' && 'R267-EMERGENCY-SCHEMA-QA-NO-HOST-DEPLOY' || inputs.candidate_artifact }}

  candidate-final-decision:
    if: ${{ always() && (inputs.track == 'legacy-public-35ic' || inputs.track == 'registered-candidate') }}
    needs: [registered-candidate-gate]
    name: One final factory receipt - original producer vs validated same ZIP; operator BLOCKED
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Write fail-closed initial decision even when producer receipt is missing
        shell: bash
        env:
          GATE_RESULT: ${{ needs.registered-candidate-gate.result }}
          TRACK: ${{ inputs.track }}
        run: |
          mkdir -p final-proof
          python3 - <<'PY'
          import json,os
          out={'schema':'sokna-unified-factory-candidate-final-v1',
               'track':os.environ['TRACK'],
               'factory_gate_run_id':os.environ['GITHUB_RUN_ID'],
               'factory_gate_status':os.environ['GATE_RESULT'],
               'factory_validated_same_zip':False,
               'built_inside_factory':False,
               'production_authorized':False,
               'operator_package_created':False,
               'status':'BLOCKED_MISSING_CANDIDATE_QA_OR_HOST_PROOF'}
          open('final-proof/release-decision.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
      - name: Retrieve SAME-RUN shared candidate receipt
        if: ${{ needs.registered-candidate-gate.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: SOKNA-FACTORY-SHARED-CANDIDATE-RECEIPT-${{ inputs.candidate_artifact }}
          path: candidate-proof
      - name: Validate exact gate-run receipt, producer identity and keep operator BLOCKED
        if: ${{ needs.registered-candidate-gate.result == 'success' }}
        shell: bash
        env:
          TRACK: ${{ inputs.track }}
          EXPECTED_PRODUCER: ${{ inputs.track == 'legacy-public-35ic' && '44025587468' || inputs.candidate_run_id }}
          EXPECTED_ARTIFACT: ${{ inputs.track == 'legacy-public-35ic' && 'R267-EMERGENCY-SCHEMA-QA-NO-HOST-DEPLOY' || inputs.candidate_artifact }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          d=json.load(open('candidate-proof/receipt.json'))
          assert d['factory_gate_used'] is True
          assert d['factory_validated_exact_bytes'] is True
          assert d['producer_run_id']==os.environ['EXPECTED_PRODUCER']
          assert d['producer_artifact']==os.environ['EXPECTED_ARTIFACT']
          assert str(d['factory_gate_run_id'])==str(os.environ['GITHUB_RUN_ID'])
          assert len(d['candidate_zip_sha256'])>=1
          assert d['production_authorized'] is False and d['operator_release_authorized'] is False
          status='QA_EXACT_ZIPS_VERIFIED_IN_UNIFIED_FACTORY__OPERATOR_BLOCKED'
          final={'schema':'sokna-unified-factory-candidate-final-v1',
                 'track':os.environ['TRACK'],
                 'producer_run_id':d['producer_run_id'],
                 'factory_gate_run_id':d['factory_gate_run_id'],
                 'factory_gate_used':True,
                 'factory_validated_same_zip':True,
                 'built_inside_factory':d['built_inside_factory'],
                 'candidate_zip_sha256':d['candidate_zip_sha256'],
                 'database_migration_path':d['database_migration_path'],
                 'source_approved':d['source_approved'],
                 'field_host_activation':d['field_host_activation'],
                 'field_host_backup_restore':d['field_host_backup_restore'],
                 'production_authorized':False,
                 'operator_package_created':False,
                 'status':status}
          with open('final-proof/release-decision.json','w') as f:
              json.dump(final,f,ensure_ascii=False,sort_keys=True,indent=2)
              f.write('\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### SOKNA Unified Factory: candidate '+os.environ['TRACK']+'\n')
              f.write('**FACTORY GATE USED: YES — ORIGINAL ZIP BYTES VERIFIED**\n\n')
              f.write('**BUILT INSIDE FACTORY:** '+('YES' if final['built_inside_factory'] else 'NO - external producer')+'\n\n')
              f.write('**Producer run:** '+d['producer_run_id']+'; **Factory run:** '+d['factory_gate_run_id']+'\n\n')
              for digest in final['candidate_zip_sha256']:
                  f.write('- Original ZIP SHA256: '+digest+'\n')
              f.write('\n**Production:** BLOCKED. Source authority/real host backup & install not proven.\n')
          print(status)
          PY
      - name: Upload final decision only; never install ZIP or mutate host
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SOKNA-UNIFIED-FACTORY-CANDIDATE-DECISION-${{ inputs.candidate_artifact }}
          path: final-proof/release-decision.json
          if-no-files-found: ignore
          retention-days: 90

  universal-distribution:
    if: ${{ inputs.track == 'universal-release' }}
    uses: ./.github/workflows/sokna-universal-distribution.yml
    permissions:
      contents: read
      actions: read
    with:
      contract_path: ${{ inputs.candidate_contract_path }}
      producer_run_id: ${{ inputs.candidate_run_id }}
      producer_artifact: ${{ inputs.candidate_artifact }}
