name: qualify exact 0fa99f8
on:
  push:
    branches: [transfer/v3-final-qualified-0fa99f8-helper]
    paths: [.github/workflows/qualify-exact-0fa99f8.yml]
permissions:
  contents: read
env:
  source_sha: 0fa99f837f502fc84e24c8ef7e4d449eeeff3dcd
jobs:
  linux:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: sokna_m2
          MARIADB_USER: sokna
          MARIADB_PASSWORD: sokna
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SOKNA_TEST_DB_HOST: 127.0.0.1
      SOKNA_TEST_DB_PORT: 3306
      SOKNA_TEST_DB_NAME: sokna_m2
      SOKNA_TEST_DB_USER: sokna
      SOKNA_TEST_DB_PASS: sokna
      SOKNA_TEST_DB_ROOT_USER: root
      SOKNA_TEST_DB_ROOT_PASS: root
    steps:
      - uses: actions/checkout@v4
        with: {ref: 0fa99f837f502fc84e24c8ef7e4d449eeeff3dcd}
      - run: test "$(git rev-parse HEAD)" = "$source_sha"
      - run: sudo apt-get update && sudo apt-get install -y php-mysql php-zip
      - name: qualify and capture
        shell: bash
        run: |
          mkdir -p qualification-evidence
          set -o pipefail
          ./tests/run-g4-4-product-qualification.sh 2>&1 | tee qualification-evidence/g4.log
          python3 tests/capture-qualification-evidence.py --id DQ-G4.1 --terminal 'G4.1 Product Qualification: PASS' --log qualification-evidence/g4.log --out qualification-evidence/DQ-G4.1.json --capability A05 --capability A06 --capability A13 --capability A15 --capability A16 --source-head "$source_sha"
          python3 tests/capture-qualification-evidence.py --id DQ-G4.2 --terminal 'G4.2 Product Qualification: PASS' --log qualification-evidence/g4.log --out qualification-evidence/DQ-G4.2.json --capability A21 --capability A22 --capability A23 --source-head "$source_sha"
          python3 tests/capture-qualification-evidence.py --id DQ-G4.3 --terminal 'G4.3 Product Qualification: PASS' --log qualification-evidence/g4.log --out qualification-evidence/DQ-G4.3.json --capability A24 --capability A25 --capability A26 --source-head "$source_sha"
          python3 tests/capture-qualification-evidence.py --id DQ-G4.4 --terminal 'G4.4 Product Qualification: PASS' --log qualification-evidence/g4.log --out qualification-evidence/DQ-G4.4.json --capability A28 --capability A46 --source-head "$source_sha"
      - uses: actions/upload-artifact@v4
        with: {name: exact-linux-evidence, path: qualification-evidence/}
  windows:
    runs-on: windows-latest
    env:
      pythonutf8: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: 0fa99f837f502fc84e24c8ef7e4d449eeeff3dcd}
      - shell: bash
        run: test "$(git rev-parse HEAD)" = "$source_sha"
      - shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: qualify and capture
        shell: bash
        run: |
          mkdir -p qualification-evidence
          set -o pipefail
          ./tests/run-g5-windows-packaging-qualification.sh 2>&1 | tee qualification-evidence/g5.log
          python3 tests/capture-qualification-evidence.py --id DQ-G5 --terminal 'G5 Windows Packaging Qualification: PASS' --log qualification-evidence/g5.log --out qualification-evidence/DQ-G5.json --capability A40 --capability A41 --capability A42 --source-head "$source_sha"
          SOKNA_G6_ARTIFACT_DIR="$RUNNER_TEMP/g6-artifacts" ./tests/run-g6-component-artifact-qualification.sh 2>&1 | tee qualification-evidence/g6.log
          python3 tests/capture-qualification-evidence.py --id DQ-G6 --terminal 'G6 Component Release Qualification: PASS' --log qualification-evidence/g6.log --out qualification-evidence/DQ-G6.json --capability A44 --capability A50 --source-head "$source_sha"
      - uses: actions/upload-artifact@v4
        with: {name: exact-windows-evidence, path: qualification-evidence/}
  final:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: 0fa99f837f502fc84e24c8ef7e4d449eeeff3dcd}
      - uses: actions/download-artifact@v4
        with: {pattern: exact-*-evidence, path: qualification-evidence, merge-multiple: true}
      - shell: bash
        run: ./tests/run-g6-final-qualification.sh qualification-evidence "$source_sha" | tee qualification-evidence/final.log
      - uses: actions/upload-artifact@v4
        with: {name: exact-g6-final-evidence, path: qualification-evidence/}
