name: SOKNA checkpoint84 controlled Home exact outer admission
on:
  push:
    branches: [qa/checkpoint55-exact-windows-20261126]
    paths: ['.github/workflows/sokna-factory-checkpoint84-controlled-local.yml', 'qa/factory/build_checkpoint84_controlled_local.py', 'qa/factory/prepare_checkpoint84_native.py']
permissions:
  contents: read
  actions: read
concurrency:
  group: cp84-controlled-local-${{ github.ref }}
  cancel-in-progress: true
jobs:
  evidence:
    runs-on: windows-latest
    timeout-minutes: 12
    outputs:
      outer_sha: ${{ steps.freeze.outputs.outer_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.5'}
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-LOCAL-231GF-CONTROLLED-HOME-CANARY
          run-id: 45718662312
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/home
      - name: Reconstruct exact 231gg QA bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:RUNNER_TEMP base.zip
          curl.exe --fail --location --silent --show-error -H "Authorization: Bearer $env:GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15069153300/zip" -o $base
          if($LASTEXITCODE -ne 0){throw 'BASE_DOWNLOAD_FAILED'}
          if((Get-FileHash $base -Algorithm SHA256).Hash.ToLowerInvariant() -ne '57589151165e5d73c0b0339623e3ee3b2db9ea7c54ffbac69246c9ff3532da2f'){throw 'BASE_HASH_DRIFT'}
          python qa/checkpoint76/reconstruct.py "$env:RUNNER_TEMP/cp76" $base qa/checkpoint76/transfer.b64
          if($LASTEXITCODE -ne 0){throw 'EXACT_REBUILD_FAILED'}
          python qa/checkpoint76/sequence4.py "$env:RUNNER_TEMP/cp76/out"
          if($LASTEXITCODE -ne 0){throw 'SEQUENCE_CORRECTION_FAILED'}
      - name: Verify all prior evidence and freeze candidate hash
        id: freeze
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $target=Get-Item "$env:RUNNER_TEMP/cp76/out/LOCAL-231GG-UPDATE-QA-DO-NOT-INSTALL.zip"
          $historicalHomeArchive=Get-ChildItem "$env:RUNNER_TEMP/home" -Recurse -File -Filter 'SOKNA-LOCAL-231GF-CONTROLLED-HOME-CANARY.zip'|Select-Object -First 1
          if(!$historicalHomeArchive){throw 'PINNED_HOME_ARCHIVE_MISSING'}
          $controlled=Join-Path $env:RUNNER_TEMP 'LOCAL-231GG-CONTROLLED-HOME-CANARY.zip'
          python qa/factory/build_checkpoint84_controlled_local.py $target.FullName $historicalHomeArchive.FullName $controlled
          if($LASTEXITCODE -ne 0){throw 'CONTROLLED_BUILD_FAILED'}
          $sha=(Get-FileHash $controlled -Algorithm SHA256).Hash.ToLowerInvariant()
          "outer_sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "EVIDENCE VERIFIED; EXACT OUTER SHA $sha"
  native:
    needs: evidence
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - {origin: GF, fault: none, ledger: '93', run: '45718662312', artifact: SOKNA-LOCAL-231GF-CONTROLLED-HOME-CANARY, file: SOKNA-LOCAL-231GF-CONTROLLED-HOME-CANARY.zip}
          - {origin: R301, fault: none, ledger: '83', run: '44561325048', artifact: SOKNA-R301-LOCAL-CONTROLLED-INSTALL-EXACT-ARTIFACT, file: SOKNA-R301-LOCAL-231FS-PUBLIC-MOVE-CONTROLLED-INSTALL.zip}
          - {origin: R304, fault: none, ledger: '83', run: '44639218881', artifact: SOKNA-R304-EXACT-CANDIDATES-REQUIRE-ONSITE-PREFLIGHT, file: SOKNA-R304-LOCAL-231FU-NATIVE-CANDIDATE-NOT-FIELD.zip}
          - {origin: R306, fault: none, ledger: '83', run: '44723958829', artifact: SOKNA-R306-EXACT-LOCAL-PUBLIC-CANDIDATES-PREFLIGHT, file: SOKNA-R306-LOCAL-231FV-CONTROLLED-PREFLIGHT.zip}
          - {origin: R307, fault: none, ledger: '83', run: '44730988488', artifact: SOKNA-R307-LOCAL-231FW-EXACT-CANDIDATE, file: SOKNA-R307-LOCAL-231FW-FROM-231FV-CONTROLLED-PREFLIGHT.zip}
          - {origin: R3, fault: none, ledger: '90', run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: C2, fault: none, ledger: '91', run: '45389831526', artifact: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE, file: SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip}
          - {origin: GE, fault: none, ledger: '93', run: '45565963138', artifact: SOKNA-FINAL-FROZEN-DO-NOT-INSTALL, file: LOCAL-FINAL-FROZEN.zip}
    env:
      SOKNA_R186_CI_ONLY: 'YES'
      SOKNA_BASE_LEDGER: ${{ matrix.ledger }}
      SOKNA_ORIGIN: ${{ matrix.origin }}
      SOKNA_FAULT: ${{ matrix.fault }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: f38c20083068e540d593876a2c527c51e0157f92
          path: native-src
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.5'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-PREREQUISITES-105-QA-CANDIDATE-NOT-INSTALL
          run-id: 45707538026
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/helper
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-APACHE-2471-CANDIDATE-QA-ONLY
          run-id: 45707401488
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apache
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-LOCAL-231GF-CONTROLLED-HOME-CANARY
          run-id: 45718662312
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/home
      - name: Reconstruct exact 231gg QA bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:RUNNER_TEMP base.zip
          curl.exe --fail --location --silent --show-error -H "Authorization: Bearer $env:GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15069153300/zip" -o $base
          if($LASTEXITCODE -ne 0){throw 'BASE_DOWNLOAD_FAILED'}
          if((Get-FileHash $base -Algorithm SHA256).Hash.ToLowerInvariant() -ne '57589151165e5d73c0b0339623e3ee3b2db9ea7c54ffbac69246c9ff3532da2f'){throw 'BASE_HASH_DRIFT'}
          python qa/checkpoint76/reconstruct.py "$env:RUNNER_TEMP/cp76" $base qa/checkpoint76/transfer.b64
          if($LASTEXITCODE -ne 0){throw 'EXACT_REBUILD_FAILED'}
          python qa/checkpoint76/sequence4.py "$env:RUNNER_TEMP/cp76/out"
          if($LASTEXITCODE -ne 0){throw 'SEQUENCE_CORRECTION_FAILED'}
      - name: Verify prior evidence and exercise new exact outer via actual native panel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $base=Get-ChildItem "$env:RUNNER_TEMP/baseline" -Recurse -File -Filter '${{ matrix.file }}'|Select-Object -First 1
          $target=Get-Item "$env:RUNNER_TEMP/cp76/out/LOCAL-231GG-UPDATE-QA-DO-NOT-INSTALL.zip"
          if(!$base -or !$target){throw 'PINNED_ARCHIVES_MISSING'}
          $env:SOKNA_BASELINE_ZIP=$base.FullName
          $homeArchive=Get-ChildItem "$env:RUNNER_TEMP/home" -Recurse -File -Filter 'SOKNA-LOCAL-231GF-CONTROLLED-HOME-CANARY.zip'|Select-Object -First 1
          if(!$homeArchive){throw 'PINNED_HOME_ARCHIVE_MISSING'}
          $controlled=Join-Path $env:RUNNER_TEMP 'LOCAL-231GG-CONTROLLED-HOME-CANARY.zip'
          python qa/factory/build_checkpoint84_controlled_local.py $target.FullName $homeArchive.FullName $controlled
          if($LASTEXITCODE -ne 0){throw 'CONTROLLED_BUILD_FAILED'}
          if((Get-FileHash $controlled -Algorithm SHA256).Hash.ToLowerInvariant() -cne '${{ needs.evidence.outputs.outer_sha }}'){throw 'OUTER_DRIFT'}
          $env:SOKNA_CURRENT_QA_ZIP=$controlled
          $env:SOKNA_MATRIX_TARGET_ZIP=$controlled
          python qa/factory/prepare_checkpoint84_native.py
          if($LASTEXITCODE -ne 0){throw 'BRIDGE_PREPARATION_FAILED'}
          Copy-Item qa/checkpoint61/BridgeHarness.cs native-src/qa/sokna-r186/R186Harness.cs -Force
          Push-Location native-src
          try {
            & (Join-Path $env:RUNNER_TEMP 'native-matrix.ps1')
            if($LASTEXITCODE -ne 0){throw 'BRIDGE_TEST_FAILED'}
          }finally{Pop-Location}
      - name: Print receipt only (no new artifact storage)
        if: success()
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP/matrix-receipt.json" -Raw
          Get-FileHash "$env:RUNNER_TEMP/matrix-receipt.json" -Algorithm SHA256
