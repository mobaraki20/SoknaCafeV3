name: SOKNA R228 exact Public server signed HTTP to Local R225 durable ACK recovery disposable QA
on:
  push:
    branches: [qa/sokna-r228-signed-http-20261114]
    paths:
      - 'qa/sokna-r228/**'
      - '.github/workflows/sokna-r228-signed-http.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  r228-two-server-signed-http:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: r225-disposable-only
        ports:
          - 3306:3306
    env:
      SOKNA_R225_DISPOSABLE_ONLY: 'YES'
      SOKNA_R213_DISPOSABLE_ONLY: 'YES'
      SOKNA_R228_DISPOSABLE_ONLY: 'YES'
      SOKNA_R213_DB_PASSWORD: r225-disposable-only
      SOKNA_R213_ADMIN_PASSWORD: only-in-r225-disposable-ci
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql,mbstring,curl,gd,zip,fileinfo,sodium
          coverage: none
      - name: Wait for disposable MariaDB 11.4
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            if php -r 'try{new PDO("mysql:host=127.0.0.1;port=3306","root",getenv("SOKNA_R213_DB_PASSWORD"));exit(0);}catch(Throwable $e){exit(1);}' ; then exit 0;fi
            sleep 2
          done
          exit 1
      - uses: actions/download-artifact@v4
        with:
          name: R204-EXACT-SOURCE-AND-MANIFEST-READY-FOR-WINDOWS
          run-id: 43513196061
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r204-parent
      - name: Exact R225 Local reconstruction and SHA of all 591 files
        shell: bash
        run: |
          set -euo pipefail
          R="$RUNNER_TEMP/r225";mkdir -p "$R/outer" "$R/web"
          ARCHIVE=$(find "$RUNNER_TEMP/r204-parent" -type f -name 'SOKNA-R204-LOCAL-231FB-61BASE-EXACT-WINDOWS-TECH-CANDIDATE.zip' -print -quit)
          test -n "$ARCHIVE"
          echo "279d64dcf3800a764c3fcf751a0fc800857de501943af32428c87cc8db2539a3  $ARCHIVE" | sha256sum -c -
          unzip -q "$ARCHIVE" -d "$R/outer"
          unzip -q "$R/outer/artifacts/local/web.zip" -d "$R/web"
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r222/R204-to-R222-exact-cumulative.patch.gz.b64" | gzip -d > "$R/r222.patch"
          echo "56ab7c800a3b0a14c869374095806e4bac821c92647a26d78309b125edb083c5  $R/r222.patch" | sha256sum -c -
          (cd "$R/web" && git init -q && git config core.autocrlf false && git apply --check "$R/r222.patch" && git apply "$R/r222.patch")
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r225/R222-to-R224-exact.patch.gz.b64" | gzip -d > "$R/r224.patch"
          echo "1ee11d6fb244a59dc9fecc3685317c6c0688ea8623d6560fd2bf6db0bd32d38e  $R/r224.patch" | sha256sum -c -
          (cd "$R/web" && git apply --check "$R/r224.patch" && git apply "$R/r224.patch")
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r225/R224-to-R225-clean-setup.patch.gz.b64" | gzip -d > "$R/r225.patch"
          echo "4d05e072c1a06c1319c6e20e4f583ac654b1138ec51c2522b033e8bf95b46985  $R/r225.patch" | sha256sum -c -
          (cd "$R/web" && git apply --check "$R/r225.patch" && git apply "$R/r225.patch")
          python3 - "$R/web" <<'PY'
          import pathlib,hashlib,sys
          p=pathlib.Path(sys.argv[1]);files={str(f.relative_to(p)):hashlib.sha256(f.read_bytes()).hexdigest() for f in p.rglob('*') if f.is_file() and '.git' not in f.parts}
          digest=hashlib.sha256(''.join(x+':'+files[x]+'\n' for x in sorted(files)).encode()).hexdigest()
          assert len(files)==591 and digest=='e0217a5d0004b13301ae058b2a17c79402ae1b0c3dcc424cab804bd3abc4d721',(len(files),digest)
          print('PASS_R228_EXACT_591_LOCAL_SOURCE_FILES')
          PY
          echo "SOKNA_R213_WEB=$R/web" >> "$GITHUB_ENV"
      - name: Exact Public R220 server code and migration hash proof
        shell: bash
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/r228-public";mkdir -p "$P"
          base64 -d "$GITHUB_WORKSPACE/qa/sokna-r228/R220-PUBLIC-EXACT-HTTP-SERVER-SOURCES.zip.b64" > "$RUNNER_TEMP/r228-public-sources.zip"
          echo "f9392dcfbcbba521bf6f372552080005ba7ff0a94f3369c291090fe8294024a0  $RUNNER_TEMP/r228-public-sources.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/r228-public-sources.zip" -d "$P"
          python3 - "$P" "$GITHUB_WORKSPACE/qa/sokna-r228/R220-PUBLIC-HTTP-SERVER-HASHES.json" <<'PY'
          import sys,pathlib,hashlib,json
          root=pathlib.Path(sys.argv[1]);hashes=json.loads(pathlib.Path(sys.argv[2]).read_text())
          actual={str(p.relative_to(root)) for p in root.rglob('*') if p.is_file()}
          assert actual==set(hashes),(len(actual),len(hashes))
          for path,expected in hashes.items():assert hashlib.sha256((root/path).read_bytes()).hexdigest()==expected,path
          assert len(actual)==165
          print('PASS_R228_EXACT_165_PUBLIC_R220_SERVER_SOURCE_FILES')
          PY
          php -l qa/sokna-r228/setup_r228_public.php
          php -l qa/sokna-r228/router_r228_public.php
          php -l qa/sokna-r228/test_r228_signed_http.php
          echo "SOKNA_R228_PUBLIC=$P" >> "$GITHUB_ENV"
      - name: Real separate BrowserSetup installs, 81 Local and 8 Public migrations, pair public secret
        shell: bash
        run: |
          set -euo pipefail
          php qa/sokna-r225/setup_r213_disposable.php
          php qa/sokna-r225/fixture_r225.php
          php qa/sokna-r228/setup_r228_public.php
      - name: Signed native HTTP, HMAC auth, ACK fault, actual offline, recovery, dedup
        shell: bash
        run: |
          set -euo pipefail
          start_server() {
            php -d display_errors=0 -S 127.0.0.1:18082 -t "$SOKNA_R228_PUBLIC" "$GITHUB_WORKSPACE/qa/sokna-r228/router_r228_public.php" > "$RUNNER_TEMP/r228-public-http.log" 2>&1 &
            SERVER_PID=$!
          }
          cleanup() {
            if test -n "${SERVER_PID:-}"; then kill "$SERVER_PID" >/dev/null 2>&1 || true; fi
            if [ -s "$RUNNER_TEMP/r228-public-http.log" ]; then tail -n 22 "$RUNNER_TEMP/r228-public-http.log" | sed -E 's/(password|secret|token)=[^& ]+/\1=REDACTED/g'; fi
          }
          trap cleanup EXIT
          start_server
          php qa/sokna-r228/test_r228_signed_http.php online
          kill "$SERVER_PID";wait "$SERVER_PID" 2>/dev/null || true;SERVER_PID=''
          php qa/sokna-r228/test_r228_signed_http.php offline
          rm "$RUNNER_TEMP/r228-drop-acks"
          start_server
          php qa/sokna-r228/test_r228_signed_http.php recover
          echo PASS_R228_ACTUAL_TWO_SERVER_SIGNED_HTTP_AND_OUTAGE_RECOVERY