name: SOKNA R290 Itemized Settlement Grouped Corrections MariaDB QA
on:
  push:
    branches: [qa/sokna-r290-itemized-allocation-20261119]
    paths:
      - 'r290/**'
      - '.github/workflows/sokna-r290-itemized-mariadb.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: r290-disposable-test-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=4s --health-retries=20
    env:
      R290_DB_PASSWORD: r290-disposable-test-only
      R290_QA_MODE: disposable_only
      GITHUB_ACTIONS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring
          coverage: none
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-R278-231FN-ORIGINAL-ZIP-FACTORY-QA-ONLY
          run-id: 44305226007
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r278
      - name: Exact R278 package provenance and apply cumulative R288 + R289 + R290
        env:
          ROOT: ${{ runner.temp }}/local
          ARTIFACTS: ${{ runner.temp }}/r278
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,os,zipfile,hashlib,io,json
          ar=pathlib.Path(os.environ['ARTIFACTS']);dst=pathlib.Path(os.environ['ROOT']);dst.mkdir(parents=True,exist_ok=True)
          digest='3a1070e18b14307fb2571634c961b20ca3e5d38e6c9a9dc1afad68be89fe6824'
          files=[p for p in ar.rglob('*.zip') if hashlib.sha256(p.read_bytes()).hexdigest()==digest]
          assert len(files)==1,[(p.name,p.stat().st_size) for p in ar.rglob('*.zip')]
          with zipfile.ZipFile(files[0]) as outer:
            manifest=json.loads(outer.read('release-set.json'))
            assert manifest['targets']['local']['version']=='3.0.0-g6.2-workspace.231fn-r278-rial-policy-persist'
            inner=outer.read('artifacts/local/web.zip')
          with zipfile.ZipFile(io.BytesIO(inner)) as z:
            names=[n for n in z.namelist() if not n.endswith('/')]
            assert len(names)==604,len(names)
            for name in names:
              dstfile=dst/name;dstfile.parent.mkdir(parents=True,exist_ok=True);dstfile.write_bytes(z.read(name))
          print('R290_BASELINE_EXACT_R278',digest,len(names))
          PY
          (cd "$ROOT" && patch --batch --forward -p1 -i "$GITHUB_WORKSPACE/r288/R278-to-R288-cumulative.patch")
          (cd "$ROOT" && patch --batch --forward -p1 -i "$GITHUB_WORKSPACE/r289/HISTORICAL-SETTLEMENT-LINKS.patch")
          (cd "$ROOT" && patch --batch --forward -p1 -i "$GITHUB_WORKSPACE/r290/R289-TO-R290-ITEMIZED.patch")
          php -l "$ROOT/src/Domain/Orders/OrderStaffActionService.php"
          php -l "$ROOT/src/Domain/Orders/OrderWorkspaceService.php"
          node --check "$ROOT/public/assets/staff-app/hall-workspace.js"
          python3 - <<'PY'
          import os,pathlib,hashlib
          root=pathlib.Path(os.environ['ROOT']);data={p.relative_to(root).as_posix():p.read_bytes() for p in root.rglob('*') if p.is_file()}
          assert len(data)==604,len(data)
          sha=lambda b:hashlib.sha256(b).hexdigest()
          digest=sha(''.join(n+'\0'+sha(b)+'\n' for n,b in sorted(data.items())).encode())
          expected='b78f2556b5a67f56cf8ef6ea3a36762f2e38f94252c4d9647df34002486680c7'
          assert digest==expected,(digest,expected)
          print('R290_EXACT_MANAGED_TREE_PASS',digest)
          PY
      - name: Pure paid-floor and service-mode matrix against actual PHP
        env:
          SOKNA_QA_ROOT: ${{ runner.temp }}/local
        run: |
          set -euo pipefail
          php -d zend.assertions=1 -d assert.exception=1 r290/qa_itemized_grouped_unit.php | tee "$RUNNER_TEMP/r290-unit.json"
      - name: Real MariaDB order correction with immutable receipt and audit
        env:
          R290_SOURCE_ROOT: ${{ runner.temp }}/local
        run: |
          set -euo pipefail
          php -r '$p=new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4","root",getenv("R290_DB_PASSWORD"),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$p->exec("CREATE DATABASE sokna_r290 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci");'
          php r290/qa_itemized_mariadb.php | tee "$RUNNER_TEMP/r290-mariadb.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-R290-ITEMIZED-MARIADB-QA
          path: |
            ${{ runner.temp }}/r290-unit.json
            ${{ runner.temp }}/r290-mariadb.json
          if-no-files-found: ignore
          retention-days: 30