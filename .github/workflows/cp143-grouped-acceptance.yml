name: SOKNA CP143 grouped safety QA
permissions:
  contents: read
  actions: read
'on':
  push:
    branches:
    - qa/cp133-marketing-20261126
    paths:
    - .github/workflows/cp143-grouped-acceptance.yml
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports:
        - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
    steps:
    - name: Reconstruct exact CP141 once
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        /usr/bin/python3 - <<'PYCODE'
        import hashlib,os,urllib.request,subprocess,yaml
        url='https://raw.githubusercontent.com/mobaraki20/SoknaCafeV3/8c4af0dab6beb60e9d4b196dc1bb32c850dd1f6b/.github/workflows/cp141-discount-relay.yml'
        raw=urllib.request.urlopen(url,timeout=30).read(200000)
        assert hashlib.sha256(raw).hexdigest()=='4f5ad8fed347995aa7722ddb8479f3079ca8f95b48b6ad98d5cc5ef8f130e5ad'
        steps=yaml.safe_load(raw)['jobs']['database']['steps']
        assert steps[8]['name']=='Apply exact CP141 discount relay delta'
        for step in steps[:9]:
         assert 'run' in step and set(step)<= {'name','run','env'},step['name']
         print('Pinned source: '+step['name'],flush=True)
         subprocess.run(['bash','-e','-o','pipefail','-c',step['run']],env=dict(os.environ),check=True)
        PYCODE
    - name: Apply exact CP143 grouped delta
      run: |
        cd "$RUNNER_TEMP"
        python3 - <<'PYCODE'
        import base64,zlib,hashlib,json,pathlib,subprocess
        changes=json.loads('{"local/public/assets/admin-workspace.js":["3e19c007a39c49030313079f4c0b3804996316f6bdb8327bdf452e68fd32287e","a688a6415be554c20c87bdec88197051f94ef1bc12f1954dee882d3c2118212f"],"local/public/assets/global-search.js":["935da40f3408e1f1ed4614be01715ffb78e47ed4f83a19554821578f19e8186f","d2e39359a5df41b1db0fa73b12d1f0aa91abc174082bdbc6f4a949f771d4637b"],"local/public/help/index.php":["f5963d9e3f4ff8762ba94113c96ef1cd45c589bc83830cf244ea79cdd40ae811","b126bf9f85e8dbb7d900e7e31826c190b9a17d9aef8ebbb752972b8ac85b2399"],"local/public/index.php":["41ca72dfc9dc6b51e7ab32250fb9479ffd0933689caffcd04d8cf822e5e71ac6","0f1794a804843c375031e8fe2fe282f11e6736332dec28f118004c36e7aaa6d2"],"local/public/reports/api.php":["f0a0c6ef2f3ec99aabadad576294b171f23353758e486b3faf948bcfdc04f1e5","f6a082ba45065f1bdf7b09d75ca79ac9bbc71749161a424c081de309fbfbee9e"],"local/public/reports/export.php":["ef1c7d1c6c1ca81c3f29205c52dd98bc9302e5a3efd1abe20c93c2afaf07ca5c","84b5aa6c51dc2457eaadf5fe6ef62bcde443bc23c3f1bc36d7e90b4c8f7485dd"],"local/public/reports/index.php":["cd380dd37b0906aeabf3f6701fa19a6ad9382f33651b9343184ec329acf56cb6","0134b199a387d73f4f3ed0be4811e00e711fec1488ad3a0ed98d4e4a391680fe"],"local/src/Domain/Admin/AdminControlService.php":["be6b4b6b8eb40fea34c4b44efd6a9e7df1c2e917e3c1f8a8e678c22bd664047d","72e5c91fa482ca978ad9c13557eef111edab78853d2474d949aac31d95f0a3a0"],"local/src/Domain/GuestContent/GuestContentService.php":["dda0d3aa36892f069bfd01c4cd72e9d7c0c99a964974eada23e1a29040ffa365","1dd752b1fb9fc1fd4b3e09af8dc8de4152eeb372d3d7820f8a10707977615623"],"local/src/Search/GlobalSearchService.php":["a8a07f8b31028fee3f6221424a7c712767a95c49bc81b93dbc3e02c8205176f2","0413b9a4fc52f81913ece0967d0bde4fb263983dc587f651aa126a978dd34ad4"],"local/src/Search/NavigationSearchProvider.php":["3fb5ffb188ab4ad7a29b1575d4397733820cb9abd8286532cdea52439d40d834","100cc3ef27d68bab4986fc060b13d875bc802663c21fccccafa01d67f83b88b7"],"local/src/UI/ProductShell.php":["c26ad53700cc77aee572bd31c383a5e3ae38ec1b45cefcb73643f36f6cc51f8c","f0be43b781340577b8e76fcea321edf33e17b6f075fca3c45cd0a73855eb7930"]}')
        for f,(a,b) in changes.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==a,f
        patch=zlib.decompress(base64.b64decode(''))
        subprocess.run(['patch','--batch','--fuzz=0','-p1'],input=patch,check=True)
        for f,(a,b) in changes.items(): assert hashlib.sha256(pathlib.Path(f).read_bytes()).hexdigest()==b,f
        print('CP143 delta verified',len(changes))
        PYCODE
    - name: Prepare grouped tests
      run: "set -euo pipefail\ncat > \"$RUNNER_TEMP/cp143-test.php\" <<'QAEOF'\n<?php\ndeclare(strict_types=1);\nif(PHP_SAPI!=='cli'||getenv('QA_DB_PASSWORD')!=='synthetic-cp116-ci-only')exit(2);\n$root=realpath($argv[1]);require $root.'/bootstrap.php';require_once $root.'/src/Setup/BrowserSetupService.php';\nfunction ck($ok,$name){if(!$ok)throw new RuntimeException($name);echo \"PASS $name\\n\";}\nfunction rejects(callable $f,string $code){try{$f();}catch(Throwable $e){ck(($e->errorCode??'')===$code,'reject '.$code);return;}throw new RuntimeException('not rejected '.$code);}\n$server=new PDO('mysql:host=127.0.0.1;port=3306;charset=utf8mb4','root',getenv('QA_DB_PASSWORD'),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$server->exec('CREATE DATABASE sokna_cp143 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci');\n$dir=sys_get_temp_dir().'/sokna-cp143-'.bin2hex(random_bytes(6));mkdir($dir,0700,true);$setup=new \\Sokna\\Local\\Setup\\BrowserSetupService(dirname($root),$root);\n$status=$setup->installNew(['data_dir'=>$dir.'/data','db'=>['host'=>'127.0.0.1','port'=>'3306','name'=>'sokna_cp143','user'=>'root','pass'=>getenv('QA_DB_PASSWORD')],'admin_user'=>'qa-target','admin_password'=>'synthetic-qa-admin-not-real','cafe_name'=>'QA CP143','table_count'=>5]);ck($status['success']??false,'fixture');$cfg=require dirname($root).'/config.php';$core=sokna_local_bootstrap($cfg);$pdo=$core->database();$actor=$pdo->query(\"SELECT id,role FROM users WHERE username='qa-target'\")->fetch(PDO::FETCH_ASSOC);$pdo->exec(\"UPDATE users SET active=0 WHERE username<>'qa-target'\");\nfor($i=1;$i<=8;$i++){$pdo->prepare(\"INSERT INTO users(username,password_hash,display_name,role,active) VALUES(?,?,?,'operator',1)\")->execute(['qa-member-'.$i,password_hash('synthetic-member-only',PASSWORD_DEFAULT),'QA143 member '.$i]);if($i===8){$staff=(int)$pdo->lastInsertId();$pdo->prepare('INSERT INTO user_capabilities(user_id,capability,enabled) VALUES(?,?,1)')->execute([$staff,'staff_consumption_reports']);}}\n$fail=0;function group($name,$fn){global $fail;try{$fn();echo \"GROUP PASS $name\\n\";}catch(Throwable $e){$fail++;echo \"GROUP FAIL $name \".get_class($e).' '.$e->getMessage().\"\\n\";}}\n$admin=$core->adminControls();\ngroup('ADM-L451',function()use($admin,$actor,$pdo){$get=function()use($admin,$actor){foreach($admin->snapshot($actor)['users'] as $u)if($u['username']==='qa-member-1')return $u;throw new RuntimeException('missing user');};$u=$get();ck(!isset($u['password_hash'])&&strlen($u['edit_revision'])===64,'opaque revision');$data=['id'=>$u['id'],'username'=>$u['username'],'display_name'=>'QA143 edited','active'=>true,'capabilities'=>['orders_floor'],'preparation_areas'=>[],'expected_user_revision'=>$u['edit_revision']];$admin->saveUser($data,$actor);$data['display_name']='QA143 stale';rejects(fn()=>$admin->saveUser($data,$actor),'user_edit_conflict');$v=$get();ck($v['display_name']==='QA143 edited'&&in_array('orders_floor',$v['capabilities']),'first change survives');$data['expected_user_revision']=$v['edit_revision'];$admin->saveUser($data,$actor);ck($get()['display_name']==='QA143 stale','fresh edit');});\ngroup('ADM-L454',function()use($admin,$actor,$pdo,$core){$tables=$pdo->query('SELECT id,name,table_number FROM cafe_tables ORDER BY id LIMIT 3')->fetchAll(PDO::FETCH_ASSOC);$draft=$tables[0];$pdo->prepare(\"INSERT INTO table_drafts(table_id,state,active_table_guard) VALUES(?,'active',?)\")->execute([$draft['id'],$draft['id']]);rejects(fn()=>$admin->saveTable($draft+['active'=>false],$actor),'table_live');$wait=$tables[1];$c=$core->businessClock()->assignment();$pdo->prepare(\"INSERT INTO waiter_calls(public_code,client_token,table_id,status,active_table_guard,business_date,business_shift_key,business_shift_label,business_cutoff_snapshot) VALUES('qa143-call','qa143-token',?,'new',?,?,?,?,?)\")->execute([$wait['id'],$wait['id'],$c['business_date'],$c['shift_key'],$c['shift_label'],$c['cutoff']]);rejects(fn()=>$admin->saveTable($wait+['active'=>false],$actor),'table_live');$admin->saveTable($tables[2]+['active'=>false],$actor);$q=$pdo->prepare('SELECT active FROM cafe_tables WHERE id=?');$q->execute([$tables[2]['id']]);ck((int)$q->fetchColumn()===0,'idle deactivated');});\ngroup('GUEST-L346',function()use($core,$actor,$dir,$pdo){$g=$core->guestContent();$file=$dir.'/test.png';$im=imagecreatetruecolor(256,256);imagefill($im,0,0,imagecolorallocate($im,22,150,80));imagepng($im,$file);imagedestroy($im);$r=$g->importUpload($file,'synthetic.png','',$actor);$key=$r['media_key'];$g->archiveMedia($key,$actor);$lock=fopen($dir.'/data/.guest-media-write.lock','c+b');ck(flock($lock,LOCK_EX|LOCK_NB),'external lock');try{rejects(fn()=>$g->garbageCollect($actor,false),'media_busy');rejects(fn()=>$g->importUpload($file,'synthetic.png','',$actor),'media_busy');}finally{flock($lock,LOCK_UN);fclose($lock);} $r=$g->importUpload($file,'synthetic.png','',$actor);ck(($r['restored']??false)&&$r['media_key']===$key,'restore same key');ck(!in_array($key,$g->garbageCollect($actor,false)['removed']),'active protected');$g->archiveMedia($key,$actor);ck(in_array($key,$g->garbageCollect($actor,false)['removed']),'archived removed');$r=$g->importUpload($file,'synthetic.png','',$actor);ck($r['media_key']===$key,'deterministic reupload');$q=$pdo->prepare('SELECT original_relpath FROM guest_media_assets WHERE media_key=? AND active=1');$q->execute([$key]);$master=$dir.'/data/guest-media/'.$q->fetchColumn();ck(hash_file('sha256',$master)===hash_file('sha256',$file),'verified master');});\ngroup('HELP-L567',function()use($core,$actor){$r=$core->globalSearch()->search('QA143',$actor,2);ck($r['count']===2&&$r['truncated']&&$r['provider_limit_reached'],'global and provider limits');$r=$core->globalSearch()->search('QA143',$actor,20);ck($r['provider_limit_reached'],'provider possible limit');});\nexit($fail?1:0);\nQAEOF\ncat > \"$RUNNER_TEMP/cp143-browser.cjs\" <<'QAEOF'\nconst {chromium}=require(process.env.RUNNER_TEMP+'/pw/node_modules/playwright');const fs=require('fs');const base='http://127.0.0.1:18765';let fail=0;\nasync function group(n,f){try{await f();console.log('GROUP PASS '+n)}catch(e){fail++;console.log('GROUP FAIL '+n+' '+e.stack)}}\nfunction ck(x,n){if(!x)throw Error(n);console.log('PASS '+n)}\nasync function login(p,user,pw){await p.goto(base+'/login.php');const h=p.locator('[data-login-selection]');await h.waitFor({state:'attached'});if(await h.inputValue()!==user){await p.locator('.sc-login-flow-change').click();await p.locator(`[data-login-account][data-account-key=\"${user}\"]`).click();await p.locator('.sc-login-stable-picker').waitFor({state:'hidden'});}await p.locator('input[name=password]').fill(pw);await Promise.all([p.waitForNavigation(),p.locator('form[data-login-form] button[type=submit]').click()]);}\n(async()=>{const b=await chromium.launch({channel:'chrome',headless:true});const dir=process.env.RUNNER_TEMP+'/cp143-screenshots';fs.mkdirSync(dir,{recursive:true});await group('REP-L281 HTTP',async()=>{const p=await b.newPage();try{await login(p,'qa-member-8','synthetic-member-only');for(const path of ['/reports/api.php?action=report','/reports/export.php','/reports/'])ck((await p.request.get(base+path)).status()===403,'staff-only blocked '+path);ck((await p.request.get(base+'/staff-consumption/')).status()===200,'own report module retained');await p.goto(base+'/staff-consumption/');await p.screenshot({path:dir+'/staff-report.png',fullPage:true});}finally{await p.close()}});await group('HELP-L567 browser',async()=>{const p=await b.newPage({viewport:{width:1280,height:900}});try{await login(p,'qa-target','synthetic-qa-admin-not-real');await p.goto(base+'/admin/');const input=p.locator('[data-global-search-input]');await input.fill('QA143');await p.getByText('\u0646\u0645\u0627\u06CC\u0634 \u0647\u0631 \u0645\u0646\u0628\u0639 \u0645\u062D\u062F\u0648\u062F \u0627\u0633\u062A',{exact:false}).waitFor({timeout:10000});await p.screenshot({path:dir+'/search-desktop.png',fullPage:true});await p.setViewportSize({width:390,height:844});await p.screenshot({path:dir+'/search-mobile.png',fullPage:true});ck((await p.request.get(base+'/reports/')).status()===200,'admin report retained');}finally{await p.close()}});await b.close();process.exitCode=fail?1:0})().catch(e=>{console.error(e);process.exitCode=1});\nQAEOF\nmkdir -p \"$RUNNER_TEMP/pw\"\nnpm install --prefix \"$RUNNER_TEMP/pw\" playwright@1.58.2 --no-audit --no-fund\n"
    - name: Run independent database and browser groups
      run: |
        set -uo pipefail
        cd "$RUNNER_TEMP"
        php cp143-test.php "$RUNNER_TEMP/local" 2>&1 | tee cp143-db-results.txt
        rc1=${PIPESTATUS[0]}
        PHP_CLI_SERVER_WORKERS=6 php -S 127.0.0.1:18765 -t "$RUNNER_TEMP/local/public" > cp143-local.log 2>&1 &
        pid=$!; trap 'kill "$pid" 2>/dev/null || true' EXIT
        sleep 2
        node cp143-browser.cjs 2>&1 | tee cp143-browser-results.txt
        rc2=${PIPESTATUS[0]}
        echo "Database=$rc1 Browser=$rc2"
        [ "$rc1" = 0 ] && [ "$rc2" = 0 ]
    - name: Capture synthetic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: SOKNA-CP143-GROUPED-QA
        path: |-
          ${{ runner.temp }}/cp143-*-results.txt
          ${{ runner.temp }}/cp143-screenshots/
          ${{ runner.temp }}/cp143-local.log
        retention-days: 1
        if-no-files-found: warn
