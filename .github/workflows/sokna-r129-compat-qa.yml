name: SOKNA R129 recovery evidence compatibility QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-native-compatibility:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3530811ab9117c6787a19a3a4186d23769425a6d
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - shell: pwsh
        run: |
          dotnet run --project qa/sokna-r129-compat/CompatProbe.csproj -c Release
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          dotnet run --project qa/sokna-r125-reconcile/PolicyProbe.csproj -c Release
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
          dotnet run --project qa/sokna-r125-reconcile/ArchiveIntegrationProbe.csproj -c Release
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Build actual standalone report binary
        shell: pwsh
        run: |
          dotnet publish windows/maintenance/src/Sokna.Maintenance.R125Preflight/Sokna.Maintenance.R125Preflight.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o "$env:RUNNER_TEMP/r129-report-payload"
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Build and execute exact TEMP-only read-only wrapper
        shell: pwsh
        run: |
          $iscc=@("${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe","$env:ProgramFiles/Inno Setup 6/ISCC.exe")|Where-Object{Test-Path $_}|Select-Object -First 1
          if(-not$iscc){choco install innosetup -y --no-progress;if($LASTEXITCODE-ne0){throw 'INNO_INSTALL_FAILED'};$iscc="${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"}
          & $iscc "/DPayloadRoot=$env:RUNNER_TEMP/r129-report-payload" "/DOutputDir=$env:RUNNER_TEMP/r129-report-dist" packaging/windows/installer/SOKNA-R129-ReadOnly-011-QA.iss
          if($LASTEXITCODE-ne0){throw 'READONLY_WRAPPER_COMPILE_FAILED'}
          $exe=Join-Path $env:RUNNER_TEMP 'r129-report-dist/SOKNA-R129-RECOVERY-READONLY-011-QA-NOT-PRODUCTION.exe'
          $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if("$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)"-ne'0.1.1.0'){throw 'READONLY_PHYSICAL_PE_VERSION'}
          $p=Start-Process $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-eq0){throw 'MISSING_PROOF_WRONGLY_ACCEPTED'}
          if(Get-Service SoknaMaintenanceSupervisor -ErrorAction SilentlyContinue){throw 'READONLY_TOOL_CREATED_SERVICE'}
          $file=Get-ChildItem ([Environment]::GetFolderPath('DesktopDirectory')) -Filter 'SOKNA-R125-READONLY-DB-PREFLIGHT-*.json'|Sort-Object LastWriteTime -Descending|Select-Object -First 1
          $doc=Get-Content $file.FullName -Raw|ConvertFrom-Json
          if($doc.status-ne'BLOCKED' -or $doc.ready_for_production_or_upgrade-ne$false -or $doc.database_schema_data_mutated-ne$false){throw 'READONLY_REPORT_SCOPE_INVALID'}
          Copy-Item $file.FullName (Join-Path $env:RUNNER_TEMP 'r129-report-dist/NEGATIVE-REPORT.json')
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $([IO.Path]::GetFileName($exe))"|Set-Content (Join-Path $env:RUNNER_TEMP 'r129-report-dist/SHA256SUMS.txt')
          @{source_commit=$env:GITHUB_SHA;sha256=$sha;read_only=$true;production_approved=$false;cafe_db_verified=$false}|ConvertTo-Json|Set-Content (Join-Path $env:RUNNER_TEMP 'r129-report-dist/BUILD-QA.json')
      - uses: actions/upload-artifact@v4
        with:
          name: r129-readonly-report-011-qa-no-host-approval
          path: ${{ runner.temp }}/r129-report-dist/*
          if-no-files-found: error
  mariadb-readonly-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env: {MARIADB_ROOT_PASSWORD: ci-root-only}
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3530811ab9117c6787a19a3a4186d23769425a6d
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq php-cli php-mysql mariadb-client
      - run: php -l windows/maintenance/src/Sokna.Maintenance.Core/RoutineLocalDatabase.php
      - run: python3 qa/sokna-r129-compat/test-live-ledger.py
        env: {SOKNA_SAFETY_DISPOSABLE: 'YES'}
  maintenance-0325-build:
    needs: [windows-native-compatibility, mariadb-readonly-boundaries]
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3530811ab9117c6787a19a3a4186d23769425a6d
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - name: 45 transaction, crash, rollback and lease cases
        shell: powershell
        run: |
          & ./qa/sokna-r129-compat/test-maintenance-components-v3.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - name: Publish actual three components
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'maintenance-0325'
          foreach($n in @('Sokna.Maintenance.Supervisor','Sokna.Maintenance.UpdateEngine','Sokna.Maintenance.RecoveryConsole')){
            dotnet publish "windows/maintenance/src/$n/$n.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o (Join-Path $root $n)
            if($LASTEXITCODE-ne0){throw 'COMPONENT_PUBLISH_FAILED'}
          }
          & ./packaging/windows/scripts/prepare-maintenance-components-v3.ps1 -RepoRoot $PWD.Path -Supervisor (Join-Path $root 'Sokna.Maintenance.Supervisor/SoknaMaintenanceSupervisor.exe') -Engine (Join-Path $root 'Sokna.Maintenance.UpdateEngine/SoknaMaintenanceUpdateEngine.exe') -RecoveryConsole (Join-Path $root 'Sokna.Maintenance.RecoveryConsole/SoknaMaintenanceRecoveryConsole.exe') -OutputRoot (Join-Path $root 'payload')
      - name: Compile and qualify exact installer
        shell: pwsh
        run: |
          $root=Join-Path $env:RUNNER_TEMP 'maintenance-0325'
          $iscc=@("${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe","$env:ProgramFiles/Inno Setup 6/ISCC.exe")|Where-Object{Test-Path $_}|Select-Object -First 1
          if(-not$iscc){choco install innosetup -y --no-progress;if($LASTEXITCODE-ne0){throw 'INNO_INSTALL_FAILED'};$iscc="${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"}
          & $iscc "/DPayloadRoot=$root/payload" "/DOutputDir=$root/dist" packaging/windows/installer/SOKNA-Maintenance-0325-QA.iss
          if($LASTEXITCODE-ne0){throw 'INSTALLER_COMPILE_FAILED'}
          $exe=Join-Path $root 'dist/SOKNA-Maintenance-0325-MultiBaseline-QA-NOT-PRODUCTION.exe'
          $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if("$($v.FileMajorPart).$($v.FileMinorPart).$($v.FileBuildPart).$($v.FilePrivatePart)"-ne'0.3.25.0'){throw 'INSTALLER_PE_VERSION'}
          $p=Start-Process $exe -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-') -Wait -PassThru
          if($p.ExitCode-eq0){throw 'UNKNOWN_HOST_ACCEPTED'}
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $([IO.Path]::GetFileName($exe))"|Set-Content (Join-Path $root 'dist/SHA256SUMS.txt')
          Copy-Item (Join-Path $root 'payload/maintenance-component-manifest-v2.json') (Join-Path $root 'dist/COMPONENT-MANIFEST.json')
          @{source_commit=$env:GITHUB_SHA;sha256=$sha;transaction_scenarios=45;production_approved=$false;physical_cafe_verified=$false}|ConvertTo-Json|Set-Content (Join-Path $root 'dist/BUILD-QA.json')
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-0325-built-qa-not-production
          path: ${{ runner.temp }}/maintenance-0325/dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-0325-exact-installer-engine
          path: |
            ${{ runner.temp }}/maintenance-0325/Sokna.Maintenance.UpdateEngine/SoknaMaintenanceUpdateEngine.exe
            ${{ runner.temp }}/maintenance-0325/dist/COMPONENT-MANIFEST.json
          if-no-files-found: error
  maintenance-0325-real-services:
    needs: maintenance-0325-build
    runs-on: windows-latest
    timeout-minutes: 35
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3530811ab9117c6787a19a3a4186d23769425a6d
      - uses: actions/checkout@v4
        with:
          ref: 3530811ab9117c6787a19a3a4186d23769425a6d
        with: {ref: b8b1cc4e91772692d92d6f7aa10b0657d2aa5427, path: old-0322-source}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with: {name: maintenance-0325-built-qa-not-production, path: dist}
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-0324-built-qa-not-production
          run-id: 42576660029
          github-token: ${{ github.token }}
          path: old-0324-artifact
      - name: Exact prior baseline binaries
        shell: pwsh
        run: |
          $old=Join-Path $env:RUNNER_TEMP 'old-0322'
          foreach($n in @('Sokna.Maintenance.Supervisor','Sokna.Maintenance.UpdateEngine','Sokna.Maintenance.RecoveryConsole')){
            dotnet publish "old-0322-source/windows/maintenance/src/$n/$n.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o (Join-Path $old $n)
            if($LASTEXITCODE-ne0){throw 'OLD_BASELINE_BUILD_FAILED'}
          }
          Invoke-WebRequest 'https://github.com/mobaraki20/SoknaCafeV3/releases/download/sokna-maintenance-r125-0323-qa-02dd6431a3fe/SOKNA-R125-Maintenance-0323-Three-Component-QA-NOT-PRODUCTION.exe' -OutFile "$env:RUNNER_TEMP/old-0323.exe" -TimeoutSec 180
          if((Get-FileHash "$env:RUNNER_TEMP/old-0323.exe" -Algorithm SHA256).Hash.ToLowerInvariant()-ne'3a4c6e1c09174bf79aa29115588a2f6ba8eddfa58929d54a61a528cbd4feca2a'){throw 'OLD_0323_HASH_MISMATCH'}
          if((Get-FileHash 'old-0324-artifact/SOKNA-Maintenance-0324-MultiBaseline-QA-NOT-PRODUCTION.exe' -Algorithm SHA256).Hash.ToLowerInvariant()-ne'7712cccc855dd55bd5956224db778cba67b825269e440642733097368a62db12'){throw 'OLD_0324_HASH_MISMATCH'}
      - name: Same exact EXE on three real services and next identity proof
        shell: pwsh
        run: |
          & ./qa/sokna-r129-compat/test-maintenance-real-installer-0325.ps1 -Installer (Join-Path $PWD.Path 'dist/SOKNA-Maintenance-0325-MultiBaseline-QA-NOT-PRODUCTION.exe') -ComponentManifest (Join-Path $PWD.Path 'dist/COMPONENT-MANIFEST.json') -BaselineRoot "$env:RUNNER_TEMP/old-0322" -Old0323Installer "$env:RUNNER_TEMP/old-0323.exe" -Old0324Installer (Join-Path $PWD.Path 'old-0324-artifact/SOKNA-Maintenance-0324-MultiBaseline-QA-NOT-PRODUCTION.exe') -Output (Join-Path $PWD.Path 'dist/REAL-SERVICE-QA.json')
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: maintenance-0325-three-real-baselines-no-field-approval
          path: dist/REAL-SERVICE-QA.json
          if-no-files-found: error
  exact-installer-engine-live-stack:
    needs: maintenance-0325-build
    runs-on: windows-latest
    timeout-minutes: 55
    env: {SOKNA_R149B_DISPOSABLE: 'YES'}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3530811ab9117c6787a19a3a4186d23769425a6d
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with:
          name: maintenance-0325-exact-installer-engine
          path: exact-engine
      - name: Exact installer Engine, native R129 qualification, two baselines and 12 fault cycles
        shell: pwsh
        run: |
          $engine=Get-ChildItem exact-engine -Recurse -Filter SoknaMaintenanceUpdateEngine.exe|Select-Object -First 1
          $manifest=Get-ChildItem exact-engine -Recurse -Filter COMPONENT-MANIFEST.json|Select-Object -First 1
          $env:SOKNA_TEST_INSTALLED_ENGINE_EXE=$engine.FullName
          $env:SOKNA_TEST_COMPONENT_MANIFEST=$manifest.FullName
          & ./qa/sokna-r149b/windows-r149b-activation.ps1
          if($LASTEXITCODE-ne0){exit $LASTEXITCODE}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: maintenance-0325-exact-engine-r129-12cycles-three-restores-no-field-approval
          path: ${{ runner.temp }}/sokna-r149b-windows-exact-e2e/artifacts/r149b-windows-cycles.json
          if-no-files-found: error
