name: Sokna R128 print columnar renderer QA
on:
  push:
    branches: [qa/sokna-r128-print-atlas-20261107]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-print-renderer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build exact Windows Print Agent Worker
        shell: pwsh
        run: dotnet build windows/print-agent/source/src/Sokna.PrintAgent.Worker/Sokna.PrintAgent.Worker.csproj -c Release --nologo
      - name: Worker regression tests
        shell: pwsh
        run: dotnet run --project windows/print-agent/source/tests/Sokna.PrintAgent.Worker.Tests/Sokna.PrintAgent.Worker.Tests.csproj -c Release
