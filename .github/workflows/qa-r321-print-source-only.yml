name: R321 Print Source Contract QA (no release)
on:
  push:
    branches:
      - 'qa/sokna-r321-print-station-order-global-20261121'
permissions:
  contents: read
jobs:
  php-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP source syntax
        run: |
          php -l apps/local-web/src/Domain/Printing/PrintService.php
          php -l apps/local-web/src/Domain/Printing/PrintTemplatePackageService.php
          php -l tests/r321-preparation-order-selftest.php
      - name: Station metadata and cross-station order regression
        run: php tests/r321-preparation-order-selftest.php
  print-agent-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compile Print Agent source only (no publish/no installer)
        working-directory: windows/print-agent/source
        run: dotnet build Sokna.PrintWorker.slnx -c Release
      - name: Render actual Print Agent receipts to QA-only images
        working-directory: windows/print-agent/source
        env:
          SOKNA_PRINT_QA_OUT: ${{ runner.temp }}\\sokna-r321-render-qa
        run: dotnet run --project tests/Sokna.PrintAgent.VisualAcceptance/Sokna.PrintAgent.VisualAcceptance.csproj -c Release
      - name: Attach renderer QA pixels only (no installer)
        uses: actions/upload-artifact@v4
        with:
          name: r321-print-agent-render-qa
          path: ${{ runner.temp }}\\sokna-r321-render-qa\\
          retention-days: 7
