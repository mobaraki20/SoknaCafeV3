name: Sokna CP133 candidate grouped marketing and pricing acceptance
permissions:
  contents: read
  actions: read
'on':
  push:
    branches:
    - qa/cp133-marketing-20261126
    paths:
    - .github/workflows/cp133-candidate.yml
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports:
        - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
    steps:
    - name: Reconstruct exact CP132 from pinned successful workflow
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\n/usr/bin/python3 - <<'PYCODE'\nimport os,pathlib,hashlib,urllib.request,subprocess,yaml\n\
        url='https://raw.githubusercontent.com/mobaraki20/SoknaCafeV3/739906e98dceecb8cc3c4a351a0108f774d55c55/.github/workflows/cp118-phase01-db.yml'\n\
        raw=urllib.request.urlopen(url,timeout=30).read(600000)\nassert hashlib.sha256(raw).hexdigest()=='bfa3af14d81c1726c172ba10cb2b0f1599d0aa80fd2debdd5361c0a949a3b9bf'\n\
        steps=yaml.safe_load(raw)['jobs']['database']['steps']\nend=next(i for i,s in enumerate(steps) if s['name']=='Apply\
        \ CP132 exact cumulative source')\nassert end==64, end\nfor step in steps[:end+1]:\n    assert 'run' in step and set(step)<=\
        \ {'name','run','env'}, step['name']\n    env=dict(os.environ)\n    marker=chr(36)+'{{'\n    cmd=step['run'].replace(marker+'\
        \ github.repository }}','mobaraki20/SoknaCafeV3')\n    assert marker not in cmd\n    print('Pinned source: '+step['name'],flush=True)\n\
        \    subprocess.run(['bash','-e','-o','pipefail','-c',cmd],env=env,check=True)\nPYCODE\n"
    - name: Apply exact candidate delta and verify both canonical sources
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\npython3 - <<'PYCODE'\nimport base64,zlib,json,pathlib,hashlib\nH=lambda\
        \ b:hashlib.sha256(b).hexdigest()\nraw=zlib.decompress(base64.b64decode(''))\n\
        assert H(raw)=='90d25a6d7563f2e4e1bd4655985edb5afddad6bde8afb00217b1b5b1058c013f'\nfor n,(before,after,edits) in json.loads(raw).items():\n\
        \ p=pathlib.Path(n);a=p.read_bytes();assert H(a)==before,n\n s=a.decode('utf-8')\n for i,j,t in reversed(edits):s=s[:i]+t+s[j:]\n\
        \ out=s.encode();assert H(out)==after,n;p.write_bytes(out)\n print('PASS exact delta',n)\nfor d,n,expected in [('local',625,'dabcc6c96db06da40ae598c2e092db5130595e20a533924cdd101556bdc087a4'),('public',258,'a831b8475bcfe673faec1df023abafe647cb9339ac8627470a734bb53f169859')]:\n\
        \ p=pathlib.Path(d);names=sorted(x.relative_to(p).as_posix() for x in p.rglob('*') if x.is_file());actual=H(''.join(n+'\\\
        0'+H((p/n).read_bytes())+'\\n' for n in names).encode());assert len(names)==n and actual==expected,(d,actual);print('PASS\
        \ canonical',d,actual)\nPYCODE\n"
    - name: Prepare cp133-local-db.php
      run: 'set -euo pipefail

        cat > "$RUNNER_TEMP/cp133-local-db.php" <<''QAEOF''

        <?php

        declare(strict_types=1);

        if(PHP_SAPI!==''cli''||getenv(''QA_DB_PASSWORD'')!==''synthetic-cp116-ci-only'')exit(2);

        $root=realpath($argv[1]);if($root===false||basename($root)!==''local'')exit(2);

        require $root.''/bootstrap.php'';

        require_once $root.''/src/Setup/BrowserSetupService.php'';

        use Sokna\Local\Core\{Migrations,Observability};

        use Sokna\Local\Domain\Recovery\{BusinessBackupService,RecoveryException,MediaSnapshotCodec};

        use Sokna\Local\Setup\BrowserSetupService;

        function connectQa(string $db=''''):PDO {if($db!==''''&&!in_array($db,[''sokna_cp119_a'',''sokna_cp119_b''],true))throw
        new RuntimeException(''not QA schema'');$p=new PDO(''mysql:host=127.0.0.1;port=3306;dbname=''.$db.'';charset=utf8mb4'',''root'',getenv(''QA_DB_PASSWORD''),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_EMULATE_PREPARES=>false]);$p->exec("SET
        time_zone = ''+03:30''");return $p;}

        function snapshotQa(PDO $p):array{$digests=[];foreach($p->query("SELECT TABLE_NAME FROM information_schema.TABLES
        WHERE TABLE_SCHEMA=DATABASE() AND TABLE_TYPE=''BASE TABLE'' ORDER BY TABLE_NAME")->fetchAll(PDO::FETCH_COLUMN) as
        $t){$rows=$p->query(''SELECT * FROM `''.str_replace(''`'',''``'',$t).''`'')->fetchAll(PDO::FETCH_ASSOC);$encoded=array_map(fn($r)=>json_encode($r,JSON_THROW_ON_ERROR|JSON_INVALID_UTF8_SUBSTITUTE),$rows);sort($encoded,SORT_STRING);$digests[$t]=hash(''sha256'',implode("\n",$encoded));}return
        $digests;}

        function check($ok,string $name):void {if(!$ok)throw new RuntimeException(''FAIL ''.$name);echo ''PASS ''.$name."\n";}

        function reject(BusinessBackupService $b,string $f,string $pass,string $code):void {try{$b->restoreEncryptedToEmptyTarget($f,$pass);throw
        new RuntimeException(''unexpected restore'');}catch(RecoveryException $e){if($e->errorCode!==$code)throw new RuntimeException(''expected
        ''.$code.'' got ''.$e->errorCode);}}

        $server=connectQa();$dir=sys_get_temp_dir().''/sokna-cp119-''.bin2hex(random_bytes(6));mkdir($dir,0700,true);

        $server->exec(''CREATE DATABASE sokna_cp119_b CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'');

        $setup=new BrowserSetupService(dirname($root),$root);$dataB=$dir.''/b'';

        try{$status=$setup->installNew([''data_dir''=>$dataB,''db''=>[''host''=>''127.0.0.1'',''port''=>''3306'',''name''=>''sokna_cp119_b'',''user''=>''root'',''pass''=>getenv(''QA_DB_PASSWORD'')],''admin_user''=>''qa-target'',''admin_password''=>''synthetic-qa-admin-not-real'',''cafe_name''=>''QA
        TARGET'',''table_count''=>2]);}catch(Throwable $e){echo ''setup failure ''.get_class($e).'' ''.$e->getMessage().''
        ''.json_encode($e->details??[])."\n";throw $e;}

        check(($status[''success'']??false)&&($status[''health''][''migrations_applied'']??0)===93,''actual_browser_setup_service_93_migrations'');

        $cfg=require dirname($root).''/config.php'';$core=sokna_local_bootstrap($cfg);$pdo=$core->database();$actor=$pdo->query("SELECT
        id,role FROM users WHERE username=''qa-target''")->fetch(PDO::FETCH_ASSOC);

        function deny(callable $f,string $code,string $name):void{try{$f();throw new RuntimeException(''unexpected success'');}catch(Throwable
        $e){check(($e->errorCode??'''')===$code,$name);}}

        $m=$core->marketing();

        function need(array $a,string $key,mixed $v):void{check(($a[$key]??null)===$v,$key);}

        for($i=1;$i<=231;$i++)$m->saveCampaign([''name''=>sprintf(''QA133 campaign %03d'',$i),''headline''=>''QA headline
        ''.$i,''body''=>''synthetic body'',''status''=>$i===1?''active'':''draft'',''public_visible''=>$i===1],$actor);

        for($i=1;$i<=52;$i++)$m->saveEvent([''title''=>sprintf(''QA133 event %03d'',$i),''description''=>''synthetic description'',''starts_at''=>''2030-04-01T10:00'',''ends_at''=>''2030-04-01T12:00'',''location_label''=>''QA
        cafe'',''capacity''=>''16'',''status''=>''scheduled'',''public_visible''=>true],$actor);

        $a=$m->snapshot();$b=$m->snapshot([''campaign_page''=>10,''event_page''=>3]);

        check($a[''campaign_page''][''total'']===231&&count($a[''campaigns''])===25&&$b[''campaign_page''][''page'']===10&&count($b[''campaigns''])===6,''MKT_L378_full_campaign_pagination'');

        check($a[''event_page''][''total'']===52&&count($a[''events''])===25&&count($b[''events''])===2,''MKT_L378_full_event_pagination'');

        check(!array_intersect(array_column($a[''campaigns''],''id''),array_column($b[''campaigns''],''id'')),''MKT_L371_pages_disjoint'');

        $f=$m->snapshot([''campaign_q''=>''QA133 campaign 001'',''campaign_visible''=>''1'',''campaign_status''=>''active'']);check($f[''campaign_page''][''total'']===1&&count($f[''campaigns''])===1,''MKT_L371_filter_old_record'');

        $c=$f[''campaigns''][0];$oldToken=$c[''edit_token''];$c[''headline'']=''QA edited headline'';$m->saveCampaign($c,$actor);$c[''headline'']=''QA
        stale overwritten'';deny(fn()=>$m->saveCampaign($c,$actor),''marketing_edit_conflict'',''MKT_L380_stale_campaign_rejected'');

        $c2=$m->snapshot([''campaign_q''=>''QA133 campaign 001''])[''campaigns''][0];check($c2[''headline'']===''QA edited
        headline''&&$c2[''edit_token'']!==$oldToken,''MKT_L380_preserve_campaign_edit'');

        $ev=$a[''events''][0];$ev[''title'']=''QA updated event'';$ev[''starts_at'']=''2030-04-01T10:00'';$ev[''ends_at'']=''2030-04-01T12:00'';$m->saveEvent($ev,$actor);deny(fn()=>$m->saveEvent($ev,$actor),''marketing_edit_conflict'',''MKT_L380_stale_event_rejected'');

        $ev2=$m->snapshot([''event_q''=>''QA updated event''])[''events''][0];check($ev2[''title'']===''QA updated event''&&$ev2[''window_state'']===''future'',''MKT_L372_future_window_independent_of_visibility'');

        $feed=$m->publicFeed();check(count(array_filter($feed[''campaigns''],fn($x)=>$x[''headline'']===''QA edited headline''))===1,''MKT_L372_active_campaign_guest_feed'');

        check(count(array_filter($feed[''campaigns''],fn($x)=>str_starts_with($x[''headline''],''QA headline'')))===0,''MKT_L372_draft_not_public'');

        deny(fn()=>$m->saveCampaign([''name''=>''bad'',''headline''=>''bad''],[''id''=>$actor[''id''],''role''=>''staff'']),''forbidden'',''MKT_admin_guard'');

        echo "CP133 MARKETING DB GROUP PASS\n";


        QAEOF

        '
    - name: Prepare cp133-browser.cjs
      run: 'set -euo pipefail

        cat > "$RUNNER_TEMP/cp133-browser.cjs" <<''QAEOF''

        const {chromium}=require(process.env.RUNNER_TEMP+''/pw/node_modules/playwright'');const fs=require(''fs''),path=require(''path''),assert=require(''assert/strict'');const
        shots=path.join(process.env.RUNNER_TEMP,''cp133-screenshots'');fs.mkdirSync(shots,{recursive:true});const failures=[];function
        ck(v,k){assert.ok(v,k);console.log(''PASS ''+k)}async function group(n,fn){try{await fn();console.log(''GROUP PASS
        ''+n)}catch(e){failures.push(n);console.log(''GROUP FAIL ''+n+'' ''+e.stack)}}

        (async()=>{const b=await chromium.launch({channel:''chrome'',headless:true});try{const local=''http://127.0.0.1:18765'',pub=''http://127.0.0.1:18766'';const
        shot=async(p,n)=>p.screenshot({path:path.join(shots,n+''.png''),animations:''disabled'',fullPage:false});const open=async(p,url)=>{p.setDefaultTimeout(12000);const
        r=await p.goto(url,{waitUntil:''domcontentloaded''});console.log(''HTTP ''+r.status()+'' ''+p.url());};const lc=await
        b.newContext({viewport:{width:1440,height:900},locale:''fa-IR''});const l=await lc.newPage();l.on(''pageerror'',e=>console.log(''LOCAL_ERROR
        ''+e.message));await open(l,local+''/login.php'');const a=l.locator(''[data-login-account][data-username="qa-target"]'');if(await
        a.isVisible())await a.click();else ck(await a.evaluate(e=>e.classList.contains(''is-selected'')),''qa_account_selected'');await
        l.locator(''input[name=password]'').fill(''synthetic-qa-admin-not-real'');await Promise.all([l.waitForNavigation(),l.locator(''form[data-login-form]
        button[type=submit]'').click()]);

        await group(''marketing-campaign-list'',async()=>{await open(l,local+''/marketing/'');const counter=l.locator(''[data-list-count=campaign]'');await
        l.waitForFunction(()=>document.querySelector(''[data-list-count=campaign]'').textContent.includes(''۲۳۱''));ck(await
        l.locator(''[data-campaign-list] tr'').count()===25,''marketing_first_page'');await shot(l,''marketing-campaign-desktop'');await
        l.locator(''[data-list-next=campaign]'').click();await l.waitForFunction(()=>document.querySelector(''[data-list-count=campaign]'').textContent.includes(''صفحه
        ۲''));ck(await l.locator(''[data-campaign-list] tr'').count()===25,''marketing_second_page'');await l.locator(''[data-list-q=campaign]'').fill(''QA133
        campaign 001'');await l.locator(''[data-list-status=campaign]'').selectOption(''active'');await l.locator(''[data-list-visible=campaign]'').selectOption(''1'');await
        l.locator(''[data-list-apply=campaign]'').click();await l.locator(''[data-campaign-list] tr'').filter({hasText:''QA
        edited headline''}).waitFor();ck(await l.locator(''[data-campaign-list] tr'').count()===1,''marketing_old_filtered'');await
        l.setViewportSize({width:390,height:844});await shot(l,''marketing-campaign-mobile'');await l.locator(''[data-campaign-list]
        button'').click();await l.locator(''[data-campaign-form]'').waitFor();ck((await l.locator(''[data-campaign-form] input[name=edit_token]'').inputValue()).length===64,''marketing_edit_token_in_form'');await
        shot(l,''marketing-editor-mobile'');await l.locator(''[data-cancel-campaign]'').first().click();await l.locator(''[data-campaign-editor]'').waitFor({state:''hidden''});await
        l.setViewportSize({width:1440,height:900});await l.locator(''[data-tab=events]'').click();await l.locator(''[data-event-list]
        tr'').first().waitFor();ck(await l.locator(''[data-event-list] tr'').count()===25,''marketing_event_page'');await
        shot(l,''marketing-events-desktop'');await l.setViewportSize({width:390,height:844});await shot(l,''marketing-events-mobile'');});

        await group(''pricing-display'',async()=>{await l.route(''**/reports/api.php?*'',route=>{const u=new URL(route.request().url());if(u.searchParams.get(''action'')!==''pricing'')return
        route.continue();return route.fulfill({status:200,contentType:''application/json'',body:JSON.stringify({success:true,pricing:{items:[{name:''QA
        item 123'',sku:''SKU123'',variant_label:''QA'',category_name:''QA'',price:500,ingredient_cost:100,food_cost_percent:20,price_minus_ingredients:400,cost_status:''known'',oldest_cost_updated_at:''2026-11-26
        12:00:00''}]}})});});await open(l,local+''/reports/?focus=pricing'');const tab=l.locator(''#report-tab-pricing'');if(await
        tab.isVisible())await tab.click();await l.locator(''[data-pricing-rows] tr'').filter({hasText:''QA item 123''}).waitFor();await
        l.locator(''[data-pricing-search]'').fill(''۱۲۳'');ck((await l.locator(''[data-pricing-rows] tr'').first().textContent()).includes(''QA
        item 123''),''pricing_fa_digit_search'');await l.locator(''[data-pricing-search]'').fill(''١٢٣'');ck((await l.locator(''[data-pricing-rows]
        tr'').first().textContent()).includes(''QA item 123''),''pricing_ar_digit_search'');ck((await l.locator(''[data-pricing-rows]
        tr td'').last().textContent()).includes(''۱۴۰۵/۰۹/۰۵''),''pricing_persian_basis_date'');await shot(l,''pricing-mobile'');});

        if(failures.length)throw Error(''Failed groups: ''+failures.join('',''));console.log(''CP133 BROWSER GROUPS PASS'');}finally{await
        b.close()}})().catch(e=>{console.error(e);process.exitCode=1});


        QAEOF

        '
    - name: MariaDB marketing acceptance
      run: 'set -euo pipefail

        cd "$RUNNER_TEMP"

        php cp133-local-db.php "$RUNNER_TEMP/local"

        '
    - name: Install browser driver
      run: 'set -euo pipefail

        npm install --prefix "$RUNNER_TEMP/pw" playwright@1.51.1 --no-audit --no-fund

        '
    - name: Real Local browser marketing and pricing groups
      run: 'set -euo pipefail

        cd "$RUNNER_TEMP"

        PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:18765 -t "$RUNNER_TEMP/local/public" > cp133-local-http.log 2>&1 &

        local_pid=$!

        trap ''kill "$local_pid" 2>/dev/null || true; tail -35 cp133-local-http.log'' EXIT

        sleep 2

        node cp133-browser.cjs

        '
    - name: Capture synthetic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: SOKNA-CP133-UI-QA
        path: ${{ runner.temp }}/cp133-screenshots/*.png
        retention-days: 1
        if-no-files-found: warn
