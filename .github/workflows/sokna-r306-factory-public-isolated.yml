name: SOKNA R306 PUBLIC — isolated central factory original ZIP registration
on:
  push:
    branches: [qa/sokna-emergency-gate-pass28-20261123]
    paths: ['.github/workflows/sokna-r306-factory-public-isolated.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prepare-isolated-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-R306-EXACT-LOCAL-PUBLIC-CANDIDATES-PREFLIGHT
          run-id: 44723958829
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r306-original
      - name: Verify independent Local/Public CI receipt and PUBLIC source ZIP without rebuilding
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/44723958829/jobs?per_page=100&filter=all" > "$RUNNER_TEMP/r306-producer-jobs.json"
          python3 - <<'PYCODE'
          import pathlib,hashlib,json,os,shutil
          t=pathlib.Path(os.environ['RUNNER_TEMP']);s=t/'r306-original'
          jobs=json.loads((t/'r306-producer-jobs.json').read_text())['jobs']
          names=['byte-identical-build','finance-mariadb','public-emergency-actual-http','native-windows-exact-activation','final-decision']
          latest={}
          for j in jobs:
            n=j.get('name');k=(j.get('run_attempt',0),j.get('id',0))
            if n in names and (n not in latest or k>latest[n][0]):latest[n]=(k,j.get('status'),j.get('conclusion'))
          assert set(names)==set(latest),latest
          assert all(latest[n][1]=='completed' and latest[n][2]=='success' for n in names),latest
          name='SOKNA-R306-PUBLIC-35IN-EMERGENCY-PREFLIGHT.zip';digest='e2d78030a7246103a1b4ae2b28409093ebf8e61d44abc3739d73d0ac10b9fe51';version='3.0.0-g3.6-workspace.35in-r306-local-public-ui-parity';component='public';source='3055050385f5e3133e86bd58248e4935c5dd378826b371036ef35229734afe27';artifact='SOKNA-R306-PUBLIC-ORIGINAL-ZIP-FACTORY-SOURCE'
          found=list(s.rglob(name));assert len(found)==1,found
          orig=found[0];assert hashlib.sha256(orig.read_bytes()).hexdigest()==digest
          proof=list(s.rglob('R306-EXACT-CANDIDATE-VERIFY.json'));assert len(proof)==1
          pb=proof[0].read_bytes(); ph=hashlib.sha256(pb).hexdigest()
          receipt={'schema':'sokna-r306-disposable-qa-ci-v1','producer_run':44723958829,'all_disposable_checks_pass':True,'checks':{n:latest[n][2] for n in names},'production_authorized':False,'field_install_authorized':False}
          cb=(json.dumps(receipt,sort_keys=True,ensure_ascii=False,indent=2)+'\n').encode()
          folder=pathlib.Path('r306-factory')/component;folder.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(orig,folder/name)
          (folder/'R306-EXACT-CANDIDATE-VERIFY.json').write_bytes(pb)
          (folder/'R306-DISPOSABLE-CI-RECEIPT.json').write_bytes(cb)
          contract={'schema':'sokna-candidate-contract-v1','component':component,'producer':{'run_id':'same_run','artifact':artifact},'source_authority':{'approved_checkpoint':'R306_EXACT_R301_LOCAL_R304_PUBLIC_44723958829','source_sha256':source},'packages':[{'file':name,'sha256':digest,'kind':('local-update' if component=='local' else 'public-update'),'component':component,'version':version}], 'supporting_files':[{'file':'R306-EXACT-CANDIDATE-VERIFY.json','sha256':ph},{'file':'R306-DISPOSABLE-CI-RECEIPT.json','sha256':hashlib.sha256(cb).hexdigest()}], 'production_authorized':False}
          (folder/'candidate-contract.json').write_text(json.dumps(contract,ensure_ascii=False,sort_keys=True,indent=2)+'\n')
          print('R306_FACTORY_ORIGINAL_SHA_VERIFIED_NO_REBUILD',component,digest)
          PYCODE
      - name: Mandatory QA Emergency protected package gate before factory artifact registration
        shell: bash
        run: |
          set -euo pipefail
          python3 qa/emergency_release_gate.py release \\
            --release-archive r306-factory/public/SOKNA-R306-PUBLIC-35IN-EMERGENCY-PREFLIGHT.zip \\
            --output "$RUNNER_TEMP/emergency-factory-veto.json"
          echo 'EMERGENCY_QA_GATE_PASSED__FIELD_AUTHORIZATION_STILL_FALSE'
      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-R306-PUBLIC-ORIGINAL-ZIP-FACTORY-SOURCE
          path: r306-factory/public/*
          if-no-files-found: error
  factory-public:
    needs: prepare-isolated-source
    uses: mobaraki20/SoknaCafeV3/.github/workflows/sokna-release-factory.yml@main
    permissions:
      contents: read
      actions: read
    with:
      track: registered-candidate
      candidate_contract_path: 'artifact:candidate-contract.json'
      candidate_run_id: ${{ github.run_id }}
      candidate_artifact: SOKNA-R306-PUBLIC-ORIGINAL-ZIP-FACTORY-SOURCE
