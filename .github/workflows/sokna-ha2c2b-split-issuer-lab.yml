name: SOKNA HA2C2B Split Issuer Real MariaDB Lab
on:
  push:
    branches: [test/ha2c2b-split-issuer-ci]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sokna-ha2c2b-${{ github.ref }}
  cancel-in-progress: false
jobs:
  split-issuer:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: qa/ha2c2b
    steps:
      - uses: actions/checkout@v4
      - name: Lint and verify isolation spec
        run: |
          for f in source/*.php tests/*.php; do php -l "$f"; done
          docker compose version
      - name: Run separate issuer and consumer containers with two MariaDB servers
        run: bash ./run_lab.sh
      - name: Upload sanitized non-production lab report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sokna-ha2c2b-split-issuer-evidence
          path: qa/ha2c2b/ci-artifacts/ha2c2b_split_issuer.json
          if-no-files-found: warn
          retention-days: 7
