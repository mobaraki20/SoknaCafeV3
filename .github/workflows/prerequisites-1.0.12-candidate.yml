name: Qualify Prerequisites 1.0.12 Candidate

on:
  push:
    branches:
      - work/prerequisites-self-service-1.0.12-20261003
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-candidate:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Static legacy and v2 contracts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tests/g7-infrastructure-prerequisites-gate.py
          if($LASTEXITCODE-ne0){throw 'Legacy G7 contract failed'}
          python tests/prerequisites-v2-contract.py
          if($LASTEXITCODE-ne0){throw 'Prerequisites v2 contract failed'}

      - name: Publish hardened manager
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          dotnet publish packaging/prerequisites/setup-ui/Sokna.Prerequisites.Setup.csproj -c Release -o packaging/prerequisites/out-smoke
          if($LASTEXITCODE-ne0){throw 'Prerequisites UI build failed'}
          $exe=(Resolve-Path packaging/prerequisites/out-smoke/SoknaPrerequisitesSetup.exe).Path
          $expected=(Get-Content packaging/prerequisites/VERSION.txt -Raw).Trim()
          $actual=([Diagnostics.FileVersionInfo]::GetVersionInfo($exe).ProductVersion).Split('+')[0]
          if($actual-ne$expected){throw "ProductVersion mismatch: $actual != $expected"}
          $p=Start-Process -FilePath $exe -ArgumentList '--self-test-prerequisites-v2' -Wait -PassThru
          if($p.ExitCode-ne0){throw "V2 self-test failed: $($p.ExitCode)"}
          $p=Start-Process -FilePath $exe -ArgumentList '--self-test-endpoint-port' -Wait -PassThru
          if($p.ExitCode-ne0){throw "Endpoint self-test failed: $($p.ExitCode)"}
          $p=Start-Process -FilePath $exe -ArgumentList '--self-test-infrastructure-ownership' -Wait -PassThru
          if($p.ExitCode-ne0){throw "Ownership self-test failed: $($p.ExitCode)"}

      - name: UI layout audit and screenshots
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path packaging/prerequisites/out-smoke/SoknaPrerequisitesSetup.exe).Path
          $shots=Join-Path $PWD 'packaging\prerequisites\qualification\screenshots'
          New-Item -ItemType Directory -Path $shots -Force|Out-Null
          foreach($size in @(@(960,650),@(1100,660),@(1280,720))){
            $w=$size[0];$h=$size[1]
            $p=Start-Process -FilePath $exe -ArgumentList @('--audit-prerequisites-ui',"$w","$h") -Wait -PassThru
            if($p.ExitCode-ne0){throw "UI audit ${w}x${h} failed: $($p.ExitCode)"}
            $png=Join-Path $shots "prerequisites-${w}x${h}.png"
            $p=Start-Process -FilePath $exe -ArgumentList @('--render-prerequisites-ui',$png,"$w","$h") -Wait -PassThru
            if($p.ExitCode-ne0){
              $bytes=if(Test-Path $png){(Get-Item $png).Length}else{0}
              Write-Host "UI render evidence: ${w}x${h}; exit=$($p.ExitCode); bytes=$bytes"
              throw "UI render ${w}x${h} failed: $($p.ExitCode)"
            }
            if((Get-Item $png).Length-lt20000){throw "UI screenshot is suspiciously small: $png"}
          }

      - name: Preserve UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sokna-prerequisites-1.0.12-ui-evidence-${{ github.sha }}
          path: packaging/prerequisites/qualification/screenshots/*.png
          if-no-files-found: warn
          retention-days: 7

      - name: Verify inherited core runtime evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          # Run 37101874146 at this baseline passed both real Apache/PHP and
          # Apache Windows-service+sodium regressions. Only presentation, its contract,
          # qualification workflow, changelog and engineering documentation may differ.
          $baseline='078eefa344118d1a5256d24fb026864f09796dd8'
          git fetch origin $baseline --depth=1
          if($LASTEXITCODE-ne0){throw 'Unable to fetch core-regression baseline'}
          $changed=@(git diff --name-only $baseline HEAD)
          $allowed=@(
            'packaging/prerequisites/setup-ui/UiCompatibilityPatch.cs',
            'packaging/prerequisites/setup-ui/DashboardCompactnessPatch.cs',
            'tests/prerequisites-v2-contract.py',
            '.github/workflows/prerequisites-1.0.12-candidate.yml',
            'packaging/prerequisites/CHANGELOG-1.0.12.md',
            'packaging/prerequisites/PREREQUISITES_UI_STANDARD_1_0_12_FA.md',
            'packaging/prerequisites/QUALIFICATION_UI_ACCEPTANCE_1_0_12_FA.md',
            'docs/engineering/PREREQUISITES_INSTALLER_ENGINEERING_PLAYBOOK_1_0_12_FA.md'
          )
          $unexpected=@($changed|Where-Object{$allowed -notcontains $_})
          if($unexpected.Count-gt0){throw "Core/runtime files changed after qualified baseline; inherited evidence is invalid: $($unexpected -join ', ')"}
          New-Item -ItemType Directory -Path packaging/prerequisites/qualification -Force|Out-Null
          @(
            'CORE_REGRESSION_INHERITANCE=PASS',
            "baseline_commit=$baseline",
            'baseline_run=37101874146',
            'real_apache_php=PASS (inherited; core unchanged)',
            'apache_service_sodium=PASS (inherited; core unchanged)',
            'changed_files:',
            ($changed|ForEach-Object{"- $_"})
          )|Set-Content packaging/prerequisites/qualification/core-regression-inheritance.txt -Encoding UTF8

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build standalone candidate
        shell: pwsh
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          $ErrorActionPreference='Stop'
          & packaging/prerequisites/scripts/build-installer.ps1 -RepoRoot (Resolve-Path .).Path
          if($LASTEXITCODE-ne0){throw 'Installer build failed'}
          $v=(Get-Content packaging/prerequisites/VERSION.txt -Raw).Trim()
          $setup="packaging/prerequisites/out/installer/SOKNA-Prerequisites-Setup-$v.exe"
          if(-not(Test-Path $setup)){throw "Installer missing: $setup"}
          $index=Get-Content packaging/prerequisites/out/installer/artifact-index.json -Raw|ConvertFrom-Json
          if($index.source_commit-ne'${{ github.sha }}'){throw "Artifact source commit mismatch: $($index.source_commit)"}

      - name: Installer upgrade repair downgrade lifecycle
        shell: pwsh
        run: tests/prerequisites-v2-installer-lifecycle.ps1

      - name: Write qualification report
        shell: pwsh
        run: |
          $v=(Get-Content packaging/prerequisites/VERSION.txt -Raw).Trim()
          $index=Get-Content packaging/prerequisites/out/installer/artifact-index.json -Raw|ConvertFrom-Json
          @(
            'SOKNA Prerequisites candidate qualification',
            "version=$v",
            "source_commit=${{ github.sha }}",
            "installer_sha256=$($index.sha256)",
            "release_lock_sha256=$($index.release_lock_sha256)",
            "infrastructure_policy_sha256=$($index.infrastructure_policy_sha256)",
            'legacy_g7_contract=PASS',
            'v2_contract=PASS',
            'v2_selftest=PASS',
            'ui_audit=PASS',
            'real_apache_php=PASS (inherited from run 37101874146; core unchanged)',
            'apache_service_sodium=PASS (inherited from run 37101874146; core unchanged)',
            'upgrade_repair_downgrade=PASS'
          )|Set-Content packaging/prerequisites/out/installer/qualification-report.txt -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: sokna-prerequisites-1.0.12-candidate-${{ github.sha }}
          path: |
            packaging/prerequisites/out/installer/SOKNA-Prerequisites-Setup-1.0.12.exe
            packaging/prerequisites/out/installer/artifact-index.json
            packaging/prerequisites/out/installer/qualification-report.txt
            packaging/prerequisites/qualification/core-regression-inheritance.txt
            packaging/prerequisites/qualification/screenshots/*.png
          if-no-files-found: error
          retention-days: 30
