name: R92 Dashboard CSP and open issue review
on:
  push:
    branches: [work/r92-dashboard-20261102]
    paths: [release/r92/**, .github/workflows/r92-dashboard.yml]
permissions:
  contents: write
concurrency:
  group: r92-dashboard
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 48080b646766c4bcdcb9cd7675de32ddc7669380
          path: app-baselines
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct exact installed Local and Public bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/r92/baseline
          gh release download sokna-r91-windows-web-home-cafe-uat-20261102 --repo "$GITHUB_REPOSITORY" --dir release/r92/baseline -p SOKNA-LOCAL-UNIVERSAL-UPDATE.zip -p SOKNA-PUBLIC-UNIVERSAL-UPDATE.zip
          python3 release/r92/prepare.py
          sudo apt-get update -qq && sudo apt-get install -y php-cli php-zip
          for mode in before after; do for kind in local public; do php release/r92/render.php release/r92/build/$mode/$kind release/r92/build/$mode/$kind/chart.html $kind; done; done
      - name: Real Chromium regression under unchanged production CSP
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node release/r92/browser.cjs
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build coherent universal packages and validate native Local baselines
        run: |
          python3 release/r92/package.py
          dotnet run --project release/r92/native/Native.csproj -c Release -- release/r92/build/dist/SOKNA-LOCAL-UNIVERSAL-UPDATE.zip release/r92/build/native.json
          php -l release/r92/build/after/local/resources/shared-staff-ui/dashboard-workspace.php
          php -l release/r92/build/after/public/resources/shared-staff-ui/dashboard-workspace.php
          mkdir -p release/r92/build/lifecycle/current release/r92/build/lifecycle/source
          cp -r release/r92/build/before/public release/r92/build/lifecycle/current/public
          cp -r release/r92/build/before/local release/r92/build/lifecycle/source/local
          php app-baselines/release/r89/tests/public-lifecycle.php release/r92/build/lifecycle release/r92/build/dist current routine > release/r92/build/public-routine.json
          php app-baselines/release/r89/tests/public-lifecycle.php release/r92/build/lifecycle release/r92/build/dist current emergency > release/r92/build/public-emergency.json
      - name: Assemble verified evidence
        run: python3 release/r92/finalize.py
      - name: Publish tested Local and Public chart correction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/work/r92-dashboard-20261102" --jq .object.sha)
          test "$current" = "$GITHUB_SHA"
          gh release create local-public-r92-dashboard-csp-uat-20261102 release/r92/build/dist/SOKNA-LOCAL-UNIVERSAL-UPDATE.zip release/r92/build/dist/SOKNA-PUBLIC-UNIVERSAL-UPDATE.zip release/r92/build/dist/SHA256SUMS.txt release/r92/build/dist/PACKAGE-VERIFICATION.json release/r92/build/dist/QA-RESULTS.json release/r92/build/dist/R92-QA-EVIDENCE.zip release/r92/build/dist/REPORT-FA.md --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false --title "SOKNA — CSP-compatible dashboard sales trend" --notes-file release/r92/build/dist/REPORT-FA.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r92-browser-evidence
          path: |
            release/r92/build/*.json
            release/r92/build/*.png
