name: SOKNA C2 controlled incremental universal release
on:
  push:
    branches: [qa/sokna-consolidated-release-factory-20261124]
    paths: ['.github/workflows/sokna-c2-controlled-release.yml','qa/sokna-request-c2/**']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  freeze:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE
          run-id: 45363732321
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/local
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-PUBLIC-35IP-CONTROLLED-OPERATOR-RELEASE
          run-id: 45366749067
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/public
      - run: python3 qa/sokna-request-c2/freeze.py
      - uses: actions/upload-artifact@v4
        with:
          name: C2-FROZEN-DO-NOT-INSTALL
          path: frozen/*
          if-no-files-found: error
  native:
    needs: freeze
    name: native-${{ matrix.origin }}-${{ matrix.fault }}
    runs-on: windows-2022
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        include:
          - {origin: R301, fault: none, run: '44561325048', artifact: SOKNA-R301-LOCAL-CONTROLLED-INSTALL-EXACT-ARTIFACT, file: SOKNA-R301-LOCAL-231FS-PUBLIC-MOVE-CONTROLLED-INSTALL.zip}
          - {origin: R304, fault: none, run: '44639218881', artifact: SOKNA-R304-EXACT-CANDIDATES-REQUIRE-ONSITE-PREFLIGHT, file: SOKNA-R304-LOCAL-231FU-NATIVE-CANDIDATE-NOT-FIELD.zip}
          - {origin: R306, fault: none, run: '44723958829', artifact: SOKNA-R306-EXACT-LOCAL-PUBLIC-CANDIDATES-PREFLIGHT, file: SOKNA-R306-LOCAL-231FV-CONTROLLED-PREFLIGHT.zip}
          - {origin: R307, fault: none, run: '44730988488', artifact: SOKNA-R307-LOCAL-231FW-EXACT-CANDIDATE, file: SOKNA-R307-LOCAL-231FW-FROM-231FV-CONTROLLED-PREFLIGHT.zip}
          - {origin: R3, fault: none, run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: APACHE_STOPPED, run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: DATABASE_BACKUP_VERIFIED, run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: DATABASE_FORWARD_INTENT, run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: POINTER_SWITCHED, run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
          - {origin: R3, fault: COMMITTED, run: '45363732321', artifact: SOKNA-LOCAL-231GB-CONTROLLED-OPERATOR-RELEASE, file: SOKNA-LOCAL-231GB-UNIVERSAL-UPDATE.zip}
    env:
      SOKNA_R186_CI_ONLY: 'YES'
      SOKNA_BASE_LEDGER: ${{ matrix.origin == 'R3' && '90' || '83' }}
      SOKNA_ORIGIN: ${{ matrix.origin }}
      SOKNA_FAULT: ${{ matrix.fault }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: qa/sokna-r278-rial-persistent-settings-20261118
          path: native-src
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@v4
        with:
          name: C2-FROZEN-DO-NOT-INSTALL
          path: ${{ runner.temp }}/current
      - name: Build byte-identical quarantined candidate and test real native engine
        shell: pwsh
        env:
          BASE_NAME: ${{ matrix.file }}
        run: |
          $ErrorActionPreference='Stop'
          $base=Get-ChildItem "$env:RUNNER_TEMP/baseline" -Recurse -Filter $env:BASE_NAME | Select-Object -First 1
          $target=Get-ChildItem "$env:RUNNER_TEMP/current" -Recurse -Filter 'LOCAL-C2-FROZEN.zip' | Select-Object -First 1
          if(!$base -or !$target){throw 'PINNED_ARCHIVE_NOT_PRESENT'}
          $env:SOKNA_BASELINE_ZIP=$base.FullName
          $env:SOKNA_CURRENT_QA_ZIP=$target.FullName
          python qa/sokna-request-c2/prepare_native.py
          if($LASTEXITCODE-ne0){throw 'NATIVE_MATRIX_PREPARATION_FAILED'}
          $env:SOKNA_MATRIX_TARGET_ZIP=$target.FullName
          python packaging/windows/release-gates/check_local_release_set.py $env:SOKNA_MATRIX_TARGET_ZIP --require-installable
          if($LASTEXITCODE-ne0){throw 'NATIVE_MATRIX_FORMAT_FAILED'}
          Push-Location native-src
          try {
            & (Join-Path $env:RUNNER_TEMP 'native-matrix.ps1')
            if($LASTEXITCODE-ne0){throw 'NATIVE_MATRIX_EXECUTION_FAILED'}
          } finally {Pop-Location}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: SOKNA-C2-NATIVE-${{ matrix.origin }}-${{ matrix.fault }}-RECEIPT
          path: ${{ runner.temp }}/matrix-receipt.json
          if-no-files-found: error
          retention-days: 90
  integration:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable-batch-b-ci
          MARIADB_DATABASE: sokna_ci_batch_b
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, mbstring, zip, curl, gd
      - uses: actions/download-artifact@v4
        with:
          name: C2-FROZEN-DO-NOT-INSTALL
          path: ${{ runner.temp }}/frozen
      - name: Run actual migration 91, finance and inventory on frozen payload
        env:
          SOKNA_CI_DB_PASS: disposable-batch-b-ci
        run: |
          mkdir -p "$RUNNER_TEMP/local"
          unzip -q "$RUNNER_TEMP/frozen/LOCAL-C2-WEB.zip" -d "$RUNNER_TEMP/local"
          php qa/sokna-final-20261124/test_mariadb_exact_setup.php "$RUNNER_TEMP/local" sokna_ci_batch_b setup 0091_verified_purchase_unit_reconciliation
          php qa/sokna-request-c/test_finance_inventory.php
          php qa/sokna-request-c2/report_check.php
  public-host-gate:
    needs: freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: sokna-disposable-public-host-ci
          MARIADB_DATABASE: sokna_ci_host
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: C2-FROZEN-DO-NOT-INSTALL
          path: ${{ runner.temp }}/frozen
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-PUBLIC-35IP-CONTROLLED-OPERATOR-RELEASE
          run-id: 45366749067
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published35ip
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-PUBLIC-35IO-CONTROLLED-OPERATOR-RELEASE
          run-id: 45363984970
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/published35io
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-R306-EXACT-LOCAL-PUBLIC-CANDIDATES-PREFLIGHT
          run-id: 44723958829
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-R304-EXACT-CANDIDATES-REQUIRE-ONSITE-PREFLIGHT
          run-id: 44639218881
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/r304
      - name: Reconstruct exact frozen Public hosts
        run: |
          sudo install -d -o "$(id -un)" -g "$(id -gn)" -m 0755 /var/www/sokna-public-host-gate
          python3 qa/sokna-request-c2/public_hosts.py
      - name: Disposable real Apache/PHP with rewrite and MariaDB extensions
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y apache2 libapache2-mod-php8.3 php8.3-cli php8.3-mysql php8.3-zip php8.3-mbstring
          sudo a2enmod rewrite headers php8.3
          printf 'upload_max_filesize=64M\npost_max_size=72M\n' | sudo tee /etc/php/8.3/apache2/conf.d/99-sokna-ci-upload.ini >/dev/null
          sudo chown -R www-data:www-data /var/www/sokna-public-host-gate
          for row in '18080 root' '18081 sub' '18082 upgrade' '18083 older' '18084 browser306' '18085 current' '18086 latest'; do
            read -r port name <<< "$row"
            doc="/var/www/sokna-public-host-gate/$name/webroot"
            printf 'Listen 127.0.0.1:%s\n<VirtualHost 127.0.0.1:%s>\nDocumentRoot %s\n<Directory %s>\nOptions FollowSymLinks\nAllowOverride All\nRequire local\n</Directory>\n</VirtualHost>\n' "$port" "$port" "$doc" "$doc" | sudo tee "/etc/apache2/conf-enabled/sokna-ci-$name.conf" >/dev/null
          done
          sudo apache2ctl configtest
          sudo service apache2 restart
          sudo apache2ctl -S
          curl --fail --silent --show-error --include http://127.0.0.1:18080/__sokna_route_probe__
      - name: Actual Setup status, rewrite, install, pairing, MariaDB readback and duplicate-install rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request,urllib.error,http.cookiejar,json,pathlib
          work=pathlib.Path('/var/www/sokna-public-host-gate');c=json.loads((work/'contract.json').read_text())
          for port,name,base in [(18080,'root',''),(18081,'sub','/public/menu'),(18082,'upgrade',''),(18083,'older','/public/menu'),(18084,'browser306',''),(18085,'current','/public'),(18086,'latest','/public')]:
              origin=f'http://127.0.0.1:{port}{base}'
              op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
              def get(path):
                  try:
                      with op.open(origin+path,timeout=20) as r:return r.status,r.read(),r.headers
                  except urllib.error.HTTPError as e:
                      raise RuntimeError((name,path,e.code,e.read(1000).decode('utf-8','replace'))) from e
              def post(action,body,want=200):
                  req=urllib.request.Request(origin+'/setup/api.php?action='+action,json.dumps(body).encode(),{'Content-Type':'application/json'})
                  try:
                      with op.open(req,timeout=30) as r:code=r.status; data=json.load(r)
                  except urllib.error.HTTPError as e:code=e.code;data=json.load(e)
                  assert code==want,(name,action,code,data.get('code'))
                  return data
              code,_,hdr=get('/__sokna_route_probe__');assert code==204 and hdr.get('X-Sokna-Route-Probe')=='ok'
              if name not in ('upgrade','older','browser306','current','latest'):
                  code,html,_=get('/setup/index.php');assert code==200 and b'<!doctype html>' in html.lower()
              _,raw,_=get('/setup/api.php?action=status');j=json.loads(raw);assert j['success'] and not j['setup']['installed'] and j['setup']['base_path']==base and j['preflight']['ok']
              body={'csrf':j['csrf'],'db':{'host':'127.0.0.1','port':'3306','name':'sokna_ci_'+name,'user':'root','pass':'sokna-disposable-public-host-ci'},'create_database':True,'routing_probe_ok':True,'owner_password':'disposable-owner-CI-only-20261124','emergency_password':'disposable-emergency-CI-only-20261124','storage_dir':'storage'}
              installed=post('install',body);assert installed['success'] and installed['installed'] and installed['owner_initialized'] and not installed['paired']
              _,raw,_=get('/setup/api.php?action=status');s=json.loads(raw);assert s['setup']['installed'] and s['setup']['state']=='ready_to_pair'
              assert post('install',body,409)['code']=='already_installed'
              pair=post('pair',{'pairing_code':installed['pairing_code'],'installation_id':'sokna-ci-'+name,'shared_secret':'disposable-CI-pair-secret-only-0123456789','display_name':'QA only'})
              assert pair['success'] and pair['paired']
              _,raw,_=get('/health');health=json.loads(raw);want=c['baseline'] if name in ('upgrade','browser306') else c['older'] if name=='older' else c['current'] if name=='current' else c['latest'] if name=='latest' else c['target']
              assert health['ok'] and health['database']=='ready' and health['applied_migrations']==health['catalog_migrations']==11 and health['pending_migrations']==0 and health['emergency_ready'] and health['version']==want,(name,health)
              print('PASS actual Apache Setup, pairing and health',name,base or '/')
          PY
      - name: Real Staff account projection and regression fixture using installed databases
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 0644 "$GITHUB_WORKSPACE/qa/sokna-request-c2/staff_fixture.php" /tmp/sokna-public-35ip-staff-fixture.php
          sudo -u www-data php /tmp/sokna-public-35ip-staff-fixture.php missing
          python3 "$GITHUB_WORKSPACE/qa/sokna-request-c2/staff_http.py" regression
          python3 "$GITHUB_WORKSPACE/qa/sokna-request-c2/staff_http.py" clean-missing
          sudo -u www-data php /tmp/sokna-public-35ip-staff-fixture.php populated
          python3 "$GITHUB_WORKSPACE/qa/sokna-request-c2/staff_http.py" clean-populated
      - name: Real R306 to 35ip Routine recovery and independent Emergency bridge on disposable MariaDB
        shell: bash
        run: |
          set -euo pipefail
          cat >"$RUNNER_TEMP/operate.php" <<'PHP'
          <?php
          declare(strict_types=1);
          $root='/var/www/sokna-public-host-gate/upgrade/webroot';
          $pkg='/var/www/sokna-public-host-gate/update-exact-qa.zip';
          $contract=json_decode(file_get_contents('/var/www/sokna-public-host-gate/contract.json'),true,512,JSON_THROW_ON_ERROR);
          require $root.'/bootstrap.php';
          $cfg=require $root.'/config.php';
          $core=sokna_public_bootstrap($cfg);
          $routine=$core->routinePublicUpdates();
          $health=fn():array=>(new \Sokna\PublicEdge\Health\PublicHealthService($core->database(),$root,$cfg['app']['storage_dir']))->status()['body'];
          require_once $root.'/src/Update/IndependentEmergencyRoutineBridge.php';
          $bridge=new \Sokna\PublicEdge\Update\IndependentEmergencyRoutineBridge($routine,$cfg['app']['storage_dir'],fn():array=>$core->migrations()->pendingVersions(),$health);
          $op=$argv[1];
          if($op==='routine-stage') $result=$routine->stageUploadedDeltaZip($pkg,'disposable-ci',true);
          elseif($op==='routine-activate') $result=$routine->activateStaged('disposable-ci');
          elseif($op==='routine-rollback') $result=$routine->rollback('disposable-ci');
          elseif($op==='emergency-stage') $result=$bridge->stageUploadedZip($pkg,'disposable-ci');
          elseif($op==='emergency-activate') $result=$bridge->activateStaged('disposable-ci');
          elseif($op==='emergency-commit') $result=$bridge->commitPending('disposable-ci');
          else throw new RuntimeException('unexpected QA operation');
          $s=$routine->snapshot();
          foreach($contract['protected'] as $n=>$sha) if(hash_file('sha256',$root.'/'.$n)!==$sha) throw new RuntimeException('protected_changed');
          if(str_ends_with($op,'-activate') && (!is_array($s['pending_verification']) || $s['managed_tree_sha256']!==$contract['target_tree'])) throw new RuntimeException('activation_identity');
          if($op==='routine-rollback' && ($s['current_version']!==$contract['baseline'] || $s['managed_tree_matches_expected']!==true || $s['pending_verification']!==null)) throw new RuntimeException('rollback_identity');
          if($op==='emergency-commit' && ($s['current_version']!==$contract['target'] || $s['active_version']!==$contract['target'] || $s['managed_tree_sha256']!==$contract['target_tree'] || $s['pending_verification']!==null)) throw new RuntimeException('commit_identity');
          echo json_encode(['operation'=>$op,'version'=>$s['current_version'],'tree'=>$s['managed_tree_sha256'],'pending'=>is_array($s['pending_verification']),'health'=>$health()],JSON_THROW_ON_ERROR)."\n";
          PHP
          sudo install -o www-data -g www-data -m 0640 "$RUNNER_TEMP/operate.php" /var/www/sokna-public-host-gate/operate.php
          for op in routine-stage routine-activate routine-rollback emergency-stage emergency-activate emergency-commit; do
            sudo -u www-data php /var/www/sokna-public-host-gate/operate.php "$op" | tee -a "$RUNNER_TEMP/public-lifecycle-receipt.jsonl"
            curl --fail --silent --show-error http://127.0.0.1:18082/health | python3 -c "import json,sys; j=json.load(sys.stdin); assert j['ok'] and j['database']=='ready' and j['pending_migrations']==0 and j['applied_migrations']==11; print('HTTP_READBACK_PASS',j['version'])"
          done
          echo 'PASS isolated core lifecycle and bridge; authenticated Emergency browser route not claimed'
      - name: Reconstruct the already-installed origin ledger from verified baseline manifests (disposable fixture only)
        shell: bash
        run: |
          set -euo pipefail
          sudo -u www-data python3 - <<'PY'
          import pathlib,json,hashlib
          w=pathlib.Path('/var/www/sokna-public-host-gate'); c=json.loads((w/'contract.json').read_text())
          for name,sub,version,expected in [('browser306','',c['baseline'],'7ed171a36324f41ef51130749b021eaeb40b9f5b43955e1c309a4d155cba41ce'),('older','public/menu',c['older'],c['older_tree']),('current','public',c['current'],c['current_tree']),('latest','public',c['latest'],c['latest_tree'])]:
              root=w/name/'webroot'/sub
              assert (root/'VERSION.txt').read_text().strip()==version
              # No private runtime files are used in reconstructing the old
              # installed code identity. Every managed file came from exact
              # SHA-pinned origin ZIP; validate the full managed tree via its
              # manifest readback and the HTTP health on the next step.
              d=root/'storage/routine-update-v2';d.mkdir(parents=True,exist_ok=True)
              state=d/'state.json'
              if state.exists():
                  before=json.loads(state.read_text())
                  assert before.get('active_version') in ('',None,version)
                  assert before.get('active_managed_tree_sha256') in ('',None,expected)
                  assert all(before.get(k) is None for k in ('staged','pending_verification','db_forward_fence','activation_journal'))
              state.write_text(json.dumps({'format':'sokna-public-routine-update-state-v2','schema_version':2,'active_version':version,'active_managed_tree_sha256':expected,'previous_version':'','lkg_recovery_id':'','staged':None,'pending_verification':None,'activation_journal':None,'db_forward_fence':None,'history':[]}))
              print('RECONSTRUCTED_EXACT_HISTORICAL_ORIGIN_LEDGER',name,expected)
          PY
          sudo chown -R www-data:www-data /var/www/sokna-public-host-gate/browser306/webroot/storage/routine-update-v2 /var/www/sokna-public-host-gate/older/webroot/public/menu/storage/routine-update-v2 /var/www/sokna-public-host-gate/current/webroot/public/storage/routine-update-v2 /var/www/sokna-public-host-gate/latest/webroot/public/storage/routine-update-v2
      - name: Authenticated protected Emergency browser route on all three supported origins
        shell: bash
        run: |
          set -euo pipefail
          sudo -u www-data python3 - <<'PY' | tee "$RUNNER_TEMP/public-authenticated-emergency-receipt.jsonl"
          import pathlib,hashlib,json,urllib.request,urllib.parse,urllib.error,http.cookiejar,re
          work=pathlib.Path('/var/www/sokna-public-host-gate');c=json.loads((work/'contract.json').read_text())
          pkg=work/'update-exact-qa.zip';sha=hashlib.sha256(pkg.read_bytes()).hexdigest()
          assert sha==c['candidate_sha256']
          for name,port,sub,origin in [('browser306',18084,'',c['baseline']),('older',18083,'/public/menu',c['older']),('current',18085,'/public',c['current']),('latest',18086,'/public',c['latest'])]:
              base=f'http://127.0.0.1:{port}{sub}';root=work/name/'webroot'/sub.lstrip('/')
              op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
              def get(path):
                  with op.open(base+path,timeout=45) as r:return r.read()
              def post(action,fields=None,upload=False):
                  html=get('/emergency.php').decode();m=re.search(r'<input[^>]*name="csrf"[^>]*value="([a-f0-9]{48})"',html)
                  assert m,('CSRF_MISSING',name,action)
                  fields=dict(fields or {},csrf=m.group(1))
                  if upload:
                      b='----sokna-universal-ci-boundary'
                      body=b''.join(('--'+b+'\r\nContent-Disposition: form-data; name="'+k+'"\r\n\r\n'+v+'\r\n').encode() for k,v in fields.items())
                      body+=('--'+b+'\r\nContent-Disposition: form-data; name="package"; filename="candidate.zip"\r\nContent-Type: application/zip\r\n\r\n').encode()+pkg.read_bytes()+('\r\n--'+b+'--\r\n').encode()
                      h={'Content-Type':'multipart/form-data; boundary='+b}
                  else:body=urllib.parse.urlencode(fields).encode();h={'Content-Type':'application/x-www-form-urlencoded'}
                  req=urllib.request.Request(base+'/emergency.php?action='+action,data=body,headers=h)
                  with op.open(req,timeout=60) as r:
                      assert r.status==200
                      return r.read().decode()
              assert json.loads(get('/health'))['version']==origin
              assert 'دسترسی اضطراری' in get('/emergency.php').decode()
              post('login',{'emergency_password':'disposable-emergency-CI-only-20261124'})
              assert 'خروج امن' in get('/emergency.php').decode()
              response=post('stage',upload=True)
              if 'بسته با موفقیت اعتبارسنجی' not in response:
                  import html
                  safe=re.sub(r'<script.*?</script>|<style.*?</style>','',response,flags=re.S)
                  print('STAGE_DIAGNOSTIC',name,html.unescape(re.sub(r'<[^>]+>',' ',safe))[-6000:])
                  state=root/'storage/routine-update-v2/state.json'
                  if state.is_file():
                      q=json.loads(state.read_text());print('STATE', {k:q.get(k) for k in ('active_version','staged','pending_verification')})
                  raise AssertionError('STAGE_REJECTED '+name)
              assert 'فایل‌ها فعال شدند' in post('activate',{'confirmation':'activate'}),name
              assert json.loads(get('/health'))['version']==c['target']
              assert 'نسخه جدید' in post('commit',{'confirmation':'commit'}),name
              state=json.loads((root/'storage/routine-update-v2/state.json').read_text())
              assert state['active_version']==c['target'] and state['active_managed_tree_sha256']==c['target_tree']
              assert all(state.get(k) is None for k in ('staged','pending_verification','db_forward_fence','activation_journal'))
              for n,d in c['protected'].items():assert hashlib.sha256((root/n).read_bytes()).hexdigest()==d
              health=json.loads(get('/health'));assert health['ok'] and health['applied_migrations']==11 and health['pending_migrations']==0
              print(json.dumps({'status':'PASS','scope':'exact_zip','sha256':sha,'origin':origin,'origin_tree_sha256':c['older_tree'] if name=='older' else c['current_tree'] if name=='current' else c['latest_tree'] if name=='latest' else '7ed171a36324f41ef51130749b021eaeb40b9f5b43955e1c309a4d155cba41ce','authenticated_emergency_http':True,'layout':sub or '/','protected_files':6,'db_migrations':11}))
          PY
      - name: Staff login and all page routes after real Emergency upgrade including exact installed 35io
        shell: bash
        run: |
          set -euo pipefail
          # Verify the on-disk target in a fresh process under the service identity
          # before checking the existing Apache worker. Do not reset OPcache.
          for root in /var/www/sokna-public-host-gate/latest/webroot/public /var/www/sokna-public-host-gate/current/webroot/public /var/www/sokna-public-host-gate/older/webroot/public/menu /var/www/sokna-public-host-gate/browser306/webroot /var/www/sokna-public-host-gate/upgrade/webroot; do
            sudo -u www-data php -r 'require $argv[1]."/bootstrap.php"; foreach(["Sokna\\PublicEdge\\Auth\\UserUiPreferenceService","Sokna\\PublicEdge\\Remote\\PublicNotificationToday","Sokna\\PublicEdge\\Remote\\PublicDashboardOperationalActivity","Sokna\\PublicEdge\\Remote\\PublicItemSalesArchive","Sokna\\PublicEdge\\Remote\\PublicInvoiceHistoryArchive"] as $c) if(!class_exists($c,false)) throw new RuntimeException("MISSING ".$c); echo "PASS_FRESH_PROCESS_DEPENDENCIES\n";' "$root"
          done
          python3 "$GITHUB_WORKSPACE/qa/sokna-request-c2/staff_http.py" upgraded | tee "$RUNNER_TEMP/public-staff-receipt.txt"
      - name: Verify four origins and complete Staff operation receipts
        run: |
          python3 - <<'PY'
          import pathlib,os,json,hashlib
          r=pathlib.Path(os.environ['RUNNER_TEMP']);w=pathlib.Path('/var/www/sokna-public-host-gate');c=json.loads((w/'contract.json').read_text())
          rows=[json.loads(x) for x in (r/'public-authenticated-emergency-receipt.jsonl').read_text().splitlines() if x.startswith('{')]
          assert len(rows)==4 and {x['origin_tree_sha256'] for x in rows}=={c['older_tree'],c['current_tree'],c['latest_tree'],'7ed171a36324f41ef51130749b021eaeb40b9f5b43955e1c309a4d155cba41ce'}
          assert all(x['status']=='PASS' and x['sha256']==c['candidate_sha256'] for x in rows)
          (r/'public-gate.json').write_text(json.dumps({'status':'PASS','sha256':c['candidate_sha256'],'origins':rows,'staff_receipt':(r/'public-staff-receipt.txt').read_text()}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: C2-PUBLIC-RECEIPT
          path: ${{ runner.temp }}/public-gate.json
          if-no-files-found: error
  publish:
    needs: [freeze,native,integration,public-host-gate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: C2-FROZEN-DO-NOT-INSTALL
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          pattern: SOKNA-C2-NATIVE-*-RECEIPT
          path: native
      - uses: actions/download-artifact@v4
        with:
          name: C2-PUBLIC-RECEIPT
          path: public
      - name: Admit unchanged exact bytes
        run: |
          python3 - <<'PY'
          import pathlib,hashlib,json,shutil,zipfile,os
          H=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          p=pathlib.Path('frozen');out=pathlib.Path('operator');out.mkdir()
          rows=[json.loads(q.read_text()) for q in pathlib.Path('native').rglob('matrix-receipt.json')]
          expected={(o,'none') for o in ('R301','R304','R306','R307','R3')}|{('R3',f) for f in ('APACHE_STOPPED','DATABASE_BACKUP_VERIFIED','DATABASE_FORWARD_INTENT','POINTER_SWITCHED','COMMITTED')}
          assert len(rows)==len(expected) and {(x['origin'],x['fault']) for x in rows}==expected
          assert all(x['status']=='PASS' and x['candidate_sha256']==H(p/'LOCAL-C2-FROZEN.zip') for x in rows)
          q=json.loads(pathlib.Path('public/public-gate.json').read_text());assert q['status']=='PASS' and q['sha256']==H(p/'PUBLIC-C2-FROZEN.zip')
          for src,dst in [('LOCAL-C2-FROZEN.zip','SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip'),('PUBLIC-C2-FROZEN.zip','SOKNA-PUBLIC-35IQ-UNIVERSAL-UPDATE.zip')]:shutil.copyfile(p/src,out/dst)
          (out/'RELEASE-RECEIPT.json').write_text(json.dumps({'release':'231gc/35iq','source_sha256':'96e7e8bead29f26fab06c69d95c4ff7172e5f619a51edd3e9de266f5bc24e54f','distribution_authorized':True,'deployment_authorized':False,'run':os.environ['GITHUB_RUN_ID'],'files':{f.name:H(f) for f in out.glob('*.zip')},'native':rows,'public':q,'remaining_business_acceptance':True},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE
          path: operator/*
          if-no-files-found: error
          retention-days: 90
