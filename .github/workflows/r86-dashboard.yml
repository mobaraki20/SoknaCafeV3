name: R86 coherent financial dashboards
on:
  push:
    branches: [work/r86-dashboard-20261101]
    paths: [release/r86/**, .github/workflows/r86-dashboard.yml]
defaults:
  run:
    shell: bash
permissions:
  contents: write
jobs:
  real-db:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: r86-test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_PASSWORD: r86-test
      DB_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP and DB client
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli php-mysql php-sqlite3 php-zip mariadb-client
      - name: Reconstruct exact R85 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/r84/baselines release/r85/baselines release/r86/baselines
          gh release download local-public-r83-communication-uat-20261101 --repo "$GITHUB_REPOSITORY" --dir release/r84/baselines -p SOKNA-R83-LOCAL-R81-TO-R83-DELTA-HOME-UAT.zip -p SOKNA-R83-PUBLIC-R81-TO-R83-ROUTINE-DELTA-HOME-UAT.zip
          gh release download local-public-r84-causal-read-uat-20261101 --repo "$GITHUB_REPOSITORY" --dir release/r85/baselines -p SOKNA-R84-LOCAL-R83-TO-R84-DELTA-HOME-UAT.zip -p SOKNA-R84-PUBLIC-R83-TO-R84-ROUTINE-DELTA-HOME-UAT.zip
          gh release download local-public-r85-hall-policy-uat-20261101 --repo "$GITHUB_REPOSITORY" --dir release/r86/baselines -p SOKNA-R85-LOCAL-R84-TO-R85-DELTA-HOME-UAT.zip -p SOKNA-R85-PUBLIC-R84-TO-R85-ROUTINE-DELTA-HOME-UAT.zip
          python3 release/r86/prepare.py
          mkdir -p release/r86/build/qa
      - name: Create isolated databases
        run: mysql -h127.0.0.1 -uroot -pr86-test -e 'CREATE DATABASE r84_time; CREATE DATABASE r83_local; CREATE DATABASE r83_public; CREATE DATABASE r84_guest; CREATE DATABASE r86_finance; CREATE DATABASE r86_finance_red;'
      - name: Existing transaction, Guest and time regressions
        run: |
          php release/r84/tests/runtime-time.php release/r86/build/source > release/r86/build/qa/time.json
          php release/r84/tests/guest-list.php release/r86/build/source > release/r86/build/qa/guest-list.json
          node release/r84/tests/guest-list.js release/r86/build/source > release/r86/build/qa/guest-list-js.json
          php release/r83/tests/pure.php release/r86/build/source > release/r86/build/qa/pure.json
          php release/r83/tests/encoding.php release/r86/build/source > release/r86/build/qa/encoding.json
          node release/r83/tests/guest.js release/r86/build/source > release/r86/build/qa/guest.json
          php release/r83/tests/local.php release/r86/build/source > release/r86/build/qa/local.json
          php release/r83/tests/public.php release/r86/build/source > release/r86/build/qa/public.json
      - name: Reproduce financial baseline defects
        run: |
          if FINANCE_DB=r86_finance_red php release/r86/tests/finance.php release/r86/build/baseline > release/r86/build/qa/finance-before.json; then exit 1; fi
      - name: Consistent finance, cutoff, reversals and concurrent real commits
        run: |
          php release/r86/tests/finance.php release/r86/build/source | tee release/r86/build/qa/finance-after.json
          php release/r85/tests/settings.php release/r86/build/source > release/r86/build/qa/settings-after.json
          node release/r85/tests/settings.js release/r86/build/source > release/r86/build/qa/settings-js-after.json
      - name: Complete candidate syntax
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json
          files=[p for p in pathlib.Path('release/r86/build/source').rglob('*') if p.suffix in ('.php','.js')]
          for p in files:subprocess.run(['php','-l',str(p)] if p.suffix=='.php' else ['node','--check',str(p)],check=True,capture_output=True)
          pathlib.Path('release/r86/build/qa/syntax.json').write_text(json.dumps({'passed':len(files),'failed':0}))
          PY
      - name: Build independent deltas and test native receiver
        run: |
          python3 release/r86/package.py
          php release/r86/tests/package.php release/r86/build/source release/r86/build/dist > release/r86/build/qa/package.json
          python3 release/r86/finalize.py
      - name: Publish verified Home UAT packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create local-public-r86-dashboard-uat-20261101 release/r86/build/dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "SOKNA R86 — Coherent financial dashboards" --notes-file release/r86/build/dist/REPORT-FA.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r86-qa
          path: release/r86/build/qa
