name: SOKNA CP138 Public guest image sizing HTTP acceptance
permissions:
  contents: read
  actions: read
'on':
  push:
    branches:
    - qa/cp133-marketing-20261126
    paths:
    - .github/workflows/cp138-guest-http.yml
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports:
        - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=3s --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
    steps:
    - name: Reconstruct exact CP132 from pinned successful workflow
      env:
        GH_TOKEN: ${{ github.token }}
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\n/usr/bin/python3 - <<'PYCODE'\nimport os,pathlib,hashlib,urllib.request,subprocess,yaml\n\
        url='https://raw.githubusercontent.com/mobaraki20/SoknaCafeV3/739906e98dceecb8cc3c4a351a0108f774d55c55/.github/workflows/cp118-phase01-db.yml'\n\
        raw=urllib.request.urlopen(url,timeout=30).read(600000)\nassert hashlib.sha256(raw).hexdigest()=='bfa3af14d81c1726c172ba10cb2b0f1599d0aa80fd2debdd5361c0a949a3b9bf'\n\
        steps=yaml.safe_load(raw)['jobs']['database']['steps']\nend=next(i for i,s in enumerate(steps) if s['name']=='Apply\
        \ CP132 exact cumulative source')\nassert end==64, end\nfor step in steps[:end+1]:\n    assert 'run' in step and set(step)<=\
        \ {'name','run','env'}, step['name']\n    env=dict(os.environ)\n    marker=chr(36)+'{{'\n    cmd=step['run'].replace(marker+'\
        \ github.repository }}','mobaraki20/SoknaCafeV3')\n    assert marker not in cmd\n    print('Pinned source: '+step['name'],flush=True)\n\
        \    subprocess.run(['bash','-e','-o','pipefail','-c',cmd],env=env,check=True)\nPYCODE\n"
    - name: Reconstruct exact CP133B and verify both canonical sources
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\npython3 - <<'PYCODE'\nimport base64,zlib,json,pathlib,hashlib\nH=lambda\
        \ b:hashlib.sha256(b).hexdigest()\nraw=zlib.decompress(base64.b64decode(''))\n\
        assert H(raw)=='af19a7287dbd88d2f847bb72424e994b314b6bb0caa91bd4f7ef2e465d7f959a'\nfor n,(before,after,edits) in json.loads(raw).items():\n\
        \ p=pathlib.Path(n);a=p.read_bytes();assert H(a)==before,n\n s=a.decode('utf-8')\n for i,j,t in reversed(edits):s=s[:i]+t+s[j:]\n\
        \ out=s.encode();assert H(out)==after,n;p.write_bytes(out)\n print('PASS exact delta',n)\nfor d,n,expected in [('local',625,'cffec10da2a07bd4124ec197881fe4ad553e5c16f182a8563c8c412ca08527ec'),('public',258,'a831b8475bcfe673faec1df023abafe647cb9339ac8627470a734bb53f169859')]:\n\
        \ p=pathlib.Path(d);names=sorted(x.relative_to(p).as_posix() for x in p.rglob('*') if x.is_file());actual=H(''.join(n+'\\\
        0'+H((p/n).read_bytes())+'\\n' for n in names).encode());assert len(names)==n and actual==expected,(d,actual);print('PASS\
        \ canonical',d,actual)\nPYCODE\n"
    - name: Apply exact CP134 parent source
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\npython3 - <<'PYCODE'\nimport base64,zlib,json,pathlib,hashlib\nH=lambda\
        \ b:hashlib.sha256(b).hexdigest()\nraw=zlib.decompress(base64.b64decode(''))\n\
        assert H(raw)=='a05f636c64638eaac15426f8405bc4769cf771bca0cf162c8a4f57465f0b7a54'\nfor n,(before,after,edits) in json.loads(raw).items():\n\
        \ p=pathlib.Path(n);a=p.read_bytes();assert H(a)==before,n\n s=a.decode('utf-8')\n for i,j,t in reversed(edits):s=s[:i]+t+s[j:]\n\
        \ out=s.encode();assert H(out)==after,n;p.write_bytes(out)\n print('PASS exact delta',n)\nfor d,n,expected in [('local',625,'b1edc6b27702a1d6b4edfbff9fe1eb451fe427017df26cd612c68fc951ade8a0'),('public',258,'a831b8475bcfe673faec1df023abafe647cb9339ac8627470a734bb53f169859')]:\n\
        \ p=pathlib.Path(d);names=sorted(x.relative_to(p).as_posix() for x in p.rglob('*') if x.is_file());actual=H(''.join(n+'\\\
        0'+H((p/n).read_bytes())+'\\n' for n in names).encode());assert len(names)==n and actual==expected,(d,actual);print('PASS\
        \ canonical',d,actual)\nPYCODE\n"
    - name: Apply exact CP135 preparation delta
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\npython3 - <<'PYCODE'\nimport base64,zlib,json,pathlib,hashlib\nH=lambda\
        \ b:hashlib.sha256(b).hexdigest()\nraw=zlib.decompress(base64.b64decode(''))\n\
        assert H(raw)=='24fd26dbd16210bd9fd666e19d125ce0f2d13d2831a556e3bfc9faa18c05764b'\nfor n,(before,after,edits) in json.loads(raw).items():\n\
        \ p=pathlib.Path(n);a=p.read_bytes();assert H(a)==before,n\n s=a.decode('utf-8')\n for i,j,t in reversed(edits):s=s[:i]+t+s[j:]\n\
        \ out=s.encode();assert H(out)==after,n;p.write_bytes(out)\n print('PASS exact delta',n)\nfor d,n,expected in [('local',625,'aabbbf37b052017b5cccbc3ab0fa82adc49ad20e0efe2c725a66f1542f9889ca'),('public',258,'5188098af3ac23e65f71f775fdbd9fe2b8e484b9f73c70fc5450d42a154e2236')]:\n\
        \ p=pathlib.Path(d);names=sorted(x.relative_to(p).as_posix() for x in p.rglob('*') if x.is_file());actual=H(''.join(n+'\\\
        0'+H((p/n).read_bytes())+'\\n' for n in names).encode());assert len(names)==n and actual==expected,(d,actual);print('PASS\
        \ canonical',d,actual)\nPYCODE\n"
    - name: Apply exact CP136 catalog delta
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\npython3 - <<'PYCODE'\nimport base64,zlib,json,pathlib,hashlib\nH=lambda\
        \ b:hashlib.sha256(b).hexdigest()\nraw=zlib.decompress(base64.b64decode(''))\n\
        assert H(raw)=='2956019627a665314c39a34ee0653698f30d6af04c62aadb319599dff05d9f94'\nfor n,(before,after,edits) in json.loads(raw).items():\n\
        \ p=pathlib.Path(n);a=p.read_bytes();assert H(a)==before,n\n s=a.decode('utf-8')\n for i,j,t in reversed(edits):s=s[:i]+t+s[j:]\n\
        \ out=s.encode();assert H(out)==after,n;p.write_bytes(out)\n print('PASS exact delta',n)\nfor d,n,expected in [('local',625,'38979252a97b817edc14bfa2538ebdd72078a9bf9da792ce7f47e0265687fbf4'),('public',258,'5188098af3ac23e65f71f775fdbd9fe2b8e484b9f73c70fc5450d42a154e2236')]:\n\
        \ p=pathlib.Path(d);names=sorted(x.relative_to(p).as_posix() for x in p.rglob('*') if x.is_file());actual=H(''.join(n+'\\\
        0'+H((p/n).read_bytes())+'\\n' for n in names).encode());assert len(names)==n and actual==expected,(d,actual);print('PASS\
        \ canonical',d,actual)\nPYCODE\n"
    - name: Apply exact CP137 guest CSS delta
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\npython3 - <<'PYCODE'\nimport base64,zlib,json,pathlib,hashlib\nH=lambda\
        \ b:hashlib.sha256(b).hexdigest()\nraw=zlib.decompress(base64.b64decode(''))\n\
        assert H(raw)=='598e6885eedce697ace64e7c8431d36c2834ad389dba60e8af4c6338a5659db4'\nfor n,(before,after,edits) in json.loads(raw).items():\n\
        \ p=pathlib.Path(n);a=p.read_bytes();assert H(a)==before,n\n s=a.decode('utf-8')\n for i,j,t in reversed(edits):s=s[:i]+t+s[j:]\n\
        \ out=s.encode();assert H(out)==after,n;p.write_bytes(out)\n print('PASS exact delta',n)\nfor d,n,expected in [('local',625,'bf6da02531a548a4397d993bd6668a93ad0680b48a7cc6374ce541836738a042'),('public',258,'41569e9f9b23a05271bd0edaf3530ce41736bae528bb1022dc500adb4207adae')]:\n\
        \ p=pathlib.Path(d);names=sorted(x.relative_to(p).as_posix() for x in p.rglob('*') if x.is_file());actual=H(''.join(n+'\\\
        0'+H((p/n).read_bytes())+'\\n' for n in names).encode());assert len(names)==n and actual==expected,(d,actual);print('PASS\
        \ canonical',d,actual)\nPYCODE\n"
    - name: Prepare guest-db.php
      run: 'set -euo pipefail

        cat > "$RUNNER_TEMP/guest-db.php" <<''QAEOF''

        <?php

        declare(strict_types=1);

        if(PHP_SAPI!==''cli''||getenv(''QA_DB_PASSWORD'')!==''synthetic-cp116-ci-only'')exit(2);

        $root=realpath($argv[1]);if(!$root||basename($root)!==''public'')exit(2);require $root.''/bootstrap.php'';

        function check($ok,string $name):void {if(!$ok)throw new RuntimeException(''FAIL ''.$name);echo ''PASS ''.$name."\n";}

        $p=new PDO(''mysql:host=127.0.0.1;port=3306;charset=utf8mb4'',''root'',getenv(''QA_DB_PASSWORD''),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$p->exec(''CREATE
        DATABASE sokna_cp138_public CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'');$storage=dirname($root).''/qa-public-private'';mkdir($storage,0700,true);

        $cfg=[''db''=>[''host''=>''127.0.0.1'',''port''=>''3306'',''name''=>''sokna_cp138_public'',''user''=>''root'',''pass''=>getenv(''QA_DB_PASSWORD'')],''app''=>[''base_path''=>''/public'',''base_url''=>''http://127.0.0.1:18766/public'',''default_installation_id''=>''qa-cards'',''cookie_secure''=>false,''storage_dir''=>$storage],''relay''=>[''secret_encryption_key_base64''=>base64_encode(random_bytes(32)),''installation_secrets''=>[],''clock_skew_seconds''=>300],''auth''=>[''session_ttl_seconds''=>28800]];

        file_put_contents($root.''/config.php'',''<?php return ''.var_export($cfg,true).'';'');touch($root.''/install.lock'');$core=sokna_public_bootstrap($cfg);$core->migrations()->migrate();$db=$core->database();$png=file_get_contents(dirname($root).''/qa-photo.png'');$sha=hash(''sha256'',$png);$manifest=[''sample''=>[''sha256''=>$sha,''extension''=>''png'',''mime''=>''image/png'',''size''=>strlen($png)]];

        foreach([''cards'',''gallery'',''editorial'',''hidden''] as $variant){$id=''qa-''.$variant;$db->prepare(''INSERT INTO
        installations(installation_id,display_name,remote_enabled,order_intake_enabled) VALUES(?,?,0,0)'')->execute([$id,''QA
        guest'']);$m=$core->guestMedia()->put($id,[''sha256''=>$sha,''mime''=>''image/png'',''extension''=>''png'',''size''=>strlen($png),''content_base64''=>base64_encode($png)]);check(($m[''body''][''ok'']??false)===true,''media_store_''.$variant);

        $items=[];foreach([1,2,3,4] as $i){$items[]=[''id''=>$i,''name''=>['''',''سیب زمینی ساده'',''سیب زمینی ویژه'',''قهوه'',''بدون
        عکس''][$i],''description''=>''توضیحات نمونه برای کنترل نمایش تصویر و قیمت'',''category_id''=>1,''category_name''=>''غذا
        و میان‌وعده'',''price''=>295000,''available''=>true,''featured''=>$i===1,''image_path''=>$i===4?'''':''sample''];}

        $snapshot=[''format''=>''sokna-guest-snapshot-v1'',''cafe_name''=>''سکنا — محیط آزمون'',''categories''=>[[''id''=>1,''name''=>''غذا
        و میان‌وعده'']],''items''=>$items,''tables''=>[[''id''=>1,''name''=>''میز آزمون'',''token''=>''qa-table-138'']],''presentation''=>[''settings''=>[''pwa_enabled''=>false,''analytics_enabled''=>false],''theme''=>[''format''=>''sokna-guest-theme-v2'',''engine_contract''=>''sokna-guest-theme-engine-v2'',''contract_revision''=>2,''variants''=>[''catalog''=>$variant===''hidden''?''cards'':$variant,''item_media''=>$variant===''hidden''?''hidden'':''leading'',''featured''=>''rail'']]]];$hash=\Sokna\PublicEdge\Core\CanonicalJson::sha256([''format''=>''sokna-guest-snapshot-v1'',''snapshot''=>$snapshot,''media_manifest''=>$manifest]);$revision=''guest-''.substr($hash,0,32);$out=$core->guestPublish()->publish($id,[''revision_id''=>$revision,''content_hash''=>$hash,''generated_at''=>gmdate(''c''),''snapshot''=>$snapshot,''media_manifest''=>$manifest]);check(($out[''body''][''ok'']??false)&&($out[''body''][''media_complete'']??false),''publish_real_''.$variant);$bundle=$core->guestRuntime()->bundle($id);check(($bundle[''revision_id'']??null)===$revision&&count($bundle[''snapshot''][''items''])===4,''active_revision_''.$variant);}

        file_put_contents(dirname($root).''/qa-guest.json'',json_encode([''sha''=>$sha]));echo "GUEST DB PASS\n";


        QAEOF

        '
    - name: Prepare guest-browser.cjs
      run: 'set -euo pipefail

        cat > "$RUNNER_TEMP/guest-browser.cjs" <<''QAEOF''

        const {chromium}=require(process.env.RUNNER_TEMP+''/pw/node_modules/playwright'');const fs=require(''fs''),path=require(''path''),assert=require(''assert/strict''),crypto=require(''crypto'');const
        root=process.env.RUNNER_TEMP,shots=path.join(root,''cp138-screenshots'');fs.mkdirSync(shots,{recursive:true});const
        sha=JSON.parse(fs.readFileSync(path.join(root,''qa-guest.json''))).sha;const base=''http://127.0.0.1:18766/public'';const
        ck=(ok,n)=>{assert.ok(ok,n);console.log(''PASS ''+n)};

        (async()=>{const b=await chromium.launch({channel:''chrome'',headless:true});try{for(const [variant,w,h,qr] of [[''cards'',390,844,false],[''cards'',320,568,false],[''cards'',1440,900,false],[''cards'',390,844,true],[''gallery'',390,844,false],[''editorial'',390,844,false],[''hidden'',390,844,false]]){const
        name=variant+''-''+w+(qr?''-qr'':'''');const ctx=await b.newContext({viewport:{width:w,height:h},locale:''fa-IR''});const
        p=await ctx.newPage();p.setDefaultTimeout(12000);const errors=[];p.on(''pageerror'',e=>errors.push(e.message));try{const
        r=await p.goto(base+''/menu?installation=qa-''+variant+(qr?''&table=qa-table-138'':''''),{waitUntil:''domcontentloaded''});ck(r.status()===200,name+''
        HTTP'');const item=p.locator(''.sg-item'').first;await item.waitFor();await item.scrollIntoViewIfNeeded();ck(await
        p.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),name+'' no_horizontal_overflow'');ck(await p.locator(''body'').evaluate((e,v)=>e.classList.contains(''sg-v-catalog-''+(v===''hidden''?''cards'':v)),variant),name+''
        theme_preserved'');const img=item.locator(''img.sg-item-media'');let oldWidth=0;if(variant===''hidden''){ck(await
        img.count()===0||!(await img.isVisible()),name+'' hidden_media_preserved'');}else{await img.waitFor({state:''visible''});await
        p.waitForFunction(()=>document.querySelector(''.sg-item>img.sg-item-media'')?.naturalWidth>0);const a=await img.boundingBox(),c=await
        item.boundingBox(),copy=await item.locator(''.sg-item-copy'').boundingBox();oldWidth=a.width;console.log(''GEOMETRY
        ''+name+'' ''+a.width+''/''+c.width);if(variant===''cards''&&w<=520)ck(a.width<c.width*.55&&Math.abs(a.y-copy.y)<30,name+''
        compact'');if([''gallery'',''editorial''].includes(variant))ck(a.width>=c.width*.8,name+'' gallery_or_editorial'');const
        url=await img.evaluate(e=>e.currentSrc);ck(url.startsWith(base+''/media/qa-''+variant+''/''+sha),name+'' real_media_url'');const
        response=await ctx.request.get(url);ck(response.status()===200&&crypto.createHash(''sha256'').update(await response.body()).digest(''hex'')===sha,name+''
        media_bytes'');}await p.screenshot({path:path.join(shots,name+''-list.png''),animations:''disabled''});await item.locator(''.sg-item-hit'').click();const
        detail=p.locator(''[data-sg-item-modal]'');await detail.waitFor({state:''visible''});ck((await detail.locator(''[data-sg-detail-title]'').innerText())===''سیب
        زمینی ساده'',name+'' selected_item'');if(variant!==''hidden''){const di=detail.locator(''.sg-item-detail-media img'');await
        di.waitFor();await p.waitForFunction(()=>document.querySelector(''.sg-item-detail-media img'')?.naturalWidth>0);const
        d=await di.boundingBox();console.log(''DETAIL ''+name+'' ''+d.width+''x''+d.height);ck(w<=520?d.width>=w*.82:d.width>=300,name+''
        large_detail'');if(variant===''cards''&&w<=520)ck(d.width>oldWidth*1.8,name+'' larger_than_list'');ck(await di.evaluate(e=>getComputedStyle(e).objectFit)===''contain'',name+''
        uncropped'');await p.screenshot({path:path.join(shots,name+''-detail.png''),animations:''disabled''});await di.click();const
        viewer=p.locator(''.sg-image-viewer'');await viewer.waitFor({state:''visible''});ck(await viewer.locator(''img'').isVisible(),name+''
        full_image'');await viewer.locator(''.sg-image-viewer-close'').click();}await detail.locator(''.sg-item-detail-close'').click();ck(await
        detail.isHidden(),name+'' closed'');ck(errors.length===0,name+'' no_pageerror'');if(variant===''cards''&&w===390&&!qr){const
        noimg=p.locator(''.sg-item'').filter({hasText:''بدون عکس''});await noimg.locator(''.sg-item-hit'').click();await detail.waitFor({state:''visible''});ck(await
        detail.locator(''.sg-item-detail-card--no-media'').count()===1,''no_image_detail'');await detail.locator(''.sg-item-detail-close'').click();}}catch(e){await
        p.screenshot({path:path.join(shots,name+''-failure.png''),animations:''disabled''}).catch(()=>{});throw e;}finally{await
        ctx.close();}}const ctx=await b.newContext();const r=await ctx.request.get(base+''/menu?installation=qa-cards&table=invalid-qa'');ck(r.status()===404,''invalid_qr_denied'');await
        ctx.close();console.log(''CP138 PUBLIC HTTP PASS'');}finally{await b.close()}})().catch(e=>{console.error(e);process.exitCode=1});


        QAEOF

        '
    - name: MariaDB guest publication fixture
      run: 'set -euo pipefail

        cd "$RUNNER_TEMP"

        printf ''%s'' ''''
        | base64 -d > qa-photo.png

        php guest-db.php "$RUNNER_TEMP/public"

        '
    - name: Install browser driver
      run: 'set -euo pipefail

        npm install --prefix "$RUNNER_TEMP/pw" playwright@1.51.1 --no-audit --no-fund

        '
    - name: Chrome actual Public menu over HTTP
      run: 'set -euo pipefail

        cd "$RUNNER_TEMP"

        PHP_CLI_SERVER_WORKERS=4 php -S 127.0.0.1:18766 -t "$RUNNER_TEMP/public" "$RUNNER_TEMP/public/index.php" > cp138-public-http.log
        2>&1 &

        public_pid=$!

        trap ''kill "$public_pid" 2>/dev/null || true; tail -35 cp138-public-http.log'' EXIT

        sleep 2

        node guest-browser.cjs

        '
    - name: Capture synthetic evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: SOKNA-CP138-UI-QA
        path: ${{ runner.temp }}/cp138-screenshots/*.png
        retention-days: 1
        if-no-files-found: warn
