          out={'status':'CONTROLLED_PUBLIC_OPERATOR_DELIVERY_READY','run_id':os.environ['GITHUB_RUN_ID'],'version':b['target'],'update_sha256':b['update_sha256'],'clean_sha256':b['clean_sha256'],'baselines':b['baselines'],'route_receipts':routes,'clean_receipt':c,'controlled_operator_delivery_authorized':True,'production_host_accepted':False,'automatic_deployment_authorized':False,'requires_exact_preflight_and_verified_backup':True,'clean_empty_path_and_empty_db_only':True,'local_release_included':False}
          (d/'DELIVERY-RECEIPT.json').write_text(json.dumps(out,indent=2))
