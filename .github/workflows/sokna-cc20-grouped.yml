           try{$b->restoreEncryptedToEmptyTarget($backup,$pass,0);throw new RuntimeException('fixture expected exception');}catch(RuntimeException $e){ck($e->getMessage()==='synthetic acknowledgement unavailable','actual transaction ended without success response '.$mode);}
           $used=glob($receipt.'.used-*');ck(count($used)===1&&!is_file($receipt)&&file_get_contents($used[0])===$proof,'original proof remains consumed '.$mode);
