          (cd "$W"; git apply --check seed-quarantine.patch; git apply seed-quarantine.patch)
          echo "3fe943b05bc2ce62eda2e85e25f4c2e0824587a97687563baf187ba9d5a20455  $W/local/src/Domain/Recovery/BusinessBackupService.php" | sha256sum -c -
          php -l "$W/local/src/Domain/Recovery/BusinessBackupService.php"
          for mode in rolledback committed; do mkdir -p "$W/target-$mode"; cp -a "$W/local" "$W/target-$mode/local"; done
          export QA_WORK="$W" TMPDIR="$W"
