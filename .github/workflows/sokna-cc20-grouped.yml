name: SOKNA RELEASE PRIORITY-41B interrupted business restore commit boundaries (QA ONLY)
on:
  push:
    branches: [qa/func-pass02-db-20261127]
    paths: [.github/workflows/sokna-cc20-grouped.yml]
permissions:
  contents: read
  actions: read
jobs:
  restore-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
      SOKNA_QA_DISPOSABLE: YES
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6983e9d52435a746325f60ace428b8548bcc8fc0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 46036608931
          name: SOKNA-CC36-FOUR-EXACT-QA-ARCHIVES-NOT-INSTALL
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Exact Local archive and real commit boundary faults
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cc41b"; mkdir -p "$W/local" "$W/receipts"
          A="$RUNNER_TEMP/candidate/LOCAL-231GH-CLEAN-WEB-QA-DO-NOT-INSTALL.zip"
          echo "f52ca7cd1db3652c8ad5f5b31dc780ccf08c80a674cb67e03a1a5b219c66220f  $A" | sha256sum -c -
          unzip -q "$A" -d "$W/local"
          export QA_WORK="$W" TMPDIR="$W"
          php qa/cp148/preflight.php
          php qa/cp160/fixture.php "$W/local" > "$W/receipts/fixture.txt"
          cat > "$W/gate41b.php" <<'SOKNA_CC41B_PHP'
          <?php
          declare(strict_types=1);
          if(PHP_SAPI!=='cli'||getenv('GITHUB_ACTIONS')!=='true'||getenv('SOKNA_QA_DISPOSABLE')!=='YES'||getenv('QA_DB_PASSWORD')!=='synthetic-cp116-ci-only')exit(2);
          $root=realpath($argv[1]);if(!$root||basename($root)!=='local')exit(2);
          require $root.'/bootstrap.php';$W=dirname($root);$cfg=require $W.'/config.php';
          if(($cfg['db']['host']??'')!=='127.0.0.1'||($cfg['db']['name']??'')!=='sokna_cp150'||($cfg['db']['pass']??'')!==getenv('QA_DB_PASSWORD'))exit(2);
          function ck($ok,$msg){if(!$ok)throw new RuntimeException($msg);echo "PASS $msg\n";}
          function scalar(PDO $p,string $s){return $p->query($s)->fetchColumn();}
          function digest(PDO $p,string $t){$rows=$p->query('SELECT * FROM `'.$t.'` ORDER BY id')->fetchAll(PDO::FETCH_ASSOC);foreach($rows as &$r)foreach($r as &$v)if($v!==null)$v=(string)$v;unset($v,$r);return [count($rows),hash('sha256',json_encode($rows,JSON_THROW_ON_ERROR))];}
          function tree(string $d){$out=[];if(is_dir($d))foreach(new RecursiveIteratorIterator(new RecursiveDirectoryIterator($d,FilesystemIterator::SKIP_DOTS)) as $f)if($f->isFile())$out[substr($f->getPathname(),strlen($d)+1)]=hash_file('sha256',$f->getPathname());ksort($out);return $out;}
          class BoundaryPDO extends PDO {
           public string $mode='';public string $dest='';public string $marker='';
           public function commit():bool {
            if($this->mode==='')return parent::commit();
            if(!is_dir($this->dest.'/guest-media')||!$this->inTransaction())throw new RuntimeException('not at real media-promoted commit boundary');
            if($this->mode==='after'&&!parent::commit())throw new RuntimeException('real commit failed');
            file_put_contents($this->marker,$this->mode);fflush(STDOUT);
            posix_kill(getmypid(),SIGKILL);throw new RuntimeException('SIGKILL failed');
           }
          }
          $c=sokna_local_bootstrap($cfg);$p=$c->database();$mode=$argv[2];$pass='synthetic-cc41b-backup-password';$backup=$W.'/cc41b.skbf';$state=$W.'/cc41b.json';
          $tables=['orders','order_items','settlement_records','settlement_record_lines','settlement_tender_allocations','guest_media_assets','remaining_account_discount_revisions'];
          if($mode==='seed'){
           $admin=$p->query("SELECT id,role FROM users WHERE username='qa-target' AND role='admin' AND active=1")->fetch(PDO::FETCH_ASSOC);ck($admin!==false,'admin fixture');
           $fixture=json_decode(file_get_contents($W.'/cp144-fixture.json'),true,512,JSON_THROW_ON_ERROR);$sid=(int)$fixture['hall']['partial']['session'];$s=$c->settlements();$pr=$s->previewRemainingDiscountCorrection($sid,'fixed',26000,$admin);$r=$s->adjustRemainingDiscount($sid,'fixed',26000,$pr['expected_signature'],'QA41B commit boundary','remaining-discount-correction-cc41b',$admin);ck((int)$r['revision_id']>0,'financial revision fixture');
           $f=['tables'=>[],'media'=>tree($cfg['app']['data_dir'].'/guest-media')];ck(count($f['media'])>0,'real nonempty source media');
           foreach($tables as $t)$f['tables'][$t]=digest($p,$t);
           $r=$c->businessBackup()->createEncrypted($backup,$pass,(int)$admin['id']);$f['hash']=hash_file('sha256',$backup);ck($r['sha256']===$f['hash'],'backup bytes');
           file_put_contents($state,json_encode($f,JSON_THROW_ON_ERROR));exit;
          }
          $f=json_decode(file_get_contents($state),true,512,JSON_THROW_ON_ERROR);
          $boundary=$argv[3];if(!in_array($boundary,['before','after'],true))exit(2);
          $db='sokna_cc41b_'.$boundary;$dest=$W.'/cc41b-'.$boundary;$marker=$W.'/boundary-'.$boundary;
          if($mode==='prepare'){
           $p->exec('CREATE DATABASE '.$db.' CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci');
          }
          $t=new BoundaryPDO('mysql:host=127.0.0.1;port=3306;dbname='.$db.';charset=utf8mb4','root',getenv('QA_DB_PASSWORD'),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
          if($mode==='prepare'){
           $t->exec('SET FOREIGN_KEY_CHECKS=0');foreach($p->query("SHOW FULL TABLES WHERE Table_type='BASE TABLE'")->fetchAll(PDO::FETCH_NUM) as $row){$n=$row[0];if(!preg_match('/^[a-zA-Z0-9_]+$/D',$n))exit(2);$t->exec($p->query('SHOW CREATE TABLE `'.$n.'`')->fetch(PDO::FETCH_NUM)[1]);}
           foreach(['schema_migrations','schema_migration_statements'] as $n)foreach($p->query('SELECT * FROM `'.$n.'`')->fetchAll(PDO::FETCH_ASSOC) as $row){$cols=array_keys($row);$t->prepare('INSERT INTO `'.$n.'` (`'.implode('`,`',$cols).'`) VALUES ('.implode(',',array_fill(0,count($row),'?')).')')->execute(array_values($row));}
           $t->exec('SET FOREIGN_KEY_CHECKS=1');mkdir($dest,0700,true);ck((int)scalar($t,'SELECT COUNT(*) FROM users')===0,'empty independent database');exit;
          }
          $o=new \Sokna\Local\Core\Observability($dest);$id='qa41b-'.$boundary;$auth=new \Sokna\Local\Domain\PublicEdge\PublicAuthorityStateService($t,$id);$b=new \Sokna\Local\Domain\Recovery\BusinessBackupService($t,$o,$id,$auth,null,$dest);
          if($mode==='fault'){
           $t->mode=$boundary;$t->dest=$dest;$t->marker=$marker;
           $b->restoreEncryptedToEmptyTarget($backup,$pass,0);throw new RuntimeException('boundary was not interrupted');
          }
          if($mode!=='verify')exit(2);
          ck(file_get_contents($marker)===$boundary,'exact boundary marker');
          ck(tree($dest.'/guest-media')===$f['media'],'promoted media preserved exact');
          foreach($f['tables'] as $n=>$d){ck(digest($p,$n)===$d,'source unchanged '.$n);$v=digest($t,$n);ck($boundary==='before'?$v[0]===0:$v===$d,'target expected '.$n);}
          ck(hash_file('sha256',$backup)===$f['hash'],'backup unchanged');
          try{$b->restoreEncryptedToEmptyTarget($backup,$pass,0);throw new RuntimeException('unexpected retry');}catch(\Sokna\Local\Domain\Recovery\RecoveryException $e){echo 'RETRY_REJECTION '.$e->errorCode."\n";ck(in_array($e->errorCode,['target_not_empty','target_changed','restore_interrupted'],true),'unsafe repeated restore denied');}
          ck(tree($dest.'/guest-media')===$f['media'],'retry preserves media');
          if($boundary==='after')ck($auth->phase()==='reenroll_required','committed authority fenced');
          foreach($f['tables'] as $n=>$d){$v=digest($t,$n);ck($boundary==='before'?$v[0]===0:$v===$d,'no retry mutation '.$n);}
          echo "GROUP PASS real PDO commit boundary $boundary; no production authorization\n";
          SOKNA_CC41B_PHP
          php -l "$W/gate41b.php"
          php "$W/gate41b.php" "$W/local" seed | tee "$W/receipts/seed.txt"
          for boundary in before after; do
            php "$W/gate41b.php" "$W/local" prepare "$boundary"
            set +e
            php "$W/gate41b.php" "$W/local" fault "$boundary" > "$W/receipts/fault-$boundary.txt" 2>&1
            rc=$?
            set -e
            test "$rc" = 137
            php "$W/gate41b.php" "$W/local" verify "$boundary" | tee "$W/receipts/verify-$boundary.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-CC41B-BUSINESS-COMMIT-BOUNDARIES
          path: ${{ runner.temp }}/cc41b/receipts
          retention-days: 7
