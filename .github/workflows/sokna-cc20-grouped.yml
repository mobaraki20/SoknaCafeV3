name: SOKNA RELEASE PRIORITY-37 exact Public Emergency and native Local fixture (QA ONLY)
on:
  push:
    branches: [qa/func-pass02-db-20261127]
    paths: [.github/workflows/sokna-cc20-grouped.yml]
permissions:
  contents: read
  actions: read
jobs:
  public-emergency:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=25
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 46036608931
          name: SOKNA-CC36-FOUR-EXACT-QA-ARCHIVES-NOT-INSTALL
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          run-id: 45774034628
          name: SOKNA-CP110-EXACT-35IP-COMPONENT-UPDATE-QA
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/base
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, zip, mbstring, sodium
      - name: Exercise exact unchanged Public package through production Emergency bridge
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cc37-receipts"
          python3 - <<'PYCODE'
          import pathlib,zipfile,hashlib,json,os
          t=pathlib.Path(os.environ['RUNNER_TEMP']);o=t/'candidate';b=t/'base/SOKNA-PUBLIC-35IY-35IP-CAFE-QA.zip';w=t/'public37';w.mkdir();H=lambda x:hashlib.sha256(x).hexdigest()
          assert H(b.read_bytes())=='2abc6270f88c59afc3e76dc11bd164f5238447b5f9e1f624ba2eb192f04f7e7e'
          rec=json.loads((o/'factory-evidence-decision.json').read_text());assert all(H((o/n).read_bytes())==v['sha256'] for n,v in rec['files'].items())
          with zipfile.ZipFile(b) as z:
              for n in z.namelist():
                  if n.startswith('payload/'):
                      p=w/n[8:];p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(z.read(n))
          with zipfile.ZipFile(o/'PUBLIC-35IZ-CLEAN-WEB-QA-DO-NOT-INSTALL.zip') as z:
              for n,h in rec['public']['protected_pins'].items():
                  v=z.read(n);assert H(v)==h;p=w/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(v)
          PYCODE
          mysql --protocol=TCP -h127.0.0.1 -uroot -p"$QA_DB_PASSWORD" -e 'CREATE DATABASE sokna_ci_emergency37 CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          cat > "$RUNNER_TEMP/emergency37.php" <<'PHPCODE'
          <?php
          declare(strict_types=1);
          use Sokna\PublicEdge\Update\RoutinePublicUpdateService as Routine;
          use Sokna\PublicEdge\Update\IndependentEmergencyRoutineBridge as Bridge;
          use Sokna\PublicEdge\Emergency\PublicUpdateException;
          use Sokna\PublicEdge\Core\Migrations;
          use Sokna\PublicEdge\Health\PublicHealthService;
          if(getenv('GITHUB_ACTIONS')!=='true'||getenv('QA_DB_PASSWORD')!=='synthetic-cp116-ci-only'||$argc!==4)exit(2);
          [$script,$phase,$web,$pkg]=$argv;
          function ck($v,$msg){if(!$v)throw new RuntimeException($msg);echo "PASS $msg\n";}
          $rec=json_decode(file_get_contents(dirname($pkg).'/factory-evidence-decision.json'),true,512,JSON_THROW_ON_ERROR);$want=$rec['public'];ck(hash_file('sha256',$pkg)==='c8dd86c49109c7948e1cab0ffd1d10a74e529587ed4faaf7342a1002adaf38e8','exact CC36 public archive');
          foreach(['src/Shared/IranTime.php','src/Emergency/PublicUpdateException.php','src/Update/RoutinePublicUpdateService.php','src/Core/Migrations.php','src/Core/SafeErrors.php','src/Health/PublicHealthService.php','src/Update/IndependentEmergencyRoutineBridge.php'] as $n)require $web.'/'.$n;
          $storage=$web.'/storage';if(!is_dir($storage))mkdir($storage,0700,true);
          $db=new PDO('mysql:host=127.0.0.1;port=3306;dbname=sokna_ci_emergency37;charset=utf8mb4','root',getenv('QA_DB_PASSWORD'),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);$m=new Migrations($db,$web.'/database/migrations');$h=new PublicHealthService($db,$web,$storage);$r=new Routine($web,$storage,$web.'/resources/update-trust-v1.json',fn()=>$h->status()['status']===200,fn()=>$m->migrate(),null,fn()=>$m->pendingVersions());$b=new Bridge($r,$storage,fn()=>$m->pendingVersions(),fn()=>$h->status()['body']);
          if($phase==='stage'){
           ck(count($m->migrate())===12,'actual baseline DB ledger');$db->exec("INSERT INTO installations(installation_id) VALUES('qa37-preserve')");
           $old=$r->currentVersion();$tree=$r->managedTreeDigest();ck($tree==='c71ab6c235f72afdb9762cc5460a63731770c17086dafa290a21398037fabbe6','exact 35iy baseline');
           // Simulate a previously committed installation using the exact independently verified baseline identity, not a live host.
           mkdir($storage.'/routine-update-v2',0700,true);file_put_contents($storage.'/routine-update-v2/state.json',json_encode(['format'=>'sokna-public-routine-update-state-v2','schema_version'=>2,'active_version'=>$old,'active_managed_tree_sha256'=>$tree,'previous_version'=>'','lkg_recovery_id'=>'','staged'=>null,'pending_verification'=>null,'activation_journal'=>null,'db_forward_fence'=>null,'history'=>[]],JSON_THROW_ON_ERROR));
           $s=$b->snapshot();ck($s['channel']==='emergency_independent_routine_v2'&&$s['managed_tree_matches_expected']===true,'reconciled independent emergency owner');
           $st=$b->stageUploadedZip($pkg,'qa37');ck($st['package_sha256']===hash_file('sha256',$pkg)&&$st['version']===$want['version'],'same archive staged by emergency bridge');ck($r->currentVersion()===$old&&$r->managedTreeDigest()===$tree,'stage leaves active tree unchanged');
           $a=$b->activateStaged('qa37');ck($a['current_version']===$want['version']&&is_array($a['pending_verification'])&&is_file($r->maintenanceLockPath()),'emergency activation stays pending');
           try{$b->stageUploadedZip($pkg,'qa37');throw new RuntimeException('stage unexpectedly accepted');}catch(PublicUpdateException $e){ck($e->errorCode==='routine_activation_in_progress','pending stage cannot be overwritten');}
          }elseif($phase==='commit'){
           ck($r->currentVersion()===$want['version']&&$r->managedTreeDigest()===$want['managed_tree_sha256'],'fresh process exact target tree');
           $s=$b->commitPending('qa37');ck($s['active_version']===$want['version']&&$s['pending_verification']===null&&$s['db_forward_fence']===null&&!is_file($r->maintenanceLockPath()),'fresh emergency commit');ck(count($m->verifiedAppliedVersions())===12&&(int)$db->query("SELECT COUNT(*) FROM installations WHERE installation_id='qa37-preserve'")->fetchColumn()===1,'preserved real data and migration ledger');
           foreach($want['protected_pins'] as $n=>$v)ck(hash_file('sha256',$web.'/'.$n)===$v,'protected unchanged '.$n);
           try{$b->rollback('qa37');throw new RuntimeException('rollback unexpectedly accepted');}catch(PublicUpdateException $e){ck($e->errorCode==='emergency_rollback_not_qualified','unqualified old code rollback rejected');}
          }else exit(2);
          PHPCODE
          php "$RUNNER_TEMP/emergency37.php" stage "$RUNNER_TEMP/public37" "$RUNNER_TEMP/candidate/PUBLIC-35IZ-UPDATE-QA-DO-NOT-INSTALL.zip" | tee "$RUNNER_TEMP/cc37-receipts/emergency-stage.txt"
          php "$RUNNER_TEMP/emergency37.php" commit "$RUNNER_TEMP/public37" "$RUNNER_TEMP/candidate/PUBLIC-35IZ-UPDATE-QA-DO-NOT-INSTALL.zip" | tee "$RUNNER_TEMP/cc37-receipts/emergency-commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-CC37-EMERGENCY-RECEIPTS-QA-ONLY
          path: ${{ runner.temp }}/cc37-receipts/*
          retention-days: 7
  native-local:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {origin: GG, fault: none, ledger: '93'}
          - {origin: C2, fault: none, ledger: '91'}
          - {origin: C2, fault: DATABASE_FORWARD_INTENT, ledger: '91'}
    env:
      SOKNA_R186_CI_ONLY: 'YES'
      SOKNA_BASE_LEDGER: ${{ matrix.ledger }}
      SOKNA_ORIGIN: ${{ matrix.origin }}
      SOKNA_FAULT: ${{ matrix.fault }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0316cf3485467241315c2638dcff47fec3f129d
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: f38c20083068e540d593876a2c527c51e0157f92
          path: native-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.5'}
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '8.0.x'}
      - uses: actions/download-artifact@v4
        with:
          run-id: 46036608931
          name: SOKNA-CC36-FOUR-EXACT-QA-ARCHIVES-NOT-INSTALL
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-CP98-LOCAL-231GG-CONTROLLED-CAFE-OPERATOR
          run-id: 45764512635
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/gg
      - uses: actions/download-artifact@v4
        if: matrix.origin == 'C2'
        with:
          name: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE
          run-id: 45389831526
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/baseline
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-PREREQUISITES-105-QA-CANDIDATE-NOT-INSTALL
          run-id: 45707538026
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/helper
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-APACHE-2471-CANDIDATE-QA-ONLY
          run-id: 45707401488
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apache
      - name: Test quarantine rejection and create isolated positive fixture with identical web bytes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $q=Join-Path $env:RUNNER_TEMP 'candidate/LOCAL-231GH-UPDATE-QA-DO-NOT-INSTALL.zip'
          if((Get-FileHash $q -Algorithm SHA256).Hash.ToLowerInvariant() -cne '19e7591defdb6a368705c9c117ed5bcd048108e2f96484fe9ba0031c4999a117'){throw 'CC36_OUTER_DRIFT'}
          if($env:SOKNA_ORIGIN -eq 'GG'){$env:SOKNA_BASELINE_ZIP=Join-Path $env:RUNNER_TEMP 'gg/SOKNA-LOCAL-231GG-CONTROLLED-CAFE-OPERATOR.zip'}else{$env:SOKNA_BASELINE_ZIP=(Get-ChildItem "$env:RUNNER_TEMP/baseline" -Recurse -File -Filter 'SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip'|Select-Object -First 1).FullName}
          # Actual negative gate must refuse original quarantined outer.
          python native-src/packaging/windows/release-gates/check_local_release_set.py $q --require-installable
          if($LASTEXITCODE -eq 0){throw 'QUARANTINE_UNEXPECTEDLY_INSTALLABLE'}
          'QUARANTINED ORIGINAL REJECTED BY INSTALLABILITY GATE'|Set-Content "$env:RUNNER_TEMP/quarantine-negative.txt"
          @'
          from pathlib import Path
          import os,sys,hashlib,json,zipfile,io,re
          P=Path; H=lambda b:hashlib.sha256(b).hexdigest(); J=lambda x:(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode()
          assert os.environ['GITHUB_ACTIONS']=='true' and os.environ['RUNNER_OS']=='Windows' and os.environ['SOKNA_R186_CI_ONLY']=='YES'
          t=Path(os.environ['RUNNER_TEMP']); q=t/'candidate/LOCAL-231GH-UPDATE-QA-DO-NOT-INSTALL.zip'; old=t/'gg/SOKNA-LOCAL-231GG-CONTROLLED-CAFE-OPERATOR.zip'; base=Path(os.environ['SOKNA_BASELINE_ZIP']);origin=os.environ['SOKNA_ORIGIN'];fault=os.environ['SOKNA_FAULT']
          assert H(q.read_bytes())=='19e7591defdb6a368705c9c117ed5bcd048108e2f96484fe9ba0031c4999a117'
          assert H(old.read_bytes())=='a179c2b339ba07eaecc847f5821c8af2441c972de5e1fd3aa2af1e07f02adb5f'
          with zipfile.ZipFile(q) as z:m=json.loads(z.read('release-set.json'));w=z.read('artifacts/local/web.zip');assert z.testzip() is None
          with zipfile.ZipFile(old) as z:prior=json.loads(z.read('release-set.json'))
          assert m['for_install'] is False and m['production_pass'] is False and m['qa_notes']['operator_install_allowed'] is False
          assert H(w)=='f52ca7cd1db3652c8ad5f5b31dc780ccf08c80a674cb67e03a1a5b219c66220f'
          assert m['targets']['local']['managed_tree_sha256']=='f6a745b7febaacc4d312b4bb4f0ceab2e3c176ef6a04b73638733be3a6a6e950'
          assert prior['targets']['local'] in [x['local'] for x in m['supported_baselines']]
          # CI fixture ONLY, not operational admission, with same inner bytes. Do not publish fixture.
          m.update(for_install=True,production_pass=True,qualification=prior['qualification'],status='CONTROLLED_HOME_CANARY_FIELD_ACCEPTANCE_PENDING',qa_notes={'scope':'DISPOSABLE_CI_FIXTURE_ONLY_NOT_RELEASE','distribution_authorized':False,'production_accepted':False,'field_install_verified':False,'source_quarantine_sha256':H(q.read_bytes()),'historical_qualification_fixture_only':True})
          out=t/'LOCAL-231GH-PANEL-FIXTURE-CI-ONLY.zip'
          with zipfile.ZipFile(out,'w') as z:
           for n,b in sorted({'release-set.json':J(m),'artifacts/local/web.zip':w}.items()):
            i=zipfile.ZipInfo(n,(2026,11,27,0,0,0));i.create_system=3;i.external_attr=0o100644<<16;i.compress_type=zipfile.ZIP_DEFLATED;z.writestr(i,b,compresslevel=9)
          with zipfile.ZipFile(out) as z:assert z.read('artifacts/local/web.zip')==w
          script=Path('qa/factory/prepare_checkpoint77_native.py' if fault=='none' else 'qa/factory/prepare_checkpoint83_fault.py');s=script.read_text(encoding='utf-8')
          s=s.replace("origin=os.environ[\"SOKNA_ORIGIN\"]", "origins['GG']=('a179c2b339ba07eaecc847f5821c8af2441c972de5e1fd3aa2af1e07f02adb5f','bafc41567eb3ed3db042855474bf51fdacc2a926094885f561411ae4dae42fa6')\norigin=os.environ[\"SOKNA_ORIGIN\"]")
          s=s.replace('LOCAL-231GG-PANEL-FIXTURE-CI-ONLY.zip','LOCAL-231GH-PANEL-FIXTURE-CI-ONLY.zip').replace('2c14b241a3cddf5f1d436144691555b11a97ccc31b4d08b2ea8f8d92f04e3aa6',H(w)).replace("@('GE','GF')","@('GE','GF','GG')")
          s=s.replace(" $fault=$env:SOKNA_FAULT\n $args=", " $fault=$env:SOKNA_FAULT\n $args=")
          # Preserve exact previous runner behavior, add separate evidence of quarantine rejection via the static install gate.
          s=s.replace("(tmp/'native-matrix.ps1').write_text(s,encoding='utf8')", "(tmp/'native-matrix.ps1').write_text(s,encoding='utf8')")
          os.environ['SOKNA_CURRENT_QA_ZIP']=str(out);os.environ['SOKNA_MATRIX_TARGET_ZIP']=str(out)
          exec(compile(s,str(script),'exec'),{'__file__':str(script.resolve()),'__name__':'__main__'})
          # Export exact fixture path and pinned original hash for separate receipt reconciliation.
          (t/'cc37-fixture.json').write_bytes(J({'source_outer_sha256':H(q.read_bytes()),'fixture_outer_sha256':H(out.read_bytes()),'web_sha256':H(w),'target_tree_sha256':m['targets']['local']['managed_tree_sha256'],'origin':origin,'fault':fault,'production_authorized':False,'scope':'DISPOSABLE_CI_ONLY'}))
          '@ | Set-Content "$env:RUNNER_TEMP/native37.py" -Encoding utf8NoBOM
          python "$env:RUNNER_TEMP/native37.py"
          if($LASTEXITCODE -ne 0){throw 'FIXTURE_PREPARE_FAILED'}
          $env:SOKNA_MATRIX_TARGET_ZIP=Join-Path $env:RUNNER_TEMP 'LOCAL-231GH-PANEL-FIXTURE-CI-ONLY.zip'
          Copy-Item qa/checkpoint61/BridgeHarness.cs native-src/qa/sokna-r186/R186Harness.cs -Force
          Push-Location native-src
          try {
            & (Join-Path $env:RUNNER_TEMP 'native-matrix.ps1')
            if($LASTEXITCODE -ne 0){throw 'NATIVE_MATRIX_FAILED'}
          }finally{Pop-Location}
      - name: Bind native test receipt to original and identical web bytes, not original outer admission
        shell: pwsh
        run: |
          $r=Get-Content "$env:RUNNER_TEMP/matrix-receipt.json" -Raw|ConvertFrom-Json
          $f=Get-Content "$env:RUNNER_TEMP/cc37-fixture.json" -Raw|ConvertFrom-Json
          if($r.status -ne 'PASS' -or $r.candidate_sha256 -cne $f.fixture_outer_sha256 -or $r.target_tree_sha256 -cne $f.target_tree_sha256 -or !$r.independent_restore -or $r.actual_field_host -or $r.distribution_authorized){throw 'RECEIPT_DRIFT'}
          if($r.phase -ne 'COMMITTED' -or $r.migrations -ne 93){throw 'FORWARD_COMMIT_NOT_PROVEN'}
          if($env:SOKNA_FAULT -eq 'none' -and !$r.panel_activation_tested){throw 'PANEL_NOT_PROVEN'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-CC37-NATIVE-${{ matrix.origin }}-${{ matrix.fault }}-QA-ONLY
          path: |
            ${{ runner.temp }}/matrix-receipt.json
            ${{ runner.temp }}/cc37-fixture.json
            ${{ runner.temp }}/quarantine-negative.txt
          if-no-files-found: warn
          retention-days: 7
