          php qa/cp160/fixture.php "$W/local" > "$W/receipts/fixture.txt"
          cat > "$W/gate50.php" <<'PHP50'
          <?php
          declare(strict_types=1);
          use Sokna\Local\Domain\Recovery\BusinessBackupService;
          use Sokna\Local\Domain\Recovery\MediaSnapshotCodec;
          use Sokna\Local\Domain\Recovery\RecoveryException;
          use Sokna\Local\Core\Observability;
          use Sokna\Local\Domain\PublicEdge\PublicAuthorityStateService;
          if(PHP_SAPI!=='cli'||getenv('SOKNA_QA_DISPOSABLE')!=='YES'||getenv('QA_DB_PASSWORD')!=='synthetic-cp116-ci-only')exit(2);
          $W=realpath($argv[1]);require $W.'/local/bootstrap.php';$cfg=require $W.'/config.php';
          if(($cfg['db']['host']??'')!=='127.0.0.1'||($cfg['db']['name']??'')!=='sokna_cp150')exit(2);
          $core=sokna_local_bootstrap($cfg);$p=$core->database();
          function ck($v,$n){if(!$v)throw new RuntimeException($n);echo "PASS $n\n";}
          function reject(callable $fn,array $codes,string $label){try{$fn();}catch(RecoveryException $e){ck(in_array($e->errorCode,$codes,true),$label.' '.$e->errorCode);return;}throw new RuntimeException('unexpected success '.$label);}
          class UncertainResponsePDO extends PDO {
           public string $scenario='';
           public function commit():bool {
            if($this->scenario==='')return parent::commit();
            $mode=$this->scenario;$this->scenario='';
            // The actual DB ends its transaction. The synthetic caller receives an
            // exception instead of the usual response, to exercise both uncertain outcomes.
            $ok=$mode==='committed'?parent::commit():parent::rollBack();
            if(!$ok)throw new RuntimeException('fixture database outcome failed');
            throw new RuntimeException('synthetic acknowledgement unavailable');
           }
          }
          $backup=$W.'/synthetic-backup.skbf';$pass='synthetic-recovery49-password';$source=$cfg['app']['data_dir'];file_put_contents($source.'/guest-media/qa49-source-only.bin','synthetic media distinction');
          $sourceMedia=MediaSnapshotCodec::scan($source);$r=$core->businessBackup()->createEncrypted($backup,$pass,0);$hash=hash_file('sha256',$backup);ck($hash===$r['sha256'],'real encrypted backup SHA');
          $orders=(int)$p->query('SELECT COUNT(*) FROM orders')->fetchColumn();ck($orders>0,'nonempty synthetic source');
          foreach(['rolledback','committed'] as $mode){
           $name='sokna_cc49_'.$mode;$target=$W.'/target-'.$mode;$dest=$target.'/data';
           $setup=new \Sokna\Local\Setup\BrowserSetupService($target,$target.'/local');
           $setup->installNew(['data_dir'=>$dest,'db'=>['host'=>'127.0.0.1','port'=>'3306','name'=>$name,'user'=>'root','pass'=>getenv('QA_DB_PASSWORD')],'create_database'=>true,'admin_user'=>'qa-seed49','admin_password'=>'synthetic-seed-only-password','cafe_name'=>'QA49','table_count'=>3]);
           $tcfg=require $target.'/config.php';$iid=$tcfg['installation']['id'];$receipt=$dest.'/recovery-fresh-seed-v1.json';$proof=file_get_contents($receipt);$original=MediaSnapshotCodec::scan($dest);ck($proof!==false&&count($original)>0&&$original!==$sourceMedia,'actual pristine seed and different source media '.$mode);
           $t=new UncertainResponsePDO('mysql:host=127.0.0.1;port=3306;dbname='.$name.';charset=utf8mb4','root',getenv('QA_DB_PASSWORD'),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,PDO::ATTR_DEFAULT_FETCH_MODE=>PDO::FETCH_ASSOC]);
