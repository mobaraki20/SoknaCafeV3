name: SOKNA 44 read-only report acceptance (QA ONLY)
on:
  push:
    branches: [qa/func-pass02-db-20261127]
    paths: [.github/workflows/sokna-cc20-grouped.yml]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
      SOKNA_QA_DISPOSABLE: YES
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6983e9d52435a746325f60ace428b8548bcc8fc0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 46036608931
          name: SOKNA-CC36-FOUR-EXACT-QA-ARCHIVES-NOT-INSTALL
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Read-only HTTP and workbook checks using synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cc44"; mkdir -p "$W/local" "$W/public" "$W/receipts"
          A="$RUNNER_TEMP/candidate/LOCAL-231GH-CLEAN-WEB-QA-DO-NOT-INSTALL.zip"
          B="$RUNNER_TEMP/candidate/PUBLIC-35IZ-CLEAN-WEB-QA-DO-NOT-INSTALL.zip"
          echo "f52ca7cd1db3652c8ad5f5b31dc780ccf08c80a674cb67e03a1a5b219c66220f  $A" | sha256sum -c -
          echo "9317be75ca5d31b2577aee7e5adb07f14dbb69053f47c647b8d705970d84d5fd  $B" | sha256sum -c -
          unzip -q "$A" -d "$W/local"
          unzip -q "$B" -d "$W/public"
          export QA_WORK="$W" TMPDIR="$W"
          python - "$W" <<'PATCH44'
          from pathlib import Path
          import sys,hashlib
          r=Path(sys.argv[1])
          def change(n,old,new):
           p=r/n;s=p.read_text();assert s.count(old)==1,(n,s.count(old));p.write_text(s.replace(old,new))
          policy="""    /** Existing inventory-cost capability also protects derived cost and margin report sections. */
              public static function restrictCostReport(array $report): array
              {
                  unset($report['inventory'],$report['margin']);
                  $restricted=['inventory','margin','pricing'];
                  $all=['overview','operations','inventory','margin','pricing','financial','activity','tenders','trends','item-sales'];
                  $report['available_sections']=array_values(array_diff($report['available_sections']??$all,$restricted));
                  $report['restricted_sections']=$restricted;
                  return $report;
              }
          
          """
          p='local/src/Domain/Reporting/ReportingService.php'
          change(p,'    /** Build current filtered report workbook using current_view_v1 schema. */',policy+'    /** Build current filtered report workbook using current_view_v1 schema. */')
          change(p,'?string $query=null): string\n    {\n        $r=$this->report($from,$to);','?string $query=null,bool $includeCost=true): string\n    {\n        $r=$this->report($from,$to);')
          change(p,"        $sheets=array_merge($sheets,PersianReportExport::current($r));", "        if(!$includeCost)$sheets=array_values(array_filter($sheets,static fn(array $sheet):bool=>!in_array($sheet['name'],['Inventory_Cost','Contribution_Margin','Margin_Items','Margin_Categories'],true)));\n        $sheets=array_merge($sheets,PersianReportExport::current($r));")
          p='local/public/reports/api.php';change(p,"    WebAction::requireAny($core,['cashier_accounts','shift_supervision']);\n    WebAction::json(['success'=>true,'report'=>$core->reporting()->report((string)($_GET['from']??''),(string)($_GET['to']??''))]);", "    $viewer=WebAction::requireAny($core,['cashier_accounts','shift_supervision']);\n    $report=$core->reporting()->report((string)($_GET['from']??''),(string)($_GET['to']??''));\n    if(!$core->auth()->hasCapability('inventory_cost_view',$viewer))$report=\\Sokna\\Local\\Domain\\Reporting\\ReportingService::restrictCostReport($report);\n    WebAction::json(['success'=>true,'report'=>$report]);")
          p='local/public/reports/export.php';change(p,"ActivityFilterInput::family($_GET['family']??null),(string)($_GET['q']??''));", "ActivityFilterInput::family($_GET['family']??null),(string)($_GET['q']??''),$core->auth()->hasCapability('inventory_cost_view',$user));")
          p='local/public/reports/export-analytical.php';change(p,"$user=WebAction::requireAny($core,['shift_supervision']);", "$user=WebAction::requireAny($core,['shift_supervision']);\nif(!$core->auth()->hasCapability('inventory_cost_view',$user))WebAction::json(['success'=>false,'code'=>'forbidden','message'=>'دسترسی مشاهده هزینه مواد فعال نیست.'],403);")
          p='public/src/Remote/RemoteReadModelService.php';change(p,"        if ($modelKey === 'reports' && !$this->hasCapability($session,'shift_supervision')) unset($payload['activity']);", "        if ($modelKey === 'reports' && !$this->hasCapability($session,'shift_supervision')) unset($payload['activity']);\n        if ($modelKey === 'reports' && !$this->hasCapability($session,'inventory.cost.read')) $payload=self::restrictCostReport($payload);")
          change(p,'    private function filterOperations(array $payload,array $session): array',policy+'    private function filterOperations(array $payload,array $session): array')
          pins={
          'local/public/reports/api.php':'42661d6e756fbc082c251e4667c20316f147ac77f51368c918ed9dc05279f128',
          'local/public/reports/export-analytical.php':'f300ecd2ae34939d1743fbef5c655402189310de64d1a1d34adea128a7b85a33',
          'local/public/reports/export.php':'62b75671f53bc7e5e6dc4cf2bae4fabc27a48551738fbb9528663fe008d638b4',
          'local/src/Domain/Reporting/ReportingService.php':'0202e774d233890520d8bae134b92f7b732330141caef422a3a71f8feb131eda',
          'public/src/Remote/RemoteReadModelService.php':'e112f181409e95c61a02eb8d33b6fdbe1b0a695acdd402761ba19b96af0b167a'}
          for n,h in pins.items():
           assert hashlib.sha256((r/n).read_bytes()).hexdigest()==h,n
           print('PASS exact report component',n)
          PATCH44
          php qa/cp148/preflight.php
          php qa/cp160/fixture.php "$W/local"
          php qa/cp160/public-fixture.php "$W/public"
          PHP_CLI_SERVER_WORKERS=6 php -S 127.0.0.1:18765 -t "$W/local/public" >"$W/receipts/local-http.log" 2>&1 &
          PHP_CLI_SERVER_WORKERS=6 php -S 127.0.0.1:18766 -t "$W/public" "$W/public/index.php" >"$W/receipts/public-http.log" 2>&1 &
          sleep 2
          php qa/cp160/worker.php "$W/local" init
          cat > "$W/report44.py" <<'REPORT44'
          import json,sys,urllib.request,urllib.parse,urllib.error,http.cookiejar,zipfile,io,xml.etree.ElementTree as ET
          from pathlib import Path
          w=Path(sys.argv[1]);f=json.loads((w/'cp144-fixture.json').read_text());iid=f['installation'];day=f['report_day']
          L='http://127.0.0.1:18765';P='http://127.0.0.1:18766/public'
          def ck(x,n):
           assert x,n
           print('PASS',n,flush=True)
          def session(base,user):
           c=http.cookiejar.CookieJar();o=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(c));url=base+('/login.php' if base==L else '/staff/login')
           data={'username':user,'password':'synthetic-qa-admin-not-real' if user=='qa-target' else 'synthetic-member-only'}
           if base==P:data['installation_id']=iid
           o.open(url,urllib.parse.urlencode(data).encode(),timeout=20).close()
           return o
          def get(o,url):
           try:
            with o.open(url,timeout=30) as r:return r.status,r.read()
           except urllib.error.HTTPError as e:return e.code,e.read()
          def sheets(b):
           with zipfile.ZipFile(io.BytesIO(b)) as z:
            return {e.attrib['name'] for e in ET.fromstring(z.read('xl/workbook.xml')).iter() if e.tag.endswith('}sheet')}
          restricted={'Inventory_Cost','Contribution_Margin','Margin_Items','Margin_Categories'}
          for user,allowed in [('qa-target',True),('qa-cashier',False)]:
           for base in [L,P]:
            o=session(base,user);q='?from='+day+'&to='+day
            code,b=get(o,base+('/reports/api.php' if base==L else '/staff/reports-adapter')+q)
            ck(code==200,'ordinary report '+user+' '+base);r=json.loads(b)['report']
            ck(('inventory' in r and 'margin' in r) if allowed else ('inventory' not in r and 'margin' not in r),'cost section authorization '+user+' '+base)
            ck('net_sales' in r['summary'],'ordinary sales retained '+user+' '+base)
            if base==P:
             code,b=get(o,P+'/api/staff/read?model=reports');ck(code==200,'raw report GET '+user)
             p=json.loads(b)['payload'];ck(('inventory' in p and 'margin' in p) if allowed else ('inventory' not in p and 'margin' not in p),'raw cost boundary '+user)
            else:
             code,b=get(o,L+'/reports/export.php'+q);ck(code==200,'current workbook '+user);names=sheets(b)
             ck(restricted<=names if allowed else not restricted&names,'actual workbook cost sheets '+user)
             code,b=get(o,L+'/reports/export-analytical.php'+q)
             ck(code==200 if allowed else code==403,'analytical authorization '+user)
          print('GROUP PASS read-only report regression')
          REPORT44
          python "$W/report44.py" "$W" | tee "$W/receipts/results.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-CC44-REPORT-RECEIPTS
          path: ${{ runner.temp }}/cc44/receipts
          retention-days: 7
