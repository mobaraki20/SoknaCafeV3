name: SOKNA 46 register exact frozen QA archives - no deploy
on:
  push:
    branches: [qa/func-pass02-db-20261127]
    paths: [.github/workflows/sokna-cc20-grouped.yml]
permissions:
  contents: read
  actions: read
jobs:
  exact-archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 46036608931
          name: SOKNA-CC36-FOUR-EXACT-QA-ARCHIVES-NOT-INSTALL
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - name: Reproduce the four frozen hashes without changing candidate status
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cc46"; mkdir -p "$W/local" "$W/public" "$W/out"
          A="$RUNNER_TEMP/candidate/LOCAL-231GH-CLEAN-WEB-QA-DO-NOT-INSTALL.zip"
          B="$RUNNER_TEMP/candidate/PUBLIC-35IZ-CLEAN-WEB-QA-DO-NOT-INSTALL.zip"
          echo "f52ca7cd1db3652c8ad5f5b31dc780ccf08c80a674cb67e03a1a5b219c66220f  $A" | sha256sum -c -
          echo "9317be75ca5d31b2577aee7e5adb07f14dbb69053f47c647b8d705970d84d5fd  $B" | sha256sum -c -
          unzip -q "$A" -d "$W/local"
          unzip -q "$B" -d "$W/public"
          python - "$W" <<'PATCH44'
          from pathlib import Path
          import sys,hashlib
          r=Path(sys.argv[1])
          def change(n,old,new):
           p=r/n;s=p.read_text();assert s.count(old)==1,(n,s.count(old));p.write_text(s.replace(old,new))
          policy="""    /** Existing inventory-cost capability also protects derived cost and margin report sections. */
              public static function restrictCostReport(array $report): array
              {
                  unset($report['inventory'],$report['margin']);
                  $restricted=['inventory','margin','pricing'];
                  $all=['overview','operations','inventory','margin','pricing','financial','activity','tenders','trends','item-sales'];
                  $report['available_sections']=array_values(array_diff($report['available_sections']??$all,$restricted));
                  $report['restricted_sections']=$restricted;
                  return $report;
              }
          
          """
          p='local/src/Domain/Reporting/ReportingService.php'
          change(p,'    /** Build current filtered report workbook using current_view_v1 schema. */',policy+'    /** Build current filtered report workbook using current_view_v1 schema. */')
          change(p,'?string $query=null): string\n    {\n        $r=$this->report($from,$to);','?string $query=null,bool $includeCost=true): string\n    {\n        $r=$this->report($from,$to);')
          change(p,"        $sheets=array_merge($sheets,PersianReportExport::current($r));", "        if(!$includeCost)$sheets=array_values(array_filter($sheets,static fn(array $sheet):bool=>!in_array($sheet['name'],['Inventory_Cost','Contribution_Margin','Margin_Items','Margin_Categories'],true)));\n        $sheets=array_merge($sheets,PersianReportExport::current($r));")
          p='local/public/reports/api.php';change(p,"    WebAction::requireAny($core,['cashier_accounts','shift_supervision']);\n    WebAction::json(['success'=>true,'report'=>$core->reporting()->report((string)($_GET['from']??''),(string)($_GET['to']??''))]);", "    $viewer=WebAction::requireAny($core,['cashier_accounts','shift_supervision']);\n    $report=$core->reporting()->report((string)($_GET['from']??''),(string)($_GET['to']??''));\n    if(!$core->auth()->hasCapability('inventory_cost_view',$viewer))$report=\\Sokna\\Local\\Domain\\Reporting\\ReportingService::restrictCostReport($report);\n    WebAction::json(['success'=>true,'report'=>$report]);")
          p='local/public/reports/export.php';change(p,"ActivityFilterInput::family($_GET['family']??null),(string)($_GET['q']??''));", "ActivityFilterInput::family($_GET['family']??null),(string)($_GET['q']??''),$core->auth()->hasCapability('inventory_cost_view',$user));")
          p='local/public/reports/export-analytical.php';change(p,"$user=WebAction::requireAny($core,['shift_supervision']);", "$user=WebAction::requireAny($core,['shift_supervision']);\nif(!$core->auth()->hasCapability('inventory_cost_view',$user))WebAction::json(['success'=>false,'code'=>'forbidden','message'=>'دسترسی مشاهده هزینه مواد فعال نیست.'],403);")
          p='public/src/Remote/RemoteReadModelService.php';change(p,"        if ($modelKey === 'reports' && !$this->hasCapability($session,'shift_supervision')) unset($payload['activity']);", "        if ($modelKey === 'reports' && !$this->hasCapability($session,'shift_supervision')) unset($payload['activity']);\n        if ($modelKey === 'reports' && !$this->hasCapability($session,'inventory.cost.read')) $payload=self::restrictCostReport($payload);")
          change(p,'    private function filterOperations(array $payload,array $session): array',policy+'    private function filterOperations(array $payload,array $session): array')
          pins={
          'local/public/reports/api.php':'42661d6e756fbc082c251e4667c20316f147ac77f51368c918ed9dc05279f128',
          'local/public/reports/export-analytical.php':'f300ecd2ae34939d1743fbef5c655402189310de64d1a1d34adea128a7b85a33',
          'local/public/reports/export.php':'62b75671f53bc7e5e6dc4cf2bae4fabc27a48551738fbb9528663fe008d638b4',
          'local/src/Domain/Reporting/ReportingService.php':'0202e774d233890520d8bae134b92f7b732330141caef422a3a71f8feb131eda',
          'public/src/Remote/RemoteReadModelService.php':'e112f181409e95c61a02eb8d33b6fdbe1b0a695acdd402761ba19b96af0b167a'}
          for n,h in pins.items():
           assert hashlib.sha256((r/n).read_bytes()).hexdigest()==h,n
           print('PASS exact report component',n)
          
          p='local/src/Domain/PublicEdge/PublicEdgeSyncClient.php'
          old="        if($phase==='reenroll_required'&&$path!=='/api/v1/local/authority/fence')throw"
          change(p,old,"        if($phase==='reenroll_required'&&$path==='/api/v1/local/authority/fence')return;\n"+old)
          p='local/public/reports/index.php';change(p,"$workspaceExportAnalytical=$canAudit?", "$workspaceExportAnalytical=$pricingEnabled?")
          for p in ['local/public/assets/reports-workspace.js','public/assets/reports-workspace.js']:
           change(p,"message=el('div','sc-alert sc-alert--info','تحلیل تفصیلی این بازه همگام نشده است. خلاصه فروش و روند را می‌توانی ببینی.');", "message=el('div','sc-alert sc-alert--info',(x.restricted_sections||[]).includes(section.dataset.reportSection)?'مجوز مشاهده بهای مواد و حاشیه مشارکت فعال نیست.':'تحلیل تفصیلی این بازه همگام نشده است. خلاصه فروش و روند را می‌توانی ببینی.');")
           change(p,'if(message)message.hidden=supported;for(const child', "if(message){message.hidden=supported;if(!supported)message.textContent=(x.restricted_sections||[]).includes(section.dataset.reportSection)?'مجوز مشاهده بهای مواد و حاشیه مشارکت فعال نیست.':'تحلیل تفصیلی این بازه همگام نشده است. خلاصه فروش و روند را می‌توانی ببینی.';}for(const child")
          for n,h in {'local/public/assets/reports-workspace.js':'b7002b3b16603b8a6c39026cb29fb7609018f4e56143ac4f7f1a61997caa9a0d','local/public/reports/index.php':'63d52ca980898a75cb1c5d745b439b3cd9f2e97c2080a1562d82a050fb0af7e4','local/src/Domain/PublicEdge/PublicEdgeSyncClient.php':'81f25615f0fedca55368061046ffbcc5193b17e623d8789ea5a558fce4bef123','public/assets/reports-workspace.js':'9780e5f5c1300230908b2ecd6591c375828b470c0e00e8caeb7b911c4272c5af'}.items():
           assert hashlib.sha256((r/n).read_bytes()).hexdigest()==h,n
           print('PASS exact component',n)
          PATCH44
          cat > "$W/replay.py" <<'REPLAY'
          from pathlib import Path
          import zipfile,io,json,hashlib,sys
          H=lambda b:hashlib.sha256(b).hexdigest()
          J=lambda x:(json.dumps(x,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n').encode()
          root,lb,pb,out=map(Path,sys.argv[1:]);out.mkdir(parents=True,exist_ok=True)
          def read(b):
           with zipfile.ZipFile(io.BytesIO(b)) as z:
            assert z.testzip() is None and len(z.namelist())==len(set(z.namelist()))
            assert all(n and not n.startswith('/') and '..' not in n.split('/') and '\\' not in n for n in z.namelist())
            return {n:z.read(n) for n in z.namelist() if not n.endswith('/')}
          def pack(d):
           b=io.BytesIO()
           with zipfile.ZipFile(b,'w') as z:
            for n,v in sorted(d.items()):
             i=zipfile.ZipInfo(n,(2026,11,27,0,0,0));i.create_system=3;i.external_attr=0o100644<<16;i.compress_type=zipfile.ZIP_DEFLATED
             z.writestr(i,v,compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
           return b.getvalue()
          def tree(d):return H(''.join(n+'\0'+H(b)+'\n' for n,b in sorted(d.items())).encode())
          def canonical(d,ex):return H(''.join(n+'\0'+str(len(b))+'\0'+H(b)+'\n' for n,b in sorted(d.items()) if n not in ex).encode())
          def walk(p):return {f.relative_to(p).as_posix():f.read_bytes() for f in p.rglob('*') if f.is_file()}
          L=walk(root/'local');Pfull=walk(root/'public');assert len(L)==626 and len(Pfull)==258
          assert H(lb.read_bytes())=='19e7591defdb6a368705c9c117ed5bcd048108e2f96484fe9ba0031c4999a117';assert H(pb.read_bytes())=='c8dd86c49109c7948e1cab0ffd1d10a74e529587ed4faaf7342a1002adaf38e8'
          a=read(lb.read_bytes());m=json.loads(a['release-set.json']);L0=read(a['artifacts/local/web.zip']);b=read(pb.read_bytes());pm=json.loads(b['manifest.json']);P0={n[8:]:v for n,v in b.items() if n.startswith('payload/')}
          assert tree(L0)==m['targets']['local']['managed_tree_sha256'] and tree(P0)==pm['target_managed_tree_sha256']
          protected={n:Pfull[n] for n in set(Pfull)-set(P0)}
          assert len(protected)==6
          P={n:v for n,v in Pfull.items() if n not in protected}
          for d,old,count in [(L,L0,93),(P,P0,12)]:
           assert not set(old)-set(d)
           mig=lambda a:{n:H(v) for n,v in a.items() if n.startswith('database/migrations/') and n.endswith('.sql')}
           assert len(mig(d))==count and mig(d)==mig(old)
           assert all(d[n]==old[n] for n in old if (('/Update/' in n or '/Emergency/' in n) and n!='src/Update/emergency-owner-v1.json') or n=='emergency.php')
          source_sha='7df0e9b58f56aa5b73e577bdba9fa135c1912ee7caf98e02ee38209f2bbaf3db'
          lv='3.0.0-g6.2-workspace.231gi-cc43-qa';pv='3.0.0-g3.6-workspace.35ja-cc43-qa';lr='sokna-local-231gi-cc43-qa';pr='sokna-public-35ja-cc43-qa';status='QUARANTINED_EXACT_CANDIDATE_NOT_FOR_INSTALL'
          key='resources/local-managed-files-v1.json';idx=json.loads(L[key]);idx['files']=sorted(L);L[key]=J(idx)
          for d,v,rel,orig in [(L,lv,lr,[x['local']['version'] for x in m['supported_baselines']]),(P,pv,pr,[x['version'] for x in pm['compatibility']['supported_baselines']])]:
           d['VERSION.txt']=(v+'\n').encode()
           if d is P:
            k='src/Update/emergency-owner-v1.json';o=json.loads(d[k]);assert o['sha256']==H(d['src/Update/EmergencyOwnerCandidate.php']);o['release_version']=v;d[k]=J(o)
           k='resources/release-identity-v1.json';i=json.loads(d[k]);ex=set(i['source']['digest_excludes']);i.update(version=v,release_set_id=rel,qualification={'tier':status,'claim_rule':'QA only; new exact package gates required; no operational distribution.'});i['baseline']['source_versions']=orig;i['source'].update(canonical_tree_sha256=canonical(d,ex),canonical_file_count=len(set(d)-ex),managed_file_count=len(d),source_ref='SHA256:'+source_sha+' CC43 integrated');d[k]=J(i)
           k='resources/build-provenance.json';p=json.loads(d[k]);p.update(version=v,release_set_id=rel,classification=status,consolidated_source_sha256=source_sha,source='sha256:'+source_sha,scope='CC43 integrated source, CP76-format QA candidate, no deployment',created_at='2026-11-27T00:00:00Z',full_business_acceptance=False,installed_host_accepted=False,production_host_install_verified=False,operator_warning='DO NOT INSTALL; exact candidate acceptance pending');d[k]=J(p);assert canonical(d,ex)==i['source']['canonical_tree_sha256']
          web=pack(L);m['targets']['local'].update(version=lv,release_id=lr,managed_files=len(L),managed_tree_sha256=tree(L));m['artifacts']['local-web'].update(sha256=H(web),size_bytes=len(web));m.update(release_set_id=lr,sequence=202611270002,created_at='2026-11-27T00:00:00Z',status=status,for_install=False,production_pass=False,signature=None);m['qualification']={k:(False if isinstance(v,bool) else 0 if isinstance(v,int) else 'PENDING_EXACT_CANDIDATE_QA') for k,v in m['qualification'].items()};m['qa_notes']={'scope':'QUARANTINED_EXACT_CANDIDATE_NOT_FOR_INSTALL','operator_install_allowed':False,'cafe_production_approved':False,'field_install_verified':False,'source_sha256':source_sha,'prior_format':'CP76/CP98','qualification':'New exact receipts required'}
          pm.update(version=pv,target_managed_tree_sha256=tree(P),files=[{'path':n,'sha256':H(v),'size':len(v)} for n,v in sorted(P.items())]);pm['provenance'].update(build='CC43 candidate from integrated CC43 source',source_archive_sha256=source_sha,origin_package_sha256=H(pb.read_bytes()),modified_files=sorted(n for n,v in P.items() if v!=P0.get(n)),installation_authorized=False,production_host_qualified=False,offline_qualified=False,release_qualification=status,qualification_qa_run='PENDING_EXACT_CANDIDATE_QA')
          files={'LOCAL-231GI-UPDATE-QA-DO-NOT-INSTALL.zip':pack({'release-set.json':J(m),'artifacts/local/web.zip':web}),'LOCAL-231GI-CLEAN-WEB-QA-DO-NOT-INSTALL.zip':web,'PUBLIC-35JA-UPDATE-QA-DO-NOT-INSTALL.zip':pack({'manifest.json':J(pm)}|{'payload/'+n:v for n,v in P.items()}),'PUBLIC-35JA-CLEAN-WEB-QA-DO-NOT-INSTALL.zip':pack(P|protected)}
          expected={'LOCAL-231GI-CLEAN-WEB-QA-DO-NOT-INSTALL.zip':'cb0becfba394ae320c389817eb75cf28ae26c09b579f8f3cc64e1a66b98c892a','LOCAL-231GI-UPDATE-QA-DO-NOT-INSTALL.zip':'41a7622255ba11fc8664c3cc6441fefe4ba88d0892743cad452171a4e7685c0d','PUBLIC-35JA-CLEAN-WEB-QA-DO-NOT-INSTALL.zip':'fd320cacb1518c1937d3251b8a950a5019cca7267eb60e3f2bfc7b1511f744ca','PUBLIC-35JA-UPDATE-QA-DO-NOT-INSTALL.zip':'3b297bb2561caeb9fd1dcb57d165270d6e4f4ba476d432b2672c6d2162c42077'}
          assert set(expected)==set(files)
          for n,v in files.items():
           assert H(v)==expected[n],(n,H(v),expected[n])
           assert read(v)
          for n,v in files.items():
           (out/n).write_bytes(v)
           print('EXACT MATCH',n,H(v))
          (out/'SHA256SUMS.txt').write_text(''.join(expected[n]+'  '+n+'\n' for n in sorted(expected)))
          (out/'candidate-receipt.json').write_bytes(J({'checkpoint':'CC43','scope':'REPRODUCED_EXACT_QA_BYTES_NOT_INSTALLABLE','source_sha256':source_sha,'packages':expected,'production_authorized':False,'local_clean_web_only':True}))
          REPLAY
          python "$W/replay.py" "$W" "$RUNNER_TEMP/candidate/LOCAL-231GH-UPDATE-QA-DO-NOT-INSTALL.zip" "$RUNNER_TEMP/candidate/PUBLIC-35IZ-UPDATE-QA-DO-NOT-INSTALL.zip" "$W/out"
      - uses: actions/upload-artifact@v4
        with:
          name: SOKNA-CC43-EXACT-FROZEN-CANDIDATES-QA-NOT-INSTALL
          path: ${{ runner.temp }}/cc46/out
          if-no-files-found: error
          retention-days: 30
