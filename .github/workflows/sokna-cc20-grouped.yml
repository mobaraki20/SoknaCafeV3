name: SOKNA 48 exact frozen Local standard clean setup on Windows (QA only)
on:
  push:
    branches: [qa/func-pass02-db-20261127]
    paths: [.github/workflows/sokna-cc20-grouped.yml]
permissions:
  contents: read
  actions: read
jobs:
  native-clean:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOKNA_R186_CI_ONLY: 'YES'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c0316cf3485467241315c2638dcff47fec3f129d
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-CC43-EXACT-FROZEN-CANDIDATES-QA-NOT-INSTALL
          run-id: 46056788008
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/cp76/out
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-PREREQUISITES-105-QA-CANDIDATE-NOT-INSTALL
          run-id: 45707538026
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/helper
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-APACHE-2471-CANDIDATE-QA-ONLY
          run-id: 45707401488
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apache
      - name: Standard clean web setup with exact 231gi in disposable Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $receipt=Get-Content "$env:RUNNER_TEMP/cp76/out/candidate-receipt.json" -Raw|ConvertFrom-Json
          $pkg='LOCAL-231GI-CLEAN-WEB-QA-DO-NOT-INSTALL.zip'
          $sha='cb0becfba394ae320c389817eb75cf28ae26c09b579f8f3cc64e1a66b98c892a'
          $version='3.0.0-g6.2-workspace.231gi-cc43-qa'
          if($receipt.packages.$pkg -cne $sha -or $receipt.production_authorized -ne $false -or $receipt.local_clean_web_only -ne $true){throw 'INVALID_CANDIDATE_RECEIPT'}
          if((Get-FileHash "$env:RUNNER_TEMP/cp76/out/$pkg" -Algorithm SHA256).Hash.ToLowerInvariant() -cne $sha){throw 'CANDIDATE_ARCHIVE_DRIFT'}
          $s=Get-Content 'qa/factory/checkpoint78-standard-clean-web.ps1' -Raw
          $s=$s.Replace('LOCAL-231GG-CLEAN-WEB-QA-DO-NOT-INSTALL.zip',$pkg).Replace('2c14b241a3cddf5f1d436144691555b11a97ccc31b4d08b2ea8f8d92f04e3aa6',$sha).Replace('3.0.0-g6.2-workspace.231gg-checkpoint76-qa',$version)
          $p=Join-Path $env:RUNNER_TEMP 'native-clean48.ps1'
          Set-Content $p $s -Encoding utf8NoBOM
          & $p
          if($LASTEXITCODE -ne 0){throw 'NATIVE_CLEAN_FAILED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-CC48-NATIVE-CLEAN-WINDOWS-RECEIPT-QA-ONLY
          path: ${{ runner.temp }}/checkpoint78-standard-clean-web-receipt.json
          if-no-files-found: warn
          retention-days: 30
