          assert b['delivery_authorized'] is False and b['production_authorized'] is False
          assert sha(d/'SOKNA-PUBLIC-35JB-CONTROLLED-UPDATE.zip')==b['update_sha256']=='936f665e4641b3ccaef1c78ff37caa2c395cdb3c3723328999b40105f5cdabb8'
