name: SOKNA 49 actual historical and current finance peer compatibility (QA only)
on:
  push:
    branches: [qa/func-pass02-db-20261127]
    paths: [.github/workflows/sokna-cc20-grouped.yml]
permissions:
  contents: read
  actions: read
jobs:
  mixed-peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
      SOKNA_QA_DISPOSABLE: YES
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6983e9d52435a746325f60ace428b8548bcc8fc0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          run-id: 46056788008
          name: SOKNA-CC43-EXACT-FROZEN-CANDIDATES-QA-NOT-INSTALL
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          run-id: 45389831526
          name: SOKNA-C2-CONTROLLED-OPERATOR-UPDATE
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Real signed historical and current finance projection peers
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cc49"; mkdir -p "$W/local" "$W/public" "$W/old/local" "$W/receipts"
          A="$RUNNER_TEMP/candidate/LOCAL-231GI-CLEAN-WEB-QA-DO-NOT-INSTALL.zip"
          B="$RUNNER_TEMP/candidate/PUBLIC-35JA-CLEAN-WEB-QA-DO-NOT-INSTALL.zip"
          O="$RUNNER_TEMP/prior/SOKNA-LOCAL-231GC-UNIVERSAL-UPDATE.zip"
          echo "f864a42fb82124e4f16c9b9437464256ef3b59d79d26518232cf05cbc9393f42  $O" | sha256sum -c -
          echo "fd320cacb1518c1937d3251b8a950a5019cca7267eb60e3f2bfc7b1511f744ca  $B" | sha256sum -c -
          unzip -q "$A" -d "$W/local"
          unzip -q "$B" -d "$W/public"
          export QA_WORK="$W" TMPDIR="$W"
          python - "$W" "$O" "$A" <<'PY'
          import pathlib,sys,zipfile,io,hashlib
          W,old,current=map(pathlib.Path,sys.argv[1:]);H=lambda b:hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(old) as z:
           b=z.read('artifacts/local/web.zip')
          assert H(b)=='3f5860ffbc30fa718b68709d89780ae56d3898fb9cc100157580d98d9ca2b2f9'
          with zipfile.ZipFile(io.BytesIO(b)) as z:z.extractall(W/'old/local')
          assert H(current.read_bytes())=='cb0becfba394ae320c389817eb75cf28ae26c09b579f8f3cc64e1a66b98c892a'
          s=pathlib.Path('qa/cp160/fixture.php').read_text()
          # Use exactly the old installed schema, with the basic synthetic partial-payment seed; omit unrelated current report setup.
          start=s.index('// Independent QA-only rows')
          end=s.index('$iid=(string)',start)
          s=s[:start]+'$reportDay=$core->time()->civilDate();\n'+s[end:]
          s=s.replace('sokna_cp150','sokna_cc49_old')
          (W/'old-fixture.php').write_text(s)
          PY
          php qa/cp148/preflight.php
          php qa/cp160/fixture.php "$W/local" > "$W/receipts/current-fixture.txt"
          php "$W/old-fixture.php" "$W/old/local" > "$W/receipts/old-fixture.txt"
          # Both independent synthetic installations use the same test peer binding for this transition experiment.
          php -r '$old=require $argv[1];$new=require $argv[2];$old["installation"]["id"]=$new["installation"]["id"];$old["public"]=$new["public"];file_put_contents($argv[1],"<?php return ".var_export($old,true).";");' "$W/old/config.php" "$W/config.php"
          php qa/cp160/public-fixture.php "$W/public"
          cat > "$W/peer.php" <<'PHP'
          <?php
          declare(strict_types=1);
          if(PHP_SAPI!=='cli'||getenv('SOKNA_QA_DISPOSABLE')!=='YES'||getenv('QA_DB_PASSWORD')!=='synthetic-cp116-ci-only')exit(2);
          [$s,$mode,$root,$cfgPath,$sequence]=$argv;
          $root=realpath($root);require $root.'/bootstrap.php';
          $cfg=require $cfgPath;
          if(($cfg['db']['host']??'')!=='127.0.0.1'||!in_array($cfg['db']['name']??'',['sokna_cp150','sokna_cc49_old'],true)||($cfg['public']['base_url']??'')!=='http://127.0.0.1:18766/public')exit(2);
          function ck($v,$n){if(!$v)throw new RuntimeException($n);echo "PASS $n\n";}
          $core=\Sokna\Local\Core\Bootstrap::fromArray($cfg);$p=$core->database();
          $versions=$p->query('SELECT version FROM schema_migrations ORDER BY version')->fetchAll(PDO::FETCH_COLUMN);
          $old=str_contains(file_get_contents($root.'/VERSION.txt'),'.231gc-');
          ck(count($versions)===($old?91:93),'actual '.($old?'old 91':'current 93').' migration ledger');
          if($mode==='projection'){
           $model=$core->publicProjectionBuilder()->remoteModelsFor(['operations'])[0];
           $state=$model['payload']['finance_projection'];
           ck($state['status']==='ready','actual financial projection ready');
           ck(($state['remaining_discount_correction_contract']??0)===($old?0:1),'actual code capability '.($old?'old':'new'));
           ck(count($model['payload']['settlement_accounts'])>0,'actual accounts projected');
           $r=$core->publicEdgeSyncClient()->postRaw('/api/v1/local/read-model-v2',['format'=>'sokna-read-model-v2','up_to_sequence'=>(int)$sequence,'model'=>$model],5);
           ck($r['status']===200&&($r['body']['ack_sequence']??0)===(int)$sequence,'signed real Public acknowledgement '.$sequence);
           $h=$core->publicEdgePublisher()->syncHeartbeat(5);ck(($h['success']??false)===true,'real signed heartbeat');
           echo json_encode(['hash'=>$model['source_version'],'finance'=>$state],JSON_THROW_ON_ERROR).PHP_EOL;exit;
          }
          if($mode==='downgrade'){
           ck(!$old,'current installation owns the downgrade decision');
           $catalog=[];foreach(glob(dirname($root).'/old/local/database/migrations/*.sql') as $file)$catalog[basename($file,'.sql')]=hash_file('sha256',$file);
           try{\Sokna\Local\Domain\Update\UpdateMigrationPolicy::assertInstalledLineage($versions,$catalog,$root.'/database/migrations');throw new RuntimeException('unsafe downgrade accepted');}
           catch(\Sokna\Local\Domain\Update\LocalUpdateException $e){ck($e->errorCode==='schema_downgrade_unsupported','actual current ledger rejects incompatible direct rollback');}
           exit;
          }
          exit(2);
          PHP
          php "$W/peer.php" downgrade "$W/local" "$W/config.php" 0 | tee "$W/receipts/downgrade.txt"
          PHP_CLI_SERVER_WORKERS=6 php -S 127.0.0.1:18766 -t "$W/public" "$W/public/index.php" > "$W/receipts/public-http.log" 2>&1 &
          sleep 2
          npm install --prefix "$W/pw" playwright@1.56.1 --ignore-scripts --no-audit --no-fund
          cat > "$W/ui.cjs" <<'JS'
          const {chromium}=require(process.env.QA_WORK+'/pw/node_modules/playwright'),fs=require('fs'),{execFileSync}=require('child_process');
          const W=process.env.QA_WORK,base='http://127.0.0.1:18766/public',f=JSON.parse(fs.readFileSync(W+'/cp144-fixture.json'));
          const sid=Number(f.hall.partial.session);
          function ck(v,n){if(!v)throw Error(n);console.log('PASS '+n)}
          function sync(old,seq){console.log(execFileSync('php',[W+'/peer.php','projection',W+(old?'/old/local':'/local'),W+(old?'/old/config.php':'/config.php'),String(seq)],{encoding:'utf8'}))}
          (async()=>{const b=await chromium.launch({channel:'chrome',headless:true}),c=await b.newContext({viewport:{width:1280,height:900},locale:'fa-IR'}),p=await c.newPage();p.setDefaultTimeout(16000);
          try{
           sync(true,1);
           await p.goto(base+'/staff/login');const h=p.locator('[data-login-selection]');await h.waitFor({state:'attached'});const key='user:'+f.users.find(u=>u.name==='qa-target').id;
           if(await h.inputValue()!==key){await p.locator('.sc-login-flow-change').click();await p.locator('[data-login-account][data-account-key="'+key+'"]').click();await p.locator('.sc-login-stable-picker').waitFor({state:'hidden'});}
           await p.locator('input[name=password]').fill('synthetic-qa-admin-not-real');await Promise.all([p.waitForNavigation(),p.locator('form[data-login-form] button[type=submit]').click()]);
           await p.goto(base+'/staff/hall/');await p.waitForFunction(()=>!!window.SoknaHallTransport);
           async function state(old,seq){
            const res=await p.request.get(base+'/api/staff/read?model=operations');const r=await res.json();ck(res.ok()&&r.payload.finance_projection.status==='ready','real signed projection visible to logged-in browser '+seq);
            ck((r.payload.finance_projection.remaining_discount_correction_contract||0)===(old?0:1),'browser sees actual version capability '+seq);
            const x=await p.evaluate(async sid=>{await window.SoknaHallTransport.request('/api/hall?action=snapshot');const h=window.SoknaHallTransport;return {correct:h.canCorrectDiscount(sid),resolve:h.canResolveCorrection(),abandon:h.canAbandonCorrection(),pending:h.pendingCorrectionForSession(sid)?.request_id||null}},sid);
            ck(x.resolve===!old&&x.abandon===!old,'real browser correction resolution guarded '+seq);return x;
           }
           let x=await state(true,1);ck(!x.correct,'old peer prevents new correction');
           sync(false,2);x=await state(false,2);ck(x.correct,'current peer enables correction');
           // Simulate only the browser's persisted uncertain-request receipt, not any server response.
           const ledger=await p.evaluate(sid=>{const key='sokna:staff-command-ledger:v1:'+((document.body.dataset.appBase||document.body.dataset.basePath||'').replace(/\/$/,'')||'/')+':'+(document.body.dataset.projectionId||'');localStorage.setItem(key,JSON.stringify([{kind:'settlement.discount_correction',session_id:sid,request_id:'qa49-pending-synthetic',keep_until:Number.MAX_SAFE_INTEGER}]));return {key,pending:window.SoknaHallTransport.pendingCorrectionForSession(sid)?.request_id}},sid);
           ck(ledger.pending==='qa49-pending-synthetic','explicit synthetic uncertain receipt installed');
           sync(true,3);x=await state(true,3);ck(!x.correct&&x.pending==='qa49-pending-synthetic','actual old projection retains pending identity');
           let posts=0;const listener=r=>{if(r.method()==='POST'&&r.url().includes('/api/staff/realtime'))posts++};p.on('request',listener);
           const rejected=await p.evaluate(async sid=>{try{await window.SoknaFinanceTransport.post('',{action:'discount_correction',session_id:sid,request_id:'qa49-duplicate-attempt'});return ''}catch(e){return e.code}},sid);
           ck(rejected==='request_pending'&&posts===0,'no duplicate financial POST to real Public');
           sync(false,4);x=await state(false,4);ck(!x.correct&&x.pending==='qa49-pending-synthetic','current peer return retains same request and enables resolution only');
           await p.screenshot({path:W+'/receipts/mixed-peer.png',animations:'disabled'});p.off('request',listener);
           console.log('GROUP PASS actual older/current signed projections and real browser guard');
          }finally{await c.close();await b.close()}})().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node "$W/ui.cjs" | tee "$W/receipts/mixed.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-CC49-REAL-MIXED-PEER-RECEIPTS
          path: ${{ runner.temp }}/cc49/receipts
          retention-days: 30
