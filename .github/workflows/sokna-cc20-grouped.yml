name: SOKNA 47 exact frozen Public dual-route upgrade QA only
on:
  push:
    branches: [qa/func-pass02-db-20261127]
    paths: [.github/workflows/sokna-cc20-grouped.yml]
permissions:
  contents: read
  actions: read
jobs:
  public-dual:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: synthetic-cp116-ci-only
          MARIADB_ROOT_HOST: '%'
        ports: [3306:3306]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      QA_DB_PASSWORD: synthetic-cp116-ci-only
      SOKNA_QA_DISPOSABLE: YES
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 46056788008
          name: SOKNA-CC43-EXACT-FROZEN-CANDIDATES-QA-NOT-INSTALL
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/candidate
      - uses: actions/download-artifact@v4
        with:
          run-id: 45774034628
          name: SOKNA-CP110-EXACT-35IP-COMPONENT-UPDATE-QA
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/prior
      - name: Actual disposable dual route from 35iy; unchanged exact 35ja QA archive
        shell: bash
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/cc47"; mkdir -p "$W/receipts"
          P="$RUNNER_TEMP/candidate/PUBLIC-35JA-UPDATE-QA-DO-NOT-INSTALL.zip"
          C="$RUNNER_TEMP/candidate/PUBLIC-35JA-CLEAN-WEB-QA-DO-NOT-INSTALL.zip"
          python - "$W" "$RUNNER_TEMP/prior/SOKNA-PUBLIC-35IY-35IP-CAFE-QA.zip" "$C" <<'PY'
          import pathlib,zipfile,hashlib,json,sys
          w,prior,clean=map(pathlib.Path,sys.argv[1:]);H=lambda b:hashlib.sha256(b).hexdigest()
          with zipfile.ZipFile(prior) as z:
           p={n[8:]:z.read(n) for n in z.namelist() if n.startswith('payload/') and not n.endswith('/')}
          assert H(''.join(n+'\0'+H(v)+'\n' for n,v in sorted(p.items())).encode())=='c71ab6c235f72afdb9762cc5460a63731770c17086dafa290a21398037fabbe6'
          with zipfile.ZipFile(clean) as z:
           assert H(clean.read_bytes())=='fd320cacb1518c1937d3251b8a950a5019cca7267eb60e3f2bfc7b1511f744ca'
           protected={n:z.read(n) for n in z.namelist() if n=='emergency.php' or n.startswith('src/Emergency/')}
          assert len(protected)==6
          (w/'protected.json').write_text(json.dumps({n:H(v) for n,v in protected.items()}))
          for route in ['routine','emergency']:
           d=w/('public-'+route);d.mkdir()
           for n,v in (p|protected).items():
            f=d/n;f.parent.mkdir(parents=True,exist_ok=True);f.write_bytes(v)
          PY
          cat > "$W/gate.php" <<'PHP'
          <?php
          declare(strict_types=1);
          use Sokna\PublicEdge\Update\RoutinePublicUpdateService as Routine;
          use Sokna\PublicEdge\Update\IndependentEmergencyRoutineBridge as Bridge;
          use Sokna\PublicEdge\Core\Migrations;
          use Sokna\PublicEdge\Health\PublicHealthService;
          if(PHP_SAPI!=='cli'||getenv('GITHUB_ACTIONS')!=='true'||getenv('QA_DB_PASSWORD')!=='synthetic-cp116-ci-only'||getenv('SOKNA_QA_DISPOSABLE')!=='YES')exit(2);
          [$script,$phase,$web,$pkg,$route]=$argv;
          if(!in_array($route,['routine','emergency'],true)||!in_array($phase,['stage','commit'],true)||basename($web)!=='public-'.$route)exit(2);
          function ck($v,$msg){if(!$v)throw new RuntimeException($msg);echo "PASS $msg\n";}
          $version='3.0.0-g3.6-workspace.35ja-cc43-qa';$tree='de0dab93feff00ebfa29dfe72b45466fc362be212483e44f388f673b5b5c878f';
          ck(hash_file('sha256',$pkg)==='3b297bb2561caeb9fd1dcb57d165270d6e4f4ba476d432b2672c6d2162c42077','frozen candidate hash');
          foreach(['src/Shared/IranTime.php','src/Emergency/PublicUpdateException.php','src/Update/RoutinePublicUpdateService.php','src/Core/Migrations.php','src/Core/SafeErrors.php','src/Health/PublicHealthService.php','src/Update/IndependentEmergencyRoutineBridge.php'] as $n)require $web.'/'.$n;
          $storage=$web.'/storage';if(!is_dir($storage))mkdir($storage,0700,true);
          $db=new PDO('mysql:host=127.0.0.1;port=3306;dbname=sokna_ci_47_'.$route.';charset=utf8mb4','root',getenv('QA_DB_PASSWORD'),[PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION]);
          $m=new Migrations($db,$web.'/database/migrations');$h=new PublicHealthService($db,$web,$storage);$r=new Routine($web,$storage,$web.'/resources/update-trust-v1.json',fn()=>$h->status()['status']===200,fn()=>$m->migrate(),null,fn()=>$m->pendingVersions());$b=new Bridge($r,$storage,fn()=>$m->pendingVersions(),fn()=>$h->status()['body']);
          if($phase==='stage'){
           ck(count($m->migrate())===12,'real prior schema');
           $db->exec("INSERT INTO installations(installation_id) VALUES('qa47-preserve')");
           $old=$r->currentVersion();$oldTree=$r->managedTreeDigest();ck($oldTree==='c71ab6c235f72afdb9762cc5460a63731770c17086dafa290a21398037fabbe6','exact 35iy baseline');
           $s=$route==='routine'?$r->stageUploadedDeltaZip($pkg,'qa47',true):$b->stageUploadedZip($pkg,'qa47');
           ck($s['package_sha256']===hash_file('sha256',$pkg)&&$s['version']===$version,'same actual ZIP staged '.$route);
           ck($r->currentVersion()===$old&&$r->managedTreeDigest()===$oldTree,'stage leaves active tree unchanged');
           $a=$route==='routine'?$r->activateStaged('qa47'):$b->activateStaged('qa47');
           ck($a['current_version']===$version&&$r->managedTreeDigest()===$tree&&is_array($a['pending_verification'])&&is_file($r->maintenanceLockPath()),'activated exact tree stays pending');
          }else{
           ck($r->currentVersion()===$version&&$r->managedTreeDigest()===$tree&&$m->pendingVersions()===[],'fresh process target and ledger');
           $s=$route==='routine'?$r->commitActivation('qa47',fn($v)=>$h->status()['body']):$b->commitPending('qa47');
           ck($s['active_version']===$version&&$s['pending_verification']===null&&$s['db_forward_fence']===null&&!is_file($r->maintenanceLockPath()),'fresh process exact commit '.$route);
           ck(count($m->verifiedAppliedVersions())===12&&(int)$db->query("SELECT COUNT(*) FROM installations WHERE installation_id='qa47-preserve'")->fetchColumn()===1,'preserved prior DB row and exact migration ledger');
           $pins=json_decode(file_get_contents(dirname($web).'/protected.json'),true,512,JSON_THROW_ON_ERROR);
           foreach($pins as $n=>$v)ck(hash_file('sha256',$web.'/'.$n)===$v,'unchanged protected '.$n);
           echo "GROUP PASS exact frozen 35ja ".$route."\n";
          }
          PHP
          php -l "$W/gate.php"
          mysql --protocol=TCP -h127.0.0.1 -uroot -p"$QA_DB_PASSWORD" -e 'CREATE DATABASE sokna_ci_47_routine CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE DATABASE sokna_ci_47_emergency CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          for route in routine emergency; do
            php "$W/gate.php" stage "$W/public-$route" "$P" "$route" | tee "$W/receipts/$route-stage.txt"
            php "$W/gate.php" commit "$W/public-$route" "$P" "$route" | tee "$W/receipts/$route-commit.txt"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-CC47-EXACT-PUBLIC-DUAL-ROUTE
          path: ${{ runner.temp }}/cc47/receipts
          retention-days: 30
