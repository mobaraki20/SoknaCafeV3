name: SOKNA checkpoint77 clean Web EXE integrated native QA
on:
  push:
    branches: [qa/checkpoint55-exact-windows-20261126]
    paths: ['.github/workflows/sokna-checkpoint77-clean-web.yml']
permissions:
  contents: read
  actions: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.5'}
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-PREREQUISITES-105-QA2-CANDIDATE-NOT-INSTALL
          run-id: 45710818450
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/helper
      - uses: actions/download-artifact@v4
        with:
          name: SOKNA-APACHE-2471-CANDIDATE-QA-ONLY
          run-id: 45707401488
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/apache
      - name: Acquire and verify all exact dependencies, install candidate on disposable volume
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $dir=Join-Path $env:RUNNER_TEMP 'helper'
          $index=Get-Content "$dir/artifact-index.json" -Raw|ConvertFrom-Json
          $setup=Join-Path $dir $index.file
          if($index.sha256 -ne 'e36a7f5507ca6ff44614d8cef06f057462f80336969bee47b69e33fcf0bd91a3' -or (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $index.sha256){throw 'HELPER_HASH_MISMATCH'}
          $lock=Get-Content "$dir/QA-release-lock.json" -Raw|ConvertFrom-Json
          $cache=Join-Path $env:ProgramData 'SOKNA/PrerequisiteCache'
          New-Item -ItemType Directory -Force $cache|Out-Null
          foreach($a in $lock.artifacts|Where-Object dependency -in @('php','apache','mariadb')){
            $target=Join-Path $cache $a.filename
            if($a.dependency -eq 'apache'){
              Copy-Item (Join-Path "$env:RUNNER_TEMP/apache" $a.filename) $target
            }else{
              $urls=@($a.source_url)+@($a.fallback_urls)
              if($a.dependency -eq 'php'){$urls=@('https://downloads.php.net/~windows/releases/archives/'+$a.filename)+$urls}
              if($a.dependency -eq 'mariadb'){$urls=@($a.fallback_urls)+@($a.source_url)}
              $ok=$false
              foreach($url in $urls){
                Remove-Item $target -ErrorAction SilentlyContinue
                & curl.exe --location --fail --silent --show-error --max-time 90 --output $target $url
                if($LASTEXITCODE -eq 0 -and (Test-Path $target) -and (Get-Item $target).Length -eq $a.size -and (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() -eq $a.sha256){$ok=$true;break}
              }
              if(-not $ok){throw "DEPENDENCY_UNAVAILABLE_$($a.dependency)"}
            }
            if((Get-Item $target).Length -ne $a.size -or (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $a.sha256){throw "DEPENDENCY_HASH_WRONG_$($a.dependency)"}
            Write-Host "VERIFIED $($a.dependency) $($a.version)"
          }
          $vol=Get-CimInstance Win32_LogicalDisk|Where-Object { $_.DriveType -eq 3 -and $_.DeviceID -ne $env:SystemDrive -and $_.FreeSpace -gt 3GB }|Select-Object -First 1
          if(-not $vol){throw 'NO_REAL_NON_SYSTEM_VOLUME'}
          $root=Join-Path ($vol.DeviceID+'\') ("Sokna-Infra-QA-"+$env:GITHUB_RUN_ID)
          $app=Join-Path ($vol.DeviceID+'\') ("Sokna-Helper-QA-"+$env:GITHUB_RUN_ID)
          if((Test-Path $root) -or (Test-Path $app)){throw 'QA_PATH_EXISTS'}
          $p=Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$app+'"')) -Wait -PassThru
          if($p.ExitCode -ne 0){throw 'INSTALL_CANDIDATE_FAILED'}
          "SOKNA_QA_INFRA_ROOT=$root"|Out-File $env:GITHUB_ENV -Append
          "SOKNA_QA_INFRA_EXE=$(Join-Path $app 'SoknaPrerequisitesSetup.exe')"|Out-File $env:GITHUB_ENV -Append
      - name: Build actual native QA Web stage from exact factory Web
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:RUNNER_TEMP base.zip
          curl.exe --fail --location --silent --show-error -H "Authorization: Bearer $env:GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/15069153300/zip" -o $base
          if($LASTEXITCODE -ne 0){throw 'BASE_DOWNLOAD_FAILED'}
          if((Get-FileHash $base -Algorithm SHA256).Hash.ToLowerInvariant() -ne '57589151165e5d73c0b0339623e3ee3b2db9ea7c54ffbac69246c9ff3532da2f'){throw 'BASE_HASH_DRIFT'}
          python qa/checkpoint76/reconstruct.py "$env:RUNNER_TEMP/cp76" $base qa/checkpoint76/transfer.b64
          if($LASTEXITCODE -ne 0){throw 'EXACT_REBUILD_FAILED'}
          $web=Join-Path $env:RUNNER_TEMP 'cp76/out/LOCAL-231GG-CLEAN-WEB-QA-DO-NOT-INSTALL.zip'
          if((Get-FileHash $web -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2c14b241a3cddf5f1d436144691555b11a97ccc31b4d08b2ea8f8d92f04e3aa6'){throw 'WEB_PIN_DRIFT'}
          $iscc=@("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe","$env:ProgramFiles\Inno Setup 6\ISCC.exe")|Where-Object {Test-Path $_ -PathType Leaf}|Select-Object -First 1
          if(!$iscc){choco install innosetup --yes --no-progress; if($LASTEXITCODE -ne 0){throw 'INNO_UNAVAILABLE'}; $iscc="${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"}
          if(!(Test-Path $iscc)){throw 'INNO_UNAVAILABLE'}
          $out=Join-Path $env:RUNNER_TEMP 'clean-web-exe'
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          $stage=(Resolve-Path qa/factory/checkpoint77-clean-web-stage.ps1).Path
          & $iscc "/DWebZip=$web" "/DStageScript=$stage" "/DOutDir=$out" qa/factory/checkpoint77-clean-web.iss
          if($LASTEXITCODE -ne 0){throw 'INNO_BUILD_FAILED'}
          $exe=Join-Path $out 'SOKNA-231GG-CLEAN-WEB-STAGE-QA-ONLY.exe'
          if(!(Test-Path $exe)){throw 'EXE_MISSING'}
          "SOKNA_QA_WEB_EXE=$exe"|Out-File $env:GITHUB_ENV -Append
      - name: Fresh helper and actual EXE plus HTTP Browser Setup
        shell: pwsh
        run: |
          pip install pywinauto
          if($LASTEXITCODE -ne 0){throw 'UI_AUTOMATION_UNAVAILABLE'}
          python qa/factory/checkpoint77-clean-web-e2e.py "$env:SOKNA_QA_INFRA_EXE" "$env:SOKNA_QA_INFRA_ROOT" "$env:RUNNER_TEMP/infra-evidence" "$env:SOKNA_QA_WEB_EXE"
          if($LASTEXITCODE -ne 0){throw 'NATIVE_INFRA_QA_FAILED'}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SOKNA-CHECKPOINT77-CLEAN-WEB-EXE-RECEIPT-QA-ONLY
          path: ${{ runner.temp }}/infra-evidence/
          if-no-files-found: warn
          retention-days: 14
