name: Working cross-version Local slot contract
on:
  push:
    branches: [work/windows-services-cross-version-slot-contract]
  pull_request:
    branches: [work/windows-services-1.1.12-recovery-contract]
  workflow_dispatch:
jobs:
  windows-core-contract:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Maintenance Core with warnings as errors
        run: dotnet build windows/maintenance/src/Sokna.Maintenance.Core/Sokna.Maintenance.Core.csproj --configuration Release --nologo
      - name: Compile signed Maintenance Supervisor HTTP API with warnings as errors
        run: dotnet build windows/maintenance/src/Sokna.Maintenance.Supervisor/Sokna.Maintenance.Supervisor.csproj --configuration Release --nologo
      - name: Compile Update Engine and signed Release Set fixture
        run: |
          dotnet build windows/maintenance/src/Sokna.Maintenance.UpdateEngine/Sokna.Maintenance.UpdateEngine.csproj --configuration Release --nologo
          dotnet build windows/maintenance/tests/Sokna.Maintenance.P2Fixture/Sokna.Maintenance.P2Fixture.csproj --configuration Release --nologo
          dotnet build windows/maintenance/tests/Sokna.Maintenance.MachineLeaseProbe/Sokna.Maintenance.MachineLeaseProbe.csproj --configuration Release --nologo
      - name: Verify suspended Windows Job child is killed on parent crash
        shell: pwsh
        run: |
          & ./windows/maintenance/tests/windows-job-process-death.ps1 `
            -ProbeDll 'windows/maintenance/tests/Sokna.Maintenance.MachineLeaseProbe/bin/Release/net8.0-windows/Sokna.Maintenance.MachineLeaseProbe.dll'
      - name: Qualify isolated inactive Local sibling filecopy, target binding and unchanged active pointer
        shell: pwsh
        run: |
          & dotnet 'windows/maintenance/tests/Sokna.Maintenance.MachineLeaseProbe/bin/Release/net8.0-windows/Sokna.Maintenance.MachineLeaseProbe.dll' `
            inactive-sibling-writer (Join-Path $env:RUNNER_TEMP ('sokna-sibling-writer-'+[guid]::NewGuid().ToString('N')))
          if ($LASTEXITCODE -ne 0) { throw 'Inactive sibling writer regression failed' }
      - name: Qualify legacy-Home standalone read-only collector (no new Supervisor API)
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $fixture=Join-Path $env:RUNNER_TEMP ('SoknaReadOnlyHome-'+[guid]::NewGuid().ToString('N'))
          $web=Join-Path $fixture 'Web'
          $resources=Join-Path $web 'resources'
          New-Item -ItemType Directory -Force -Path $resources | Out-Null
          Set-Content -LiteralPath (Join-Path $web 'VERSION.txt') -Value '3.0.0-test-version' -Encoding UTF8
          [ordered]@{format='sokna-local-managed-files-v1';files=@('VERSION.txt','resources/local-managed-files-v1.json')} |
            ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $resources 'local-managed-files-v1.json') -Encoding UTF8
          $oldSha=(Get-FileHash -LiteralPath (Join-Path $web 'VERSION.txt') -Algorithm SHA256).Hash
          $result=@(& ./windows/maintenance/tests/home-host-readonly-preflight.ps1 -PackageRoot $fixture)
          $json=($result -join [Environment]::NewLine)|ConvertFrom-Json
          if ($json.format -ne 'sokna-home-host-readonly-evidence-v1' -or
              -not $json.no_mutation_performed -or $json.upgrade_permitted -or
              $json.activation_allowed -or $json.real_host_uat_complete -or
              $json.new_supervisor_api_invoked -or $json.active_managed_tree_qualified -or
              $json.web.version -ne '3.0.0-test-version') {
            throw 'Legacy Home read-only collector fabricated readiness or misread baseline'
          }
          $newSha=(Get-FileHash -LiteralPath (Join-Path $web 'VERSION.txt') -Algorithm SHA256).Hash
          if($oldSha -ne $newSha){throw 'Read-only collector changed Local version evidence'}
          $blocked=$false
          try { & ./windows/maintenance/tests/home-host-readonly-preflight.ps1 -PackageRoot $fixture -LocalUrl 'https://example.org/login.php' | Out-Null }
          catch { $blocked=$true }
          if(-not $blocked){throw 'Read-only collector accepted remote URL'}
          Write-Host 'HOME_LEGACY_READONLY_PREFLIGHT_FIXTURE_PASS'
      - name: Verify independent machine lease, direct Engine collision and OS crash cleanup
        shell: pwsh
        run: |
          & ./windows/maintenance/tests/machine-mutation-lease-windows.ps1 `
            -ProbeDll 'windows/maintenance/tests/Sokna.Maintenance.MachineLeaseProbe/bin/Release/net8.0-windows/Sokna.Maintenance.MachineLeaseProbe.dll' `
            -EngineDll 'windows/maintenance/src/Sokna.Maintenance.UpdateEngine/bin/Release/net8.0-windows/SoknaMaintenanceUpdateEngine.dll'
      - name: Verify exact signed delegated Engine permit and fail-closed independent execution
        shell: pwsh
        run: |
          & ./windows/maintenance/tests/engine-delegation-windows.ps1 `
            -ProbeDll 'windows/maintenance/tests/Sokna.Maintenance.MachineLeaseProbe/bin/Release/net8.0-windows/Sokna.Maintenance.MachineLeaseProbe.dll' `
            -EngineDll 'windows/maintenance/src/Sokna.Maintenance.UpdateEngine/bin/Release/net8.0-windows/SoknaMaintenanceUpdateEngine.dll'
      - name: Prove signed package verify-only never creates stage or changes sequence
        shell: pwsh
        run: |
          & ./windows/maintenance/tests/p2c-read-only-preflight.ps1 `
            -EngineDll 'windows/maintenance/src/Sokna.Maintenance.UpdateEngine/bin/Release/net8.0-windows/SoknaMaintenanceUpdateEngine.dll' `
            -FixtureDll 'windows/maintenance/tests/Sokna.Maintenance.P2Fixture/bin/Release/net8.0-windows/Sokna.Maintenance.P2Fixture.dll'
      - name: Test signed durable Supervisor preflight and restart/tamper no-mutation boundary
        shell: pwsh
        run: |
          & ./windows/maintenance/tests/p2d-signed-supervisor-preflight.ps1 `
            -SupervisorDll 'windows/maintenance/src/Sokna.Maintenance.Supervisor/bin/Release/net8.0-windows/SoknaMaintenanceSupervisor.dll' `
            -FixtureDll 'windows/maintenance/tests/Sokna.Maintenance.P2Fixture/bin/Release/net8.0-windows/Sokna.Maintenance.P2Fixture.dll' `
            -LeaseProbeDll 'windows/maintenance/tests/Sokna.Maintenance.MachineLeaseProbe/bin/Release/net8.0-windows/Sokna.Maintenance.MachineLeaseProbe.dll'
      - name: Test signed Supervisor HTTP capabilities and replay rejection
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'SoknaF1Http'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $dll = Join-Path (Get-Location) 'windows/maintenance/src/Sokna.Maintenance.Supervisor/bin/Release/net8.0-windows/SoknaMaintenanceSupervisor.dll'
          $port = 18573
          $p = Start-Process dotnet -ArgumentList @($dll,'--data-root',$root,'--port',$port) -PassThru
          try {
            $uri = "http://127.0.0.1:$port/v1/updates/capabilities"
            $ready = $false
            for($i=0; $i -lt 40; $i++) {
              if($p.HasExited) { throw 'Supervisor exited prematurely' }
              try {
                $unauth = Invoke-WebRequest $uri -SkipHttpErrorCheck -TimeoutSec 1
                if($unauth.StatusCode -eq 401) { $ready = $true; break }
              } catch {}
              Start-Sleep -Milliseconds 250
            }
            if(!$ready) { throw 'Supervisor did not reject unsigned request' }
            $key = [Convert]::FromBase64String((Get-Content (Join-Path $root 'secrets/web-adapter.key') -Raw).Trim())
            if($key.Length -ne 32) { throw 'Invalid test HMAC key' }
            $ts = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
            $nonce = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(16)).ToLowerInvariant()
            $digest = 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'
            $canonical = ('GET','/v1/updates/capabilities','1.0',$ts,$nonce,$digest) -join [char]10
            $mac = [Security.Cryptography.HMACSHA256]::new($key)
            try { $sig = [Convert]::ToHexString($mac.ComputeHash([Text.Encoding]::UTF8.GetBytes($canonical))).ToLowerInvariant() } finally { $mac.Dispose() }
            $headers = @{'X-Sokna-Maintenance-Protocol'='1.0';'X-Sokna-Timestamp'=$ts;'X-Sokna-Nonce'=$nonce;'X-Sokna-Key-Id'='web-adapter';'X-Sokna-Body-SHA256'=$digest;'X-Sokna-Signature'=$sig}
            $ok = Invoke-WebRequest $uri -Headers $headers -SkipHttpErrorCheck -TimeoutSec 4
            $obj = $ok.Content | ConvertFrom-Json -AsHashtable
            if($ok.StatusCode -ne 200 -or $obj.ok -ne $true -or $obj.data.panel_update_ready -ne $false -or $obj.data.blocking_code -ne 'FOUNDATION_UPDATE_REQUIRED') { throw 'False-ready or invalid signed capabilities response' }
            $replay = Invoke-WebRequest $uri -Headers $headers -SkipHttpErrorCheck -TimeoutSec 4
            $obj2 = $replay.Content | ConvertFrom-Json -AsHashtable
            if($replay.StatusCode -ne 409 -or $obj2.code -ne 'AUTH_REPLAY') { throw 'HMAC replay not rejected' }
            # A corrupt durable operation must not become "idle", 404, or an unclassified 500.
            [IO.File]::WriteAllText((Join-Path $root 'operations/op-corrupt-http.json'), '{}')
            $idempotencyKey = 'http-corrupt-index'
            $idempotencyHash = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes($idempotencyKey))).ToLowerInvariant()
            [IO.File]::WriteAllText((Join-Path $root "operations/idem-$idempotencyHash.txt"), 'corrupt-http')
            foreach($resource in @('/v1/operations/active', '/v1/operations/recent', '/v1/operations/corrupt-http', "/v1/operations/by-idempotency/$idempotencyKey")) {
              $now = [DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ')
              $freshNonce = [Convert]::ToHexString([Security.Cryptography.RandomNumberGenerator]::GetBytes(16)).ToLowerInvariant()
              $canonicalGet = ('GET', $resource, '1.0', $now, $freshNonce, $digest) -join [char]10
              $checkMac = [Security.Cryptography.HMACSHA256]::new($key)
              try { $checkSig = [Convert]::ToHexString($checkMac.ComputeHash([Text.Encoding]::UTF8.GetBytes($canonicalGet))).ToLowerInvariant() } finally { $checkMac.Dispose() }
              $freshHeaders = $headers.Clone()
              $freshHeaders['X-Sokna-Timestamp'] = $now
              $freshHeaders['X-Sokna-Nonce'] = $freshNonce
              $freshHeaders['X-Sokna-Signature'] = $checkSig
              $checkResponse = Invoke-WebRequest ("http://127.0.0.1:$port" + $resource) -Headers $freshHeaders -SkipHttpErrorCheck -TimeoutSec 4
              $checkResult = $checkResponse.Content | ConvertFrom-Json -AsHashtable
              if($checkResponse.StatusCode -ne 503 -or $checkResult.code -ne 'OPERATION_EVIDENCE_UNAVAILABLE') { throw "Invalid corrupt-evidence response for $resource" }
            }
            Write-Output 'SUPERVISOR_SIGNED_HTTP_AUTH_AND_CORRUPT_EVIDENCE_PASS'
          } finally {
            if($p -and !$p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }
      - name: Build and run cross-version contract harness
        run: dotnet run --project windows/maintenance/tests/Sokna.CrossVersion.Contract/Sokna.CrossVersion.Contract.csproj --configuration Release

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Verify Windows physical junction resolver on real Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "SoknaJunctionParity"
          $slot = Join-Path $root "Web.release.231ai-b0e252b62b80"
          $web = Join-Path $root "Web"
          New-Item -ItemType Directory -Path $slot -Force | Out-Null
          if (Test-Path $web) { Remove-Item $web -Force }
          cmd.exe /c "mklink /J `"$web`" `"$slot`""
          if ($LASTEXITCODE -ne 0) { throw 'mklink /J failed' }
          $native = [System.IO.Directory]::ResolveLinkTarget($web, $true)
          Write-Output "DotNet junction target: $($native.FullName)"
          if (-not [string]::Equals([System.IO.Path]::GetFullPath($native.FullName), [System.IO.Path]::GetFullPath($slot), [StringComparison]::OrdinalIgnoreCase)) { throw 'DotNet junction resolution mismatch' }
          go run ./windows/maintenance/tests/GoJunctionProbe/main.go "$web" "$slot"
