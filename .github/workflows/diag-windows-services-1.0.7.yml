name: Diagnose Windows Services 1.0.7
on:
  push:
    branches:
      - diag/windows-services-1.0.7
permissions:
  contents: read
jobs:
  qualify:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build release
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path .).Path
          $out=Join-Path $root 'release\out-windows'
          $iscc=@(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Leaf) } | Select-Object -First 1
          if(-not $iscc){throw 'ISCC missing'}
          & release/build-windows-release.ps1 -RepoRoot $root -OutputRoot $out -IsccExe $iscc
      - name: Verify package and executable versions
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $version=(Get-Content packaging/windows/WINDOWS_SERVICES_VERSION.txt -Raw).Trim()
          if($version-ne'1.0.7'){throw "Unexpected package version: $version"}
          foreach($exe in @('release\out-windows\SoknaSetupUi.exe','release\out-windows\SoknaSetupHost.exe')){
            $pv=([Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path $exe))).ProductVersion.Split('+')[0]
            Write-Host "$exe => $pv"
            if($pv-ne$version){throw "ProductVersion mismatch: $exe => $pv expected $version"}
          }
      - name: Seed abandoned mutex and install on D data root
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=(Resolve-Path .).Path
          $shell=Join-Path $root 'release\out-windows\shell'
          $install='C:\Program Files\SOKNA Windows Services CI'
          $data='D:\SOKNA-CI\Data'
          $legacyDefault=Join-Path $env:ProgramData 'SOKNA\print-worker'
          New-Item -ItemType Directory -Path $legacyDefault -Force|Out-Null
          Set-Content -LiteralPath (Join-Path $legacyDefault 'legacy-sentinel.txt') -Value 'must-not-be-used'

          $mutexName='Global\SoknaPrintAgentV6Service'
          $keeper=New-Object System.Threading.Mutex($false,$mutexName)
          $encoded=[Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes('$m=[Threading.Mutex]::OpenExisting("Global\SoknaPrintAgentV6Service");$null=$m.WaitOne();[Environment]::Exit(0)'))
          $child=Start-Process -FilePath "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -ArgumentList '-NoProfile','-NonInteractive','-EncodedCommand',$encoded -Wait -PassThru
          if($child.ExitCode-ne0){throw "Failed to seed abandoned mutex: $($child.ExitCode)"}

          try {
            & packaging/windows/scripts/setup-windows-services.ps1 -Mode Install -ShellRoot $shell -InstallRoot $install -DataRoot $data -PairingFile '' -StartWhenPaired 0
            $print=Get-Service SoknaPrintWorker -ErrorAction Stop
            Write-Host "Print=$($print.Status)"
            if($print.Status-ne'Running'){throw "Print Worker not running: $($print.Status)"}
            $print.Dispose()
            $actual=[string](Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\Sokna\Local\PrintWorker' -Name DataRoot).DataRoot
            $expected=Join-Path $data 'print-worker'
            Write-Host "PrintDataRoot=$actual"
            if([IO.Path]::GetFullPath($actual)-cne[IO.Path]::GetFullPath($expected)){throw 'Print DataRoot mismatch'}
            $events=Get-WinEvent -FilterHashtable @{LogName='Application';ProviderName='Sokna.PrintAgent.Service';StartTime=(Get-Date).AddMinutes(-3)} -ErrorAction SilentlyContinue |
              Select-Object -First 20 TimeCreated,Id,LevelDisplayName,Message
            $events | Format-List
            if($events.Message -match 'AbandonedMutexException' -and $events.Message -match 'BackgroundService failed'){throw 'Abandoned mutex still killed Print Agent'}
          } finally {
            try { & packaging/windows/scripts/setup-windows-services.ps1 -Mode Uninstall -ShellRoot $shell -InstallRoot $install -DataRoot $data -PairingFile '' -StartWhenPaired 0 } catch { Write-Warning $_ }
            if($keeper){$keeper.Dispose()}
            Remove-Item -LiteralPath $install -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath 'D:\SOKNA-CI' -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $legacyDefault -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload tested installer
        uses: actions/upload-artifact@v4
        with:
          name: sokna-windows-services-1.0.7-tested-${{ github.sha }}
          path: |
            release/out-windows/SOKNA-Windows-Services-Setup-1.0.7.exe
            release/out-windows/artifact-index.json
          if-no-files-found: error
