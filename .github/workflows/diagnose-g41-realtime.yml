name: diagnose g41 realtime 500

on:
  push:
    branches:
      - transfer/v3-final-menu-041db67-helper
    paths:
      - .github/workflows/diagnose-g41-realtime.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: sokna_m2
          MARIADB_USER: sokna
          MARIADB_PASSWORD: sokna
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      SOKNA_TEST_DB_HOST: 127.0.0.1
      SOKNA_TEST_DB_PORT: 3306
      SOKNA_TEST_DB_NAME: sokna_m2
      SOKNA_TEST_DB_USER: sokna
      SOKNA_TEST_DB_PASS: sokna
      SOKNA_TEST_DB_ROOT_USER: root
      SOKNA_TEST_DB_ROOT_PASS: root
    steps:
      - uses: actions/checkout@v4
      - name: reconstruct source
        shell: bash
        run: |
          set -euo pipefail
          bundle="${GITHUB_WORKSPACE}/.transfer/soknacafev3-git-041db67ba5fa.bundle"
          dst="${RUNNER_TEMP}/sokna-source"
          rm -rf "$dst"; mkdir -p "$dst"; cd "$dst"
          git init
          git config core.autocrlf false
          git fetch "$bundle" refs/heads/transfer-final-menu-041db67:refs/heads/audited
          git checkout audited
      - name: expose ci-only public exception
        shell: bash
        run: |
          cd "${RUNNER_TEMP}/sokna-source"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('apps/public/src/Core/SafeErrors.php')
          s=p.read_text(encoding='utf-8')
          old="return self::response(500, 'public_internal_error', $correlationId);"
          new="fwrite(STDERR, 'CI_PUBLIC_EXCEPTION '.get_class($error).' '.$error->getMessage().PHP_EOL); return self::response(500, 'public_internal_error', $correlationId);"
          if old not in s: raise SystemExit('safe error marker missing')
          p.write_text(s.replace(old,new,1),encoding='utf-8',newline='\n')
          PY
      - name: install php mysql
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y php-mysql php-zip
      - name: run g41 only
        shell: bash
        run: |
          cd "${RUNNER_TEMP}/sokna-source"
          php tests/g4-cross-component-parity-selftest.php
