name: R84 sequential open item closure
on:
  push:
    branches: [work/r84-open-items-20261101]
    paths: [release/r84/**, .github/workflows/r84-open-items.yml]
defaults:
  run:
    shell: bash
permissions:
  contents: write
jobs:
  real-db:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: r84-test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_PASSWORD: r84-test
      DB_PORT: '3306'
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP and DB client
        run: sudo apt-get update -qq && sudo apt-get install -y php-cli php-mysql php-sqlite3 php-zip mariadb-client
      - name: Obtain exact published R83 baselines
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release/r84/baselines
          gh release download local-public-r83-communication-uat-20261101 --repo "$GITHUB_REPOSITORY" --dir release/r84/baselines -p SOKNA-R83-LOCAL-R81-TO-R83-DELTA-HOME-UAT.zip -p SOKNA-R83-PUBLIC-R81-TO-R83-ROUTINE-DELTA-HOME-UAT.zip
          python3 release/r84/prepare.py
          mkdir -p release/r84/build/qa
      - name: Create isolated databases
        run: mysql -h127.0.0.1 -uroot -pr84-test -e 'CREATE DATABASE r84_time; CREATE DATABASE r83_local; CREATE DATABASE r83_public; CREATE DATABASE r84_guest; CREATE DATABASE r84_guest_red;'
      - name: Reproduce and fix runtime time contract
        run: |
          if php release/r84/tests/runtime-time.php release/r84/build/baseline > release/r84/build/qa/time-before.json; then echo 'Baseline unexpectedly passed'; exit 1; fi
          php release/r84/tests/runtime-time.php release/r84/build/source | tee release/r84/build/qa/time-after.json
      - name: Reproduce and fix guest list causal reads
        run: |
          if GUEST_DB=r84_guest_red php release/r84/tests/guest-list.php release/r84/build/baseline > release/r84/build/qa/guest-list-before.json; then echo 'Baseline unexpectedly passed'; exit 1; fi
          php release/r84/tests/guest-list.php release/r84/build/source | tee release/r84/build/qa/guest-list-after.json
          if node release/r84/tests/guest-list.js release/r84/build/baseline > release/r84/build/qa/guest-list-js-before.json; then exit 1; fi
          node release/r84/tests/guest-list.js release/r84/build/source > release/r84/build/qa/guest-list-js-after.json
      - name: Existing MariaDB and guest regressions
        run: |
          php release/r83/tests/pure.php release/r84/build/source > release/r84/build/qa/pure.json
          php release/r83/tests/encoding.php release/r84/build/source > release/r84/build/qa/encoding.json
          node release/r83/tests/guest.js release/r84/build/source > release/r84/build/qa/guest.json
          php release/r83/tests/local.php release/r84/build/source > release/r84/build/qa/local.json
          php release/r83/tests/public.php release/r84/build/source > release/r84/build/qa/public.json
      - name: Syntax of complete candidate
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json
          files=[p for p in pathlib.Path('release/r84/build/source').rglob('*') if p.suffix in ('.php','.js')]
          for p in files:subprocess.run(['php','-l',str(p)] if p.suffix=='.php' else ['node','--check',str(p)],check=True,capture_output=True)
          pathlib.Path('release/r84/build/qa/syntax.json').write_text(json.dumps({'passed':len(files),'failed':0}))
          PY
      - name: Build exact deltas and native receiver stage
        run: |
          python3 release/r84/package.py
          php release/r84/tests/package.php release/r84/build/source release/r84/build/dist > release/r84/build/qa/package.json
          python3 release/r84/finalize.py
      - name: Publish verified independent Local and Public deltas
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create local-public-r84-causal-read-uat-20261101 release/r84/build/dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "SOKNA R84 — Runtime time and Guest causal reads" --notes-file release/r84/build/dist/REPORT-FA.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r84-qa
          path: release/r84/build/qa
